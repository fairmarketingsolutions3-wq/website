.cc-grid.fit thead tr.mh th{height:24px;font-size:9.5px;letter-spacing:.06em;}
.cc-grid.fit thead tr.wh th{height:18px;font-size:9px;}
.cc-grid.fit thead th.cc-corner{left:0;z-index:5;background:var(--deep-green);color:var(--field-cream);text-align:left;
  padding:0 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;vertical-align:middle;}
.cc-grid.fit tbody td.stk{white-space:normal;}
.cc-grid.fit .cc-crop-cell .cn{white-space:nowrap;}
.cc-grid.fit tr.cc-unit th{position:static;}
.cc-grid.fit tfoot th.stk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc-grid.fit tfoot tr.tot th .per{font-family:'Inter',sans-serif;font-weight:400;font-size:10px;letter-spacing:0;opacity:.8;margin-left:4px;}
.cc-grid.fit tfoot td{overflow:hidden;white-space:nowrap;font-size:10.5px;}
.cc-grid.fit tfoot tr.bych td.per-note{text-align:left;padding:0 8px;font-size:10.5px;color:var(--muted);letter-spacing:.02em;}
/* Narrow weeks: the lines between them go, the months' stay. */
.cc-grid.dense td.wk{border-left:none;}
.cc-grid.dense td.wk.mstart{border-left:1px solid #DDDCD0;}
.cc-grid.dense td.wk.ystart{border-left:2px solid rgba(232,167,52,.7);}
.cc-grid.dense td.wk:hover{box-shadow:inset 0 0 0 1px rgba(35,40,31,.6);}
.cc-grid.tiny td.wk.mstart{border-left:none;}
.cc-grid.tiny td.wk.ystart{border-left:2px solid rgba(232,167,52,.7);}
.cc-grid.dense thead tr.mh th{border-left-color:rgba(255,255,255,.12);}

/* How much to show at once. */
.cc-span{display:inline-flex;background:#F4F3EA;border-radius:99px;padding:3px;gap:2px;}
.cc-span button{border:none;background:none;cursor:pointer;border-radius:99px;padding:5px 11px;font-size:12px;
  font-family:'Inter',sans-serif;color:var(--deep-green);white-space:nowrap;}
.cc-span button:hover{background:#fff;}
.cc-span button.on{background:var(--deep-green);color:#fff;font-weight:600;}

/* The association's table, fitted the same way. */
table.ass-table.fit{width:100%;table-layout:fixed;}
.ass-table.fit th, .ass-table.fit td{overflow:hidden;text-overflow:ellipsis;padding:6px 5px;}
.ass-table.fit .stk{position:static;}

/* ---- Planned from the crop guide ---- */
#ed-guide{margin-top:4px;}
.gb{border:1px solid #DCE5CC;background:#F7FAF1;border-radius:12px;padding:12px 14px;}
.gb-head{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink);line-height:1.45;margin-bottom:10px;}
.gb-head svg{flex:none;color:var(--leaf-green);margin-top:1px;}
.gb-head strong{color:var(--deep-green);}
.gb-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.gb-fields input{margin:0;}
.gb-fields .opt{font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;font-size:11px;}
.gb-hint{margin:10px 0 0;}
.gb-plan{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:5px;}
.gb-plan li{display:grid;grid-template-columns:14px minmax(120px,170px) 1fr;gap:8px;align-items:center;font-size:12.5px;}
.gb-plan .sw{width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.gb-plan .gp-n{font-weight:600;color:var(--deep-green);}
.gb-plan .gp-w{color:var(--ink);}
.gb-total{margin:10px 0 0;padding-top:9px;border-top:1px dashed #D3DDC1;font-size:13px;color:var(--ink);}
.gb-total strong{color:var(--leaf-green);font-size:14px;}
.gb-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.gb-chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer;
  color:var(--deep-green);font-family:'Inter',sans-serif;}
.gb-chip:hover{border-color:var(--deep-green);}
.gb-none{margin:2px 0 0;}
.gb-alt{border:none;background:none;padding:0;margin-left:6px;color:var(--leaf-green);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;}
.gb-src{margin:8px 0 0;font-size:11.5px;line-height:1.5;}
.gb-fields:has(> div:nth-child(4)){grid-template-columns:repeat(4,minmax(0,1fr));}
html[data-view="mobile"] .gb-fields{grid-template-columns:1fr;}
html[data-view="mobile"] .gb-plan li{grid-template-columns:14px 1fr;}
html[data-view="mobile"] .gb-plan .gp-w{grid-column:2;font-size:12px;color:var(--muted);}

/* The chooser's week, and the arrows that move it. */
.cc-pop .pp-week{display:flex;align-items:center;gap:6px;margin:-2px 0 10px;padding:6px;background:#F4F3EA;border-radius:10px;}
.cc-pop .pp-week span{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--deep-green);line-height:1.3;}
.cc-pop .pp-week em{font-style:normal;font-weight:400;color:var(--muted);}
.cc-pop .pp-week button{border:none;background:#fff;border-radius:8px;width:34px;height:30px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--deep-green);flex:none;box-shadow:0 0 0 1px var(--line);}
.cc-pop .pp-week button:disabled{opacity:.35;cursor:default;}
.cc-grid td.wk.pp-target{box-shadow:inset 0 0 0 2px var(--harvest-orange), 0 0 0 2px var(--harvest-orange);position:relative;z-index:1;}

/* ============================================================
   The journey — seed to harvest, across every screen
   Textures are painted once and never move; what moves is a transform or
   an opacity on a single element. Everything here is listed again at the
   end, still, for a reader who has asked for less motion.
   ============================================================ */

/* ---- Grain: the whole page on fibrous paper, like a field ledger ---- */
body::before{
  content:''; position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.42;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .17  0 0 0 0 .2  0 0 0 0 .13  0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
/* The masthead woven, like sacking. */
.topbar{
  background-image:
    repeating-linear-gradient(0deg, rgba(239,237,226,.035) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 4px);
}
/* The day's journey along the bottom of the masthead: a horizon, and the
   sun where it is now. */
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:2px; z-index:0; pointer-events:none;
  background:linear-gradient(90deg, transparent 0, rgba(232,167,52,.15) calc(var(--sun,.5) * 100% - 22%),
    var(--harvest-orange) calc(var(--sun,.5) * 100%), rgba(232,167,52,.15) calc(var(--sun,.5) * 100% + 22%), transparent 100%);
}
.topbar::before{
  content:''; position:absolute; bottom:-5px; left:calc(var(--sun,.5) * 100% - 6px); width:12px; height:12px; z-index:0;
  border-radius:50%; background:radial-gradient(circle, #FFE6B0 0 30%, var(--harvest-orange) 55%, rgba(232,167,52,0) 72%);
  animation:sunGlow 4s var(--ease-in-out) infinite alternate; pointer-events:none;
}
@keyframes sunGlow{ from{ transform:scale(.85); opacity:.75; } to{ transform:scale(1.25); opacity:1; } }
html[data-daypart="night"] .topbar::before{ background:radial-gradient(circle, #F4F2E6 0 28%, rgba(239,237,226,.5) 50%, transparent 72%); }

/* ---- The sky follows the clock ---- */
html[data-daypart="dawn"]{ --canopy-1:rgba(126,155,63,.34); --canopy-3:rgba(232,167,52,.40); }
html[data-daypart="dusk"]{ --canopy-2:rgba(64,94,53,.40); --canopy-3:rgba(232,167,52,.44); }
html[data-daypart="night"]{ --canopy-1:rgba(47,122,130,.30); --canopy-2:rgba(44,68,35,.46); --canopy-3:rgba(232,167,52,.12); }

/* ---- The front door: the season as a path ---- */
.jpath{margin:6px 0 26px;max-width:440px;color:var(--field-cream);}
.jpath > svg{width:100%;height:auto;display:block;overflow:visible;}
.jp-ground{fill:none;stroke:rgba(239,237,226,.18);stroke-width:7;stroke-linecap:round;}
.jp-trail{fill:none;stroke:var(--harvest-orange);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2 5;
  animation:trailMarch 1.6s linear infinite, trailIn 2.2s var(--ease-out) both;}
@keyframes trailMarch{ to{ stroke-dashoffset:-7; } }
@keyframes trailIn{ from{ opacity:0; } to{ opacity:1; } }
.jp-stop{animation:stopIn .7s var(--ease-spring) both;animation-delay:calc(.35s + var(--i) * .28s);transform-box:fill-box;}
@keyframes stopIn{ from{ opacity:0; } to{ opacity:1; } }
.jp-dot{fill:#2C4423;stroke:rgba(239,237,226,.55);stroke-width:1.4;}
.jp-ico{color:var(--harvest-orange);}
.jp-halo{fill:rgba(232,167,52,.22);opacity:0;transform-box:fill-box;transform-origin:center;
  animation:haloPulse 11s var(--ease-in-out) infinite;animation-delay:calc(var(--i) * 2.2s + 1s);}
@keyframes haloPulse{ 0%,100%{ opacity:0; transform:scale(.6); } 6%{ opacity:1; transform:scale(1.25); } 16%{ opacity:0; transform:scale(1.6); } }
.jp-stop text{fill:rgba(239,237,226,.82);font-family:'Poppins',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
.jp-walker circle{fill:#FFE6B0;}
.jp-walker .jp-walker-glow{fill:rgba(232,167,52,.28);}
html[data-view="mobile"] .jpath{margin:4px 0 0;max-width:360px;}

/* Pollen and husks drifting up through the light. */
.pollen{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.pollen i{position:absolute;left:var(--x);bottom:-12px;width:calc(6px * var(--s));height:calc(6px * var(--s));border-radius:60% 40% 55% 45%;
  background:rgba(239,237,226,.5);box-shadow:0 0 8px rgba(232,167,52,.35);
  animation:drift var(--d) linear infinite;animation-delay:var(--delay);}
.pollen i:nth-child(3n){background:rgba(232,167,52,.55);}
.pollen i:nth-child(4n){border-radius:50% 0 50% 0;background:rgba(126,155,63,.6);}
@keyframes drift{
  0%  { transform:translate3d(0,0,0) rotate(0); opacity:0; }
  10% { opacity:1; }
  50% { transform:translate3d(18px,-50vh,0) rotate(160deg); }
  90% { opacity:.9; }
  100%{ transform:translate3d(-12px,-105vh,0) rotate(320deg); opacity:0; }
}

/* ---- Every page arrives along the path ---- */
/* …once. The same page drawn again stays where it is. */
.content.settled .card, .content.settled .metric, .content.settled .section-label, .content.settled .section-label::before,
.content.settled > h1.page-title, .content.settled > h1.page-title::after,
.content.settled .grid-table tbody tr, .content.settled .sj li, .content.settled .sj::before{animation:none !important;}
.content.settled .section-label::before{width:18px;margin-right:9px;}
.content.is-swapping > h1.page-title{animation:titleIn .8s var(--ease-out) both;}
@keyframes titleIn{ from{ clip-path:inset(0 100% 0 0); transform:translateY(6px); } to{ clip-path:inset(0 0 0 0); transform:none; } }
.content > h1.page-title::after{
  content:''; display:block; height:3px; width:58px; margin-top:7px; border-radius:3px;
  background:linear-gradient(90deg, var(--harvest-orange), var(--leaf-green) 70%, transparent);
  transform-origin:left; animation:furrow 1s var(--ease-out) .25s both;
}
@keyframes furrow{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }

/* The section you are in grows a leaf. */
.tabbtn.active::after{
  content:''; position:absolute; left:2px; top:4px; width:9px; height:9px; pointer-events:none;
  background:var(--leaf-green); border-radius:0 80% 0 80%; transform-origin:0 100%;
  animation:leafSprout .7s var(--ease-spring) .2s both;
}
@keyframes leafSprout{ from{ transform:scale(0) rotate(-50deg); } to{ transform:scale(1) rotate(0); } }

/* An empty field waits, swaying. */
.empty-state .es-mark svg{transform-origin:50% 100%;animation:sway 4.5s var(--ease-in-out) infinite alternate;}
@keyframes sway{ from{ transform:rotate(-7deg); } to{ transform:rotate(7deg); } }

/* ---- The calendar: stages carry the texture of what is happening ---- */
.cc-field{position:relative;}
.cc-grid:not(.dense) td.wk.s-L{background-image:repeating-linear-gradient(135deg, rgba(27,53,80,.16) 0 1.5px, transparent 1.5px 6px);}
.cc-grid:not(.dense) td.wk.s-S{background-image:radial-gradient(circle at 30% 30%, rgba(74,69,0,.30) 1.1px, transparent 1.8px),
  radial-gradient(circle at 75% 72%, rgba(74,69,0,.24) 1px, transparent 1.7px);background-size:9px 9px;}
.cc-grid:not(.dense) td.wk.s-T{background-image:linear-gradient(0deg, rgba(255,255,255,.22) 0 2px, transparent 2px);background-size:100% 7px;}
.cc-grid:not(.dense) td.wk.s-V{background-image:repeating-linear-gradient(60deg, rgba(255,255,255,.18) 0 1px, transparent 1px 7px),
  repeating-linear-gradient(-60deg, rgba(255,255,255,.12) 0 1px, transparent 1px 7px);}
.cc-grid:not(.dense) td.wk.s-F{background-image:radial-gradient(circle, rgba(255,255,255,.34) 1.3px, transparent 2px);background-size:7px 7px;}
.cc-grid:not(.dense) td.wk.s-H{background-image:linear-gradient(180deg, rgba(255,255,255,.24), transparent 55%),
  repeating-linear-gradient(90deg, rgba(0,0,0,.09) 0 1px, transparent 1px 5px);}
.cc-grid:not(.dense) td.wk.s-R{background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 2px, transparent 2px 6px);}

/* This week, down the whole field. */
.cc-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg, var(--harvest-orange), rgba(232,167,52,.35) 40%, rgba(232,167,52,.6));
  box-shadow:0 0 10px rgba(232,167,52,.55);animation:todayGlow 2.6s var(--ease-in-out) infinite alternate;}
@keyframes todayGlow{ from{ opacity:.45; } to{ opacity:1; } }

/* The planting pass: a strip of tilled soil drawn back across the field,
   a seed drill riding its edge. One element, however big the farm. */
.cc-sow, .cc-grow{position:absolute;z-index:4;pointer-events:none;bottom:0;transform-origin:100% 50%;
  background:
    repeating-linear-gradient(90deg, rgba(168,92,63,.10) 0 2px, transparent 2px 9px),
    linear-gradient(90deg, #E9E3CF, #F2EEDF);
  animation:tillBack 1.15s var(--ease-in-out) .1s both;}
.cc-grow{bottom:auto;animation-duration:1.6s;animation-delay:.25s;}
@keyframes tillBack{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
.cc-drill{position:absolute;left:-14px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;background:var(--tipfa-green);
  box-shadow:0 0 0 4px rgba(126,155,63,.28), 0 6px 14px -4px rgba(35,40,31,.5);
  animation:drillRide 1.15s var(--ease-in-out) .1s both;}
.cc-sow .cc-drill{top:26px;}
.cc-grow .cc-drill{animation-duration:1.6s;animation-delay:.25s;background:var(--leaf-green);}
/* The cover shrinks toward its right edge; its left edge — where the drill
   rides — therefore travels the whole width. Same timing, same easing. */
@keyframes drillRide{ from{ transform:translateX(0); } to{ transform:translateX(var(--w)) scale(.6); opacity:.0; } }
.cc-sow .cc-drill, .cc-grow .cc-drill{transform-origin:50% 50%;}
tr.just-planted td.stk{animation:plantedGlow 2s var(--ease-out);}
@keyframes plantedGlow{ 0%,30%{ background:#EEF4E2; } 100%{ background:#fff; } }

/* A week just coloured lights up, then settles. */
.cc-grid td.wk.just{animation:cellPop .6s var(--ease-out);}
@keyframes cellPop{ from{ box-shadow:inset 0 0 0 2px rgba(255,255,255,.95), 0 0 10px 2px rgba(232,167,52,.55); filter:brightness(1.25) saturate(1.2); }
  to{ box-shadow:inset 0 0 0 0 rgba(255,255,255,0); filter:none; } }
.cc-grid tfoot td.bump{animation:bump .7s var(--ease-out);}
@keyframes bump{ from{ color:var(--harvest-orange); text-shadow:0 0 8px rgba(232,167,52,.6); } to{ text-shadow:none; } }

/* ---- A plan, drawn as a ribbon from sowing to harvest ---- */
.jr{margin:14px 0 4px;}
.jr-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;}
.jr-ends span{display:inline-flex;align-items:center;gap:5px;}
.jr-ends svg{color:var(--tipfa-green);}
.jr-track{position:relative;display:flex;gap:2px;height:16px;border-radius:99px;padding:2px;background:#E7E5D6;
  box-shadow:inset 0 1px 2px rgba(35,40,31,.12);}
.jr-seg{display:block;min-width:4px;height:100%;border-radius:3px;transform-origin:0 50%;
  animation:segGrow .5s var(--ease-out) both;animation-delay:calc(var(--i) * .16s);}
.jr-seg:first-child{border-radius:99px 3px 3px 99px;} .jr-seg:nth-last-child(2){border-radius:3px 99px 99px 3px;}
@keyframes segGrow{ from{ transform:scaleX(0); opacity:0; } to{ transform:scaleX(1); opacity:1; } }
.jr-seg.s-L{background-image:repeating-linear-gradient(135deg, rgba(27,53,80,.18) 0 1.5px, transparent 1.5px 5px);}
.jr-seg.s-S{background-image:radial-gradient(circle, rgba(74,69,0,.32) 1px, transparent 1.6px);background-size:6px 6px;}
.jr-seg.s-V{background-image:repeating-linear-gradient(60deg, rgba(255,255,255,.22) 0 1px, transparent 1px 6px);}
.jr-seg.s-F{background-image:radial-gradient(circle, rgba(255,255,255,.4) 1px, transparent 1.6px);background-size:6px 6px;}
.jr-seg.s-H{background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px);}
.jr-walker{position:absolute;top:50%;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;background:var(--tipfa-green);
  box-shadow:0 0 0 3px #fff, 0 4px 10px -2px rgba(35,40,31,.45);
  animation:walk 2.4s var(--ease-in-out) .3s both;}
@keyframes walk{ from{ left:0; } to{ left:100%; } }
.jr.still .jr-seg, .jr.still .jr-walker{animation:none;}
.jr.still .jr-walker{left:100%;}

/* ---- A seed germinating ---- */
.germ{width:96px;height:96px;flex:none;margin:0 auto 6px;}
.germ svg{width:100%;height:100%;overflow:visible;}
.g-soil{fill:url(#g-soil-grad);}
.germ .g-soil-top{fill:none;stroke:#8C6A4C;stroke-width:1.4;opacity:.5;}
.g-specks circle{fill:#8C6A4C;opacity:.6;}
.g-seed{fill:#C9A227;stroke:#8A6412;stroke-width:1.2;animation:seedSwell 3.6s var(--ease-in-out) infinite;transform-box:fill-box;transform-origin:center;}
@keyframes seedSwell{ 0%,100%{ transform:scale(1); } 40%{ transform:scale(1.12,1.04); } }
.g-root{fill:none;stroke:#F2EEDF;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:rootGrow 1.6s var(--ease-out) .2s forwards;}
@keyframes rootGrow{ to{ stroke-dashoffset:0; } }
.g-stem{fill:none;stroke:var(--leaf-green);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:rootGrow 1.3s var(--ease-out) 1s forwards;}
.g-leaf{fill:var(--leaf-green);transform-box:fill-box;transform:scale(0);animation:leafOpen .9s var(--ease-spring) 1.9s forwards;}
.g-leaf.l{transform-origin:100% 100%;} .g-leaf.r{transform-origin:0 100%;fill:var(--tipfa-green);}
@keyframes leafOpen{ to{ transform:scale(1); } }
/* Grown: the seedling sways in the air. */
.g-shoot{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.8s var(--ease-in-out) 2.8s infinite alternate;}
/* The loader starts over, again and again. */
.germ.loop .g-root{animation:rootLoop 3.4s var(--ease-out) infinite;}
.germ.loop .g-stem{animation:stemLoop 3.4s var(--ease-out) infinite;}
.germ.loop .g-leaf{animation:leafLoop 3.4s var(--ease-spring) infinite;}
.germ.loop .g-shoot{animation:none;}
@keyframes rootLoop{ 0%{ stroke-dashoffset:1; opacity:1; } 40%,88%{ stroke-dashoffset:0; opacity:1; } 100%{ stroke-dashoffset:0; opacity:0; } }
@keyframes stemLoop{ 0%,22%{ stroke-dashoffset:1; opacity:1; } 58%,88%{ stroke-dashoffset:0; opacity:1; } 100%{ stroke-dashoffset:0; opacity:0; } }
@keyframes leafLoop{ 0%,48%{ transform:scale(0); opacity:1; } 66%,88%{ transform:scale(1); opacity:1; } 100%{ transform:scale(1); opacity:0; } }
/* Resting: paused or turned down — the seedling stands still. */
.germ.resting .g-root, .germ.resting .g-stem{animation:none;stroke-dashoffset:0;}
.germ.resting .g-leaf{animation:none;transform:scale(1);}
.germ.resting .g-seed, .germ.resting .g-shoot{animation:none;}
.germ.resting .g-shoot{filter:grayscale(.6);opacity:.75;}
.restoring-card .germ{width:110px;height:110px;}

/* ---- Where an account stands: the first steps of the journey ---- */
.sc-top{display:flex;gap:18px;align-items:center;margin-bottom:6px;}
.sc-top .germ{margin:0;}
.sj{list-style:none;margin:6px 0 18px;padding:0;position:relative;}
.sj::before{content:'';position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:linear-gradient(180deg,var(--leaf-green),#E3E1D3 70%);
  transform-origin:top;animation:furrow .9s var(--ease-out) .2s both;}
.sj li{display:flex;gap:12px;align-items:flex-start;padding:7px 0;position:relative;animation:riseIn .5s var(--ease-out) both;}
.sj li:nth-child(2){animation-delay:.18s;} .sj li:nth-child(3){animation-delay:.36s;}
.sj-dot{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#EEEDE3;border:2px solid #DAD8C8;color:#fff;position:relative;z-index:1;}
.sj-dot svg{width:15px;height:15px;}
.sj li.done .sj-dot{background:var(--leaf-green);border-color:var(--leaf-green);}
.sj li.now .sj-dot{background:var(--harvest-orange);border-color:var(--harvest-orange);animation:softPulse 1.8s infinite;}
.sj li.halt .sj-dot{background:#C9C2AE;border-color:#C9C2AE;}
.sj li.stop .sj-dot{background:var(--red);border-color:var(--red);}
.sj-t{font-family:'Poppins',sans-serif;font-weight:600;font-size:13.5px;color:var(--deep-green);padding-top:4px;}
.sj-t small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:12px;color:var(--muted);margin-top:1px;}

/* ---- A decision stamped on a waiting card ---- */
.wait-card{position:relative;overflow:hidden;}
.wait-card.stamp-ok::after, .wait-card.stamp-no::after{
  position:absolute;right:14px;top:16px;padding:5px 12px;border:3px solid;border-radius:8px;
  font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
  animation:stamp .45s var(--ease-spring) both;}
.wait-card.stamp-ok::after{content:'Approved';color:var(--tipfa-green);border-color:var(--tipfa-green);background:rgba(238,244,226,.92);}
.wait-card.stamp-no::after{content:'Turned down';color:var(--red);border-color:var(--red);background:rgba(251,238,234,.92);}
@keyframes stamp{ from{ transform:scale(2.2) rotate(-14deg); opacity:0; } 60%{ transform:scale(.92) rotate(-8deg); opacity:1; } to{ transform:scale(1) rotate(-8deg); } }

/* ---- The association's harvest, as baskets filling ---- */
.ass-table td.v.bar{position:relative;}
.ass-table td.v.bar::before{content:'';position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;
  background:linear-gradient(90deg, var(--leaf-green), var(--harvest-orange));transform-origin:0 50%;
  transform:scaleX(var(--f));animation:barFill 1.1s var(--ease-out) .3s both;opacity:.85;}
@keyframes barFill{ from{ transform:scaleX(0); } }

/* ---- Leaves flying ---- */
.leafburst{position:fixed;z-index:200;width:0;height:0;pointer-events:none;}
.leafburst i{position:absolute;left:-5px;top:-5px;width:11px;height:11px;background:var(--c);border-radius:0 80% 0 80%;
  animation:fly var(--t) cubic-bezier(.15,.75,.35,1) both;}
@keyframes fly{
  0%  { transform:translate(0,0) rotate(0) scale(.4); opacity:1; }
  70% { opacity:1; }
  100%{ transform:translate(var(--tx),calc(var(--ty) + 60px)) rotate(var(--r)) scale(1); opacity:0; }
}

/* ---- Still, for a reader who has asked for less motion ---- */
@media (prefers-reduced-motion: reduce){
  .topbar::before, .jp-trail, .jp-stop, .jp-halo, .pollen, .content.is-swapping > h1.page-title, .content > h1.page-title::after,
  .tabbtn.active::after, .empty-state .es-mark svg, .cc-today, .cc-grid td.wk.just, .cc-grid tfoot td.bump, .jr-seg, .jr-walker,
  .g-seed, .g-root, .g-stem, .g-leaf, .sj::before, .sj li, .sj li.now .sj-dot, .wait-card::after, .ass-table td.v.bar::before{animation:none !important;}
  .pollen{display:none;}
  .jr-walker{left:100%;}
  .g-root, .g-stem{stroke-dashoffset:0;}
  .g-leaf{transform:scale(1);}
  .g-shoot{animation:none !important;}
}
</style>
</head>
<body>
<div class="canopy" aria-hidden="true"></div>
<div class="app">

  <div class="topbar">
    <div class="arcfield" aria-hidden="true">
      <div class="arc arc--green-3"></div>
    </div>
    <div class="brandblock">
      <!-- Symbol only, reversed on Tipfa Green. The primary lockup's descriptor
           falls below its 150px minimum at this height, so the identity steps
           down a variation rather than shrinking (guidelines p08, p09, p10).
           "TIPFA" beside it is running text in Poppins — never the wordmark. -->
      <img class="brandlogo" src="assets/brand/tipfa-symbol-reversed.png"
           alt="TIPFA — Tanzania Indoor &amp; Professional Farmers Association">
      <div class="brandrule"></div>
      <div class="brandtext">
        <div class="bt-name">TIPFA <span>Crop Calendar</span></div>
        <div class="tagline">Farming together. Harvesting excellence.</div>
      </div>
    </div>
    <div id="topbarRight"></div>
  </div>

  <div id="loginScreen"></div>

  <div id="appScreen" style="display:none;">
    <div id="stalebar"></div>
    <header class="appbar" id="appbar"></header>
    <div class="subbar" id="subbar"></div>
    <div class="layout">
      <div class="sidebar" id="sidebar"></div>
      <div class="content" id="content"></div>
    </div>
    <div class="navdrawer" id="navdrawer" hidden></div>
  </div>

</div>

<script>
/* ============================================================
   TIPFA Crop Calendar

   A copy of the TIPFA Association Platform with every feature taken
   out but one: the crop calendar. The shell is the platform's — its
   front door, its two appearances, its farm and Secretariat sign-in,
   its habit of working from this browser first and sharing through
   Firebase only when a project is set up. What is gone is everything
   else: profiles, harvest plans, orders, the store, batches, advisory,
   reports, governance.

   The calendar itself is rebuilt on the association's master template
   (FAIR FARM CROP CALENDAR MASTER TEMPLATE): one row per planting,
   placed in a greenhouse and block, with a crop, an area and a note,
   and a timeline of months split into four weeks. Each week is
   coloured by the stage the planting is in, harvest weeks carry their
   kilograms, and the kilograms add up by month and by crop exactly as
   the template's own formulas do.

   Every farm is held in the same shape whether it has one greenhouse
   or twenty, so the Secretariat can add them together. What changes
   from farm to farm is only how much of that shape is shown.
   ============================================================ */

/* ---- The template's key -------------------------------------------
   Names and colours are the template's own (rows 33–39 of the master
   sheet), so a calendar exported from here and one filled in by hand
   read the same. `ink` is the text colour that stays legible on each. */
const STAGES = [
  {code:'L', name:'Land preparation',        color:'#B8CCE4', ink:'#1B3550'},
  {code:'S', name:'Sowing / nursery',        color:'#FFFF00', ink:'#4A4500'},
  {code:'T', name:'Transplanting',           color:'#00B050', ink:'#FFFFFF'},
  {code:'V', name:'Vegetative growth',       color:'#00B0F0', ink:'#FFFFFF'},
  {code:'F', name:'Flowering / fruit set',   color:'#7030A0', ink:'#FFFFFF'},
  {code:'H', name:'Harvest',                 color:'#FF0000', ink:'#FFFFFF', kg:true},
  {code:'R', name:'Rotation crop / legumes', color:'#76933C', ink:'#FFFFFF'},
];
const STAGE = Object.fromEntries(STAGES.map(s=> [s.code, s]));

/* A farm is divided into growing units — mostly greenhouses, but an
   association that takes structured open-field growers has fields too —
   and a unit may be divided again into blocks. Two levels, because the
   template has two location columns: GREENHOUSE / BLOCK and SECTION. */
const UNIT_TYPES = ['Greenhouse', 'Screenhouse', 'Open field', 'Nursery'];

// The crops TIPFA farms grow, offered as suggestions. A farm can type any other.
const COMMON_CROPS = ['Tomato', 'Cherry tomato', 'Capsicum', 'Habanero pepper', 'Cucumber',
  'Broccoli', 'Cauliflower', 'Lettuce', 'Herbs', 'Avocado', 'Onion', 'Cabbage', 'Beans'];

const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MONTHS = ['January','February','March','April','May','June','July','August','September',
  'October','November','December'];

/* The template runs three years, January 2026 to December 2028, as 36
   months of four weeks. The window here is the same length; only where
   it starts can move, and the records underneath are kept by date, so
   moving it never loses a week. */
const WINDOW_MONTHS = 36;
const DEFAULT_START_YEAR = 2026;

// The platform's own definition: days 1–7 are week 1, 8–14 week 2,
// 15–21 week 3, and the 22nd to the month's end week 4.
function weekOfMonth(d){ return Math.min(4, Math.floor((d.getDate()-1)/7) + 1); }
function weekKey(y, m, w){ return `${y}-${String(m).padStart(2,'0')}-${w}`; }
function parseWeekKey(k){
  const [y, m, w] = k.split('-').map(Number);
  return {y, m, w};
}
function todayKey(){ const d = new Date(); return weekKey(d.getFullYear(), d.getMonth()+1, weekOfMonth(d)); }

// The 36 months the calendar is looking at, each with its four week keys.
function windowMonths(startYear){
  const out = [];
  for(let i = 0; i < WINDOW_MONTHS; i++){
    const y = startYear + Math.floor(i / 12), m = (i % 12) + 1;
    out.push({y, m, keys:[1,2,3,4].map(w=> weekKey(y, m, w))});
  }
  return out;
}

/* A week cell is stored as a short string so a farm with a hundred
   plantings stays far below the 1 MiB a Firestore document can hold:
   the stage code, and for a harvest week a colon and its kilograms.
      'T'      transplanting
      'H:120'  harvest, 120 kg
      'H'      harvest, kilograms not yet entered */
function readCell(v){
  if(!v) return null;
  const [code, kg] = String(v).split(':');
  if(!STAGE[code]) return null;
  return {s:code, kg: kg !== undefined && kg !== '' ? Number(kg) : null};
}
function writeCell(s, kg){
  if(!s || !STAGE[s]) return '';
  if(s === 'H' && kg !== null && kg !== undefined && kg !== '' && !isNaN(Number(kg)) && Number(kg) >= 0)
    return 'H:' + Number(kg);
  return s;
}

/* ---- Small things the whole file uses ------------------------------ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return Number(n).toLocaleString('en-GB', {maximumFractionDigits:1}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(prefix){ return prefix + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function norm(s){ return (s||'').toString().trim().toLowerCase(); }
// The same crop typed twice with different capitals or spaces is one crop.
function cropKey(s){ return norm(s).replace(/\s+/g,' '); }

/* ---- Passwords held in this browser ---------------------------------
   With no database behind it, the account lives in localStorage. The
   password itself is never stored: a salted SHA-256 of it is. crypto.subtle
   only exists on secure origins, so a short pure-script SHA-256 stands in
   wherever the page is opened some other way. */
async function sha256Hex(text){
  const bytes = new TextEncoder().encode(text);
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(buf)).map(b=> b.toString(16).padStart(2,'0')).join('');
  }
  return sha256Fallback(bytes);
}
function sha256Fallback(bytes){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,
    0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,
    0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,
    0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,
    0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,
    0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,
    0xbef9a3f7,0xc67178f2];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, padded = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  padded.set(bytes); padded[l] = 0x80;
  const view = new DataView(padded.buffer);
  view.setUint32(padded.length - 4, l * 8);
  const W = new Array(64), rotr = (x, n)=> (x >>> n) | (x << (32 - n));
  for(let off = 0; off < padded.length; off += 64){
    for(let t = 0; t < 16; t++) W[t] = view.getUint32(off + t*4);
    for(let t = 16; t < 64; t++){
      const s0 = rotr(W[t-15],7) ^ rotr(W[t-15],18) ^ (W[t-15] >>> 3);
      const s1 = rotr(W[t-2],17) ^ rotr(W[t-2],19) ^ (W[t-2] >>> 10);
      W[t] = (W[t-16] + s0 + W[t-7] + s1) | 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let t = 0; t < 64; t++){
      const t1 = (h + (rotr(e,6) ^ rotr(e,11) ^ rotr(e,25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) | 0;
      const t2 = ((rotr(a,2) ^ rotr(a,13) ^ rotr(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = H.map((v, i)=> (v + [a,b,c,d,e,f,g,h][i]) | 0);
  }
  return H.map(v=> (v >>> 0).toString(16).padStart(8,'0')).join('');
}
async function hashPassword(password, salt){ return sha256Hex(salt + '\u0000' + password); }

/* ============================================================
   The farm record
   One shape for every farm. A farm with one greenhouse has one unit and
   no blocks, and never sees either; a farm with several greenhouses, or
   one large one cut into blocks, has the same two lists with more in them.
   ============================================================ */
function blankUnit(n, type){
  type = type || 'Greenhouse';
  return {id: uid('u'), name: `${type} ${n}`, type, blocks: []};
}
/* Every account begins as pending. An administrator approves it, rejects it,
   or later suspends it; until it is approved a farm can see where it stands
   but cannot plan. */
const STATUSES = ['pending', 'approved', 'rejected', 'suspended'];
function blankFarm(vals){
  return {
    name: vals.name || '', contact: vals.contact || '', phone: vals.phone || '',
    email: vals.email || '', location: vals.location || '', registered: todayStr(),
    status: 'pending',
    units: [blankUnit(1)],
    rows: [],
    startYear: DEFAULT_START_YEAR,
    updatedAt: new Date().toISOString(),
  };
}
/* Anything a stored record predates is filled in, so an older save — or a
   document written by hand in the console — still opens. */
function normaliseFarm(f){
  if(!f || typeof f !== 'object') return f;
  if(!STATUSES.includes(f.status)) f.status = 'pending';
  if(!Array.isArray(f.units) || !f.units.length) f.units = [blankUnit(1)];
  f.units.forEach((u, i)=>{
    if(!u.id) u.id = uid('u');
    if(!UNIT_TYPES.includes(u.type)) u.type = 'Greenhouse';
    if(!u.name) u.name = `${u.type} ${i+1}`;
    if(!Array.isArray(u.blocks)) u.blocks = [];
    u.blocks.forEach((b, j)=>{ if(!b.id) b.id = uid('b'); if(!b.name) b.name = `Block ${j+1}`; });
  });
  if(!Array.isArray(f.rows)) f.rows = [];
  const unitIds = new Set(f.units.map(u=> u.id));
  f.rows.forEach(r=>{
    if(!r.id) r.id = uid('r');
    if(!unitIds.has(r.unit)) r.unit = f.units[0].id;
    const u = f.units.find(x=> x.id === r.unit);
    if(r.block && !u.blocks.some(b=> b.id === r.block)) r.block = '';
    if(!r.block) r.block = '';
    if(!r.cells || typeof r.cells !== 'object') r.cells = {};
    r.crop = r.crop || ''; r.notes = r.notes || '';
    r.area = Number(r.area) || 0;
  });
  if(!f.startYear) f.startYear = DEFAULT_START_YEAR;
  return f;
}

/* ============================================================
   Storage
   Everything is kept in this browser first, under its own key so a browser
   that also runs the full platform never mixes the two. With a Firebase
   project configured, farms and administrators live in the database and
   this holds nothing of theirs.
   ============================================================ */
const STORE_KEY = 'tipfa.cropcal.v1';
const SESSION_KEY = 'tipfa.cropcal.session.v1';

let FARMS = {};        // id -> farm record
let ACCOUNTS = {};     // lower-cased email or phone -> {id, role, name, salt, hash, status, owner}
let OPERATORS = {};    // id -> {name, email, since, status, statusBy, statusAt}   (the database's)
let OWNER_ID = null;   // the administrator who owns the system
let storeReady = false;

function saveLocal(){
  if(!storeReady) return;
  try{
    // Farms that live in the database are not copied here; Firestore keeps its
    // own offline copy of those.
    const local = {};
    Object.keys(FARMS).forEach(id=>{ if(!isCloudFarm(id)) local[id] = FARMS[id]; });
    localStorage.setItem(STORE_KEY, JSON.stringify({farms: local, accounts: ACCOUNTS}));
  }catch(e){ /* storage full or blocked — the session still works */ }
}
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(d && typeof d === 'object'){
      FARMS = d.farms && typeof d.farms === 'object' ? d.farms : {};
      ACCOUNTS = d.accounts && typeof d.accounts === 'object' ? d.accounts : {};
      Object.values(FARMS).forEach(normaliseFarm);
      Object.values(ACCOUNTS).forEach(a=>{ if(a.role === 'operator' && !STATUSES.includes(a.status)) a.status = a.owner ? 'approved' : 'pending'; });
    }
  }catch(e){ /* unreadable store — start empty rather than fail to load */ }
  finally{ storeReady = true; }
}
window.addEventListener('beforeunload', ()=>{ saveLocal(); flushCloud(); });

/* The administrators, the same shape whichever side they live on. On this
   device they are accounts (keyed twice when a phone and an email both sign
   in, so they are folded back to one per id); in the database, documents. */
function operatorList(){
  if(cloudOn()) return Object.keys(OPERATORS).map(id=> Object.assign({id, owner: id === OWNER_ID}, OPERATORS[id]));
  const seen = {};
  Object.values(ACCOUNTS).forEach(a=>{ if(a.role === 'operator' && !seen[a.id]) seen[a.id] = {id:a.id, name:a.name, email:a.email||'',
    since:a.since||'', status:a.status, statusBy:a.statusBy||'', statusAt:a.statusAt||'', owner:!!a.owner}; });
  return Object.values(seen);
}
function operatorName(id){
  const o = operatorList().find(x=> x.id === id);
  return o ? o.name : '';
}

/* ============================================================
   Cloud connection
   As on the platform: with no Firebase project set, the page works entirely
   in this browser. Once a project is set it is the system — accounts,
   approval and calendars all live there, and if it cannot be reached the
   page says so rather than quietly making accounts nobody else can see.

   The crop calendar never touches the platform's own collections. Its farms
   are in calendarFarms, not farms.
   ============================================================ */
const COL = { farms:'calendarFarms', operators:'calendarOperators', settings:'calendarSettings' };
const CLOUD = { status:'connecting', detail:'', app:null, db:null, auth:null, fs:null, authApi:null, ready:false };
const CLOUD_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const CLOUD_STATE = { uid:null, role:null, email:null, pushTimer:null, pendingId:null, cloudIds:new Set(), unsubs:[] };
const CLOUD_CONFIGURED = !!(window.TIPFA_CC_FIREBASE_CONFIG && window.TIPFA_CC_FIREBASE_CONFIG.projectId);

function cloudOn(){ return CLOUD.ready && CLOUD.db && CLOUD.auth; }
function isCloudFarm(id){ return CLOUD_STATE.cloudIds.has(id); }

function cloudStatusText(){
  switch(CLOUD.status){
    case 'ready': return 'Connected — calendars are shared with every device';
    case 'connecting': return 'Connecting…';
    case 'unconfigured': return 'No database set up — calendars stay on this device';
    case 'offline': return 'The system cannot be reached right now';
    default: return 'Unavailable';
  }
}
function setCloudStatus(status, detail){
  CLOUD.status = status; CLOUD.detail = detail || ''; CLOUD.ready = status === 'ready';
  document.querySelectorAll('.cloud-badge:not(.build)').forEach(el=> el.outerHTML = cloudBadge(true));
}
const BUILD = (document.querySelector('meta[name="tipfa-build"]') || {}).content || 'v0';

function cloudBadge(onlyStatus){
  const cls = CLOUD.status === 'ready' ? 'ok' : (CLOUD.status === 'connecting' ? 'wait' : 'off');
  const label = CLOUD.status === 'ready' ? 'Connected' : CLOUD.status === 'connecting' ? 'Connecting'
              : CLOUD.status === 'unconfigured' ? 'On this device only' : 'Offline';
  const status = `<span class="cloud-badge ${cls}" title="${esc(CLOUD.detail || cloudStatusText())}"><span class="cloud-dot"></span>${label}</span>`;
  return onlyStatus ? status
    : status + `<span class="cloud-badge build" title="The version of the calendar this device has loaded. Reload the page if it is behind.">${esc(BUILD)}</span>`;
}

async function initCloud(){
  const cfg = window.TIPFA_CC_FIREBASE_CONFIG;
  if(!CLOUD_CONFIGURED){
    setCloudStatus('unconfigured', 'No Firebase project is configured for the crop calendar.');
    return;
  }
  setCloudStatus('connecting');
  try{
    const [{ initializeApp, getApps }, firestore, auth] = await Promise.all([
      import(CLOUD_SDK + 'firebase-app.js'),
      import(CLOUD_SDK + 'firebase-firestore.js'),
      import(CLOUD_SDK + 'firebase-auth.js')
    ]);
    if(!CLOUD.app){
      CLOUD.app = getApps().find(a=> a.name === 'tipfa-crop-calendar') || initializeApp(cfg, 'tipfa-crop-calendar');
      CLOUD.auth = auth.getAuth(CLOUD.app);
      CLOUD.fs = firestore; CLOUD.authApi = auth;
      // Pointing at a local emulator, for testing, is a setting in the config file.
      if(cfg.emulator){
        CLOUD.db = firestore.getFirestore(CLOUD.app);
        firestore.connectFirestoreEmulator(CLOUD.db, cfg.emulator.host, cfg.emulator.firestorePort);
        auth.connectAuthEmulator(CLOUD.auth, `http://${cfg.emulator.host}:${cfg.emulator.authPort}`, {disableWarnings:true});
      } else {
        // Keeps a farm's edits through a dropped connection and sends them when it returns.
        CLOUD.db = firestore.initializeFirestore(CLOUD.app,
          {localCache: firestore.persistentLocalCache({tabManager: firestore.persistentMultipleTabManager()})});
      }
    }
    setCloudStatus('ready', `Connected to ${cfg.projectId}.`);
  }catch(e){
    setCloudStatus('offline', 'Could not reach the system: ' + ((e && e.message) || 'unknown error'));
  }
}

/* A button that appears to do nothing is the worst failure to diagnose,
   especially on a phone with no console. */
function showFatal(msg){
  let bar = document.getElementById('fatal-bar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'fatal-bar'; bar.className = 'fatal-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `<strong>Something went wrong.</strong> ${esc(String(msg).slice(0,300))}
    <button onclick="this.parentNode.remove()">Dismiss</button>`;
}
window.addEventListener('error', e=> showFatal((e.error && e.error.message) || e.message || 'unknown error'));
window.addEventListener('unhandledrejection', e=>{
  const r = e.reason;
  showFatal((r && (r.code ? r.code + ' — ' : '') + (r.message || r)) || 'unknown error');
});
function withTimeout(promise, ms, what){
  return Promise.race([promise, new Promise((_, reject)=> setTimeout(()=>
    reject(new Error(`${what} timed out after ${ms/1000} seconds — the connection may have dropped.`)), ms))]);
}

// A new farm's document: the record, waiting to be approved.
function farmCreateDoc(f){
  return JSON.parse(JSON.stringify({
    name:f.name||'', contact:f.contact||'', phone:f.phone||'', email:f.email||'',
    location:f.location||'', registered:f.registered||todayStr(), status:'pending',
    units:f.units, rows:f.rows, startYear:f.startYear||DEFAULT_START_YEAR,
    updatedAt:new Date().toISOString()
  }));
}
// What an approved farm sends when it changes its calendar. Its status, email
// and registration date are never in it — those are not the farm's to change.
const FARM_OWN_FIELDS = ['name', 'contact', 'phone', 'location', 'units', 'rows', 'startYear', 'updatedAt'];
function farmOwnDoc(f){
  const out = {};
  FARM_OWN_FIELDS.forEach(k=> out[k] = f[k] === undefined ? '' : f[k]);
  out.updatedAt = new Date().toISOString();
  return JSON.parse(JSON.stringify(out));
}

/* On a project shared with the platform, a farm's email may already have an
   account — its platform one. Accounts belong to the project, not the page,
   so the same email and password sign that account in and the calendar is
   added to it, rather than the farm being told its own address is taken. */
async function createOrAdopt(email, password){
  const { createUserWithEmailAndPassword, signInWithEmailAndPassword } = CLOUD.authApi;
  try{ return {cred: await createUserWithEmailAndPassword(CLOUD.auth, email, password), fresh:true}; }
  catch(e){
    if(!String((e && e.code) || '').includes('email-already-in-use')) throw e;
    try{ return {cred: await signInWithEmailAndPassword(CLOUD.auth, email, password), fresh:false}; }
    catch(_){ const err = new Error('adopt'); err.code = 'adopt-wrong-password'; throw err; }
  }
}
/* Creating an account is two steps: the Authentication user, then the record
   the rules check the sign-up code against. If the second is refused, a user
   made here is undone — otherwise the address is taken by a user with nothing
   behind it. An account adopted from elsewhere is only signed out, never deleted. */
async function withRollback(acct, work){
  try{ return await work(); }
  catch(e){
    try{ if(acct.fresh) await acct.cred.user.delete(); else await CLOUD.authApi.signOut(CLOUD.auth); }catch(_){ }
    throw e;
  }
}

async function cloudRegisterFarm(vals, password, code){
  const { doc, getDoc, setDoc, updateDoc, deleteField } = CLOUD.fs;
  const acct = await createOrAdopt(vals.email, password);
  const id = acct.cred.user.uid;
  return await withRollback(acct, async ()=>{
    if(!acct.fresh && (await getDoc(doc(CLOUD.db, COL.farms, id))).exists()){
      const e = new Error('This farm already has a crop calendar. Sign in instead.'); e.code = 'calendar-exists'; throw e;
    }
    const farm = blankFarm(vals);
    await setDoc(doc(CLOUD.db, COL.farms, id), Object.assign(farmCreateDoc(farm), {signupCode: code}));
    await updateDoc(doc(CLOUD.db, COL.farms, id), {signupCode: deleteField()});   // not kept
    FARMS[id] = normaliseFarm(farm);
    CLOUD_STATE.cloudIds.add(id);
    return id;
  });
}

/* An administrator joins as pending like everyone else — except the first,
   who claims ownership of the system (a document only the first can create)
   and approves themselves. Somebody has to be able to approve the rest. */
async function cloudRegisterOperator(name, email, password, code){
  const { doc, setDoc, updateDoc, deleteField } = CLOUD.fs;
  const acct = await createOrAdopt(email, password);
  const id = acct.cred.user.uid;
  await withRollback(acct, async ()=>{
    await setDoc(doc(CLOUD.db, COL.operators, id), {name, email, signupCode: code, since: todayStr(), status:'pending'});
    await updateDoc(doc(CLOUD.db, COL.operators, id), {signupCode: deleteField()});
  });
  let owner = false;
  try{
    await setDoc(doc(CLOUD.db, COL.settings, 'owner'), {uid: id, at: new Date().toISOString()});
    await updateDoc(doc(CLOUD.db, COL.operators, id), {status:'approved', statusBy:id, statusAt:new Date().toISOString()});
    owner = true;
  }catch(e){ /* someone already owns it — this account waits for approval */ }
  return {id, owner};
}

/* The farm record first, and only then the administrator one: anyone may read
   their own farm document, but a farm cannot read the administrator list. */
async function cloudWhoIs(id){
  const { doc, getDoc } = CLOUD.fs;
  const farm = await getDoc(doc(CLOUD.db, COL.farms, id));
  if(farm.exists()){
    FARMS[id] = normaliseFarm(farm.data());
    CLOUD_STATE.cloudIds.add(id);
    return {role:'farm', status: FARMS[id].status};
  }
  const op = await getDoc(doc(CLOUD.db, COL.operators, id));
  if(op.exists()){
    const d = op.data() || {};
    OPERATORS[id] = d;
    let owner = false;
    try{ const o = await getDoc(doc(CLOUD.db, COL.settings, 'owner')); owner = o.exists() && o.data().uid === id; if(owner) OWNER_ID = id; }catch(_){ }
    return {role:'operator', name: d.name || '', status: STATUSES.includes(d.status) ? d.status : 'pending', owner};
  }
  return {role:'orphan'};
}
async function cloudSignIn(email, password){
  const cred = await CLOUD.authApi.signInWithEmailAndPassword(CLOUD.auth, email, password);
  CLOUD_STATE.uid = cred.user.uid; CLOUD_STATE.email = email;
  const who = await cloudWhoIs(cred.user.uid);
  CLOUD_STATE.role = who.role;
  return Object.assign({id: cred.user.uid}, who);
}

/* Live, while signed in. An administrator sees registrations arrive and
   calendars change without pressing anything; a waiting farm is let in the
   moment it is approved. A farm takes only its status from the stream — its
   calendar is the one it is editing, and this screen is the newest copy. */
function cloudStopListening(){
  CLOUD_STATE.unsubs.forEach(u=>{ try{ u(); }catch(_){ } });
  CLOUD_STATE.unsubs = [];
}
function cloudListen(){
  cloudStopListening();
  if(!cloudOn() || !CLOUD_STATE.uid) return;
  const { doc, collection, onSnapshot } = CLOUD.fs;
  const quiet = ()=>{};
  if(CLOUD_STATE.role === 'farm'){
    CLOUD_STATE.unsubs.push(onSnapshot(doc(CLOUD.db, COL.farms, CLOUD_STATE.uid), snap=>{
      // Removed by an administrator while open: there is nothing left to show.
      if(!snap.exists() && !snap.metadata.fromCache && FARMS[CLOUD_STATE.uid] && state.loggedIn){ onFarmRemoved(); return; }
      if(!snap.exists() || !FARMS[CLOUD_STATE.uid]) return;
      const d = snap.data(), f = FARMS[CLOUD_STATE.uid];
      if(d.status !== f.status){
        Object.assign(f, {status:d.status, statusBy:d.statusBy||'', statusAt:d.statusAt||''});
        // An approved farm's calendar is pulled once, as it is let in.
        if(d.status === 'approved') Object.assign(f, normaliseFarm(Object.assign({}, d)));
        onStatusChanged();
      }
    }, quiet));
    return;
  }
  if(CLOUD_STATE.role === 'operator'){
    CLOUD_STATE.unsubs.push(onSnapshot(doc(CLOUD.db, COL.operators, CLOUD_STATE.uid), snap=>{
      if(!snap.exists()) return;
      const d = snap.data(); const was = (OPERATORS[CLOUD_STATE.uid] || {}).status;
      OPERATORS[CLOUD_STATE.uid] = d;
      if(d.status !== was){ state.myStatus = d.status; if(d.status === 'approved') cloudListen(); onStatusChanged(); }
    }, quiet));
    // Only an approved administrator may read the rest; a waiting one is refused.
    if(state.myStatus !== 'approved') return;
    CLOUD_STATE.unsubs.push(onSnapshot(collection(CLOUD.db, COL.farms), snap=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type === 'removed'){ delete FARMS[ch.doc.id]; return; }
        FARMS[ch.doc.id] = normaliseFarm(ch.doc.data()); CLOUD_STATE.cloudIds.add(ch.doc.id);
      });
      onLiveData();
    }, quiet));
    CLOUD_STATE.unsubs.push(onSnapshot(collection(CLOUD.db, COL.operators), snap=>{
      snap.docChanges().forEach(ch=>{ if(ch.type === 'removed') delete OPERATORS[ch.doc.id]; else OPERATORS[ch.doc.id] = ch.doc.data(); });
      onLiveData();
    }, quiet));
    CLOUD_STATE.unsubs.push(onSnapshot(doc(CLOUD.db, COL.settings, 'owner'), snap=>{
      OWNER_ID = snap.exists() ? snap.data().uid : null; onLiveData();
    }, quiet));
  }
}
async function cloudPullAllFarms(){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator' || state.myStatus !== 'approved') return;
  const { collection, getDocs, doc, getDoc } = CLOUD.fs;
  (await getDocs(collection(CLOUD.db, COL.farms))).forEach(d=>{ FARMS[d.id] = normaliseFarm(d.data()); CLOUD_STATE.cloudIds.add(d.id); });
  (await getDocs(collection(CLOUD.db, COL.operators))).forEach(d=>{ OPERATORS[d.id] = d.data(); });
  const o = await getDoc(doc(CLOUD.db, COL.settings, 'owner'));
  OWNER_ID = o.exists() ? o.data().uid : null;
}
async function cloudPullOwnFarm(){
  if(!cloudOn() || CLOUD_STATE.role !== 'farm' || !CLOUD_STATE.uid) return;
  const { doc, getDoc } = CLOUD.fs;
  const d = await getDoc(doc(CLOUD.db, COL.farms, CLOUD_STATE.uid));
  if(d.exists()) FARMS[CLOUD_STATE.uid] = normaliseFarm(d.data());
}

// An administrator's decision on a farm or another administrator.
// Removing a farm deletes its record and calendar. Its sign-in stays in
// Firebase Authentication, which only the console can delete, so the same
// email can register again later.
async function cloudRemoveFarm(id){
  const { doc, deleteDoc } = CLOUD.fs;
  await deleteDoc(doc(CLOUD.db, COL.farms, id));
}
async function cloudDecide(kind, id, status){
  const { doc, updateDoc } = CLOUD.fs;
  await updateDoc(doc(CLOUD.db, kind === 'farm' ? COL.farms : COL.operators, id),
    {status, statusBy: CLOUD_STATE.uid, statusAt: new Date().toISOString()});
}

/* A farm's own edits go up batched, so painting forty weeks in one drag is
   one write, not forty. */
function schedulePush(id){
  if(!cloudOn() || !isCloudFarm(id)) return;
  clearTimeout(CLOUD_STATE.pushTimer);
  CLOUD_STATE.pendingId = id;
  CLOUD_STATE.pushTimer = setTimeout(()=> cloudPushFarm(id), 900);
}
async function cloudPushFarm(id){
  if(!cloudOn() || !FARMS[id] || !isCloudFarm(id)) return;
  CLOUD_STATE.pendingId = null;
  try{
    const { doc, updateDoc } = CLOUD.fs;
    await updateDoc(doc(CLOUD.db, COL.farms, id), farmOwnDoc(FARMS[id]));
    if(CLOUD.status !== 'ready') setCloudStatus('ready', 'Connected again.');
  }catch(e){
    const denied = String((e && e.code) || '').includes('permission-denied');
    setCloudStatus(denied ? 'ready' : 'offline', 'Could not save to the system: ' + (e.message || e));
    if(denied) showFatal('Your change was not saved: this account can no longer edit its calendar. Refresh to see why.');
  }
}
function flushCloud(){
  if(CLOUD_STATE.pendingId){ clearTimeout(CLOUD_STATE.pushTimer); cloudPushFarm(CLOUD_STATE.pendingId); }
}

async function cloudSignOut(){
  cloudStopListening();
  if(!cloudOn()) return;
  // A write still waiting when the session ends would go with nobody signed
  // in, and the rules refuse it. Send it first.
  clearTimeout(CLOUD_STATE.pushTimer);
  if(CLOUD_STATE.pendingId) await cloudPushFarm(CLOUD_STATE.pendingId);
  try{ await CLOUD.authApi.signOut(CLOUD.auth); }catch(e){ }
  CLOUD_STATE.uid = null; CLOUD_STATE.role = null; CLOUD_STATE.email = null;
  // Nothing one account was shown stays in memory for the next.
  FARMS = {}; OPERATORS = {}; OWNER_ID = null; CLOUD_STATE.cloudIds = new Set();
}

// Firebase's own wording is not written for farmers; say what went wrong.
function cloudErrorText(e){
  const code = (e && e.code) || '';
  if(code.includes('adopt-wrong-password')) return 'An account already uses that email address — perhaps your farm’s TIPFA platform account. Enter that account’s password to add a crop calendar to it, or sign in if you already have one.';
  if(code.includes('calendar-exists')) return 'This account already has a crop calendar. Sign in instead.';
  if(code.includes('email-already-in-use')) return 'An account already uses that email address. Try signing in instead.';
  if(code.includes('invalid-email')) return 'That email address does not look right.';
  if(code.includes('weak-password')) return 'Choose a longer password — at least six characters.';
  if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'That email and password do not match an account.';
  if(code.includes('user-not-found')) return 'No account uses that email address.';
  if(code.includes('too-many-requests')) return 'Too many attempts. Wait a few minutes and try again.';
  if(code.includes('network') || code.includes('unavailable')) return 'No connection to the system. Check the network and try again.';
  if(code.includes('permission-denied') || /insufficient permissions/i.test(String(e && e.message)))
    return 'The system refused that. The most likely cause is a sign-up code that does not match the one the Secretariat set — check it, including capital letters.';
  return (e && e.message) ? e.message : 'Something went wrong. Try again.';
}

/* ============================================================
   Motion — the platform's own, unchanged
   ============================================================ */
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function staggerIn(container, selector){
  if(!container) return;
  container.querySelectorAll(selector || ':scope > .card, :scope > .grid4, :scope > .section-label, :scope > .msg-banner').forEach((n,i)=>{
    n.classList.add('reveal');
    if(i < 8) n.classList.add('reveal-'+(i+1));
  });
}
function animateCounters(container, instant){
  container.querySelectorAll('[data-count]').forEach(el=>{
    const target = Number(el.getAttribute('data-count'))||0;
    const suffix = el.getAttribute('data-suffix')||'';
    if(REDUCED_MOTION || instant || !target){ el.textContent = fmt(target)+suffix; return; }
    const dur = 900, start = performance.now();
    function tick(now){
      const p = Math.min(1,(now-start)/dur);
      el.textContent = fmt(Math.round(target*(1 - Math.pow(1-p, 3))))+suffix;
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
document.addEventListener('click', function(e){
  const btn = e.target.closest('.btn');
  if(!btn || REDUCED_MOTION) return;
  const r = btn.getBoundingClientRect(), d = Math.max(r.width, r.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = d+'px';
  span.style.left = (e.clientX - r.left - d/2)+'px';
  span.style.top = (e.clientY - r.top - d/2)+'px';
  btn.appendChild(span);
  setTimeout(()=>span.remove(), 640);
});
function flagError(el, message){
  if(!el) return;
  el.textContent = message;
  const box = el.closest('.card') || el;
  box.classList.remove('err-shake'); void box.offsetWidth; box.classList.add('err-shake');
  setTimeout(()=>box.classList.remove('err-shake'), 500);
}
function curtainTransition(midpoint){
  if(REDUCED_MOTION){ midpoint(); return; }
  const c = document.createElement('div');
  c.className = 'curtain in';
  document.body.appendChild(c);
  setTimeout(()=>{ midpoint(); c.className = 'curtain out'; setTimeout(()=>c.remove(), 460); }, 420);
}

/* ---- Registering and signing in ----------------------------------- */
function findAccount(identifier){
  const key = norm(identifier).replace(/\s+/g,'');
  if(ACCOUNTS[key]) return ACCOUNTS[key];
  // A phone typed with or without spaces or the country code is the same phone.
  const digits = key.replace(/\D/g,'');
  if(digits.length >= 9){
    const tail = digits.slice(-9);
    return Object.values(ACCOUNTS).find(a=> a.phone && a.phone.replace(/\D/g,'').slice(-9) === tail) || null;
  }
  return null;
}

async function submitRegistration(btn){
  const err = document.getElementById('reg-error');
  const vals = {name:val('reg-name'), contact:val('reg-contact'), phone:val('reg-phone'),
                email:val('reg-email').toLowerCase(), location:val('reg-location')};
  const pw = (document.getElementById('reg-password')||{}).value || '';
  const pw2 = (document.getElementById('reg-password2')||{}).value || '';
  const cloud = cloudOn();
  if(!vals.name) return flagError(err, 'Enter your farm name.');
  if(cloud && !vals.email) return flagError(err, 'Enter an email address — the shared database signs you in with it.');
  if(!cloud && !vals.email && !vals.phone) return flagError(err, 'Enter a phone number or an email address to sign in with.');
  if(pw.length < (cloud ? 6 : 4)) return flagError(err, `Choose a password of at least ${cloud ? 'six' : 'four'} characters.`);
  if(pw !== pw2) return flagError(err, 'The two passwords do not match.');
  if(CLOUD_CONFIGURED && !cloud) return flagError(err, 'The crop calendar cannot be reached. Check the connection and try again.');
  if(btn) btn.classList.add('is-busy');

  if(cloud){
    try{
      const id = await withTimeout(cloudRegisterFarm(vals, pw, val('reg-code')), 20000, 'Registering');
      CLOUD_STATE.uid = id; CLOUD_STATE.role = 'farm'; CLOUD_STATE.email = vals.email;
      curtainTransition(()=>{ enterSession('member', {member:id}); render(); });
    }catch(e){ if(btn) btn.classList.remove('is-busy'); flagError(err, cloudErrorText(e)); }
    return;
  }
  if((vals.email && ACCOUNTS[vals.email]) || (vals.phone && findAccount(vals.phone))){
    if(btn) btn.classList.remove('is-busy');
    return flagError(err, 'An account on this device already uses that phone or email. Sign in instead.');
  }
  const id = uid('farm_');
  const salt = uid('s');
  const hash = await hashPassword(pw, salt);
  FARMS[id] = normaliseFarm(blankFarm(vals));
  const acct = {id, role:'farm', name:vals.name, phone:vals.phone, salt, hash};
  if(vals.email) ACCOUNTS[vals.email] = acct;
  if(vals.phone) ACCOUNTS[vals.phone.replace(/\s+/g,'').toLowerCase()] = acct;
  saveLocal();
  curtainTransition(()=>{ enterSession('member', {member:id}); render(); });
}

async function doMemberLogin(btn){
  const err = document.getElementById('login-error');
  const id = val('login-id'), pw = (document.getElementById('login-password')||{}).value || '';
  if(!id || !pw) return flagError(err, 'Enter your phone or email, and your password.');
  if(CLOUD_CONFIGURED && !cloudOn()) return flagError(err, 'The crop calendar cannot be reached. Check the connection and try again.');
  if(btn) btn.classList.add('is-busy');
  if(cloudOn()){
    try{
      const who = await withTimeout(cloudSignIn(id.toLowerCase(), pw), 20000, 'Signing in');
      if(who.role !== 'farm'){
        await cloudSignOut();
        if(btn) btn.classList.remove('is-busy');
        return flagError(err, who.role === 'operator' ? 'That is an administrator account. Use the Administrator tab.'
                                                      : 'That account has no farm calendar — it may have been removed by the Secretariat. Register the farm to start one.');
      }
      curtainTransition(()=>{ enterSession('member', {member:who.id}); render(); });
    }catch(e){ if(btn) btn.classList.remove('is-busy'); flagError(err, cloudErrorText(e)); }
    return;
  }
  const acct = findAccount(id);
  if(!acct || acct.role !== 'farm' || !FARMS[acct.id] || (await hashPassword(pw, acct.salt)) !== acct.hash){
    if(btn) btn.classList.remove('is-busy');
    return flagError(err, acct && acct.role === 'operator' ? 'That is an administrator account. Use the Administrator tab.'
                                                          : 'That phone or email and password do not match a farm on this device.');
  }
  curtainTransition(()=>{ enterSession('member', {member:acct.id}); render(); });
}

async function submitAdminSignup(btn){
  const err = document.getElementById('asignup-error');
  const name = val('asignup-name'), email = val('asignup-user').toLowerCase();
  const pw = (document.getElementById('asignup-pass')||{}).value || '';
  const pw2 = (document.getElementById('asignup-pass2')||{}).value || '';
  const cloud = cloudOn();
  if(!name) return flagError(err, 'Enter your full name.');
  if(!email || !email.includes('@')) return flagError(err, 'Enter your email address.');
  if(pw.length < (cloud ? 6 : 4)) return flagError(err, `Choose a password of at least ${cloud ? 'six' : 'four'} characters.`);
  if(pw !== pw2) return flagError(err, 'The two passwords do not match.');
  if(CLOUD_CONFIGURED && !cloud) return flagError(err, 'The crop calendar cannot be reached. Check the connection and try again.');
  if(btn) btn.classList.add('is-busy');
  if(cloud){
    try{
      const r = await withTimeout(cloudRegisterOperator(name, email, pw, val('asignup-code')), 20000, 'Creating the account');
      CLOUD_STATE.uid = r.id; CLOUD_STATE.role = 'operator'; CLOUD_STATE.email = email;
      OPERATORS[r.id] = {name, email, status: r.owner ? 'approved' : 'pending'};
      if(r.owner) OWNER_ID = r.id;
      curtainTransition(()=>{ enterSession('admin', {adminName:name, adminId:r.id, status: r.owner ? 'approved' : 'pending', owner:r.owner}); render(); });
    }catch(e){ if(btn) btn.classList.remove('is-busy'); flagError(err, cloudErrorText(e)); }
    return;
  }
  if(ACCOUNTS[email]){ if(btn) btn.classList.remove('is-busy'); return flagError(err, 'An account on this device already uses that email.'); }
  const salt = uid('s');
  // The first administrator on this device owns it; every later one waits.
  const first = !operatorList().length;
  const acct = {id: uid('op_'), role:'operator', name, email, since: todayStr(), salt, hash: await hashPassword(pw, salt),
                status: first ? 'approved' : 'pending', owner: first};
  ACCOUNTS[email] = acct;
  saveLocal();
  curtainTransition(()=>{ enterSession('admin', {adminName:name, adminId:acct.id, status:acct.status, owner:first}); render(); });
}

async function doAdminLogin(btn){
  const err = document.getElementById('login-error-admin');
  const email = val('login-user').toLowerCase(), pw = (document.getElementById('login-pass')||{}).value || '';
  if(!email || !pw) return flagError(err, 'Enter your email and password.');

  if(btn) btn.classList.add('is-busy');

    try{

        return flagError(err, who.role === 'farm' ? 'That is a farm account. Use the Farm member tab.'
                                                  : 'That account is not an administrator.');
      }
      curtainTransition(()=>{ enterSession('admin', {adminName: who.name || email, adminId: who.id, status: who.status, owner: who.owner}); render(); });
    }catch(e){ if(btn) btn.classList.remove('is-busy'); flagError(err, cloudErrorText(e)); }

                                                      : 'That email and password do not match an administrator on this device.');

async function sendReset(btn){
  const msg = document.getElementById('forgot-msg');
  const email = val('forgot-email');
  if(!email) return flagError(msg, 'Enter the email address you signed up with.');
  try{
    await CLOUD.authApi.sendPasswordResetEmail(CLOUD.auth, email);
    msg.style.color = 'var(--deep-green)';
    // Firebase answers the same for an address it does not know, so say plainly
    // that the email only comes to the exact address the account was made with,
    // and whom it comes from, so it can be found in a spam folder.
    const from = 'noreply@' + ((window.TIPFA_CC_FIREBASE_CONFIG || {}).authDomain || 'firebaseapp.com');
    msg.textContent = `If ${email} is the exact email this account was registered with, a reset link is on its way from ${from}. `
      + `Look in the inbox and the spam or junk folder. Nothing arrives for any other address — if it does not come, ask the Secretariat which email your account uses.`;
  }catch(e){ flagError(msg, cloudErrorText(e)); }
}

/* An administrator on this device setting a new password for a farm here. */
async function adminResetFarmPassword(farmId){
  const pw = prompt('New password for this farm (at least four characters):');
  if(pw === null) return;
  if(pw.length < 4){ alert('That is too short — use at least four characters.'); return; }
  const salt = uid('s'), hash = await hashPassword(pw, salt);
  let n = 0;
  Object.values(ACCOUNTS).forEach(a=>{ if(a.id === farmId && a.role === 'farm'){ a.salt = salt; a.hash = hash; n++; } });
  saveLocal();
  alert(n ? 'Done. The farm can sign in with the new password on this device.' : 'This farm has no account on this device.');
}

/* ============================================================
   Staying signed in
   ============================================================ */
const MEMBER_GROUPS = [['Crop calendar', [['calendar','Calendar'], ['layout','Greenhouses & blocks']]]];
const ADMIN_GROUPS = [['', [['calendarsA','Crop calendars'], ['members','Members & approvals']]]];
const WAITING_GROUPS = [['', [['status','Account status']]]];
function sidebarGroups(){
  if(!isApproved()) return WAITING_GROUPS;
  return state.role === 'member' ? MEMBER_GROUPS : ADMIN_GROUPS;
}
function tabExists(role, key){
  return (role === 'member' ? MEMBER_GROUPS : ADMIN_GROUPS).some(([,tabs])=> tabs.some(t=> t[0] === key));
}
// A count on Members & approvals: accounts waiting for a decision.
function pendingCount(){
  return Object.values(FARMS).filter(f=> f.status === 'pending').length
       + operatorList().filter(o=> o.status === 'pending').length;
}
function tabBadge(key){ return key === 'members' && state.role === 'admin' && isApproved() ? (pendingCount() || '') : ''; }
function rememberSession(){
  try{
    if(!state.loggedIn){ localStorage.removeItem(SESSION_KEY); return; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({role:state.role, member:state.member,
      adminName:state.adminName, adminId:state.adminId, tab:state.tab, cloud:!!cloudOn(), at:Date.now()}));
  }catch(e){ }
}
function forgetSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function enterSession(role, opts){
  opts = opts || {};
  state.loggedIn = true; state.role = role;
  if(role === 'member') state.member = opts.member;
  else {
    state.adminName = opts.adminName || 'TIPFA Secretariat operator';
    state.adminId = opts.adminId || null;
    state.myStatus = opts.status || 'pending';
    state.isOwner = !!opts.owner;
  }
  state.tab = landingTab(role, opts.resume);
  state.viewFarm = null; state.tool = null; state.editRow = null; state.fillRow = null; state.pop = null;
  // Whoever signs out next should meet the sign-in form, not the form this
  // session happened to arrive through.
  state.showRegister = false; state.adminSignup = false; state.forgot = null;
  state.loginTab = role === 'member' ? 'member' : 'admin';
  document.body.setAttribute('data-role', role);
  rememberSession();
  cloudListen();
}
// Where an account lands: its own status screen until it is approved.
function landingTab(role, resume){
  if(!isApproved(role)) return 'status';
  if(resume && tabExists(role, resume)) return resume;
  return role === 'member' ? 'calendar' : 'calendarsA';
}
function isApproved(role){
  role = role || state.role;
  if(role === 'member'){ const f = FARMS[state.member]; return !!f && f.status === 'approved'; }
  return state.myStatus === 'approved';
}
/* An administrator's decision has reached this account — on this device, or
   from the database while it was open. */
function onStatusChanged(){
  if(!state.loggedIn) return;
  const ok = isApproved();
  if(ok && state.tab === 'status'){
    state.celebrate = true;           // let in: the leaves fly
    state.tab = state.role === 'member' ? 'calendar' : 'calendarsA';
    if(state.role === 'member') state.calMsg = `${CHECK_ICON} Your farm has been approved. Welcome — your crop calendar is ready.`;
  }
  if(!ok) state.tab = 'status';
  rememberSession();
  render();
}
// Something changed in the database while an administrator was looking.
function onLiveData(){
  if(!state.loggedIn || state.role !== 'admin') return;
  const a = document.activeElement, keep = a && a.id ? {id:a.id, start:a.selectionStart, end:a.selectionEnd} : null;
  renderKeepingPlace();
  if(keep){ const el = document.getElementById(keep.id); if(el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(keep.start, keep.end); }catch(_){ } } }
}
async function restoreSession(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){}
  if(!saved) return false;
  if(cloudOn()){
    const user = await new Promise(resolve=>{
      const stop = CLOUD.authApi.onAuthStateChanged(CLOUD.auth, u=>{ stop(); resolve(u); }, ()=> resolve(null));
      setTimeout(()=> resolve(CLOUD.auth.currentUser || null), 8000);
    });
    if(!user){ forgetSession(); return false; }
    state.restoring = true; render();
    try{
      CLOUD_STATE.uid = user.uid; CLOUD_STATE.email = user.email || '';
      const who = await cloudWhoIs(user.uid);
      CLOUD_STATE.role = who.role;
      if(who.role === 'farm') enterSession('member', {member:user.uid, resume:saved.tab});
      else if(who.role === 'operator'){
        state.myStatus = who.status;
        if(who.status === 'approved') await cloudPullAllFarms();
        enterSession('admin', {adminName: who.name || user.email, adminId:user.uid, status:who.status, owner:who.owner, resume:saved.tab});
      }
      else { forgetSession(); state.restoring = false; return false; }
      state.restoring = false; state.lastRefresh = Date.now(); render();
      return true;
    }catch(e){
      state.restoring = false; CLOUD_STATE.uid = null; CLOUD_STATE.role = null;
      state.restoreError = 'Your session could not be restored: ' + ((e && e.message) || e) + ' — please sign in again.';
      forgetSession(); render();
      return false;
    }
  }
  if(saved.cloud) return false;            // it was a database session; do not fake one
  // A site set up with a database never opens device-only accounts, even when
  // the database cannot be reached and a session from before is still here.
  if(CLOUD_CONFIGURED) return false;
  if(saved.role === 'member' && FARMS[saved.member]){ enterSession('member', {member:saved.member, resume:saved.tab}); render(); return true; }
  const me = saved.role === 'admin' && operatorList().find(o=> o.id === saved.adminId);
  if(me){
    enterSession('admin', {adminName:me.name, adminId:me.id, status:me.status, owner:me.owner, resume:saved.tab}); render(); return true;
  }
  forgetSession();
  return false;
}
// This farm's record was removed by an administrator while it was open.
async function onFarmRemoved(){
  clearTimeout(CLOUD_STATE.pushTimer); CLOUD_STATE.pendingId = null;   // nothing to save it to
  delete FARMS[state.member];
  await cloudSignOut();
  state.loggedIn = false; state.role = null; state.member = null; state.navOpen = false;
  state.regMsg = '';
  state.restoreError = 'This farm was removed from the crop calendar by the Secretariat. To use it again, register the farm afresh.';
  document.body.removeAttribute('data-role');
  forgetSession(); render();
}
async function logout(){
  flushCloud();
  await cloudSignOut();
  curtainTransition(()=>{
    state.loggedIn = false; state.role = null; state.member = null; state.navOpen = false;
    state.regMsg = ''; state.restoreError = '';
    document.body.removeAttribute('data-role');
    forgetSession(); render();
  });
}

/* Pull again without signing out and back in — the only other way to pick
   up another device's work. */
async function refreshNow(btn){
  if(state.refreshing) return;
  state.refreshing = true;
  if(btn) btn.classList.add('is-busy');
  try{
    if(CLOUD_STATE.role === 'operator'){
      const who = await cloudWhoIs(CLOUD_STATE.uid);
      const was = state.myStatus; state.myStatus = who.status; state.isOwner = who.owner;
      if(who.status === 'approved') await cloudPullAllFarms();
      if(was !== who.status){ cloudListen(); state.refreshing = false; return onStatusChanged(); }
    }
    else if(CLOUD_STATE.role === 'farm'){
      flushCloud();
      const was = (FARMS[CLOUD_STATE.uid] || {}).status;
      await cloudPullOwnFarm();
      if(was !== (FARMS[CLOUD_STATE.uid] || {}).status){ state.refreshing = false; return onStatusChanged(); }
    }
    else if(state.role === 'admin'){            // this device: pick up a decision made in another tab
      loadLocal(); const me = operatorList().find(o=> o.id === state.adminId);
      if(me && me.status !== state.myStatus){ state.myStatus = me.status; state.refreshing = false; return onStatusChanged(); }
    }
    else if(state.role === 'member'){
      const was = (FARMS[state.member] || {}).status; loadLocal();
      if(was !== (FARMS[state.member] || {}).status){ state.refreshing = false; return onStatusChanged(); }
    }
    state.lastRefresh = Date.now();
  }catch(e){ setCloudStatus('offline', 'Could not refresh: ' + (e.message || e)); }
  checkForNewerBuild();
  state.refreshing = false;
  render();
}
function refreshButton(){
  return `<button class="btn small ghost refresh-btn${state.refreshing?' is-busy':''}" onclick="refreshNow(this)"
      title="${cloudOn() ? 'Fetch the calendars again from the shared database' : 'Not connected to a shared database'}">
      <span class="rf-icon" aria-hidden="true">${icon('refresh')}</span>Refresh</button>`;
}

/* ---- A device holding an older copy of this page -------------------
   The platform's own check: ask the server for the head of the file and
   compare build stamps, rather than let two devices disagree quietly. */
function buildNumber(v){ const n = parseInt(String(v||'').replace(/^v/,''), 10); return isNaN(n) ? 0 : n; }
async function checkForNewerBuild(){
  if(!navigator.onLine || !/^https?:/.test(location.protocol)) return;
  try{
    const res = await fetch(location.pathname + '?b=' + Date.now(), {cache:'no-store', headers:{'Range':'bytes=0-3071'}});
    if(!res.ok && res.status !== 206) return;
    const m = (await res.text()).match(/name="tipfa-build"\s+content="([^"]+)"/);
    if(m && buildNumber(m[1]) > buildNumber(BUILD)){ state.staleBuild = m[1]; render(); }
  }catch(_){ }
}
function staleBuildBar(){
  if(!state.staleBuild) return '';
  return `<div class="stalebar"><div>
