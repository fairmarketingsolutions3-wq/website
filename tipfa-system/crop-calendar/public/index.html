// Only the tools row and its hint change, in place: a full redraw would replay
// every card's entrance and move the grid under a pointer about to drag.
function armTool(code){
  state.tool = state.tool === code ? null : code;
  closePop();
  const tools = document.querySelector('.cc-toolbar .cc-tools');
  const hint = tools && tools.nextElementSibling;
  if(!hint){ renderKeepingPlace(); return; }
  const btns = Array.from(tools.querySelectorAll('.cc-tool'));
  const focused = btns.indexOf(document.activeElement);
  const tmp = document.createElement('div');
  tmp.innerHTML = toolsRow();
  const [nt, nh] = [tmp.firstElementChild, tmp.lastElementChild];
  tools.replaceWith(nt); hint.replaceWith(nh);
  if(focused >= 0) nt.querySelectorAll('.cc-tool')[focused].focus();
}
function shiftWindow(d){
  const f = currentFarm();
  f.startYear = (f.startYear || DEFAULT_START_YEAR) + d;
  state.scroll = null;
  touch(state.member);
  renderKeepingPlace();
}
function goToToday(){
  const f = currentFarm(), now = new Date(), y = now.getFullYear();
  if(y < f.startYear || y > f.startYear + 2){ f.startYear = y; touch(state.member); }
  state.scroll = null; state.spanAt = null;
  render();
}

/* ---- The grid, shared by the farm's page and the Secretariat's ------ */
/* The whole span is on screen at once and the grid is never wider than the
   page: the weeks share whatever width is left beside the planting column.
   When a label no longer fits it steps down — a month's name to its initial,
   a week's kilograms to its colour alone, the totals from months to quarters —
   instead of pushing the grid sideways. */
let SCROLLBAR_W = null;
// Measured on a box styled as the grid's own, since the page styles its scrollbars.
function scrollbarWidth(){
  if(SCROLLBAR_W === null){
    const d = document.createElement('div');
    d.className = 'cc-scroll';
    d.style.cssText = 'position:absolute;top:-999px;left:-999px;width:100px;height:100px;min-height:0;';
    d.innerHTML = '<div style="height:300px"></div>';
    document.body.appendChild(d); SCROLLBAR_W = d.offsetWidth - d.clientWidth; d.remove();
  }
  return SCROLLBAR_W;
}
// The width the grid may use: the page's content column, less the card's
// border and the room kept for the grid's own up-and-down scrollbar.
function gridRoom(){
  const c = document.getElementById('content');
  const w = c && c.clientWidth;
  if(!w) return isMobile() ? 340 : 1000;
  const cs = getComputedStyle(c);
  // 6 more for the cells' own borders, which a separated table adds to its width.
  return Math.floor(w - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) - 2 - 6;
}
function gridLayout(months){
  const room = gridRoom();
  const pin = isMobile() ? Math.min(138, Math.round(room * 0.37)) : room > 1300 ? 310 : room > 1100 ? 280 : 240;
  const weekW = (room - pin) / (months.length * 4);
  const monthW = weekW * 4;
  // Totals are added up over as many months as it takes to print them legibly.
  const group = [1, 2, 3, 6, 12].find(g=> g * monthW >= (isMobile() ? 34 : 40)) || 12;
  return {room, pin, weekW, monthW, group, rowH: isMobile() ? 74 : 96,
    kg: weekW >= 21, weekNums: weekW >= 13,
    monthLabel: monthW >= (isMobile() ? 64 : 88) ? 'full' : monthW >= (isMobile() ? 28 : 36) ? 'abbr' : monthW >= 11 ? 'initial' : 'none'};
}
let gridView = null;     // the months and layout the grid on screen was drawn for

/* ---- How much of the three years is on screen ----------------------- */
const SPANS = [{n:36, label:'3 years', short:'3 yrs'}, {n:12, label:'1 year', short:'1 yr'}, {n:6, label:'6 months', short:'6 mo'}, {n:3, label:'3 months', short:'3 mo'}];
// Unless someone has chosen, a year on a computer and three months on a phone:
// big enough to read, with three years one tap away.
function viewSpan(){
  if(!state.span){
    const dflt = isMobile() ? 3 : 12;
    let s = dflt;
    try{ s = Number(localStorage.getItem('tipfa-cc-span')) || dflt; }catch(e){}
    state.span = SPANS.some(x=> x.n === s) ? s : dflt;
  }
  return state.span;
}
// Full screen: the calendar takes the whole window, menus out of the way.
function toggleWide(on){
  state.wide = on === undefined ? !state.wide : on;
  document.body.classList.toggle('cc-wide', !!state.wide);
  state.scroll = null;
  render();
}
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && state.wide && !state.pop && !state.navOpen) toggleWide(false); });
// The months of the window that are shown: all of them, or the year or half
// year asked for — by default the one holding this week.
function spanMonths(months){
  const n = viewSpan();
  if(n >= months.length) return months;
  let at = state.spanAt;
  if(at === null || at === undefined){
    const i = months.findIndex(mo=> mo.keys.includes(todayKey()));
    at = i < 0 ? 0 : Math.floor(i / n) * n;
  }
  at = Math.max(0, Math.min(months.length - n, at));
  state.spanAt = at;
  return months.slice(at, at + n);
}
function setSpan(n){
  state.span = n; state.spanAt = null; state.scroll = null;
  try{ localStorage.setItem('tipfa-cc-span', String(n)); }catch(e){}
  renderKeepingPlace();
}
// One step back or on. Past either end of the three years the window itself
// moves a year, so the arrows go on as far as anyone needs.
function stepView(d, shiftFn){
  const n = viewSpan();
  if(n >= WINDOW_MONTHS){ window[shiftFn](d); return; }
  const at = (state.spanAt || 0) + d * n;
  if(at < 0){ state.spanAt = at + 12; window[shiftFn](-1); return; }
  if(at + n > WINDOW_MONTHS){ state.spanAt = at - 12; window[shiftFn](1); return; }
  state.spanAt = at; state.scroll = null;
  renderKeepingPlace();
}
function viewNavHTML(shown, shiftFn){
  const a = shown[0], b = shown[shown.length - 1];
  const label = a.y === b.y && a.m === 1 && b.m === 12 ? String(a.y) : `${MONTH_ABBR[a.m-1]} ${a.y} – ${MONTH_ABBR[b.m-1]} ${b.y}`;
  const n = viewSpan(), unit = n >= 12 ? 'One year' : n === 6 ? 'Six months' : 'Three months';
  return `<div class="cc-window" role="group" aria-label="Calendar dates">
      <button onclick="stepView(-1,'${shiftFn}')" aria-label="${unit} earlier" title="${unit} earlier">${icon('chevL')}</button>
      <span class="cw-label">${label}</span>
      <button onclick="stepView(1,'${shiftFn}')" aria-label="${unit} later" title="${unit} later">${icon('chevR')}</button>
    </div>
    <div class="cc-span" role="group" aria-label="How much to show at once">${SPANS.map(s=>
      `<button class="${s.n === n ? 'on' : ''}" aria-pressed="${s.n === n}" onclick="setSpan(${s.n})" title="Show ${s.label}">${isMobile() ? s.short : s.label}</button>`).join('')}</div>`;
}

/* A big farm is a big table — 150 plantings over three years is 21,600
   weeks — so the grid is built to stay quick: every column's width is
   declared up front (fixed table layout, so the browser never measures the
   cells to place them), a week cell carries nothing but its class and
   contents, and its tooltip is written only when a pointer reaches it. */
function gridHTML(f, months, opts){
  const units = showUnits(f);
  const now = todayKey();
  const ro = opts.readOnly;
  const L = gridLayout(months);
  const nW = months.length * 4;

  // Heading rows: the years when the months cannot carry them, the months,
  // and the week numbers when there is room for them.
  const yearsRow = L.monthLabel !== 'full';
  const H = {yr: 24, mh: 30, wh: 20};
  // The whole calendar is on the page, so its headings stick to the top of the
  // screen as it scrolls — below the phone's own bar.
  const stick = isMobile() ? 56 : 0;
  const tops = {yr: stick, mh: stick + (yearsRow ? H.yr : 0)};
  tops.wh = tops.mh + H.mh;
  const nHead = (yearsRow ? 1 : 0) + 1 + (L.weekNums ? 1 : 0);
  const monthText = mo=> L.monthLabel === 'full' ? `${MONTH_ABBR[mo.m-1]} ${mo.y}`
    : L.monthLabel === 'abbr' ? MONTH_ABBR[mo.m-1] : L.monthLabel === 'initial' ? MONTH_ABBR[mo.m-1][0] : '';
  const years = [];
  months.forEach(mo=>{ const last = years[years.length-1];
    if(last && last.y === mo.y) last.n++; else years.push({y: mo.y, n: 1}); });
  const curMonth = now.slice(0, 7);
  const corner = `<th rowspan="${nHead}" class="stk cc-corner" style="top:${stick}px;" title="${esc(f.name)}"><span class="cc-corner-name">${esc(f.name)}</span>
      <span class="cc-corner-sub">${liveRows(f).length} planting${liveRows(f).length === 1 ? '' : 's'}</span></th>`;
  const rowsHead = [];
  if(yearsRow) rowsHead.push(`<tr class="yr">${corner}${years.map(y=>
    `<th colspan="${y.n * 4}" style="top:${tops.yr}px;">${y.n * L.monthW >= 34 ? y.y : String(y.y).slice(2)}</th>`).join('')}</tr>`);
  rowsHead.push(`<tr class="mh">${yearsRow ? '' : corner}${months.map(mo=>
    `<th colspan="4" class="${mo.m===1?'ystart':''}${mo.keys[0].slice(0, 7) === curMonth ? ' cur' : ''}" style="top:${tops.mh}px;" title="${MONTHS[mo.m-1]} ${mo.y}">${monthText(mo)}</th>`).join('')}</tr>`);
  if(L.weekNums) rowsHead.push(`<tr class="wh">${months.map(mo=> mo.keys.map((k, w)=>
    `<th class="${w===0?'mstart':''}${k===now?' now':''}" style="top:${tops.wh}px;"${k===now?' title="This week"':''}>${w+1}</th>`).join('')).join('')}</tr>`);
  const head = `<thead>${rowsHead.join('')}</thead>`;

  const keys = months.flatMap(mo=> mo.keys);
  // Each week column's own classes, worked out once rather than per cell.
  const base = keys.map(k=>{ const {m, w} = parseWeekKey(k);
    return 'wk' + (w === 1 ? ' mstart' : '') + (w === 1 && m === 1 ? ' ystart' : '') + (k === now ? ' now' : ''); });
  const rows = orderedRows(f);
  let body = '', ri = 0;
  const order = [];
  gridView = {months, L, keys, base, ro, f};
  // With more than one unit, every unit gets its heading — an empty one too,
  // so a greenhouse just added can be planted from here.
  const unitHead = u=>{
    const inUnit = liveRows(f).filter(x=> x.unit === u.id);
    const area = inUnit.reduce((t, x)=> t + (Number(x.area)||0), 0);
    return `<tr class="cc-unit"><th colspan="${nW + 1}"><span class="u-ico">${icon('house')}</span>${esc(u.name)}
        <span class="u-meta">${esc(u.type)} · ${inUnit.length ? `${inUnit.length} planting${inUnit.length===1?'':'s'}` : 'nothing planned yet'}${area?` · ${fmt(area)} m²`:''}</span>
        ${ro ? '' : `<button class="cc-rowbtn" onclick="openEditor(null,'${u.id}')" title="Add a planting to ${esc(u.name)}" aria-label="Add a planting to ${esc(u.name)}">${icon('plus')}</button>`}</th></tr>`;
  };
  const sequence = units
    ? f.units.flatMap(u=> [{head:u}, ...rows.filter(r=> r.unit === u.id).map(r=> ({row:r}))])
    : rows.map(r=> ({row:r}));
  sequence.forEach(item=>{
    if(item.head){ body += unitHead(item.head); return; }
    body += rowHTML(item.row, ri);
    order.push(item.row.id);
    ri++;
  });

  gridOrder = order; gridKeys = keys;
  const colgroup = `<colgroup><col style="width:${L.pin}px">${`<col style="width:${L.weekW}px">`.repeat(nW)}</colgroup>`;
  const cls = 'cc-grid fit' + (ro ? ' readonly' : '') + (L.weekW < 9 ? ' dense' : '') + (L.weekW < 4 ? ' tiny' : '');
  // This week, marked down the whole field, with its flag.
  const nowCi = keys.indexOf(now);
  const today = nowCi < 0 ? '' : `<div class="cc-today" style="left:${(L.pin + (nowCi + 0.5) * L.weekW).toFixed(1)}px" aria-hidden="true"><span class="cc-today-flag">Today</span></div>`;
  return `<div class="cc-scroll" data-key="${esc(opts.key || (state.member + ':' + f.startYear))}"><div class="cc-field" style="width:${L.room}px">
    <table class="${cls}" style="width:${L.room}px;--rowH:${L.rowH}px">${colgroup}${head}<tbody>${body}</tbody>${footHTML(f, gridView)}</table>${today}</div></div>`;
}

/* ---- One planting's row ---------------------------------------------------
   The weeks run together into bars, one for each stage, and a bar wide enough
   to carry its name says it: Nursery, Growing, Harvest · 4,200 kg. The crop's
   own column says where it is today and how far through its season. */
const SEG_NAME = {L:'Land prep', S:'Nursery', T:'Transplant', V:'Growing', F:'Flowering', H:'Harvest', R:'Rotation'};
const NOW_TEXT = {L:'Preparing the land', S:'In the nursery', T:'Transplanting', V:'Growing', F:'Flowering', H:'Harvesting', R:'Rotation crop'};
const NOW_ICON = {L:'soil', S:'seed', T:'plant', V:'sprout', F:'bloom', H:'basket', R:'sprout'};
function weekIndex(k){ const {y, m, w} = parseWeekKey(k); return y * 48 + (m - 1) * 4 + (w - 1); }
// Where a planting stands today, over all its weeks — not only those on screen.
function rowJourney(r){
  const ks = Object.keys(r.cells).filter(k=> readCell(r.cells[k])).map(weekIndex).sort((a, b)=> a - b);
  if(!ks.length) return {cls:'empty', icon:'soil', text:'No weeks yet', p:0};
  const t = weekIndex(todayKey()), first = ks[0], last = ks[ks.length - 1];
  let kg = 0; Object.values(r.cells).forEach(v=>{ const c = readCell(v); if(c && c.s === 'H' && c.kg) kg += c.kg; });
  if(t < first){ const n = first - t; return {cls:'soon', icon:'seed', text:`Starts in ${n} week${n === 1 ? '' : 's'}`, p:0}; }
  if(t > last) return {cls:'done', icon:'basket', text: kg ? `Season done · ${kgShort(kg)} kg` : 'Season done', p:1};
  const c = readCell(r.cells[todayKey()]);
  const s = c ? c.s : 'V';
  return {cls:'s-' + s, icon: NOW_ICON[s], p: last > first ? (t - first) / (last - first) : 1,
    text: NOW_TEXT[s] + (c && c.s === 'H' && c.kg ? ` · ${kgShort(c.kg)} kg this week` : '')};
}
// A label only where all of it fits: a bar too short for its name keeps quiet.
function segLabel(s, kg, w){
  const fits = t=> t.length * (isMobile() ? 6.6 : 8.4) + 16 <= w;
  const options = s === 'H'
    ? (kg ? [`Harvest · ${fmt(Math.round(kg))} kg`, `${kgShort(kg)} kg`] : ['Harvest'])
    : [SEG_NAME[s]];
  return options.find(fits) || '';
}
function rowHTML(r, ri){
  const {f, L, keys, base, ro} = gridView;
  const mobile = isMobile();
  const plants = r.plan && r.plan.plants ? `${fmt(r.plan.plants)} ${guideFor(r.plan.guide) && guideFor(r.plan.guide).tree ? 'trees' : 'plants'}` : '';
  const sub = [offGuide(r) ? 'not in the crop guide' : '', locationText(f, r), varietyShort(r), r.area ? `${fmt(r.area)} m²` : '', plants].filter(Boolean).join(' · ');
  const j = rowJourney(r);
  const tip = [r.crop || '(no crop named)', sub, j.text, r.notes].filter(Boolean).join(' — ');
  const cropInner = `<div class="cc-crop-cell">
      <span class="cc-ico ${j.cls}" aria-hidden="true">${jIcon(j.icon, 17)}</span>
      <span class="cn" ${ro ? '' : `onclick="openEditor('${r.id}')"`} title="${esc(tip)}"><span class="cn-name">${esc(r.crop || '—')}</span>
        ${sub && !mobile ? `<span class="sub">${esc(sub)}</span>` : ''}
        <span class="cc-now">${esc(j.text)}</span>
        <span class="cc-prog"><i style="--p:${j.p.toFixed(3)};--d:${Math.min(ri, 24) * 45}ms"></i></span></span>
      ${ro ? '' : `<span class="cc-rowbtns">
        ${guideChanged(r) ? `<button class="cc-rowbtn cc-replan" onclick="replanRow('${r.id}')" title="The crop guide for ${esc(r.crop)} has changed — update its weeks" aria-label="The crop guide for ${esc(r.crop)} has changed: update its weeks">${icon('refresh')}</button>` : ''}
        <button class="cc-rowbtn cc-edit" onclick="openEditor('${r.id}')" title="Edit — crop, dates, plants" aria-label="Edit ${esc(r.crop)}: crop, dates and plants">${icon('pencil')}</button>
        ${j.cls === 'done' ? `<button class="cc-rowbtn cc-arch" onclick="archiveRow('${r.id}')" title="Season done — archive it" aria-label="Archive ${esc(r.crop)}">${icon('archive')}</button>`
          : mobile ? '' : `<button class="cc-rowbtn" onclick="openFill('${r.id}')" title="Fill a run of weeks" aria-label="Fill a run of weeks for ${esc(r.crop)}">${icon('fill')}</button>`}</span>`}
    </div>`;
  const st = keys.map(k=> readCell(r.cells[k]));
  let weeks = '';
  for(let ci = 0; ci < keys.length; ci++){
    const cell = st[ci], prev = st[ci - 1], next = st[ci + 1];
    let cls = base[ci], inner = '';
    if(cell){
      cls += ' s-' + cell.s;
      if(!prev || prev.s !== cell.s){
        cls += ' sg-a';
        let k = ci, kg = 0;
        while(k < keys.length && st[k] && st[k].s === cell.s){ kg += st[k].kg || 0; k++; }
        const w = (k - ci) * L.weekW, label = segLabel(cell.s, kg, w);
        if(label) inner += `<span class="seg-lab" style="width:${Math.round(w - 9)}px;--d:${Math.min(ri, 24) * 45 + 120}ms">${esc(label)}</span>`;
      }
      if(!next || next.s !== cell.s) cls += ' sg-z';
      if(L.kg && cell.s === 'H' && cell.kg) inner += `<b class="kg">${kgShort(cell.kg)}</b>`;
    }
    weeks += `<td class="${cls}" data-ri="${ri}" data-ci="${ci}">${inner}</td>`;
  }
  return `<tr data-row="${r.id}"><td class="stk c-crop">${cropInner}</td>${weeks}</tr>`;
}
// The template's two blocks of totals, under the plantings — by month when
// they fit, otherwise by two, three, six or twelve months together.
function footHTML(f, view){
  const {months, L} = view;
  const g = L.group;
  const groups = [];
  for(let i = 0; i < months.length; i += g) groups.push(months.slice(i, i + g));
  const per = monthTotals(liveRows(f), months);
  const sumOf = arr=> groups.map((gr, gi)=> arr.slice(gi * g, gi * g + gr.length).reduce((a, b)=> a + b, 0));
  const unit = g === 1 ? 'month' : g === 3 ? 'quarter' : g === 6 ? 'half year' : g === 12 ? 'year' : `${g} months`;
  const name = gr=> gr.length === 1 ? `${MONTHS[gr[0].m-1]} ${gr[0].y}`
    : `${MONTH_ABBR[gr[0].m-1]} ${gr[0].y} – ${MONTH_ABBR[gr[gr.length-1].m-1]} ${gr[gr.length-1].y}`;
  const cellW = g * L.monthW;
  const num = v=> !v ? '0' : cellW >= 52 ? fmt(v) : kgShort(v);
  // Each figure stands on a bar as tall as its share of the row's best period.
  const cells = vals=>{ const top = Math.max(1, ...vals);
    return vals.map((v, i)=> `<td colspan="${groups[i].length * 4}" class="${v?'':'zero'}" title="${name(groups[i])}: ${fmt(v)} kg">${v ? `<span class="sky" style="--h:${(v / top).toFixed(3)};--d:${i * 40}ms"></span>` : ''}<span class="fv">${num(v)}</span></td>`).join(''); };
  const crops = cropTotals(liveRows(f), months);
  const nW = months.length * 4;
  return `<tfoot>
    <tr class="tot"><th class="stk" title="Total harvest, kg per ${unit}">${isMobile() ? 'TOTAL' : 'TOTAL HARVEST'} <span class="per">kg</span></th>${cells(sumOf(per))}</tr>
    <tr class="bych"><th class="stk">${isMobile() ? 'By crop' : 'Harvest by crop'}</th><td colspan="${nW}" class="per-note">kg per ${unit}</td></tr>
    ${crops.length ? crops.map(gc=> `<tr class="crop"><th class="stk" title="${esc(gc.crop)}">${esc(gc.crop)}</th>${cells(sumOf(gc.per))}</tr>`).join('')
      : `<tr class="crop"><th class="stk" style="font-weight:400;color:var(--muted);">No harvest kilograms yet</th><td colspan="${nW}"></td></tr>`}
  </tfoot>`;
}
let gridOrder = [];      // planting ids in the order the grid drew them, for painting by index
let gridKeys = [];       // the week each column stands for

/* A week's tooltip, written when the pointer first reaches it. */
function bindTooltips(table, f){
  if(!table) return;
  table.addEventListener('mouseover', e=>{
    const td = e.target.closest && e.target.closest('td.wk');
    if(!td || td.title) return;
    const r = f.rows.find(x=> x.id === gridOrder[+td.dataset.ri]), k = gridKeys[+td.dataset.ci];
    if(!r || !k) return;
    const {y, m, w} = parseWeekKey(k), cell = readCell(r.cells[k]);
    td.title = `${r.crop ? r.crop + ' · ' : ''}${MONTHS[m-1]} ${y}, week ${w}` +
      (cell ? ` — ${STAGE[cell.s].name}${cell.s === 'H' && cell.kg ? `, ${fmt(cell.kg)} kg` : ''}` : '');
  });
}

/* After a week or a run of weeks changes: redraw just those plantings' weeks,
   the totals under them and the figures above — not the page. On a big farm
   that is the difference between an instant change and a pause. */
function refreshAfterEdit(f, rowIds){
  const table = document.querySelector('.cc-grid:not(.readonly)');
  if(!table || !gridView){ render(); return; }
  let popped = false;
  // A changed planting's row is drawn again whole — its bars, their labels and
  // where it stands today all follow from its weeks — and the weeks that
  // changed light up.
  rowIds.forEach(id=>{
    const r = f.rows.find(x=> x.id === id), ri = gridOrder.indexOf(id);
    const tr = table.querySelector(`tr[data-row="${id}"]`);
    if(!r || ri < 0 || !tr) return;
    const stageOf = td=> (td.className.match(/ s-(\w)/) || [])[1] || '';
    const was = [...tr.querySelectorAll('td.wk')].map(stageOf);
    const tmp = document.createElement('tbody');
    tmp.innerHTML = rowHTML(r, ri);
    const fresh = tmp.firstElementChild;
    fresh.classList.add('redrawn');
    fresh.querySelectorAll('td.wk').forEach((td, i)=>{ const s = stageOf(td); if(s && s !== was[i]){ td.classList.add('just'); popped = true; } });
    tr.replaceWith(fresh);
  });
  const foot = table.querySelector('tfoot');
  if(foot){
    const fresh = document.createElement('table');
    fresh.innerHTML = footHTML(f, gridView);
    const nf = fresh.querySelector('tfoot');
    const oldCells = foot.querySelectorAll('th, td'), newCells = nf.querySelectorAll('th, td');
    if(oldCells.length === newCells.length){
      newCells.forEach((n, i)=>{ const o = oldCells[i];
        if(o.innerHTML !== n.innerHTML){ o.innerHTML = n.innerHTML; if(o.tagName === 'TD' && !REDUCED_MOTION){ o.classList.remove('bump'); void o.offsetWidth; o.classList.add('bump'); } }
        if(o.className !== n.className) o.className = n.className;
        if(o.title !== n.title) o.title = n.title; });
    } else { foot.replaceWith(nf); sizeGrid(table.closest('.cc-scroll')); }
  }
  // Weeks just coloured light up for a moment, then settle.
  if(popped){ clearTimeout(refreshAfterEdit.t); refreshAfterEdit.t = setTimeout(()=> table.querySelectorAll('td.wk.just').forEach(td=> td.classList.remove('just')), 650); }
  if(state.pop) markPopWeek();
  const fig = farmFigures(f, farmWindow(f));
  const set = (id, v)=>{ const el = document.getElementById(id); if(el) el.textContent = v; };
  set('m-plantings', fmt(fig.plantings)); set('m-area', fmt(Math.round(fig.area)));
  set('m-harvest', fmt(Math.round(fig.total))); set('m-peak', fig.peak);
}

// A contained box cannot size itself to its contents, so it is told: as tall
// as the table, but never taller than the screen allows.
function sizeGrid(sc){
  return;                 // the calendar is drawn at its full height on the page
  if(!sc) return;
  const t = sc.querySelector('table');
  if(!t) return;
  const cap = parseFloat(getComputedStyle(sc).maxHeight) || 600;
  sc.style.height = Math.max(220, Math.min(cap, t.offsetHeight + (sc.offsetHeight - sc.clientHeight) + 2)) + 'px';
}
// A grid drawn for one width is drawn again for another: turning a tablet,
// or resizing a window, keeps the whole span on screen.
let gridResizeTimer = null;
window.addEventListener('resize', ()=>{
  document.querySelectorAll('.cc-scroll').forEach(sizeGrid);
  clearTimeout(gridResizeTimer);
  gridResizeTimer = setTimeout(()=>{
    if(!gridView || drag || !document.querySelector('.cc-grid')) return;
    if(Math.abs(gridRoom() - gridView.L.room) > 1) renderKeepingPlace();
  }, 160);
});
// Keep the grid where it was, up and down, across a redraw.
function restoreGridScroll(c){
  const sc = c.querySelector('.cc-scroll');
  if(!sc) return;
  sizeGrid(sc);
  if(state.scroll && state.scroll.key === sc.dataset.key) sc.scrollTop = state.scroll.top;
  state.scroll = {left: 0, top: sc.scrollTop, key: sc.dataset.key};
}

/* ============================================================
   Colouring weeks
   With a stage picked, a press and a drag colours a rectangle — one row or
   several, so land preparation across three greenhouses is one stroke.
   Without one, a click on a week opens its own small chooser. A finger
   on a phone is scrolling the grid, not painting it, so there a tap does
   one week and a run of weeks goes through Fill.
   ============================================================ */
let drag = null;
// Released anywhere — over the grid, its headings, or off it altogether.
document.addEventListener('pointerup', ()=>{
  if(!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll('.cc-scroll.painting').forEach(n=> n.classList.remove('painting'));
  paintRect(currentFarm(), d);
});
function cancelDrag(){
  drag = null;
  document.querySelectorAll('.cc-scroll.painting').forEach(n=> n.classList.remove('painting'));
  document.querySelectorAll('.cc-grid .pv').forEach(n=>{ n.classList.remove('pv','pv-clear'); n.style.background = ''; n.style.color = ''; });
}
function bindGrid(table, f){
  if(!table || table.classList.contains('readonly')) return;
  const sc = table.closest('.cc-scroll');

  table.addEventListener('pointerdown', e=>{
    const td = e.target.closest('td.wk');
    if(!td || e.button > 0) return;
    if(e.pointerType === 'touch' || !state.tool) return;     // a tap is handled on click
    e.preventDefault();
    drag = {r0:+td.dataset.ri, c0:+td.dataset.ci, r1:+td.dataset.ri, c1:+td.dataset.ci, moved:false};
    sc.classList.add('painting');
    previewDrag(table);
  });
  table.addEventListener('pointermove', e=>{
    if(!drag) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const td = el && el.closest && el.closest('td.wk');
    if(!td || !table.contains(td)) return;
    const r1 = +td.dataset.ri, c1 = +td.dataset.ci;
    if(r1 !== drag.r1 || c1 !== drag.c1){ drag.r1 = r1; drag.c1 = c1; drag.moved = true; previewDrag(table); }
  });
  table.addEventListener('pointercancel', cancelDrag);

  table.addEventListener('click', e=>{
    const td = e.target.closest('td.wk');
    if(!td) return;
    if(state.tool){
      // A mouse has already painted on the way down and up; only a tap gets here to do it.
      if(e.pointerType === 'touch' || e.detail === 0 || isMobile())
        paintRect(f, {r0:+td.dataset.ri, c0:+td.dataset.ci, r1:+td.dataset.ri, c1:+td.dataset.ci});
      return;
    }
    openPop(gridOrder[+td.dataset.ri], gridKeys[+td.dataset.ci], td);
  });
}
function previewDrag(table){
  table.querySelectorAll('.pv').forEach(n=> n.classList.remove('pv','pv-clear'));
  const [ra, rb] = [Math.min(drag.r0, drag.r1), Math.max(drag.r0, drag.r1)];
  const [ca, cb] = [Math.min(drag.c0, drag.c1), Math.max(drag.c0, drag.c1)];
  const st = STAGE[state.tool];
  for(let r = ra; r <= rb; r++){
    const tds = table.querySelectorAll(`td.wk[data-ri="${r}"]`);
    for(let c = ca; c <= cb; c++){
      const td = tds[c];
      if(!td) continue;
      td.classList.add('pv');
      if(state.tool === 'clear') td.classList.add('pv-clear');
      else { td.style.background = st.color; td.style.color = st.ink; }
    }
  }
  // Cells that left the rectangle get their own colour back.
  table.querySelectorAll('td.wk[style]').forEach(td=>{ if(!td.classList.contains('pv')){ td.style.background=''; td.style.color=''; } });
}
function paintRect(f, d){
  const [ra, rb] = [Math.min(d.r0, d.r1), Math.max(d.r0, d.r1)];
  const [ca, cb] = [Math.min(d.c0, d.c1), Math.max(d.c0, d.c1)];
  const keys = gridKeys;
  const kg = state.toolKg === '' ? null : Number(state.toolKg);
  let n = 0;
  const changed = [];
  for(let i = ra; i <= rb; i++){
    const r = f.rows.find(x=> x.id === gridOrder[i]);
    if(!r) continue;
    changed.push(r.id);
    for(let c = ca; c <= cb; c++){
      const k = keys[c];
      if(!k) continue;
      if(state.tool === 'clear') delete r.cells[k];
      else {
        // Painting harvest over a harvest week keeps its kilograms unless new ones are given.
        const old = readCell(r.cells[k]);
        const keepKg = state.tool === 'H' && kg === null && old && old.s === 'H' ? old.kg : kg;
        r.cells[k] = writeCell(state.tool, keepKg);
      }
      n++;
    }
  }
  if(n){ touch(state.member); }
  refreshAfterEdit(f, changed);
}

/* ---- One week's chooser ----------------------------------------------- */
function openPop(rowId, key, td){
  const r = currentFarm().rows.find(x=> x.id === rowId);
  if(!r) return;
  const rect = td.getBoundingClientRect();
  state.pop = {rowId, key, x: rect.left, y: rect.bottom, top: rect.top};
  drawPop();
}
function closePop(){ state.pop = null; const p = document.getElementById('cc-pop'); if(p) p.remove(); markPopWeek(); }
// The week being set is outlined in the grid — on a narrow grid a fingertip
// covers several weeks, so the chooser says which one it has, and its arrows
// move it a week at a time.
function markPopWeek(){
  document.querySelectorAll('.cc-grid td.wk.pp-target').forEach(td=> td.classList.remove('pp-target'));
  if(!state.pop) return;
  const ri = gridOrder.indexOf(state.pop.rowId), ci = gridKeys.indexOf(state.pop.key);
  const td = ri < 0 || ci < 0 ? null : document.querySelector(`.cc-grid td.wk[data-ri="${ri}"][data-ci="${ci}"]`);
  if(td) td.classList.add('pp-target');
}
function popStep(d){
  if(!state.pop) return;
  const i = gridKeys.indexOf(state.pop.key) + d;
  if(i < 0 || i >= gridKeys.length) return;
  state.pop.key = gridKeys[i];
  drawPop();
}
function drawPop(){
  const old = document.getElementById('cc-pop');
  if(old) old.remove();
  if(!state.pop) return;
  const f = currentFarm(), r = f.rows.find(x=> x.id === state.pop.rowId);
  if(!r){ state.pop = null; return; }
  const {y, m, w} = parseWeekKey(state.pop.key);
  const cell = readCell(r.cells[state.pop.key]);
  const el = document.createElement('div');
  el.id = 'cc-pop'; el.className = 'cc-pop'; el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', `Set the stage for ${r.crop}, ${MONTHS[m-1]} ${y} week ${w}`);
  el.innerHTML = `
    <div class="pp-head">
      <div class="pp-title">${esc(r.crop || 'Planting')}${locationText(f, r) ? `<span class="pp-sub">${esc(locationText(f, r))}</span>` : ''}</div>
      <button class="pp-close" onclick="closePop()" aria-label="Close">${icon('close')}</button>
    </div>
    <div class="pp-week">
      <button onclick="popStep(-1)" aria-label="The week before" title="The week before" ${gridKeys.indexOf(state.pop.key) <= 0 ? 'disabled' : ''}>${icon('chevL')}</button>
      <span>${MONTHS[m-1]} ${y}, week ${w}${cell ? ` · <em>${esc(STAGE[cell.s].name)}${cell.s === 'H' && cell.kg ? `, ${fmt(cell.kg)} kg` : ''}</em>` : ''}</span>
      <button onclick="popStep(1)" aria-label="The week after" title="The week after" ${gridKeys.indexOf(state.pop.key) >= gridKeys.length - 1 ? 'disabled' : ''}>${icon('chevR')}</button>
    </div>
    <div class="pp-stages">${STAGES.map(s=>`<button class="pp-stage ${cell && cell.s===s.code?'on':''}" onclick="setCellFromPop('${s.code}')">
        <span class="sw" style="background:${s.color}"></span>${esc(s.name)}</button>`).join('')}</div>
    <div class="pp-kg"><label for="pp-kg">Harvest kg</label>
      <input id="pp-kg" type="number" min="0" step="any" inputmode="decimal" placeholder="kg this week"
        value="${cell && cell.s==='H' && cell.kg !== null ? esc(cell.kg) : ''}" onkeydown="if(event.key==='Enter') setCellFromPop('H')">
      <button class="btn small" onclick="setCellFromPop('H')">Save</button></div>
    <div class="pp-foot">
      ${cell ? `<button class="btn small ghost" onclick="setCellFromPop('')">${icon('eraser')} Clear this week</button>` : ''}
    </div>`;
  document.body.appendChild(el);
  if(!isMobile()){
    const W = 272, H = el.offsetHeight;
    let left = Math.min(state.pop.x, window.innerWidth - W - 12);
    let top = state.pop.y + 6;
    if(top + H > window.innerHeight - 12) top = Math.max(12, state.pop.top - H - 6);
    el.style.left = Math.max(12, left) + 'px'; el.style.top = top + 'px';
  }
  const first = el.querySelector('.pp-stage.on') || el.querySelector('.pp-stage');
  if(first) first.focus({preventScroll:true});
  markPopWeek();
}
function setCellFromPop(code){
  const f = currentFarm(), r = f.rows.find(x=> x.id === state.pop.rowId);
  if(!r) return closePop();
  const k = state.pop.key;
  if(!code) delete r.cells[k];
  else if(code === 'H'){
    const v = (document.getElementById('pp-kg') || {}).value;
    r.cells[k] = writeCell('H', v === '' || v === undefined ? null : Number(v));
  } else r.cells[k] = writeCell(code);
  touch(state.member);
  closePop();
  refreshAfterEdit(f, [r.id]);
}
// A click anywhere else puts the chooser away.
document.addEventListener('pointerdown', e=>{
  if(!state.pop) return;
  const p = document.getElementById('cc-pop');
  if(p && !p.contains(e.target) && !e.target.closest('td.wk')) closePop();
});
window.addEventListener('resize', ()=>{ if(state.pop) closePop(); });

/* ============================================================
   A planting: adding, editing, and filling a run of its weeks
   ============================================================ */
function openEditor(rowId, unitId){
  const f = currentFarm();
  state.fillRow = null; closePop();
  if(rowId){
    state.editRow = editState(f.rows.find(x=> x.id === rowId));
  } else {
    const last = orderedRows(f).slice(-1)[0];
    const unit = unitId || (last ? last.unit : f.units[0].id);
    state.editRow = {id:null, unit, block:'', crop:'', area:'', notes:'', sown:'', moved:'', plants:'', kgpp:'', adj:null, manual:false, variety:''};
  }
  if(state.tab !== 'calendar'){ state.tab = 'calendar'; rememberSession(); }
  render();
  window.scrollTo({top:0, behavior: REDUCED_MOTION ? 'auto' : 'smooth'});
  setTimeout(()=>{ const el = document.getElementById('ed-crop'); if(el) el.focus({preventScroll:true}); }, 60);
}
function editState(r){
  const p = r.plan || {};
  return {id:r.id, unit:r.unit, block:r.block, crop:r.crop, area:r.area || '', notes:r.notes,
          sown:p.sown || '', moved:p.moved || '', plants:p.plants || '', kgpp:p.kgpp != null ? p.kgpp : '',
          adj: p.adj ? Object.assign({}, p.adj) : null, manual: !!p.manual, variety: r.variety || ''};
}
function editorPanel(f){
  const e = state.editRow, u = unitOf(f, e.unit);
  const crops = CROP_GUIDE.map(g=> g.name);         // the crop guide's crops are the ones offered
  const where = [];
  if(showUnits(f)) where.push(`<div><label class="f">${esc(unitWord(f))}</label>
      <select id="ed-unit" onchange="state.editRow.unit=this.value;state.editRow.block='';keepEditor();">
        ${f.units.map(x=> `<option value="${x.id}" ${x.id===e.unit?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`);
  if(u.blocks.length) where.push(`<div><label class="f">Block</label>
      <select id="ed-block" onchange="state.editRow.block=this.value">
        <option value="">Whole ${esc(u.type.toLowerCase())}</option>
        ${u.blocks.map(b=> `<option value="${b.id}" ${b.id===e.block?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`);
  return `<div class="card cc-panel">
    <h3>${e.id ? 'Edit planting' : 'Add a planting'}</h3>
    <p class="helper" style="margin:0 0 12px;">${where.length ? 'Where it is, what it is, and how much ground it takes.'
      : `What it is and how much ground it takes. Your farm is one ${esc(u.type.toLowerCase())}, so there is nowhere to choose.`}</p>
    <div class="grid4">
      ${where.join('')}
      <div><label class="f">Crop</label><input id="ed-crop" list="cc-crops" value="${esc(e.crop)}" placeholder="e.g. Cherry tomato"
        oninput="state.editRow.crop=this.value;guideBoxUpdate()" onkeydown="if(event.key==='Enter') saveEditor()"></div>
      <div><label class="f">Area (m²)</label><input id="ed-area" type="number" min="0" step="any" inputmode="decimal" value="${esc(e.area)}"
        oninput="state.editRow.area=this.value" placeholder="e.g. 500"></div>
      <div style="${where.length >= 2 ? 'grid-column:1/-1;' : ''}"><label class="f">Notes</label><input id="ed-notes" value="${esc(e.notes)}"
        oninput="state.editRow.notes=this.value" placeholder="Variety, spacing, anything worth keeping"></div>
    </div>
    <div id="ed-guide" data-guide="${(()=>{ const g = guideMatch(e.crop); return g ? g.id : e.crop.trim() ? '?' : ''; })()}">${guideBoxHTML()}</div>
    <datalist id="cc-crops">${crops.map(c=> `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="pn-actions">
      <button class="btn" onclick="saveEditor()">${e.id ? 'Save planting' : 'Add planting'}</button>
      <button class="btn small ghost" onclick="state.editRow=null;render();">Cancel</button>
      ${e.id ? `<span class="push"></span>
        <button class="btn small ghost" onclick="openFill('${e.id}')">${icon('fill')} Fill weeks</button>
        <button class="btn small ghost" onclick="archiveRow('${e.id}')">${icon('archive')} Archive</button>
        <button class="btn small ghost" onclick="duplicateRow('${e.id}')">${icon('copy')} Duplicate</button>
        <button class="btn small ghost" style="color:var(--red);" onclick="deleteRow('${e.id}')">${icon('trash')} Delete</button>` : ''}
    </div>
    <p class="helper" id="ed-error" style="color:var(--red);margin-top:8px;"></p>
  </div>`;
}
function keepEditor(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
function saveEditor(){
  const f = currentFarm(), e = state.editRow;
  e.crop = val('ed-crop'); e.area = val('ed-area'); e.notes = val('ed-notes');
  if(!e.crop) return flagError(document.getElementById('ed-error'), 'Pick the crop from the crop guide.');
  if(!guideMatch(e.crop)) return flagError(document.getElementById('ed-error'), `${e.crop} is not in the crop guide. Pick one of its crops — or ask the Secretariat to add it under Crop guide.`);
  if(e.area !== '' && (isNaN(Number(e.area)) || Number(e.area) < 0)) return flagError(document.getElementById('ed-error'), 'Area must be a number of square metres.');
  const u = unitOf(f, e.unit);
  const block = u.blocks.some(b=> b.id === e.block) ? e.block : '';
  const variety = (e.variety && e.variety !== '__other' ? e.variety : '').slice(0, 80);
  // A crop the guide knows, with its date, is planned from the guide — with
  // the farm's own timings, if it gave any — unless the farm plans it by hand.
  const known = guideMatch(e.crop), g = known && !e.manual ? known : null;
  if(known) e.crop = known.name;     // one spelling, so every farm's crop adds up together
  let plan = null, planned = null;
  if(g){
    e.sown = val('ed-sown'); e.moved = val('ed-moved'); e.plants = val('ed-plants'); e.kgpp = val('ed-kgpp');
    const err = msg=> flagError(document.getElementById('ed-error'), msg);
    if(e.plants !== '' && !(Number(e.plants) > 0)) return err(`The number of ${g.tree ? 'trees' : 'plants'} must be a whole number above nought.`);
    if(e.kgpp !== '' && !(Number(e.kgpp) >= 0)) return err('The expected kilograms a plant must be a number.');
    const gv = effGuide(g, null, e.variety);         // with its variety's days
    if(e.adj){ const bad = stagesError(Object.assign(stagesOf(gv), e.adj)); if(bad) return err(bad); }
    const adj = cleanAdj(gv, e.adj);
    if(e.sown){
      planned = planFromGuide(effGuide(g, adj, e.variety), Object.assign({until: calendarEnd()}, e));
      if(planned.error) return err(planned.error);
      plan = {guide:g.id, sown:e.sown, moved:e.moved || '', plants:Number(e.plants) || 0, sig: guideSig(gv)};
      if(e.kgpp !== '') plan.kgpp = Number(e.kgpp);
      if(adj) plan.adj = adj;
    }
  }
  let facts = null;                   // dates and plants kept with a crop the guide does not know
  if(!g){
    e.sown = val('ed-sown'); e.moved = val('ed-moved'); e.plants = val('ed-plants');
    const err = msg=> flagError(document.getElementById('ed-error'), msg);
    if(e.plants !== '' && !(Number(e.plants) > 0)) return err('The number of plants must be a whole number above nought.');
    if(e.sown && e.moved && e.moved < e.sown) return err('It cannot be transplanted before it is sown.');
    if(e.sown || e.moved || e.plants || known) facts = {guide:'', sown:e.sown || '', moved:e.moved || '', plants:Number(e.plants) || 0};
    if(known) facts.manual = true;
  }
  const planText = ()=>{
    const p = planned, yr = p.hWeeks && p.firstH.getFullYear() !== p.lastH.getFullYear();
    const when = !p.hWeeks ? 'growing on with no harvest in these three years' : p.hWeeks === 1 ? `harvest ${dayText(p.firstH, true)}` : `harvest ${dayText(p.firstH, yr)} – ${dayText(p.lastH, true)}`;
    const kg = !p.hWeeks ? '' : p.total != null ? `, ${fmt(p.total)} kg`
      : p.plants ? ' — give the expected kg a plant to work out its kilograms' : ' — add the number of plants to work out its kilograms';
    const off = Object.keys(p.cells).some(k=> !farmWindow(f).some(mo=> mo.keys.includes(k)))
      ? ' Some of its weeks fall outside the three years on screen; move the calendar on to see them.' : '';
    const start = g.tree ? '' : g.direct ? `planted ${dayText(p.sown, false)}, ` : `sown ${dayText(p.sown, false)}, transplanted ${dayText(p.moved, false)}, `;
    return `${start}${when}${kg}.${off}`;
  };
  if(e.id){
    const r = f.rows.find(x=> x.id === e.id);
    const same = r.plan && plan && ['guide', 'sown', 'moved', 'plants', 'kgpp'].every(k=> r.plan[k] === plan[k])
      && JSON.stringify(r.plan.adj || null) === JSON.stringify(plan.adj || null) && (r.variety || '') === variety;
    if(same && r.plan.sig) plan.sig = r.plan.sig;    // the weeks were planned from those figures, and are kept
    if(plan && !same){
      const n = Object.keys(r.cells).length;
      if(n && !confirm(`Plan ${e.crop} again from the crop guide? Its ${n} coloured week${n===1?'':'s'} will be replaced by the new plan.`)) return;
      r.cells = planned.cells;
    }
    Object.assign(r, {unit:u.id, block, crop:e.crop, area:Number(e.area)||0, notes:e.notes});
    if(variety) r.variety = variety; else delete r.variety;
    if(plan) r.plan = plan; else if(facts) r.plan = facts; else delete r.plan;
    state.calMsg = plan && !same ? `${CHECK_ICON} ${esc(e.crop)} planned again: ${planText()}`
      : known && e.manual ? `${CHECK_ICON} ${esc(e.crop)} saved. Its weeks are yours to colour — pick a stage above the calendar and click or drag across them.`
      : `${CHECK_ICON} ${esc(e.crop)} saved.`;
    if(plan && !same){ showPlanStart(f, plan.sown); state.growRow = r.id; }
    state.editRow = null;
  } else {
    const r = {id:uid('r'), unit:u.id, block, crop:e.crop, area:Number(e.area)||0, notes:e.notes, cells: plan ? planned.cells : {}};
    if(variety) r.variety = variety;
    if(plan) r.plan = plan; else if(facts) r.plan = facts;
    f.rows.push(r);
    state.editRow = null;
    if(plan){
      showPlanStart(f, plan.sown);
      state.growRow = r.id;
      state.calMsg = `${CHECK_ICON} ${esc(e.crop)} planned from the crop guide: ${planText()} Click or tap any week to change it.`;
    } else {
      // The next thing a new planting needs is its weeks.
      openFillState(f, r);
      state.calMsg = `${CHECK_ICON} ${esc(e.crop)} added. Now give it its weeks — fill a run below, or pick a stage and colour them on the grid.`;
    }
  }
  touch(state.member);
  render();
}
function duplicateRow(id){
  const f = currentFarm(), r = f.rows.find(x=> x.id === id);
  if(!guideMatch(r.crop)) return showFatal(`${r.crop || 'This planting'} is not in the crop guide, so it cannot be copied. Edit it to choose a crop from the guide, or archive it.`);
  const copy = JSON.parse(JSON.stringify(r));
  copy.id = uid('r');
  f.rows.splice(f.rows.indexOf(r) + 1, 0, copy);
  state.editRow = editState(copy);
  state.calMsg = `${CHECK_ICON} Copied ${esc(r.crop)}, weeks and all. Change what differs, or clear its weeks and plan the next cycle.`;
  touch(state.member);
  render();
}
function deleteRow(id){
  const f = currentFarm(), r = f.rows.find(x=> x.id === id);
  const n = Object.keys(r.cells).length;
  if(!confirm(`Delete ${r.crop || 'this planting'}${n ? ` and its ${n} coloured week${n===1?'':'s'}` : ''}? This cannot be undone.`)) return;
  f.rows = f.rows.filter(x=> x.id !== id);
  state.editRow = null;
  state.calMsg = `${esc(r.crop || 'The planting')} was deleted.`;
  touch(state.member);
  render();
}

/* ---- Fill a run of weeks --------------------------------------------
   The way to plan on a phone, and the quick way anywhere: one stage, from
   one week to another, with kilograms for each harvest week. */
function openFill(rowId){
  const f = currentFarm(), r = f.rows.find(x=> x.id === rowId);
  state.editRow = null; closePop();
  openFillState(f, r);
  render();
  window.scrollTo({top:0, behavior: REDUCED_MOTION ? 'auto' : 'smooth'});
}
function openFillState(f, r){
  const keys = farmWindow(f).flatMap(mo=> mo.keys);
  // Start after the last coloured week, or at this week, or at the window's start.
  const used = keys.filter(k=> r.cells[k]);
  let from = used.length ? keys.indexOf(used[used.length-1]) + 1 : keys.indexOf(todayKey());
  if(from < 0 || from >= keys.length) from = 0;
  const lastStage = used.length ? readCell(r.cells[used[used.length-1]]).s : null;
  const next = lastStage ? STAGES[Math.min(STAGES.length-1, STAGES.findIndex(s=> s.code === lastStage) + 1)].code : 'L';
  state.fillRow = {id:r.id, stage:next, from, to:Math.min(keys.length-1, from + 3), kg:''};
}
function weekOptions(keys, sel){
  return keys.map((k, i)=>{ const {y, m, w} = parseWeekKey(k);
    return `<option value="${i}" ${i===sel?'selected':''}>${MONTH_ABBR[m-1]} ${y} · wk ${w}</option>`; }).join('');
}
function fillPanel(f){
  const s = state.fillRow, r = f.rows.find(x=> x.id === s.id);
  if(!r){ state.fillRow = null; return ''; }
  const keys = farmWindow(f).flatMap(mo=> mo.keys);
  const n = Math.abs(s.to - s.from) + 1;
  const fmsg = state.fillMsg; state.fillMsg = '';
  return `<div class="card cc-panel cc-fill">
    ${fmsg ? `<div class="import-result" style="margin:0 0 10px;">${fmsg}</div>` : ''}
    <h3>Fill weeks · ${esc(r.crop)}${locationText(f, r) ? ` <span style="font-weight:400;color:var(--muted);font-size:13px;">${esc(locationText(f, r))}</span>` : ''}</h3>
    <p class="helper" style="margin:0 0 12px;">Choose a stage and the first and last week it covers. Do it once for each stage.</p>
    <div class="cc-fill-grid">
      <div><label class="f">Stage</label><select onchange="state.fillRow.stage=this.value;keepEditor();">
        ${STAGES.map(st=> `<option value="${st.code}" ${s.stage===st.code?'selected':''}>${esc(st.name)}</option>`).join('')}
        <option value="clear" ${s.stage==='clear'?'selected':''}>Clear these weeks</option></select></div>
      <div><label class="f">From</label><select onchange="state.fillRow.from=+this.value;if(state.fillRow.to<state.fillRow.from)state.fillRow.to=state.fillRow.from;keepEditor();">${weekOptions(keys, s.from)}</select></div>
      <div><label class="f">To</label><select onchange="state.fillRow.to=+this.value;keepEditor();">${weekOptions(keys, s.to)}</select></div>
      <div>${s.stage === 'H' ? `<label class="f">kg each week</label><input id="fill-kg" type="number" min="0" step="any" inputmode="decimal"
        value="${esc(s.kg)}" oninput="state.fillRow.kg=this.value" placeholder="optional">`
        : `<label class="f">Weeks</label><div style="padding:11px 0;font-weight:600;color:var(--deep-green);">${n}</div>`}</div>
    </div>
    <div class="pn-actions">
      <button class="btn" onclick="applyFill()">${s.stage==='clear' ? 'Clear' : 'Fill'} ${n} week${n===1?'':'s'}</button>
      <button class="btn small ghost" onclick="state.fillRow=null;render();">Done</button>
    </div>
  </div>`;
}
function applyFill(){
  const f = currentFarm(), s = state.fillRow, r = f.rows.find(x=> x.id === s.id);
  const keys = farmWindow(f).flatMap(mo=> mo.keys);
  const [a, b] = [Math.min(s.from, s.to), Math.max(s.from, s.to)];
  const kg = s.kg === '' ? null : Number(s.kg);
  for(let i = a; i <= b; i++){
    if(s.stage === 'clear') delete r.cells[keys[i]];
    else r.cells[keys[i]] = writeCell(s.stage, kg);
  }
  touch(state.member);
  // Move on to the next stage, starting the week after — planning a whole
  // crop is then a run of presses of the same button.
  if(s.stage !== 'clear'){
    const idx = STAGES.findIndex(st=> st.code === s.stage);
    const nextFrom = Math.min(keys.length - 1, b + 1);
    state.fillRow = {id:r.id, stage: STAGES[Math.min(STAGES.length-1, idx+1)].code, from: nextFrom,
                     to: Math.min(keys.length-1, nextFrom + 3), kg: ''};
    state.fillMsg = `${CHECK_ICON} ${esc(STAGE[s.stage].name)} set for ${b-a+1} week${b===a?'':'s'}. The next stage is ready.`;
  }
  const panel = document.querySelector('.cc-panel.cc-fill');
  if(!panel || !document.querySelector('.cc-grid:not(.readonly)')){ render(); return; }
  refreshAfterEdit(f, [r.id]);
  // The panel itself stays; only what is inside it changes. Swapping the card
  // would replay its entrance and make the browser restyle every card after
  // it — the grid's thousands of cells among them.
  const tmp = document.createElement('div');
  tmp.innerHTML = fillPanel(f);
  panel.innerHTML = tmp.firstElementChild.innerHTML;
}

/* ============================================================
   Greenhouses & blocks
   Optional. Three common cases are drawn so a farm can recognise its
   own, and the current one is marked — but there is no switch between
   them: adding a second greenhouse, or a block, is all it takes.
   ============================================================ */
function renderLayout(c){
  const f = currentFarm();
  const nb = f.units.reduce((n, u)=> n + u.blocks.length, 0);
  const caseNow = showUnits(f) ? 'many' : nb ? 'blocks' : 'one';
  const cases = [
    ['one',    'One greenhouse', 'Nothing to set up. Your calendar has no greenhouse or block column — every planting is simply on the farm.', '<span></span>', ''],
    ['many',   'Several greenhouses', 'Add each by its name or number (GH 2, North house…). Plantings are grouped under the greenhouse they are in.', '<span></span><span></span><span></span>', ''],
    ['blocks', 'One large greenhouse in blocks', 'Add blocks to it (Block A, Bay 1…). A Block column appears, and each planting is placed in one.', '<span></span><span></span><span></span><span></span>', 'blocks'],
  ];
  c.innerHTML = `
    <h1 class="page-title">Greenhouses &amp; blocks</h1>
    <p class="page-sub">Optional — set this up only if your farm is more than one greenhouse, or one greenhouse divided into blocks</p>
    <div class="card">
      <div class="lay-cases">${cases.map(([k, t, p, pic, cls])=> `<div class="lay-case ${caseNow===k?'is-current':''}">
          <div class="lay-pic ${cls}">${pic}</div><h4>${t}</h4><p>${p}</p>
          ${caseNow===k ? '<span class="lc-now">Your farm now</span>' : ''}</div>`).join('')}</div>
      <p class="helper" style="margin:12px 0 0;">Both at once works too: several greenhouses, any of them in blocks. Open fields and screenhouses are set the same way.
        However you divide it, your calendar exports to the same template as everyone else's.</p>
    </div>

    <div class="section-label">Your ${esc(unitWord(f, true))}</div>
    ${f.units.map((u, i)=> unitCard(f, u, i)).join('')}
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <button class="btn" onclick="addUnits(1)">${icon('plus')} Add another greenhouse</button>
      <span class="block-add"><span class="helper" style="margin:0;">or add</span>
        <input id="add-units-n" type="number" min="1" max="50" value="3" aria-label="How many to add">
        <button class="btn small ghost" onclick="addUnits(Number(val('add-units-n'))||0)">at once</button></span>
    </div>

    <div class="section-label">Farm details</div>
    <div class="card"><div class="grid4">
      <div><label class="f">Farm name</label><input value="${esc(f.name)}" onchange="setFarmField('name', this.value)"></div>
      <div><label class="f">Contact person</label><input value="${esc(f.contact)}" onchange="setFarmField('contact', this.value)"></div>
      <div><label class="f">Phone</label><input value="${esc(f.phone)}" onchange="setFarmField('phone', this.value)"></div>
      <div><label class="f">Location</label><input value="${esc(f.location)}" onchange="setFarmField('location', this.value)"></div>
    </div><p class="helper" style="margin:4px 0 0;">The farm name heads your exported calendar, as [Farm name] does on the template.</p></div>`;
}
function unitCard(f, u, i){
  const n = liveRows(f).filter(r=> r.unit === u.id).length;
  return `<div class="card unit-card">

function setFarmField(k, v){ const f = currentFarm(); f[k] = v.trim(); touch(state.member); renderKeepingPlace(); }
function addUnits(n){
  if(!(n >= 1)) return;
  const f = currentFarm(), type = f.units[f.units.length-1].type;
  const count = f.units.filter(u=> u.type === type).length;
  for(let i = 1; i <= Math.min(n, 50); i++) f.units.push(blankUnit(count + i, type));
  touch(state.member); renderKeepingPlace();
}
function renameUnit(id, v){
  const f = currentFarm(), u = unitOf(f, id), name = v.trim();
  if(name) u.name = name;
  touch(state.member); renderKeepingPlace();
}
function setUnitType(id, type){
  const f = currentFarm(), u = unitOf(f, id);
  // "Greenhouse 2" becomes "Open field 2"; a name the farm chose is left alone.
  const m = u.name.match(new RegExp('^' + u.type.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ' (\\d+)$'));
  if(m) u.name = `${type} ${m[1]}`;
  u.type = type;
  touch(state.member); renderKeepingPlace();
}
function removeUnit(id){
  const f = currentFarm(), u = unitOf(f, id);
  const rows = f.rows.filter(r=> r.unit === id);
  const into = f.units.find(x=> x.id !== id);
  if(!confirm(rows.length ? `Remove ${u.name}? Its ${rows.length} planting${rows.length===1?'':'s'} will move to ${into.name}, weeks and all.`
                          : `Remove ${u.name}?`)) return;
  rows.forEach(r=>{ r.unit = into.id; r.block = ''; });
  f.units = f.units.filter(x=> x.id !== id);
  touch(state.member); renderKeepingPlace();
}
function addBlocks(unitId, n){
  if(!(n >= 1)) return;
  const f = currentFarm(), u = unitOf(f, unitId);
  // Block A, B, C … continuing from what is there; past Z, numbers.
  for(let i = 0; i < Math.min(n, 60); i++){
    const k = u.blocks.length;
    u.blocks.push({id:uid('b'), name: k < 26 ? `Block ${String.fromCharCode(65 + k)}` : `Block ${k + 1}`});
  }
  touch(state.member); renderKeepingPlace();
}
function renameBlock(unitId, blockId, v){
  const u = unitOf(currentFarm(), unitId), b = blockOf(u, blockId), name = v.trim();
  if(b && name) b.name = name;
  touch(state.member); renderKeepingPlace();
}
function removeBlock(unitId, blockId){
  const f = currentFarm(), u = unitOf(f, unitId), b = blockOf(u, blockId);
  const rows = f.rows.filter(r=> r.block === blockId);
  if(rows.length && !confirm(`Remove ${b.name}? Its ${rows.length} planting${rows.length===1?'':'s'} stay on the calendar, placed in the whole ${u.type.toLowerCase()}.`)) return;
  rows.forEach(r=> r.block = '');
  u.blocks = u.blocks.filter(x=> x.id !== blockId);
  touch(state.member); renderKeepingPlace();
}

/* ---- The crop guide changed after a planting was planned ------------------
   Each plan keeps a fingerprint of the figures it was made from. When the
   Secretariat changes them, the planting offers to be planned again — with
   the same dates, plants and the farm's own timings — and nothing changes
   until the farm says so. */
function guideChanged(r){
  const p = r.plan, g = p && p.guide && !p.manual ? guideFor(p.guide) : null;
  return !!(g && p.sig && p.sown && guideSig(effGuide(g, null, r.variety)) !== p.sig);
}
function replanRow(id){
  const f = currentFarm(), r = f.rows.find(x=> x.id === id);
  const g = r && r.plan ? guideFor(r.plan.guide) : null;
  if(!g) return;
  const p = planFromGuide(effGuide(g, r.plan.adj, r.variety), Object.assign({until: calendarEnd()}, r.plan));
  if(p.error) return showFatal(`${r.crop} could not be planned again: ${p.error}`);
  const n = Object.keys(r.cells).length;
  if(!confirm(`The crop guide for ${g.name} has changed since this planting was planned.\n\nPlan it again with the new figures? Its ${n} coloured week${n === 1 ? '' : 's'} will be replaced. Your dates, plants${r.plan.adj ? ' and your own timings' : ''} are kept.`)) return;
  r.cells = p.cells;
  r.plan.sig = guideSig(effGuide(g, null, r.variety));
  state.growRow = r.id;
  state.calMsg = `${CHECK_ICON} ${esc(r.crop)} planned again with the crop guide’s new figures${p.total != null ? `: ${fmt(p.total)} kg` : ''}.`;
  touch(state.member);
  render();
}

/* ============================================================
   The archive
   A planting whose season is over is archived: it leaves the calendar and
   its totals, and is kept here with its dates, plants and harvest, to be
   restored or deleted. Nothing about it changes by being archived.
   ============================================================ */
function archiveRow(id){
  const f = currentFarm(), r = f.rows.find(x=> x.id === id);
  if(!r) return;
  if(!confirm(`Archive ${r.crop || 'this planting'}?\n\nIt leaves the calendar and its totals, and is kept under Archive with its dates and harvest. You can restore it at any time.`)) return;
  r.archived = new Date().toISOString();
  if(state.editRow && state.editRow.id === id) state.editRow = null;
  if(state.fillRow && state.fillRow.id === id) state.fillRow = null;
  state.calMsg = `${CHECK_ICON} ${esc(r.crop || 'The planting')} archived. It is kept under <a href="#" onclick="switchTab('archive');return false;">Archive</a>.`;
  touch(state.member);
  render();
}
function restoreRow(id){
  const f = currentFarm(), r = f.rows.find(x=> x.id === id);
  if(!r) return;
  delete r.archived;
  state.archMsg = `${CHECK_ICON} ${esc(r.crop || 'The planting')} is back on the calendar.`;
  touch(state.member);
  render();
}
function deleteArchived(id){
  const f = currentFarm(), r = f.rows.find(x=> x.id === id);
  if(!r || !confirm(`Delete ${r.crop || 'this planting'} from the archive for good? This cannot be undone.`)) return;
  f.rows = f.rows.filter(x=> x.id !== id);
  state.archMsg = `${esc(r.crop || 'The planting')} was deleted.`;
  touch(state.member);
  render();
}
// A planting's season in a few facts, from its plan and its weeks.
function seasonFacts(r){
  const ks = Object.keys(r.cells).filter(k=> readCell(r.cells[k])).sort(weekOrder);
  const hs = ks.filter(k=> readCell(r.cells[k]).s === 'H');
  const kg = hs.reduce((t, k)=> t + (readCell(r.cells[k]).kg || 0), 0);
  const wk = k=>{ const {y, m} = parseWeekKey(k); return `${MONTH_ABBR[m-1].charAt(0) + MONTH_ABBR[m-1].slice(1).toLowerCase()} ${y}`; };
  const p = r.plan || {};
  return {
    sown: p.sown ? dayText(parseDay(p.sown), true) : ks.length ? wk(ks[0]) : '—',
    moved: p.moved ? dayText(parseDay(p.moved), true) : '',
    harvest: hs.length ? (wk(hs[0]) === wk(hs[hs.length-1]) ? wk(hs[0]) : `${wk(hs[0])} – ${wk(hs[hs.length-1])}`) : '—',
    kg, plants: p.plants || 0,
  };
}
function archiveTableHTML(f, rows, ro){
  return `<table class="grid-table arch-table">
    <thead><tr><th>Crop</th><th>Sown</th><th>Harvest</th><th>Plants</th><th>Harvest kg</th><th>Archived</th>${ro ? '' : '<th></th>'}</tr></thead>
    <tbody>${rows.map(r=>{ const s = seasonFacts(r), where = locationText(f, r);
      return `<tr>
        <td><strong>${esc(r.crop || '—')}</strong>${r.variety ? ` <span class="helper" style="margin:0;">${esc(r.variety)}</span>` : ''}${where || r.area ? `<div class="helper" style="margin:2px 0 0;">${esc([where, r.area ? fmt(r.area) + ' m²' : ''].filter(Boolean).join(' · '))}</div>` : ''}</td>
        <td>${esc(s.sown)}${s.moved ? `<div class="helper" style="margin:2px 0 0;">transplanted ${esc(s.moved)}</div>` : ''}</td>
        <td>${esc(s.harvest)}</td>
        <td>${s.plants ? fmt(s.plants) : '—'}</td>
        <td>${s.kg ? `<strong>${fmt(Math.round(s.kg * 10) / 10)}</strong>` : '—'}</td>
        <td>${esc(dayText(new Date(r.archived), true))}</td>
        ${ro ? '' : `<td class="row-actions"><button class="btn small ghost" onclick="restoreRow('${r.id}')">${icon('restore')} Restore</button>
          <button class="btn small ghost danger" onclick="deleteArchived('${r.id}')">${icon('trash')} Delete</button></td>`}
      </tr>`; }).join('')}</tbody></table>`;
}
function renderArchive(c){
  const f = currentFarm();
  const rows = archivedRows(f).sort((a, b)=> String(b.archived).localeCompare(String(a.archived)));
  const msg = state.archMsg; state.archMsg = '';
  const kg = rows.reduce((t, r)=> t + seasonFacts(r).kg, 0);
  c.innerHTML = `
    <h1 class="page-title">Archive</h1>
    <p class="page-sub">${esc(f.name)} · plantings whose season is over, kept with their dates, plants and harvest</p>
    <div class="grid4">
      <div class="metric"><div class="lbl">Archived plantings</div><div class="val" data-count="${rows.length}">0</div></div>
      <div class="metric"><div class="lbl">Harvest recorded</div><div class="val"><span data-count="${Math.round(kg)}">0</span><span style="font-size:14px;color:var(--muted);"> kg</span></div></div>
      <div class="metric"><div class="lbl">Plants</div><div class="val" data-count="${rows.reduce((t, r)=> t + seasonFacts(r).plants, 0)}">0</div></div>
      <div class="metric"><div class="lbl">On the calendar now</div><div class="val" data-count="${liveRows(f).length}">0</div></div>
    </div>
    ${msg ? `<div class="msg-banner">${msg}</div>` : ''}
    ${rows.length ? `<div class="card" style="overflow-x:auto;">${archiveTableHTML(f, rows, false)}</div>`
      : emptyState('Nothing archived yet', 'When a planting’s season is over, archive it from the calendar — the box button beside it, or Archive in its editor. It is kept here with its dates and harvest, and can be restored.')}`;
}

function sanitiseGuide(list){
  if(!Array.isArray(list)) return null;
  return list.filter(g=> g && g.id && g.name && g.harvest && g.harvest.kind).map(g=>{
    const x = cloneGuide(g);
    x.names = [...new Set([cropKey(x.name), ...(x.names || []).map(cropKey)].filter(Boolean))];
    return x;

}
/* Built-in crops the Secretariat removed. The saved guide keeps a short

let GUIDE_REMOVED_BY_ADMIN = [];

  const all = Array.isArray(list) ? list : [];
  GUIDE_REMOVED_BY_ADMIN = [...new Set(all.filter(g=> g && g.removed && g.id).map(g=> String(g.id)))];
  const s = sanitiseGuide(all.filter(g=> !(g && g.removed)));

   to this edition are added, unless the Secretariat already added its own. */

  const out = list.filter(g=> g.custom || (!GUIDE_REMOVED.includes(g.id) && !GUIDE_REMOVED_BY_ADMIN.includes(g.id))).map(g=>{
    const d = CROP_GUIDE_DEFAULT.find(x=> x.id === g.id);
    return !d || g.custom || g.edited || g.ed === GUIDE_EDITION ? g : cloneGuide(d);
  });
  const custom = new Set(out.filter(g=> g.custom).flatMap(g=> g.names));
  CROP_GUIDE_DEFAULT.forEach(d=>{
    if(!out.some(g=> g.id === d.id) && !GUIDE_REMOVED_BY_ADMIN.includes(d.id) && !d.names.some(n=> custom.has(n))) out.push(cloneGuide(d));
  });

  const fresh = new Set(out.filter(g=> g.ed === GUIDE_EDITION && !g.custom).flatMap(g=> g.names));

  if(h.kind === 'single') picks.push([firstH, h.kg]);
  if(h.kind === 'picking'){
    for(let d = firstH; d < seasonEnd; d = addDays(d, 7)) picks.push([d, null]);
    if(!picks.length) picks.push([firstH, null]);
    const each = h.seasonKg != null ? h.seasonKg / picks.length : null;
    picks.forEach(x=> x[1] = each);
  }
  // Where the guide has no kilograms, the farm's own figure for a plant is
  // shared evenly over the harvest weeks.
  if(!guideHasYield(g)) picks.forEach(x=> x[1] = ownKg != null ? ownKg / picks.length : null);
  picks.forEach(([d, kg])=> put(d, 'H', kg));

  const cells = cellsOf(acc, plants);
  const perPlant = picks.every(x=> x[1] != null) ? picks.reduce((t, x)=> t + x[1], 0) : null;
  return Object.assign(out, {cells, moved, firstH, lastH: addDays(picks[picks.length - 1][0], 6), hWeeks: picks.length,
    perPlant, total: perPlant != null && plants ? Math.round(perPlant * plants * 10) / 10 : null});
}

// Each harvest week is rounded to 0.1 kg; what the rounding gains or loses is
// settled in the last harvest week, so the weeks add up to the plan's total.
function cellsOf(acc, plants){
  const cells = {}, r1 = x=> Math.round(x * 10) / 10;
  let exact = 0, shown = 0, last = null;
  Object.keys(acc).sort(weekOrder).forEach(k=>{
    const v = acc[k];
    if(v.s === 'H' && plants && v.kg != null){
      const kg = r1(v.kg * plants);
      exact += v.kg * plants; shown += kg; last = k;
      cells[k] = writeCell('H', kg);
    } else cells[k] = v.s === 'H' ? writeCell('H', null) : writeCell(v.s);
  });
  if(last){ const fix = r1(r1(exact) - shown); if(fix) cells[last] = writeCell('H', r1(readCell(cells[last]).kg + fix)); }
  return cells;
}
function weekOrder(a, b){ const x = parseWeekKey(a), y = parseWeekKey(b); return (x.y - y.y) || (x.m - y.m) || (x.w - y.w); }
// The day after the calendar's three years, for a crop that grows on past them.
function calendarEnd(){ const f = currentFarm(); return new Date((f && f.startYear || DEFAULT_START_YEAR) + 3, 0, 1); }

  if(s.kind !== 'none') parts.push(`harvest ${s.hWeeks === 1 ? 'once' : `over ${s.hWeeks} weeks`}`);

// Where a crop's figures come from, in words.

  if(g.custom || g.edited) return `Timing: ${stagesText(g)}. ${kg}${g.timingNote ? ' ' + cap(g.timingNote) + '.' : ''} Figures set by the Secretariat.`;
  const parts = [], r = g.ranges, w = g.stageWords || {};
  if(r){
    const t = [];
    if(r.nursery) t.push(`nursery ${r.nursery}`);
    if(r.veg) t.push(`transplanting ${w.veg || 'to the first flowers'} ${r.veg}`);
    if(r.flower) t.push(`${w.flower || 'flowering and fruit set to the first harvest'} ${r.flower}`);

    if(r.window) t.push(`harvest ${r.window}`);

  if(g.src === 'rz' || g.src === 'general') out += ' In cool highlands (Iringa in June–August) expect the upper end of each range, or 10–25% longer.';

}

// The month a plan starts in, so the calendar can be turned to it.
function showPlanStart(f, sown){
  const d = parseDay(sown);
  if(!d) return false;
  const idx = (d.getFullYear() - f.startYear) * 12 + d.getMonth();
  if(idx < 0 || idx >= WINDOW_MONTHS) return false;
  const n = viewSpan();
  state.spanAt = n >= WINDOW_MONTHS ? 0 : Math.floor(idx / n) * n;
  return true;
}

/* ============================================================
   The calendar in days
   Each planting as one line across the days it takes, from land preparation
   to its last harvest, every stage at its own dates. The days shown fit
   every planting from its first day to its last — across the turn of a year
   if a season runs on — so a season is never cut in two and nothing has to
   be paged through. A planting planned from the crop guide and not changed
   by hand since is drawn to the day; one coloured by hand is drawn by its
   weeks (the template's fourth week running to the month's end).
   The weeks themselves are still what is stored, exported and added up, as
   in the TIPFA template; the Weeks view shows and colours them.
   ============================================================ */
const DAY_MS = 864e5;
// Whole days since 1970, free of clock changes.
function dayNo(d){ return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS); }
function dayOf(n){ const d = new Date(n * DAY_MS); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
function weekSpan(k){
  const {y, m, w} = parseWeekKey(k);
  return [new Date(y, m - 1, 1 + 7 * (w - 1)), w < 4 ? new Date(y, m - 1, 7 * w) : new Date(y, m, 0)];
}

function calView(){
  if(!state.calView){
    let v = 'days';
    try{ v = localStorage.getItem('tipfa-cc-view') || 'days'; }catch(e){}
    state.calView = v === 'weeks' ? 'weeks' : 'days';
  }
  return state.calView;
}
function setCalView(v){
  state.calView = v;
  try{ localStorage.setItem('tipfa-cc-view', v); }catch(e){}
  state.tool = null; closePop(); state.scroll = null;
  renderKeepingPlace();
}

  const v = calView();
  return `<div class="cc-viewswitch" role="group" aria-label="Show the calendar in">
    <button class="${v === 'days' ? 'on' : ''}" aria-pressed="${v === 'days'}" onclick="setCalView('days')" title="Every planting at its dates, the whole season at once">Days</button>
    <button class="${v === 'weeks' ? 'on' : ''}" aria-pressed="${v === 'weeks'}" onclick="setCalView('weeks')" title="The template's weeks, to colour by hand">Weeks</button></div>`;
