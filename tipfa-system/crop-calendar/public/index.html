/* ============================================================
   Reading a filled-in template back
   The headings are found by name, not by position, so a sheet with a row
   inserted above, or columns moved, still reads. A week's colour gives its
   stage, matched to the nearest colour in the key; a number in a week is
   harvest kilograms — the template's own totals count every number, so
   treating each as a harvest keeps this calendar adding up the same.
   ============================================================ */
function cellText(c){
  const v = c && c.value;
  if(v === null || v === undefined) return '';
  if(typeof v === 'object'){
    if(v.richText) return v.richText.map(t=> t.text).join('').trim();
    if(v.text) return String(v.text).trim();
    if('result' in v) return String(v.result ?? '').trim();
    return '';
  }
  return String(v).trim();
}
function cellNumber(c){
  const v = c && c.value;
  if(typeof v === 'number') return v;
  if(v && typeof v === 'object' && typeof v.result === 'number') return v.result;
  if(typeof v === 'string' && v.trim() && !isNaN(Number(v.replace(/,/g,'')))) return Number(v.replace(/,/g,''));
  return null;
}
function hexToRgb(h){ h = h.replace('#','').slice(-6); return [0,2,4].map(i=> parseInt(h.slice(i, i+2), 16)); }
function stageFromFill(fill){
  if(!fill || fill.type !== 'pattern' || fill.pattern === 'none') return {stage:null, coloured:false};
  const col = (fill.fgColor && fill.fgColor.argb) || (fill.bgColor && fill.bgColor.argb);
  if(!col) return {stage:null, coloured: !!(fill.fgColor && fill.fgColor.theme !== undefined)};
  const rgb = hexToRgb(col);
  if(rgb.every(v=> v > 235)) return {stage:null, coloured:false};          // white, or the zebra tint
  let best = null, bestD = Infinity;
  STAGES.forEach(s=>{
    const t = hexToRgb(s.color);
    const d = Math.sqrt(t.reduce((a, v, i)=> a + (v - rgb[i])**2, 0));
    if(d < bestD){ bestD = d; best = s.code; }
  });
  return bestD <= 70 ? {stage:best, coloured:true} : {stage:null, coloured:true};
}

function parseTemplateSheet(ws){
  const MONTH_RE = new RegExp('^(' + MONTH_ABBR.join('|') + ')[A-Z]*\\s+(\\d{4})$', 'i');
  let hdr = null;
  for(let rn = 1; rn <= Math.min(15, ws.rowCount); rn++){
    const row = ws.getRow(rn);
    let crop = -1, firstMonth = -1;
    row.eachCell({includeEmpty:false}, (c, cn)=>{
      const t = cellText(c).toUpperCase();
      if(t === 'CROP' && crop < 0) crop = cn;
      if(MONTH_RE.test(t) && firstMonth < 0) firstMonth = cn;
    });
    if(crop > 0 && firstMonth > 0){ hdr = {rn, crop, firstMonth}; break; }
  }
  if(!hdr) return null;

  const head = ws.getRow(hdr.rn);
  const findCol = (re)=>{ let f = -1; head.eachCell({includeEmpty:false}, (c, cn)=>{ if(f < 0 && cn < hdr.firstMonth && re.test(cellText(c).toUpperCase())) f = cn; }); return f; };
  const cols = {unit: findCol(/GREENHOUSE|^UNIT|^HOUSE/), block: findCol(/SECTION|^BLOCK/), crop: hdr.crop,
                area: findCol(/AREA/), notes: findCol(/NOTE/)};

  // Each week column's date, from the month above it and its 1–4 below.
  const weekRow = ws.getRow(hdr.rn + 1);
  const colKey = {};
  let cur = null;
  for(let cn = hdr.firstMonth; cn <= ws.columnCount; cn++){
    const hc = head.getCell(cn);
    if(!hc.isMerged || hc.master === hc){
      const m = cellText(hc).toUpperCase().match(MONTH_RE);
      if(m) cur = {y:Number(m[2]), m: MONTH_ABBR.indexOf(m[1].slice(0,3).toUpperCase()) + 1};
    }
    if(!cur) continue;
    const w = cellNumber(weekRow.getCell(cn));
    if(w >= 1 && w <= 4) colKey[cn] = weekKey(cur.y, cur.m, w);
  }
  const weekCols = Object.keys(colKey).map(Number);
  if(!weekCols.length) return null;

  const plantings = [];
  let unrecognised = 0;
  for(let rn = hdr.rn + 2; rn <= ws.rowCount; rn++){
    const row = ws.getRow(rn);
    const first = cellText(row.getCell(1)).toUpperCase();
    if(/^TOTAL HARVEST|^HARVEST BY CROP|^KEY\b/.test(first)) break;
    const p = {
      unit: cols.unit > 0 ? cellText(row.getCell(cols.unit)) : '',
      block: cols.block > 0 ? cellText(row.getCell(cols.block)) : '',
      crop: cellText(row.getCell(cols.crop)),
      area: cols.area > 0 ? (cellNumber(row.getCell(cols.area)) || 0) : 0,
      notes: cols.notes > 0 ? cellText(row.getCell(cols.notes)) : '',
      cells: {},
    };
    weekCols.forEach(cn=>{
      const c = row.getCell(cn);
      const kg = cellNumber(c);
      const {stage, coloured} = stageFromFill(c.fill);
      if(kg !== null && kg > 0) p.cells[colKey[cn]] = writeCell('H', kg);
      else if(stage) p.cells[colKey[cn]] = writeCell(stage);
      else if(coloured) unrecognised++;
    });
    if(p.crop || Object.keys(p.cells).length) plantings.push(p);
  }
  const years = Object.values(colKey).map(k=> parseWeekKey(k).y);
  return {plantings, unrecognised, firstYear: Math.min(...years), sheet: ws.name};
}

async function importFarmExcel(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const done = (msg, bad)=>{ state.importMsg = msg; state.importBad = !!bad; renderKeepingPlace(); };
  try{
    const ExcelJS = await loadExcel();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    let parsed = null;
    for(const ws of wb.worksheets){ parsed = parseTemplateSheet(ws); if(parsed) break; }
    if(!parsed) return done('That file does not look like the crop calendar template — no sheet has a CROP heading with months beside it.', true);
    if(!parsed.plantings.length) return done('The template was read, but it has no plantings in it yet.', true);
    const f = currentFarm();
    const replace = !f.rows.length ? true
      : confirm(`This file has ${parsed.plantings.length} planting${parsed.plantings.length===1?'':'s'}.\n\n` +
                `OK — replace the ${f.rows.length} already on your calendar\nCancel — add them to it`);
    const n = applyImport(f, parsed, replace);
    touch(state.member);
    state.scroll = null;
    done(`${CHECK_ICON} Imported ${n} planting${n===1?'':'s'} from “${esc(parsed.sheet)}”${replace ? ', replacing what was there' : ''}.` +
         (parsed.unrecognised ? ` ${parsed.unrecognised} coloured week${parsed.unrecognised===1?' was':'s were'} not a colour in the key and ${parsed.unrecognised===1?'was':'were'} left blank.` : ''));
  }catch(e){ done('That file could not be read: ' + esc(e.message || e), true); }
}

/* Greenhouses and blocks named in the file are matched to the farm's own by
   name, and added where they are new — so importing never needs the layout
   set up first. A file with nothing under GREENHOUSE / BLOCK lands in the
   farm's first unit. */
function applyImport(f, parsed, replace){
  if(replace){
    f.rows = [];
    const named = parsed.plantings.some(p=> p.unit);
    // A brand-new farm's untouched "Greenhouse 1" gives way to the names in the file.
    if(named && f.units.length === 1 && !f.units[0].blocks.length && /^(Greenhouse|Screenhouse|Open field|Nursery) 1$/.test(f.units[0].name)) f.units = [];
    f.startYear = parsed.firstYear || f.startYear;
  }
  const guessType = name=> /field|shamba/i.test(name) ? 'Open field' : /screen/i.test(name) ? 'Screenhouse' : /nursery/i.test(name) ? 'Nursery' : 'Greenhouse';
  const unitFor = name=>{
    if(!name){ if(!f.units.length) f.units.push(blankUnit(1)); return f.units[0]; }
    let u = f.units.find(x=> norm(x.name) === norm(name));
    if(!u){ u = {id:uid('u'), name, type:guessType(name), blocks:[]}; f.units.push(u); }
    return u;
  };
  parsed.plantings.forEach(p=>{
    const u = unitFor(p.unit);
    let block = '';
    if(p.block){
      let b = u.blocks.find(x=> norm(x.name) === norm(p.block));
      if(!b){ b = {id:uid('b'), name:p.block}; u.blocks.push(b); }
      block = b.id;
    }
    f.rows.push({id:uid('r'), unit:u.id, block, crop:p.crop, area:Number(p.area)||0, notes:p.notes, cells:p.cells});
  });
  normaliseFarm(f);
  return parsed.plantings.length;
}

/* ============================================================
   The Secretariat's side: every farm's calendar, read only
   Because every farm is held in the same shape, however it divides its
   ground, the association's harvest can be added up by crop and month —
   which is what a shared crop calendar is for.
   ============================================================ */
function adminYear(){ return state.admYear || DEFAULT_START_YEAR; }
function shiftAdminYear(d){ state.admYear = adminYear() + d; state.scroll = null; renderKeepingPlace(); }
/* The members whose calendars are overseen: approved farms, and suspended
   ones, whose calendars are kept. A registration still waiting, or turned
   down, has no calendar yet and lives under Members & approvals. */
function farmIds(){
  return Object.keys(FARMS).filter(id=> FARMS[id] && (FARMS[id].status === 'approved' || FARMS[id].status === 'suspended'))
    .sort((a, b)=> (FARMS[a].name||'').localeCompare(FARMS[b].name||''));
}
// The association's figures count approved farms only.
function countedIds(){ return farmIds().filter(id=> FARMS[id].status === 'approved'); }
function openAdminFarm(id){ state.viewFarm = id; state.scroll = null; render(); window.scrollTo(0, 0); }
function updatedText(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

// Harvest by crop and month, every farm together.
function associationByCrop(months){
  const by = new Map();
  countedIds().forEach(id=> cropTotals(FARMS[id].rows, months).forEach(g=>{
    const k = cropKey(g.crop);
    if(!by.has(k)) by.set(k, {crop:g.crop, per: months.map(()=> 0), farms:new Set()});
    const e = by.get(k);
    g.per.forEach((v, i)=> e.per[i] += v);
    e.farms.add(id);
  }));
  return [...by.values()].map(e=> Object.assign(e, {total: e.per.reduce((a, b)=> a + b, 0)}))
    .sort((a, b)=> b.total - a.total);
}

}

/* The association's crops by month, fitted to the page like the grid: the
   months are put together in twos, threes, sixes or twelves until every
   column is wide enough to read, so the table never scrolls sideways. */
function associationTable(ass, months, perMonth, total){
  const room = gridRoom() - (isMobile() ? 32 : 48);   // inside the card's padding
  const fixed = isMobile() ? {crop:96, farms:34, total:62} : {crop:170, farms:56, total:90};
  const left = room - fixed.crop - fixed.farms - fixed.total;
  const g = [1, 2, 3, 6, 12].find(n=> left / (months.length / n) >= 50) || 12;
  const groups = [];
  for(let i = 0; i < months.length; i += g) groups.push(months.slice(i, i + g));
  const sum = per=> groups.map((gr, gi)=> per.slice(gi * g, gi * g + gr.length).reduce((a, b)=> a + b, 0));
  const yy = y=> String(y).slice(2);
  const label = gr=> gr.length === 12 && gr[0].m === 1 ? String(gr[0].y)
    : gr.length === 1 ? `${MONTH_ABBR[gr[0].m-1]} ${yy(gr[0].y)}`
    : `${MONTH_ABBR[gr[0].m-1]}–${MONTH_ABBR[gr[gr.length-1].m-1]} ${yy(gr[gr.length-1].y)}`;
  const w = left / groups.length;
  const num = v=> !v ? '–' : w >= 64 ? fmt(v) : kgShort(v);
  // Each figure sits on a bar filled to its share of the busiest period.
  const top = Math.max(1, ...ass.flatMap(e=> sum(e.per)));
  const bar = v=> v ? ` bar" style="--f:${(v / top).toFixed(3)}` : '';
  return `<table class="ass-table fit">
    <colgroup><col style="width:${fixed.crop}px"><col style="width:${fixed.farms}px">${'<col>'.repeat(groups.length)}<col style="width:${fixed.total}px"></colgroup>
    <thead><tr><th class="stk">Crop</th><th>Farms</th>${groups.map(gr=> `<th class="${gr[0].m===1?'ystart':''}">${label(gr)}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody>${ass.map(e=> `<tr><td class="stk" title="${esc(e.crop)}">${esc(e.crop)}</td><td class="v">${e.farms.size}</td>
        ${sum(e.per).map((v, i)=> `<td class="v ${v?'':'zero'}${bar(v)}" title="${esc(label(groups[i]))}: ${fmt(v)} kg">${num(v)}</td>`).join('')}<td class="v"><strong>${fixed.total < 80 ? kgShort(e.total) : fmt(e.total)}</strong></td></tr>`).join('')}
      <tr class="tot"><th class="stk">All crops</th><td></td>${sum(perMonth).map(v=> `<td class="v">${num(v)}</td>`).join('')}<td class="v">${fixed.total < 80 ? kgShort(total) : fmt(total)}</td></tr>
    </tbody></table>`;
}

/* One workbook: the association's totals first, then every farm's
   calendar on its own sheet, each in the template's layout. */
async function exportAllExcel(){
  try{
    const ExcelJS = await loadExcel();
    const wb = newWorkbook(ExcelJS), months = windowMonths(adminYear());
    const ass = associationByCrop(months);
    const ws = wb.addWorksheet('Association');
    const nCol = months.length + 3;
    ws.views = [{state:'frozen', xSplit:2, ySplit:2, showGridLines:false}];
    ws.getColumn(1).width = 24; ws.getColumn(2).width = 8;
    for(let i = 3; i <= nCol; i++) ws.getColumn(i).width = 9;
    ws.getColumn(nCol).width = 11;
    ws.mergeCells(1, 1, 1, nCol);
    const t = ws.getCell(1, 1);
    t.value = `TIPFA  ·  HARVEST BY CROP, EVERY MEMBER FARM (kg / month)  ·  ${months[0].y} – ${months[months.length-1].y}`;
    t.font = xlFont({size:13, bold:true, color:{argb:XL.white}}); t.fill = solid(XL.title);
    t.alignment = {vertical:'middle'}; ws.getRow(1).height = 28;
    const head = ['CROP', 'FARMS', ...months.map(mo=> `${MONTH_ABBR[mo.m-1]} ${mo.y}`), 'TOTAL'];
    head.forEach((h, i)=>{
      const c = ws.getCell(2, i+1);
      c.value = h; c.font = xlFont({size:8, bold:true, color:{argb:XL.white}}); c.fill = solid(XL.head);
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    });
    ws.getRow(2).height = 26;
    ass.forEach((e, i)=>{
      const rn = 3 + i, zebra = i % 2 === 0 ? XL.zebra : XL.white;
      const vals = [e.crop, e.farms.size, ...e.per, null];
      vals.forEach((v, j)=>{
        const c = ws.getCell(rn, j+1);
        c.value = j === nCol - 1 ? {formula:`SUM(${colName(3)}${rn}:${colName(nCol-1)}${rn})`, result:e.total} : v;
        c.font = xlFont({size:9, bold: j === 0 || j === nCol - 1, color:{argb: j === 0 ? XL.title : XL.ink}});
        c.fill = solid(zebra);
        if(j >= 2) c.numFmt = '#,##0;\\-#,##0;\\–';
        c.alignment = {horizontal: j === 0 ? 'left' : 'center', vertical:'middle'};
      });
    });
    const rt = 3 + ass.length;
    ws.getCell(rt, 1).value = 'ALL CROPS';
    for(let j = 3; j <= nCol; j++){
      const col = colName(j);
      ws.getCell(rt, j).value = {formula:`SUM(${col}3:${col}${rt-1})`,
        result: j === nCol ? ass.reduce((t, e)=> t + e.total, 0) : ass.reduce((t, e)=> t + e.per[j-3], 0)};
      ws.getCell(rt, j).numFmt = '#,##0;\\-#,##0;\\–';
    }
    for(let j = 1; j <= nCol; j++){
      const c = ws.getCell(rt, j);
      c.font = xlFont({size:9, bold:true, color:{argb:XL.white}}); c.fill = solid(XL.title);
      c.alignment = {horizontal: j === 1 ? 'left' : 'center', vertical:'middle'};
    }

    // Sheet names must be unique, at most 31 characters, and free of []:*?/\
    const used = new Set(['association']);
    farmIds().forEach(id=>{
      let base = (FARMS[id].name || 'Farm').replace(/[\[\]:*?/\\]/g, ' ').trim().slice(0, 31) || 'Farm', name = base, n = 2;
      while(used.has(name.toLowerCase())){ name = base.slice(0, 27) + ' (' + n++ + ')'; }
      used.add(name.toLowerCase());
      writeTemplateSheet(wb.addWorksheet(name), FARMS[id], months);
    });
    await downloadWorkbook(wb, `TIPFA_CROP_CALENDARS_ALL_FARMS_${months[0].y}-${months[months.length-1].y}.xlsx`);
  }catch(e){ showFatal(e.message || e); }
}

function statusPill(s){ return `<span class="status-pill ${STATUS_PILL[s] || 'status-pending'}">${esc(STATUS_LABEL[s] || s)}</span>`; }
function whenText(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function decidedText(x){

/* ---- Deciding --------------------------------------------------------- */
async function decide(kind, id, status, btn){
  const subject = kind === 'farm' ? (FARMS[id] || {}).name : operatorName(id);
  const ask = {rejected:`Turn down ${subject}? They will not be able to use the crop calendar.`,
               suspended: kind === 'farm' ? `Suspend ${subject}? The farm will not be able to open or change its calendar until it is reinstated. Nothing is deleted.`
                                          : `Suspend ${subject}? They will not be able to open the console until reinstated.`}[status];
  if(ask && !confirm(ask)) return;
  if(btn) btn.classList.add('is-busy');
  const stamp = {status, statusBy: cloudOn() ? CLOUD_STATE.uid : state.adminId, statusAt: new Date().toISOString()};
  try{
    if(cloudOn()) await withTimeout(cloudDecide(kind, id, status), 15000, 'Saving the decision');
    if(kind === 'farm'){ if(FARMS[id]) Object.assign(FARMS[id], stamp); }
    else if(cloudOn()) OPERATORS[id] = Object.assign({}, OPERATORS[id], stamp);
    else Object.values(ACCOUNTS).forEach(a=>{ if(a.id === id) Object.assign(a, stamp); });
    saveLocal();
    // A waiting card is stamped with the decision before it leaves the list.
    const card = btn && btn.closest('.wait-card');
    if(card && !REDUCED_MOTION && (status === 'approved' || status === 'rejected')){
      card.classList.add(status === 'approved' ? 'stamp-ok' : 'stamp-no');
      if(status === 'approved') burstAt(card, 16);
      await new Promise(r=> setTimeout(r, 520));
    }
    const verb = {approved:'approved', rejected:'turned down', suspended:'suspended'}[status];
    state.memberMsg = `${CHECK_ICON} ${esc(subject)} ${verb}.`;
    renderKeepingPlace();
  }catch(e){
    if(btn) btn.classList.remove('is-busy');
    showFatal('The decision was not saved: ' + cloudErrorText(e));
  }
}
/* ---- Removing a farm ------------------------------------------------------
   For good: the farm's record and its whole calendar. Suspending is the way
   to keep someone out and keep what they planned; this is for an account that
   should not be there at all — a test, a duplicate, a farm that has left. */
async function removeFarm(id, btn){
  const f = FARMS[id];
  if(!f) return;
  const n = (f.rows || []).length;
  if(!confirm(`Remove ${f.name} from the crop calendar for good?\n\n` +
      (n ? `Its calendar — ${n} planting${n===1?'':'s'} — will be deleted and cannot be recovered. Export it to Excel first if it may be needed.\n\n` : '') +
      `To keep the farm out but keep its calendar, Suspend it instead.`)) return;
  if(btn) btn.classList.add('is-busy');
  try{
    if(cloudOn()) await withTimeout(cloudRemoveFarm(id), 15000, 'Removing the farm');
    delete FARMS[id];
    Object.keys(ACCOUNTS).forEach(k=>{ if(ACCOUNTS[k].id === id && ACCOUNTS[k].role === 'farm') delete ACCOUNTS[k]; });
    saveLocal();
    if(state.viewFarm === id) state.viewFarm = null;
    state.memberMsg = `${CHECK_ICON} ${esc(f.name)} was removed.` + (cloudOn() ? ` Its sign-in is still in Firebase, so the same email can register again; to free the email completely, delete it under Authentication → Users.` : '');
    renderKeepingPlace();
  }catch(e){
    if(btn) btn.classList.remove('is-busy');
    // Refused by the rules: the database still has rules from before Remove
    // existed. Say so, rather than the sign-up message a refusal usually means.
    if(String((e && e.code) || '').includes('permission-denied'))
      return showFatal('The farm was not removed: the database\u2019s security rules do not allow it yet. In the Firebase console, open Firestore Database \u2192 Rules, publish the latest firestore.rules (it allows approved administrators to remove a farm), wait a minute, reload this page and try again.');
    showFatal('The farm was not removed: ' + cloudErrorText(e));
  }
}
function decisionButtons(kind, x){
  if(kind === 'operator' && (x.id === state.adminId || x.owner)) return `<span class="helper" style="margin:0;">${x.owner ? 'System owner' : 'You'}</span>`;
  const b = (status, label, cls)=> `<button class="btn small ${cls||''}" onclick="decide('${kind}','${esc(x.id)}','${status}', this)">${label}</button>`;
  switch(x.status){
    case 'pending':  return b('approved', 'Approve') + b('rejected', 'Turn down', 'ghost danger');
    case 'approved': return b('suspended', 'Suspend', 'ghost danger');
    case 'suspended':return b('approved', 'Reinstate', 'ghost');
    case 'rejected': return b('approved', 'Approve after all', 'ghost');
  }
  return '';
}

    <div class="card">
      <p class="helper" style="margin:0 0 10px;"><strong>Suspend</strong> keeps a farm out and keeps its calendar. <strong>Remove</strong> deletes the farm and its calendar for good.</p>
      <div class="cc-row" style="margin-bottom:10px;">
        <input id="member-search" type="search" value="${esc(state.memberSearch)}" placeholder="Search by farm, contact, location, email or phone"
          oninput="state.memberSearch=this.value; onLiveData();" style="margin:0;max-width:420px;">
        <span class="helper" style="margin:0;">${listed.length} of ${farms.length}</span>
      </div>
      ${listed.length ? `<table class="grid-table">
        <thead><tr><th>Farm</th><th>Contact</th><th>Location</th><th>Status</th><th></th></tr></thead>
        <tbody>${listed.map(f=> `<tr>
          <td><span class="farm-cell">${farmLogo(f,'sm')}<span class="fname">${esc(f.name)}</span></span></td>
          <td>${[f.contact, f.phone, f.email].filter(Boolean).map(esc).join('<br>') || '—'}</td>
          <td>${esc(f.location || '—')}</td>
          <td>${statusPill(f.status)}${decidedText(f) ? `<div class="helper" style="margin:4px 0 0;">${decidedText(f)}</div>` : ''}</td>
          <td class="row-actions">${f.status === 'approved' || f.status === 'suspended' ? `<button class="btn small ghost" onclick="state.tab='calendarsA';openAdminFarm('${esc(f.id)}')">View calendar</button>` : ''}
            ${decisionButtons('farm', f)}
            ${local ? `<button class="btn small ghost" onclick="adminResetFarmPassword('${esc(f.id)}')" title="Set a new password for this farm on this device">New password</button>` : ''}
            <button class="btn small ghost danger" onclick="removeFarm('${esc(f.id)}', this)" title="Delete this farm and its calendar for good">${icon('trash')} Remove</button></td>
        </tr>`).join('')}</tbody></table>`
      : `<p class="helper" style="margin:0;">${farms.length ? 'No farm matches that search.' : 'No farm has registered yet.'}</p>`}
    </div>

    <div class="section-label">Administrators</div>
    <div class="card">
      <table class="grid-table">
        <thead><tr><th>Name</th><th>Email</th><th>Since</th><th>Status</th><th></th></tr></thead>
        <tbody>${ops.sort((a, b)=> (b.owner - a.owner) || (order[a.status]-order[b.status]) || (a.name||'').localeCompare(b.name||'')).map(o=> `<tr>
          <td><strong>${esc(o.name)}</strong>${o.owner ? ' <span class="owner-tag">System owner</span>' : ''}${o.id === state.adminId ? ' <span class="helper" style="margin:0;">(you)</span>' : ''}</td>
          <td>${esc(o.email || '—')}</td>
          <td>${esc(whenText(o.since) || o.since || '—')}</td>
          <td>${statusPill(o.status)}${decidedText(o) && !o.owner ? `<div class="helper" style="margin:4px 0 0;">${decidedText(o)}</div>` : ''}</td>
          <td class="row-actions">${decisionButtons('operator', o)}</td>
        </tr>`).join('')}</tbody></table>
      <p class="helper" style="margin:10px 0 0;">The system owner is the first administrator who registered. Nobody can suspend the owner, and nobody can change their own status.</p>
    </div>`;
}

/* ============================================================
   The journey
   A season — sown, sprouted, transplanted, in bloom, harvested — runs
   through every screen: the path at the front door, the seed that
   germinates while an account waits, the planting pass that sweeps the
   calendar open, the ribbon a plan is drawn on, and the leaves that fly
   when something is let in or planted. The sky behind it all follows the
   time of day.

   All of it is decoration over the same pages. Nothing here holds data or
   takes a click, every moving part is a transform or an opacity on one
   element (never thousands of calendar cells), and for a reader who has
   asked for less motion it is drawn already finished.
   ============================================================ */
const J_PATHS = {
  soil:   '<path d="M3 16h18"/><path d="M6 19.5h12"/><path d="M8 12.5c1.4-1.3 2.6-1.3 4 0s2.6 1.3 4 0"/>',
  seed:   '<path d="M12 4c3 2.8 4.5 5.7 4.5 8.6a4.5 4.5 0 0 1-9 0C7.5 9.7 9 6.8 12 4z"/><path d="M12 9v6"/>',
  sprout: '<path d="M12 21v-9"/><path d="M12 12C12 8 9.5 6 5.5 6c0 4 2.5 6 6.5 6z"/><path d="M12 14.5c0-3.2 2.2-5 5.8-5 0 3.2-2.2 5-5.8 5z"/>',
  plant:  '<path d="M7 21h10l-1.3-5.5H8.3z"/><path d="M12 15.5V9.5"/><path d="M12 9.5c0-3-2-5-5-5 0 3 2 5 5 5z"/><path d="M12 11.5c0-2.6 1.9-4.2 4.6-4.2 0 2.6-1.9 4.2-4.6 4.2z"/>',
  bloom:  '<circle cx="12" cy="8" r="2"/><path d="M12 6c-.6-2.2.2-3.6 1.6-3.6S15.6 4 14 6.3"/><path d="M13.9 8.3c2.1-.8 3.6-.1 3.7 1.3s-1.5 2.2-3.8.9"/><path d="M12 10c.6 2.2-.2 3.6-1.6 3.6S8.4 12 10 9.7"/><path d="M10.1 7.7C8 8.5 6.5 7.8 6.4 6.4S7.9 4.2 10.2 5.5"/><path d="M12 13v8"/><path d="M12 18c-1.6-1.8-3.4-2.2-5-1.6"/>',
  basket: '<path d="M3.5 10.5h17l-1.8 9H5.3z"/><path d="M8 10.5 12 4l4 6.5"/><path d="M8.5 13.5v3M12 13.5v3M15.5 13.5v3"/>',
};
function jIcon(name, size){
  return `<svg width="${size||18}" height="${size||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${J_PATHS[name]}</svg>`;
}

/* ---- The sky: dawn, day, dusk or night, from this device's clock ---- */
function journeySky(){
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  const part = h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 19.5 ? 'dusk' : 'night';
  const root = document.documentElement;
  if(root.getAttribute('data-daypart') !== part) root.setAttribute('data-daypart', part);
  // How far through the daylight we are, for the sun on the horizon line.
  root.style.setProperty('--sun', Math.max(0, Math.min(1, (h - 6) / 12)).toFixed(3));
}
journeySky();
setInterval(journeySky, 5 * 60 * 1000);

/* ---- The front door: the season as a path ----------------------------- */
const J_STOPS = [
  {x:22,  y:128, icon:'seed',   label:'Sow'},
  {x:118, y:94,  icon:'sprout', label:'Sprout'},
  {x:214, y:70,  icon:'plant',  label:'Transplant'},
  {x:310, y:92,  icon:'bloom',  label:'Bloom'},
  {x:398, y:40,  icon:'basket', label:'Harvest'},
];
function journeyPathHTML(){
  const d = 'M22,128 C62,128 74,94 118,94 S170,66 214,70 S270,106 310,92 S370,40 398,40';
  return `<div class="jpath" aria-hidden="true">
    <svg viewBox="0 0 420 160" preserveAspectRatio="xMidYMid meet">
      <path class="jp-ground" d="${d}"/>
      <path class="jp-trail" id="jp-trail" d="${d}" pathLength="100"/>
      ${J_STOPS.map((s, i)=> `<g class="jp-stop" style="--i:${i}" transform="translate(${s.x} ${s.y})">
          <circle class="jp-halo" r="19"/><circle class="jp-dot" r="14"/>
          <g transform="translate(-9 -9)" class="jp-ico">${jIcon(s.icon, 18)}</g>
          <text y="${i % 2 ? -26 : 32}" text-anchor="middle">${s.label}</text>
        </g>`).join('')}
      ${REDUCED_MOTION ? '' : `<g class="jp-walker"><circle r="5.5"/><circle r="10" class="jp-walker-glow"/>
        <animateMotion dur="11s" repeatCount="indefinite" rotate="0" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#jp-trail"/></animateMotion></g>`}
    </svg>
  </div>`;
}
// Pollen and seed husks drifting up through the light. Fixed positions,
// not random, so the page looks the same on every visit.
function pollenHTML(n){
  return `<div class="pollen" aria-hidden="true">${Array.from({length: n || 16}, (_, i)=>
    `<i style="--x:${(i * 37 + 11) % 100}%;--d:${9 + (i * 7) % 11}s;--delay:-${(i * 13) % 17}s;--s:${0.5 + ((i * 29) % 10) / 10}"></i>`).join('')}</div>`;
}

/* ---- A burst of leaves, for a moment worth marking --------------------- */
function leafBurst(x, y, n){
  if(REDUCED_MOTION) return;
  const host = document.createElement('div');
  host.className = 'leafburst'; host.setAttribute('aria-hidden', 'true');
  host.style.left = x + 'px'; host.style.top = y + 'px';
  const colours = ['var(--leaf-green)', 'var(--tipfa-green)', 'var(--harvest-orange)', '#9DB65E'];
  host.innerHTML = Array.from({length: n || 18}, (_, i)=>{
    const a = (i / (n || 18)) * Math.PI * 2 + (i % 3) * 0.35, dist = 60 + (i * 23) % 70;
    return `<i style="--tx:${Math.round(Math.cos(a) * dist)}px;--ty:${Math.round(Math.sin(a) * dist - 30)}px;--r:${(i * 47) % 360}deg;--c:${colours[i % 4]};--t:${0.8 + (i % 5) * 0.12}s"></i>`;
  }).join('');
  document.body.appendChild(host);
  setTimeout(()=> host.remove(), 1700);
}
function burstAt(el, n){
  if(!el) return;
  const r = el.getBoundingClientRect();
  leafBurst(r.left + Math.min(r.width / 2, 120), r.top + r.height / 2, n);
}

/* ---- A seed germinating, while something is on its way ----------------- */
function germinateHTML(mode){
  return `<div class="germ${mode ? ' ' + mode : ''}" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <defs><linearGradient id="g-soil-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#C9A27C"/><stop offset="1" stop-color="#A85C3F" stop-opacity=".55"/></linearGradient></defs>
      <path class="g-soil" d="M6 84 C24 74 44 72 60 73 C78 72 98 75 114 84 C116 98 106 112 60 114 C14 112 4 98 6 84 Z"/>
      <path class="g-soil-top" d="M14 80 C34 74 50 73 60 74 C74 73 90 75 106 80"/>
      <g class="g-specks"><circle cx="26" cy="92" r="1.6"/><circle cx="44" cy="104" r="1.2"/><circle cx="78" cy="96" r="1.5"/><circle cx="96" cy="106" r="1.2"/><circle cx="62" cy="110" r="1"/></g>
      <path class="g-root" d="M60 86 C58 94 63 99 59 106 M60 92 C54 96 50 97 46 103 M60 95 C66 98 70 101 73 108" pathLength="1"/>
      <ellipse class="g-seed" cx="60" cy="84" rx="8" ry="5.5"/>
      <g class="g-shoot">
        <path class="g-stem" d="M60 80 C60 66 60 58 60 48" pathLength="1"/>
        <path class="g-leaf l" d="M60 54 C50 52 43 45 42 36 C52 37 59 44 60 54 Z"/>
        <path class="g-leaf r" d="M60 50 C68 46 76 44 82 38 C80 48 71 53 60 50 Z"/>
      </g>
    </svg>
  </div>`;
}

/* ---- Where an account stands, as the first steps of the journey -------- */
function statusJourneyHTML(s, registered){
  const steps = {
    pending:   [['done', 'Registered', registered || ''], ['now', 'Checked by the Secretariat', 'in progress'], ['', 'Your calendar opens', 'and planting begins']],
    suspended: [['done', 'Registered', registered || ''], ['done', 'Approved', ''], ['halt', 'Paused by an administrator', 'your calendar is kept']],
    rejected:  [['done', 'Registered', registered || ''], ['stop', 'Not approved', 'contact the Secretariat']],
  }[s];
  if(!steps) return '';
  return `<ol class="sj">${steps.map(([cls, t, sub])=> `<li class="${cls}"><span class="sj-dot">${cls === 'done' ? CHECK_ICON : ''}</span>
      <span class="sj-t">${esc(t)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></li>`).join('')}</ol>`;
}

/* ---- The plan, drawn as a ribbon from sowing to harvest ----------------- */
let journeyLastPlan = '';
function planRibbonHTML(g, p){
  const seg = [];
  if(!g.tree){
    seg.push(['L', p.marks.land, addDays(p.marks.land, 7)]);
    if(g.direct) seg.push(['S', p.sown, addDays(p.sown, 7)]);
    else { seg.push(['S', p.sown, p.moved]); seg.push(['T', p.moved, addDays(p.moved, 7)]); }
    const vFrom = g.direct ? addDays(p.sown, 7) : addDays(p.moved, 7);
    const vTo = p.hWeeks ? (p.flowerFrom || p.firstH) : addDays(p.growUntil || vFrom, 1);
    if(vTo > vFrom) seg.push(['V', vFrom, vTo]);
    if(p.flowerFrom && p.hWeeks && p.firstH > p.flowerFrom) seg.push(['F', p.flowerFrom, p.firstH]);
  }
  if(p.hWeeks) seg.push(['H', p.firstH, addDays(p.lastH, 1)]);
  if(!seg.length) return '';
  const start = seg[0][1], end = seg[seg.length - 1][2];
  const total = Math.max(1, daysBetween(start, end));
  // Only a new plan is drawn again; typing a plant count leaves it be.
  const sig = `${g.id}|${p.sown && p.sown.getTime()}|${p.moved && p.moved.getTime()}`;
  const still = sig === journeyLastPlan; journeyLastPlan = sig;
  const endIcon = p.hWeeks ? 'basket' : 'sprout';
  return `<div class="jr${still ? ' still' : ''}" aria-hidden="true">
    <div class="jr-ends"><span>${jIcon(g.tree ? 'basket' : 'seed', 15)} ${dayText(start, true)}</span>
      <span>${dayText(addDays(end, -1), true)} ${jIcon(endIcon, 15)}</span></div>
    <div class="jr-track">${seg.map(([s, a, b], i)=>
      `<span class="jr-seg s-${s}" style="flex:${Math.max(daysBetween(a, b), total * 0.025)};background-color:${STAGE[s].color};--i:${i}"
         title="${esc(STAGE[s].name)}: ${dayText(a, true)} – ${dayText(addDays(b, -1), true)}"></span>`).join('')}
      <span class="jr-walker">${jIcon('sprout', 16)}</span></div>
  </div>`;
}

/* ---- The calendar opening: a planting pass across the field ------------ */
let journeyLastGrid = null;
function sowSweep(sc){
  const field = sc.querySelector('.cc-field'), t = sc.querySelector('table.cc-grid');
  if(!field || !t || !gridView) return;
  const head = t.tHead ? t.tHead.offsetHeight : 0;
  const w = gridView.L.room - gridView.L.pin;
  const cover = document.createElement('div');
  cover.className = 'cc-sow';
  cover.style.cssText = `left:${gridView.L.pin}px;top:${head}px;width:${w}px;--w:${w}px;`;
  cover.innerHTML = `<span class="cc-drill">${jIcon('seed', 16)}</span>`;
  field.appendChild(cover);
  setTimeout(()=> cover.remove(), 1500);
}
// A planting just planned from the guide grows across its row.
function growRow(sc, id){
  const field = sc.querySelector('.cc-field'), tr = sc.querySelector(`tr[data-row="${id}"]`);
  if(!field || !tr || !gridView) return;
  const head = sc.querySelector('thead') ? sc.querySelector('thead').offsetHeight : 0;
  const top = tr.offsetTop;
  if(top - head < sc.scrollTop || top + tr.offsetHeight > sc.scrollTop + sc.clientHeight) sc.scrollTop = Math.max(0, top - head - 40);
  const w = gridView.L.room - gridView.L.pin;
  const cover = document.createElement('div');
  cover.className = 'cc-grow';
  cover.style.cssText = `left:${gridView.L.pin}px;top:${top}px;height:${tr.offsetHeight}px;width:${w}px;--w:${w}px;`;
  cover.innerHTML = `<span class="cc-drill">${jIcon('sprout', 16)}</span>`;
  field.appendChild(cover);
  tr.classList.add('just-planted');
  setTimeout(()=>{ cover.remove(); tr.classList.remove('just-planted'); }, 2200);
  const name = tr.querySelector('.cn');
  if(name) setTimeout(()=> burstAt(name, 14), 150);
}

/* ---- After every page is drawn ------------------------------------------- */
function journeyAfterRender(c){
  const sc = c.querySelector('.cc-scroll');
  const key = sc ? sc.dataset.key + '|' + viewSpan() + '|' + (state.spanAt || 0) : null;
  if(sc && !REDUCED_MOTION){
    if(state.growRow) growRow(sc, state.growRow);
    else if(key !== journeyLastGrid) sowSweep(sc);
  }
  state.growRow = null;
  journeyLastGrid = key;
  if(state.celebrate){
    state.celebrate = false;
    setTimeout(()=> burstAt(c.querySelector('h1.page-title') || c, 26), 250);
  }
}

/* ============================================================
   Start-up
   ============================================================ */
// The key's colours become the grid's, from the one list above.
(function stageStyles(){
  const s = document.createElement('style');
  // The colour only, so each stage's texture can lie over it.
  s.textContent = STAGES.map(st=> `.cc-grid td.wk.s-${st.code}{background-color:${st.color};color:${st.ink};}`).join('\n');
  document.head.appendChild(s);
})();

loadLocal();
render();
initCloud().then(async ()=>{
  const restored = await restoreSession();
  if(!restored) render();
});
window.addEventListener('load', ()=> setTimeout(()=>{ try{ checkForNewerBuild(); }catch(_){ } }, 2500));
</script>
</body>
