<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TIPFA Crop Calendar</title>
<!-- Which of the two appearances this is, decided before the first paint so
     the page never draws as a desktop and then rearranges into a phone.
     760 is the one breakpoint; it is repeated in the stylesheet and in
     MOBILE_MAX below, and a test holds the three to each other. -->
<script>document.documentElement.setAttribute('data-view',
  window.matchMedia('(max-width:760px)').matches ? 'mobile' : 'desktop');</script>
<!-- The build, at the top of the file on purpose. A phone holds on to this
     page for a long time, and a stale copy showing different figures from the
     console is worse than an old copy showing old ones. Keeping the stamp in
     the head lets a device ask the server what it is serving by fetching the
     first two kilobytes instead of all 649. Bump this and nothing else. -->
<meta name="tipfa-build" content="v19">
<meta name="theme-color" content="#405E35">
<meta name="description" content="TIPFA Crop Calendar — each member farm plans its plantings week by week on the association's master template, and the Secretariat sees every farm's calendar in one place.">
<link rel="icon" type="image/png" href="assets/brand/tipfa-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<style>
/* ============================================================
   TIPFA Association Platform
   Visual identity per TIPFA Brand Guidelines v1.0 (2026)
   Palette p13 · Typography p15 · Arc system p17
   ============================================================ */
:root{
  /* Core palette — exact values, brand guidelines page 13 */
  --tipfa-green:#405E35;
  --harvest-orange:#E8A734;
  --field-cream:#EFEDE2;
  --leaf-green:#7E9B3F;
  --deep-green:#2C4423;
  --soil-ink:#23281F;

  /* Applied roles — page 14 */
  --ink:var(--soil-ink);
  --paper:var(--field-cream);
  --card:#FFFFFF;
  --line:#DFDCCB;
  --line-soft:#EAE7DA;
  --muted:#6E7466;
  --leaf:var(--tipfa-green);
  --leaf-dark:var(--deep-green);
  --gold:var(--harvest-orange);
  --red:#A8402F;
  --teal:#2F7A82;
  --soil:#A85C3F;

  --radius:14px;
  --radius-sm:10px;
  --radius-lg:22px;

  --shadow-sm:0 1px 2px rgba(35,40,31,.05), 0 2px 8px rgba(35,40,31,.04);
  --shadow-md:0 2px 6px rgba(35,40,31,.06), 0 12px 28px rgba(35,40,31,.08);
  --shadow-lg:0 8px 20px rgba(35,40,31,.10), 0 28px 60px rgba(35,40,31,.14);

  /* Role accents keep the palette — never invent a colour */
  --role-accent:var(--tipfa-green);
  --role-accent-dark:var(--deep-green);

  /* Motion system */
  --ease-out:cubic-bezier(.16,.84,.44,1);
  --ease-spring:cubic-bezier(.22,1.2,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-1:.18s; --dur-2:.32s; --dur-3:.52s; --dur-4:.8s;
  --dur-5:1.4s;

  /* Organic Biophilic — the direction the design tools land on for an
     agricultural cooperative, and the one TIPFA's own palette already is.
     Flowing shapes, natural light, nothing sharp. The greens below are the
     brand's, thinned to atmosphere rather than repainted. */
  --glass:rgba(255,255,255,.72);
  --glass-line:rgba(255,255,255,.55);
  --canopy-1:rgba(126,155,63,.42);
  --canopy-2:rgba(64,94,53,.34);
  --canopy-3:rgba(232,167,52,.26);
  --sheen:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.42) 46%,transparent 72%);
  --radius-xl:28px;
  --shadow-glow:0 0 0 1px rgba(126,155,63,.22), 0 18px 44px -18px rgba(44,68,35,.42);
}
body[data-role="member"]{ --role-accent:#7E9B3F; --role-accent-dark:#405E35; }
body[data-role="admin"]{ --role-accent:#405E35; --role-accent-dark:#2C4423; }

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-weight:400;
  color:var(--ink);
  background:var(--field-cream);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  /* A phone must not re-flow the type to a size the layout was not built
     for, and a double tap must not zoom the page: both of those are how a
     locked layout starts drifting sideways under a thumb. */
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  touch-action:manipulation;
}

/* ============================================================
   The canopy — light through leaves

   Four soft pools of the brand's own greens and gold, drifting
   slowly behind everything. It is three radial gradients on one
   fixed layer: a few hundred bytes, no image to download, and it
   never touches layout, so it cannot cost a frame anywhere that
   matters. A farm on a slow connection pays nothing for it.
   ============================================================ */
.canopy{
  position:fixed; inset:-25vmax; z-index:0; pointer-events:none;
  background:
    radial-gradient(38vmax 32vmax at 12% 8%,  var(--canopy-1), transparent 62%),
    radial-gradient(44vmax 36vmax at 88% 14%, var(--canopy-2), transparent 64%),
    radial-gradient(34vmax 30vmax at 74% 88%, var(--canopy-3), transparent 60%),
    radial-gradient(30vmax 26vmax at 30% 62%, rgba(47,122,130,.13), transparent 60%),
    linear-gradient(160deg, #F4F2E6 0%, #E7E9DA 48%, #DCE3D2 100%);
  filter:blur(8px);
  animation:canopyDrift 46s var(--ease-in-out) infinite alternate;
  will-change:transform;
}
@keyframes canopyDrift{
  0%   { transform:translate3d(0,0,0) scale(1); }
  50%  { transform:translate3d(2.4%,-1.8%,0) scale(1.06); }
  100% { transform:translate3d(-2%,2.2%,0) scale(1.02); }
}

/* Rows of a field, drawn once as a repeating gradient rather than an
   image, sitting under the content at almost nothing. */
.canopy::after{
  content:''; position:absolute; inset:0;
  background-image:repeating-linear-gradient(115deg,
    rgba(44,68,35,.085) 0 1.5px, transparent 1.5px 68px);
  mask-image:radial-gradient(70% 60% at 50% 40%, #000 30%, transparent 78%);
  -webkit-mask-image:radial-gradient(70% 60% at 50% 40%, #000 30%, transparent 78%);
}
#appScreen, #loginScreen{ position:relative; z-index:1; }

/* Everything above is decoration. When a reader asks for less motion it
   stops moving — it does not disappear, because a still gradient is not
   the thing that causes harm. */
@media (prefers-reduced-motion: reduce){
  .canopy{ animation:none; }
}
h1,h2,h3,h4,.display,.brand,.btn,.metric .val,.tabbtn,.logintabs button,.eyebrow{
  font-family:'Poppins','Montserrat',system-ui,sans-serif;
}
a{color:var(--tipfa-green);}

/* ---------- Arc system (guidelines p17) -----------------------
   Arcs are anchored to an edge, always cropped by it, solid on
   cream, lighter green at 25–35% on green. Never a whole circle,
   never more than three, always behind content.              */
.arcfield{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.arc{position:absolute;border-radius:50%;will-change:transform;}
.arc--cream-1{width:min(58vw,540px);aspect-ratio:1;left:-16%;bottom:-38%;background:#E5E3D5;animation:arcDrift 22s var(--ease-in-out) infinite;}
.arc--cream-2{width:min(42vw,400px);aspect-ratio:1;left:8%;bottom:-30%;background:#DCDCCB;animation:arcDrift 27s var(--ease-in-out) infinite reverse;}
.arc--green-1{width:min(70vw,620px);aspect-ratio:1;right:-22%;bottom:-40%;background:rgba(126,155,63,.30);animation:arcDrift 24s var(--ease-in-out) infinite;}
.arc--green-2{width:min(48vw,430px);aspect-ratio:1;right:2%;bottom:-34%;background:rgba(126,155,63,.22);animation:arcDrift 30s var(--ease-in-out) infinite reverse;}
.arc--green-3{width:min(34vw,300px);aspect-ratio:1;left:-14%;top:-18%;background:rgba(239,237,226,.10);animation:arcDrift 34s var(--ease-in-out) infinite;}
@keyframes arcDrift{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  50%{transform:translate3d(2.5%,-3.5%,0) scale(1.055);}
}

/* Translucent, so the canopy behind it is what you are actually looking at.
   Painting the shell solid cream is what made the first attempt at this
   invisible — the light was there, with a sheet of paper over it. */
/* Barely there. The canopy is the page; this only holds the column
   together and keeps text off the busiest part of the light. */
.app{
  max-width:1240px;margin:0 auto;position:relative;
  background:linear-gradient(180deg, rgba(244,242,232,.30), rgba(239,237,226,.52));
  box-shadow:0 0 120px -40px rgba(44,68,35,.42);
}

/* ---------- Top bar ---------- */
.topbar{
  background:var(--tipfa-green); color:var(--field-cream);
  padding:14px 26px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:14px; position:relative; overflow:hidden;
}
.topbar > *{position:relative;z-index:1;}
.brandblock{display:flex;align-items:center;gap:14px;animation:riseIn var(--dur-3) var(--ease-out) both;}
.brandlogo{
  width:34px;height:auto;display:block;   /* symbol minimum on screen is 32px wide */
  transition:transform var(--dur-2) var(--ease-spring);
}
.brandtext{line-height:1.3;}
.bt-name{
  font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;letter-spacing:.01em;
}
.bt-name span{font-weight:400;opacity:.82;}
.brandblock:hover .brandlogo{transform:scale(1.03);}
.brandrule{width:1px;height:38px;background:rgba(239,237,226,.30);}
.brandblock .tagline{
  font-size:11.5px;letter-spacing:.02em;line-height:1.4;opacity:.8;margin-top:2px;font-style:italic;
}
.session{display:flex;align-items:center;gap:12px;color:var(--field-cream);font-size:12.5px;animation:riseIn var(--dur-3) var(--ease-out) .08s both;}
.session .who{font-weight:600;font-family:'Poppins',sans-serif;}
.session .role-tag{opacity:.82;}
.session button{
  border:1.5px solid rgba(239,237,226,.55);background:none;color:var(--field-cream);
  font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  transition:background var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.session button:hover{background:rgba(239,237,226,.14);border-color:var(--field-cream);transform:translateY(-1px);}
.session button:active{transform:translateY(0) scale(.97);}

/* ---------- Sign-in ---------- */
.loginwrap{
  display:grid;grid-template-columns:1.05fr .95fr;min-height:640px;position:relative;
}
.loginbrand{
  background:var(--deep-green);color:var(--field-cream);
  padding:52px 46px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  animation:panelIn var(--dur-4) var(--ease-out) both;
}
.loginbrand > *{position:relative;z-index:1;}

/* ============================================================
   The front door

   Light moving behind the panel — three shafts and two drifting
   leaf shapes, all CSS, nothing to download. The logo itself does
   not move: the brand guidelines are explicit that logo elements
   are never animated out of position, so the light moves and the
   mark stays exactly where it was drawn.
   ============================================================ */
.loginbrand::before{
  content:''; position:absolute; inset:-30%; z-index:0; pointer-events:none;
  background:
    radial-gradient(28vmax 22vmax at 18% 12%, rgba(126,155,63,.42), transparent 62%),
    radial-gradient(24vmax 30vmax at 84% 30%, rgba(232,167,52,.20), transparent 64%),
    radial-gradient(26vmax 24vmax at 62% 92%, rgba(47,122,130,.24), transparent 62%);
  animation:doorDrift 34s var(--ease-in-out) infinite alternate;
  will-change:transform;
}
@keyframes doorDrift{
  0%   { transform:translate3d(0,0,0) rotate(0deg) scale(1); }
  100% { transform:translate3d(3%,-3%,0) rotate(8deg) scale(1.14); }
}

/* Shafts of light, as through a tunnel roof. */
.loginbrand::after{
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:repeating-linear-gradient(102deg,
    rgba(239,237,226,.075) 0 2px, transparent 2px 58px);
  mask-image:linear-gradient(180deg, #000 6%, transparent 82%);
  -webkit-mask-image:linear-gradient(180deg, #000 6%, transparent 82%);
  animation:shaftSlide 26s linear infinite;
}
@keyframes shaftSlide{ to{ background-position:340px 0; } }

@media (prefers-reduced-motion: reduce){
  .loginbrand::before, .loginbrand::after{ animation:none; }
}
.loginbrand .lb-logo{
  width:min(300px,72%);height:auto;display:block;margin-bottom:34px;
  animation:logoIn 1s var(--ease-spring) .12s both;
}
.eyebrow{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;
  color:var(--harvest-orange);margin-bottom:14px;
}
.loginbrand h2{
  font-size:clamp(24px,2.6vw,33px);font-weight:700;line-height:1.16;letter-spacing:-.02em;margin:0 0 10px;
}
.loginbrand .strap{font-size:14px;line-height:1.6;opacity:.9;max-width:34ch;margin:0 0 30px;font-weight:300;}
.loginbrand .strap em{font-style:normal;font-weight:500;display:block;opacity:.72;font-size:13px;margin-top:3px;}
.values{display:grid;gap:14px;max-width:400px;}
.value{display:flex;gap:13px;align-items:flex-start;}
.value svg{flex:none;margin-top:1px;stroke:var(--harvest-orange);}
.value .vt{font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;}
.value .vd{font-size:12px;opacity:.78;line-height:1.5;font-weight:300;}
.lb-foot{margin-top:34px;font-size:11.5px;opacity:.62;line-height:1.6;font-weight:300;}

.loginpane{
  display:flex;align-items:center;justify-content:center;padding:48px 42px;position:relative;background:var(--field-cream);
}
.loginbox{width:100%;max-width:410px;position:relative;z-index:1;animation:riseIn var(--dur-4) var(--ease-out) .16s both;}
.lock-icon{
  display:flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;
  color:var(--deep-green);margin-bottom:16px;
}
.lock-icon svg{stroke:var(--tipfa-green);}
.logintabs{display:flex;background:#E3E1D3;border-radius:999px;padding:4px;margin-bottom:20px;position:relative;}
.logintabs button{
  flex:1;border:none;background:none;font-size:13px;font-weight:600;
  color:var(--muted);padding:10px 0;border-radius:999px;cursor:pointer;position:relative;z-index:1;
  transition:color var(--dur-2) var(--ease-out);
}
.logintabs button.active{color:#fff;}
.logintabs .tabglide{
  position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;background:var(--tipfa-green);
  transition:transform var(--dur-3) var(--ease-spring);z-index:0;box-shadow:var(--shadow-sm);
}
.login-note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6;}
.login-note a{font-weight:600;text-decoration:none;border-bottom:1px solid rgba(64,94,53,.35);transition:border-color var(--dur-1);}
.login-note a:hover{border-color:var(--tipfa-green);}
.demo-note{background:#E7E5D8;border-radius:var(--radius-sm);padding:11px 13px;font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:14px;}
.demo-note strong{color:var(--deep-green);}

/* ---------- Sub bar ---------- */
.subbar{
  display:flex;align-items:center;gap:12px;padding:12px 26px;background:#E7E5D8;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
  animation:fadeIn var(--dur-3) var(--ease-out) both;
}
.subbar label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-weight:600;font-family:'Poppins',sans-serif;}
.subbar select{padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:13px;background:#fff;}
.subbar .who-name{font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:var(--deep-green);}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:236px 1fr;gap:0;min-height:560px;position:relative;}
.sidebar{
  border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:3px;
  position:relative;
  background:linear-gradient(180deg, rgba(235,233,220,.72) 0%, rgba(239,237,226,.30) 100%);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.tabbtn{
  text-align:left;border:none;background:none;padding:11px 14px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;position:relative;
  transition:color var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
  animation:slideInLeft var(--dur-3) var(--ease-out) both;
}
.tabbtn:hover{color:var(--deep-green);background:rgba(255,255,255,.6);transform:translateX(2px);}
.tabbtn.active{
  background:var(--card);color:var(--role-accent-dark);font-weight:600;box-shadow:var(--shadow-sm);
}
.tabbtn.active::before{
  content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
  background:var(--role-accent);animation:growBar var(--dur-3) var(--ease-spring) both;
}

/* The tab you are on glows faintly, the way a lit thing does, so the eye
   finds it without reading. */
.tabbtn.active{
  background:linear-gradient(100deg, rgba(255,255,255,.96), rgba(255,255,255,.82));
  box-shadow:0 2px 6px rgba(35,40,31,.06), 0 0 0 1px rgba(126,155,63,.22);
}
.content{padding:26px 30px 52px;position:relative;overflow:hidden;}

/* ============================================================
   The page head

   A leaf-shaped field of light behind the title, turning slowly.
   Two CSS shapes, no image, and it gives every screen a moment
   before the data starts.
   ============================================================ */
.page-title{position:relative;z-index:1;}
.content > h1.page-title::before{
  content:''; position:absolute; z-index:-1;
  left:-26px; top:50%; width:132px; height:132px;
  transform:translateY(-50%);
  background:radial-gradient(circle at 34% 34%, rgba(126,155,63,.30), rgba(64,94,53,.08) 56%, transparent 70%);
  border-radius:62% 38% 46% 54% / 54% 46% 58% 42%;
  animation:leafTurn 26s var(--ease-in-out) infinite alternate;
  pointer-events:none;
}
@keyframes leafTurn{
  0%   { transform:translateY(-50%) rotate(0deg)   scale(1); }
  100% { transform:translateY(-50%) rotate(26deg)  scale(1.12); }
}
@media (prefers-reduced-motion: reduce){
  .content > h1.page-title::before{ animation:none; }
}

/* Against a busier ground, a card needs a firmer edge to stay legible. */
.card{ border-width:1px; border-color:rgba(255,255,255,.7); }
.grid-table thead th{ backdrop-filter:none; }

/* A section label earns a leaf that draws itself in beside it, so a long
   page reads as chapters rather than a run of identical headings. */
.section-label{position:relative;}
.section-label::before{
  content:''; display:inline-block; width:0; height:2px; vertical-align:middle;
  margin-right:0; border-radius:2px;
  background:linear-gradient(90deg,var(--role-accent),var(--leaf-green));
  animation:markDraw var(--dur-3) var(--ease-out) .1s forwards;
}
@keyframes markDraw{ to{ width:18px; margin-right:9px; } }
@media (prefers-reduced-motion: reduce){
  .section-label::before{ width:18px; margin-right:9px; animation:none; }
}

/* ---------- Type scale (guidelines p16) ---------- */
h1.page-title{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 5px;color:var(--deep-green);}
p.page-sub{font-size:13px;color:var(--muted);margin:0 0 22px;font-weight:300;line-height:1.6;}
.section-label{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;margin:24px 0 10px;
  color:var(--tipfa-green);font-family:'Poppins',sans-serif;
}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-sm);
  transition:box-shadow var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out);
}
.card:hover{box-shadow:var(--shadow-md);}

/* ============================================================
   Surfaces

   A card was a white rectangle with a hairline. It is now frosted
   over the canopy, so the greens behind it come through faintly and
   the page reads as one thing rather than paper stacked on paper.
   Lifting on hover, and a slow sheen across it, because a surface
   that answers the pointer feels made rather than generated.
   ============================================================ */
.card{
  background:var(--glass);
  backdrop-filter:saturate(1.5) blur(14px);
  -webkit-backdrop-filter:saturate(1.5) blur(14px);
  border-radius:var(--radius-lg);
  border-color:var(--glass-line);
  position:relative;
  overflow:hidden;
}
/* A hairline of light along the top edge, the way sun catches a leaf. */
.card::before{
  content:''; position:absolute; left:0; right:0; top:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  opacity:.8; pointer-events:none;
}
.card::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--sheen);
  transform:translateX(-120%);
  transition:transform 1.1s var(--ease-out);
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-glow);
  border-color:rgba(126,155,63,.34);
}
.card:hover::after{ transform:translateX(120%); }

/* A tap is not a hover. On a touch screen the sheen never fires, so the
   press itself is the feedback. */
@media (hover:none){
  .card:hover{ transform:none; }
  .card:hover::after{ transform:translateX(-120%); }
}

@media (prefers-reduced-motion: reduce){
  .card::after{ display:none; }
  .card:hover{ transform:none; }
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* ---------- Forms ---------- */
label.f{
  display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.14em;font-family:'Poppins',sans-serif;
}
input, select, textarea{
  width:100%;font-family:'Inter',sans-serif;font-size:13.5px;padding:10px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:#FCFCF8;color:var(--ink);margin-bottom:12px;
  transition:border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out);
}
input:hover, select:hover, textarea:hover{border-color:#C9C6B4;}
input:focus, select:focus, textarea:focus{
  outline:none;border-color:var(--tipfa-green);background:#fff;
  box-shadow:0 0 0 3px rgba(64,94,53,.13);
}
input[type="file"]{padding:8px;background:#F6F5EE;}

.unit-field{display:flex;gap:8px;align-items:stretch;}
.unit-field input{flex:1;min-width:0;}
.unit-field select{flex:none;width:96px;}

tr.crop-edit td{background:#F4F6EA !important;padding:16px 18px;}
tr.crop-edit .ce-head{
  font-family:'Poppins',sans-serif;font-size:12.5px;color:var(--deep-green);margin-bottom:12px;
}
tr.crop-edit .grid2{margin-bottom:4px;}

/* ---------- Buttons ---------- */
.btn{
  padding:11px 20px;border:none;border-radius:999px;background:var(--role-accent);color:#fff;
  font-weight:600;font-size:13.5px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(35,40,31,.10);
  transition:transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(64,94,53,.28);}
.btn:active{transform:translateY(0) scale(.98);}

/* Light travelling across the button as the pointer arrives. One element,
   one transform — nothing that reflows. */
.btn::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--sheen);
  transform:translateX(-130%);
  transition:transform .85s var(--ease-out);
}
.btn:hover::after{ transform:translateX(130%); }
@media (prefers-reduced-motion: reduce){ .btn::after{ display:none; } }
.btn.ghost{background:transparent;border:1.5px solid var(--role-accent);color:var(--role-accent);box-shadow:none;}
.btn.ghost:hover{background:rgba(64,94,53,.07);box-shadow:0 4px 12px rgba(64,94,53,.14);}
.btn.small{padding:8px 14px;font-size:12.5px;}
/* Harvest Orange is the single call to action — rationed, p14 */
.btn.gold{background:var(--harvest-orange);color:var(--deep-green);}
.btn.gold:hover{box-shadow:0 6px 16px rgba(232,167,52,.40);}
.btn .ripple{
  position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.5);
  animation:ripple .62s var(--ease-out);pointer-events:none;
}
.btn.is-busy{pointer-events:none;}
.btn.is-busy::after{
  content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shimmer 1s linear infinite;
}
@keyframes ripple{to{transform:scale(3.2);opacity:0;}}
@keyframes shimmer{from{transform:translateX(-100%);}to{transform:translateX(100%);}}

/* ---------- Metrics ---------- */
.metric{
  background:var(--glass);backdrop-filter:saturate(1.5) blur(14px);
  -webkit-backdrop-filter:saturate(1.5) blur(14px);
  border:1px solid var(--glass-line);border-radius:var(--radius-lg);padding:16px 18px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform var(--dur-3) var(--ease-spring), box-shadow var(--dur-3) var(--ease-out);
}
.metric::after{
  content:'';position:absolute;right:-30px;bottom:-46px;width:100px;height:100px;border-radius:50%;
  background:rgba(126,155,63,.10);transition:transform var(--dur-4) var(--ease-spring);
}
.metric:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.metric:hover::after{transform:scale(1.5);}
.metric .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-family:'Poppins',sans-serif;}
.metric .val{font-size:24px;font-weight:700;margin-top:4px;color:var(--deep-green);letter-spacing:-.02em;position:relative;}

/* ---------- Tables ---------- */
/* A table that cannot fit scrolls sideways inside its own card, rather than
   pushing the whole page sideways — a page that scrolls horizontally is a
   page where the sidebar and the buttons wander off screen.

   This rule spent three releases doing nothing. It was written into the
   file in the middle of the selector `table.grid-table`, leaving
   `table` + comment + `.table-scroll`, which the browser reads as "a
   .table-scroll inside a table" — a thing that never exists. So no table
   ever scrolled, and because a card clips what overflows it, the right-hand
   columns of every wide table were not merely off screen but unreachable. */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-scroll{scrollbar-width:thin;}

/* Keyboard focus. The inputs replace the browser's ring with a green one;
   everything else was relying on whatever the browser drew, which on a
   coloured button can be all but invisible. Same ring everywhere, and only
   for keyboard users, so a mouse click does not leave an outline behind. */
.btn:focus-visible, .chip:focus-visible, .tabbtn:focus-visible,
.segbtn:focus-visible, .logintabs button:focus-visible, a:focus-visible{
  outline:3px solid var(--leaf-green);
  outline-offset:2px;
  border-radius:var(--radius-sm);
}

/* ---------- Charts ---------- */
.chart-wrap{width:100%;}
.trend{width:100%;height:auto;display:block;overflow:visible;}
.trend .gridline{stroke:rgba(35,40,31,.10);stroke-width:1;}
.trend .axis{font-size:10px;fill:var(--muted);font-family:'Inter',sans-serif;}
.trend .ink{fill:none;}
.trend .series-plan{stroke:var(--tipfa-green);stroke-width:2;stroke-dasharray:7 5;opacity:.75;}
.trend .series-actual{stroke:var(--leaf-green);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;}
.trend .dot{fill:var(--leaf-green);stroke:#fff;stroke-width:1.5;}
/* The line draws itself in, once. */
.trend .series-plan, .trend .series-actual{
  stroke-dashoffset:0;
  animation:drawLine 1.5s var(--ease-out) both;
}
.trend .series-actual{stroke-dasharray:1400;animation-name:drawSolid;}
@keyframes drawSolid{ from{ stroke-dashoffset:1400; } to{ stroke-dashoffset:0; } }
@keyframes drawLine{ from{ opacity:0; } to{ opacity:.75; } }
.trend .dot{animation:fadeIn .5s var(--ease-out) 1.2s both;}
.chart-key{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
.chart-key i{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:7px;}
.chart-key i.k-plan{border-top:2px dashed var(--tipfa-green);}
.chart-key i.k-actual{border-top:3px solid var(--leaf-green);}
.chart-key em{font-style:normal;opacity:.7;}

.trend.bars rect{transform-box:fill-box;transform-origin:50% 100%;
  animation:barRise .8s var(--ease-spring) both;}
.trend.bars .bar-a{animation-delay:.12s;}
@keyframes barRise{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
.chart-key i.k-hatch{border-top:8px solid var(--tipfa-green);opacity:.5;height:0;}
.chart-key i.k-solid{border-top:8px solid var(--leaf-green);height:0;}

.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.donut{width:170px;height:170px;flex:0 0 auto;transform:rotate(-90deg);}
.donut-track{fill:none;stroke:rgba(35,40,31,.07);}
.donut .slice{fill:none;stroke-linecap:butt;
  animation:sliceIn .9s var(--ease-out) both;}
@keyframes sliceIn{ from{ opacity:0; stroke-width:6; } to{ opacity:1; } }
.donut-key{list-style:none;margin:0;padding:0;flex:1;min-width:200px;}
.donut-key li{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;
  border-bottom:1px solid var(--line-soft);}
.donut-key li:last-child{border-bottom:none;}
.donut-key i{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
.donut-key span{flex:1;}
.donut-key strong{font-variant-numeric:tabular-nums;}
.donut-key em{font-style:normal;color:var(--muted);min-width:38px;text-align:right;
  font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){
  .trend.bars rect, .donut .slice{animation:none;transform:none;opacity:1;}
}

.ring{text-align:center;}
.ring svg{width:100%;max-width:118px;height:auto;transform:rotate(-90deg);}
.ring-track{fill:none;stroke:rgba(35,40,31,.09);stroke-width:9;}
.ring-fill{fill:none;stroke-width:9;stroke-linecap:round;
  animation:ringFill 1.3s var(--ease-out) .15s forwards;}
@keyframes ringFill{ to{ stroke-dashoffset:var(--ring-to); } }
.ring-mid{margin-top:-72px;margin-bottom:34px;font-family:'Poppins',sans-serif;
  font-size:21px;font-weight:700;color:var(--deep-green);}
.ring-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--muted);font-weight:600;}

@media (prefers-reduced-motion: reduce){
  .trend .series-plan, .trend .series-actual, .trend .dot{animation:none;stroke-dashoffset:0;opacity:1;}
  .trend .series-plan{opacity:.75;}
  .ring-fill{animation:none;stroke-dashoffset:var(--ring-to);}
}

/* An action this role may not take. Dimmed rather than removed, so an
   operator can see the association does the thing and know to ask, instead
   of concluding the platform cannot. */
.not-allowed{
  opacity:.42;
  cursor:not-allowed !important;
  filter:grayscale(.5);
}
.not-allowed:hover{transform:none !important;box-shadow:none !important;}

/* ============================================================
   The phone's app bar and its one drawer

   Drawn only in the mobile appearance. A three-line button, the
   section you are on, and the mark. Everything you can go to is
   behind that button, in one list, grouped as the desktop rail
   groups it — not split between a bar and an overflow sheet.
   ============================================================ */
.appbar{display:none;}
.navdrawer{display:none;}

:root[data-view="mobile"] .appbar{
  display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:60;
  padding:8px 12px calc(8px) ; min-height:56px;
  background:rgba(255,255,255,.985);
  backdrop-filter:saturate(1.5) blur(18px); -webkit-backdrop-filter:saturate(1.5) blur(18px);
  border-bottom:1px solid var(--line-soft);
}
.ab-burger{
  position:relative; flex:none; width:44px; height:44px;    /* full touch target */
  display:flex; align-items:center; justify-content:center;
  border:none; background:none; cursor:pointer; border-radius:12px;
  -webkit-tap-highlight-color:transparent;
}
.ab-burger:active{background:rgba(64,94,53,.09);}
.ab-lines{display:flex; flex-direction:column; gap:4px; width:19px;}
.ab-lines i{display:block; height:2px; border-radius:2px; background:var(--deep-green);}
.ab-lines i:nth-child(2){width:76%;}   /* the middle line short, so it reads as a menu */
/* The count rides the corner of the button with a ring of the bar's own
   colour, so it reads as sitting on top of the lines rather than crossing
   one of them. */
.ab-dot{
  position:absolute; top:2px; right:0; min-width:16px; padding:0 3px;
  border-radius:99px; background:var(--harvest-orange); color:var(--deep-green);
  border:2px solid #fff;
  font-size:9.5px; font-weight:700; line-height:16px; text-align:center;
}
.ab-where{flex:1; min-width:0;}
.ab-sec{
  font-family:'Poppins',sans-serif; font-size:15px; font-weight:600;
  color:var(--deep-green); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ab-mark{width:26px; height:26px; flex:none; opacity:.9;}

/* ---- the drawer ---- */
/* :not([hidden]) is load-bearing: an attribute-scoped class rule outranks
   the browser's own [hidden]{display:none}, and without it the shut drawer
   stays a full-screen invisible pane that eats every tap on the site. */
:root[data-view="mobile"] .navdrawer:not([hidden]){
  display:block; position:fixed; inset:0; z-index:80;
}
.nd-scrim{position:absolute; inset:0; background:rgba(35,40,31,.46);
  animation:fadeIn var(--dur-2) var(--ease-out) both;}
.nd-panel{
  position:absolute; top:0; bottom:0; left:0;
  width:min(86vw, 340px); display:flex; flex-direction:column;
  background:var(--field-cream); box-shadow:2px 0 30px -8px rgba(35,40,31,.45);
  padding:calc(10px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);
  animation:drawerIn var(--dur-3) var(--ease-spring) both;
}
@keyframes drawerIn{ from{ transform:translateX(-100%); } to{ transform:translateX(0); } }
.nd-head{display:flex; align-items:center; justify-content:space-between;
  padding:4px 8px 10px 18px;}
.nd-title{font-family:'Poppins',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
.nd-close{width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  border:none; background:none; cursor:pointer; color:var(--deep-green); border-radius:12px;}
.nd-close:active{background:rgba(64,94,53,.09);}
.nd-close svg{width:19px; height:19px;}

.nd-list{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 12px 14px;
  overscroll-behavior:contain;}   /* scrolling the list does not drag the page */
.nd-group{font-size:9.5px; text-transform:uppercase; letter-spacing:.16em;
  font-weight:700; color:var(--muted); padding:15px 6px 6px;}
.nd-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; min-height:46px; text-align:left; border:none; cursor:pointer;
  background:transparent; border-radius:12px; padding:11px 12px; margin-bottom:2px;
  font-size:14.5px; color:var(--ink); font-family:'Inter',sans-serif;
  transition:background var(--dur-1) var(--ease-out);
}
.nd-item:active{background:rgba(64,94,53,.09);}
.nd-item.active{background:var(--tipfa-green); color:var(--field-cream); font-weight:600;}
.nd-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nd-badge{flex:none; min-width:19px; padding:0 5px; border-radius:99px;
  background:var(--harvest-orange); color:var(--deep-green);
  font-size:11px; font-weight:700; line-height:19px; text-align:center;}
.nd-item.active .nd-badge{background:var(--field-cream); color:var(--deep-green);}

/* The way out sits below a rule, away from the section it would
   otherwise be mistaken for. */
.nd-foot{border-top:1px solid var(--line-soft); padding:12px 18px 16px; flex:none;}
.nd-acct{display:flex; align-items:center; gap:10px;}
.nd-who{flex:1; min-width:0;}
.nd-name{font-family:'Poppins',sans-serif; font-size:14px; font-weight:600;
  color:var(--deep-green); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nd-sub{font-size:11.5px; color:var(--muted); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;}
.nd-initials{width:36px; height:36px; flex:none; border-radius:11px;
  background:var(--tipfa-green); color:var(--field-cream);
  display:flex; align-items:center; justify-content:center;
  font-family:'Poppins',sans-serif; font-size:13px; font-weight:600;}
.nd-tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:11px 0 0;}
.nd-tools .refresh-btn{margin-left:0;}
.nd-tools .cloud-badge{margin-left:0;}
.nd-out{
  width:100%; min-height:44px; margin-top:11px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); border-radius:12px;
  font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; color:var(--deep-green);
}
.nd-out:active{background:#F3F1E6;}

/* The page behind a drawer must not scroll under it. */
:root[data-view="mobile"] body.nav-open{overflow:hidden;}

@media (prefers-reduced-motion: reduce){
  .nd-panel, .nd-scrim{animation:none;}
}

/* ---------- A copy of the platform that is behind the server ---------- */
.stalebar:empty{display:none;}
.stalebar > div:first-child{flex:1; min-width:0;}
.stalebar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:#FBF4E3; border-bottom:1px solid #EBD9A8; color:#6E4E0C;
  padding:11px 18px; font-size:13px; position:relative; z-index:65;
}
.stalebar strong{font-family:'Poppins',sans-serif; font-weight:600;}
.sb-sub{margin-top:2px; opacity:.85; line-height:1.5;}
.sb-go{
  flex:none; min-height:38px; padding:0 16px; cursor:pointer;
  border:1px solid #C89A2B; background:var(--harvest-orange); color:var(--deep-green);
  border-radius:99px; font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
}
.sb-go:active{transform:scale(.97);}
@media (max-width:760px){ .stalebar{padding:10px 14px; font-size:12.5px;} }

/* ---------- Navigation groups ---------- */
.nav-group{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;
  color:var(--muted);padding:16px 14px 5px;
}
.nav-group:first-child{padding-top:4px;}
.tabbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tab-badge{
  min-width:19px;padding:1px 6px;border-radius:99px;background:var(--harvest-orange);
  color:var(--deep-green);font-size:10.5px;font-weight:700;line-height:1.5;
  font-family:'Inter',sans-serif;
}

.grid-table{width:100%;border-collapse:collapse;font-size:13px;}
table.grid-table th{
  background:var(--tipfa-green);color:var(--field-cream);text-align:left;padding:10px 12px;font-size:10px;
  text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-family:'Poppins',sans-serif;
}
table.grid-table th:first-child{border-radius:var(--radius-sm) 0 0 0;}
table.grid-table th:last-child{border-radius:0 var(--radius-sm) 0 0;}
table.grid-table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);}
table.grid-table tbody tr{transition:background var(--dur-1) var(--ease-out);}
table.grid-table tr:nth-child(even) td{background:#F8F7F0;}
table.grid-table tbody tr:hover td{background:#EFEFE2;}
table.grid-table input{margin:0;padding:7px 9px;font-size:12.5px;}

/* ---------- Status pills ---------- */
.status-pill{
  font-size:10px;font-weight:600;padding:4px 11px;border-radius:99px;display:inline-block;
  font-family:'Poppins',sans-serif;letter-spacing:.02em;
}
.status-open{background:#F6E3D3;color:var(--soil);}
.status-progress{background:#FBEECC;color:#8A6412;}
.status-resolved{background:#DFE7D2;color:var(--deep-green);}
.status-active{background:#DFE7D2;color:var(--deep-green);}
.status-pending{background:#FBEECC;color:#8A6412;animation:softPulse 2.6s var(--ease-in-out) infinite;}
.status-rejected{background:#F3DCD8;color:var(--red);}
@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,167,52,.42);}50%{box-shadow:0 0 0 6px rgba(232,167,52,0);}}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.chip{
  padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;
  cursor:pointer;color:var(--muted);font-weight:500;
  transition:transform var(--dur-1) var(--ease-spring), background var(--dur-2) var(--ease-out), color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2);
}
.chip:hover{transform:translateY(-2px);border-color:var(--leaf-green);color:var(--deep-green);box-shadow:var(--shadow-sm);}
.chip.active{background:var(--role-accent);border-color:var(--role-accent);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(64,94,53,.24);}

/* ---------- Banners & helpers ---------- */
.msg-banner{
  background:#DFE7D2;color:var(--deep-green);padding:12px 16px;border-radius:var(--radius-sm);font-size:12.5px;
  margin-bottom:14px;font-weight:500;display:flex;align-items:center;gap:10px;
  animation:bannerIn var(--dur-3) var(--ease-spring) both;border-left:3px solid var(--leaf-green);
}
.msg-banner svg{flex:none;stroke:var(--tipfa-green);}
.helper{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6;}
.err-shake{animation:shake .42s var(--ease-in-out);}
.log-item{
  font-size:12px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line-soft);
  display:flex;gap:12px;animation:riseIn var(--dur-3) var(--ease-out) both;
}
.log-item .t{font-variant-numeric:tabular-nums;color:var(--leaf-green);font-weight:500;flex:none;}

/* ---------- Farm logos ------------------------------------
   Member marks are placed from assets/farms/<farm-name>.png.
   If a file is missing the monogram shows instead, so the
   layout never breaks.                                     */
.farm-logo{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--line-soft);
  overflow:hidden;position:relative;
  transition:transform var(--dur-2) var(--ease-spring), box-shadow var(--dur-2) var(--ease-out);
}
.farm-logo img{width:100%;height:100%;object-fit:contain;padding:3px;display:block;}
.farm-logo .farm-initials{
  display:none;font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;color:var(--tipfa-green);
  letter-spacing:.02em;
}
.farm-logo.is-missing{background:#EDEBDE;}
.farm-logo.is-missing .farm-initials{display:block;}
.farm-logo.lg{width:64px;height:64px;border-radius:16px;}
.farm-logo.lg .farm-initials{font-size:20px;}
.farm-logo.xl{width:88px;height:88px;border-radius:20px;}
.farm-logo.xl .farm-initials{font-size:27px;}
.farm-logo.sm{width:28px;height:28px;border-radius:8px;}
.farm-logo.sm .farm-initials{font-size:10px;}
.farm-logo:hover{transform:scale(1.06) rotate(-1.5deg);box-shadow:var(--shadow-md);}
.farm-cell{display:flex;align-items:center;gap:10px;}
.farm-cell .fname{font-weight:500;}

.logo-picker{
  display:flex;gap:16px;align-items:flex-start;padding:14px;margin-bottom:16px;
  background:#F7F6EF;border:1px dashed var(--line);border-radius:var(--radius);
}
.logo-picker .lp-body{flex:1;min-width:0;}
.logo-picker input[type="file"]{margin-bottom:6px;}
.logo-picker .farm-logo{background:#fff;}

.empty-state{text-align:center;padding:38px 26px;}
.empty-state .es-mark{
  width:52px;height:52px;border-radius:50%;background:#EEF0E4;color:var(--tipfa-green);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  animation:softPulse 3s var(--ease-in-out) infinite;
}
.empty-state .es-mark svg{width:24px;height:24px;}
.empty-state h3{font-family:'Poppins',sans-serif;font-size:16px;font-weight:600;color:var(--deep-green);margin:0 0 6px;}
.empty-state p{font-size:13px;color:var(--muted);margin:0 auto;max-width:46ch;line-height:1.6;}
.empty-state .btn{margin-top:16px;}

/* Farm identity header on member pages */
/* The arc behind a farm's name is decoration and was drawn 23px past the
   right edge of a 360px screen — enough to make the whole page pannable. */
.farm-head{
  display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.farm-head .fh-arc{position:absolute;right:-40px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:rgba(126,155,63,.10);}
.farm-head .fh-meta{position:relative;z-index:1;}
.farm-head h2{margin:0;font-size:19px;font-weight:700;color:var(--deep-green);letter-spacing:-.01em;}
.farm-head .fh-sub{font-size:12px;color:var(--muted);margin-top:3px;}

/* ---------- Motion primitives ---------- */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes panelIn{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
@keyframes logoIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
@keyframes growBar{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes bannerIn{from{opacity:0;transform:translateY(-10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-6px);}40%,60%{transform:translateX(6px);}}
@keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes wipeIn{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes wipeOut{from{transform:scaleY(1);}to{transform:scaleY(0);}}

.bar-fill{transform-origin:left center;}

/* Staggered reveal, applied per render */
.reveal{animation:riseIn var(--dur-3) var(--ease-out) both;}
.reveal-1{animation-delay:.04s;} .reveal-2{animation-delay:.08s;}
.reveal-3{animation-delay:.12s;} .reveal-4{animation-delay:.16s;}
.reveal-5{animation-delay:.20s;} .reveal-6{animation-delay:.24s;}
.reveal-7{animation-delay:.28s;} .reveal-8{animation-delay:.32s;}
.content.is-swapping{animation:fadeIn var(--dur-2) var(--ease-out) both;}

/* Scroll reveal */
.onscroll{opacity:0;transform:translateY(20px);transition:opacity var(--dur-4) var(--ease-out), transform var(--dur-4) var(--ease-out);}
.onscroll.seen{opacity:1;transform:none;}

/* Route transition curtain — a cropped arc, in keeping with p17 */
.curtain{
  position:fixed;inset:0;z-index:90;pointer-events:none;background:var(--deep-green);
  transform-origin:bottom;transform:scaleY(0);
}
.curtain.in{animation:wipeIn .42s var(--ease-in-out) forwards;}
.curtain.out{transform-origin:top;animation:wipeOut .42s var(--ease-in-out) forwards;}


/* On a narrow screen a table is given a floor to sit on, so its columns
   scroll rather than crushing to one word per line. Above that width it is
   left alone — a two-column table should not scroll on a laptop. */
/* Frosted glass is drawn by compositing everything behind it, every frame.
   On a mid-range Android that is real money for an effect nobody looks at
   while scrolling a price list, so below the tablet breakpoint the surfaces
   go opaque and keep the same colour. The site looks the same and scrolls
   like a list again. */
@media (max-width:900px){
  .card, .metric, .app, .sidebar{
    backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  }
  .card, .metric{ background:rgba(255,255,255,.94); }
  .app{ background:linear-gradient(180deg, rgba(244,242,232,.72), rgba(239,237,226,.88)); }
  .sidebar{ background:linear-gradient(180deg,#EBE9DC 0%, rgba(239,237,226,.86) 100%); }
  .canopy{ filter:blur(16px); }
  .canopy::after{ display:none; }
}

/* ============================================================
   On a phone

   Everything above is sized for a laptop. At 360px — which is most
   Android phones sold in Tanzania — the same padding and the same
   type turn a screen of information into three screens of scrolling,
   and the eye has to travel further to read less.

   Nothing is hidden here. Things are simply drawn at the size the
   screen actually is.
   ============================================================ */
@media (max-width:640px){
  .content{padding:16px 14px 44px;}
  .card{padding:14px 15px;margin-bottom:11px;border-radius:var(--radius);}
  h1.page-title{font-size:21px;}
  p.page-sub{font-size:12.5px;margin-bottom:16px;}
  .section-label{margin:18px 0 8px;}

  /* Two figures to a row rather than one. Three stacked full-width cards
     to say three numbers is a screen and a half of scrolling. */
  .grid2, .grid3, .grid4{grid-template-columns:1fr 1fr;gap:9px;}
  .metric{padding:11px 12px;border-radius:var(--radius);}
  .metric .val{font-size:19px;}
  .metric .lbl{font-size:8.5px;letter-spacing:.12em;}
  .metric::after{display:none;}

  /* A form field to a line, at a size a thumb can hit and a phone will
     not zoom into. iOS zooms any input under 16px. */
  .grid2 > div, .grid3 > div{grid-column:1 / -1;}
  input, select, textarea{font-size:16px;padding:11px 13px;}
  label.f{font-size:10.5px;}

  .farm-head{padding:13px 14px;gap:12px;}
  .farm-head h2{font-size:16.5px;}
  .today-item{padding:12px 14px;}
  .ti-title{font-size:13.5px;}
  .ti-go{font-size:12px;}
  .prog-summary{gap:16px;}
  .prog-summary strong{font-size:18px;}
  .pg-stage-card{padding:12px 13px;}
  .btn{padding:11px 17px;}
  .helper{font-size:12px;}

  /* A table becomes a list of rows. Each cell keeps the heading it sat
     under, so a row reads top to bottom instead of left to right, and
     there is nothing beside anything to be cut off by the screen edge. */
  .table-scroll{overflow-x:visible;}
  .table-scroll > .grid-table{min-width:0;}
  .grid-table thead{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;}   /* still read aloud, not drawn */
  .grid-table, .grid-table tbody, .grid-table tr, .grid-table td{display:block;width:auto;}
  .grid-table tr{
    border:1px solid var(--line-soft);border-radius:var(--radius-sm);
    padding:4px 12px;margin-bottom:9px;background:rgba(255,255,255,.62);
  }
  .grid-table tr:last-child{margin-bottom:0;}
  .grid-table td{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    padding:7px 0;border:none;border-bottom:1px solid var(--line-soft);
    text-align:right;
  }
  .grid-table tr td:last-child{border-bottom:none;}
  .grid-table td::before{
    content:attr(data-label);
    flex:0 0 42%;text-align:left;
    font-size:10px;text-transform:uppercase;letter-spacing:.11em;
    font-weight:700;color:var(--muted);padding-top:2px;
  }
  /* A cell with no heading of its own — a note, or a row of buttons —
     takes the whole width rather than pretending to be a field. */
  .grid-table td:not([data-label]){display:block;text-align:left;}
  .grid-table td[data-span]{display:block;text-align:left;}
  .grid-table td:empty{display:none;}
  .grid-table tfoot td{display:flex;}
  .pg-lines .pg-col-tick{width:auto;}
}

/* Narrower again. 360px is the commonest Android width in service and two
   figures sit side by side there comfortably, so this only takes over below
   that — a 320px screen, where they genuinely do not. */
@media (max-width:344px){
  .grid2, .grid3, .grid4{grid-template-columns:1fr;}
  .content{padding:14px 11px 40px;}
  h1.page-title{font-size:19.5px;}
}

/* A phone that says it wants less motion gets a still page, not a slow one. */
@media (prefers-reduced-motion: reduce){
  .canopy, .loginbrand::before, .loginbrand::after,
  .content > h1.page-title::before{ animation:none !important; }
}

/* Between the phone and the laptop a table is still a table, and is given a
   floor so its columns do not crush. Below 640px it is not a table at all —
   it is a list of rows — so the floor would only push the values off the
   side of the card, which is exactly what it was doing. */
@media (min-width:641px) and (max-width:760px){
  .table-scroll > .grid-table{min-width:540px;}
}
@media (max-width:760px){
  /* Enough of a target to hit with a thumb, per WCAG 2.2 target size. */
  .chip, .btn.small{min-height:34px;display:inline-flex;align-items:center;justify-content:center;}
}



/* ---- Year and month chips ------------------------------------------ */
.chip{transition:background .2s, color .2s, transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .2s;}
.chip:hover{transform:translateY(-2px);box-shadow:0 5px 14px -6px rgba(35,40,31,.4);}
.chip:active{transform:translateY(0) scale(.96);}
.chip.active{animation:chipOn .4s cubic-bezier(.2,.9,.3,1);}
@keyframes chipOn{0%{transform:scale(.86);}60%{transform:scale(1.07);}100%{transform:none;}}
.year-nav .chip.nav{font-weight:700;padding-left:11px;padding-right:11px;}

@media (prefers-reduced-motion: reduce){
  .datepop, .dp-cell, .chip, .date-trigger{transition:none !important;animation:none !important;}
}

/* ---- Motion across the platform ------------------------------------
   Every surface arrives rather than appearing: cards rise in sequence,
   table rows follow one another, figures count and settle. Nothing here
   moves a logo out of position (Brand Guidelines p11), and everything
   stops for a viewer who has asked for less motion. */
.content .card{animation:cardRise .5s cubic-bezier(.2,.9,.3,1) backwards;}
.content .card:nth-of-type(2){animation-delay:.05s;}
.content .card:nth-of-type(3){animation-delay:.1s;}
.content .card:nth-of-type(4){animation-delay:.15s;}
.content .card:nth-of-type(n+5){animation-delay:.2s;}
@keyframes cardRise{
  from{opacity:0;transform:translateY(18px) scale(.985);}
  to{opacity:1;transform:none;}
}
.content .section-label{animation:labelSlide .45s cubic-bezier(.2,.9,.3,1) backwards;}
@keyframes labelSlide{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:none;}}

.grid-table tbody tr{animation:rowIn .42s cubic-bezier(.2,.9,.3,1) backwards;}
.grid-table tbody tr:nth-child(1){animation-delay:.02s;}
.grid-table tbody tr:nth-child(2){animation-delay:.06s;}
.grid-table tbody tr:nth-child(3){animation-delay:.1s;}
.grid-table tbody tr:nth-child(4){animation-delay:.14s;}
.grid-table tbody tr:nth-child(5){animation-delay:.18s;}
.grid-table tbody tr:nth-child(n+6){animation-delay:.22s;}
@keyframes rowIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
.grid-table tbody tr{transition:background .2s ease, transform .2s cubic-bezier(.2,.9,.3,1);}
.grid-table tbody tr:hover{background:var(--field-cream);}

.metric{animation:metricPop .55s cubic-bezier(.2,.9,.3,1) backwards;
  transition:transform .22s cubic-bezier(.2,.9,.3,1), box-shadow .22s;}
.metric:nth-child(2){animation-delay:.07s;}
.metric:nth-child(3){animation-delay:.14s;}
.metric:nth-child(n+4){animation-delay:.2s;}
.metric:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(35,40,31,.5);}
@keyframes metricPop{
  0%{opacity:0;transform:translateY(14px) scale(.94);}
  70%{transform:translateY(-2px) scale(1.012);}
  100%{opacity:1;transform:none;}
}

.btn{transition:transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .22s, background .2s, color .2s, border-color .2s;}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(0) scale(.97);}
.tabbtn{transition:background .2s, color .2s, transform .2s cubic-bezier(.2,.9,.3,1), padding-left .2s;}
.tabbtn:hover{transform:translateX(3px);}
input, select, textarea{transition:border-color .2s, box-shadow .2s, transform .18s;}
input:focus, select:focus, textarea:focus{transform:translateY(-1px);}

@media (prefers-reduced-motion: reduce){
  .content .card, .content .section-label, .grid-table tbody tr, .metric,
  .btn, .tabbtn, input, select, textarea{
    animation:none !important;transition:none !important;transform:none !important;
  }
}


.local-only{border-left:4px solid var(--gold);background:#FDF3E3;}
.restoring-card{max-width:420px;margin:60px auto;text-align:center;padding:44px 26px;}
.restoring-card h2{font-family:'Poppins',sans-serif;color:var(--tipfa-green);margin:12px 0 6px;font-size:19px;}
.restoring-card .es-mark{margin:0 auto;}
.restoring-card .es-mark svg{animation:spin 1.4s linear infinite;}
@media (prefers-reduced-motion: reduce){ .restoring-card .es-mark svg{animation:none;} }
/* ---------- Import your own programme ---------- */
.import-card{border:1px dashed var(--line);background:#FAFAF4;}
.import-opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.import-result{
  margin-top:10px;font-size:12.5px;padding:10px 12px;border-radius:var(--radius-sm);
  background:#DFE7D2;color:var(--deep-green);
}
.import-result.bad{background:#F3DCD8;color:var(--red);}
.cloud-badge{
  display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:4px 11px;border-radius:99px;
  font-size:11px;font-weight:600;font-family:'Poppins',sans-serif;border:1px solid var(--line);background:#fff;
}
.cloud-badge .cloud-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}
.cloud-badge.ok{color:var(--deep-green);border-color:#C8D5B3;background:#F1F6E8;}
.cloud-badge.ok .cloud-dot{background:var(--leaf-green);}
.cloud-badge.wait{color:#8A6412;border-color:#EBD9A8;background:#FBF4E3;}
.cloud-badge.wait .cloud-dot{background:var(--harvest-orange);animation:softPulse 1.6s var(--ease-in-out) infinite;}
.cloud-badge.off{color:var(--muted);}

.diag-line{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;margin-bottom:6px;font-size:12.5px;}
.diag-line .diag-mark{
  flex:none;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;font-family:'Poppins',sans-serif;
}
.diag-line.ok{background:#F1F6E8;} .diag-line.ok .diag-mark{background:var(--leaf-green);}
.diag-line.bad{background:#F8E4E0;} .diag-line.bad .diag-mark{background:var(--red);}
.diag-line.note{background:#F6F5EE;} .diag-line.note .diag-mark{background:var(--muted);}

.fatal-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:120;background:var(--red);color:#fff;
  padding:12px 16px;font-size:12.5px;line-height:1.5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.fatal-bar button{
  margin-left:auto;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;
  border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Poppins',sans-serif;
}

/* ---------- Print ---------- */
@media print{
  .topbar, .subbar, .sidebar, .btn, .chips, input[type="file"], .arcfield, .curtain{ display:none !important; }
  .ts-actions{ display:none !important; }
  .app{ max-width:100%; }
  .content{ padding:0; }
  .card{ break-inside:avoid; border:1px solid #999; box-shadow:none; }
  .prog-table td, .prog-table th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .pg-edit{ display:none !important; }
  body{ background:#fff; }
  *{animation:none !important;}
}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .loginwrap{grid-template-columns:1fr;}
  /* On a phone the sign-in form comes first: the brand panel keeps the logo
     and the strapline, and drops the supporting detail. */
  .loginbrand{padding:28px 26px 30px;}
  .loginbrand .lb-logo{width:180px;margin-bottom:20px;}
  .loginbrand h2{font-size:22px;}
  .loginbrand .strap{margin-bottom:0;font-size:13px;}
  .values, .lb-foot{display:none;}
  .loginpane{padding:32px 22px 44px;}
}
/* ============================================================
   The mobile appearance

   Not the desktop console at a smaller size. One column, one bar,
   one navigation, one thing to read at a time. The desktop chrome —
   the green masthead, the sign-in strip, the side rail — is not
   shrunk here, it is replaced by the app bar and the drawer.

   760px is the line, and it is the same 760 the head script and
   MOBILE_MAX use. A test holds the three to each other.
   ============================================================ */
@media (max-width:760px){
  /* the desktop chrome, replaced rather than squeezed */
  .topbar{display:none;}
  .subbar{display:none;}
  .sidebar{display:none;}
  .layout{grid-template-columns:1fr;}

  /* one column. A phone reads down, not across. */
  .grid2, .grid3, .grid4{grid-template-columns:1fr;}
  /* two-up is for numbers only, where a stack would be a long march */
  .grid3.metrics, .grid4.metrics, .metric-row{grid-template-columns:1fr 1fr;}

  .content{padding:16px 14px calc(28px + env(safe-area-inset-bottom));}
  .app{padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}

  /* Nothing is allowed to set its own width past the screen. */
  .content, .content *{max-width:100%;}
  .card{border-radius:16px;}

  /* The app bar already names the section in the same words. Printing it
     again as a 25px heading spent three lines saying nothing new, so it is
     kept for the heading outline and for a screen reader, and not drawn. */
  h1.page-title{
    position:absolute; width:1px; height:1px; margin:0; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;
  }
  .content > h1.page-title::before{display:none;}
  p.page-sub{margin:0 0 16px; font-size:13px;}

  /* Four stage cards side by side is four columns of broken words. */
  .stage-rail{grid-template-columns:1fr;}
  .quick-grid{grid-template-columns:1fr;}

  /* A file input's native button plus its filename does not fit beside a
     label on a phone; give it the whole line. */
  input[type="file"]{width:100%;}

  /* 44px is the floor for anything a thumb has to land on (HIG 44pt,
     Material 48dp). Several fields and buttons were coming out at 38-42. */
  input:not([type="checkbox"]):not([type="radio"]), select, textarea,
  .btn, button.tabbtn, .chip{min-height:44px;}
  .btn{display:inline-flex; align-items:center; justify-content:center;}
  .chip{display:inline-flex; align-items:center;}
}

/* Above the line the login screen keeps its masthead; below it the hero
   carries the identity on its own and the bar would only repeat it. */
@media (max-width:760px){
  .appbar:empty{display:none;}
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
  .onscroll{opacity:1;transform:none;}
}


/* ============================================================
   The crop calendar
   The template's timeline: a row for every planting, a column for
   every week, each week coloured by stage. The stage colours are
   the template's own and are written from STAGES at start-up, so
   there is one list of them, not two.
   ============================================================ */

/* An icon inside a button sits on the text's line, not above it. */
.content .btn svg, .cc-tool svg{width:16px;height:16px;vertical-align:-3px;margin-right:3px;flex:none;}
.content .btn{display:inline-flex;align-items:center;justify-content:center;gap:2px;}

/* ---- How the farm is divided, at a glance ---- */
.cc-layout-line{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:14px;
  background:rgba(255,255,255,.72);border:1px solid var(--line-soft);font-size:13px;
}
.cc-layout-line .ll-icon{color:var(--leaf-green);display:flex;}
.cc-layout-line .ll-text{flex:1;min-width:200px;color:var(--ink);}
.cc-layout-line .ll-text strong{font-family:'Poppins',sans-serif;color:var(--deep-green);}

/* ---- Toolbar: the window, the key, the actions ---- */
.cc-toolbar{display:grid;gap:12px;}
.cc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cc-row .grow{flex:1;}
.cc-window{display:inline-flex;align-items:center;gap:4px;background:#F4F3EA;border-radius:99px;padding:3px;}
.cc-window button{border:none;background:none;cursor:pointer;color:var(--deep-green);display:flex;
  align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;}
.cc-window button:hover{background:#fff;}
.cc-window .cw-label{font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;color:var(--deep-green);
  padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.cc-hint{font-size:12px;color:var(--muted);line-height:1.5;}
.cc-hint strong{color:var(--deep-green);}

.cc-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.cc-tools .tl-label{font-family:'Poppins',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-right:4px;}
.cc-tool{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;cursor:pointer;
  border-radius:99px;padding:5px 11px 5px 6px;font-size:12px;color:var(--ink);font-family:'Inter',sans-serif;
  transition:transform .15s var(--ease-out), box-shadow .2s, border-color .2s;
}
.cc-tool:hover{transform:translateY(-1px);box-shadow:0 4px 12px -6px rgba(35,40,31,.35);}
.cc-tool .sw{width:16px;height:16px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.cc-tool.active{border-color:var(--deep-green);box-shadow:0 0 0 2px var(--deep-green);font-weight:600;}
.cc-tool.clear .sw{background:repeating-linear-gradient(135deg,#fff 0 3px,#E3E1D6 3px 6px);}
.cc-kg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);}
.cc-kg input{width:84px;margin:0;padding:6px 8px;}

/* ---- The grid ---- */
.cc-card{padding:0 !important;overflow:hidden;}
/* The grid is fenced off from the page: with a height of its own (set from
   script to fit its rows, up to the screen) and strict containment, nothing
   that changes above it makes the browser lay out its thousands of cells
   again, and nothing inside it spills out. */
.cc-scroll{overflow-x:hidden;overflow-y:auto;scrollbar-gutter:stable;max-height:calc(100vh - 190px);min-height:220px;position:relative;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;contain:strict;}
.cc-scroll.painting{cursor:crosshair;}
table.cc-grid{border-collapse:separate;border-spacing:0;font-size:12px;table-layout:fixed;}
.cc-grid th, .cc-grid td{border-bottom:1px solid #ECEBE2;padding:0;}
.cc-grid thead th{position:sticky;z-index:3;font-family:'Poppins',sans-serif;font-weight:600;}
.cc-grid thead tr.mh th{top:0;height:30px;background:var(--deep-green);color:var(--field-cream);
  font-size:10px;letter-spacing:.1em;text-align:center;border-left:1px solid rgba(255,255,255,.18);}
.cc-grid thead tr.mh th.ystart{border-left:2px solid var(--harvest-orange);}
.cc-grid thead tr.wh th{top:30px;height:22px;background:#E4EBD8;color:var(--deep-green);font-size:9.5px;
  text-align:center;border-left:1px solid rgba(64,94,53,.12);}
.cc-grid thead tr.wh th.mstart{border-left:1px solid rgba(64,94,53,.35);}
.cc-grid thead th.now{background:var(--harvest-orange) !important;color:#fff !important;}

/* Columns that stay put while the weeks scroll past them. */
.cc-grid .stk{position:sticky;z-index:2;background:#fff;}
.cc-grid thead .stk{z-index:4;text-align:left;padding:0 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
.cc-grid thead tr.mh .stk{background:var(--deep-green);}
.cc-grid thead .cc-corner{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc-grid thead tr.wh .stk{background:#E4EBD8;}
.cc-grid .stk.edge{box-shadow:6px 0 8px -6px rgba(35,40,31,.22);}
.cc-grid tbody td.stk{padding:0 10px;height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc-grid tbody tr:hover td.stk{background:#F6F6EF;}
.cc-grid .c-block{color:var(--deep-green);font-weight:500;}
.cc-grid .c-area{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);}
.cc-grid .c-notes{color:var(--muted);font-size:11.5px;}
.cc-grid .c-crop{font-weight:600;color:var(--deep-green);}
.cc-crop-cell{display:flex;align-items:center;gap:4px;min-width:0;}
.cc-crop-cell .cn{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;cursor:pointer;}
.cc-crop-cell .cn:hover{text-decoration:underline;}
.cc-crop-cell .sub{display:block;font-weight:400;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
.cc-rowbtn{border:none;background:none;cursor:pointer;color:var(--muted);padding:3px;border-radius:6px;display:flex;flex:none;}
.cc-rowbtn svg{width:15px;height:15px;}
.cc-rowbtn:hover{color:var(--deep-green);background:#E9EEDF;}

.cc-grid td.wk{height:32px;text-align:center;cursor:pointer;overflow:hidden;white-space:nowrap;
  font-size:9px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  border-left:1px solid #F1F0E8;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y;}
.cc-grid td.wk.mstart{border-left:1px solid #D9D8CC;}
.cc-grid td.wk.ystart{border-left:2px solid rgba(232,167,52,.7);}
.cc-grid td.wk.now:not([class*=" s-"]){background:#FDF3DE;}
.cc-grid td.wk:hover{box-shadow:inset 0 0 0 2px rgba(35,40,31,.5);}
.cc-grid td.wk.pv{box-shadow:inset 0 0 0 2px var(--deep-green);}
.cc-grid td.wk.pv.pv-clear{background:repeating-linear-gradient(135deg,#fff 0 3px,#E3E1D6 3px 6px) !important;color:transparent;}
.cc-grid.readonly td.wk{cursor:default;}
.cc-grid.readonly td.wk:hover{box-shadow:none;}

/* A greenhouse heading inside the grid, when there is more than one. */
.cc-grid tr.cc-unit th{position:sticky;left:0;z-index:2;background:#F1F4EA;text-align:left;padding:0 10px;height:30px;
  font-family:'Poppins',sans-serif;font-size:12px;color:var(--deep-green);font-weight:600;white-space:nowrap;}
.cc-grid tr.cc-unit th .u-meta{font-family:'Inter',sans-serif;font-weight:400;font-size:11px;color:var(--muted);margin-left:6px;}
.cc-grid tr.cc-unit th .cc-rowbtn{display:inline-flex;vertical-align:middle;margin-left:4px;}
.cc-grid tr.cc-unit td{background:#F1F4EA;}

/* The template's totals, under the plantings. */
.cc-grid tfoot td, .cc-grid tfoot th{height:28px;font-variant-numeric:tabular-nums;}
.cc-grid tfoot tr.tot th, .cc-grid tfoot tr.tot td{background:var(--deep-green);color:#fff;font-weight:700;}
.cc-grid tfoot tr.tot th{font-family:'Poppins',sans-serif;font-size:11px;letter-spacing:.06em;text-align:left;padding:0 10px;}
.cc-grid tfoot tr.tot td{text-align:center;font-size:11px;border-left:1px solid rgba(255,255,255,.15);}
.cc-grid tfoot tr.bych th{background:#E4EBD8;color:var(--deep-green);font-family:'Poppins',sans-serif;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:0 10px;}
.cc-grid tfoot tr.bych td{background:#E4EBD8;}
.cc-grid tfoot tr.crop th{background:#FFF8E8;text-align:left;padding:0 10px;font-weight:600;color:var(--ink);font-size:12px;}
.cc-grid tfoot tr.crop td{background:#FFF8E8;text-align:center;font-size:11px;color:var(--ink);
  border-left:1px solid #F0E6CC;}
.cc-grid tfoot td.zero{color:#C9C2AE;}

/* ---- One week, chosen by tapping it ---- */
.cc-pop{position:fixed;z-index:90;width:272px;background:#fff;border-radius:14px;padding:14px;
  box-shadow:0 18px 50px -12px rgba(35,40,31,.45), 0 0 0 1px rgba(35,40,31,.08);
  animation:popIn .18s var(--ease-out);}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
.cc-pop .pp-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;}
.cc-pop .pp-title{flex:1;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;color:var(--deep-green);line-height:1.35;}
.cc-pop .pp-sub{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:11.5px;color:var(--muted);}
.cc-pop .pp-close{border:none;background:none;cursor:pointer;color:var(--muted);padding:2px;display:flex;}
.cc-pop .pp-stages{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.cc-pop .pp-stage{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;cursor:pointer;
  border-radius:10px;padding:7px 8px;font-size:11.5px;text-align:left;color:var(--ink);line-height:1.2;}
.cc-pop .pp-stage:hover{border-color:var(--deep-green);}
.cc-pop .pp-stage.on{border-color:var(--deep-green);box-shadow:0 0 0 1.5px var(--deep-green);font-weight:600;}
.cc-pop .pp-stage .sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.cc-pop .pp-kg{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);}
.cc-pop .pp-kg label{font-size:11.5px;color:var(--ink);flex:none;}
.cc-pop .pp-kg input{margin:0;padding:7px 8px;min-width:0;flex:1;}
.cc-pop .pp-foot{display:flex;gap:6px;margin-top:10px;}

/* ---- Panels above the grid: a planting, and filling its weeks ---- */
.cc-panel{border-left:3px solid var(--harvest-orange);}
.cc-panel h3{font-family:'Poppins',sans-serif;font-size:15px;color:var(--deep-green);margin:0 0 4px;}
.cc-panel .grid4{margin-bottom:0;}
.cc-panel .pn-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
.cc-panel .pn-actions .push{margin-left:auto;}
.cc-fill-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;gap:12px;}
.cc-fill-grid .pair{display:flex;gap:6px;}
.cc-fill-grid .pair select{flex:1;min-width:0;}

/* ---- Greenhouses and blocks ---- */
.lay-cases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.lay-case{border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:14px;background:rgba(255,255,255,.6);}
.lay-case.is-current{border-color:var(--leaf-green);background:#F3F7EC;box-shadow:0 0 0 1px var(--leaf-green);}
.lay-case h4{font-family:'Poppins',sans-serif;font-size:13px;color:var(--deep-green);margin:8px 0 4px;}
.lay-case p{font-size:12px;color:var(--muted);margin:0;line-height:1.5;}
.lay-case .lc-now{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf-green);}
.lay-pic{display:flex;gap:4px;height:34px;align-items:stretch;}
.lay-pic span{flex:1;border-radius:5px;background:#DDE6CF;border:1px solid #C3D1AE;}
.lay-pic.blocks{gap:0;border-radius:6px;overflow:hidden;border:1px solid #C3D1AE;}
.lay-pic.blocks span{border-radius:0;border:none;border-right:1px dashed #9FB487;}
.lay-pic.blocks span:last-child{border-right:none;}

.unit-card{border-left:3px solid var(--leaf-green);}
.unit-head{display:grid;grid-template-columns:1.6fr 1fr auto;gap:10px;align-items:end;}
.unit-head .uh-actions{display:flex;gap:6px;padding-bottom:10px;}
.unit-meta{font-size:12px;color:var(--muted);margin:2px 0 10px;}
.block-list{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.block-chip{display:inline-flex;align-items:center;gap:2px;background:#F1F4EA;border:1px solid #D5DFC5;
  border-radius:99px;padding:2px 4px 2px 10px;}
.block-chip input{border:none;background:transparent;margin:0;padding:4px 2px;width:96px;font-size:12.5px;
  color:var(--deep-green);font-weight:600;box-shadow:none;}
.block-chip input:focus{outline:none;box-shadow:none;background:#fff;border-radius:6px;}
.block-chip .n{font-size:10.5px;color:var(--muted);margin-right:2px;white-space:nowrap;}
.block-chip button{border:none;background:none;cursor:pointer;color:var(--muted);display:flex;padding:3px;border-radius:50%;}
.block-chip button:hover{color:var(--red);background:#F6E3DF;}
.block-chip button svg{width:13px;height:13px;}
.block-add{display:inline-flex;gap:6px;align-items:center;}
.block-add input{width:60px;margin:0;padding:6px 8px;}

/* ---- Excel in and out ---- */
.cc-import{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.cc-import select{width:auto;margin:0;}
.cc-file{position:relative;overflow:hidden;}
.cc-file input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;}

/* ---- The Secretariat's view ---- */
.ass-grid td.v{text-align:right;font-variant-numeric:tabular-nums;}
.ass-grid td.v.zero{color:#C9C2AE;}
.ass-scroll{overflow:auto;max-width:100%;}
table.ass-table{border-collapse:separate;border-spacing:0;font-size:11.5px;width:max-content;}
.ass-table th,.ass-table td{padding:6px 8px;border-bottom:1px solid #ECEBE2;white-space:nowrap;}
.ass-table thead th{background:var(--deep-green);color:var(--field-cream);font-family:'Poppins',sans-serif;
  font-size:10px;letter-spacing:.08em;position:sticky;top:0;}
.ass-table thead th.ystart{border-left:2px solid var(--harvest-orange);}
.ass-table .stk{position:sticky;left:0;background:#fff;z-index:1;font-weight:600;color:var(--deep-green);}
.ass-table thead .stk{z-index:2;background:var(--deep-green);color:var(--field-cream);}
.ass-table td.v{text-align:right;font-variant-numeric:tabular-nums;}
.ass-table td.v.zero{color:#C9C2AE;}
.ass-table tr.tot td,.ass-table tr.tot th{background:#E4EBD8;font-weight:700;color:var(--deep-green);}

/* ---- On a phone ---- */
html[data-view="mobile"] .cc-scroll{max-height:calc(100vh - 150px);}
html[data-view="mobile"] .cc-grid td.wk{height:38px;}
html[data-view="mobile"] .cc-grid tbody td.stk{height:38px;padding:0 6px 0 8px;}
html[data-view="mobile"] .cc-pop{left:0 !important;right:0;bottom:0;top:auto !important;width:auto;
  border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
html[data-view="mobile"] .cc-pop .pp-stage{padding:10px 9px;font-size:12.5px;}
html[data-view="mobile"] .cc-tool{padding:7px 12px 7px 7px;}
html[data-view="mobile"] .lay-cases{grid-template-columns:1fr;}
html[data-view="mobile"] .unit-head{grid-template-columns:1fr;}
html[data-view="mobile"] .unit-head .uh-actions{padding-bottom:0;}
html[data-view="mobile"] .cc-fill-grid{grid-template-columns:1fr;}
@media (max-width:1100px){ .cc-fill-grid{grid-template-columns:1fr 1fr;} }

@media print{
  .cc-toolbar, .cc-panel, .cc-layout-line, .cc-rowbtn{display:none !important;}
  .cc-scroll{max-height:none;overflow:visible;}
}
@media (prefers-reduced-motion: reduce){ .cc-pop{animation:none;} .cc-tool{transition:none;} }

/* ---- Approval ---- */
.status-card{max-width:620px;}
.status-card .es-mark{margin:0;}
.status-card h2{font-family:'Poppins',sans-serif;color:var(--deep-green);font-size:20px;margin:0 0 8px;}
.status-card p{color:var(--ink);font-size:14px;line-height:1.6;margin:0 0 14px;}
.status-facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 14px;font-size:13px;}
.status-facts dt{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:'Poppins',sans-serif;padding-top:2px;}
.status-facts dd{margin:0;color:var(--ink);word-break:break-word;}
.status-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.wait-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:6px;}
.wait-card{border-left:3px solid var(--harvest-orange);margin:0 !important;}
.wait-card.is-admin{border-left-color:var(--deep-green);}
.wc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.wc-head strong{font-family:'Poppins',sans-serif;color:var(--deep-green);font-size:14px;}
.wc-actions, .row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.btn.danger{color:var(--red) !important;border-color:#E8C4BD !important;}
.owner-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--deep-green);background:#E4EBD8;border-radius:99px;padding:2px 8px;margin-left:4px;vertical-align:middle;}

/* ---- The grid fitted to the page ----
   Heading rows are placed from script (their top offsets depend on which of
   them there is room for); here they get their heights and their look. */
.cc-grid.fit thead th{white-space:nowrap;overflow:hidden;text-overflow:clip;padding:0;}
.cc-grid.fit thead tr.yr th{height:20px;background:var(--deep-green);color:var(--field-cream);font-size:10px;
  letter-spacing:.12em;text-align:center;border-left:2px solid var(--harvest-orange);}
