/* ---- A planting's stages, as days ----------------------------------------- */
function sameCells(a, b){ const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k=> a[k] === b[k]); }
function rowDays(f, r){
  const p = r.plan, g = p && p.guide && !p.manual ? guideFor(p.guide) : null;
  if(g && p.sown){
    const ge = effGuide(g, p.adj, r.variety);
    const P = planFromGuide(ge, Object.assign({}, p, {until: new Date((f.startYear || DEFAULT_START_YEAR) + 3, 0, 1)}));
    if(!P.error && sameCells(P.cells, r.cells)) return exactDays(ge, P, r);
  }
  return weekDays(r);
}
function harvestKg(r){
  let kg = 0, any = false;
  Object.values(r.cells).forEach(v=>{ const c = readCell(v); if(c && c.s === 'H' && c.kg != null){ kg += c.kg; any = true; } });
  return any ? kg : null;
}
function exactDays(g, P, r){
  const segs = [], less = d=> addDays(d, -1);
  const add = (s, a, b, kg)=>{ if(a && b && b >= a) segs.push({s, a: dayNo(a), b: dayNo(b), kg: kg == null ? null : kg}); };
  if(!g.tree){
    add('L', P.marks.land, less(P.sown));
    if(g.direct) add('S', P.sown, P.sown);
    else { add('S', P.sown, less(P.moved)); add('T', P.moved, P.moved); }
    const vFrom = addDays(g.direct ? P.sown : P.moved, 1);
    if(P.hWeeks){ add('V', vFrom, less(P.flowerFrom || P.firstH)); if(P.flowerFrom) add('F', P.flowerFrom, less(P.firstH)); }
    else if(P.growUntil) add('V', vFrom, P.growUntil);
  }
  if(P.hWeeks) add('H', P.firstH, P.lastH, harvestKg(r));
  return {segs, exact: true, sown: P.sown, moved: g.direct || g.tree ? null : P.moved, direct: !!g.direct, tree: !!g.tree};
}
function weekDays(r){
  const ks = Object.keys(r.cells).filter(k=> readCell(r.cells[k])).sort(weekOrder);
  const segs = [];
  let cur = null, last = -9;
  ks.forEach(k=>{
    const c = readCell(r.cells[k]), wi = weekIndex(k), [a, b] = weekSpan(k);
    if(cur && cur.s === c.s && wi === last + 1){ cur.b = dayNo(b); if(c.kg) cur.kg = (cur.kg || 0) + c.kg; }
    else { cur = {s: c.s, a: dayNo(a), b: dayNo(b), kg: c.s === 'H' && c.kg ? c.kg : null}; segs.push(cur); }
    last = wi;
  });
  const p = r.plan || {};
  return {segs, exact: false, sown: parseDay(p.sown), moved: parseDay(p.moved)};
}

/* ---- Which days are on screen ------------------------------------------------ */
const DAY_ZOOMS = [{n:0, label:'Whole season', short:'All'}, {n:12, label:'1 year', short:'1 yr'}, {n:6, label:'6 months', short:'6 mo'}, {n:3, label:'3 months', short:'3 mo'}];
function dayZoom(){
  if(state.dayZoom == null){
    let z = 0;
    try{ z = Number(localStorage.getItem('tipfa-cc-dayzoom')) || 0; }catch(e){}
    state.dayZoom = DAY_ZOOMS.some(x=> x.n === z) ? z : 0;
  }
  return state.dayZoom;
}
function setDayZoom(n){
  state.dayZoom = n; state.dayAt = null;
  try{ localStorage.setItem('tipfa-cc-dayzoom', String(n)); }catch(e){}
  renderKeepingPlace();
}
function stepDays(d){ state.dayAt = (state.dayAt || 0) + d * dayZoom(); renderKeepingPlace(); }
// From the first of the month the earliest planting starts in, to the end of
// the month the last one finishes in; or the months asked for.
function dayRange(all){
  let lo = Infinity, hi = -Infinity;
  all.forEach(x=> x.segs.forEach(s=>{ if(s.a < lo) lo = s.a; if(s.b > hi) hi = s.b; }));
  const today = dayNo(new Date());
  if(lo === Infinity){ lo = today; hi = today + 90; }
  const a = dayOf(lo), b = dayOf(hi);
  let start = new Date(a.getFullYear(), a.getMonth(), 1), end = new Date(b.getFullYear(), b.getMonth() + 1, 0);
  const z = dayZoom();
  if(z){
    if(state.dayAt == null){
      // Open on the months holding today, if any planting is under way; else the first.
      const t = new Date();
      const live = today >= lo && today <= hi;
      const from = live ? new Date(t.getFullYear(), t.getMonth(), 1) : start;
      state.dayAt = (from.getFullYear() - start.getFullYear()) * 12 + from.getMonth() - start.getMonth();
    }
    start = new Date(start.getFullYear(), start.getMonth() + state.dayAt, 1);
    end = new Date(start.getFullYear(), start.getMonth() + z, 0);
  } else {
    // Never less than three months, so a short crop is not drawn huge.
    const months = (end.getFullYear() - start.getFullYear()) * 12 + end.getMonth() - start.getMonth() + 1;
    if(months < 3) end = new Date(start.getFullYear(), start.getMonth() + 3, 0);
  }
  const months = [];
  for(let d = new Date(start); d <= end; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)){
    const y = d.getFullYear(), m = d.getMonth() + 1;
    months.push({y, m, a: dayNo(d), b: dayNo(new Date(y, m, 0)), keys:[1, 2, 3, 4].map(w=> weekKey(y, m, w))});
  }
  return {a: dayNo(start), b: dayNo(end), months};
}
function dayNavHTML(range){
  const z = dayZoom(), m = range.months, first = m[0], last = m[m.length - 1];
  const label = `${MONTH_ABBR[first.m - 1]} ${first.y} – ${MONTH_ABBR[last.m - 1]} ${last.y}`;
  return `${z ? `<div class="cc-window" role="group" aria-label="Calendar dates">
      <button onclick="stepDays(-1)" aria-label="Earlier" title="Earlier">${icon('chevL')}</button>
      <span class="cw-label">${label}</span>
      <button onclick="stepDays(1)" aria-label="Later" title="Later">${icon('chevR')}</button></div>`
    : `<span class="cw-label cw-static" title="Every planting, from its first day to its last">${label}</span>`}
    <div class="cc-span" role="group" aria-label="How much to show at once">${DAY_ZOOMS.map(s=>
      `<button class="${s.n === z ? 'on' : ''}" aria-pressed="${s.n === z}" onclick="setDayZoom(${s.n})" title="Show ${s.label}">${isMobile() ? s.short : s.label}</button>`).join('')}</div>`;
}

/* ---- Drawing it ------------------------------------------------------------- */
function shortDay(n, withYear){ return dayText(dayOf(n), withYear); }
function spanText(a, b){
  if(a === b) return shortDay(a, false);
  const ya = dayOf(a).getFullYear() !== dayOf(b).getFullYear();
  return `${shortDay(a, ya)} – ${shortDay(b, ya)}`;
}
const DAY_STAGE_NAME = {L:'Land prep', S:'Nursery', T:'Transplanting', V:'Growing', F:'Flowering', H:'Harvest', R:'Rotation'};
function segText(s, w, mobile){
  const per = mobile ? 6.2 : 7.1, fits = t=> t.length * per + 12 <= w;
  const name = s.s === 'S' && s.a === s.b ? 'Sown' : DAY_STAGE_NAME[s.s];
  const when = spanText(s.a, s.b);
  const opts = s.s === 'H'
    ? (s.kg ? [`Harvest · ${fmt(Math.round(s.kg))} kg · ${when}`, `Harvest · ${fmt(Math.round(s.kg))} kg`, `${kgShort(s.kg)} kg`, 'Harvest'] : [`Harvest · ${when}`, 'Harvest'])
    : [`${name} · ${when}`, name, name.slice(0, 4)];
  return opts.find(fits) || '';
}
// The dates of a planting, in a line under its bar.
function datesLine(x){
  const parts = [], segOf = s=> x.segs.find(g=> g.s === s), H = x.segs.filter(g=> g.s === 'H');
  const S = segOf('S'), T = segOf('T');
  if(S) parts.push(`${x.direct ? 'Planted' : 'Sown'} ${shortDay(S.a, true)}`);
  if(T) parts.push(`transplanted ${shortDay(T.a, false)}`);
  const F = segOf('F'); if(F && x.exact) parts.push(`flowering ${shortDay(F.a, false)}`);
  if(H.length){
    const a = H[0].a, b = H[H.length - 1].b, kg = H.reduce((t, g)=> t + (g.kg || 0), 0);
    parts.push(`harvest ${spanText(a, b)}${kg ? ` · ${fmt(Math.round(kg))} kg` : ''}`);
  }
  return parts.join(' → ');
}
function dayLayout(nDays){
  const room = gridRoom(), mobile = isMobile();
  const pin = mobile ? 0 : room > 1300 ? 300 : room > 1100 ? 270 : 230;
  return {room, pin, track: room - pin, px: (room - pin) / nDays, mobile};
}
function daysHTML(f, opts){
  const ro = opts.readOnly, rows = orderedRows(f);
  const all = rows.map(r=> ({r, x: rowDays(f, r)}));
  const R = dayRange(all.map(o=> o.x));
  const n = R.b - R.a + 1, L = dayLayout(n), px = L.px;
  dayRoom = L.room;
  const X = d=> (d - R.a) * px;
  const today = dayNo(new Date());

  // Headings: years when the months cannot carry them, the months, and the days.
  const mW = mo=> (mo.b - mo.a + 1) * px;
  const monthName = mo=> { const w = mW(mo);
    return w >= 120 ? `${MONTHS[mo.m - 1]} ${mo.y}` : w >= 76 ? `${MONTH_ABBR[mo.m - 1]} ${mo.y}` : w >= 30 ? MONTH_ABBR[mo.m - 1] : w >= 11 ? MONTH_ABBR[mo.m - 1][0] : ''; };
  const yearsRow = R.months.some(mo=> mW(mo) < 76);
  let years = '';
  if(yearsRow){
    const ys = [];
    R.months.forEach(mo=>{ const l = ys[ys.length - 1]; if(l && l.y === mo.y) l.b = mo.b; else ys.push({y: mo.y, a: mo.a, b: mo.b}); });
    years = `<div class="dv-years">${ys.map(y=> `<span style="left:${X(y.a).toFixed(1)}px;width:${((y.b - y.a + 1) * px).toFixed(1)}px">${(y.b - y.a + 1) * px >= 34 ? y.y : ''}</span>`).join('')}</div>`;
  }
  const months = `<div class="dv-months">${R.months.map(mo=> `<span class="${mo.a <= today && today <= mo.b ? 'cur' : ''}${mo.m === 1 ? ' ystart' : ''}" style="left:${X(mo.a).toFixed(1)}px;width:${mW(mo).toFixed(1)}px">${monthName(mo)}</span>`).join('')}</div>`;
  const step = px >= 17 ? 1 : px >= 8.5 ? 2 : px >= 3.2 ? 7 : px >= 1.6 ? 14 : 0;
  let ticks = '';
  if(step){
    for(let d = R.a; d <= R.b; d++){
      const dd = dayOf(d).getDate();
      if(step === 7 ? [1, 8, 15, 22].includes(dd) : step === 14 ? [1, 15].includes(dd) : (dd - 1) % step === 0 && dd <= 29 + (step === 1 ? 2 : 0))
        ticks += `<span class="${d === today ? 'now' : ''}" style="left:${X(d).toFixed(1)}px;width:${(px * Math.min(step, 7)).toFixed(1)}px">${dd}</span>`;
    }
  }
  const days = `<div class="dv-days${step ? '' : ' none'}">${ticks}</div>`;
  // Lines down the field: each month, and each week's start where there is room.
  let lines = R.months.map(mo=> `<i class="m" style="left:${X(mo.a).toFixed(1)}px"></i>`).join('');
  if(px * 7 >= 14) R.months.forEach(mo=> [8, 15, 22].forEach(dd=>{ const d = mo.a + dd - 1; if(d <= mo.b) lines += `<i style="left:${X(d).toFixed(1)}px"></i>`; }));
  const now = today >= R.a && today <= R.b ? `<i class="today" style="left:${(X(today) + px / 2).toFixed(1)}px"><b>Today</b></i>` : '';

  // The plantings, under their greenhouse where there is more than one.
  const units = showUnits(f);
  let body = '', lastUnit = null;
  all.forEach(({r, x}, ri)=>{
    if(units && r.unit !== lastUnit){
      lastUnit = r.unit;
      const u = unitOf(f, r.unit), cnt = all.filter(o=> o.r.unit === u.id).length;
      body += `<div class="dv-unit"><span class="u-ico">${icon(u.type === 'Open field' ? 'leaf' : 'house')}</span>${esc(u.name)} <span class="u-n">· ${cnt} planting${cnt === 1 ? '' : 's'}</span></div>`;
    }
    body += dayRowHTML(f, r, x, ri, {ro, px, X, L, R});
  });

  // Totals by month, under the plantings.
  const per = monthTotals(rows, R.months), top = Math.max(1, ...per);
  const crops = cropTotals(rows, R.months);
  const cell = (v, mo, i, t)=> `<span class="${v ? '' : 'zero'}" style="left:${X(mo.a).toFixed(1)}px;width:${mW(mo).toFixed(1)}px" title="${MONTHS[mo.m - 1]} ${mo.y}: ${fmt(v)} kg">${v && t ? `<i class="sky" style="--h:${(v / t).toFixed(3)};--d:${i * 40}ms"></i>` : ''}<em>${v ? (mW(mo) >= 46 ? fmt(Math.round(v)) : kgShort(v)) : (mW(mo) >= 16 ? '0' : '')}</em></span>`;
  const foot = `<div class="dv-foot">
    <div class="dv-frow tot"><div class="dv-fl">${L.mobile ? 'Total harvest' : 'TOTAL HARVEST'} <small>kg a month</small></div><div class="dv-fc">${per.map((v, i)=> cell(v, R.months[i], i, top)).join('')}</div></div>
    ${crops.map(gc=>{ const t = Math.max(1, ...gc.per); return `<div class="dv-frow crop"><div class="dv-fl" title="${esc(gc.crop)}">${esc(gc.crop)}</div><div class="dv-fc">${gc.per.map((v, i)=> cell(v, R.months[i], i, t)).join('')}</div></div>`; }).join('')}
  </div>`;

  const key = `${opts.key || state.member}|days|${R.a}|${R.b}`;
  return `<div class="dv${L.mobile ? ' is-mobile' : ''}" style="--pin:${L.pin}px;--track:${L.track.toFixed(1)}px;width:${L.room}px" data-key="${esc(key)}">
    <div class="dv-head">
      <div class="dv-corner"><span class="cc-corner-name">${esc(f.name)}</span><span class="cc-corner-sub">${rows.length} planting${rows.length === 1 ? '' : 's'} · in days</span></div>
      <div class="dv-axis">${years}${months}${days}</div>
    </div>
    <div class="dv-body"><div class="dv-lines" aria-hidden="true">${lines}${now}</div>${body}</div>
    ${foot}
  </div>`;
}
function dayRowHTML(f, r, x, ri, v){
  const {ro, px, X, L} = v, mobile = L.mobile;
  const g = r.plan && r.plan.guide ? guideFor(r.plan.guide) : null;
  const plants = r.plan && r.plan.plants ? `${fmt(r.plan.plants)} ${g && g.tree ? 'trees' : 'plants'}` : '';
  const sub = [offGuide(r) ? 'not in the crop guide' : '', locationText(f, r), varietyShort(r), r.area ? `${fmt(r.area)} m²` : '', plants].filter(Boolean).join(' · ');
  const j = rowJourney(r);
  const open = ro ? '' : `onclick="openEditor('${r.id}')"`;
  const btns = ro ? '' : `<span class="cc-rowbtns">
      ${guideChanged(r) ? `<button class="cc-rowbtn cc-replan" onclick="replanRow('${r.id}')" title="The crop guide for ${esc(r.crop)} has changed — update its days" aria-label="The crop guide for ${esc(r.crop)} has changed: update it">${icon('refresh')}</button>` : ''}
      <button class="cc-rowbtn cc-edit" onclick="openEditor('${r.id}')" title="Edit — crop, dates, plants, timings" aria-label="Edit ${esc(r.crop)}">${icon('pencil')}</button>
      ${j.cls === 'done' ? `<button class="cc-rowbtn cc-arch" onclick="archiveRow('${r.id}')" title="Season done — archive it" aria-label="Archive ${esc(r.crop)}">${icon('archive')}</button>` : ''}</span>`;
  const segs = x.segs.map(s=>{
    const w = Math.max((s.b - s.a + 1) * px, s.s === 'T' || s.a === s.b ? 6 : 2), lab = s.s === 'T' ? '' : segText(s, w, mobile);
    const tip = `${STAGE[s.s] ? STAGE[s.s].name : s.s}: ${spanText(s.a, s.b)}${s.a !== s.b ? ` (${s.b - s.a + 1} days)` : ''}${s.kg ? ` · ${fmt(Math.round(s.kg))} kg` : ''}`;
    return `<span class="dv-seg s-${s.s}${s.s === 'T' ? ' pin' : ''}" style="left:${X(s.a).toFixed(1)}px;width:${w.toFixed(1)}px;background-color:${STAGE[s.s] ? STAGE[s.s].color : '#ccc'};color:${STAGE[s.s] ? STAGE[s.s].ink : '#222'}" title="${esc(tip)}">${lab ? `<b>${esc(lab)}</b>` : ''}</span>`;
  }).join('');
  const first = x.segs.length ? X(x.segs[0].a) : 0, lastR = x.segs.length ? X(x.segs[x.segs.length - 1].b + 1) : 0;
  const dl = datesLine(x);
  // The dates sit under the bar, from its start — or ending at its end, when it starts late.
  const dpos = first > L.track * 0.55 ? `right:${Math.max(0, L.track - lastR).toFixed(1)}px;text-align:right;` : `left:${first.toFixed(1)}px;`;
  return `<div class="dv-row${state.growRow === r.id ? ' grow' : ''}" data-row="${r.id}" style="--d:${Math.min(ri, 24) * 45}ms">
    <div class="dv-pin"><div class="cc-crop-cell">
      <span class="cc-ico ${j.cls}" aria-hidden="true">${jIcon(j.icon, 17)}</span>
      <span class="cn" ${open} title="${esc([r.crop, sub, j.text, r.notes].filter(Boolean).join(' — '))}"><span class="cn-name">${esc(r.crop || '—')}</span>
        ${sub ? `<span class="sub">${esc(sub)}</span>` : ''}
        <span class="cc-now">${esc(j.text)}</span>
        <span class="cc-prog"><i style="--p:${j.p.toFixed(3)};--d:${Math.min(ri, 24) * 45}ms"></i></span></span>
      ${btns}</div></div>
    <div class="dv-track" ${open}>
      <div class="dv-bar">${segs || `<span class="dv-empty">No days yet — ${ro ? 'nothing planned' : 'tap to add its dates'}</span>`}</div>
      ${dl ? `<div class="dv-dates" style="${dpos}">${esc(dl)}${x.exact ? '' : ' <span class="dv-wk" title="Coloured by hand: drawn by its weeks">by week</span>'}</div>` : ''}
    </div>
  </div>`;
}
let dayResizeTimer = null, dayRoom = 0;
window.addEventListener('resize', ()=>{
  clearTimeout(dayResizeTimer);
  dayResizeTimer = setTimeout(()=>{
    if(!document.querySelector('.dv')) return;
    if(Math.abs(gridRoom() - dayRoom) > 1) renderKeepingPlace();

/* ============================================================
   Excel, in and out, in the template's own layout
   A calendar exported from here is the master template filled in: the
   same title, columns, colours, key, live totals and the orange mark
   on this week. A template filled in by hand imports straight back in.
   ExcelJS is kept beside the page rather than fetched from a CDN, so
   this works on a farm with a poor connection once the page has loaded.
   ============================================================ */
let excelLib = null;
function loadExcel(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(excelLib) return excelLib;
  excelLib = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'vendor/exceljs.min.js';
    s.onload = ()=> window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('The Excel library did not start.'));
    s.onerror = ()=>{ excelLib = null; reject(new Error('The Excel library could not be loaded. Check the connection and try again.')); };
    document.head.appendChild(s);
  });
  return excelLib;
}

// The template's palette (measured from the master sheet).
const XL = {
  title:'FF1B4332', head:'FF2D6A4F', week:'FFD8F3DC', zebra:'FFF3FAF5', cropZebra:'FFFFF6E0',
  input:'FF1D4ED8', ink:'FF1F2933', grey:'FF6B7280', hair:'FFD5DED8', monthLine:'FFA7BFB0', now:'FFF4A261', white:'FFFFFFFF',
};
const XL_STAGE_NAME = {H:'Harvest  (type kg)'};      // the key's own wording
function argb(hex){ return 'FF' + hex.replace('#','').toUpperCase(); }
function colName(n){ let s = ''; while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
const FIRST_WEEK_COL = 6;     // F, as on the template

function xlFont(o){ return Object.assign({name:'Arial', size:9}, o); }
function solid(c){ return {type:'pattern', pattern:'solid', fgColor:{argb:c}, bgColor:{argb:c}}; }
function side(style, c){ return {style, color:{argb:c}}; }
// Excel compares text case-blind but not space-blind, so crop names go out tidy.
function tidyCrop(s){ return String(s||'').trim().replace(/\s+/g,' '); }

/* Writes one farm onto a sheet, exactly in the template's layout. */
function writeTemplateSheet(ws, f, months){
  const nW = months.length * 4, lastCol = FIRST_WEEK_COL + nW - 1, L = colName(lastCol);
  const rows = orderedRows(f);
  const nData = Math.max(20, rows.length);                 // the template has twenty lines; never fewer
  const r0 = 4, rEnd = r0 + nData - 1, rTot = rEnd + 1, rByHead = rTot + 2;
  const crops = [];
  rows.forEach(r=>{ const c = tidyCrop(r.crop); if(c && !crops.some(x=> cropKey(x) === cropKey(c))) crops.push(c); });
  const nCrop = Math.max(4, crops.length), rCrop0 = rByHead + 1, rKeyHead = rCrop0 + nCrop + 1;

  ws.properties.defaultRowHeight = 15;
  ws.views = [{state:'frozen', xSplit:5, ySplit:3, showGridLines:false, zoomScale:100}];
  ws.pageSetup = {orientation:'landscape', paperSize:8, fitToPage:true, fitToWidth:3, fitToHeight:0,
                  printTitlesRow:'2:3', printTitlesColumn:'A:E',
                  margins:{left:0.75, right:0.75, top:1, bottom:1, header:0.5, footer:0.5}};
  [14, 12, 14, 8, 24].forEach((w, i)=> ws.getColumn(i+1).width = w);
  for(let c = FIRST_WEEK_COL; c <= lastCol; c++) ws.getColumn(c).width = 3.61;

  // Row 1 — the title band, across the whole sheet.
  ws.getRow(1).height = 30;
  ws.mergeCells('A1:E1');
  const t = ws.getCell('A1');
  t.value = `CROP CALENDAR  ·  ${f.name || '[Farm name]'}  ·  ${months[0].y} – ${months[months.length-1].y}`;
  t.font = xlFont({size:14, bold:true, color:{argb:XL.white}}); t.alignment = {horizontal:'left', vertical:'middle'};
  for(let c = 1; c <= lastCol; c++) ws.getCell(1, c).fill = solid(XL.title);

  // Rows 2–3 — column headings, months, and week numbers.
  ws.getRow(2).height = 19.5; ws.getRow(3).height = 12.75;
  ['GREENHOUSE / BLOCK', 'SECTION', 'CROP', 'AREA (SQM)', 'NOTES'].forEach((h, i)=>{
    const col = colName(i+1);
    ws.mergeCells(`${col}2:${col}3`);
    const c = ws.getCell(`${col}2`);
    c.value = h;
    c.font = xlFont({size:8, bold:true, color:{argb:XL.white}});
    c.fill = solid(XL.head);
    c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    c.border = {right: side('thin', XL.white)};
  });
  months.forEach((mo, i)=>{
    const c1 = FIRST_WEEK_COL + i*4;
    ws.mergeCells(2, c1, 2, c1 + 3);
    const h = ws.getCell(2, c1);
    h.value = `${MONTH_ABBR[mo.m-1]} ${mo.y}`;
    h.font = xlFont({size:8, bold:true, color:{argb:XL.white}});
    h.fill = solid(XL.head);
    h.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    h.border = {left: side('thin', XL.white)};
    for(let w = 0; w < 4; w++){
      const c = ws.getCell(3, c1 + w);
      c.value = w + 1;
      c.font = xlFont({size:7, bold:true, color:{argb:XL.head}});
      c.fill = solid(XL.week);
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
      if(w === 0) c.border = {left: side('thin', XL.white)};
      // The template's own rule: this week's number turns orange, on whatever day the file is opened.
      const lastDay = w === 3 ? `DATE(${mo.y},${mo.m}+1,1)-1` : `DATE(${mo.y},${mo.m},${w*7+7})`;
      ws.addConditionalFormatting({ref: `${colName(c1 + w)}3`, rules:[{type:'expression', priority:1,
        formulae:[`AND(TODAY()>=DATE(${mo.y},${mo.m},${w*7+1}),TODAY()<=${lastDay})`],
        style:{fill:{type:'pattern', pattern:'solid', bgColor:{argb:XL.now}}, font:{color:{argb:XL.white}, bold:true}}}]});
    }
  });

  // The plantings — one line each, never fewer than the template's twenty.
  const weekNumFmt = '#,##0;\\-#,##0;""';
  for(let i = 0; i < nData; i++){
    const rn = r0 + i, row = ws.getRow(rn), r = rows[i];
    row.height = 19.5;
    const zebra = rn % 2 === 0 ? XL.zebra : XL.white;
    let unitName = '', blockName = '';
    if(r){ const u = unitOf(f, r.unit), b = blockOf(u, r.block); unitName = u.name; blockName = b ? b.name : ''; }
    const left = [unitName, blockName, r ? tidyCrop(r.crop) : '', r && r.area ? Number(r.area) : null, r ? [r.variety ? `Variety: ${r.variety}` : '', r.notes].filter(Boolean).join(' · ') : ''];
    left.forEach((v, j)=>{
      const c = row.getCell(j+1);
      c.value = v === '' ? null : v;
      c.font = xlFont({size:9, color:{argb:XL.input}});
      c.fill = solid(zebra);
      c.alignment = (j === 2 || j === 4) ? {horizontal:'left', vertical:'middle'} : {horizontal:'center', vertical:'middle', wrapText:true};
      if(j === 3) c.numFmt = '#,##0';
      c.border = {right: j === 4 ? side('medium', XL.head) : side('hair', XL.hair), bottom: side('hair', XL.hair)};
    });
    months.forEach((mo, mi)=> mo.keys.forEach((k, w)=>{
      const c = row.getCell(FIRST_WEEK_COL + mi*4 + w);
      const cell = r ? readCell(r.cells[k]) : null;
      c.font = xlFont({size:7, bold:true, color:{argb:XL.ink}});
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
      c.numFmt = weekNumFmt;
      c.border = {top: side('hair', XL.hair), bottom: side('hair', XL.hair),
                  left: w === 0 ? side('thin', XL.monthLine) : side('hair', XL.hair),
                  right: w === 3 ? side('thin', XL.monthLine) : side('hair', XL.hair)};
      if(cell){
        c.fill = solid(argb(STAGE[cell.s].color));
        if(cell.s === 'H' && cell.kg) c.value = cell.kg;
      }
    }));
  }

  // TOTAL HARVEST — the template's =SUM over each month's four columns.
  const per = monthTotals(liveRows(f), months);
  const totRow = ws.getRow(rTot); totRow.height = 21.75;
  ws.mergeCells(`A${rTot}:E${rTot}`);
  const tl = ws.getCell(`A${rTot}`);
  tl.value = 'TOTAL HARVEST  (kg / month)';
  tl.font = xlFont({size:9, bold:true, color:{argb:XL.white}}); tl.fill = solid(XL.title);
  tl.alignment = {horizontal:'right', vertical:'middle'};
  months.forEach((mo, i)=>{
    const c1 = FIRST_WEEK_COL + i*4, a = colName(c1), b = colName(c1+3);
    ws.mergeCells(rTot, c1, rTot, c1 + 3);
    const c = ws.getCell(rTot, c1);
    c.value = {formula:`SUM(${a}${r0}:${b}${rEnd})`, result: per[i]};
    c.font = xlFont({size:8, bold:true, color:{argb:XL.white}}); c.fill = solid(XL.title);
    c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    c.numFmt = '#,##0;\\-#,##0;\\–';
    c.border = {left: side('thin', XL.white)};
  });

  // HARVEST BY CROP — =SUMPRODUCT on the crop column, one line per crop.
  ws.getRow(rByHead).height = 18;
  ws.mergeCells(`A${rByHead}:E${rByHead}`);
  const bh = ws.getCell(`A${rByHead}`);
  bh.value = 'HARVEST BY CROP  (kg / month)  —  type the crop name below';
  bh.font = xlFont({size:9, bold:true, color:{argb:XL.title}}); bh.fill = solid(XL.week);
  bh.alignment = {horizontal:'left', vertical:'middle'};
  for(let i = 0; i < nCrop; i++){
    const rn = rCrop0 + i, crop = crops[i] || '';
    const zebra = i % 2 === 0 ? XL.cropZebra : XL.white;
    ws.getRow(rn).height = 18;
    ws.mergeCells(`A${rn}:B${rn}`); ws.mergeCells(`C${rn}:E${rn}`);
    const lab = ws.getCell(`A${rn}`);
    lab.value = 'Crop'; lab.font = xlFont({size:8, color:{argb:XL.grey}}); lab.fill = solid(zebra);
    lab.alignment = {horizontal:'right', vertical:'middle'}; lab.border = {bottom: side('hair', XL.hair)};
    const nm = ws.getCell(`C${rn}`);
    nm.value = crop || null; nm.font = xlFont({size:9, color:{argb:XL.input}}); nm.fill = solid(zebra);
    nm.alignment = {horizontal:'left', vertical:'middle'}; nm.border = {bottom: side('hair', XL.hair)};
    const perCrop = crop ? monthTotals(liveRows(f).filter(r=> cropKey(r.crop) === cropKey(crop)), months) : months.map(()=> 0);
    months.forEach((mo, mi)=>{
      const c1 = FIRST_WEEK_COL + mi*4, a = colName(c1), b = colName(c1+3);
      ws.mergeCells(rn, c1, rn, c1 + 3);
      const c = ws.getCell(rn, c1);
      c.value = {formula:`IF($C${rn}="",0,SUMPRODUCT(($C$${r0}:$C$${rEnd}=$C${rn})*${a}$${r0}:${b}$${rEnd}))`, result: perCrop[mi]};
      c.font = xlFont({size:8, bold:true, color:{argb:XL.title}}); c.fill = solid(zebra);
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
      c.numFmt = '#,##0;\\-#,##0;\\–';
      c.border = {left: side('thin', XL.white)};
    });
  }

  // The key.
  ws.getRow(rKeyHead).height = 18;
  ws.mergeCells(`A${rKeyHead}:E${rKeyHead}`);
  const kh = ws.getCell(`A${rKeyHead}`);
  kh.value = 'KEY  —  colour the week cells; type kg in harvest cells';
  kh.font = xlFont({size:9, bold:true, color:{argb:XL.white}}); kh.fill = solid(XL.head);
  kh.alignment = {horizontal:'left', vertical:'middle'};
  STAGES.forEach((s, i)=>{
    const rn = rKeyHead + 1 + i;
    ws.getRow(rn).height = 16.5;
    const sw = ws.getCell(`A${rn}`);
    sw.fill = solid(argb(s.color));
    sw.border = {top: side('thick', XL.white), bottom: side('thick', XL.white)};
    ws.mergeCells(`B${rn}:E${rn}`);
    const nm = ws.getCell(`B${rn}`);
    nm.value = XL_STAGE_NAME[s.code] || s.name;
    nm.font = xlFont({size:9, color:{argb:XL.ink}}); nm.alignment = {horizontal:'left', vertical:'middle'};
  });
  return {rTot, rEnd};
}

function safeFileName(s){ return String(s||'farm').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').toUpperCase() || 'FARM'; }
async function downloadWorkbook(wb, name){

/* ============================================================
   Reading a filled-in template back
   The headings are found by name, not by position, so a sheet with a row
   inserted above, or columns moved, still reads. A week's colour gives its
   stage, matched to the nearest colour in the key; a number in a week is
   harvest kilograms — the template's own totals count every number, so
   treating each as a harvest keeps this calendar adding up the same.
   ============================================================ */
function cellText(c){
  const v = c && c.value;
  if(v === null || v === undefined) return '';
  if(typeof v === 'object'){
    if(v.richText) return v.richText.map(t=> t.text).join('').trim();
    if(v.text) return String(v.text).trim();
    if('result' in v) return String(v.result ?? '').trim();
    return '';
  }
  return String(v).trim();
}
function cellNumber(c){
  const v = c && c.value;
  if(typeof v === 'number') return v;
  if(v && typeof v === 'object' && typeof v.result === 'number') return v.result;
  if(typeof v === 'string' && v.trim() && !isNaN(Number(v.replace(/,/g,'')))) return Number(v.replace(/,/g,''));
  return null;
}
function hexToRgb(h){ h = h.replace('#','').slice(-6); return [0,2,4].map(i=> parseInt(h.slice(i, i+2), 16)); }
function stageFromFill(fill){
  if(!fill || fill.type !== 'pattern' || fill.pattern === 'none') return {stage:null, coloured:false};
  const col = (fill.fgColor && fill.fgColor.argb) || (fill.bgColor && fill.bgColor.argb);
  if(!col) return {stage:null, coloured: !!(fill.fgColor && fill.fgColor.theme !== undefined)};
  const rgb = hexToRgb(col);
  if(rgb.every(v=> v > 235)) return {stage:null, coloured:false};          // white, or the zebra tint
  let best = null, bestD = Infinity;
  STAGES.forEach(s=>{
    const t = hexToRgb(s.color);
    const d = Math.sqrt(t.reduce((a, v, i)=> a + (v - rgb[i])**2, 0));
    if(d < bestD){ bestD = d; best = s.code; }
  });
  return bestD <= 70 ? {stage:best, coloured:true} : {stage:null, coloured:true};
}

function parseTemplateSheet(ws){
  const MONTH_RE = new RegExp('^(' + MONTH_ABBR.join('|') + ')[A-Z]*\\s+(\\d{4})$', 'i');
  let hdr = null;
  for(let rn = 1; rn <= Math.min(15, ws.rowCount); rn++){
    const row = ws.getRow(rn);
    let crop = -1, firstMonth = -1;
    row.eachCell({includeEmpty:false}, (c, cn)=>{
      const t = cellText(c).toUpperCase();
      if(t === 'CROP' && crop < 0) crop = cn;
      if(MONTH_RE.test(t) && firstMonth < 0) firstMonth = cn;
    });
    if(crop > 0 && firstMonth > 0){ hdr = {rn, crop, firstMonth}; break; }
  }
  if(!hdr) return null;

  const head = ws.getRow(hdr.rn);
  const findCol = (re)=>{ let f = -1; head.eachCell({includeEmpty:false}, (c, cn)=>{ if(f < 0 && cn < hdr.firstMonth && re.test(cellText(c).toUpperCase())) f = cn; }); return f; };
  const cols = {unit: findCol(/GREENHOUSE|^UNIT|^HOUSE/), block: findCol(/SECTION|^BLOCK/), crop: hdr.crop,
                area: findCol(/AREA/), notes: findCol(/NOTE/)};

  // Each week column's date, from the month above it and its 1–4 below.
  const weekRow = ws.getRow(hdr.rn + 1);
  const colKey = {};
  let cur = null;
  for(let cn = hdr.firstMonth; cn <= ws.columnCount; cn++){
    const hc = head.getCell(cn);
    if(!hc.isMerged || hc.master === hc){
      const m = cellText(hc).toUpperCase().match(MONTH_RE);
      if(m) cur = {y:Number(m[2]), m: MONTH_ABBR.indexOf(m[1].slice(0,3).toUpperCase()) + 1};
    }
    if(!cur) continue;
    const w = cellNumber(weekRow.getCell(cn));
    if(w >= 1 && w <= 4) colKey[cn] = weekKey(cur.y, cur.m, w);
  }
  const weekCols = Object.keys(colKey).map(Number);
  if(!weekCols.length) return null;

  const plantings = [];
  let unrecognised = 0;
  for(let rn = hdr.rn + 2; rn <= ws.rowCount; rn++){
    const row = ws.getRow(rn);
    const first = cellText(row.getCell(1)).toUpperCase();
    if(/^TOTAL HARVEST|^HARVEST BY CROP|^KEY\b/.test(first)) break;
    const p = {
      unit: cols.unit > 0 ? cellText(row.getCell(cols.unit)) : '',
      block: cols.block > 0 ? cellText(row.getCell(cols.block)) : '',
      crop: cellText(row.getCell(cols.crop)),
      area: cols.area > 0 ? (cellNumber(row.getCell(cols.area)) || 0) : 0,
      notes: cols.notes > 0 ? cellText(row.getCell(cols.notes)) : '',
      cells: {},
    };
    weekCols.forEach(cn=>{
      const c = row.getCell(cn);
      const kg = cellNumber(c);
      const {stage, coloured} = stageFromFill(c.fill);
      if(kg !== null && kg > 0) p.cells[colKey[cn]] = writeCell('H', kg);
      else if(stage) p.cells[colKey[cn]] = writeCell(stage);
      else if(coloured) unrecognised++;
    });
    if(p.crop || Object.keys(p.cells).length) plantings.push(p);
  }
  const years = Object.values(colKey).map(k=> parseWeekKey(k).y);
  return {plantings, unrecognised, firstYear: Math.min(...years), sheet: ws.name};
}

async function importFarmExcel(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const done = (msg, bad)=>{ state.importMsg = msg; state.importBad = !!bad; renderKeepingPlace(); };
  try{
    const ExcelJS = await loadExcel();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    let parsed = null;
    for(const ws of wb.worksheets){ parsed = parseTemplateSheet(ws); if(parsed) break; }
    if(!parsed) return done('That file does not look like the crop calendar template — no sheet has a CROP heading with months beside it.', true);
    if(!parsed.plantings.length) return done('The template was read, but it has no plantings in it yet.', true);
    // Only crops in the crop guide come in, each under the guide's own name.
    const left = [];
    parsed.plantings = parsed.plantings.filter(p=>{ const g = guideMatch(p.crop); if(g){ p.crop = g.name; return true; } left.push(p.crop || '(no crop named)'); return false; });
    const leftText = left.length ? ` ${left.length} planting${left.length === 1 ? ' was' : 's were'} left out — not in the crop guide: ${[...new Set(left)].map(esc).join(', ')}.` : '';
    if(!parsed.plantings.length) return done(`None of the plantings in that file is of a crop in the crop guide, so nothing was imported.${leftText}`, true);
    const f = currentFarm();
    const replace = !liveRows(f).length ? true
      : confirm(`This file has ${parsed.plantings.length} planting${parsed.plantings.length===1?'':'s'}.\n\n` +
                `OK — replace the ${liveRows(f).length} already on your calendar\nCancel — add them to it`);
    const n = applyImport(f, parsed, replace);
    touch(state.member);
    state.scroll = null;
    done(`${CHECK_ICON} Imported ${n} planting${n===1?'':'s'} from “${esc(parsed.sheet)}”${replace ? ', replacing what was there' : ''}.` +
         (parsed.unrecognised ? ` ${parsed.unrecognised} coloured week${parsed.unrecognised===1?' was':'s were'} not a colour in the key and ${parsed.unrecognised===1?'was':'were'} left blank.` : '') + leftText);
  }catch(e){ done('That file could not be read: ' + esc(e.message || e), true); }
}

/* Greenhouses and blocks named in the file are matched to the farm's own by
   name, and added where they are new — so importing never needs the layout
   set up first. A file with nothing under GREENHOUSE / BLOCK lands in the
   farm's first unit. */
function applyImport(f, parsed, replace){
  if(replace){
    f.rows = archivedRows(f);           // what is archived stays archived
    const named = parsed.plantings.some(p=> p.unit);
    // A brand-new farm's untouched "Greenhouse 1" gives way to the names in the file.
    if(named && f.units.length === 1 && !f.units[0].blocks.length && /^(Greenhouse|Screenhouse|Open field|Nursery) 1$/.test(f.units[0].name)) f.units = [];
    f.startYear = parsed.firstYear || f.startYear;
  }
  const guessType = name=> /field|shamba/i.test(name) ? 'Open field' : /screen/i.test(name) ? 'Screenhouse' : /nursery/i.test(name) ? 'Nursery' : 'Greenhouse';
  const unitFor = name=>{
    if(!name){ if(!f.units.length) f.units.push(blankUnit(1)); return f.units[0]; }
    let u = f.units.find(x=> norm(x.name) === norm(name));
    if(!u){ u = {id:uid('u'), name, type:guessType(name), blocks:[]}; f.units.push(u); }
    return u;
  };
  parsed.plantings.forEach(p=>{
    const u = unitFor(p.unit);
    let block = '';
    if(p.block){
      let b = u.blocks.find(x=> norm(x.name) === norm(p.block));
      if(!b){ b = {id:uid('b'), name:p.block}; u.blocks.push(b); }
      block = b.id;
    }
    const vm = /^Variety: (.+?)(?: · (.*))?$/.exec(p.notes || '');
    const row = {id:uid('r'), unit:u.id, block, crop:p.crop, area:Number(p.area)||0, notes: vm ? (vm[2] || '') : p.notes, cells:p.cells};
    if(vm) row.variety = vm[1].trim().slice(0, 80);
    f.rows.push(row);
  });
  normaliseFarm(f);
  return parsed.plantings.length;
}

/* ============================================================
   The Secretariat's side: every farm's calendar, read only
   Because every farm is held in the same shape, however it divides its
   ground, the association's harvest can be added up by crop and month —
   which is what a shared crop calendar is for.
   ============================================================ */
function adminYear(){ return state.admYear || DEFAULT_START_YEAR; }
function shiftAdminYear(d){ state.admYear = adminYear() + d; state.scroll = null; renderKeepingPlace(); }
/* The members whose calendars are overseen: approved farms, and suspended
   ones, whose calendars are kept. A registration still waiting, or turned
   down, has no calendar yet and lives under Members & approvals. */
function farmIds(){
  return Object.keys(FARMS).filter(id=> FARMS[id] && (FARMS[id].status === 'approved' || FARMS[id].status === 'suspended'))
    .sort((a, b)=> (FARMS[a].name||'').localeCompare(FARMS[b].name||''));
}
// The association's figures count approved farms only.
function countedIds(){ return farmIds().filter(id=> FARMS[id].status === 'approved'); }
function openAdminFarm(id){ state.viewFarm = id; state.scroll = null; state.dayAt = null; render(); window.scrollTo(0, 0); }
function updatedText(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

// Harvest by crop and month, every farm together.
function associationByCrop(months){
  const by = new Map();
  countedIds().forEach(id=> cropTotals(liveRows(FARMS[id]), months).forEach(g=>{
    const k = cropKey(g.crop);
    if(!by.has(k)) by.set(k, {crop:g.crop, per: months.map(()=> 0), farms:new Set()});
    const e = by.get(k);
    g.per.forEach((v, i)=> e.per[i] += v);
    e.farms.add(id);
  }));
  return [...by.values()].map(e=> Object.assign(e, {total: e.per.reduce((a, b)=> a + b, 0)}))
    .sort((a, b)=> b.total - a.total);
}

/* The association's crops by month, fitted to the page like the grid: the
   months are put together in twos, threes, sixes or twelves until every
   column is wide enough to read, so the table never scrolls sideways. */
function associationTable(ass, months, perMonth, total){
  const room = gridRoom() - (isMobile() ? 32 : 48);   // inside the card's padding
  const fixed = isMobile() ? {crop:96, farms:34, total:62} : {crop:170, farms:56, total:90};
  const left = room - fixed.crop - fixed.farms - fixed.total;
  const g = [1, 2, 3, 6, 12].find(n=> left / (months.length / n) >= 50) || 12;
  const groups = [];
  for(let i = 0; i < months.length; i += g) groups.push(months.slice(i, i + g));
  const sum = per=> groups.map((gr, gi)=> per.slice(gi * g, gi * g + gr.length).reduce((a, b)=> a + b, 0));
  const yy = y=> String(y).slice(2);
  const label = gr=> gr.length === 12 && gr[0].m === 1 ? String(gr[0].y)
    : gr.length === 1 ? `${MONTH_ABBR[gr[0].m-1]} ${yy(gr[0].y)}`
    : `${MONTH_ABBR[gr[0].m-1]}–${MONTH_ABBR[gr[gr.length-1].m-1]} ${yy(gr[gr.length-1].y)}`;
  const w = left / groups.length;
  const num = v=> !v ? '–' : w >= 64 ? fmt(v) : kgShort(v);
  // Each figure sits on a bar filled to its share of the busiest period.
  const top = Math.max(1, ...ass.flatMap(e=> sum(e.per)));
  const bar = v=> v ? ` bar" style="--f:${(v / top).toFixed(3)}` : '';
  return `<table class="ass-table fit">
    <colgroup><col style="width:${fixed.crop}px"><col style="width:${fixed.farms}px">${'<col>'.repeat(groups.length)}<col style="width:${fixed.total}px"></colgroup>
    <thead><tr><th class="stk">Crop</th><th>Farms</th>${groups.map(gr=> `<th class="${gr[0].m===1?'ystart':''}">${label(gr)}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody>${ass.map(e=> `<tr><td class="stk" title="${esc(e.crop)}">${esc(e.crop)}</td><td class="v">${e.farms.size}</td>
        ${sum(e.per).map((v, i)=> `<td class="v ${v?'':'zero'}${bar(v)}" title="${esc(label(groups[i]))}: ${fmt(v)} kg">${num(v)}</td>`).join('')}<td class="v"><strong>${fixed.total < 80 ? kgShort(e.total) : fmt(e.total)}</strong></td></tr>`).join('')}
      <tr class="tot"><th class="stk">All crops</th><td></td>${sum(perMonth).map(v=> `<td class="v">${num(v)}</td>`).join('')}<td class="v">${fixed.total < 80 ? kgShort(total) : fmt(total)}</td></tr>
    </tbody></table>`;
}

/* One workbook: the association's totals first, then every farm's
   calendar on its own sheet, each in the template's layout. */
async function exportAllExcel(){
  try{
    const ExcelJS = await loadExcel();
    const wb = newWorkbook(ExcelJS), months = windowMonths(adminYear());
    const ass = associationByCrop(months);
    const ws = wb.addWorksheet('Association');
    const nCol = months.length + 3;
    ws.views = [{state:'frozen', xSplit:2, ySplit:2, showGridLines:false}];
    ws.getColumn(1).width = 24; ws.getColumn(2).width = 8;
    for(let i = 3; i <= nCol; i++) ws.getColumn(i).width = 9;
    ws.getColumn(nCol).width = 11;
    ws.mergeCells(1, 1, 1, nCol);
    const t = ws.getCell(1, 1);
    t.value = `TIPFA  ·  HARVEST BY CROP, EVERY MEMBER FARM (kg / month)  ·  ${months[0].y} – ${months[months.length-1].y}`;
    t.font = xlFont({size:13, bold:true, color:{argb:XL.white}}); t.fill = solid(XL.title);
    t.alignment = {vertical:'middle'}; ws.getRow(1).height = 28;
    const head = ['CROP', 'FARMS', ...months.map(mo=> `${MONTH_ABBR[mo.m-1]} ${mo.y}`), 'TOTAL'];
    head.forEach((h, i)=>{
      const c = ws.getCell(2, i+1);
      c.value = h; c.font = xlFont({size:8, bold:true, color:{argb:XL.white}}); c.fill = solid(XL.head);
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    });
    ws.getRow(2).height = 26;
    ass.forEach((e, i)=>{
      const rn = 3 + i, zebra = i % 2 === 0 ? XL.zebra : XL.white;
      const vals = [e.crop, e.farms.size, ...e.per, null];
      vals.forEach((v, j)=>{
        const c = ws.getCell(rn, j+1);
        c.value = j === nCol - 1 ? {formula:`SUM(${colName(3)}${rn}:${colName(nCol-1)}${rn})`, result:e.total} : v;
        c.font = xlFont({size:9, bold: j === 0 || j === nCol - 1, color:{argb: j === 0 ? XL.title : XL.ink}});
        c.fill = solid(zebra);
        if(j >= 2) c.numFmt = '#,##0;\\-#,##0;\\–';
        c.alignment = {horizontal: j === 0 ? 'left' : 'center', vertical:'middle'};
      });
    });
    const rt = 3 + ass.length;
    ws.getCell(rt, 1).value = 'ALL CROPS';
    for(let j = 3; j <= nCol; j++){
      const col = colName(j);
      ws.getCell(rt, j).value = {formula:`SUM(${col}3:${col}${rt-1})`,
        result: j === nCol ? ass.reduce((t, e)=> t + e.total, 0) : ass.reduce((t, e)=> t + e.per[j-3], 0)};
      ws.getCell(rt, j).numFmt = '#,##0;\\-#,##0;\\–';
    }
    for(let j = 1; j <= nCol; j++){
      const c = ws.getCell(rt, j);
      c.font = xlFont({size:9, bold:true, color:{argb:XL.white}}); c.fill = solid(XL.title);
      c.alignment = {horizontal: j === 1 ? 'left' : 'center', vertical:'middle'};
    }

    // Sheet names must be unique, at most 31 characters, and free of []:*?/\
    const used = new Set(['association']);
    farmIds().forEach(id=>{
      let base = (FARMS[id].name || 'Farm').replace(/[\[\]:*?/\\]/g, ' ').trim().slice(0, 31) || 'Farm', name = base, n = 2;
      while(used.has(name.toLowerCase())){ name = base.slice(0, 27) + ' (' + n++ + ')'; }
      used.add(name.toLowerCase());
      writeTemplateSheet(wb.addWorksheet(name), FARMS[id], months);
    });
    await downloadWorkbook(wb, `TIPFA_CROP_CALENDARS_ALL_FARMS_${months[0].y}-${months[months.length-1].y}.xlsx`);
  }catch(e){ showFatal(e.message || e); }
}

const STATUS_LABEL = {pending:'Waiting for approval', approved:'Approved', rejected:'Not approved', suspended:'Suspended'};
const STATUS_PILL = {pending:'status-pending', approved:'status-active', rejected:'status-rejected', suspended:'status-open'};
function statusPill(s){ return `<span class="status-pill ${STATUS_PILL[s] || 'status-pending'}">${esc(STATUS_LABEL[s] || s)}</span>`; }
function whenText(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function decidedText(x){
  if(!x.statusBy || x.status === 'pending') return '';
  const by = operatorName(x.statusBy);
  return `${by ? 'by ' + esc(by) : ''}${x.statusAt ? ` on ${esc(whenText(x.statusAt))}` : ''}`;
}

/* ---- Deciding --------------------------------------------------------- */
async function decide(kind, id, status, btn){
  const subject = kind === 'farm' ? (FARMS[id] || {}).name : operatorName(id);
  const ask = {rejected:`Turn down ${subject}? They will not be able to use the crop calendar.`,
               suspended: kind === 'farm' ? `Suspend ${subject}? The farm will not be able to open or change its calendar until it is reinstated. Nothing is deleted.`
                                          : `Suspend ${subject}? They will not be able to open the console until reinstated.`}[status];
  if(ask && !confirm(ask)) return;
  if(btn) btn.classList.add('is-busy');
  const stamp = {status, statusBy: cloudOn() ? CLOUD_STATE.uid : state.adminId, statusAt: new Date().toISOString()};
  try{
    if(cloudOn()) await withTimeout(cloudDecide(kind, id, status), 15000, 'Saving the decision');
    if(kind === 'farm'){ if(FARMS[id]) Object.assign(FARMS[id], stamp); }
    else if(cloudOn()) OPERATORS[id] = Object.assign({}, OPERATORS[id], stamp);
    else Object.values(ACCOUNTS).forEach(a=>{ if(a.id === id) Object.assign(a, stamp); });
    saveLocal();
    // A waiting card is stamped with the decision before it leaves the list.
    const card = btn && btn.closest('.wait-card');
    if(card && !REDUCED_MOTION && (status === 'approved' || status === 'rejected')){
      card.classList.add(status === 'approved' ? 'stamp-ok' : 'stamp-no');
      if(status === 'approved') burstAt(card, 16);
      await new Promise(r=> setTimeout(r, 520));
    }
    const verb = {approved:'approved', rejected:'turned down', suspended:'suspended'}[status];
    state.memberMsg = `${CHECK_ICON} ${esc(subject)} ${verb}.`;
    renderKeepingPlace();
  }catch(e){
    if(btn) btn.classList.remove('is-busy');
    showFatal('The decision was not saved: ' + cloudErrorText(e));
  }
}
/* ---- Removing a farm ------------------------------------------------------
   For good: the farm's record and its whole calendar. Suspending is the way
   to keep someone out and keep what they planned; this is for an account that
   should not be there at all — a test, a duplicate, a farm that has left. */
async function removeFarm(id, btn){
  const f = FARMS[id];
  if(!f) return;
  const n = (f.rows || []).length;
  if(!confirm(`Remove ${f.name} from the crop calendar for good?\n\n` +
      (n ? `Its calendar — ${n} planting${n===1?'':'s'} — will be deleted and cannot be recovered. Export it to Excel first if it may be needed.\n\n` : '') +
      `To keep the farm out but keep its calendar, Suspend it instead.`)) return;
  if(btn) btn.classList.add('is-busy');
  try{
    if(cloudOn()) await withTimeout(cloudRemoveFarm(id), 15000, 'Removing the farm');
    delete FARMS[id];
    Object.keys(ACCOUNTS).forEach(k=>{ if(ACCOUNTS[k].id === id && ACCOUNTS[k].role === 'farm') delete ACCOUNTS[k]; });
    saveLocal();
    if(state.viewFarm === id) state.viewFarm = null;
    state.memberMsg = `${CHECK_ICON} ${esc(f.name)} was removed.` + (cloudOn() ? ` Its sign-in is still in Firebase, so the same email can register again; to free the email completely, delete it under Authentication → Users.` : '');
    renderKeepingPlace();
  }catch(e){
    if(btn) btn.classList.remove('is-busy');
    // Refused by the rules: the database still has rules from before Remove
    // existed. Say so, rather than the sign-up message a refusal usually means.
    if(String((e && e.code) || '').includes('permission-denied'))
      return showFatal('The farm was not removed: the database\u2019s security rules do not allow it yet. In the Firebase console, open Firestore Database \u2192 Rules, publish the latest firestore.rules (it allows approved administrators to remove a farm), wait a minute, reload this page and try again.');
    showFatal('The farm was not removed: ' + cloudErrorText(e));
  }
}
function decisionButtons(kind, x){
  if(kind === 'operator' && (x.id === state.adminId || x.owner)) return `<span class="helper" style="margin:0;">${x.owner ? 'System owner' : 'You'}</span>`;
  const b = (status, label, cls)=> `<button class="btn small ${cls||''}" onclick="decide('${kind}','${esc(x.id)}','${status}', this)">${label}</button>`;
  switch(x.status){
    case 'pending':  return b('approved', 'Approve') + b('rejected', 'Turn down', 'ghost danger');
    case 'approved': return b('suspended', 'Suspend', 'ghost danger');
    case 'suspended':return b('approved', 'Reinstate', 'ghost');
    case 'rejected': return b('approved', 'Approve after all', 'ghost');
  }
  return '';
}

        </tr>`).join('')}</tbody></table>`
      : `<p class="helper" style="margin:0;">${farms.length ? 'No farm matches that search.' : 'No farm has registered yet.'}</p>`}
    </div>

    <div class="section-label">Administrators</div>

        <tbody>${ops.sort((a, b)=> (b.owner - a.owner) || (order[a.status]-order[b.status]) || (a.name||'').localeCompare(b.name||'')).map(o=> `<tr>
          <td><strong>${esc(o.name)}</strong>${o.owner ? ' <span class="owner-tag">System owner</span>' : ''}${o.id === state.adminId ? ' <span class="helper" style="margin:0;">(you)</span>' : ''}</td>
          <td>${esc(o.email || '—')}</td>
          <td>${esc(whenText(o.since) || o.since || '—')}</td>
          <td>${statusPill(o.status)}${decidedText(o) && !o.owner ? `<div class="helper" style="margin:4px 0 0;">${decidedText(o)}</div>` : ''}</td>
          <td class="row-actions">${decisionButtons('operator', o)}</td>
        </tr>`).join('')}</tbody></table>

}

/* ============================================================
   The crop guide, for the Secretariat
   What every farm's plan is worked out from: how long each crop takes and
   what a plant gives. A calculator shows the working for any number of
   seedlings; every figure can be changed, a crop added, and a built-in
   crop put back as it was. Farms plan from the new figures straight away;
   plantings already on a calendar keep the weeks they were given.
   ============================================================ */
const guideNum = v=> v === null || v === undefined || v === '' ? null : Number(v);
const kgText = kg=> `${Number(kg).toLocaleString('en-GB', {maximumFractionDigits:3})} kg`;
const isBuiltIn = id=> CROP_GUIDE_DEFAULT.some(d=> d.id === id);
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// How long a crop takes, in words.
function timingText(g){
  if(g.custom || g.edited) return g.tree ? 'A bearing tree: the harvest starts on the date entered' : stagesText(g);
  if(g.ranges){
    const r = g.ranges, w = g.stageWords || {}, t = [];
    if(r.nursery) t.push(`nursery ${r.nursery}`);
    if(r.veg) t.push(`${w.veg || 'to first flowers'} ${r.veg}`);
    if(r.flower) t.push(`${w.flower || 'flower to harvest'} ${r.flower}`);
    if(r.window) t.push(`harvest ${r.window}`);
    return t.length ? t.join(' · ').replace(/^./, c=> c.toUpperCase()) : (g.tree ? 'A bearing tree: the harvest starts on the date entered' : '');
  }
  if(g.tree) return 'A bearing tree: the harvest starts on the date entered';
  const nur = g.direct ? 'Sown or planted direct' : g.nurseryDays ? `${rangeText(g.nurseryDays, 'days')} in the nursery` : g.nursery ? `${rangeText(g.nursery, 'weeks')} in the nursery` : '';
  if(g.harvest.kind === 'none') return nur;
  const first = g.fromTransplant != null ? `first harvest ${g.fromTransplant} days after transplanting` : g.fromSowing ? `first harvest ${rangeText(g.fromSowing, 'days')} after ${g.direct ? 'planting' : 'sowing'}` : '';
  return [nur, first].filter(Boolean).join(', ');
}
// The sum behind a plant's harvest.
function perPlantWorking(g){
  const h = g.harvest, per = perPlantOf(g);
  if(per === null) return null;
  switch(h.kind){
    case 'weekly':  return `${kgText(h.kg)} a week × ${h.weeks} weeks = ${kgText(per)}`;
    case 'pulses':  return `${kgText(h.kg)} a picking × ${h.count} pickings, every ${h.every} weeks = ${kgText(per)}`;
    case 'head':    return h.sideWeeks ? `${kgText(h.kg)} head + ${kgText(guideNum(h.sideKg) || 0)} × ${h.sideWeeks} weeks of side shoots = ${kgText(per)}` : `one head of ${kgText(per)}`;
    case 'single':  return `one harvest of ${kgText(per)}`;
    case 'picking': return `${kgText(per)} over the season, cut every week`;
    default:        return 'no harvest within the calendar';
  }
}
// Each stage's days, as small coloured chips.
function stageChipsHTML(g){
  const st = stagesOf(g), chip = (s, t)=> `<span class="st-chip"><i style="background:${STAGE[s].color}"></i>${t}</span>`;
  const out = [];
  if(st.start === 'nursery') out.push(chip('S', `${st.nursery} d nursery`));
  if(st.start !== 'tree' && st.kind !== 'none') out.push(chip('V', `${st.veg} d growth`), chip('F', `${st.flower} d flowering`));
  if(st.kind !== 'none') out.push(chip('H', st.hWeeks === 1 ? 'harvest once' : `${st.hWeeks} wk harvest`));
  return `<span class="st-chips">${out.join('')}</span>`;
}
function guideTag(g){
  return g.custom ? '<span class="gd-tag is-new">Added by the Secretariat</span>'
       : g.edited ? `<span class="gd-tag is-edited">Edited${g.ed !== GUIDE_EDITION ? ' · older figures' : ''}</span>`
       : g.src === 'rz' ? '<span class="gd-tag is-rz">Rijk Zwaan</span>'
       : '<span class="gd-tag">General guidance</span>';
}

/* ---- The calculator -------------------------------------------------------- */
function guideCalcPick(id){
  state.guideCalc.id = id; state.guideCalc.kgpp = '';
  const sel = document.getElementById('gc-crop');
  if(sel) sel.value = id;
  guideCalcUpdate(true);
  const card = document.querySelector('.gd-calc');
  if(card) card.scrollIntoView({behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'start'});
}
function guideCalcUpdate(cropChanged){
  const out = document.getElementById('gc-out'), box = document.getElementById('gc-kgpp-box');
  const calc = state.guideCalc, g0 = guideFor(calc.id);
  if(!out || !g0) return;
  const g = effGuide(g0, null, calc.variety);
  const vb = document.getElementById('gc-variety-box');
  if(cropChanged && vb) vb.innerHTML = g0.varieties && g0.varieties.length ? `<label class="f" for="gc-variety">Variety</label>
      <select id="gc-variety" onchange="state.guideCalc.variety=this.value;guideCalcUpdate()"><option value="">Any (the crop’s figures)</option>
        ${g0.varieties.map(v=> `<option value="${esc(v.name)}"${v.name === calc.variety ? ' selected' : ''}>${esc(v.name)}</option>`).join('')}</select>` : '';
  const unit = g.tree ? 'tree' : 'plant', many = g.tree ? 'trees' : g.direct ? 'plants' : 'seedlings';
  if(cropChanged && box){
    box.innerHTML = guideHasYield(g) ? '' : `<label class="f" for="gc-kgpp">Expected kg a ${unit}</label>
      <input id="gc-kgpp" type="number" min="0" step="any" inputmode="decimal" value="${esc(calc.kgpp)}" placeholder="the guide has none"
        oninput="state.guideCalc.kgpp=this.value;guideCalcUpdate()">`;
    const lab = document.querySelector('label[for="gc-plants"]'), dl = document.querySelector('label[for="gc-sown"]');
    if(lab) lab.textContent = g.tree ? 'Trees' : g.direct ? 'Plants' : 'Seedlings';
    if(dl) dl.textContent = g.tree ? 'Harvest season starts' : g.direct ? 'Planting date' : 'Sowing date';
  }
  const plants = Number(calc.plants) > 0 ? Math.round(Number(calc.plants)) : 0;
  const p = planFromGuide(g, {sown: calc.sown || todayISO(), plants, kgpp: calc.kgpp, until: addDays(new Date(), 3 * 365)});
  if(p.error){ out.innerHTML = `<p class="helper" style="color:var(--red);">${esc(p.error)}</p>`; return; }
  const h = g.harvest, per = p.perPlant;
  const own = !guideHasYield(g) && per != null;
  // The working, a step at a time.
  const steps = [], st = stagesOf(g);
  if(!g.tree){
    if(g.direct) steps.push(['S', `Planted ${dayText(p.sown, true)}`, st.kind === 'none' ? '' : `then ${st.veg} days of vegetative growth`]);
    else {
      steps.push(['S', `Sown ${dayText(p.sown, true)}`, `${st.nursery} days in the nursery`]);
      steps.push(['T', `Transplanted ${dayText(p.moved, true)}`, st.kind === 'none' ? '' : `then ${st.veg} days of vegetative growth`]);
    }
    if(p.flowerFrom) steps.push(['F', `Flowering / fruit set from ${dayText(p.flowerFrom, true)}`, `${st.flower} days to the first harvest`]);
  }
  if(p.hWeeks){
    const why = g.tree ? 'the date entered' : `day ${daysBetween(p.sown, p.firstH)} after ${g.direct ? 'planting' : 'sowing'}`;
    steps.push(['H', `First harvest ${dayText(p.firstH, true)}`, why]);
    steps.push(['H', `Last harvest week ends ${dayText(p.lastH, true)}`, `${p.hWeeks} harvest week${p.hWeeks === 1 ? '' : 's'}`]);
  } else if(p.growUntil) steps.push(['V', 'Grows on to the end of the calendar', yieldText(g)]);
  const sw = s=> `<span class="sw" style="background:${STAGE[s].color}"></span>`;
  const working = h.kind === 'none' ? 'No harvest within the calendar.'
    : per == null ? `The guide has no kg figure for ${esc(g.name)}${guideHasYield(g) ? '' : ` — enter the expected kg a ${unit} above, or give the crop a figure with Edit`}.`
    : own ? `${kgText(per)} a ${unit} (your figure), shared over ${p.hWeeks} harvest week${p.hWeeks === 1 ? '' : 's'}`
    : perPlantWorking(g);
  const weekly = per != null && plants && p.hWeeks ? Math.round(per * plants / p.hWeeks * 10) / 10 : null;
  out.innerHTML = `
    <div class="gd-figs">
      <div class="gd-fig"><span class="lbl">A ${unit} gives</span><span class="val">${per == null ? '—' : kgText(per)}</span></div>
      <div class="gd-fig is-main"><span class="lbl">${plants ? fmt(plants) : 'No'} ${many} give</span><span class="val">${per == null || !plants ? '—' : fmt(p.total) + ' kg'}</span></div>
      <div class="gd-fig"><span class="lbl">${h.kind === 'weekly' || h.kind === 'picking' ? 'Each harvest week' : 'A harvest week, on average'}</span><span class="val">${weekly == null ? '—' : fmt(weekly) + ' kg'}</span></div>
    </div>
    <p class="gd-working">${icon('calc')} <span>${working}${per != null && plants && h.kind !== 'none' ? ` <b>× ${fmt(plants)} ${many} = ${fmt(p.total)} kg</b>` : ''}</span></p>
    ${planRibbonHTML(g, p)}
    <ul class="gb-plan">${steps.map(([s, a, b])=> `<li>${sw(s)}<span class="gp-n">${esc(a)}</span><span class="gp-w">${esc(b)}</span></li>`).join('')}</ul>
    <p class="helper gb-src">${esc(guideSourceText(g))}</p>`;
}

/* ---- Changing the guide ----------------------------------------------------
   A crop is edited as its stages, in days, and its harvest: how long it is
   picked for and what a plant gives in all. The weekly kilograms the planner
   uses are worked out from those. */
const DRAFT_NEW = {start:'nursery', nursery:28, veg:35, flower:21, kind:'weekly', hWeeks:8, every:2, total:'', headKg:''};
function toDraft(g){
  const st = g ? stagesOf(g) : DRAFT_NEW, s = v=> v === null || v === undefined ? '' : String(v);
  const d = {orig: g ? g.id : null, name: g ? g.name : '',
    names: g ? g.names.filter(n=> n !== cropKey(g.name)).join(', ') : '',
    sow: g && g.sow || '', note: g && g.timingNote || ''};
  Object.keys(st).forEach(k=> d[k] = s(st[k]));
  if(d.kind === 'single') d.hWeeks = '1';
  d.varieties = (g && g.varieties || []).map(v=> Object.assign({name: v.name, type: v.type || '', traits: v.traits || '', res: v.res || '', vnote: v.note || ''},
    ...VAR_DAYS.map(k=> ({[k]: v.adj && v.adj[k] != null ? String(v.adj[k]) : ''}))));
  return d;
}
// What a variety may change about its crop.
const VAR_DAYS = ['veg', 'flower', 'hWeeks', 'total', 'headKg'];
// The draft as a guide entry, or the first thing wrong with it.
function fromDraft(d){
  const name = d.name.trim();
  if(!name) return {error: 'Give the crop a name.'};
  if(name.length > 60) return {error: 'Keep the name to 60 characters.'};
  const bad = stagesError(d);
  if(bad) return {error: bad};
  const orig = d.orig ? guideFor(d.orig) : null;
  const g = guideFromStages(orig || {id:'', name, names:[], harvest:{kind:'none'}}, d);
  g.name = name;
  delete g.sow; delete g.timingNote; delete g.yieldNote; delete g.edited; delete g.custom; delete g.kgSrc;
  if(d.sow.trim()) g.sow = d.sow.trim().slice(0, 120);
  if(d.note.trim()) g.timingNote = d.note.trim().slice(0, 300);
  // Every name a farm might type, none of them another crop's.
  g.names = [...new Set([name, ...d.names.split(/[,;\n]/)].map(cropKey).filter(Boolean))];
  for(const other of CROP_GUIDE){
    if(other.id === d.orig) continue;
    const clash = g.names.find(n=> other.names.includes(n));
    if(clash) return {error: `“${clash}” is already a name of ${other.name}. Each name can belong to one crop only.`};
  }
  // Varieties: a name each, and only the days that differ from the crop's.
  const seen = new Set();
  g.varieties = [];
  for(const v of d.varieties || []){
    const vn = v.name.trim();
    if(!vn) return {error: 'Give every variety a name, or remove it.'};
    if(seen.has(vn.toLowerCase())) return {error: `There are two varieties called “${vn}”.`};
    seen.add(vn.toLowerCase());
    const adj = {};
    VAR_DAYS.forEach(k=>{ if(v[k] !== '' && v[k] != null) adj[k] = Number(v[k]); });
    if(Object.keys(adj).length){
      const bad = stagesError(Object.assign({}, d, adj));
      if(bad) return {error: `${vn}: ${bad}`};
    }
    const out = {name: vn.slice(0, 80)};
    if(v.type.trim()) out.type = v.type.trim().slice(0, 120);
    if(v.traits.trim()) out.traits = v.traits.trim().slice(0, 300);
    if(v.res.trim()) out.res = v.res.trim().slice(0, 200);
    if(v.vnote.trim()) out.note = v.vnote.trim().slice(0, 300);
    if(Object.keys(adj).length) out.adj = adj;
    g.varieties.push(out);
  }
  if(!g.varieties.length) delete g.varieties;
  delete g.ranges; delete g.stageWords;        // the Secretariat's figures now, not the published ranges
  g.ed = GUIDE_EDITION;
  if(!d.orig){
    const base = cropKey(name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'crop';
    let id = base, i = 2;
    while(guideFor(id)) id = `${base}-${i++}`;
    g.id = id; g.custom = true;
  } else if(orig && orig.custom) g.custom = true;
  else g.edited = true;
  return {g};
}

function guideStartEdit(id){
  const g = id ? guideFor(id) : null;
  if(id && !g) return;
  state.guideEdit = toDraft(g);
  state.guideEditErr = '';
  renderKeepingPlace();
  window.scrollTo(0, 0);
}
function guideCancelEdit(){ state.guideEdit = null; state.guideEditErr = ''; render(); }
// One field changed. A change of shape draws the form again; a figure only the preview.
function guideSet(k, v, redraw){
  const d = state.guideEdit;
  d[k] = v;
  if(k === 'kind' && v === 'single') d.hWeeks = '1';
  if(redraw){ renderKeepingPlace(); const el = document.querySelector(`[data-k="${k}"]`); if(el) el.focus({preventScroll:true}); }
  else guideEditPreview();
}
// The stages as a strip, each as long as its days.
function stageStripHTML(st){
  const n = v=> Math.max(0, Number(v) || 0);
  const seg = [];
  if(st.start === 'nursery') seg.push(['S', n(st.nursery), `Sowing → transplanting`, `${n(st.nursery)} days`]);
  if(st.start !== 'tree' && st.kind !== 'none'){
    seg.push(['V', n(st.veg), st.start === 'direct' ? 'Vegetative growth' : 'Transplanting → flowering', `${n(st.veg)} days`]);
    if(n(st.flower)) seg.push(['F', n(st.flower), 'Flowering / fruit set → harvest', `${n(st.flower)} days`]);
  }
  if(st.start !== 'tree' && st.kind === 'none') seg.push(['V', 120, 'Grows on', 'no harvest in the calendar']);
  if(st.kind !== 'none') seg.push(['H', 7 * (n(st.hWeeks) || 1), 'Harvest', st.kind === 'single' ? 'once' : `${n(st.hWeeks) || 1} weeks`]);
  const total = seg.reduce((t, x)=> t + x[1], 0) || 1;
  return `<div class="st-strip">${seg.map(([s, days, name, len])=>
    `<div class="st-seg" style="flex:${Math.max(days, total * 0.09)}"><span class="st-bar" style="background:${STAGE[s].color}"></span>

// Saving the whole guide: the database keeps one list.
async function guideCommit(list, btn, done, removed){
  if(btn) btn.classList.add('is-busy');
  try{
    await withTimeout(saveGuide(list, removed), 15000, 'Saving the crop guide');
    state.guideEdit = null; state.guideEditErr = '';
    state.guideMsg = `${CHECK_ICON} ${done}`;
    render();
    return true;
  }catch(e){
    if(btn) btn.classList.remove('is-busy');
    const why = String((e && e.code) || '').includes('permission-denied')
      ? 'the database’s security rules do not allow it yet. In the Firebase console, open Firestore Database → Rules, publish the latest firestore.rules (it lets approved administrators change the crop guide), wait a minute and try again.'
      : cloudErrorText(e);
    if(state.guideEdit){ state.guideEditErr = 'The crop guide was not saved: ' + why; renderKeepingPlace(); window.scrollTo(0, 0); }
    else showFatal('The crop guide was not saved: ' + why);
    return false;
  }
}
function guideSaveEdit(btn){
  const r = fromDraft(state.guideEdit);
  if(r.error){ state.guideEditErr = r.error; renderKeepingPlace(); window.scrollTo(0, 0); return; }
  const g = r.g, list = CROP_GUIDE.map(cloneGuide);
  const at = list.findIndex(x=> x.id === g.id);
  if(at >= 0) list[at] = g; else list.push(g);
  if(state.guideCalc) state.guideCalc.id = g.id;
  guideCommit(list, btn, `${esc(g.name)} ${at >= 0 ? 'saved' : 'added to the guide'}. Farms plan with ${at >= 0 ? 'the new figures' : 'it'} from now on.`);
}
function guideReset(id, btn){
  const d = CROP_GUIDE_DEFAULT.find(x=> x.id === id), g = guideFor(id);
  if(!d || !g || !confirm(`Put ${g.name} back to the built-in figures (the Rijk Zwaan crop guide)? Your changes to it will be lost.`)) return;
  const fresh = cloneGuide(d);
  // A name the Secretariat gave another crop since stays with that crop.
  const taken = new Set(CROP_GUIDE.filter(x=> x.id !== id).flatMap(x=> x.names));
  fresh.names = fresh.names.filter(n=> !taken.has(n));
  guideCommit(CROP_GUIDE.map(x=> x.id === id ? fresh : cloneGuide(x)), btn, `${esc(d.name)} is back to the built-in figures.`);
}
// Every crop still on figures set before the Rijk Zwaan guide came in takes its figures.
function guideUseEdition(btn){
  const old = staleEdited();
  if(!old.length || !confirm(`Use the Rijk Zwaan crop guide’s figures for ${old.map(g=> g.name).join(', ')}? The figures set here for ${old.length === 1 ? 'it' : 'them'} will be replaced.`)) return;
  const ids = new Set(old.map(g=> g.id));
  const list = CROP_GUIDE.map(x=> ids.has(x.id) ? cloneGuide(CROP_GUIDE_DEFAULT.find(d=> d.id === x.id)) : cloneGuide(x));
  guideCommit(list, btn, `${old.map(g=> esc(g.name)).join(', ')} now ${old.length === 1 ? 'uses' : 'use'} the Rijk Zwaan crop guide’s figures. Farms see an update button beside plantings planned with the old ones.`);
}

/* Removing a crop: farms can no longer plant it. Plantings of it already on a
   calendar stay, marked as not in the crop guide. A built-in crop can be put
   back later; one the Secretariat added is gone for good. */
function guideDelete(id, btn){
  const g = guideFor(id);
  if(!g) return;
  if(CROP_GUIDE.length <= 1) return showFatal('The guide needs at least one crop.');
  const using = Object.values(FARMS).map(f=> (f.rows || []).filter(r=> !r.archived && guideMatch(r.crop) === g).length).filter(n=> n);
  const n = using.reduce((a, b)=> a + b, 0);
  const builtIn = isBuiltIn(id);
  if(!confirm(`Remove ${g.name} from the crop guide?\n\nFarms will no longer be able to plant it.` +
      (n ? ` ${n} planting${n === 1 ? '' : 's'} of it on ${using.length} farm${using.length === 1 ? '' : 's'} will stay as ${n === 1 ? 'it is' : 'they are'}, marked “not in the crop guide”.` : '') +
      (builtIn ? '\n\nYou can put it back later under “Removed crops”.' : '\n\nThis crop was added here, so it cannot be put back — only added again.'))) return;
  const removed = builtIn ? [...new Set([...GUIDE_REMOVED_BY_ADMIN, id])] : GUIDE_REMOVED_BY_ADMIN;
  if(state.guideCalc && state.guideCalc.id === id) state.guideCalc.id = '';
  guideCommit(CROP_GUIDE.filter(x=> x.id !== id).map(cloneGuide), btn, `${esc(g.name)} was removed from the crop guide.`, removed);
}

function guideRestore(id, btn){
  const d = CROP_GUIDE_DEFAULT.find(x=> x.id === id);
  if(!d) return;
  const fresh = cloneGuide(d);
  const taken = new Set(CROP_GUIDE.flatMap(x=> x.names));
  fresh.names = fresh.names.filter(n=> !taken.has(n));
  if(!fresh.names.length) fresh.names = [cropKey(fresh.name)];
  guideCommit(CROP_GUIDE.map(cloneGuide).concat([fresh]), btn, `${esc(d.name)} is back in the crop guide.`, GUIDE_REMOVED_BY_ADMIN.filter(x=> x !== id));
}

/* ============================================================
   The journey
   A season — sown, sprouted, transplanted, in bloom, harvested — runs
   through every screen: the path at the front door, the seed that
   germinates while an account waits, the planting pass that sweeps the
   calendar open, the ribbon a plan is drawn on, and the leaves that fly
   when something is let in or planted. The sky behind it all follows the
   time of day.

   All of it is decoration over the same pages. Nothing here holds data or
   takes a click, every moving part is a transform or an opacity on one
   element (never thousands of calendar cells), and for a reader who has
   asked for less motion it is drawn already finished.

/* ---- The sky: dawn, day, dusk or night, from this device's clock ---- */
function journeySky(){
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  const part = h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 19.5 ? 'dusk' : 'night';
  const root = document.documentElement;
  if(root.getAttribute('data-daypart') !== part) root.setAttribute('data-daypart', part);
  // How far through the daylight we are, for the sun on the horizon line.
  root.style.setProperty('--sun', Math.max(0, Math.min(1, (h - 6) / 12)).toFixed(3));
}
journeySky();
setInterval(journeySky, 5 * 60 * 1000);

/* ---- A burst of leaves, for a moment worth marking --------------------- */
function leafBurst(x, y, n){
  if(REDUCED_MOTION) return;
  const host = document.createElement('div');
  host.className = 'leafburst'; host.setAttribute('aria-hidden', 'true');
  host.style.left = x + 'px'; host.style.top = y + 'px';
  const colours = ['var(--leaf-green)', 'var(--tipfa-green)', 'var(--harvest-orange)', '#9DB65E'];
  host.innerHTML = Array.from({length: n || 18}, (_, i)=>{
    const a = (i / (n || 18)) * Math.PI * 2 + (i % 3) * 0.35, dist = 60 + (i * 23) % 70;
    return `<i style="--tx:${Math.round(Math.cos(a) * dist)}px;--ty:${Math.round(Math.sin(a) * dist - 30)}px;--r:${(i * 47) % 360}deg;--c:${colours[i % 4]};--t:${0.8 + (i % 5) * 0.12}s"></i>`;
  }).join('');
  document.body.appendChild(host);
  setTimeout(()=> host.remove(), 1700);
}
function burstAt(el, n){
  if(!el) return;
  const r = el.getBoundingClientRect();
  leafBurst(r.left + Math.min(r.width / 2, 120), r.top + r.height / 2, n);

/* ---- The plan, drawn as a ribbon from sowing to harvest ----------------- */
let journeyLastPlan = '';
function planRibbonHTML(g, p){
  const seg = [];
  if(!g.tree){
    seg.push(['L', p.marks.land, addDays(p.marks.land, 7)]);
    if(g.direct) seg.push(['S', p.sown, addDays(p.sown, 7)]);
    else { seg.push(['S', p.sown, p.moved]); seg.push(['T', p.moved, addDays(p.moved, 7)]); }
    const vFrom = g.direct ? addDays(p.sown, 7) : addDays(p.moved, 7);
    const vTo = p.hWeeks ? (p.flowerFrom || p.firstH) : addDays(p.growUntil || vFrom, 1);
    if(vTo > vFrom) seg.push(['V', vFrom, vTo]);
    if(p.flowerFrom && p.hWeeks && p.firstH > p.flowerFrom) seg.push(['F', p.flowerFrom, p.firstH]);
  }
  if(p.hWeeks) seg.push(['H', p.firstH, addDays(p.lastH, 1)]);
  if(!seg.length) return '';
  const start = seg[0][1], end = seg[seg.length - 1][2];
  const total = Math.max(1, daysBetween(start, end));
  // Only a new plan is drawn again; typing a plant count leaves it be.
  const sig = `${g.id}|${p.sown && p.sown.getTime()}|${p.moved && p.moved.getTime()}`;
  const still = sig === journeyLastPlan; journeyLastPlan = sig;
  const endIcon = p.hWeeks ? 'basket' : 'sprout';
  return `<div class="jr${still ? ' still' : ''}" aria-hidden="true">
    <div class="jr-ends"><span>${jIcon(g.tree ? 'basket' : 'seed', 15)} ${dayText(start, true)}</span>
      <span>${dayText(addDays(end, -1), true)} ${jIcon(endIcon, 15)}</span></div>
    <div class="jr-track">${seg.map(([s, a, b], i)=>
      `<span class="jr-seg s-${s}" style="flex:${Math.max(daysBetween(a, b), total * 0.025)};background-color:${STAGE[s].color};--i:${i}"
         title="${esc(STAGE[s].name)}: ${dayText(a, true)} – ${dayText(addDays(b, -1), true)}"></span>`).join('')}
      <span class="jr-walker">${jIcon('sprout', 16)}</span></div>
  </div>`;
}

/* ---- The calendar opening: a planting pass across the field ------------ */
let journeyLastGrid = null;
function sowSweep(sc){
  const field = sc.querySelector('.cc-field'), t = sc.querySelector('table.cc-grid');
  if(!field || !t || !gridView) return;
  const head = t.tHead ? t.tHead.offsetHeight : 0;
  const w = gridView.L.room - gridView.L.pin;
  const cover = document.createElement('div');
  cover.className = 'cc-sow';
  cover.style.cssText = `left:${gridView.L.pin}px;top:${head}px;width:${w}px;--w:${w}px;`;
  cover.innerHTML = `<span class="cc-drill">${jIcon('seed', 16)}</span>`;
  field.appendChild(cover);
  setTimeout(()=> cover.remove(), 1500);
}
// A planting just planned from the guide grows across its row.
function growRow(sc, id){
  const field = sc.querySelector('.cc-field'), tr = sc.querySelector(`tr[data-row="${id}"]`);
  if(!field || !tr || !gridView) return;
  const head = sc.querySelector('thead') ? sc.querySelector('thead').offsetHeight : 0;
  const top = tr.offsetTop;
  const rr = tr.getBoundingClientRect();
  if(rr.top < 80 || rr.bottom > innerHeight - 20) tr.scrollIntoView({block:'center', behavior: REDUCED_MOTION ? 'auto' : 'smooth'});
  const w = gridView.L.room - gridView.L.pin;
  const cover = document.createElement('div');
  cover.className = 'cc-grow';
  cover.style.cssText = `left:${gridView.L.pin}px;top:${top}px;height:${tr.offsetHeight}px;width:${w}px;--w:${w}px;`;
  cover.innerHTML = `<span class="cc-drill">${jIcon('sprout', 16)}</span>`;
  field.appendChild(cover);
  tr.classList.add('just-planted');
  setTimeout(()=>{ cover.remove(); tr.classList.remove('just-planted'); }, 2200);
  const name = tr.querySelector('.cn');
  if(name) setTimeout(()=> burstAt(name, 14), 150);
}

/* ---- After every page is drawn ------------------------------------------- */
function journeyAfterRender(c){
  const sc = c.querySelector('.cc-scroll');
  // The Today flag sits just under the headings, however many there are.
  const field = sc && sc.querySelector('.cc-field'), th = sc && sc.querySelector('thead');
  if(field && th) field.style.setProperty('--head', th.offsetHeight + 'px');
  const key = sc ? sc.dataset.key + '|' + viewSpan() + '|' + (state.spanAt || 0) : null;
  if(sc && !REDUCED_MOTION){
    if(state.growRow) growRow(sc, state.growRow);
    else if(key !== journeyLastGrid) sowSweep(sc);
  }
  state.growRow = null;
  journeyLastGrid = key;
  if(state.celebrate){
    state.celebrate = false;
    setTimeout(()=> burstAt(c.querySelector('h1.page-title') || c, 26), 250);
  }
}

/* ============================================================
   Start-up
   ============================================================ */
// The key's colours become the grid's, from the one list above.
(function stageStyles(){
  const s = document.createElement('style');
  // The colour only, so each stage's texture can lie over it.
  s.textContent = STAGES.map(st=> `.cc-grid td.wk.s-${st.code}{background-color:${st.color};--sc:${st.color};color:${st.ink};}`).join('\n');
  document.head.appendChild(s);
})();

loadLocal();
loadGuideLocal();
render();
initCloud().then(async ()=>{
  const restored = await restoreSession();
  if(!restored) render();
});
window.addEventListener('load', ()=> setTimeout(()=>{ try{ checkForNewerBuild(); }catch(_){ } }, 2500));
</script>
