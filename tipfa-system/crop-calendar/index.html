/* ---- The grid, shared by the farm's page and the Secretariat's ------ */
function gridHTML(f, months, opts){
  const mobile = isMobile();
  const blocks = showBlocks(f), units = showUnits(f);
  const now = todayKey();
  const ro = opts.readOnly;

  // The sticky columns, left to right, with their widths, so each knows its offset.
  const cols = mobile
    ? [{k:'crop', label:'Planting', w:132}]
    : [ ...(blocks ? [{k:'block', label:'Block', w:96}] : []),
        {k:'crop', label:'Crop', w:150}, {k:'area', label:'m²', w:64}, {k:'notes', label:'Notes', w:150} ];
  let x = 0;
  cols.forEach(cl=>{ cl.left = x; x += cl.w; });
  const lastK = cols[cols.length-1].k;
  const stickTH = (cl, label, cls)=> `<th class="stk${cl.k===lastK?' edge':''} ${cls||''}" style="left:${cl.left}px;min-width:${cl.w}px;max-width:${cl.w}px;">${label}</th>`;
  const stickTD = (cl, inner, cls, title)=> `<td class="stk c-${cl.k}${cl.k===lastK?' edge':''}" style="left:${cl.left}px;min-width:${cl.w}px;max-width:${cl.w}px;"${title?` title="${esc(title)}"`:''}>${inner}</td>`;
  const nCols = cols.length;

  const head = `<thead>
    <tr class="mh">${cols.map((cl, i)=> stickTH(cl, i === 0 ? esc(f.name) : '')).join('')}
      ${months.map(mo=> `<th colspan="4" class="${mo.m===1?'ystart':''}">${MONTH_ABBR[mo.m-1]} ${mo.y}</th>`).join('')}</tr>
    <tr class="wh">${cols.map(cl=> stickTH(cl, esc(cl.label))).join('')}
      ${months.map(mo=> mo.keys.map((k, w)=> `<th class="${w===0?'mstart':''}${k===now?' now':''}"${k===now?' title="This week"':''}>${w+1}</th>`).join('')).join('')}</tr>
  </thead>`;

  const rows = orderedRows(f);
  let body = '', ri = 0;
  const order = [];
  // With more than one unit, every unit gets its heading — an empty one too,
  // so a greenhouse just added can be planted from here.
  const unitHead = u=>{
    const inUnit = f.rows.filter(x=> x.unit === u.id);
    const area = inUnit.reduce((t, x)=> t + (Number(x.area)||0), 0);
    return `<tr class="cc-unit"><th colspan="${nCols}" style="min-width:${x}px;max-width:${x}px;">${esc(u.name)}
        <span class="u-meta">${esc(u.type)} · ${inUnit.length ? `${inUnit.length} planting${inUnit.length===1?'':'s'}` : 'nothing planned yet'}${area?` · ${fmt(area)} m²`:''}</span>
        ${ro ? '' : `<button class="cc-rowbtn" onclick="openEditor(null,'${u.id}')" title="Add a planting to ${esc(u.name)}" aria-label="Add a planting to ${esc(u.name)}">${icon('plus')}</button>`}</th>
      <td colspan="${months.length*4}"></td></tr>`;
  };
  const sequence = units
    ? f.units.flatMap(u=> [{head:u}, ...rows.filter(r=> r.unit === u.id).map(r=> ({row:r}))])
    : rows.map(r=> ({row:r}));
  sequence.forEach(item=>{
    if(item.head){ body += unitHead(item.head); return; }
    const r = item.row, u = unitOf(f, r.unit);
    const b = blockOf(u, r.block);
    const sub = [mobile ? locationText(f, r) : '', mobile && r.area ? `${fmt(r.area)} m²` : ''].filter(Boolean).join(' · ');
    const cropInner = `<div class="cc-crop-cell">
        <span class="cn" ${ro ? '' : `onclick="openEditor('${r.id}')"`} title="${esc(r.crop || '(no crop named)')}${r.notes?' — '+esc(r.notes):''}">${esc(r.crop || '—')}
          ${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</span>
        ${ro ? '' : `<button class="cc-rowbtn" onclick="openFill('${r.id}')" title="Fill a run of weeks" aria-label="Fill a run of weeks for ${esc(r.crop)}">${icon('fill')}</button>`}
      </div>`;
    const tds = cols.map(cl=>{
      if(cl.k === 'block') return stickTD(cl, esc(b ? b.name : (u.blocks.length ? 'Whole ' + u.type.toLowerCase() : '')), '', b ? b.name : '');
      if(cl.k === 'crop') return stickTD(cl, cropInner);
      if(cl.k === 'area') return stickTD(cl, r.area ? fmt(r.area) : '');
      return stickTD(cl, esc(r.notes), '', r.notes);
    }).join('');
    let ci = 0;
    const weeks = months.map(mo=> mo.keys.map((k, w)=>{
      const cell = readCell(r.cells[k]);
      const cls = ['wk', w===0?'mstart':'', w===0&&mo.m===1?'ystart':'', k===now?'now':'', cell?'s-'+cell.s:''].filter(Boolean).join(' ');
      const tip = `${MONTHS[mo.m-1]} ${mo.y}, week ${w+1}` + (cell ? ` — ${STAGE[cell.s].name}${cell.s==='H' && cell.kg ? `, ${fmt(cell.kg)} kg` : ''}` : '');
      return `<td class="${cls}" data-ri="${ri}" data-ci="${ci++}" data-k="${k}" title="${esc(tip)}">${cell && cell.s==='H' ? kgShort(cell.kg) : ''}</td>`;
    }).join('')).join('');
    body += `<tr data-row="${r.id}">${tds}${weeks}</tr>`;
    order.push(r.id);
    ri++;
  });

  // The template's two blocks of totals, under the plantings.
  const per = monthTotals(f.rows, months);
  const crops = cropTotals(f.rows, months);
  const span = `colspan="${nCols}" class="stk edge" style="left:0;min-width:${x}px;max-width:${x}px;"`;
  const foot = `<tfoot>
    <tr class="tot"><th ${span}>TOTAL HARVEST (kg / month)</th>
      ${per.map(v=> `<td colspan="4" class="${v?'':'zero'}">${v ? fmt(v) : '0'}</td>`).join('')}</tr>
    <tr class="bych"><th ${span}>Harvest by crop (kg / month)</th><td colspan="${months.length*4}"></td></tr>
    ${crops.length ? crops.map(g=> `<tr class="crop"><th ${span}>${esc(g.crop)}</th>
      ${g.per.map(v=> `<td colspan="4" class="${v?'':'zero'}">${v ? fmt(v) : '0'}</td>`).join('')}</tr>`).join('')
      : `<tr class="crop"><th ${span} style="font-weight:400;color:var(--muted);">No harvest kilograms entered yet</th><td colspan="${months.length*4}"></td></tr>`}
  </tfoot>`;

  gridOrder = order;
  return `<div class="cc-scroll" data-key="${esc(opts.key || (state.member + ':' + f.startYear))}">
    <table class="cc-grid${ro ? ' readonly' : ''}">${head}<tbody>${body}</tbody>${foot}</table></div>`;
}
let gridOrder = [];      // planting ids in the order the grid drew them, for painting by index

/* Keep the timeline where it was across a redraw; the first time a farm's
   calendar opens, start a couple of months before this week. */
function restoreGridScroll(c){
  const sc = c.querySelector('.cc-scroll');
  if(!sc) return;
  if(state.scroll && state.scroll.key === sc.dataset.key){
    sc.scrollLeft = state.scroll.left; sc.scrollTop = state.scroll.top;
    return;
  }
  const now = sc.querySelector('thead th.now');
  const stick = Array.from(sc.querySelectorAll('thead tr.wh th.stk')).reduce((t, th)=> t + th.offsetWidth, 0);
  if(now) sc.scrollLeft = Math.max(0, now.offsetLeft - stick - 26*8);
  state.scroll = {left: sc.scrollLeft, top: 0, key: sc.dataset.key};
}

/* ============================================================
   Colouring weeks
   With a stage picked, a press and a drag colours a rectangle — one row or
   several, so land preparation across three greenhouses is one stroke.
   Without one, a click on a week opens its own small chooser. A finger
   on a phone is scrolling the grid, not painting it, so there a tap does
   one week and a run of weeks goes through Fill.
   ============================================================ */
let drag = null;
// Released anywhere — over the grid, its headings, or off it altogether.
document.addEventListener('pointerup', ()=>{
  if(!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll('.cc-scroll.painting').forEach(n=> n.classList.remove('painting'));
  paintRect(currentFarm(), d);
});
function cancelDrag(){
  drag = null;
  document.querySelectorAll('.cc-scroll.painting').forEach(n=> n.classList.remove('painting'));
  document.querySelectorAll('.cc-grid .pv').forEach(n=>{ n.classList.remove('pv','pv-clear'); n.style.background = ''; n.style.color = ''; });
}
function bindGrid(table, f){
  if(!table || table.classList.contains('readonly')) return;
  const sc = table.closest('.cc-scroll');

  table.addEventListener('pointerdown', e=>{
    const td = e.target.closest('td.wk');
    if(!td || e.button > 0) return;
    if(e.pointerType === 'touch' || !state.tool) return;     // a tap is handled on click
    e.preventDefault();
    drag = {r0:+td.dataset.ri, c0:+td.dataset.ci, r1:+td.dataset.ri, c1:+td.dataset.ci, moved:false};
    sc.classList.add('painting');
    previewDrag(table);
  });
  table.addEventListener('pointermove', e=>{
    if(!drag) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const td = el && el.closest && el.closest('td.wk');
    // Near an edge, the timeline scrolls on so a stroke can run past the screen.
    // The left edge is where the pinned columns end on screen — not their
    // offsetLeft, which on a sticky cell grows with the scroll itself.
    const box = sc.getBoundingClientRect();
    const pinned = sc.querySelector('thead tr.wh th.stk.edge');
    const leftEdge = pinned ? pinned.getBoundingClientRect().right : box.left;
    if(e.clientX > box.right - 36) sc.scrollLeft += 18;
    else if(e.clientX < leftEdge + 24) sc.scrollLeft -= 18;
    if(!td || !table.contains(td)) return;
    const r1 = +td.dataset.ri, c1 = +td.dataset.ci;
    if(r1 !== drag.r1 || c1 !== drag.c1){ drag.r1 = r1; drag.c1 = c1; drag.moved = true; previewDrag(table); }
  });
  table.addEventListener('pointercancel', cancelDrag);

  table.addEventListener('click', e=>{
    const td = e.target.closest('td.wk');
    if(!td) return;
    if(state.tool){
      // A mouse has already painted on the way down and up; only a tap gets here to do it.
      if(e.pointerType === 'touch' || e.detail === 0 || isMobile())
        paintRect(f, {r0:+td.dataset.ri, c0:+td.dataset.ci, r1:+td.dataset.ri, c1:+td.dataset.ci});
      return;
    }
    openPop(gridOrder[+td.dataset.ri], td.dataset.k, td);
  });
}
function previewDrag(table){
  table.querySelectorAll('.pv').forEach(n=> n.classList.remove('pv','pv-clear'));
  const [ra, rb] = [Math.min(drag.r0, drag.r1), Math.max(drag.r0, drag.r1)];
  const [ca, cb] = [Math.min(drag.c0, drag.c1), Math.max(drag.c0, drag.c1)];
  const st = STAGE[state.tool];
  for(let r = ra; r <= rb; r++){
    const tds = table.querySelectorAll(`td.wk[data-ri="${r}"]`);
    for(let c = ca; c <= cb; c++){
      const td = tds[c];
      if(!td) continue;
      td.classList.add('pv');
      if(state.tool === 'clear') td.classList.add('pv-clear');
      else { td.style.background = st.color; td.style.color = st.ink; }
    }
  }
  // Cells that left the rectangle get their own colour back.
  table.querySelectorAll('td.wk[style]').forEach(td=>{ if(!td.classList.contains('pv')){ td.style.background=''; td.style.color=''; } });
}
function paintRect(f, d){
  const [ra, rb] = [Math.min(d.r0, d.r1), Math.max(d.r0, d.r1)];
  const [ca, cb] = [Math.min(d.c0, d.c1), Math.max(d.c0, d.c1)];
  const months = farmWindow(f);
  const keys = months.flatMap(mo=> mo.keys);
  const kg = state.toolKg === '' ? null : Number(state.toolKg);
  let n = 0;
  for(let i = ra; i <= rb; i++){
    const r = f.rows.find(x=> x.id === gridOrder[i]);
    if(!r) continue;
    for(let c = ca; c <= cb; c++){
      const k = keys[c];
      if(!k) continue;
      if(state.tool === 'clear') delete r.cells[k];
      else {
        // Painting harvest over a harvest week keeps its kilograms unless new ones are given.
        const old = readCell(r.cells[k]);
        const keepKg = state.tool === 'H' && kg === null && old && old.s === 'H' ? old.kg : kg;
        r.cells[k] = writeCell(state.tool, keepKg);
      }
      n++;
    }
  }
  if(n){ touch(state.member); }
  render();
}

/* ---- One week's chooser ----------------------------------------------- */
function openPop(rowId, key, td){
  const r = currentFarm().rows.find(x=> x.id === rowId);
  if(!r) return;
  const rect = td.getBoundingClientRect();
  state.pop = {rowId, key, x: rect.left, y: rect.bottom, top: rect.top};
  drawPop();
}
function closePop(){ state.pop = null; const p = document.getElementById('cc-pop'); if(p) p.remove(); }
function drawPop(){
  const old = document.getElementById('cc-pop');
  if(old) old.remove();
  if(!state.pop) return;
  const f = currentFarm(), r = f.rows.find(x=> x.id === state.pop.rowId);
  if(!r){ state.pop = null; return; }
  const {y, m, w} = parseWeekKey(state.pop.key);
  const cell = readCell(r.cells[state.pop.key]);
  const el = document.createElement('div');
  el.id = 'cc-pop'; el.className = 'cc-pop'; el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', `Set the stage for ${r.crop}, ${MONTHS[m-1]} ${y} week ${w}`);
  el.innerHTML = `
    <div class="pp-head">
      <div class="pp-title">${esc(r.crop || 'Planting')}<span class="pp-sub">${esc(locationText(f, r) ? locationText(f, r) + ' · ' : '')}${MONTHS[m-1]} ${y}, week ${w}</span></div>
      <button class="pp-close" onclick="closePop()" aria-label="Close">${icon('close')}</button>
    </div>
    <div class="pp-stages">${STAGES.map(s=>`<button class="pp-stage ${cell && cell.s===s.code?'on':''}" onclick="setCellFromPop('${s.code}')">
        <span class="sw" style="background:${s.color}"></span>${esc(s.name)}</button>`).join('')}</div>
    <div class="pp-kg"><label for="pp-kg">Harvest kg</label>
      <input id="pp-kg" type="number" min="0" step="any" inputmode="decimal" placeholder="kg this week"
        value="${cell && cell.s==='H' && cell.kg !== null ? esc(cell.kg) : ''}" onkeydown="if(event.key==='Enter') setCellFromPop('H')">
      <button class="btn small" onclick="setCellFromPop('H')">Save</button></div>
    <div class="pp-foot">
      ${cell ? `<button class="btn small ghost" onclick="setCellFromPop('')">${icon('eraser')} Clear this week</button>` : ''}
    </div>`;
  document.body.appendChild(el);
  if(!isMobile()){
    const W = 272, H = el.offsetHeight;
    let left = Math.min(state.pop.x, window.innerWidth - W - 12);
    let top = state.pop.y + 6;
    if(top + H > window.innerHeight - 12) top = Math.max(12, state.pop.top - H - 6);
    el.style.left = Math.max(12, left) + 'px'; el.style.top = top + 'px';
  }
  const first = el.querySelector('.pp-stage.on') || el.querySelector('.pp-stage');
  if(first) first.focus({preventScroll:true});
}
function setCellFromPop(code){
  const f = currentFarm(), r = f.rows.find(x=> x.id === state.pop.rowId);
  if(!r) return closePop();
  const k = state.pop.key;
  if(!code) delete r.cells[k];
  else if(code === 'H'){
    const v = (document.getElementById('pp-kg') || {}).value;
    r.cells[k] = writeCell('H', v === '' || v === undefined ? null : Number(v));
  } else r.cells[k] = writeCell(code);
  touch(state.member);
  closePop();
  render();
}
// A click anywhere else puts the chooser away.
document.addEventListener('pointerdown', e=>{
  if(!state.pop) return;
  const p = document.getElementById('cc-pop');
  if(p && !p.contains(e.target) && !e.target.closest('td.wk')) closePop();
});
window.addEventListener('resize', ()=>{ if(state.pop) closePop(); });

/* ============================================================
   A planting: adding, editing, and filling a run of its weeks
   ============================================================ */
function openEditor(rowId, unitId){
  const f = currentFarm();
  state.fillRow = null; closePop();
  if(rowId){
    const r = f.rows.find(x=> x.id === rowId);
    state.editRow = {id:r.id, unit:r.unit, block:r.block, crop:r.crop, area:r.area || '', notes:r.notes};
  } else {
    const last = orderedRows(f).slice(-1)[0];
    const unit = unitId || (last ? last.unit : f.units[0].id);
    state.editRow = {id:null, unit, block:'', crop:'', area:'', notes:''};
  }
  if(state.tab !== 'calendar'){ state.tab = 'calendar'; rememberSession(); }
  render();
  window.scrollTo({top:0, behavior: REDUCED_MOTION ? 'auto' : 'smooth'});
  setTimeout(()=>{ const el = document.getElementById('ed-crop'); if(el) el.focus({preventScroll:true}); }, 60);
}
function editorPanel(f){
  const e = state.editRow, u = unitOf(f, e.unit);
  const crops = [...new Set([...f.rows.map(r=> r.crop.trim()).filter(Boolean), ...COMMON_CROPS])];
  const where = [];
  if(showUnits(f)) where.push(`<div><label class="f">${esc(unitWord(f))}</label>
      <select id="ed-unit" onchange="state.editRow.unit=this.value;state.editRow.block='';keepEditor();">
        ${f.units.map(x=> `<option value="${x.id}" ${x.id===e.unit?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`);
  if(u.blocks.length) where.push(`<div><label class="f">Block</label>
      <select id="ed-block" onchange="state.editRow.block=this.value">
        <option value="">Whole ${esc(u.type.toLowerCase())}</option>
        ${u.blocks.map(b=> `<option value="${b.id}" ${b.id===e.block?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`);
  return `<div class="card cc-panel">
    <h3>${e.id ? 'Edit planting' : 'Add a planting'}</h3>
    <p class="helper" style="margin:0 0 12px;">${where.length ? 'Where it is, what it is, and how much ground it takes.'
      : `What it is and how much ground it takes. Your farm is one ${esc(u.type.toLowerCase())}, so there is nowhere to choose.`}</p>
    <div class="grid4">
      ${where.join('')}
      <div><label class="f">Crop</label><input id="ed-crop" list="cc-crops" value="${esc(e.crop)}" placeholder="e.g. Cherry tomato"
        oninput="state.editRow.crop=this.value" onkeydown="if(event.key==='Enter') saveEditor()"></div>
      <div><label class="f">Area (m²)</label><input id="ed-area" type="number" min="0" step="any" inputmode="decimal" value="${esc(e.area)}"
        oninput="state.editRow.area=this.value" placeholder="e.g. 500"></div>
      <div style="${where.length >= 2 ? 'grid-column:1/-1;' : ''}"><label class="f">Notes</label><input id="ed-notes" value="${esc(e.notes)}"
        oninput="state.editRow.notes=this.value" placeholder="Variety, spacing, anything worth keeping"></div>
    </div>
    <datalist id="cc-crops">${crops.map(c=> `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="pn-actions">
      <button class="btn" onclick="saveEditor()">${e.id ? 'Save planting' : 'Add planting'}</button>
      <button class="btn small ghost" onclick="state.editRow=null;render();">Cancel</button>
      ${e.id ? `<span class="push"></span>
        <button class="btn small ghost" onclick="duplicateRow('${e.id}')">${icon('copy')} Duplicate</button>
        <button class="btn small ghost" style="color:var(--red);" onclick="deleteRow('${e.id}')">${icon('trash')} Delete</button>` : ''}
    </div>
    <p class="helper" id="ed-error" style="color:var(--red);margin-top:8px;"></p>
  </div>`;
}
function keepEditor(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
function saveEditor(){
  const f = currentFarm(), e = state.editRow;
  e.crop = val('ed-crop'); e.area = val('ed-area'); e.notes = val('ed-notes');
  if(!e.crop) return flagError(document.getElementById('ed-error'), 'Name the crop — it is what the harvest totals are added up by.');
  if(e.area !== '' && (isNaN(Number(e.area)) || Number(e.area) < 0)) return flagError(document.getElementById('ed-error'), 'Area must be a number of square metres.');
  const u = unitOf(f, e.unit);
  const block = u.blocks.some(b=> b.id === e.block) ? e.block : '';
  if(e.id){
    const r = f.rows.find(x=> x.id === e.id);
    Object.assign(r, {unit:u.id, block, crop:e.crop, area:Number(e.area)||0, notes:e.notes});
    state.calMsg = `${CHECK_ICON} ${esc(e.crop)} saved.`;
    state.editRow = null;
  } else {
    const r = {id:uid('r'), unit:u.id, block, crop:e.crop, area:Number(e.area)||0, notes:e.notes, cells:{}};
    f.rows.push(r);
    state.editRow = null;
    // The next thing a new planting needs is its weeks.
    openFillState(f, r);
    state.calMsg = `${CHECK_ICON} ${esc(e.crop)} added. Now give it its weeks — fill a run below, or pick a stage and colour them on the grid.`;
  }
  touch(state.member);
  render();
}
function duplicateRow(id){
  const f = currentFarm(), r = f.rows.find(x=> x.id === id);
  const copy = JSON.parse(JSON.stringify(r));
  copy.id = uid('r');
  f.rows.splice(f.rows.indexOf(r) + 1, 0, copy);
  state.editRow = {id:copy.id, unit:copy.unit, block:copy.block, crop:copy.crop, area:copy.area||'', notes:copy.notes};
  state.calMsg = `${CHECK_ICON} Copied ${esc(r.crop)}, weeks and all. Change what differs, or clear its weeks and plan the next cycle.`;
  touch(state.member);
  render();
}
function deleteRow(id){
  const f = currentFarm(), r = f.rows.find(x=> x.id === id);
  const n = Object.keys(r.cells).length;
  if(!confirm(`Delete ${r.crop || 'this planting'}${n ? ` and its ${n} coloured week${n===1?'':'s'}` : ''}? This cannot be undone.`)) return;
  f.rows = f.rows.filter(x=> x.id !== id);
  state.editRow = null;
  state.calMsg = `${esc(r.crop || 'The planting')} was deleted.`;
  touch(state.member);
  render();
}

/* ---- Fill a run of weeks --------------------------------------------
   The way to plan on a phone, and the quick way anywhere: one stage, from
   one week to another, with kilograms for each harvest week. */
function openFill(rowId){
  const f = currentFarm(), r = f.rows.find(x=> x.id === rowId);
  state.editRow = null; closePop();
  openFillState(f, r);
  render();
  window.scrollTo({top:0, behavior: REDUCED_MOTION ? 'auto' : 'smooth'});
}
function openFillState(f, r){
  const keys = farmWindow(f).flatMap(mo=> mo.keys);
  // Start after the last coloured week, or at this week, or at the window's start.
  const used = keys.filter(k=> r.cells[k]);
  let from = used.length ? keys.indexOf(used[used.length-1]) + 1 : keys.indexOf(todayKey());
  if(from < 0 || from >= keys.length) from = 0;
  const lastStage = used.length ? readCell(r.cells[used[used.length-1]]).s : null;
  const next = lastStage ? STAGES[Math.min(STAGES.length-1, STAGES.findIndex(s=> s.code === lastStage) + 1)].code : 'L';
  state.fillRow = {id:r.id, stage:next, from, to:Math.min(keys.length-1, from + 3), kg:''};
}
function weekOptions(keys, sel){
  return keys.map((k, i)=>{ const {y, m, w} = parseWeekKey(k);
    return `<option value="${i}" ${i===sel?'selected':''}>${MONTH_ABBR[m-1]} ${y} · wk ${w}</option>`; }).join('');
}
function fillPanel(f){
  const s = state.fillRow, r = f.rows.find(x=> x.id === s.id);
  if(!r){ state.fillRow = null; return ''; }
  const keys = farmWindow(f).flatMap(mo=> mo.keys);
  const n = Math.abs(s.to - s.from) + 1;
  return `<div class="card cc-panel">
    <h3>Fill weeks · ${esc(r.crop)}${locationText(f, r) ? ` <span style="font-weight:400;color:var(--muted);font-size:13px;">${esc(locationText(f, r))}</span>` : ''}</h3>
    <p class="helper" style="margin:0 0 12px;">Choose a stage and the first and last week it covers. Do it once for each stage.</p>
    <div class="cc-fill-grid">
      <div><label class="f">Stage</label><select onchange="state.fillRow.stage=this.value;keepEditor();">
        ${STAGES.map(st=> `<option value="${st.code}" ${s.stage===st.code?'selected':''}>${esc(st.name)}</option>`).join('')}
        <option value="clear" ${s.stage==='clear'?'selected':''}>Clear these weeks</option></select></div>
      <div><label class="f">From</label><select onchange="state.fillRow.from=+this.value;if(state.fillRow.to<state.fillRow.from)state.fillRow.to=state.fillRow.from;keepEditor();">${weekOptions(keys, s.from)}</select></div>
      <div><label class="f">To</label><select onchange="state.fillRow.to=+this.value;keepEditor();">${weekOptions(keys, s.to)}</select></div>
      <div>${s.stage === 'H' ? `<label class="f">kg each week</label><input id="fill-kg" type="number" min="0" step="any" inputmode="decimal"
        value="${esc(s.kg)}" oninput="state.fillRow.kg=this.value" placeholder="optional">`
        : `<label class="f">Weeks</label><div style="padding:11px 0;font-weight:600;color:var(--deep-green);">${n}</div>`}</div>
    </div>
    <div class="pn-actions">
      <button class="btn" onclick="applyFill()">${s.stage==='clear' ? 'Clear' : 'Fill'} ${n} week${n===1?'':'s'}</button>
      <button class="btn small ghost" onclick="state.fillRow=null;render();">Done</button>
    </div>
  </div>`;
}
function applyFill(){
  const f = currentFarm(), s = state.fillRow, r = f.rows.find(x=> x.id === s.id);
  const keys = farmWindow(f).flatMap(mo=> mo.keys);
  const [a, b] = [Math.min(s.from, s.to), Math.max(s.from, s.to)];
  const kg = s.kg === '' ? null : Number(s.kg);
  for(let i = a; i <= b; i++){
    if(s.stage === 'clear') delete r.cells[keys[i]];
    else r.cells[keys[i]] = writeCell(s.stage, kg);
  }
  touch(state.member);
  // Move on to the next stage, starting the week after — planning a whole
  // crop is then a run of presses of the same button.
  if(s.stage !== 'clear'){
    const idx = STAGES.findIndex(st=> st.code === s.stage);
    const nextFrom = Math.min(keys.length - 1, b + 1);
    state.fillRow = {id:r.id, stage: STAGES[Math.min(STAGES.length-1, idx+1)].code, from: nextFrom,
                     to: Math.min(keys.length-1, nextFrom + 3), kg: ''};
    state.calMsg = `${CHECK_ICON} ${esc(STAGE[s.stage].name)} set for ${b-a+1} week${b===a?'':'s'}. Next stage is ready below.`;
  }
  render();
}

/* ============================================================
   Greenhouses & blocks
   Optional. Three common cases are drawn so a farm can recognise its
   own, and the current one is marked — but there is no switch between
   them: adding a second greenhouse, or a block, is all it takes.
   ============================================================ */
function renderLayout(c){
  const f = currentFarm();
  const nb = f.units.reduce((n, u)=> n + u.blocks.length, 0);
  const caseNow = showUnits(f) ? 'many' : nb ? 'blocks' : 'one';
  const cases = [
    ['one',    'One greenhouse', 'Nothing to set up. Your calendar has no greenhouse or block column — every planting is simply on the farm.', '<span></span>', ''],
    ['many',   'Several greenhouses', 'Add each by its name or number (GH 2, North house…). Plantings are grouped under the greenhouse they are in.', '<span></span><span></span><span></span>', ''],
    ['blocks', 'One large greenhouse in blocks', 'Add blocks to it (Block A, Bay 1…). A Block column appears, and each planting is placed in one.', '<span></span><span></span><span></span><span></span>', 'blocks'],
  ];
  c.innerHTML = `
    <h1 class="page-title">Greenhouses &amp; blocks</h1>
    <p class="page-sub">Optional — set this up only if your farm is more than one greenhouse, or one greenhouse divided into blocks</p>
    <div class="card">
      <div class="lay-cases">${cases.map(([k, t, p, pic, cls])=> `<div class="lay-case ${caseNow===k?'is-current':''}">
          <div class="lay-pic ${cls}">${pic}</div><h4>${t}</h4><p>${p}</p>
          ${caseNow===k ? '<span class="lc-now">Your farm now</span>' : ''}</div>`).join('')}</div>
      <p class="helper" style="margin:12px 0 0;">Both at once works too: several greenhouses, any of them in blocks. Open fields and screenhouses are set the same way.
        However you divide it, your calendar exports to the same template as everyone else's.</p>
    </div>

    <div class="section-label">Your ${esc(unitWord(f, true))}</div>
    ${f.units.map((u, i)=> unitCard(f, u, i)).join('')}
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <button class="btn" onclick="addUnits(1)">${icon('plus')} Add another greenhouse</button>
      <span class="block-add"><span class="helper" style="margin:0;">or add</span>
        <input id="add-units-n" type="number" min="1" max="50" value="3" aria-label="How many to add">
        <button class="btn small ghost" onclick="addUnits(Number(val('add-units-n'))||0)">at once</button></span>
    </div>

    <div class="section-label">Farm details</div>
    <div class="card"><div class="grid4">
      <div><label class="f">Farm name</label><input value="${esc(f.name)}" onchange="setFarmField('name', this.value)"></div>
      <div><label class="f">Contact person</label><input value="${esc(f.contact)}" onchange="setFarmField('contact', this.value)"></div>
      <div><label class="f">Phone</label><input value="${esc(f.phone)}" onchange="setFarmField('phone', this.value)"></div>
      <div><label class="f">Location</label><input value="${esc(f.location)}" onchange="setFarmField('location', this.value)"></div>
    </div><p class="helper" style="margin:4px 0 0;">The farm name heads your exported calendar, as [Farm name] does on the template.</p></div>`;
}
function unitCard(f, u, i){
  const n = f.rows.filter(r=> r.unit === u.id).length;
  return `<div class="card unit-card">
    <div class="unit-head">
      <div><label class="f">Name or number</label><input value="${esc(u.name)}" onchange="renameUnit('${u.id}', this.value)" aria-label="Name of ${esc(u.name)}"></div>
      <div><label class="f">Type</label><select onchange="setUnitType('${u.id}', this.value)">
        ${UNIT_TYPES.map(t=> `<option ${t===u.type?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="uh-actions">${f.units.length > 1 ? `<button class="btn small ghost" style="color:var(--red);" onclick="removeUnit('${u.id}')">${icon('trash')} Remove</button>` : ''}</div>
    </div>
    <div class="unit-meta">${n} planting${n===1?'':'s'} on the calendar${u.blocks.length ? ` · divided into ${u.blocks.length} block${u.blocks.length===1?'':'s'}` : ' · not divided into blocks'}</div>
    <div class="block-list">
      ${u.blocks.map(b=>{
        const nb = f.rows.filter(r=> r.block === b.id).length;
        return `<span class="block-chip"><input value="${esc(b.name)}" onchange="renameBlock('${u.id}','${b.id}', this.value)" aria-label="Block name">
          ${nb ? `<span class="n">${nb}</span>` : ''}
          <button onclick="removeBlock('${u.id}','${b.id}')" aria-label="Remove ${esc(b.name)}" title="Remove block">${icon('close')}</button></span>`;
      }).join('')}
      <span class="block-add">
        <button class="btn small ghost" onclick="addBlocks('${u.id}', 1)">${icon('plus')} ${u.blocks.length ? 'Add a block' : 'Divide into blocks'}</button>
        ${u.blocks.length ? '' : `<input id="add-blocks-${u.id}" type="number" min="1" max="60" value="4" aria-label="How many blocks">
          <button class="btn small ghost" onclick="addBlocks('${u.id}', Number(val('add-blocks-${u.id}'))||0)">blocks at once</button>`}
      </span>
    </div>
  </div>`;
}
function setFarmField(k, v){ const f = currentFarm(); f[k] = v.trim(); touch(state.member); renderKeepingPlace(); }
function addUnits(n){
  if(!(n >= 1)) return;
  const f = currentFarm(), type = f.units[f.units.length-1].type;
  const count = f.units.filter(u=> u.type === type).length;
  for(let i = 1; i <= Math.min(n, 50); i++) f.units.push(blankUnit(count + i, type));
  touch(state.member); renderKeepingPlace();
}
function renameUnit(id, v){
  const f = currentFarm(), u = unitOf(f, id), name = v.trim();
  if(name) u.name = name;
  touch(state.member); renderKeepingPlace();
}
function setUnitType(id, type){
  const f = currentFarm(), u = unitOf(f, id);
  // "Greenhouse 2" becomes "Open field 2"; a name the farm chose is left alone.
  const m = u.name.match(new RegExp('^' + u.type.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ' (\\d+)$'));
  if(m) u.name = `${type} ${m[1]}`;
  u.type = type;
  touch(state.member); renderKeepingPlace();
}
function removeUnit(id){
  const f = currentFarm(), u = unitOf(f, id);
  const rows = f.rows.filter(r=> r.unit === id);
  const into = f.units.find(x=> x.id !== id);
  if(!confirm(rows.length ? `Remove ${u.name}? Its ${rows.length} planting${rows.length===1?'':'s'} will move to ${into.name}, weeks and all.`
                          : `Remove ${u.name}?`)) return;
  rows.forEach(r=>{ r.unit = into.id; r.block = ''; });
  f.units = f.units.filter(x=> x.id !== id);
  touch(state.member); renderKeepingPlace();
}
function addBlocks(unitId, n){
  if(!(n >= 1)) return;
  const f = currentFarm(), u = unitOf(f, unitId);
  // Block A, B, C … continuing from what is there; past Z, numbers.
  for(let i = 0; i < Math.min(n, 60); i++){
    const k = u.blocks.length;
    u.blocks.push({id:uid('b'), name: k < 26 ? `Block ${String.fromCharCode(65 + k)}` : `Block ${k + 1}`});
  }
  touch(state.member); renderKeepingPlace();
}
function renameBlock(unitId, blockId, v){
  const u = unitOf(currentFarm(), unitId), b = blockOf(u, blockId), name = v.trim();
  if(b && name) b.name = name;
  touch(state.member); renderKeepingPlace();
}
function removeBlock(unitId, blockId){
  const f = currentFarm(), u = unitOf(f, unitId), b = blockOf(u, blockId);
  const rows = f.rows.filter(r=> r.block === blockId);
  if(rows.length && !confirm(`Remove ${b.name}? Its ${rows.length} planting${rows.length===1?'':'s'} stay on the calendar, placed in the whole ${u.type.toLowerCase()}.`)) return;
  rows.forEach(r=> r.block = '');
  u.blocks = u.blocks.filter(x=> x.id !== blockId);
  touch(state.member); renderKeepingPlace();
}

/* ============================================================
   Excel, in and out, in the template's own layout
   A calendar exported from here is the master template filled in: the
   same title, columns, colours, key, live totals and the orange mark
   on this week. A template filled in by hand imports straight back in.
   ExcelJS is kept beside the page rather than fetched from a CDN, so
   this works on a farm with a poor connection once the page has loaded.
   ============================================================ */
let excelLib = null;
function loadExcel(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(excelLib) return excelLib;
  excelLib = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'vendor/exceljs.min.js';
    s.onload = ()=> window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('The Excel library did not start.'));
    s.onerror = ()=>{ excelLib = null; reject(new Error('The Excel library could not be loaded. Check the connection and try again.')); };
    document.head.appendChild(s);
  });
  return excelLib;
}

// The template's palette (measured from the master sheet).
const XL = {
  title:'FF1B4332', head:'FF2D6A4F', week:'FFD8F3DC', zebra:'FFF3FAF5', cropZebra:'FFFFF6E0',
  input:'FF1D4ED8', ink:'FF1F2933', grey:'FF6B7280', hair:'FFD5DED8', monthLine:'FFA7BFB0', now:'FFF4A261', white:'FFFFFFFF',
};
const XL_STAGE_NAME = {H:'Harvest  (type kg)'};      // the key's own wording
function argb(hex){ return 'FF' + hex.replace('#','').toUpperCase(); }
function colName(n){ let s = ''; while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
const FIRST_WEEK_COL = 6;     // F, as on the template

function xlFont(o){ return Object.assign({name:'Arial', size:9}, o); }
function solid(c){ return {type:'pattern', pattern:'solid', fgColor:{argb:c}, bgColor:{argb:c}}; }
function side(style, c){ return {style, color:{argb:c}}; }
// Excel compares text case-blind but not space-blind, so crop names go out tidy.
function tidyCrop(s){ return String(s||'').trim().replace(/\s+/g,' '); }

/* Writes one farm onto a sheet, exactly in the template's layout. */
function writeTemplateSheet(ws, f, months){
  const nW = months.length * 4, lastCol = FIRST_WEEK_COL + nW - 1, L = colName(lastCol);
  const rows = orderedRows(f);
  const nData = Math.max(20, rows.length);                 // the template has twenty lines; never fewer
  const r0 = 4, rEnd = r0 + nData - 1, rTot = rEnd + 1, rByHead = rTot + 2;
  const crops = [];
  rows.forEach(r=>{ const c = tidyCrop(r.crop); if(c && !crops.some(x=> cropKey(x) === cropKey(c))) crops.push(c); });
  const nCrop = Math.max(4, crops.length), rCrop0 = rByHead + 1, rKeyHead = rCrop0 + nCrop + 1;

  ws.properties.defaultRowHeight = 15;
  ws.views = [{state:'frozen', xSplit:5, ySplit:3, showGridLines:false, zoomScale:100}];
  ws.pageSetup = {orientation:'landscape', paperSize:8, fitToPage:true, fitToWidth:3, fitToHeight:0,
                  printTitlesRow:'2:3', printTitlesColumn:'A:E',
                  margins:{left:0.75, right:0.75, top:1, bottom:1, header:0.5, footer:0.5}};
  [14, 12, 14, 8, 24].forEach((w, i)=> ws.getColumn(i+1).width = w);
  for(let c = FIRST_WEEK_COL; c <= lastCol; c++) ws.getColumn(c).width = 3.61;

  // Row 1 — the title band, across the whole sheet.
  ws.getRow(1).height = 30;
  ws.mergeCells('A1:E1');
  const t = ws.getCell('A1');
  t.value = `CROP CALENDAR  ·  ${f.name || '[Farm name]'}  ·  ${months[0].y} – ${months[months.length-1].y}`;
  t.font = xlFont({size:14, bold:true, color:{argb:XL.white}}); t.alignment = {horizontal:'left', vertical:'middle'};
  for(let c = 1; c <= lastCol; c++) ws.getCell(1, c).fill = solid(XL.title);

  // Rows 2–3 — column headings, months, and week numbers.
  ws.getRow(2).height = 19.5; ws.getRow(3).height = 12.75;
  ['GREENHOUSE / BLOCK', 'SECTION', 'CROP', 'AREA (SQM)', 'NOTES'].forEach((h, i)=>{
    const col = colName(i+1);
    ws.mergeCells(`${col}2:${col}3`);
    const c = ws.getCell(`${col}2`);
    c.value = h;
    c.font = xlFont({size:8, bold:true, color:{argb:XL.white}});
    c.fill = solid(XL.head);
    c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    c.border = {right: side('thin', XL.white)};
  });
  months.forEach((mo, i)=>{
    const c1 = FIRST_WEEK_COL + i*4;
    ws.mergeCells(2, c1, 2, c1 + 3);
    const h = ws.getCell(2, c1);
    h.value = `${MONTH_ABBR[mo.m-1]} ${mo.y}`;
    h.font = xlFont({size:8, bold:true, color:{argb:XL.white}});
    h.fill = solid(XL.head);
    h.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    h.border = {left: side('thin', XL.white)};
    for(let w = 0; w < 4; w++){
      const c = ws.getCell(3, c1 + w);
      c.value = w + 1;
      c.font = xlFont({size:7, bold:true, color:{argb:XL.head}});
      c.fill = solid(XL.week);
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
      if(w === 0) c.border = {left: side('thin', XL.white)};
      // The template's own rule: this week's number turns orange, on whatever day the file is opened.
      const lastDay = w === 3 ? `DATE(${mo.y},${mo.m}+1,1)-1` : `DATE(${mo.y},${mo.m},${w*7+7})`;
      ws.addConditionalFormatting({ref: `${colName(c1 + w)}3`, rules:[{type:'expression', priority:1,
        formulae:[`AND(TODAY()>=DATE(${mo.y},${mo.m},${w*7+1}),TODAY()<=${lastDay})`],
        style:{fill:{type:'pattern', pattern:'solid', bgColor:{argb:XL.now}}, font:{color:{argb:XL.white}, bold:true}}}]});
    }
  });

  // The plantings — one line each, never fewer than the template's twenty.
  const weekNumFmt = '#,##0;\\-#,##0;""';
  for(let i = 0; i < nData; i++){
    const rn = r0 + i, row = ws.getRow(rn), r = rows[i];
    row.height = 19.5;
    const zebra = rn % 2 === 0 ? XL.zebra : XL.white;
    let unitName = '', blockName = '';
    if(r){ const u = unitOf(f, r.unit), b = blockOf(u, r.block); unitName = u.name; blockName = b ? b.name : ''; }
    const left = [unitName, blockName, r ? tidyCrop(r.crop) : '', r && r.area ? Number(r.area) : null, r ? r.notes : ''];
    left.forEach((v, j)=>{
      const c = row.getCell(j+1);
      c.value = v === '' ? null : v;
      c.font = xlFont({size:9, color:{argb:XL.input}});
      c.fill = solid(zebra);
      c.alignment = (j === 2 || j === 4) ? {horizontal:'left', vertical:'middle'} : {horizontal:'center', vertical:'middle', wrapText:true};
      if(j === 3) c.numFmt = '#,##0';
      c.border = {right: j === 4 ? side('medium', XL.head) : side('hair', XL.hair), bottom: side('hair', XL.hair)};
    });
    months.forEach((mo, mi)=> mo.keys.forEach((k, w)=>{
      const c = row.getCell(FIRST_WEEK_COL + mi*4 + w);
      const cell = r ? readCell(r.cells[k]) : null;
      c.font = xlFont({size:7, bold:true, color:{argb:XL.ink}});
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
      c.numFmt = weekNumFmt;
      c.border = {top: side('hair', XL.hair), bottom: side('hair', XL.hair),
                  left: w === 0 ? side('thin', XL.monthLine) : side('hair', XL.hair),
                  right: w === 3 ? side('thin', XL.monthLine) : side('hair', XL.hair)};
      if(cell){
        c.fill = solid(argb(STAGE[cell.s].color));
        if(cell.s === 'H' && cell.kg) c.value = cell.kg;
      }
    }));
  }

  // TOTAL HARVEST — the template's =SUM over each month's four columns.
  const per = monthTotals(f.rows, months);
  const totRow = ws.getRow(rTot); totRow.height = 21.75;
  ws.mergeCells(`A${rTot}:E${rTot}`);
  const tl = ws.getCell(`A${rTot}`);
  tl.value = 'TOTAL HARVEST  (kg / month)';
  tl.font = xlFont({size:9, bold:true, color:{argb:XL.white}}); tl.fill = solid(XL.title);
  tl.alignment = {horizontal:'right', vertical:'middle'};
  months.forEach((mo, i)=>{
    const c1 = FIRST_WEEK_COL + i*4, a = colName(c1), b = colName(c1+3);
    ws.mergeCells(rTot, c1, rTot, c1 + 3);
    const c = ws.getCell(rTot, c1);
    c.value = {formula:`SUM(${a}${r0}:${b}${rEnd})`, result: per[i]};
    c.font = xlFont({size:8, bold:true, color:{argb:XL.white}}); c.fill = solid(XL.title);
    c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    c.numFmt = '#,##0;\\-#,##0;\\–';
    c.border = {left: side('thin', XL.white)};
  });

  // HARVEST BY CROP — =SUMPRODUCT on the crop column, one line per crop.
  ws.getRow(rByHead).height = 18;
  ws.mergeCells(`A${rByHead}:E${rByHead}`);
  const bh = ws.getCell(`A${rByHead}`);
  bh.value = 'HARVEST BY CROP  (kg / month)  —  type the crop name below';
  bh.font = xlFont({size:9, bold:true, color:{argb:XL.title}}); bh.fill = solid(XL.week);
  bh.alignment = {horizontal:'left', vertical:'middle'};
  for(let i = 0; i < nCrop; i++){
    const rn = rCrop0 + i, crop = crops[i] || '';
    const zebra = i % 2 === 0 ? XL.cropZebra : XL.white;
    ws.getRow(rn).height = 18;
    ws.mergeCells(`A${rn}:B${rn}`); ws.mergeCells(`C${rn}:E${rn}`);
    const lab = ws.getCell(`A${rn}`);
    lab.value = 'Crop'; lab.font = xlFont({size:8, color:{argb:XL.grey}}); lab.fill = solid(zebra);
    lab.alignment = {horizontal:'right', vertical:'middle'}; lab.border = {bottom: side('hair', XL.hair)};
    const nm = ws.getCell(`C${rn}`);
    nm.value = crop || null; nm.font = xlFont({size:9, color:{argb:XL.input}}); nm.fill = solid(zebra);
    nm.alignment = {horizontal:'left', vertical:'middle'}; nm.border = {bottom: side('hair', XL.hair)};
    const perCrop = crop ? monthTotals(f.rows.filter(r=> cropKey(r.crop) === cropKey(crop)), months) : months.map(()=> 0);
    months.forEach((mo, mi)=>{
      const c1 = FIRST_WEEK_COL + mi*4, a = colName(c1), b = colName(c1+3);
      ws.mergeCells(rn, c1, rn, c1 + 3);
      const c = ws.getCell(rn, c1);
      c.value = {formula:`IF($C${rn}="",0,SUMPRODUCT(($C$${r0}:$C$${rEnd}=$C${rn})*${a}$${r0}:${b}$${rEnd}))`, result: perCrop[mi]};
      c.font = xlFont({size:8, bold:true, color:{argb:XL.title}}); c.fill = solid(zebra);
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
      c.numFmt = '#,##0;\\-#,##0;\\–';
      c.border = {left: side('thin', XL.white)};
    });
  }

  // The key.
  ws.getRow(rKeyHead).height = 18;
  ws.mergeCells(`A${rKeyHead}:E${rKeyHead}`);
  const kh = ws.getCell(`A${rKeyHead}`);
  kh.value = 'KEY  —  colour the week cells; type kg in harvest cells';
  kh.font = xlFont({size:9, bold:true, color:{argb:XL.white}}); kh.fill = solid(XL.head);
  kh.alignment = {horizontal:'left', vertical:'middle'};
  STAGES.forEach((s, i)=>{
    const rn = rKeyHead + 1 + i;
    ws.getRow(rn).height = 16.5;
    const sw = ws.getCell(`A${rn}`);
    sw.fill = solid(argb(s.color));
    sw.border = {top: side('thick', XL.white), bottom: side('thick', XL.white)};
    ws.mergeCells(`B${rn}:E${rn}`);
    const nm = ws.getCell(`B${rn}`);
    nm.value = XL_STAGE_NAME[s.code] || s.name;
    nm.font = xlFont({size:9, color:{argb:XL.ink}}); nm.alignment = {horizontal:'left', vertical:'middle'};
  });
  return {rTot, rEnd};
}

function safeFileName(s){ return String(s||'farm').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').toUpperCase() || 'FARM'; }
async function downloadWorkbook(wb, name){
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function newWorkbook(ExcelJS){
  const wb = new ExcelJS.Workbook();
  wb.creator = 'TIPFA Crop Calendar'; wb.created = new Date();
  return wb;
}

async function exportFarmExcel(farmId){
  const id = farmId || state.member, f = FARMS[id];
  try{
    const ExcelJS = await loadExcel();
    const wb = newWorkbook(ExcelJS);
    const months = farmWindow(f);
    writeTemplateSheet(wb.addWorksheet('Crop Calendar'), f, months);
    await downloadWorkbook(wb, `${safeFileName(f.name)}_CROP_CALENDAR_${months[0].y}-${months[months.length-1].y}.xlsx`);
  }catch(e){ showFatal(e.message || e); }
}

/* ============================================================
   Reading a filled-in template back
   The headings are found by name, not by position, so a sheet with a row
   inserted above, or columns moved, still reads. A week's colour gives its
   stage, matched to the nearest colour in the key; a number in a week is
   harvest kilograms — the template's own totals count every number, so
   treating each as a harvest keeps this calendar adding up the same.
   ============================================================ */
function cellText(c){
  const v = c && c.value;
  if(v === null || v === undefined) return '';
  if(typeof v === 'object'){
    if(v.richText) return v.richText.map(t=> t.text).join('').trim();
    if(v.text) return String(v.text).trim();
    if('result' in v) return String(v.result ?? '').trim();
    return '';
  }
  return String(v).trim();
}
function cellNumber(c){
  const v = c && c.value;
  if(typeof v === 'number') return v;
  if(v && typeof v === 'object' && typeof v.result === 'number') return v.result;
  if(typeof v === 'string' && v.trim() && !isNaN(Number(v.replace(/,/g,'')))) return Number(v.replace(/,/g,''));
  return null;
}
function hexToRgb(h){ h = h.replace('#','').slice(-6); return [0,2,4].map(i=> parseInt(h.slice(i, i+2), 16)); }
function stageFromFill(fill){
  if(!fill || fill.type !== 'pattern' || fill.pattern === 'none') return {stage:null, coloured:false};
  const col = (fill.fgColor && fill.fgColor.argb) || (fill.bgColor && fill.bgColor.argb);
  if(!col) return {stage:null, coloured: !!(fill.fgColor && fill.fgColor.theme !== undefined)};
  const rgb = hexToRgb(col);
  if(rgb.every(v=> v > 235)) return {stage:null, coloured:false};          // white, or the zebra tint
  let best = null, bestD = Infinity;
  STAGES.forEach(s=>{
    const t = hexToRgb(s.color);
    const d = Math.sqrt(t.reduce((a, v, i)=> a + (v - rgb[i])**2, 0));
    if(d < bestD){ bestD = d; best = s.code; }
  });
  return bestD <= 70 ? {stage:best, coloured:true} : {stage:null, coloured:true};
}

function parseTemplateSheet(ws){
  const MONTH_RE = new RegExp('^(' + MONTH_ABBR.join('|') + ')[A-Z]*\\s+(\\d{4})$', 'i');
  let hdr = null;
  for(let rn = 1; rn <= Math.min(15, ws.rowCount); rn++){
    const row = ws.getRow(rn);
    let crop = -1, firstMonth = -1;
    row.eachCell({includeEmpty:false}, (c, cn)=>{
      const t = cellText(c).toUpperCase();
      if(t === 'CROP' && crop < 0) crop = cn;
      if(MONTH_RE.test(t) && firstMonth < 0) firstMonth = cn;
    });
    if(crop > 0 && firstMonth > 0){ hdr = {rn, crop, firstMonth}; break; }
  }
  if(!hdr) return null;

  const head = ws.getRow(hdr.rn);
  const findCol = (re)=>{ let f = -1; head.eachCell({includeEmpty:false}, (c, cn)=>{ if(f < 0 && cn < hdr.firstMonth && re.test(cellText(c).toUpperCase())) f = cn; }); return f; };
  const cols = {unit: findCol(/GREENHOUSE|^UNIT|^HOUSE/), block: findCol(/SECTION|^BLOCK/), crop: hdr.crop,
                area: findCol(/AREA/), notes: findCol(/NOTE/)};

  // Each week column's date, from the month above it and its 1–4 below.
  const weekRow = ws.getRow(hdr.rn + 1);
  const colKey = {};
  let cur = null;
  for(let cn = hdr.firstMonth; cn <= ws.columnCount; cn++){
    const hc = head.getCell(cn);
    if(!hc.isMerged || hc.master === hc){
      const m = cellText(hc).toUpperCase().match(MONTH_RE);
      if(m) cur = {y:Number(m[2]), m: MONTH_ABBR.indexOf(m[1].slice(0,3).toUpperCase()) + 1};
    }
    if(!cur) continue;
    const w = cellNumber(weekRow.getCell(cn));
    if(w >= 1 && w <= 4) colKey[cn] = weekKey(cur.y, cur.m, w);
  }
  const weekCols = Object.keys(colKey).map(Number);
  if(!weekCols.length) return null;

  const plantings = [];
  let unrecognised = 0;
  for(let rn = hdr.rn + 2; rn <= ws.rowCount; rn++){
    const row = ws.getRow(rn);
    const first = cellText(row.getCell(1)).toUpperCase();
    if(/^TOTAL HARVEST|^HARVEST BY CROP|^KEY\b/.test(first)) break;
    const p = {
      unit: cols.unit > 0 ? cellText(row.getCell(cols.unit)) : '',
      block: cols.block > 0 ? cellText(row.getCell(cols.block)) : '',
      crop: cellText(row.getCell(cols.crop)),
      area: cols.area > 0 ? (cellNumber(row.getCell(cols.area)) || 0) : 0,
      notes: cols.notes > 0 ? cellText(row.getCell(cols.notes)) : '',
      cells: {},
    };
    weekCols.forEach(cn=>{
      const c = row.getCell(cn);
      const kg = cellNumber(c);
      const {stage, coloured} = stageFromFill(c.fill);
      if(kg !== null && kg > 0) p.cells[colKey[cn]] = writeCell('H', kg);
      else if(stage) p.cells[colKey[cn]] = writeCell(stage);
      else if(coloured) unrecognised++;
    });
    if(p.crop || Object.keys(p.cells).length) plantings.push(p);
  }
  const years = Object.values(colKey).map(k=> parseWeekKey(k).y);
  return {plantings, unrecognised, firstYear: Math.min(...years), sheet: ws.name};
}

async function importFarmExcel(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const done = (msg, bad)=>{ state.importMsg = msg; state.importBad = !!bad; renderKeepingPlace(); };
  try{
    const ExcelJS = await loadExcel();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    let parsed = null;
    for(const ws of wb.worksheets){ parsed = parseTemplateSheet(ws); if(parsed) break; }
    if(!parsed) return done('That file does not look like the crop calendar template — no sheet has a CROP heading with months beside it.', true);
    if(!parsed.plantings.length) return done('The template was read, but it has no plantings in it yet.', true);
    const f = currentFarm();
    const replace = !f.rows.length ? true
      : confirm(`This file has ${parsed.plantings.length} planting${parsed.plantings.length===1?'':'s'}.\n\n` +
                `OK — replace the ${f.rows.length} already on your calendar\nCancel — add them to it`);
    const n = applyImport(f, parsed, replace);
    touch(state.member);
    state.scroll = null;
    done(`${CHECK_ICON} Imported ${n} planting${n===1?'':'s'} from “${esc(parsed.sheet)}”${replace ? ', replacing what was there' : ''}.` +
         (parsed.unrecognised ? ` ${parsed.unrecognised} coloured week${parsed.unrecognised===1?' was':'s were'} not a colour in the key and ${parsed.unrecognised===1?'was':'were'} left blank.` : ''));
  }catch(e){ done('That file could not be read: ' + esc(e.message || e), true); }
}

/* Greenhouses and blocks named in the file are matched to the farm's own by
   name, and added where they are new — so importing never needs the layout
   set up first. A file with nothing under GREENHOUSE / BLOCK lands in the
   farm's first unit. */
function applyImport(f, parsed, replace){
  if(replace){
    f.rows = [];
    const named = parsed.plantings.some(p=> p.unit);
    // A brand-new farm's untouched "Greenhouse 1" gives way to the names in the file.
    if(named && f.units.length === 1 && !f.units[0].blocks.length && /^(Greenhouse|Screenhouse|Open field|Nursery) 1$/.test(f.units[0].name)) f.units = [];
    f.startYear = parsed.firstYear || f.startYear;
  }
  const guessType = name=> /field|shamba/i.test(name) ? 'Open field' : /screen/i.test(name) ? 'Screenhouse' : /nursery/i.test(name) ? 'Nursery' : 'Greenhouse';
  const unitFor = name=>{
    if(!name){ if(!f.units.length) f.units.push(blankUnit(1)); return f.units[0]; }
    let u = f.units.find(x=> norm(x.name) === norm(name));
    if(!u){ u = {id:uid('u'), name, type:guessType(name), blocks:[]}; f.units.push(u); }
    return u;
  };
  parsed.plantings.forEach(p=>{
    const u = unitFor(p.unit);
    let block = '';
    if(p.block){
      let b = u.blocks.find(x=> norm(x.name) === norm(p.block));
      if(!b){ b = {id:uid('b'), name:p.block}; u.blocks.push(b); }
      block = b.id;
    }
    f.rows.push({id:uid('r'), unit:u.id, block, crop:p.crop, area:Number(p.area)||0, notes:p.notes, cells:p.cells});
  });
  normaliseFarm(f);
  return parsed.plantings.length;
}

/* ============================================================
   The Secretariat's side: every farm's calendar, read only
   Because every farm is held in the same shape, however it divides its
   ground, the association's harvest can be added up by crop and month —
   which is what a shared crop calendar is for.
   ============================================================ */
function adminYear(){ return state.admYear || DEFAULT_START_YEAR; }
function shiftAdminYear(d){ state.admYear = adminYear() + d; state.scroll = null; renderKeepingPlace(); }
function farmIds(){
  return Object.keys(FARMS).filter(id=> FARMS[id] && FARMS[id].name !== undefined)
    .sort((a, b)=> (FARMS[a].name||'').localeCompare(FARMS[b].name||''));
}
function openAdminFarm(id){ state.viewFarm = id; state.scroll = null; render(); window.scrollTo(0, 0); }
function updatedText(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

// Harvest by crop and month, every farm together.
function associationByCrop(months){
  const by = new Map();
  farmIds().forEach(id=> cropTotals(FARMS[id].rows, months).forEach(g=>{
    const k = cropKey(g.crop);
    if(!by.has(k)) by.set(k, {crop:g.crop, per: months.map(()=> 0), farms:new Set()});
    const e = by.get(k);
    g.per.forEach((v, i)=> e.per[i] += v);
    e.farms.add(id);
  }));
  return [...by.values()].map(e=> Object.assign(e, {total: e.per.reduce((a, b)=> a + b, 0)}))
    .sort((a, b)=> b.total - a.total);
}

function windowControl(label, fn){
  const y = adminYear();
  return `<div class="cc-window" role="group" aria-label="${esc(label)}">
    <button onclick="${fn}(-1)" aria-label="One year earlier">${icon('chevL')}</button>
    <span class="cw-label">${MONTH_ABBR[0]} ${y} – ${MONTH_ABBR[11]} ${y + 2}</span>
    <button onclick="${fn}(1)" aria-label="One year later">${icon('chevR')}</button></div>`;
}

// The Secretariat exports the years it is looking at, not the farm's own.
async function exportFarmExcelWindow(id){
  const f = FARMS[id];
  try{
    const ExcelJS = await loadExcel();
    const wb = newWorkbook(ExcelJS), months = windowMonths(adminYear());
    writeTemplateSheet(wb.addWorksheet('Crop Calendar'), f, months);
    await downloadWorkbook(wb, `${safeFileName(f.name)}_CROP_CALENDAR_${months[0].y}-${months[months.length-1].y}.xlsx`);
  }catch(e){ showFatal(e.message || e); }
}

/* One workbook: the association's totals first, then every farm's
   calendar on its own sheet, each in the template's layout. */
async function exportAllExcel(){
  try{
    const ExcelJS = await loadExcel();
    const wb = newWorkbook(ExcelJS), months = windowMonths(adminYear());
    const ass = associationByCrop(months);
    const ws = wb.addWorksheet('Association');
    const nCol = months.length + 3;
    ws.views = [{state:'frozen', xSplit:2, ySplit:2, showGridLines:false}];
    ws.getColumn(1).width = 24; ws.getColumn(2).width = 8;
    for(let i = 3; i <= nCol; i++) ws.getColumn(i).width = 9;
    ws.getColumn(nCol).width = 11;
    ws.mergeCells(1, 1, 1, nCol);
    const t = ws.getCell(1, 1);
    t.value = `TIPFA  ·  HARVEST BY CROP, EVERY MEMBER FARM (kg / month)  ·  ${months[0].y} – ${months[months.length-1].y}`;
    t.font = xlFont({size:13, bold:true, color:{argb:XL.white}}); t.fill = solid(XL.title);
    t.alignment = {vertical:'middle'}; ws.getRow(1).height = 28;
    const head = ['CROP', 'FARMS', ...months.map(mo=> `${MONTH_ABBR[mo.m-1]} ${mo.y}`), 'TOTAL'];
    head.forEach((h, i)=>{
      const c = ws.getCell(2, i+1);
      c.value = h; c.font = xlFont({size:8, bold:true, color:{argb:XL.white}}); c.fill = solid(XL.head);
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    });
    ws.getRow(2).height = 26;
    ass.forEach((e, i)=>{
      const rn = 3 + i, zebra = i % 2 === 0 ? XL.zebra : XL.white;
      const vals = [e.crop, e.farms.size, ...e.per, null];
      vals.forEach((v, j)=>{
        const c = ws.getCell(rn, j+1);
        c.value = j === nCol - 1 ? {formula:`SUM(${colName(3)}${rn}:${colName(nCol-1)}${rn})`, result:e.total} : v;
        c.font = xlFont({size:9, bold: j === 0 || j === nCol - 1, color:{argb: j === 0 ? XL.title : XL.ink}});
        c.fill = solid(zebra);
        if(j >= 2) c.numFmt = '#,##0;\\-#,##0;\\–';
        c.alignment = {horizontal: j === 0 ? 'left' : 'center', vertical:'middle'};
      });
    });
    const rt = 3 + ass.length;
    ws.getCell(rt, 1).value = 'ALL CROPS';
    for(let j = 3; j <= nCol; j++){
      const col = colName(j);
      ws.getCell(rt, j).value = {formula:`SUM(${col}3:${col}${rt-1})`,
        result: j === nCol ? ass.reduce((t, e)=> t + e.total, 0) : ass.reduce((t, e)=> t + e.per[j-3], 0)};
      ws.getCell(rt, j).numFmt = '#,##0;\\-#,##0;\\–';
    }
    for(let j = 1; j <= nCol; j++){
      const c = ws.getCell(rt, j);
      c.font = xlFont({size:9, bold:true, color:{argb:XL.white}}); c.fill = solid(XL.title);
      c.alignment = {horizontal: j === 1 ? 'left' : 'center', vertical:'middle'};
    }

    // Sheet names must be unique, at most 31 characters, and free of []:*?/\
    const used = new Set(['association']);
    farmIds().forEach(id=>{
      let base = (FARMS[id].name || 'Farm').replace(/[\[\]:*?/\\]/g, ' ').trim().slice(0, 31) || 'Farm', name = base, n = 2;
      while(used.has(name.toLowerCase())){ name = base.slice(0, 27) + ' (' + n++ + ')'; }
      used.add(name.toLowerCase());
      writeTemplateSheet(wb.addWorksheet(name), FARMS[id], months);
    });
    await downloadWorkbook(wb, `TIPFA_CROP_CALENDARS_ALL_FARMS_${months[0].y}-${months[months.length-1].y}.xlsx`);
  }catch(e){ showFatal(e.message || e); }
}
