/* ---- The operator roll -----------------------------------------------
   Operators are Firebase accounts, but Governance was listing an array
   kept in whichever browser happened to be open. An operator who signed
   up on one device was invisible on every other, so the roll showed only
   the ones made here. Read the real list. */
async function cloudPullOperators(){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator') return 0;
  try{
    const { collection, getDocs } = CLOUD.fs;
    const snap = await getDocs(collection(CLOUD.db, 'operators'));
    let n = 0;
    const seen = {};
    snap.forEach(d=>{
      const v = d.data() || {};
      const email = (v.email || '').trim();
      if(!email) return;
      seen[d.id] = true;
      const at = ADMINS.findIndex(a=> norm(a.username) === norm(email));
      if(at === -1) ADMINS.push({ name: v.name || email, username: email, uid: d.id, since: v.since || '' });
      else Object.assign(ADMINS[at], { name: v.name || ADMINS[at].name, uid: d.id, since: v.since || ADMINS[at].since });
      n++;
    });
    // The roll is what the database holds. An operator removed on another
    // device has to leave this one too, or every console keeps its own idea
    // of who the association's operators are — which is the fault being fixed.
    for(let i = ADMINS.length - 1; i >= 0; i--){
      const a = ADMINS[i];
      if(a.uid && !seen[a.uid]) ADMINS.splice(i, 1);
    }
    // Removing an operator revokes their access at the database, so a console
    // still open on that account can no longer read or write anything. Say so
    // and close the session rather than leaving it looking signed in.
    if(CLOUD_STATE.uid && !seen[CLOUD_STATE.uid]){
      saveAdmins();
      await revokeOperatorSession();
      return n;
    }
    // An account this browser made before the database existed is still shown,
    // but it is not one of the association's — say which is which.
    ADMINS.forEach(a=>{ if(!a.uid) a.localOnly = true; else delete a.localOnly; });
    saveAdmins();
    return n;
  }catch(e){
    // A revoked operator cannot list the collection either — the refusal is
    // itself the answer. Their own record is readable to them if it exists,
    // so ask for that before concluding anything.
    const denied = /permission|insufficient/i.test(String(e && (e.code || e.message)));
    if(denied && !(await checkStillAnOperator())) return 0;
    // Still an operator, so the read failed for another reason. Saying nothing
    // leaves a console showing one account and no idea why.
    state.govError = denied
      ? 'The roll of administrators could not be read from the shared database — it refused the request. Check that the rules in firestore.rules are published, then try again.'
      : 'The roll of administrators could not be read from the shared database: ' + ((e && e.message) || e);
    return 0;
  }
}

/* ---- The roll of roles ------------------------------------------------
   Roles live in users/{uid}. Staff may read the whole collection; only the
   system owner may write a role, a farm list or a status, and that is
   enforced by the rules rather than by hiding the control here. */
async function cloudPullUsers(){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator') return 0;
  try{
    const { collection, getDocs } = CLOUD.fs;
    const snap = await getDocs(collection(CLOUD.db, 'users'));
    const next = {};
    snap.forEach(d=>{ next[d.id] = Object.assign({uid:d.id}, d.data() || {}); });
    USERS = next;
    if(CLOUD_STATE.uid && USERS[CLOUD_STATE.uid]) USER = USERS[CLOUD_STATE.uid];
    return Object.keys(USERS).length;
  }catch(e){
    // Not fatal: Governance still lists the roll, it just cannot say which
    // role each account holds.
    return 0;
  }
}

/* Change what someone may do. The database refuses this from anyone but the
   system owner, so a refusal here is the rule working, not a fault. */
async function cloudSetUserField(uid, field, value){
  if(!cloudOn() || !uid) throw new Error('Not connected to the shared database.');
  const { doc, updateDoc } = CLOUD.fs;
  await updateDoc(doc(CLOUD.db, 'users', uid), { [field]: value });
  if(USERS[uid]) USERS[uid][field] = value;
  if(CLOUD_STATE.uid === uid && USER) USER[field] = value;
}

async function checkStillAnOperator(){
  if(!cloudOn() || !CLOUD_STATE.uid) return true;
  try{
    const { doc, getDoc } = CLOUD.fs;
    const mine = await getDoc(doc(CLOUD.db, 'operators', CLOUD_STATE.uid));
    if(mine.exists()) return true;
  }catch(e){ return true; }        // could not tell; leave the session alone
  await revokeOperatorSession();
  return false;
}

async function revokeOperatorSession(){
  for(let i = ADMINS.length - 1; i >= 0; i--) if(ADMINS[i].uid === CLOUD_STATE.uid) ADMINS.splice(i, 1);
  saveAdmins();
  logAction('This operator account was removed by another operator — signing out.');
  state.forgotMsg = 'Your operator account has been removed by another operator, so this console has been signed out.';
  await cloudSignOut();
  state.loggedIn = false; state.role = null;
  forgetSession();
  document.body.removeAttribute('data-role');
  render();
}

async function cloudDeleteOperator(uid){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator' || !uid) return;
  if(uid === CLOUD_STATE.uid) return;                 // never the one signed in
  try{ await CLOUD.fs.deleteDoc(CLOUD.fs.doc(CLOUD.db, 'operators', uid)); }
  catch(e){ state.govError = 'The database refused that removal. Check the rules in firestore.rules are published.'; }
}

async function cloudPullAll(){
  if(!cloudOn()) return 0;
  const { collection, getDocs, doc, getDoc } = CLOUD.fs;
  let count = 0;
  try{
    if(CLOUD_STATE.role === 'operator'){
      const farms = await getDocs(collection(CLOUD.db, 'farms'));
      farms.forEach(d=>{
        const rec = d.data();
        if(rec.inputs) inputsData[d.id] = rec.inputs;
        delete rec.inputs;
        MEMBERS[d.id] = Object.assign(MEMBERS[d.id]||{}, rec);
        CLOUD_STATE.cloudIds.add(d.id); count++;
      });
      const hv = await getDocs(collection(CLOUD.db, 'harvest'));
      hv.forEach(d=>{ harvest[d.id] = { plan:d.data().plan||blankHarvestStore(),
        actual:d.data().actual||blankHarvestStore(), entries:d.data().entries||[] }; });
    } else if(CLOUD_STATE.uid){
      const f = await getDoc(doc(CLOUD.db, 'farms', CLOUD_STATE.uid));
      if(f.exists()){
        const rec = f.data();
        if(rec.inputs) inputsData[CLOUD_STATE.uid] = rec.inputs;
        delete rec.inputs;
        MEMBERS[CLOUD_STATE.uid] = Object.assign(MEMBERS[CLOUD_STATE.uid]||{}, rec);
        CLOUD_STATE.cloudIds.add(CLOUD_STATE.uid); count++;
      }
      const h = await getDoc(doc(CLOUD.db, 'harvest', CLOUD_STATE.uid));
      if(h.exists()) harvest[CLOUD_STATE.uid] = { plan:h.data().plan||blankHarvestStore(),
        actual:h.data().actual||blankHarvestStore(), entries:h.data().entries||[] };
    }
    // Bring anything pulled up to the current record shape.
    Object.keys(MEMBERS).forEach(id=>{
      const m = MEMBERS[id];
      if(!Array.isArray(m.crops)) m.crops = [];
      m.crops.forEach(ensureProgramme);
      if(!harvest[id] || !inputsData[id]) createBlankRecords(id);
    });
    saveMembers();
  }catch(e){ setCloudStatus('offline', 'Could not read the shared database: ' + (e.message||e)); }
  return count;
}

/* ============================================================
   Roles and permissions — the administrator console only

   A role says which parts of the console an operator may open and
   what they may change there. It belongs to the association's own
   staff and to nobody else: a farm signs in as a farm, holds its
   own records, and is never given a role or measured against one.

   A role lives in one place — users/{uid} — and the rules read it
   from there. What the browser knows is only for deciding what to
   draw; every restriction that matters is enforced in
   firestore.rules, because a hidden button is not a permission.
   ============================================================ */
const ROLES = ['superAdmin','secretariat','qualityOfficer',
               'agronomist','logistics','auditor'];

const ROLE_LABELS = {
  superAdmin:    'System owner',
  secretariat:   'Secretariat',
  qualityOfficer:'Quality officer',
  agronomist:    'Agronomist',
  logistics:     'Logistics',
  auditor:       'Auditor'
};

const PERMS = {
  superAdmin:    ['*'],
  secretariat:   ['members.read','members.write','orders.*','inputs.*','batches.read','reports.*',
                  'advisory.read','knowledge.write','complaints.read',
                  'catalogue.*','codes.*','comms.*','calendars.read','bulk.*','dashboard.read',
                  'growth.read','archive.read'],
  qualityOfficer:['batches.*','complaints.*','reports.read','members.read','calendars.read','dashboard.read'],
  agronomist:    ['advisory.*','knowledge.write','farms.read','batches.read','members.read',
                  'calendars.read','reports.read'],
  logistics:     ['consignments.*','orders.read'],
  auditor:       ['*.read']
};

// Who this browser is signed in as, for drawing the page only.
let USER = null;
/* USER is a module-level binding, so a test cannot reach it through window.
   This is the only way in, and it exists for that. */
window.__setUser = u => { USER = u; };

/* Everyone's role record, keyed by user id, read by staff for Governance.
   The signed-in person's own record is USER; this is the roll. */
let USERS = {};

/* One wildcard match, so a screen asks can('orders.write') and nothing
   scatters role names through the rendering code. */
function can(perm){
  const role = USER && USER.status === 'active' ? USER.role : null;
  const list = PERMS[role];
  if(!list) return false;
  const [group, action] = String(perm).split('.');
  return list.some(p=>{
    if(p === '*') return true;
    const [g, a] = p.split('.');
    if(g === '*') return a === action || a === '*';
    if(g !== group) return false;
    return a === '*' || a === action;
  });
}
/* ============================================================
   What a role may actually do

   Roles decided which tabs an operator saw and nothing else, so an
   auditor — whose whole point is to read everything and change
   nothing — could open Member management and approve a farm. The
   tab was the lock and there was nothing behind the door.

   Rather than thread a check through a hundred buttons and miss
   some, every action that writes is named here once and wrapped at
   start-up. A call that the role cannot make does not happen, and
   afterRender dims the button so nobody presses it expecting it to.

   This is courtesy, not security. The rules refuse the same writes
   at the database; this only stops the console pretending otherwise.
   ============================================================ */
const WRITE_GUARDS = {
  // Members
  approveMember:'members.write', removeMember:'members.write',
  saveMemberEdit:'members.write',
  // The crop catalogue
  addCatalogueCrop:'catalogue.write', addCatalogueVariety:'catalogue.write',
  saveCatalogueVariety:'catalogue.write',
  removeCatalogueCrop:'catalogue.write', removeCatalogueVariety:'catalogue.write',
  // Orders
  addOrder:'orders.write', askEveryone:'orders.write', offerTo:'orders.write',
  sendDraft:'orders.write', withdrawAlloc:'orders.write',
  markDelivered:'orders.write', setOrderStatus:'orders.write',
  // The input store
  saveInput:'inputs.write', deleteInput:'inputs.write', toggleInput:'inputs.write',
  restoreInputList:'inputs.write', setRequestStatus:'inputs.write',
  stockSuggestion:'inputs.write', declineSuggestion:'inputs.write',
  // Traceability
  addIssue:'complaints.write', resolveIssue:'complaints.write',
  // Advisory
  answerCase:'advisory.write', addKnowledge:'knowledge.write',
  // Governance
  setSignupCode:'codes.write', setAdminRole:'roles.write', setAdminStatus:'roles.write',
  handOverOwnership:'roles.write', removeAdmin:'roles.write',
  // Bulk entry
  saveBulk:'bulk.write'
};

/* A role that cannot do a thing should not be offered the button. Read the
   function name out of the handler and dim anything it may not call. */
function dimForbiddenActions(root){
  if(state.role !== 'admin' || !USER) return;
  root.querySelectorAll('[onclick]').forEach(el=>{
    const m = /^\s*([A-Za-z_$][\w$]*)\s*\(/.exec(el.getAttribute('onclick') || '');
    if(!m) return;
    const perm = WRITE_GUARDS[m[1]];
    if(!perm || can(perm)) return;
    el.classList.add('not-allowed');
    el.setAttribute('aria-disabled', 'true');
    if('disabled' in el) el.disabled = true;
    el.title = `${roleLabel(roleIs())} cannot do this. Ask the system owner.`;
  });
}

function guardAdminWrites(){
  Object.keys(WRITE_GUARDS).forEach(name=>{
    const fn = window[name];
    if(typeof fn !== 'function' || fn.__guarded) return;
    const wrapped = function(){
      if(state.role === 'admin' && USER && !can(WRITE_GUARDS[name])){
        state.orderError = `Your role is ${roleLabel(roleIs())}, which cannot do that. ` +
          `The system owner sets roles on the Governance tab.`;
        try{ render(); }catch(_){ }
        return;
      }
      return fn.apply(this, arguments);
    };
    wrapped.__guarded = true;
    window[name] = wrapped;
  });
}

function roleIs(){ return USER ? USER.role : null; }
function roleLabel(r){ return ROLE_LABELS[r] || r || '—'; }

function userDocFor(uid, fields){
  return Object.assign({
    displayName:'', phone:'', email:'', role:'secretariat',
    regions:[], status:'active',
    createdAt: new Date().toISOString(), createdBy: CLOUD_STATE.uid || uid
  }, fields || {});
}

/* Write the role record beside the account, filling in what a new record
   holds so no screen has to cope with a half-written one. */
async function cloudCreateUserDoc(uid, fields){
  if(!cloudOn()) return null;
  const { doc, setDoc } = CLOUD.fs;
  const rec = userDocFor(uid, fields);
  await setDoc(doc(CLOUD.db, 'users', uid), rec);
  return rec;
}

/* Who owns the association's settings is claimed, not counted. Rules cannot
   count a collection, and listing the operators is itself something only
   staff may do — so the first operator to arrive writes settings/ownership,
   and the rules refuse every later claim because the document is already
   there. First come, once only, and no way to take it from whoever holds it.
   An association already running gets its owner the first time one of its
   operators signs in. */
async function claimOwnership(uid){
  if(!cloudOn() || !uid) return false;
  const { doc, getDoc, setDoc } = CLOUD.fs;
  try{
    const d = await getDoc(doc(CLOUD.db, 'settings', 'ownership'));
    if(d.exists()) return (d.data() || {}).owner === uid;
  }catch(e){ /* cannot read it; the claim below is the real test anyway */ }
  try{
    await setDoc(doc(CLOUD.db, 'settings', 'ownership'),
                 { owner: uid, claimedAt: new Date().toISOString() });
    return true;
  }catch(e){ return false; }      // somebody already owns it
}

/* Read the role for whoever is signed in, and write one where an operator
   predates this collection. Nobody is locked out over a missing record: an
   operator from before roles existed becomes Secretariat. Called with no
   fallback — as it is for a farm — it simply leaves USER empty. */
async function loadUserRole(uid, fallback){
  USER = null;
  if(!cloudOn() || !uid) return null;
  const { doc, getDoc } = CLOUD.fs;
  try{
    const d = await getDoc(doc(CLOUD.db, 'users', uid));
    if(d.exists()){ USER = Object.assign({uid}, d.data()); return USER; }
  }catch(e){ /* fall through and try to write one */ }
  if(!fallback) return null;
  // An operator arriving before anyone owned the settings becomes the owner.
  if(fallback.role === 'secretariat' && await claimOwnership(uid))
    fallback = Object.assign({}, fallback, { role:'superAdmin' });
  try{
    USER = Object.assign({uid}, await cloudCreateUserDoc(uid, fallback));
    logAction(`A role record was created for this account (${roleLabel(USER.role)}).`);
  }catch(e){
    // The rules would not allow it. Carry on with what the account is,
    // rather than refusing to sign in over a record that can wait.
    USER = Object.assign({uid, status:'active'}, fallback);
  }
  return USER;
}

/* ---- Account creation and sign-in ---------------------------------- */

/* Creating an account is two steps: the Authentication user, then the record
   the rules check. If the second is refused, the first is undone — otherwise
   the address is taken by a user with no record behind it, and every retry
   reports that the email is already in use. */
async function withRollback(cred, work){
  try{ return await work(); }
  catch(e){
    try{ await cred.user.delete(); }catch(_){ /* leave it; sign-in will explain */ }
    throw e;
  }
}

async function cloudRegisterFarm(vals, password, code){
  const { createUserWithEmailAndPassword } = CLOUD.authApi;
  const { doc, setDoc, updateDoc, deleteField } = CLOUD.fs;
  const cred = await createUserWithEmailAndPassword(CLOUD.auth, vals.email, password);
  const uid = cred.user.uid;
  return await withRollback(cred, async ()=>{
    const record = Object.assign(farmDoc(vals), {
      status:'Pending', category:'Pending review', registered:todayStr(),
      crops:[], signupCode:code                   // checked by the rules on create
    });
    await setDoc(doc(CLOUD.db, 'farms', uid), record);
    await updateDoc(doc(CLOUD.db, 'farms', uid), { signupCode: deleteField() });  // not kept
    await setDoc(doc(CLOUD.db, 'harvest', uid), { plan:blankHarvestStore(), actual:blankHarvestStore() });
    CLOUD_STATE.cloudIds.add(uid);
    return uid;
  });
}

async function cloudRegisterOperator(name, email, password, code){
  const { createUserWithEmailAndPassword } = CLOUD.authApi;
  const { doc, setDoc, updateDoc, deleteField } = CLOUD.fs;
  const cred = await createUserWithEmailAndPassword(CLOUD.auth, email, password);
  const uid = cred.user.uid;
  return await withRollback(cred, async ()=>{
    await setDoc(doc(CLOUD.db, 'operators', uid), { name, email, signupCode:code, since:todayStr() });
    await updateDoc(doc(CLOUD.db, 'operators', uid), { signupCode: deleteField() });
    // Only an operator may claim ownership, so the claim comes after the
    // record that proves they are one.
    const owner = await claimOwnership(uid);
    // The first operator owns the association's settings; the rest are
    // Secretariat until an owner decides otherwise. As with a farm, a
    // database on the older rules simply has nowhere to put this yet.
    try{
      await cloudCreateUserDoc(uid, { displayName:name, email,
        role: owner ? 'superAdmin' : 'secretariat', createdBy: uid });
    }catch(e){ /* written at the first sign-in instead */ }
    return uid;
  });
}

/* ---- Moving a local account into the shared database ----------------
   A farm registered while the database was out of reach exists in one
   browser and nowhere else. It signs in there and fails everywhere else,
   which reads as a wrong password. The records are all here, and so are
   the email and password just typed, so the account can be made properly
   without the farm entering anything again but its sign-up code. */
function remapMemberId(oldId, newId){
  if(oldId === newId || !MEMBERS[oldId]) return;
  MEMBERS[newId] = MEMBERS[oldId];           delete MEMBERS[oldId];
  if(harvest[oldId]){ harvest[newId] = harvest[oldId]; delete harvest[oldId]; }
  if(inputsData[oldId]){ inputsData[newId] = inputsData[oldId]; delete inputsData[oldId]; }
  complaints.forEach(c=>{ if(c.member === oldId) c.member = newId; });
  if(state.member === oldId) state.member = newId;
}

async function cloudMigrateFarm(oldId, email, password, code){
  const { createUserWithEmailAndPassword } = CLOUD.authApi;
  const { doc, setDoc, updateDoc, deleteField } = CLOUD.fs;
  const m = MEMBERS[oldId];
  if(!m) throw new Error('That farm is no longer on this device.');
  const cred = await createUserWithEmailAndPassword(CLOUD.auth, email, password);
  const uid = cred.user.uid;
  return await withRollback(cred, async ()=>{
    const record = Object.assign(farmDoc(m), { signupCode: code });
    await setDoc(doc(CLOUD.db, 'farms', uid), record);
    await updateDoc(doc(CLOUD.db, 'farms', uid), { signupCode: deleteField() });
    const h = harvest[oldId] || { plan: blankHarvestStore(), actual: blankHarvestStore() };
    await setDoc(doc(CLOUD.db, 'harvest', uid),
      JSON.parse(JSON.stringify({ plan: h.plan, actual: h.actual, updatedAt: new Date().toISOString() })));
    CLOUD_STATE.cloudIds.add(uid);
    CLOUD_STATE.uid = uid; CLOUD_STATE.email = email; CLOUD_STATE.role = 'farm';
    remapMemberId(oldId, uid);
    return uid;
  });
}

function submitMigration(btn){
  const err = document.getElementById('mig-error');
  const codeEl = document.getElementById('mig-code');
  const passEl = document.getElementById('mig-pass');
  const m = MEMBERS[state.member];
  if(!m){ return; }
  const email = (m.email||'').trim();
  const pass = passEl ? passEl.value : '';
  if(!email){ flagError(err, 'This farm has no email address on its record. Add one on this tab first — the shared database needs it to sign you in.'); return; }
  if(!pass || pass.length < 6){ flagError(err, 'Choose a password of at least six characters. The shared database will not accept a shorter one.'); return; }
  if(btn) btn.classList.add('is-busy');
  err.style.color = 'var(--muted)';
  err.textContent = 'Moving your farm to the shared database…';
  const oldId = state.member;
  withTimeout(cloudMigrateFarm(oldId, email, pass, codeEl ? codeEl.value.trim() : ''), 20000, 'Moving your farm')
    .then(()=>{
      state.localOnly = false;
      state.migrateOpen = false;
      state.migrateMsg = `Your farm is now in the shared database. Sign in on any device with ${email} and the password you just set.`;
      logAction(`${m.name} moved their account into the shared database.`);
      render();
    })
    .catch(e=>{
      if(btn) btn.classList.remove('is-busy');
      reportCloudFailure(err, e);
    });
}

async function cloudSignIn(email, password){
  const { signInWithEmailAndPassword } = CLOUD.authApi;
  const { doc, getDoc } = CLOUD.fs;
  const cred = await signInWithEmailAndPassword(CLOUD.auth, email, password);
  const uid = cred.user.uid;
  // The farm record first, and only then the operator one. Anyone signed in may
  // read their own farm document, but the operator collection is readable by
  // operators alone — so asking that question first refuses every farm at its
  // own sign-in, before the farm record is ever looked at.
  const farm = await getDoc(doc(CLOUD.db, 'farms', uid));
  let role = farm.exists() ? 'farm' : null;
  let op = null;
  if(!role){
    op = await getDoc(doc(CLOUD.db, 'operators', uid));
    role = op.exists() ? 'operator' : 'orphan';   // signed in, but nothing behind it
  }
  CLOUD_STATE.uid = uid;
  CLOUD_STATE.email = email;
  CLOUD_STATE.role = role;
  const name = (op && op.exists()) ? (op.data().name||email) : null;
  // Only an operator carries a role. A farm signs in as a farm, and USER is
  // left empty so nothing on the member side is drawn from a role it does
  // not have. An operator from before roles existed is given Secretariat.
  await loadUserRole(uid, role === 'operator'
    ? { displayName: name || email, email, role:'secretariat' } : null);
  return { uid, role, name };
}

/* ---- Staying signed in ----------------------------------------------
   Firebase keeps the sign-in in this browser already; the page just never
   asked. Reloading therefore looked like being signed out, and every
   refresh meant typing a password again. On start-up the session is picked
   up and the console restored to whoever is actually signed in.

   With no database behind it there is no Firebase session to read, so the
   role and the farm are remembered here instead — the same browser that
   already holds the accounts themselves. */
const SESSION_KEY = 'tipfa.session.v1';

/* Is this a screen that role can actually open? A tab remembered from an
   older build, or one a role has since lost, must not strand somebody on a
   blank page. */
function tabExists(role, key){
  const list = role === 'member' ? MEMBER_TABS : ADMIN_TABS_ALL;
  return list.some(t=> t[0] === key);
}

function rememberSession(){
  try{
    if(!state.loggedIn){ localStorage.removeItem(SESSION_KEY); return; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      role: state.role, member: state.member, adminName: state.adminName,
      tab: state.tab, cloud: !!cloudOn(), at: Date.now()
    }));
  }catch(e){ /* the session simply will not be remembered */ }
}
function forgetSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function storedSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ return null; }
}

function enterSession(role, opts){
  opts = opts || {};
  state.loggedIn = true;
  state.role = role;
  state.rollRead = false;
  /* A member lands on what is waiting for them, not on a form; an operator
     on the association's figures. This used to read `state.tab || 'today'`,
     and state.tab is 'profile' from the moment the page loads — so the
     fallback never ran and everyone landed on the old screen.

     Signing in always goes to the landing tab. Coming back to a browser
     that was already signed in returns to the tab that was open, because
     a refresh in the middle of a job should not lose the job. */
  const landing = role === 'member' ? 'today' : 'dashboard';
  if(role === 'member'){ state.member = opts.member; state.harvestPick = null; }
  else { state.adminName = opts.adminName || 'TIPFA Secretariat operator'; }
  state.tab = opts.resume && tabExists(role, opts.resume) ? opts.resume : landing;
  document.body.setAttribute('data-role', role);
  rememberSession();
}

/* Restore whoever this browser is already signed in as. Firebase answers
   asynchronously, so the page says it is looking rather than showing a
   sign-in form that is about to be replaced. */
async function restoreSession(){
  const saved = storedSession();
  if(!saved) return false;

  if(cloudOn() && CLOUD.authApi && CLOUD.authApi.onAuthStateChanged){
    const user = await new Promise(resolve=>{
      const stop = CLOUD.authApi.onAuthStateChanged(CLOUD.auth, u=>{ stop(); resolve(u); },
                                                    ()=>{ resolve(null); });
      setTimeout(()=> resolve(CLOUD.auth.currentUser || null), 8000);
    });
    if(!user){ forgetSession(); return false; }
    state.restoring = true; render();
    try{
      CLOUD_STATE.uid = user.uid;
      CLOUD_STATE.email = user.email || saved.adminName || '';
      const { doc, getDoc } = CLOUD.fs;
      const farm = await getDoc(doc(CLOUD.db, 'farms', user.uid));
      if(farm.exists()){
        CLOUD_STATE.role = 'farm';
        USER = null;                       // a farm holds no role
        await cloudPullAll(); await cloudPullCatalogue(); await cloudPullSubmissions(); await cloudPullOrders(); await cloudPullTrace(); await cloudPullAdvisory(); await cloudPullInputs();
        enterSession('member', { member: user.uid, resume: saved.tab });
      } else {
        const op = await getDoc(doc(CLOUD.db, 'operators', user.uid));
        if(!op.exists()){ CLOUD_STATE.uid = null; forgetSession(); state.restoring = false; return false; }
        CLOUD_STATE.role = 'operator';
        await loadUserRole(user.uid, { displayName:(op.data()||{}).name||user.email, email:user.email,
                                       role:'secretariat' });
        await cloudPullAll(); await cloudPullCatalogue(); await cloudPullSubmissions(); await cloudPullOrders(); await cloudPullTrace(); await cloudPullAdvisory(); await cloudPullInputs(); await cloudPullOperators();
        enterSession('admin', { adminName: (op.data() || {}).name || user.email, resume: saved.tab });
      }
      state.restoring = false;
      state.lastRefresh = Date.now();
      render();
      return true;
    }catch(e){
      // Being dropped back to a sign-in screen with no explanation is the
      // worst of both: the browser is signed in, the page says otherwise.
      state.restoring = false;
      CLOUD_STATE.uid = null; CLOUD_STATE.role = null;
      state.restoreError = 'Your session could not be restored: ' + ((e && e.message) || e) + ' — please sign in again.';
      forgetSession(); render();
      return false;
    }
  }

  // No database: the browser's own records are all there is, so the session
  // is only restored if the account it names is still here.
  if(saved.cloud) return false;                 // it was a database session; do not fake one
  if(saved.role === 'member' && MEMBERS[saved.member]){
    enterSession('member', { member: saved.member, resume: saved.tab }); render(); return true;
  }
  if(saved.role === 'admin' && ADMINS.length){
    enterSession('admin', { adminName: saved.adminName, resume: saved.tab }); render(); return true;
  }
  forgetSession();
  return false;
}

async function cloudSignOut(){
  if(!cloudOn()) return;
  // A batched write still waiting when the session ends would be sent with
  // nobody signed in. The rules refuse that, so the last edits of the session
  // are lost and the app reports itself offline on the way out. Send it first.
  clearTimeout(CLOUD_STATE.pushTimer);
  const pending = CLOUD_STATE.pendingId;
  CLOUD_STATE.pendingId = null;
  if(pending) await cloudPushFarm(pending);
  try{ await CLOUD.authApi.signOut(CLOUD.auth); }catch(e){ /* already out */ }
  CLOUD_STATE.uid = null; CLOUD_STATE.role = null; CLOUD_STATE.email = null;
  USER = null;
}

async function cloudResetEmail(email){
  if(!cloudOn()) throw new Error('offline');
  await CLOUD.authApi.sendPasswordResetEmail(CLOUD.auth, email);
}

/* A refused write has three possible causes that Firestore reports
   identically. Two documents in the rules exist only to be read here, so the
   platform can name the real one instead of listing all three at the farmer.
      diagnostics/rules-published  readable always -> the rules are published
      diagnostics/codes-present    readable only when settings/signup exists
   Neither document is ever created, and a read of a document that is not
   there returns nothing, so this cannot expose a code. */
async function cloudDiagnoseDenied(){
  if(!cloudOn()) return null;
  const { doc, getDoc } = CLOUD.fs;
  const readable = async id => {
    try{ await getDoc(doc(CLOUD.db, 'diagnostics', id)); return true; }
    catch(_){ return false; }
  };
  if(!await readable('rules-published'))
    return 'The database is still running Firebase\u2019s own default rules. Open Firestore Database \u2192 Rules in the console, replace everything with the contents of firestore.rules from the site\u2019s code, and press Publish.';
  if(!await readable('codes-present'))
    return 'The rules are published, but the document holding the sign-up codes is missing. In Firestore Database, add a collection named settings with a document named signup, and give it two text fields: operatorCode and farmCode.';
  return 'The sign-up code does not match the one in the database. Check settings \u2192 signup in Firestore: the fields must be named exactly operatorCode and farmCode, and the value must match what you typed, including capital letters.';
}

/* Show the plain wording at once, then replace it with the diagnosed cause
   as soon as the probes come back, so the form is never silent while it asks. */
function reportCloudFailure(el, e){
  if(!el) return;
  const code = (e && e.code) || '';
  flagError(el, cloudErrorText(e) + (code ? ` [${code}]` : ''));
  if(!code.includes('permission-denied')) return;
  cloudDiagnoseDenied()
    .then(text=>{ if(text) flagError(el, text); })
    .catch(()=>{ /* keep the plain wording */ });
}

// Firebase's own wording is not written for farmers; say what went wrong.
function cloudErrorText(e){
  const code = (e && e.code) || '';
  if(code.includes('email-already-in-use')) return 'An account already uses that email address. Try signing in, or use Forgotten your password.';
  if(code.includes('invalid-email')) return 'That email address does not look right.';
  if(code.includes('weak-password')) return 'Choose a longer password — at least six characters.';
  if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'That email and password do not match an account.';
  if(code.includes('user-not-found')) return 'No account uses that email address.';
  if(code.includes('too-many-requests')) return 'Too many attempts. Wait a few minutes and try again.';
  if(code.includes('network')) return 'No connection to the database. Check the network and try again.';
  if(code.includes('permission-denied') || /insufficient permissions/i.test(String(e && e.message))){
    // The sign-up forms replace this with the identified cause; everywhere else
    // the honest answer is to run the check, which names what is wrong.
    return 'The database refused that request. Run the connection check on the sign-in screen — it names exactly what is wrong.';
  }
  return (e && e.message) ? e.message : 'Something went wrong. Try again.';
}

/* ============================================================
   Storage
   Farms, their records and their submissions are kept in this
   browser so an account survives a reload. This is per-browser,
   not a server: a farm registered on one device is not visible
   on another.
   ============================================================ */
// Nothing is written until the stored register has been read back, so the
// startup log entry cannot overwrite a saved one with an empty register.
let storeReady = false;
function saveMembers(){
  if(!storeReady) return;
  try{
    localStorage.setItem(MEMBER_STORE_KEY, JSON.stringify({
      members: MEMBERS, harvest: harvest, inputs: inputsData,
      complaints: complaints, nextComplaintId: nextComplaintId,
      orders: ORDERS, allocs: ALLOCS,
      batches: BATCHES, inputApps: INPUTAPP, consignments: CONSIGN, lotIssues: LOTISSUES,
      cases: CASES, knowledge: KNOWLEDGE,
      inputRequests: INPUT_REQUESTS, inputSuggestions: INPUT_SUGGESTIONS
    }));
  }catch(e){ /* storage full or unavailable — the session still works */ }
}
function loadMembers(){
  try{
    const raw = localStorage.getItem(MEMBER_STORE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.members || typeof d.members !== 'object') return;
    /* falls through to restore the stored register */
    MEMBERS = d.members;
    harvest = d.harvest || {};
    inputsData = d.inputs || {};
    complaints = Array.isArray(d.complaints) ? d.complaints : [];
    nextComplaintId = d.nextComplaintId || (complaints.length + 1);
    ORDERS = Array.isArray(d.orders) ? d.orders : [];
    ALLOCS = Array.isArray(d.allocs) ? d.allocs : [];
    BATCHES = Array.isArray(d.batches) ? d.batches : [];
    INPUTAPP = Array.isArray(d.inputApps) ? d.inputApps : [];
    CONSIGN = Array.isArray(d.consignments) ? d.consignments : [];
    LOTISSUES = Array.isArray(d.lotIssues) ? d.lotIssues : [];
    CASES = Array.isArray(d.cases) ? d.cases : [];
    KNOWLEDGE = Array.isArray(d.knowledge) ? d.knowledge : [];
    INPUT_REQUESTS = Array.isArray(d.inputRequests) ? d.inputRequests : [];
    INPUT_SUGGESTIONS = Array.isArray(d.inputSuggestions) ? d.inputSuggestions : [];
    // Backfill anything a stored record predates, so an older save still opens.
    Object.keys(MEMBERS).forEach(id=>{
      const m = MEMBERS[id];
      if(!Array.isArray(m.crops)) m.crops = [];
      m.crops.forEach(cr=>{
        if(cr.stage === 'Sowing') cr.stage = 'Transplanting';   // stage list no longer starts at sowing
        ensureProgramme(cr);
      });
      if(!Array.isArray(m.marketStandards)) m.marketStandards = [];
      if(!Array.isArray(m.marketPrices)) m.marketPrices = [];
      // Prices used to carry only a date; derive the year, month and week.
      m.marketPrices.forEach(p=>{
        if(p.year && p.month) return;
        const d = p.date ? new Date(p.date + 'T00:00:00') : null;
        if(d && !isNaN(d.getTime())){
          p.year = d.getFullYear(); p.month = d.getMonth()+1; p.week = weekOfMonth(d);
        } else {
          p.year = CURRENT_YEAR; p.month = CURRENT_MONTH; p.week = 1;
        }
      });
      if(!m.investments) m.investments = blankInvestments();
      if(!m.futurePlan) m.futurePlan = { year1:'', year2:'', year3:'' };
      if(!harvest[id]) harvest[id] = { plan: blankHarvestStore(), actual: blankHarvestStore() };
      // Figures saved before harvests were held per year sit directly under
      // month numbers; move them under the year they were recorded in.
      ['plan','actual'].forEach(kind=>{
        const store = harvest[id][kind];
        const keys = Object.keys(store||{});
        if(keys.length && keys.every(k=> Number(k) >= 1 && Number(k) <= 12)){
          harvest[id][kind] = { [CURRENT_YEAR]: store };
        }
      });
      if(!inputsData[id]) inputsData[id] = { weekly:blankPeriod(INPUTS,0), monthly:blankPeriod(INPUTS,0), annual:blankPeriod(INPUTS,0) };
    });
  }catch(e){ /* unreadable store — start empty rather than fail to load */ }
  finally{ storeReady = true; }
}

// Administrator accounts are kept in the browser so an account created here
// still works after a page reload. Falls back to memory only if storage is blocked.
let ADMINS = loadAdmins();
function loadAdmins(){
  try{
    const raw = localStorage.getItem(ADMIN_STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed;
    }
  }catch(e){ /* storage unavailable — fall through to an empty register */ }
  return DEFAULT_ADMINS.map(a=>Object.assign({}, a));
}
function saveAdmins(){
  try{ localStorage.setItem(ADMIN_STORE_KEY, JSON.stringify(ADMINS)); }catch(e){ /* not persisted */ }
}
function norm(s){ return (s||'').toString().trim().toLowerCase().replace(/\s+/g,''); }

/* ============================================================
   Farm logo placement
   Each member farm's mark is loaded from assets/farms/, named
   after the farm itself — "She Farms" -> assets/farms/she-farms.png.
   Drop a farm's file in with that name and it appears everywhere
   the farm is shown. Until then the monogram stands in, so a
   missing file never breaks a layout.
   ============================================================ */
const FARM_LOGO_DIR = 'assets/farms/';
const FARM_LOGO_EXT = '.png';
function farmLogoSlug(name){
  return (name||'').toLowerCase().trim()
    .replace(/&/g,'and')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
}
function farmLogoSrc(m){
  if(!m) return '';
  if(m.avatar) return m.avatar;                   // the farm's own uploaded image
  if(m.logo) return m.logo;                       // explicit file override
  return FARM_LOGO_DIR + farmLogoSlug(m.name) + FARM_LOGO_EXT;
}

/* A farm's profile image is its logo: it is shown wherever the farm appears.
   The picture is squared off and scaled down before it is stored, so a photo
   straight off a phone does not fill up the browser's storage. */
const AVATAR_PX = 320;
function readImageAsLogo(file, done, fail){
  if(!file){ fail && fail('Choose an image file.'); return; }
  if(!/^image\//.test(file.type)){ fail && fail('That file is not an image.'); return; }
  const reader = new FileReader();
  reader.onerror = ()=> fail && fail('That image could not be read.');
  reader.onload = ()=>{
    const img = new Image();
    img.onerror = ()=> fail && fail('That image could not be opened.');
    img.onload = ()=>{
      const side = Math.min(img.width, img.height);
      const cv = document.createElement('canvas');
      cv.width = cv.height = AVATAR_PX;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
      // PNG keeps a transparent logo transparent; a photo is fine either way.
      done(cv.toDataURL('image/png'));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function farmInitials(name){
  const words = (name||'').split(/\s+/).filter(Boolean);
  if(!words.length) return '—';
  if(words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[words.length-1][0]).toUpperCase();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// size: '' | 'sm' | 'lg' | 'xl'
function farmLogo(m, size){
  if(!m) return '';
  const cls = 'farm-logo' + (size ? ' '+size : '');
  return `<span class="${cls}" title="${esc(m.name)}">
    <img src="${esc(farmLogoSrc(m))}" alt="${esc(m.name)} logo" loading="lazy"
         onerror="this.closest('.farm-logo').classList.add('is-missing'); this.remove();">
    <span class="farm-initials">${esc(farmInitials(m.name))}</span>
  </span>`;
}
function farmCell(m, size){
  return `<span class="farm-cell">${farmLogo(m, size||'sm')}<span class="fname">${esc(m.name)}</span></span>`;
}

/* ============================================================
   Motion
   Entrance, transition and feedback motion for the whole app.
   The logo lockup is only ever moved or scaled as one object —
   its parts are never animated out of position (guidelines p11).
   Everything here yields to prefers-reduced-motion via the CSS.
   ============================================================ */
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Stagger direct children of a freshly rendered container.
function staggerIn(container, selector){
  if(!container) return;
  const nodes = container.querySelectorAll(selector || ':scope > .card, :scope > .grid2, :scope > .grid3, :scope > .grid4, :scope > .section-label, :scope > .chips, :scope > .msg-banner');
  nodes.forEach((n,i)=>{
    n.classList.add('reveal');
    if(i < 8) n.classList.add('reveal-'+(i+1));
  });
}

// Reveal cards as they scroll into view.
let scrollObserver = null;
function observeScrollReveals(container){
  if(REDUCED_MOTION || !('IntersectionObserver' in window)) return;
  if(!scrollObserver){
    scrollObserver = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('seen'); scrollObserver.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -40px 0px', threshold:.05});
  }
  const cards = container.querySelectorAll('.card');
  cards.forEach((c,i)=>{
    if(i < 4) return;                    // the first screenful uses the entrance stagger
    c.classList.add('onscroll');
    scrollObserver.observe(c);
  });
}

// Count metric values up from zero.
function animateCounters(container){
  container.querySelectorAll('[data-count]').forEach(el=>{
    const target = Number(el.getAttribute('data-count'))||0;
    const suffix = el.getAttribute('data-suffix')||'';
    if(REDUCED_MOTION || !target){ el.textContent = fmt(target)+suffix; return; }
    const dur = 900, start = performance.now();
    function tick(now){
      const p = Math.min(1,(now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = fmt(Math.round(target*eased))+suffix;
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

// Ripple feedback on every button press.
document.addEventListener('click', function(e){
  const btn = e.target.closest('.btn');
  if(!btn || REDUCED_MOTION) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = d+'px';
  span.style.left = (e.clientX - r.left - d/2)+'px';
  span.style.top = (e.clientY - r.top - d/2)+'px';
  btn.appendChild(span);
  setTimeout(()=>span.remove(), 640);
});

// Shake a field-level error into view.
function flagError(el, message){
  if(!el) return;
  el.textContent = message;
  const box = el.closest('.card') || el;
  box.classList.remove('err-shake');
  void box.offsetWidth;                  // restart the animation
  box.classList.add('err-shake');
  setTimeout(()=>box.classList.remove('err-shake'), 500);
}

// Arc curtain used when crossing between signed-out and signed-in.
function curtainTransition(midpoint){
  if(REDUCED_MOTION){ midpoint(); return; }
  const c = document.createElement('div');
  c.className = 'curtain in';
  document.body.appendChild(c);
  setTimeout(()=>{
    midpoint();
    c.className = 'curtain out';
    setTimeout(()=>c.remove(), 460);
  }, 420);
}

/* Line icons: 1.5 stroke, rounded caps and joins, 24px grid (guidelines p17) */

}

/* ---- Date field ----------------------------------------------------
   The native date input is a different control on every device, and on a
   phone it hides the year behind a spinner. This is one calendar
   everywhere: a month grid, arrows for the month, arrows for the year, and
   a year that can be typed. No range is imposed, so a season can be
   recorded in any year a farm needs.
   The real value still lives in a hidden input of the same id, so
   everything that reads these fields is untouched. */
const DATE_STATE = {};   // id -> the month currently on show

function dateField(id, value, onchange){
  return `<div class="datefield" id="${id}-wrap">
    <input type="hidden" id="${id}" value="${esc(value||'')}" data-onchange="${esc(onchange||'')}">
    <button type="button" class="date-trigger" onclick="openDatePicker('${id}')" aria-haspopup="dialog">
      <span class="dt-icon" aria-hidden="true">${lineIcon('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>')}</span>
      <span class="dt-text" id="${id}-label">${value ? esc(prettyDate(value)) : 'Choose a date'}</span>
      ${value ? `<span class="dt-clear" title="Clear" onclick="event.stopPropagation();clearDate('${id}')">&times;</span>` : ''}
    </button>
    <div class="datepop" id="${id}-pop" role="dialog" aria-label="Choose a date" hidden></div>
  </div>`;
}

function prettyDate(iso){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function isoOf(y, m, d){
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

/* The calendar is moved to the end of the page and positioned against the
   trigger. Left where it was written it is cut off by the first ancestor
   that scrolls — the crop table's card does — and half the month disappears
   behind an edge. Nothing else in the page can clip it from here. */
function placeDatePicker(id){
  const pop = document.getElementById(id+'-pop');
  const trigger = document.querySelector(`#${id}-wrap .date-trigger`);
  if(!pop || !trigger) return;
  const r = trigger.getBoundingClientRect();
  const w = pop.offsetWidth || 290, h = pop.offsetHeight || 330;
  const gap = 8;
  let top = r.bottom + gap;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - gap);
  let left = r.left;
  if(left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - w - 8);
  pop.style.top = top + 'px';
  pop.style.left = left + 'px';
  pop.style.width = Math.min(Math.max(r.width, 290), window.innerWidth - 16) + 'px';
}

function closeAllDatePickers(){
  document.querySelectorAll('.datepop').forEach(p=>{ p.classList.remove('open'); p.hidden = true; });
}

function openDatePicker(id){
  const pop = document.getElementById(id+'-pop');
  if(!pop) return;
  const wasOpen = !pop.hidden;
  closeAllDatePickers();
  if(wasOpen) return;
  if(pop.parentNode !== document.body) document.body.appendChild(pop);
  const cur = document.getElementById(id).value;
  const base = cur ? new Date(cur + 'T00:00:00') : new Date();
  DATE_STATE[id] = { y: base.getFullYear(), m: base.getMonth() + 1 };
  drawDatePicker(id);
  pop.hidden = false;
  placeDatePicker(id);
  requestAnimationFrame(()=>{ placeDatePicker(id); pop.classList.add('open'); });
}
// A page that scrolls or resizes under an open calendar must take it along.
['scroll','resize'].forEach(ev=> window.addEventListener(ev, ()=>{
  document.querySelectorAll('.datepop:not([hidden])').forEach(p=> placeDatePicker(p.id.replace(/-pop$/,'')));
}, true));

function stepDateMonth(id, by){
  const st = DATE_STATE[id]; if(!st) return;
  let m = st.m + by, y = st.y;
  while(m < 1){ m += 12; y--; }
  while(m > 12){ m -= 12; y++; }
  st.m = m; st.y = y;
  drawDatePicker(id);
}
function stepDateYear(id, by){
  const st = DATE_STATE[id]; if(!st) return;
  st.y += by;
  drawDatePicker(id);
}
function setDateYear(id, value){
  const st = DATE_STATE[id]; if(!st) return;
  const y = parseInt(value, 10);
  if(!isNaN(y) && y > 0 && y < 9999){ st.y = y; drawDatePicker(id); }
}

function drawDatePicker(id){
  const pop = document.getElementById(id+'-pop');
  const st = DATE_STATE[id];
  if(!pop || !st) return;
  const chosen = document.getElementById(id).value;
  const first = new Date(st.y, st.m - 1, 1);
  const lead = (first.getDay() + 6) % 7;          // weeks start on Monday
  const days = new Date(st.y, st.m, 0).getDate();
  const today = new Date();
  const todayIso = isoOf(today.getFullYear(), today.getMonth()+1, today.getDate());
  const cells = [];
  for(let i = 0; i < lead; i++) cells.push('<span class="dp-cell blank"></span>');
  for(let d = 1; d <= days; d++){
    const iso = isoOf(st.y, st.m, d);
    const cls = ['dp-cell'];
    if(iso === chosen) cls.push('chosen');
    if(iso === todayIso) cls.push('today');
    cells.push(`<button type="button" class="${cls.join(' ')}" style="animation-delay:${d*7}ms" onclick="pickDate('${id}','${iso}')">${d}</button>`);
  }
  pop.innerHTML = `
    <div class="dp-head">
      <button type="button" class="dp-nav" onclick="stepDateYear('${id}',-1)" title="Previous year">&laquo;</button>
      <button type="button" class="dp-nav" onclick="stepDateMonth('${id}',-1)" title="Previous month">&lsaquo;</button>
      <span class="dp-title">${MONTHS[st.m-1]}
        <input class="dp-year" type="number" value="${st.y}" onchange="setDateYear('${id}', this.value)"
               onclick="event.stopPropagation();" aria-label="Year"></span>
      <button type="button" class="dp-nav" onclick="stepDateMonth('${id}',1)" title="Next month">&rsaquo;</button>
      <button type="button" class="dp-nav" onclick="stepDateYear('${id}',1)" title="Next year">&raquo;</button>
    </div>
    <div class="dp-dow">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="dp-grid">${cells.join('')}</div>
    <div class="dp-foot">
      <button type="button" class="btn small ghost" onclick="pickDate('${id}','${todayIso}')">Today</button>
      <button type="button" class="btn small ghost" onclick="clearDate('${id}')">Clear</button>
    </div>`;
}

/* Stepping the month or year redraws the calendar, which detaches the button
   that was clicked. By the time the click reaches the document that node has

/* This device is not talking to the shared database, so the only accounts it
   can check are the ones made on it. Say that, rather than reporting a
   password as wrong — the account is very likely fine and simply elsewhere. */
function offlineSignInText(knownHere, noneHere){
  const why = CLOUD.detail ? ` (${CLOUD.detail})` : '';
  const head = `This device cannot reach the shared database${why}`;
  if(knownHere)
    return `${head}, so it checked only the copy stored here, and that password does not match it. If you changed your password on another device, reconnect and try again — run the connection check below.`;
  if(noneHere)
    return `${head}, so it cannot see accounts created elsewhere, and no account has been made on this device yet. Run the connection check below, or create an account here.`;
  return `${head}, so it cannot see accounts created on other devices. Run the connection check below; until it passes, only accounts made on this device can sign in here.`;
}

async function doMemberLogin(btn){
  const raw = document.getElementById('login-id').value.trim();
  const identifier = norm(raw);
  const password = document.getElementById('login-password').value.trim();
  if(!identifier || !password){ flagError(document.getElementById('login-error'), 'Enter your phone number/email and password.'); return; }

  // With the database reachable, the account lives there and works on any device.
  if(cloudOn() && looksLikeEmail(raw)){
    if(btn) btn.classList.add('is-busy');
    try{
      const who = await cloudSignIn(raw, password);
      await cloudPullAll();
      await cloudPullCatalogue();
      await cloudPullSubmissions();
      await cloudPullOperators();
      if(btn) btn.classList.remove('is-busy');
      if(who.role === 'operator'){
        flagError(document.getElementById('login-error'), 'That is an operator account — sign in on the Administrator tab.');
        await cloudSignOut();
        return;
      }
      if(who.role === 'orphan'){
        await cloudSignOut();
        flagError(document.getElementById('login-error'),
          'That email and password are correct, but no farm record is attached to them — the registration did not finish. Register again, or ask the Secretariat to check.');
        return;
      }
      curtainTransition(()=>{
        state.tab = 'profile'; state.forgotMsg = ''; state.localOnly = false;
        enterSession('member', { member: who.uid });
        state.lastRefresh = Date.now();
        document.body.setAttribute('data-role','member');
        logAction(`${(MEMBERS[who.uid]||{}).name || raw} signed in.`);
        render();
      });
      return;
    }catch(e){
      if(btn) btn.classList.remove('is-busy');
      // An account made before the database existed still signs in locally.
      const localHit = Object.entries(MEMBERS).find(([id,m]) =>
        m.status!=='Rejected' && m.password===password && (norm(m.phone)===identifier || norm(m.email)===identifier));
      if(!localHit){ flagError(document.getElementById('login-error'), cloudErrorText(e)); return; }
    }
  }
  const match = Object.entries(MEMBERS).find(([id,m]) =>
    m.status!=='Rejected' && m.password===password && (norm(m.phone)===identifier || norm(m.email)===identifier));
  if(!match){
    const known = Object.entries(MEMBERS).find(([id,m]) => norm(m.phone)===identifier || norm(m.email)===identifier);
    // Without the database this device can only check accounts made on it.
    // Calling a password wrong when the account was never visible here is the
    // most misleading thing the sign-in screen can say.
    if(!cloudOn()){
      flagError(document.getElementById('login-error'), offlineSignInText(!!known, Object.keys(MEMBERS).length === 0));
      return;
    }
    flagError(document.getElementById('login-error'),
      known ? (known[1].status==='Rejected'
                ? 'That registration was not approved. Contact the Secretariat on 0744 443 247.'
                : 'That password does not match this account.')
            : 'No account matches that phone number or email. Register your farm below.');
    return;
  }
  const [id] = match;
  // Signed in from this browser's own copy. If the database is reachable and
  // has no account for this farm, it exists here and nowhere else — which is
  // exactly why the same details fail on another device.
  state.localOnly = cloudOn() && !isCloudFarm(id);
  signInTransition(btn, ()=>{
    state.tab = 'profile'; state.forgotMsg = '';
    enterSession('member', { member: id });
    logAction(`${MEMBERS[id].name} signed in.`);
    render();
  });
}

// Brief working state on the button, then an arc curtain across the change of context.
function signInTransition(btn, done){
  if(btn) btn.classList.add('is-busy');
  setTimeout(()=>{
    if(btn) btn.classList.remove('is-busy');
    curtainTransition(done);
  }, REDUCED_MOTION ? 0 : 260);
}
async function doAdminLogin(btn){
  const identifier = norm(document.getElementById('login-user').value);
  const password = document.getElementById('login-pass').value.trim();
  if(!identifier || !password){ flagError(document.getElementById('login-error-admin'), 'Enter your operator ID and password.'); return; }
  const raw = document.getElementById('login-user').value.trim();
  if(cloudOn() && looksLikeEmail(raw)){
    if(btn) btn.classList.add('is-busy');
    try{
      const who = await cloudSignIn(raw, password);
      if(who.role !== 'operator'){
        await cloudSignOut();
        if(btn) btn.classList.remove('is-busy');
        flagError(document.getElementById('login-error-admin'), who.role === 'orphan'
          ? 'That email and password are correct, but this account has no operator record — the sign-up did not finish. Create the account again with the operator code.'
          : 'That is a farm account — sign in on the Farm member tab.');
        return;
      }
      await cloudPullAll();
      await cloudPullCatalogue();
      await cloudPullSubmissions();
      await cloudPullOperators();
      if(btn) btn.classList.remove('is-busy');
      curtainTransition(()=>{
        state.tab = 'members'; state.adminSignupMsg = ''; state.adminSignupUser = ''; state.forgotMsg = '';
        enterSession('admin', { adminName: who.name || raw });
        state.lastRefresh = Date.now();
        logAction(`Operator ${state.adminName} signed in to the administrator console.`);
        render();
      });
      return;
    }catch(e){
      if(btn) btn.classList.remove('is-busy');
      const localOk = ADMINS.some(a=>{ const u=norm(a.username); return (identifier===u||identifier===u.split('@')[0]) && a.password===password; });
      if(!localOk){ flagError(document.getElementById('login-error-admin'), cloudErrorText(e)); return; }
    }
  }
  // Falling back to this browser's own list. It signs in and the console
  // fills, but the database has never heard of the account — so everything
  // written from here is refused, and until now nothing said so until an
  // order had already been placed with nobody.
  const match = ADMINS.find(a => {
    const u = norm(a.username), local = u.split('@')[0];
    return (identifier===u || identifier===local) && a.password===password;
  });
  if(match && cloudOn()){
    state.identityGap = 'local';
    state.orderError = `You are signed in on this device, but not to the shared database — ${looksLikeEmail(raw) ? 'that email and password were not accepted by it' : 'you signed in with an operator ID rather than the email address on the account'}. Anything you record will stay on this phone or computer, and no member will see it. Sign in with the email address the operator account was created with.`;
  }
  if(!match){
    flagError(document.getElementById('login-error-admin'),
      !cloudOn() ? offlineSignInText(ADMINS.length > 0, ADMINS.length === 0)
      : ADMINS.length ? 'Invalid operator ID or password.'
                      : 'No administrator account exists in this browser yet. Create one below, or restore a backup from the device that has your records.');
    return;
  }
  signInTransition(btn, ()=>{
    state.tab = 'members'; state.adminSignupMsg = ''; state.adminSignupUser = ''; state.forgotMsg = '';
    enterSession('admin', { adminName: match.name });
    logAction(`Operator ${match.name} signed in to the administrator console.`);
    render();
  });
}
function logout(){
  logAction(`${state.role==='member' ? MEMBERS[state.member].name : (state.adminName||'Operator')} signed out.`);
  forgetSession();
  cloudSignOut();
  curtainTransition(()=>{
    state.loggedIn = false; state.role = null; state.rollRead = false;
    forgetSession();
    document.body.removeAttribute('data-role');
    render();
  });
}

function toggleRegister(v){ state.showRegister = v; state.regSuccess = false; state.forgot = null; delete pendingLogos.reg; state.regAvatar=''; renderLogin(); }

function toggleAdminSignup(v){ state.adminSignup = v; state.adminSignupMsg = ''; state.forgot = null; renderLogin(); }

function submitAdminSignup(){
  const err = document.getElementById('asignup-error');
  const name = document.getElementById('asignup-name').value.trim();
  const user = document.getElementById('asignup-user').value.trim();
  const pass = document.getElementById('asignup-pass').value;
  const pass2 = document.getElementById('asignup-pass2').value;
  const codeEl = document.getElementById('asignup-code');
  if(!name || !user || !pass){
    flagError(err, 'Enter your full name, the operator ID you want, and a password.'); return;
  }
  // Offline, the code is checked against this device's stored setting. Online,
  // the security rules check it against the database — checking here as well
  // would reject a valid code whenever the two are not identical.
  if(!cloudOn() && adminCode() && (!codeEl || codeEl.value.trim() !== adminCode())){
    flagError(err, 'That Secretariat sign-up code is not correct.'); return;
  }
  if(pass.length < 6){
    flagError(err, 'Choose a password of at least 6 characters.'); return;
  }
  if(pass !== pass2){
    flagError(err, 'Passwords do not match.'); return;
  }
  const u = norm(user), local = u.split('@')[0];
  if(ADMINS.some(a=>{ const au = norm(a.username); return au===u || au.split('@')[0]===local; })){
    flagError(err, 'That operator ID is already in use.'); return;
  }
  if(ADMINS.length >= MAX_ADMINS){
    flagError(err, `All ${MAX_ADMINS} administrator seats are taken — an existing operator must remove one first.`); return;
  }
  if(cloudOn() && looksLikeEmail(user)){
    const btn = document.querySelector('button.gold[onclick*="submitAdminSignup"]');
    if(btn) btn.classList.add('is-busy');
    err.style.color = 'var(--muted)';
    err.textContent = 'Creating the account…';
    withTimeout(cloudRegisterOperator(name, user, pass, codeEl ? codeEl.value.trim() : ''), 20000, 'Creating the account')
      .then(()=>{
        logAction(`${name} created an administrator account as operator ${user}.`);
        state.adminSignup = false;
        state.adminSignupUser = user;
        state.adminSignupMsg = 'Administrator account created — sign in below with your new operator ID and password.';
        renderLogin();
      })
      .catch(e=>{
        if(btn) btn.classList.remove('is-busy');
        // The code as well as the wording, so a fault can be reported exactly.
        reportCloudFailure(err, e);
      });
    return;
  }
  ADMINS.push({name, username:user, password:pass});
  saveAdmins();
  logAction(`${name} created their own administrator account (self sign-up) as operator ${user}.`);
  state.adminSignup = false;
  state.adminSignupUser = user;
  state.adminSignupMsg = 'Administrator account created — sign in below with your new operator ID and password.';
  renderLogin();
}

/* Email is the account identity: it is what Firebase Authentication signs a
   farm in with, and what a password-reset message is sent to. It is therefore
   required and checked for shape, not merely stored if offered. */
function looksLikeEmail(v){
  const t = String(v||'').trim();
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t);
}

function submitSelfRegistration(){
  const vals = readProfileFields('reg');
  const pass = document.getElementById('reg-password').value;
  const pass2 = document.getElementById('reg-password2').value;
  const codeEl = document.getElementById('reg-code');
  // Same here: online the rules are the authority on the code.
  if(!cloudOn() && farmCode() && (!codeEl || codeEl.value.trim() !== farmCode())){
    flagError(document.getElementById('reg-error'),
      'That membership code is not correct. The Secretariat issues it — call 0744 443 247 if you do not have one.');
    return;
  }
  if(!vals.name || !vals.contact || !vals.phone){
    flagError(document.getElementById('reg-error'), 'Farm name, contact person, and phone number are required.');
    return;
  }
  if(!vals.email){
    flagError(document.getElementById('reg-error'), 'An email address is required — it is what you sign in with and where a password reset is sent.');
    return;
  }
  if(!looksLikeEmail(vals.email)){
    flagError(document.getElementById('reg-error'), 'That email address does not look right. Check it and try again.');
    return;
  }
  if(!pass || pass.length < 4){
    flagError(document.getElementById('reg-error'), 'Choose a password of at least 4 characters.');
    return;
  }
  if(pass !== pass2){
    flagError(document.getElementById('reg-error'), 'Passwords do not match.');
    return;
  }
  if(findMemberByLogin(vals.phone) || (vals.email && findMemberByLogin(vals.email))){
    flagError(document.getElementById('reg-error'), 'A farm is already registered with that phone number or email.');
    return;
  }
  if(cloudOn()){
    const btnErr = document.getElementById('reg-error');
    btnErr.style.color = 'var(--muted)';
    btnErr.textContent = 'Registering your farm…';
    withTimeout(cloudRegisterFarm(vals, pass, codeEl ? codeEl.value.trim() : ''), 20000, 'Registering your farm')
      .then(uid=>{
        MEMBERS[uid] = Object.assign({}, vals, {
          password: pass, category:'Pending review', registered: todayStr(), status:'Pending',
          crops:[], avatar: state.regAvatar || ''
        });
        createBlankRecords(uid);
        logAction(`${vals.name} registered on the platform — membership pending Secretariat review.`);
        state.regAvatar = ''; state.showRegister = false; state.regSuccess = true;
        renderLogin();
      })
      .catch(e=> reportCloudFailure(btnErr, e));
    return;
  }
  const id = slugify(vals.name);
  // The account is usable straight away, so a new farm can build out its own
  // profile at once. The Secretariat still reviews it — the membership stays
  // Pending in Member management until an operator approves it.
  MEMBERS[id] = Object.assign({}, vals, {
    password: pass, category:'Pending review', registered: todayStr(), status:'Pending',
    crops:[], avatar: state.regAvatar || ''
  });
  createBlankRecords(id);
  logAction(`${vals.name} registered on the platform (self sign-up) — membership pending Secretariat review.`);
  state.regAvatar = '';
  state.showRegister = false; state.regSuccess = true;
  renderLogin();
}

// Match a member by phone or email, the two things a farm signs in with.
function findMemberByLogin(identifier){
  const t = norm(identifier);
  if(!t) return null;
  const hit = Object.entries(MEMBERS).find(([id,m]) => norm(m.phone)===t || norm(m.email)===t);
  return hit ? hit[0] : null;
}

/* ============================================================
   Password reset
   There is no mail server behind this prototype, so a reset is done
   in the browser against details only the account holder should
   know: a farm proves itself with both the phone number and the
   email on its record, an operator with their ID and the Secretariat
   sign-up code. Every reset is written to the audit log.
   ============================================================ */
function showForgot(which){ state.forgot = which; state.forgotMsg = ''; state.regSuccess = false; state.adminSignupMsg = ''; renderLogin(); }

/* With the database in use, a password belongs to Firebase Authentication and
   nothing in this page can change it. Asking for a new one here and then
   emailing a link as well gave two ways to reset that disagreed: the password
   typed in never took effect. So there is one way — the emailed link. */
function submitResetLink(btn){
  const err = document.getElementById('fp-error');
  const typed = document.getElementById('fp-link-email').value.trim();
  if(!typed || !looksLikeEmail(typed)){ flagError(err, 'Enter the email address on your account.'); return; }
  if(btn) btn.classList.add('is-busy');
  err.style.color = 'var(--muted)';
  err.textContent = 'Sending the link…';
  withTimeout(cloudResetEmail(typed), 20000, 'Sending the reset link')
    .then(()=>{
      state.forgot = null; state.regSuccess = false; state.adminSignupMsg = '';
      state.forgotMsg = `A reset link has been sent to ${typed}. Open it, set your new password there, then come back and sign in with it.`;
      logAction(`A password reset link was sent to ${typed}.`);
      renderLogin();
    })
    .catch(e=>{
      if(btn) btn.classList.remove('is-busy');
      flagError(err, cloudErrorText(e));
    });
}

/* ============================================================
   Connection check
   Reachable from the sign-in screen, because the most likely time to
   need it is when nobody can sign in. Each step reports what actually
   happened, including the raw error, so a problem can be described
   rather than guessed at.
   ============================================================ */
function showDiagnostics(v){ state.diagnostics = v; state.diagLines = state.diagLines || []; renderLogin(); }

async function runConnectionCheck(){
  const out = [];
  const push = (label, ok, detail)=>{
    out.push({label, ok, detail: detail||''});
    state.diagLines = out;
    renderLogin();
  };

  const cfg = window.TIPFA_FIREBASE_CONFIG;
  push('Project settings loaded', !!(cfg && cfg.projectId), cfg && cfg.projectId ? `project ${cfg.projectId}` : 'firebase-config.js did not load — the page may be a cached older copy. Hard-refresh with Ctrl+Shift+R.');
  if(!cfg || !cfg.projectId) return;

  let sdk = null;
  try{
    sdk = await import(CLOUD_SDK + 'firebase-app.js');
    push('Firebase software downloaded', true, 'loaded from Google');
  }catch(e){
    push('Firebase software downloaded', false, 'Could not download it: ' + (e.message||e) + '. Usually no internet, or a network that blocks Google.');
    return;
  }

  let db = null, auth = null;
  try{
    const fs = await import(CLOUD_SDK + 'firebase-firestore.js');
    const au = await import(CLOUD_SDK + 'firebase-auth.js');
    const app = sdk.initializeApp(cfg, 'diagnostic-' + Date.now());
    db = fs.getFirestore(app);
    auth = au.getAuth(app);
    push('Connected to the project', true, cfg.projectId);
    try{
      // Rules refuse this read when nobody is signed in. Being refused is the
      // good answer: it proves the database exists and the rules are live.
      // The id must not match Firestore's reserved __...__ pattern, or the SDK
      // rejects it locally with invalid-argument and never reaches the server.
      await fs.getDoc(fs.doc(db, 'farms', 'connection-check'));
      push('Database answering', true, 'reachable, and it allowed the check');
    }catch(e){
      const msg = String(e && (e.code || e.message) || e);
      if(/permission|insufficient/i.test(msg)){
        push('Database answering', true, 'reachable — it refused an unauthenticated read, which is correct and means the rules are published');
      } else if(/not-found|does not exist|Firestore.*database/i.test(msg)){
        push('Database answering', false, 'The project has no Firestore database yet. Create it: Build → Firestore Database → Create database.');
      } else if(/invalid-argument/i.test(msg)){
        push('Database answering', false, 'The check itself sent something the database would not accept (' + msg + '). This is a fault in the check, not in your project — report it.');
      } else {
        push('Database answering', false, msg);
      }
    }
    // Both of these documents are deliberately never created. What is being
    // checked is whether the rules let them be read, which answers two
    // questions that a refused sign-up otherwise cannot tell apart.
    const readable = async id => {
      try{ await fs.getDoc(fs.doc(db, 'diagnostics', id)); return true; }
      catch(_){ return false; }
    };
    const published = await readable('rules-published');
    push('Sign-up rules published', published, published
      ? 'the platform rules are live on this project'
      : 'The project is still running Firebase\u2019s own default rules. Open Firestore Database \u2192 Rules, replace everything with firestore.rules from the site\u2019s code, and press Publish.');
    if(published){
      const haveCodes = await readable('codes-present');
      push('Sign-up codes document found', haveCodes, haveCodes
        ? 'settings/signup exists — its codes stay in the database and are never sent to this browser'
        : 'No settings/signup document. In Firestore Database \u2192 Data, add a collection named settings holding a document whose ID is exactly signup, then add two string fields, operatorCode and farmCode, and press Save. A document with no fields does not count as existing \u2014 the console shows that kind in italics.');
    }
    try{
      const methods = await au.fetchSignInMethodsForEmail(auth, 'connection-check@example.com');
      push('Email sign-in switched on', true, 'Authentication answered' + (methods ? '' : ''));
    }catch(e){
      const msg = String(e && (e.code || e.message) || e);
      if(/operation-not-allowed|configuration-not-found/i.test(msg)){
        push('Email sign-in switched on', false, 'Email/Password is not enabled. Build → Authentication → Sign-in method → Email/Password → Enable.');
      } else if(/invalid-email/i.test(msg)){
        push('Email sign-in switched on', true, 'Authentication answered');
      } else {
        push('Email sign-in switched on', false, msg);
      }
    }
  }catch(e){
    push('Connected to the project', false, (e.message||String(e)));
  }
}

function diagnosticsPanel(){
  const lines = state.diagLines || [];
  return `
    <div class="card">
      <p class="helper" style="margin:0 0 10px;">This checks, step by step, whether the site can reach the shared database.
        Nothing here signs you in or changes any record.</p>
      <button class="btn small" onclick="runConnectionCheck()">Run the check</button>
      ${lines.length ? `<div style="margin-top:14px;">${lines.map(l=>`

function switchTab(tab){
  // A hidden button is not a permission, but nor should a stale tab name
  // open a screen this role may not see.
  if(state.role === 'admin' && USER){
    const t = ADMIN_TABS_ALL.find(x=> x[0] === tab);
    if(t && !can(t[2])) return;
  }
  // Opening one of these asks the database again. A farm that leaves the
  // Orders tab open all morning and comes back to it expects to see what
  // the Secretariat sent since — reading once a session is how an order
  // sits unseen on somebody's phone.
  if(tab === 'orders' || tab === 'ordersA') state.ordersRead = false;
  if(tab === 'batches' || tab === 'traceA') state.traceRead = false;
  if(tab === 'advice' || tab === 'advisoryA') state.advRead = false;
  if(tab === 'store' || tab === 'inputsA') state.inputsRead = false;
  if(tab === 'today') state.todayRead = false;
  state.navOpen = false;      // choosing a section closes the drawer
  state.tab = tab;
  rememberSession();          // a refresh comes back to the screen you were on
  render();
}

/* ============================================================
   Navigation

   Fifteen tabs in a flat column, in the order they happened to be
   built. A member looking for the input store read past Market
   standards and Actual harvest to find it, and nothing on screen
   said which of the fifteen wanted them today.

   So: four groups named for what a farm is doing, and a screen in
   front of them that says what is outstanding. The tab keys are
   untouched — every switchTab call, every deep link and every test
   still names the same screen.
   ============================================================ */
const MEMBER_GROUPS = [
  ['', [['today','Today']]],
  ['My farm',  [['profile','Farm profile'], ['calendar','Crop calendar'], ['standards','Market standards']]],
  ['Harvest',  [['plan','Harvest plan'], ['actual','Actual harvest'], ['batches','Batches']]],
  ['Trade',    [['orders','Orders'], ['store','Input store'], ['inputs','Input plan'], ['market','Market prices']]],
  ['Support',  [['advice','Ask an agronomist'], ['comms','Communication'],
                ['reports','Reports'], ['future','Future planning'], ['archive','Archive']]]
];
const MEMBER_TABS = MEMBER_GROUPS.reduce((all,[,tabs])=> all.concat(tabs), []);
// Each tab names the permission that opens it. A role that cannot do the
// thing does not see the tab — and the rules refuse it besides.
const ADMIN_GROUPS = [
  ['',           [['dashboard','Central dashboard','dashboard.read']]],
  ['Membership', [['members','Member management','members.read'],
                  ['gov','Governance','codes.read']]],
  ['Growing',    [['catalogue','Crop catalogue','catalogue.read'],
                  ['calendarsA','Crop calendars','calendars.read'],
                  ['advisoryA','Advisory','advisory.read']]],
  ['Trade',      [['ordersA','Orders','orders.read'],
                  ['inputsA','Inputs','inputs.read'],
                  ['traceA','Traceability','batches.read']]],
  ['Records',    [['bulk','Bulk data entry','bulk.write'],
                  ['growth','Growth planning','growth.read'],
                  ['reportsA','Reports','reports.read'],
                  ['commsA','Communication','comms.read']]]
];
const ADMIN_TABS_ALL = ADMIN_GROUPS.reduce((all,[,tabs])=> all.concat(tabs), []);
function adminTabs(){
  if(!USER) return ADMIN_TABS_ALL.map(([k,l])=> [k,l]);   // no roles in use yet
  return ADMIN_TABS_ALL.filter(([,,perm])=> can(perm)).map(([k,l])=> [k,l]);
}

/* ============================================================
   One navigation, behind three lines

   The sidebar first became a row of fifteen tabs that scrolled
   sideways. Then it became four places at the bottom plus More,
   which put the navigation in two places at once: some sections in
   the bar, the rest behind a sheet, and no single list of where you
   could go.

   On a phone it is one thing now. A three-line button in the app
   bar opens a drawer holding every section, grouped exactly as the
   desktop rail groups them, with who you are and the way out at the
   bottom of it. Same tab keys, same permission checks — one place.
   ============================================================ */

function toggleNav(){
  state.navOpen = !state.navOpen;
  render();
  // A drawer that opens without taking focus leaves a keyboard behind on the
  // page underneath, tabbing through what the scrim is covering.
  if(state.navOpen){
    const first = document.querySelector('.nd-item.active') || document.querySelector('.nd-item');
    if(first) first.focus({preventScroll:true});
  } else {
    const burger = document.querySelector('.ab-burger');
    if(burger) burger.focus({preventScroll:true});
  }
}
function closeNav(){ if(state.navOpen){ state.navOpen = false; render();
  const burger = document.querySelector('.ab-burger');
  if(burger) burger.focus({preventScroll:true}); } }

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && state.navOpen) closeNav();
});

/* Everything waiting on you, added up, so the closed drawer can say
   there is something inside without being opened to find out. */
function navBadgeTotal(){
  return sidebarGroups()
    .flatMap(([,tabs])=> tabs.map(([k])=> Number(tabBadge(k)) || 0))
    .reduce((a,b)=> a+b, 0);
}

/* The bar across the top of a phone: the way into the navigation, the
   mark, and the name of the section you are actually on — which the
   drawer cannot tell you while it is shut. */

  if(!el) return;
