.progress-pct.low, .progress-status.low{color:var(--red);}
.progress-pct.mid, .progress-status.mid{color:var(--gold);}
.progress-pct.near, .progress-status.near{color:var(--leaf-green);}
.progress-pct.met, .progress-status.met{color:var(--tipfa-green);}
.pace{margin:12px 0 0;font-size:14px;color:var(--muted);line-height:1.6;}

.hist-row{display:flex;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--line-soft);}
.hist-row:last-child{border-bottom:0;}
.hist-date{flex:1;font-size:14px;}
.hist-amt{font-weight:600;font-variant-numeric:tabular-nums;}
@media (max-width:520px){
  .big-total{font-size:26px;}
  .progress-now{font-size:30px;}
  .big-row{padding:11px 0;}
}
@media (prefers-reduced-motion: reduce){ .progress-fill{transition:none;} }
.refresh-btn{display:inline-flex;align-items:center;gap:6px;margin-left:8px;}
.refresh-btn .rf-icon{display:inline-flex;}
.refresh-btn .rf-icon svg{width:14px;height:14px;}
.refresh-btn.is-busy .rf-icon{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.rf-ago{margin-left:7px;white-space:nowrap;}
@media (prefers-reduced-motion: reduce){ .refresh-btn.is-busy .rf-icon{animation:none;} }
.cat-local{background:#FDF3E3;border-left:3px solid var(--gold);
  padding:9px 12px;border-radius:0 8px 8px 0;margin-top:10px;line-height:1.6;color:var(--ink);}
.cat-facts{background:var(--field-cream);border-left:3px solid var(--gold);
  padding:9px 12px;border-radius:0 8px 8px 0;margin-top:10px;line-height:1.6;}
.cat-facts strong{color:var(--deep-green);}
.prog-table tr.pg-transplanting td{background:#F3F5EC;}
.prog-table tr.pg-vegetative td{background:#F6F8EE;}
.prog-table tr.pg-flowering td{background:#FBF6EA;}
.prog-table tr.pg-harvesting td{background:#F2F5EA;}
.prog-table tr.pg-applied td{background:#EFF5E4;}
.prog-table td.pg-stage{border-left:4px solid var(--tipfa-green);background:#E9EDDD !important;}
.prog-table tr.pg-transplanting td.pg-stage{border-left-color:var(--deep-green);}
.prog-table tr.pg-vegetative td.pg-stage{border-left-color:var(--leaf-green);}
.prog-table tr.pg-flowering td.pg-stage{border-left-color:var(--harvest-orange);}
.prog-table tr.pg-harvesting td.pg-stage{border-left-color:var(--tipfa-green);}
.pg-edit{
  border:none;background:none;color:var(--tipfa-green);font-family:'Poppins',sans-serif;font-size:10.5px;
  font-weight:600;cursor:pointer;padding:1px 5px;border-radius:5px;margin-left:5px;opacity:0;
  transition:opacity var(--dur-2) var(--ease-out), background var(--dur-1);
}
.prog-table tr:hover .pg-edit{opacity:1;}
.pg-edit:hover{background:#E4E9D6;}
tr.entry-edit td{background:#F4F6EA !important;padding:16px 18px;}
tr.entry-edit .ee-head{font-family:'Poppins',sans-serif;font-size:12.5px;color:var(--deep-green);margin-bottom:12px;}

/* ---------- Import your own programme ---------- */
.import-card{border:1px dashed var(--line);background:#FAFAF4;}
.import-opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.import-result{

  background:#DFE7D2;color:var(--deep-green);
}

.all-stages{
  display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);
  margin:0 0 10px;cursor:pointer;line-height:1.4;
}

.archive-card{border-left:3px solid var(--leaf-green);}

.cloud-badge{

.cloud-badge .cloud-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}

.cloud-badge.wait .cloud-dot{background:var(--harvest-orange);animation:softPulse 1.6s var(--ease-in-out) infinite;}
.cloud-badge.off{color:var(--muted);}

.diag-line{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;margin-bottom:6px;font-size:12.5px;}

  margin-left:auto;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;
  border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Poppins',sans-serif;

/* ---------- Print ---------- */
@media print{
  .topbar, .subbar, .sidebar, .btn, .chips, input[type="file"], .arcfield, .curtain{ display:none !important; }
  .ts-actions{ display:none !important; }
  .app{ max-width:100%; }
  .content{ padding:0; }
  .card{ break-inside:avoid; border:1px solid #999; box-shadow:none; }
  .prog-table td, .prog-table th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .pg-edit{ display:none !important; }
  body{ background:#fff; }
  *{animation:none !important;}
}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .loginwrap{grid-template-columns:1fr;}
  /* On a phone the sign-in form comes first: the brand panel keeps the logo
     and the strapline, and drops the supporting detail. */
  .loginbrand{padding:28px 26px 30px;}
  .loginbrand .lb-logo{width:180px;margin-bottom:20px;}
  .loginbrand h2{font-size:22px;}
  .loginbrand .strap{margin-bottom:0;font-size:13px;}
  .values, .lb-foot{display:none;}
  .loginpane{padding:32px 22px 44px;}
}
/* ============================================================
   The mobile appearance

   Not the desktop console at a smaller size. One column, one bar,
   one navigation, one thing to read at a time. The desktop chrome —
   the green masthead, the sign-in strip, the side rail — is not
   shrunk here, it is replaced by the app bar and the drawer.

   760px is the line, and it is the same 760 the head script and
   MOBILE_MAX use. A test holds the three to each other.
   ============================================================ */
@media (max-width:760px){
  /* the desktop chrome, replaced rather than squeezed */
  .topbar{display:none;}
  .subbar{display:none;}
  .sidebar{display:none;}
  .layout{grid-template-columns:1fr;}

  /* one column. A phone reads down, not across. */
  .grid2, .grid3, .grid4{grid-template-columns:1fr;}
  /* two-up is for numbers only, where a stack would be a long march */
  .grid3.metrics, .grid4.metrics, .metric-row{grid-template-columns:1fr 1fr;}

  .content{padding:16px 14px calc(28px + env(safe-area-inset-bottom));}
  .app{padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}

  /* Nothing is allowed to set its own width past the screen. */
  .content, .content *{max-width:100%;}
  .card{border-radius:16px;}

  /* The app bar already names the section in the same words. Printing it
     again as a 25px heading spent three lines saying nothing new, so it is
     kept for the heading outline and for a screen reader, and not drawn. */
  h1.page-title{
    position:absolute; width:1px; height:1px; margin:0; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;
  }
  .content > h1.page-title::before{display:none;}
  p.page-sub{margin:0 0 16px; font-size:13px;}

  /* Four stage cards side by side is four columns of broken words. */
  .stage-rail{grid-template-columns:1fr;}
  .quick-grid{grid-template-columns:1fr;}

  /* A file input's native button plus its filename does not fit beside a
     label on a phone; give it the whole line. */
  input[type="file"]{width:100%;}

  /* 44px is the floor for anything a thumb has to land on (HIG 44pt,
     Material 48dp). Several fields and buttons were coming out at 38-42. */
  input:not([type="checkbox"]):not([type="radio"]), select, textarea,
  .btn, button.tabbtn, .chip{min-height:44px;}
  .btn{display:inline-flex; align-items:center; justify-content:center;}
  .chip{display:inline-flex; align-items:center;}
}

/* Above the line the login screen keeps its masthead; below it the hero
   carries the identity on its own and the bar would only repeat it. */
@media (max-width:760px){
  .appbar:empty{display:none;}
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
  .onscroll{opacity:1;transform:none;}
}

<script>
/* Crops are not a fixed list. Each farm names the crops it actually grows in
   its own crop profile, and every harvest, price and report view follows from
   that. These helpers are the single source of truth for "which crops". */
function memberCrops(id){
  const m = MEMBERS[id];
  if(!m || !Array.isArray(m.crops)) return [];
  const seen = [];
  m.crops.forEach(cr=>{ const n=(cr.crop||'').trim(); if(n && seen.indexOf(n)===-1) seen.push(n); });
  return seen;
}
// Every crop grown anywhere on the register, for association-wide views.
function allCrops(){
  const seen = [];
  Object.keys(MEMBERS).forEach(id=> memberCrops(id).forEach(n=>{ if(seen.indexOf(n)===-1) seen.push(n); }));
  return seen.sort((a,b)=> a.localeCompare(b));
}
function activeCrops(){
  const seen = [];
  activeMembers().forEach(id=> memberCrops(id).forEach(n=>{ if(seen.indexOf(n)===-1) seen.push(n); }));
  return seen.sort((a,b)=> a.localeCompare(b));
}
let INPUTS = ['Seeds','Fertiliser','Greenhouse Supplies','Water'];
const PERIODS = ['weekly','monthly','annual'];
// The price trend is anchored to what the farm has actually been paid for a
// crop, rather than to a table of assumed prices.
const INVEST_CATEGORIES = ['Seeds','Labour','Infrastructure','Other'];
/* Crop stages run from transplanting through to harvest, matching the
   association's Fertilizer & Crop Protection Program template. */
const CROP_STAGES = ['Transplanting','Vegetative','Flowering','Harvesting'];

/* ============================================================
   Crop catalogue
   The Secretariat keeps one list of crops and their varieties for
   the whole association. A variety carries two things a farm cannot
   be expected to know: how many plants belong in a square metre, and
   what one plant yields week by week once it starts bearing. A farm
   picks its crop and variety and says how many seedlings it put in;
   everything in its harvest plan follows from that.

   The per-plant patterns come from the TIPFA harvest ledger:
     continuous  bears every 7 days from its first harvest onwards
     pulses      fruits in bursts a set number of weeks apart
     single      one head, once, and nothing after it
     mainside    one main head, then smaller weekly side shoots
   ============================================================ */
/* The harvest model follows the association's Greenhouse Seasonal Yield
   Calculator. A variety is a table of months counted from transplanting;
   each month carries the kilograms one plant yields in a week, as a low to
   high range, and any one-off cut taken once in that month. Four weeks to
   a month, as the workbook assumes. Season totals here reproduce the
   workbook's own figures exactly. */
const WEEKS_PER_MONTH = 4;
const BAG_KG = 5;                       // the workbook reports 5 kg bags

// Weekly kilograms per plant, week by week, for a season this many weeks long.
// Week w falls in month ceil(w / 4); a one-off cut lands in that month's
// first week. Returns a low, high and midpoint for every week.
function weeklyYield(v, weeks){
  const out = [];
  const months = (v && Array.isArray(v.months)) ? v.months : [];
  for(let w = 1; w <= Math.max(0, weeks); w++){
    const month = Math.ceil(w / WEEKS_PER_MONTH);
    const row = months.find(m=> Number(m.month) === month);
    let low = 0, high = 0;
    if(row){
      low  = Number(row.low)  || 0;
      high = Number(row.high) || 0;
      if((w - 1) % WEEKS_PER_MONTH === 0){    // the first week of that month
        low  += Number(row.onceLow)  || 0;
        high += Number(row.onceHigh) || 0;
      }
    }
    out.push({ low, high, avg: (low + high) / 2, week: w, month, stage: row ? (row.stage||'') : '' });
  }
  return out;
}

function seasonTotals(v, weeks){
  return weeklyYield(v, weeks).reduce((t, r)=>({
    low: t.low + r.low, high: t.high + r.high, avg: t.avg + r.avg
  }), {low:0, high:0, avg:0});
}

// The first and last month a variety bears anything.
function bearingMonths(v){
  const ms = ((v && v.months) || [])
    .filter(m=> (Number(m.low)||0) + (Number(m.high)||0) + (Number(m.onceLow)||0) + (Number(m.onceHigh)||0) > 0)
    .map(m=> Number(m.month)).sort((a,b)=> a-b);
  return ms.length ? { first: ms[0], last: ms[ms.length-1] } : null;
}
function firstBearingWeek(v){
  const b = bearingMonths(v);
  return b ? (b.first - 1) * WEEKS_PER_MONTH + 1 : 0;
}
function seasonWeeksOf(v){
  const b = bearingMonths(v);
  return b ? b.last * WEEKS_PER_MONTH : 0;
}
// A plain description of the shape, for a farm reading its own figures.
function patternLabelOf(v){
  const b = bearingMonths(v);
  if(!b) return '';
  const once = (v.months||[]).some(m=> (Number(m.onceLow)||0) + (Number(m.onceHigh)||0) > 0);
  const weekly = (v.months||[]).some(m=> (Number(m.low)||0) + (Number(m.high)||0) > 0);
  const span = b.first === b.last ? `month ${b.first}` : `months ${b.first}–${b.last}`;
  if(once && !weekly) return `One cut, in ${span}`;
  if(once && weekly)  return `A main cut then weekly picking, ${span}`;
  return `Weekly picking, ${span}`;
}

/* The catalogue the platform starts with, taken from the Greenhouse Seasonal
   Yield Calculator. Cherry Tomato and Capsicum carry the workbook's own
   month-by-month rates. The rest are given the shape the workbook describes
   for them, scaled so each season total matches its stated range exactly. */
function defaultCatalogue(){
  const M = (month, stage, low, high, onceLow, onceHigh)=>
    ({ month, stage, low, high, onceLow: onceLow||0, onceHigh: onceHigh||0 });
  return [
    { name:'Cherry Tomato', varieties:[{
      name:'Greenhouse cherry', unit:'plant', perSqm:2.5,
      notes:'Continuous weekly harvest, peak in months 4–5. Season total 8.4–16.6 kg per plant.',
      months:[
        M(3,'First fruits',      0.25, 0.50),
        M(4,'Peak production',   0.50, 1.00),
        M(5,'Peak continues',    0.50, 1.00),
        M(6,'Stable production', 0.40, 0.75),
        M(7,'Declining yield',   0.30, 0.60),
        M(8,'Extended harvest',  0.15, 0.30) ] }] },

    { name:'Capsicum (Sweet Pepper)', varieties:[{
      name:'Greenhouse capsicum', unit:'plant', perSqm:3,
      notes:'Strong yields, peak in months 4–5. Season total 8.8–15.2 kg per plant.',
      months:[
        M(3,'First fruits',      0.30, 0.50),
        M(4,'Peak production',   0.50, 0.80),
        M(5,'Peak continues',    0.50, 0.80),
        M(6,'Stable production', 0.40, 0.70),
        M(7,'Declining yield',   0.30, 0.60),
        M(8,'Extended harvest',  0.20, 0.40) ] }] },

    { name:'Broccoli', varieties:[{
      name:'Greenhouse broccoli', unit:'plant', perSqm:4,
      notes:'One main head then side shoots, single cycle. Season total 1.5–3.0 kg per plant.',
      months:[
        M(3,'Main head',   0,    0,    0.90, 1.80),
        M(4,'Side shoots', 0.15, 0.30) ] }] },

    { name:'Cauliflower', varieties:[{
      name:'Greenhouse cauliflower', unit:'plant', perSqm:4,
      notes:'A single head, cut once. 1.0–2.0 kg per plant.',
      months:[ M(3,'Single head', 0, 0, 1.00, 2.00) ] }] },

    { name:'Herbs', varieties:[{
      name:'Cut-and-come-again herbs', unit:'plant', perSqm:16,
      notes:'Cut and come again, harvested weekly. Season total 1.2–2.4 kg per plant.',
      months:[
        M(3,'Weekly cutting', 0.05, 0.10),
        M(4,'Weekly cutting', 0.05, 0.10),
        M(5,'Weekly cutting', 0.05, 0.10),
        M(6,'Weekly cutting', 0.05, 0.10),
        M(7,'Weekly cutting', 0.05, 0.10),
        M(8,'Weekly cutting', 0.05, 0.10) ] }] },

    { name:'Habanero', varieties:[{
      name:'Greenhouse habanero', unit:'plant', perSqm:2.5,
      notes:'Continuous fruiting, peak in months 4–6. Season total 3.6–6.0 kg per plant.',
      months:[
        M(3,'First fruits',     0.10, 0.15),
        M(4,'Peak production',  0.20, 0.35),
        M(5,'Peak continues',   0.20, 0.35),
        M(6,'Peak continues',   0.20, 0.35),
        M(7,'Declining yield',  0.15, 0.25),
        M(8,'Extended harvest', 0.05, 0.05) ] }] },

    { name:'Avocado', varieties:[{
      name:'Mature tree', unit:'tree', perSqm:0.02,
      notes:'A mature bearing tree, 150–200 fruits over one season. 100–150 kg per tree — enter the number of trees, not seedlings.',
      months:[
        M(5,'Main crop', 12.5, 18.75),
        M(6,'Main crop', 12.5, 18.75) ] }] }
  ];
}

/* ============================================================
   Seasonal yield, per crop
   One figure per crop: what a single plant — or tree — yields over
   the season. It lives on the crop in the Secretariat's catalogue and
   nowhere else, and every member-facing figure is that number times
   the count the farm entered. Nothing on the member side carries a
   yield of its own.
   ============================================================ */
const SEASON_WEEKS = 24;

/* The confirmed figures. A crop already in the catalogue keeps whatever an
   operator has set — only fields it does not yet have are filled in. */
const SEED_YIELDS = [
  { name:'Cherry Tomatoes',        avgYieldPerPlant:4.20, countUnit:'plant', was:'Cherry Tomato' },
  { name:'Capsicum (Bell Pepper)', avgYieldPerPlant:2.00, countUnit:'plant', was:'Capsicum (Sweet Pepper)' },
  { name:'Paprika',                avgYieldPerPlant:2.40, countUnit:'plant' },
  { name:'Habanero (Loleza)',      avgYieldPerPlant:1.65, countUnit:'plant', was:'Habanero' },
  { name:'Sweet Melon',            avgYieldPerPlant:6.00, countUnit:'plant' },
  { name:'Broccoli',               avgYieldPerPlant:1.75, countUnit:'plant' },
  { name:'Cauliflower',            avgYieldPerPlant:1.15, countUnit:'plant' },
  { name:'Avocado',                avgYieldPerPlant:36.00,  countUnit:'tree'  },
  { name:'Herbs',                  avgYieldPerPlant:1.80, countUnit:'plant' }
];

/* A crop's figure may be entered in grams or kilograms — 300 g is easier to
   read than 0.3 kg — but everything is added up in kilograms underneath, so
   crops entered in different units still total correctly. What is shown back
   is whichever reads better for the size of the number. */
const MASS_UNITS = ['kg','g'];
function toKg(value, unit){ const n = Number(value)||0; return unit === 'g' ? n/1000 : n; }
function fromKg(kg, unit){ return unit === 'g' ? kg*1000 : kg; }
function massText(kg){
  const n = Number(kg) || 0;
  if(n && n < 1) return `${Math.round(n*1000)} g`;
  return `${fmt(round1(n))} kg`;
}

// "plant" or "tree", said correctly for a count. Driven by countUnit, so a
// future tree crop needs no code change.
function countWord(unit, n){ return (unit === 'tree' ? 'tree' : 'plant') + (n === 1 ? '' : 's'); }
function countLabel(unit){ return unit === 'tree' ? 'Number of trees' : 'Number of seedlings'; }

function cropCountUnit(cropName){
  const c = catalogueCrop(cropName);
  return (c && c.countUnit) || 'plant';
}

/* ============================================================
   A crop profile entry is the unit, not the crop name
   Two profiles of the same crop with different varieties are two
   different things: their own seedling count, their own expected
   total, their own harvest. Keyed by name they shared all of it, so
   each entry carries an id of its own and everything hangs off that.
   ============================================================ */
function newProfileId(){
  return 'cp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7);
}

/* Older records have no id, and their harvest entries were filed under the
   crop name. Both are brought forward here: every profile entry gets an id,
   and every entry is attached to the profile it belongs to. Where one crop
   name covers several profiles the entry cannot say which was meant, so it
   goes to the first and the farm is told. */
function migrateProfileIds(id){
  const m = MEMBERS[id];
  if(!m) return { ids:0, entries:0, ambiguous:[] };
  let ids = 0, moved = 0;
  const ambiguous = [];
  (m.crops||[]).forEach(cr=>{ if(!cr.id){ cr.id = newProfileId(); ids++; } });
  const list = (harvest[id] && Array.isArray(harvest[id].entries)) ? harvest[id].entries : [];
  list.forEach(e=>{
    if(e.profileId) return;
    const matches = (m.crops||[]).filter(cr=> cr.crop === e.crop);
    if(!matches.length) return;                 // the crop is gone; history keeps the name
    e.profileId = matches[0].id;
    moved++;
    if(matches.length > 1 && ambiguous.indexOf(e.crop) === -1) ambiguous.push(e.crop);
  });
  return { ids, entries:moved, ambiguous };
}

// What a profile entry is called on a chip and in its history.
function profileLabel(cr){
  return cr.variety ? `${cr.crop} · ${cr.variety}` : cr.crop;
}

/* The member's profile entries, grouped by crop so several varieties of one
   crop sit under a single heading and a lone one needs none. */
function profileGroups(m){
  const groups = [];
  (m.crops||[]).forEach(cr=>{
    let g = groups.find(x=> x.crop === cr.crop);
    if(!g){ g = { crop: cr.crop, items: [] }; groups.push(g); }
    g.items.push(cr);
  });
  return groups;
}

/* A variety may carry its own figures. Where it does not, it inherits the
   crop's — so one variety that genuinely out-yields another can be set
   without repeating everything else on it. */
function varietyOf(cropName, varietyName){
  const crop = catalogueCrop(cropName);
  if(!crop || !varietyName) return null;
  const n = String(varietyName).trim().toLowerCase();
  return (crop.varieties||[]).find(v=> (v.name||'').trim().toLowerCase() === n) || null;
}
function yieldSettings(cropName, varietyName){
  const crop = catalogueCrop(cropName);
  const v = varietyOf(cropName, varietyName);
  const pick = (key, dflt)=>{
    if(v && v[key] != null && v[key] !== '') return v[key];
    if(crop && crop[key] != null && crop[key] !== '') return crop[key];
    return dflt;
  };
  return {
    exists: !!crop,
    avgYieldPerPlant: pick('avgYieldPerPlant', null),
    yieldUnit: pick('yieldUnit', 'kg'),
    countUnit: pick('countUnit', 'plant'),
    seasonWeeks: Number(pick('seasonWeeks', SEASON_WEEKS)) || SEASON_WEEKS,
    fromVariety: !!(v && v.avgYieldPerPlant != null && v.avgYieldPerPlant !== '')
  };
}

/* THE shared calculation. Both member screens call this and nothing else
   works out an expected total. It reports why it cannot answer rather than
   returning a number that would render as NaN. */
function expectedHarvest(cr){
  const set = yieldSettings(cr && cr.crop, cr && cr.variety);
  const yieldPer = set.avgYieldPerPlant != null ? Number(set.avgYieldPerPlant) : null;
  const count = Number(cr && cr.seedlings) || 0;
  const unit = set.countUnit, yieldUnit = set.yieldUnit;
  const out = { crop: cr ? cr.crop : '', variety: cr ? (cr.variety||'') : '',
                label: cr ? profileLabel(cr) : '', fromVariety: set.fromVariety,
                yieldPer, count, unit, yieldUnit,
                perKg: yieldPer == null ? null : toKg(yieldPer, yieldUnit),
                seasonWeeks: set.seasonWeeks,
                total: 0, ok: false, why: '' };
  if(yieldPer == null || !(yieldPer > 0)){
    out.why = 'no-yield';
    return out;
  }
  if(!count){
    out.why = 'no-count';
    return out;
  }
  out.total = out.perKg * count;      // always kilograms
  out.ok = true;
  return out;
}

/* What a farm can actually put on a lorry in one week.

   The season total is the wrong number to judge an order by. A farm
   expecting 800 kg is not a farm that can hand over 800 kg — it hands over
   a share of that every week it is picking, and an order wanted by a date
   can only be filled out of the weeks before it.

   So: total expected harvest divided by the weeks the crop is picked in.

   The divisor is the catalogue's bearing window, not the farm's own dates,
   and that distinction is the whole of it. The yield figure the total comes
   from — 2 kg a capsicum plant — is what one plant gives across the crop's
   whole bearing period. Capsicum bears for six months, so those 2 kg are 24
   weeks of picking. Dividing the same 2 kg by a 13-week window a farm typed
   in claims the plant yields twice as fast as the association says it does.

   The farm's own first and last harvest dates say *when* it is picking and,
   if they are shorter than the crop bears for, that it is clearing early —
   which means less fruit, not faster fruit. That is reported beside the
   figure rather than folded silently into it. */
function weeklyExpected(cr){
  const e = expectedHarvest(cr);
  const out = { total: e.total, ok: false, why: e.why,
                harvestWeeks: 0, perWeek: 0, from: '',
                pickingWeeks: 0, clearsEarly: false, pickingTotal: e.total,
                firstHarvest: (cr && cr.firstHarvest) || '',
                lastHarvest: (cr && cr.expected) || '' };
  if(!e.ok) return out;                    // no yield, or nothing planted

  // How long this crop bears, per the association's own catalogue. This is
  // the period the total is stated over, so it is the only honest divisor.
  out.harvestWeeks = catalogueHarvestWeeks(cr && cr.crop, cr && cr.variety);
  out.from = 'catalogue';

  // The farm's own window: when it will be picking, and for how long.
  const a = out.firstHarvest ? new Date(out.firstHarvest) : null;
  const b = out.lastHarvest  ? new Date(out.lastHarvest)  : null;
  if(a && b && !isNaN(a) && !isNaN(b) && b >= a){
    out.pickingWeeks = Math.max(1, Math.round((b - a) / MS_WEEK));
    // With no catalogue window to go on, the farm's own dates are all there
    // is, and they are better than nothing.
    if(!out.harvestWeeks){ out.harvestWeeks = out.pickingWeeks; out.from = 'dates'; }
  }
  if(!out.harvestWeeks){ out.why = 'no-window'; return out; }

  out.perWeek = e.total / out.harvestWeeks;

  // Clearing before the crop stops bearing gives fewer weeks of fruit, not
  // more fruit per week.
  if(out.pickingWeeks && out.pickingWeeks < out.harvestWeeks){
    out.clearsEarly = true;
    out.pickingTotal = out.perWeek * out.pickingWeeks;
  } else if(!out.pickingWeeks){
    out.pickingWeeks = out.harvestWeeks;
  }

  out.ok = true;
  return out;
}

/* How many weeks the catalogue says this thing bears for, when the farm has
   not given its own dates. The variety first and then the crop, the same
   order yieldSettings picks in, so a crop recorded under a variety name the
   catalogue does not carry still gets an answer. */
function catalogueHarvestWeeks(cropName, varietyName){
  const crop = catalogueCrop(cropName);
  // The bearing months sit on the variety, not the crop, so a farm that
  // recorded a variety name the catalogue does not carry falls back to the
  // crop's own varieties — how long that crop bears for is a fact about the
  // crop, and any of its varieties states it better than nothing does.
  let b = bearingMonths(varietyOf(cropName, varietyName));
  if(!b && crop){
    for(const v of (crop.varieties || [])){
      b = bearingMonths(v);
      if(b) break;
    }
  }
  if(!b) return 0;
  return Math.max(1, Math.round((b.last - b.first + 1) * WEEKS_PER_MONTH));
}

/* Said in one place so the plan and the order screens word it identically. */
function harvestWindowText(w){
  if(!w.harvestWeeks) return '';
  const weeks = `${w.harvestWeeks} week${w.harvestWeeks === 1 ? '' : 's'}`;
  const d = t=> t ? new Date(t).toLocaleDateString('en-GB',
                    {day:'2-digit',month:'short',year:'numeric'}) : '';
  if(w.from === 'dates') return `${weeks} — ${d(w.firstHarvest)} to ${d(w.lastHarvest)}`;
  return `${weeks} — how long this crop bears, per the catalogue`;
}

/* When a farm's own dates stop before the crop does. Said plainly, because
   the farm may have typed the wrong date or may genuinely be clearing for
   the next planting, and only the farm knows which. */
function clearsEarlyNote(w){
  if(!w.clearsEarly) return '';
  const d = t=> t ? new Date(t).toLocaleDateString('en-GB',
                    {day:'2-digit',month:'short',year:'numeric'}) : '';
  return `Your dates cover ${w.pickingWeeks} week${w.pickingWeeks===1?'':'s'} of that — `
       + `${d(w.firstHarvest)} to ${d(w.lastHarvest)} — so you would pick about `
       + `${massText(w.pickingTotal)} of the ${massText(w.total)}. `
       + `If you mean to pick the whole crop, put the last harvest date `
       + `${w.harvestWeeks} weeks after the first.`;
}

/* Fill in the confirmed figures without touching anything an operator has
   already set, and match a crop that is here under an earlier name rather
   than adding a second one beside it. */
function seedCatalogueYields(list){
  const crops = Array.isArray(list) ? list : [];
  const find = n=> crops.find(c=> (c.name||'').trim().toLowerCase() === String(n).trim().toLowerCase());
  SEED_YIELDS.forEach(seed=>{
    let crop = find(seed.name);
    if(!crop && seed.was){
      crop = find(seed.was);
      if(crop){
        const from = crop.name;
        crop.name = seed.name;
        renameCropEverywhere(from, seed.name);
      }
    }
    if(!crop){
      crop = { name: seed.name, varieties: [] };
      crops.push(crop);
    }
    if(crop.avgYieldPerPlant == null) crop.avgYieldPerPlant = seed.avgYieldPerPlant;
    if(crop.yieldUnit == null)        crop.yieldUnit = 'kg';
    if(crop.countUnit == null)        crop.countUnit = seed.countUnit;
    if(crop.seasonWeeks == null)      crop.seasonWeeks = SEASON_WEEKS;
    if(!Array.isArray(crop.varieties) || !crop.varieties.length)
      crop.varieties = [{ name:'Standard', unit: crop.countUnit, perSqm:0, notes:'', months:[] }];
  });
  return crops;
}

// A crop renamed in the catalogue must not orphan the farms already growing it.
function renameCropEverywhere(from, to){
  Object.keys(MEMBERS).forEach(id=>{
    let touched = false;
    (MEMBERS[id].crops||[]).forEach(cr=>{
      if((cr.crop||'').trim().toLowerCase() === String(from).trim().toLowerCase()){
        cr.crop = to; touched = true;
      }
    });
    if(touched) renameCropRecords(id, from, to);
  });
}

/* ---- Carrying older varieties forward -------------------------------
   Before the calculator's figures were adopted, a variety was one weekly
   amount and a week to start from. Those varieties are still in the
   catalogues operators have saved, and they carry real work, so they are
   read into the month table rather than dropped — the figures they gave
   are preserved exactly, with the low and the high equal, because that is
   all the old shape ever knew. */
function migrateVariety(v){
  if(!v || (Array.isArray(v.months) && v.months.length)) return v;
  const out = { name: v.name, unit: v.unit || 'plant', perSqm: v.perSqm || 0,
                notes: v.notes || '', months: [] };
  const startWeek = Math.max(1, Number(v.startWeek) || 1);
  const SEASON = 6 * WEEKS_PER_MONTH;                 // the old 24-week season

  // Rebuild the old week-by-week series first. Folding it into months only
  // afterwards is what keeps the totals exact: a variety that began part way
  // through a month bore for part of it, and rounding the start to the month
  // boundary would hand it weeks it never had.
  const weekly = new Array(SEASON + 1).fill(0);
  const once   = new Array(SEASON + 1).fill(0);
  const at = (arr, w, kg)=>{ if(w >= 1 && w <= SEASON) arr[w] += kg; };
  switch(v.pattern){
    case 'continuous': {
      const kg = (Number(v.weeklyG) || 0) / 1000;
      for(let w = startWeek; w <= SEASON; w++) at(weekly, w, kg);
      break;
    }
    case 'pulses': {
      const step = Math.max(1, Number(v.intervalWeeks) || 1);
      for(let w = startWeek; w <= SEASON; w += step) at(once, w, Number(v.pulseKg) || 0);
      break;
    }
    case 'single':
      at(once, startWeek, Number(v.headKg) || 0);
      break;
    case 'mainside': {
      at(once, startWeek, Number(v.mainKg) || 0);
      const n = Number(v.sideWeeks) || 0, side = (Number(v.sideG) || 0) / 1000;
      for(let i = 1; i <= n; i++) at(weekly, startWeek + i, side);
      break;
    }
    default: return out;                              // nothing to carry over
  }

  for(let m = 1; m <= SEASON / WEEKS_PER_MONTH; m++){
    let wSum = 0, oSum = 0;
    for(let k = 1; k <= WEEKS_PER_MONTH; k++){
      const w = (m - 1) * WEEKS_PER_MONTH + k;
      wSum += weekly[w]; oSum += once[w];
    }
    if(wSum <= 0 && oSum <= 0) continue;
    const rate = wSum / WEEKS_PER_MONTH;              // the month's own weekly rate
    out.months.push({ month:m, stage: oSum && !wSum ? 'Harvest' : 'Weekly harvest',
                      low: rate, high: rate, onceLow: oSum, onceHigh: oSum });
  }
  return out;
}

function normaliseCatalogue(list){
  if(!Array.isArray(list)) return null;
  const out = list.map(c=> Object.assign({}, c, { varieties: (c.varieties||[]).map(migrateVariety) }));
  return seedCatalogueYields(out);
}

let CATALOGUE = defaultCatalogue();   // seeded at start-up, once the register is loaded

const MS_WEEK = 7 * 24 * 60 * 60 * 1000;

/* What a farm should expect off a crop, from what it has entered.
   Everything here is the catalogue's figures scaled by the farm's own
   seedling count; nothing is guessed. Where the farm has given both its
   dates the season is as long as those dates make it, and the harvest
   weeks carry real calendar dates. Without dates the catalogue's own
   24-week season is used, so a yield still shows the moment a crop and
   a seedling count are entered. */
function yieldFor(cr){
  const v = catalogueVariety(cr.crop, cr.variety);
  const n = Number(cr.seedlings) || 0;
  const empty = { ok:false, weeks:0, perPlant:0, perPlantLow:0, perPlantHigh:0,
                  total:0, totalLow:0, totalHigh:0, rows:[], patternLabel:'',
                  firstDate:'', lastDate:'', peak:0, dated:false, seedlings:n,
                  unit:'plant', months:[] };
  if(!v) return empty;

  // The variety's own season is what the catalogue says it is. A farm's dates
  // may shorten it — a crop cleared early yields only what it gave by then —
  // but they cannot invent bearing months the variety does not have.
  const own = seasonWeeksOf(v) || 24;
  let weeks = own, start = null, dated = false;

  /* Two ways to place that season on a calendar, and a farm may know either.
     The transplanting date is week one. The first harvest date is the week the
     variety starts bearing, so the season is worked back from it. A farm that
     knows when picking began but not when the seedlings went in is the common
     case, and it is the more direct statement about the harvest, so it wins
     when both are given. */
  const firstWeek = firstBearingWeek(v) || 1;
  const fh = cr.firstHarvest ? new Date(cr.firstHarvest) : null;
  if(fh && !isNaN(fh)){
    start = new Date(fh.getTime() - (firstWeek - 1) * MS_WEEK);
    dated = true;
  } else {
    const a = cr.planted ? new Date(cr.planted) : null;
    if(a && !isNaN(a)){ start = a; dated = true; }
  }
  if(start && cr.expected){
    const b = new Date(cr.expected);
    if(!isNaN(b) && b > start) weeks = Math.min(own, Math.max(1, Math.round((b - start) / MS_WEEK)));
  }

  const per = weeklyYield(v, weeks);
  const tot = per.reduce((t,r)=>({low:t.low+r.low, high:t.high+r.high, avg:t.avg+r.avg}), {low:0,high:0,avg:0});
  const rows = [];
  per.forEach((r, i)=>{
    if(r.avg <= 0) return;
    rows.push({ week: r.week, month: r.month, stage: r.stage,
                kg: r.avg * n, kgLow: r.low * n, kgHigh: r.high * n,
                date: start ? new Date(start.getTime() + i * MS_WEEK) : null });
  });
  const fmtDate = d=> d ? d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
  return {
    ok: !!(n && tot.avg), weeks, dated, seedlings:n, unit: v.unit || 'plant',
    perPlant: tot.avg, perPlantLow: tot.low, perPlantHigh: tot.high,
    total: tot.avg * n, totalLow: tot.low * n, totalHigh: tot.high * n,
    rows, months: v.months || [],
    patternLabel: patternLabelOf(v),
    firstDate: rows.length ? fmtDate(rows[0].date) : '',
    lastDate: rows.length ? fmtDate(rows[rows.length-1].date) : '',
    peak: rows.reduce((mx,r)=> Math.max(mx, r.kg), 0)
  };
}

// The workbook reports in 5 kg bags as well as kilograms.
function bags(kg){ return Math.round((kg / BAG_KG) * 10) / 10; }
// "plant" or "tree", said correctly for a count.
function unitWord(u, n){ return (u === 'tree' ? 'tree' : 'plant') + (n === 1 ? '' : 's'); }

/* The yield panel on the crop profile: what each crop is expected to give,
   as the range the association's calculator states rather than one figure
   presented as certainty. A crop that cannot be projected says what it is
   waiting for. */
function yieldPanel(m){
  const crops = m.crops || [];
  if(!crops.length) return '';
  const each = crops.map(cr=> ({ cr, e: expectedHarvest(cr) }));
  const grand = each.reduce((a,x)=> a + x.e.total, 0);
  return `
    <div class="section-label">Expected yield</div>
    <div class="card" style="overflow-x:auto;">
      <p class="helper" style="margin:0 0 10px;">The Secretariat's figure for each crop, multiplied by how many you planted. This is the same figure your harvest plan uses.</p>
      <table class="grid-table"><thead><tr>
        <th>Crop</th><th>Variety</th><th>Planted</th><th>Per plant</th><th>Expected total</th>
      </tr></thead>
      <tbody>${each.map(({cr, e})=> e.ok ? `<tr>
          <td><strong>${esc(cr.crop)}</strong></td>
          <td>${esc(cr.variety||'—')}</td>
          <td>${fmt(e.count)} ${esc(countWord(e.unit, e.count))}</td>
          <td>${e.yieldPer} ${esc(e.yieldUnit)}</td>
          <td style="background:var(--field-cream);"><strong>${massText(e.total)}</strong></td>
        </tr>` : `<tr>
          <td><strong>${esc(cr.crop)}</strong></td>
          <td>${esc(cr.variety||'—')}</td>
          <td colspan="3" class="helper">${e.why === 'no-yield'
            ? 'Not set yet — contact admin.'
            : `Enter your ${esc(countLabel(e.unit).toLowerCase())} on this tab and the total appears here.`}</td>
        </tr>`).join('')}
        ${grand ? `<tr><td colspan="4" style="text-align:right;"><strong>All crops</strong></td>
          <td style="background:var(--gold);color:var(--deep-green);"><strong>${massText(grand)}</strong></td></tr>` : ''}
      </tbody></table>
    </div>`;
}

// The season gathered into months, the way the calculator reports it.
function monthlyBreakdown(y){
  const by = {};
  y.rows.forEach(r=>{
    const k = r.month;
    by[k] = by[k] || { month:k, stage:r.stage, low:0, avg:0, high:0, label:'' };
    by[k].low += r.kgLow; by[k].avg += r.kg; by[k].high += r.kgHigh;
    if(r.date && !by[k].label) by[k].label = r.date.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(k=> by[k]);
}

function yieldBlockedReason(cr){
  if(!catalogueCrop(cr.crop)) return 'This crop is not in the Secretariat catalogue, so there are no yield figures for it. Edit the crop and choose one from the list, or ask the Secretariat to add it.';
  const v = catalogueVariety(cr.crop, cr.variety);
  if(!v) return 'This variety is not in the Secretariat catalogue. Edit the crop and choose one that is, or ask the Secretariat to add it.';
  if(!(Number(cr.seedlings)||0)) return 'Enter the number of seedlings you planted and the yield appears here.';
  const y = yieldFor(cr);
  if(y.perPlant > 0) return '';

  // Past this point the catalogue and the seedlings are both in order and the
  // variety still yields nothing. There are only two ways that happens, and
  // saying which one it is turns a dead end into something that can be fixed.
  const first = firstBearingWeek(v);
  if(first && first > y.weeks){
    const b = bearingMonths(v);
    return `${cr.variety} does not start bearing until month ${b.first}, and your dates leave only ${y.weeks} week${y.weeks===1?'':'s'} between transplanting and the last harvest. Move the last harvest date later — at least ${first} weeks after transplanting — or clear it, and the variety's own season is used instead. That date is when the crop finishes, not the first pick.`;
  }
  return `The Secretariat's figures for ${cr.variety} come to nothing per plant — no month on it carries a harvest. Ask the Secretariat to fill them in on the Crop catalogue tab.`;
}

// The one thing standing between a crop and a place in the harvest plan.
function planBlockedReason(cr){
  const y = yieldFor(cr);
  if(!y.ok) return yieldBlockedReason(cr);
  if(!y.dated) return 'Add the transplanting date on your Profile tab — without it these kilograms cannot be placed on a calendar.';
  if(!y.rows.length) return 'The dates leave no bearing weeks. Check the transplanting and expected harvest dates.';
  return '';
}

function catalogueCrop(name){
  const n = (name||'').trim().toLowerCase();
  return CATALOGUE.find(c=> (c.name||'').trim().toLowerCase() === n) || null;
}
function catalogueVariety(cropName, varietyName){
  const crop = catalogueCrop(cropName);
  if(!crop) return null;
  const v = (varietyName||'').trim().toLowerCase();
  return (crop.varieties||[]).find(x=> (x.name||'').trim().toLowerCase() === v) || null;
}


/* The four input categories a farm records against each crop stage.
   Fertilizers carry a composition and an application method; the three
   crop-protection categories carry the pest or disease they target. */
const INPUT_CATEGORIES = [
  {key:'Fertilizers',  label:'Fertilizers',  targets:false, unit:'kg', units:['kg','L','g','ml'],
   methods:['Basal','Broadcasting','Fertigation','Foliar','Top-dressing','Drench'],
   hint:'e.g. Triple Super Phosphate (TSP), Yara Winner, Potassium Nitrate'},
  {key:'Pesticides',   label:'Pesticides',   targets:true,  unit:'ml', units:['ml','g','L','kg'],
   methods:['Spray','Foliar spray','Drench','Soil application','Broadcasting'],
   hint:'e.g. Dudu Acemactin for Tuta absoluta, Mission for leaf miner'},
  {key:'Fungicides',   label:'Fungicides',   targets:true,  unit:'ml', units:['ml','g','L','kg'],
   methods:['Spray','Foliar spray','Drench','Seed treatment','Broadcasting'],
   hint:'e.g. Ridomil Gold for damping off, Tuncopper for bacterial spot'},
];
const CATEGORY_KEYS = INPUT_CATEGORIES.map(c=>c.key);
function categoryDef(key){ return INPUT_CATEGORIES.find(c=>c.key===key) || INPUT_CATEGORIES[0]; }

// Stage guidance carried over from the association's own programme template.
const STAGE_NOTES = {
  'Transplanting':'Basal fertilizers incorporated at or just after transplanting; protectant fungicide drench for damping-off.',
  'Vegetative':'Build canopy and root mass; rotate insecticide and fungicide actives to manage resistance.',
  'Flowering':'Support flowering and fruit set; increase K relative to N; maintain weekly pest scouting.',
  'Harvesting':'Sustain fruit fill and quality; observe the pre-harvest interval (PHI) on all sprays before picking.',
};

// An empty programme: every stage, every category.
function blankProgramme(){
  const p = {};
  CROP_STAGES.forEach(st=>{ p[st] = {}; CATEGORY_KEYS.forEach(k=> p[st][k] = []); });
  return p;
}
// Bring any crop record up to the current shape, whatever it was saved as.
function ensureProgramme(cr){
  if(!cr.programme) cr.programme = blankProgramme();
  // Insecticides are no longer a separate category — anything recorded under
  // it moves into Pesticides rather than disappearing.
  CROP_STAGES.forEach(st=>{
    const bucket = cr.programme[st];
    if(bucket && Array.isArray(bucket['Insecticides'])){
      if(!Array.isArray(bucket['Pesticides'])) bucket['Pesticides'] = [];
      bucket['Insecticides'].forEach(e=> bucket['Pesticides'].push(e));
      delete bucket['Insecticides'];
    }
  });
  // Comments are per stage. Older records kept a single note for the whole
  // crop, so carry that onto the stage it was written against.
  if(!cr.stageNotes){
    cr.stageNotes = {};
    if(cr.stageInputs) cr.stageNotes[cr.stage || CROP_STAGES[0]] = cr.stageInputs;
  }
  CROP_STAGES.forEach(st=>{
    if(!cr.programme[st]) cr.programme[st] = {};
    CATEGORY_KEYS.forEach(k=>{ if(!Array.isArray(cr.programme[st][k])) cr.programme[st][k] = []; });
  });
  if(!cr.stage || CROP_STAGES.indexOf(cr.stage) === -1) cr.stage = CROP_STAGES[0];
  return cr.programme;
}
const MARKET_STANDARD_OPTIONS = ['GlobalG.A.P.','Organic','Fair Trade','Other'];

// The membership register starts empty. Farms join by signing up on the
// sign-in screen, or are registered directly by a Secretariat operator,
// and every farm owns and edits its own profile from there.
let MEMBERS = {};

/* A device that has never been used starts with no operators at all. The first
   person to arrive creates their own account with the Secretariat sign-up code.
   Seeding named accounts here meant every fresh device silently held operators
   with passwords nobody had chosen, which is why a real password could be
   rejected on a second device while the reset flow still recognised the ID. */
const DEFAULT_ADMINS = [];
const MAX_ADMINS = 5;
// Shared code an operator must quote to create their own administrator account
// from the sign-in screen. Set to '' to allow administrator sign-up without a code.
/* Sign-up codes
   Both farms and operators need a code from the Secretariat to create an
   account. The codes are settings an operator can change from Governance,
   not constants compiled into the page, and they are never printed on the
   public sign-in screen — printing them would defeat the gate. */
const SETTINGS_STORE_KEY = 'tipfa.settings.v1';
const DEFAULT_SETTINGS = { adminCode:'TIPFA2026', farmCode:'TIPFAFARM2026' };
let SETTINGS = Object.assign({}, DEFAULT_SETTINGS);
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_STORE_KEY);
    if(raw){ SETTINGS = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw)); }
  }catch(e){ /* unreadable — keep the defaults */ }
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_STORE_KEY, JSON.stringify(SETTINGS)); }catch(e){ /* not persisted */ }
}
function adminCode(){ return SETTINGS.adminCode || ''; }
function farmCode(){ return SETTINGS.farmCode || ''; }
const ADMIN_STORE_KEY = 'tipfa.admins.v1';
const MEMBER_STORE_KEY = 'tipfa.members.v1';

/* ============================================================
   Cloud connection
   The platform works entirely offline against browser storage. When a
   Firebase project is configured and reachable, it additionally keeps a
   shared copy so records reach every device. Nothing here is allowed to
   break the offline path: if the SDK cannot load, the project is not
   configured, or the network is down, the app carries on exactly as it
   did before and reports itself as offline.
   ============================================================ */
const CLOUD = {
  status: 'connecting',     // connecting | ready | offline | unconfigured | error
  detail: '',
  app: null, db: null, auth: null,
  ready: false
};
const CLOUD_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

function cloudStatusText(){
  switch(CLOUD.status){
    case 'ready': return 'Connected — records are shared with every device';
    case 'connecting': return 'Connecting…';
    case 'unconfigured': return 'Not configured — records stay on this device';
    case 'offline': return 'Offline — records stay on this device until the connection returns';
    default: return 'Unavailable — records stay on this device';
  }
}
function setCloudStatus(status, detail){
  CLOUD.status = status;
  CLOUD.detail = detail || '';
  CLOUD.ready = status === 'ready';
  const el = document.getElementById('cloud-status');
  if(el) el.outerHTML = cloudBadge();
}
/* A phone can hold an old copy of this page for a long time, and a fault
   already fixed looks unfixed until it lets go of it. The build shows on
   screen so which copy is running can be said rather than guessed. */
const BUILD = (document.querySelector('meta[name="tipfa-build"]') || {}).content || 'v0';

/* ============================================================
   Is this device running the copy the server has?

   The platform is one file on a static host, and a phone will hold on to it
   for as long as it likes. That is how a farm came to read 117 kg a week off
   its harvest plan while the console read 44 kg for the same crop: two
   different versions of the same arithmetic, neither of them saying so.

   Nothing here can push an update. What it can do is ask — a two-kilobyte
   range request for the head of the file, where the build stamp now lives —
   and say plainly that this copy is behind, rather than letting two devices
   quietly disagree about a number somebody is going to deliver against.
   ============================================================ */
function buildNumber(v){ const n = parseInt(String(v||'').replace(/^v/,''), 10); return isNaN(n) ? 0 : n; }

async function checkForNewerBuild(){
  if(!navigator.onLine) return;
  if(!/^https?:/.test(location.protocol)) return;   // file:// has no server to ask
  try{
    const res = await fetch(location.pathname + '?b=' + Date.now(), {
      cache:'no-store', headers:{ 'Range':'bytes=0-3071' }
    });
    if(!res.ok && res.status !== 206) return;
    const head = await res.text();
    const m = head.match(/name="tipfa-build"\s+content="([^"]+)"/);
    if(!m) return;                                   // range not honoured, or an old layout
    const served = m[1];
    if(buildNumber(served) > buildNumber(BUILD)){
      state.staleBuild = served;
      render();
    }
  }catch(_){ /* offline or blocked: say nothing rather than guess */ }
}

/* Drawn above everything, on both sides of the platform, because a figure
   read off an old copy is the one thing here that can travel out of the
   building and become a promise to a customer. */
function staleBuildBar(){
  if(!state.staleBuild) return '';
  return `<div class="stalebar">
    <div>
      <strong>This device is running an older copy of the platform (${esc(BUILD)}).</strong>
      <div class="sb-sub">The current one is ${esc(state.staleBuild)}. Figures can differ between
        versions, so reload before relying on anything on this screen.</div>
    </div>
    <button class="sb-go" onclick="location.reload()">Reload</button>
  </div>`;
}

function cloudBadge(){
  const cls = CLOUD.status === 'ready' ? 'ok' : (CLOUD.status === 'connecting' ? 'wait' : 'off');
  return `<span id="cloud-status" class="cloud-badge ${cls}" title="${esc(CLOUD.detail || cloudStatusText())}">
    <span class="cloud-dot"></span>${CLOUD.status === 'ready' ? 'Cloud sync on' : (CLOUD.status === 'connecting' ? 'Connecting' : 'On this device only')}</span>
    <span class="cloud-badge build" title="The version of the site this device has loaded. Reload the page if it is behind.">${BUILD}</span>`;
}

async function initCloud(){
  const cfg = window.TIPFA_FIREBASE_CONFIG;
  if(!cfg || !cfg.projectId){
    setCloudStatus('unconfigured', 'No Firebase project is configured for this site.');
    return;
  }
  try{
    const [{ initializeApp }, firestore, auth] = await Promise.all([
      import(CLOUD_SDK + 'firebase-app.js'),
      import(CLOUD_SDK + 'firebase-firestore.js'),
      import(CLOUD_SDK + 'firebase-auth.js')
    ]);
    CLOUD.app = initializeApp(cfg);
    CLOUD.db = firestore.getFirestore(CLOUD.app);
    CLOUD.auth = auth.getAuth(CLOUD.app);
    CLOUD.fs = firestore;
    CLOUD.authApi = auth;
    // Keep working through a dropped connection, and pick up again after it.
    try{ await firestore.enableIndexedDbPersistence(CLOUD.db); }catch(e){ /* several tabs open, or unsupported */ }
    setCloudStatus('ready', `Connected to ${cfg.projectId}.`);
    logAction(`Connected to the shared TIPFA database (${cfg.projectId}).`);
  }catch(e){
    // A blocked CDN, no network, or a project that is not reachable yet.
    setCloudStatus('offline', 'Could not reach the shared database: ' + (e && e.message ? e.message : 'unknown error'));
  }
}

/* ============================================================
   Cloud accounts and sync
   When the project is reachable, accounts are Firebase Authentication
   users and records live in Firestore, so a farm that registers on one
   phone is visible to the Secretariat everywhere. When it is not, every
   one of these falls back to the browser-only behaviour the platform
   has always had. No cloud failure is allowed to block a farm from
   working.
   ============================================================ */
// cloudIds holds the farms that actually exist in the shared database. A farm
// registered before the database was reachable lives only in this browser, and
// writing it would be refused by the rules — the create rule needs the farm's
// own sign-up code, which an operator does not have. Pushing only what is
// known to be there keeps one local record from reporting the whole app
// offline.
const CLOUD_STATE = { uid:null, role:null, email:null, pushTimer:null, pendingId:null, cloudIds:new Set() };

/* A button that appears to do nothing is the worst failure to diagnose,
   especially on a phone with no console. Anything thrown or rejected and not
   handled is shown on screen instead of vanishing. */
function showFatal(msg){
  let bar = document.getElementById('fatal-bar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'fatal-bar';
    bar.className = 'fatal-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `<strong>Something went wrong.</strong> ${esc(String(msg).slice(0,300))}
    <button onclick="this.parentNode.remove()">Dismiss</button>`;
}
window.addEventListener('error', e=> showFatal((e.error && e.error.message) || e.message || 'unknown error'));
window.addEventListener('unhandledrejection', e=>{
  const r = e.reason;
  showFatal((r && (r.code ? r.code + ' — ' : '') + (r.message || r)) || 'unknown error');
});

// Never let a network call hang with no feedback.
function withTimeout(promise, ms, what){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error(`${what} timed out after ${ms/1000} seconds — the connection may have dropped.`)), ms))
  ]);
}


function cloudOn(){ return CLOUD.ready && CLOUD.db && CLOUD.auth; }

// The parts of a farm record that belong in its own document. Harvest is kept
// out of it — a season of weekly entries grows, and a document is capped.
function farmDoc(m){
  return JSON.parse(JSON.stringify({
    name:m.name||'', contact:m.contact||'', phone:m.phone||'', email:m.email||'',
    location:m.location||'', category:m.category||'', status:m.status||'Pending',
    registered:m.registered||todayStr(),
    totalArea:m.totalArea||0, totalAreaUnit:m.totalAreaUnit||'ha',
    indoorSqm:m.indoorSqm||0, indoorSqmUnit:m.indoorSqmUnit||'m²',
    indoorUnits:m.indoorUnits||0, outdoorArea:m.outdoorArea||0, outdoorAreaUnit:m.outdoorAreaUnit||'ha',
    irrigation:m.irrigation||'', water:m.water||'', avatar:m.avatar||'',
    crops:m.crops||[], marketStandards:m.marketStandards||[], marketPrices:m.marketPrices||[],
    investments:m.investments||blankInvestments(), futurePlan:m.futurePlan||{year1:'',year2:'',year3:''},
    archives:m.archives||[],
    inputs: inputsData[m.__id] || null,
    updatedAt: new Date().toISOString()
  }));
}

function isCloudFarm(id){ return CLOUD_STATE.cloudIds.has(id); }

async function cloudPushFarm(id){
  if(!cloudOn() || !MEMBERS[id] || !isCloudFarm(id)) return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'farms', id), farmDoc(Object.assign({__id:id}, MEMBERS[id])), {merge:true});
    if(harvest[id]) await setDoc(doc(CLOUD.db, 'harvest', id),
      JSON.parse(JSON.stringify({ plan:harvest[id].plan, actual:harvest[id].actual,
        entries: harvest[id].entries || [], updatedAt:new Date().toISOString() })), {merge:true});
  }catch(e){ setCloudStatus('offline', 'Could not save to the shared database: ' + (e.message||e)); }
}
