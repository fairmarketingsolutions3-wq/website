/* A crop's figure for a month. The plan grid is keyed by profile id and so
   are the entries, but the association counts by crop name — two profiles of
   the same crop are one crop to a buyer — so the profile ids are resolved
   back to names here rather than at a dozen call sites. */
function profileCropName(id, key){
  const m = MEMBERS[id];
  const cr = m && (m.crops || []).find(x=> x.id === key);
  if(cr) return (cr.crop || '').trim();
  // an entry kept against a crop the farm has since removed
  const e = harvestEntries(id).find(x=> x.profileId === key);
  return e ? (e.crop || '').trim() : String(key || '').trim();
}
function memberMonthCropTotal(id, kind, year, month, crop){
  if(!harvest[id]) return 0;
  let t = 0;
  for(let w = 1; w <= 4; w++){
    const wk = harvestWeekAny(id, kind, year, month, w);
    if(!wk) continue;
    Object.keys(wk).forEach(key=>{
      if(profileCropName(id, key) === crop) t += Number(wk[key]) || 0;
    });
  }
  return t;
}
/* ---- Actual harvest comes from the dated entries -----------------------
   The plan is still a grid of weeks. Actual is not: reworking the harvest
   screens moved it to dated entries against a crop profile, and nothing has
   written the old actual grid since. Every association-wide figure kept
   reading that grid, so the Central dashboard, the reports and growth
   planning have been showing nought actual for every farm — the figures
   were there the whole time, in a shape nobody was reading.

   Derive it instead. One pass over a farm's entries, bucketed the same way
   the plan is: year, month, and the week of that month the date falls in. */
function actualBuckets(id, year){
  const out = {};
  harvestEntries(id).forEach(e=>{
    if(!e.date) return;
    const d = new Date(e.date + 'T00:00:00');
    if(isNaN(d) || d.getFullYear() !== Number(year)) return;
    const mo = d.getMonth() + 1, wk = weekOfMonth(d);
    const key = e.profileId || e.crop || 'unknown';
    ((out[mo] = out[mo] || {})[wk] = out[mo][wk] || {});
    out[mo][wk][key] = (out[mo][wk][key] || 0) + toKg(e.amount, e.unit || 'kg');
  });
  return out;
}
function actualWeek(id, year, month, week){
  const b = actualBuckets(id, year);
  return (b[month] && b[month][week]) || null;
}

/* The one place the two shapes are reconciled. Everything association-wide
   goes through here, so neither the plan grid nor the entries needs to know
   the other exists. */
function harvestWeekAny(id, kind, year, month, week){
  return kind === 'actual' ? actualWeek(id, year, month, week)
                           : harvestWeek(id, kind, year, month, week);
}

function weekTotal(id, kind, year, month, week){
  const wk = harvestWeekAny(id, kind, year, month, week);
  if(!wk) return 0;
  return Object.keys(wk).reduce((t,cr)=> t + (Number(wk[cr])||0), 0);
}
function memberMonthTotal(id, kind, year, month){
  let t=0; for(let w=1; w<=4; w++){ t += weekTotal(id, kind, year, month, w); } return t;
}
function memberYearTotal(id, kind, year){
  let t=0; for(let m=1; m<=12; m++){ t += memberMonthTotal(id, kind, year, m); } return t;
}
function coopWeekTotal(kind, year, month, week){
  let t=0; activeMembers().forEach(id=> t += weekTotal(id, kind, year, month, week)); return t;
}
function coopMonthTotal(kind, year, month){
  let t=0; activeMembers().forEach(id=> t += memberMonthTotal(id, kind, year, month)); return t;
}
function coopYearTotal(kind, year){
  let t=0; activeMembers().forEach(id=> t += memberYearTotal(id, kind, year)); return t;
}
function coopCapacityByCrop(kind, year, month){
  return activeCrops().map(cr=>{ let t=0; activeMembers().forEach(id=> t += memberMonthCropTotal(id, kind, year, month, cr)); return t; });
}
function coopWeekByCrop(kind, year, month, week){
  return activeCrops().map(cr=>{ let t=0; activeMembers().forEach(id=>{
    const wk = harvestWeekAny(id, kind, year, month, week);
    if(!wk) return;
    Object.keys(wk).forEach(key=>{
      if(profileCropName(id, key) === cr) t += Number(wk[key]) || 0;
    });
  }); return t; });
}
function pct(actual, plan){ return plan>0 ? Math.round(actual/plan*100) : (actual>0 ? 100 : 0); }

/* ============================================================
   Charts

   Drawn as inline SVG. No library: a charting bundle is 60-200KB
   over a Tanzanian mobile connection to draw twelve points, and it
   would be the heaviest thing on the page by a wide margin.

   Plan is a dashed line, actual is solid and filled. That is
   deliberate — a reader who cannot separate the two greens still
   has the line style, and colour is never the only thing carrying
   the meaning. Every chart is followed by the same numbers as text.
   ============================================================ */
function niceCeil(n){
  if(n <= 0) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(n)));
  return Math.ceil(n / mag) * mag;
}

function trendChart(title, labels, plan, actual){
  const W = 720, H = 240, padL = 52, padR = 14, padT = 16, padB = 30;
  const max = niceCeil(Math.max(1, ...plan, ...actual));
  const n = Math.max(labels.length, 2);
  const x = i => padL + (i * (W - padL - padR)) / (n - 1);
  const y = v => padT + (H - padT - padB) * (1 - (v / max));
  const line = arr => arr.map((v,i)=> `${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = arr => `${line(arr)} L${x(arr.length-1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const ticks = [0, .25, .5, .75, 1].map(f=> Math.round(max * f));

  return `<div class="chart-wrap">
    <svg class="trend" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="${esc(title)}. Planned against actual harvest, in kilograms, by month.">
      <defs>
        <linearGradient id="fillActual" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--leaf-green)" stop-opacity=".42"/>
          <stop offset="100%" stop-color="var(--leaf-green)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${ticks.map(t=>`<g>
        <line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" class="gridline"/>
        <text x="${padL-8}" y="${y(t)+4}" class="axis" text-anchor="end">${fmt(t)}</text>
      </g>`).join('')}
      ${labels.map((l,i)=> i % Math.ceil(n/6) ? '' :
        `<text x="${x(i)}" y="${H-9}" class="axis" text-anchor="middle">${esc(l)}</text>`).join('')}
      <path d="${area(actual)}" fill="url(#fillActual)" class="ink"/>
      <path d="${line(plan)}"   class="ink series-plan"/>
      <path d="${line(actual)}" class="ink series-actual"/>
      ${actual.map((v,i)=> `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" class="dot ink"><title>${esc(labels[i])}: ${fmt(v)} kg actual</title></circle>`).join('')}
    </svg>
    <div class="chart-key">
      <span><i class="k-plan"></i>Planned <em>dashed</em></span>
      <span><i class="k-actual"></i>Actual <em>solid</em></span>
    </div>
  </div>`;
}

/* One series, for prices — there is no plan to compare a market price to,
   so drawing a flat zero line beside it would be a lie about the data. */
function priceTrend(title, labels, values){
  const clean = labels.map((_,i)=> Number(values[i]) || 0);
  return trendChart(title, labels, clean, clean).replace(
    /<path d="[^"]*" class="ink series-plan"><\/path>|<path d="[^"]*" class="ink series-plan"\/>/, '')
    .replace('<span><i class="k-plan"></i>Planned <em>dashed</em></span>', '');
}

/* Grouped bars — planned beside actual, week by week. Actual is solid,
   planned is hatched, so the pair reads without relying on the two greens
   being told apart. */
function barChart(labels, planned, actual){
  const W = 720, H = 210, padL = 52, padR = 12, padT = 14, padB = 28;
  const max = niceCeil(Math.max(1, ...planned, ...actual));
  const n = Math.max(labels.length, 1);
  const band = (W - padL - padR) / n;
  const bw = Math.min(26, band * 0.30);
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const h = v => (H - padT - padB) * (v / max);
  const ticks = [0, .5, 1].map(f=> Math.round(max * f));
  return `<div class="chart-wrap">
    <svg class="trend bars" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Planned against actual harvest in kilograms, by week.">
      <defs>
        <pattern id="hatchPlan" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <rect width="6" height="6" fill="rgba(64,94,53,.14)"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="var(--tipfa-green)" stroke-width="2.4"/>
        </pattern>
      </defs>
      ${ticks.map(t=>`<g>
        <line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" class="gridline"/>
        <text x="${padL-8}" y="${y(t)+4}" class="axis" text-anchor="end">${fmt(t)}</text></g>`).join('')}
      ${labels.map((l,i)=>{
        const cx = padL + band*i + band/2;
        return `<g>
          <rect x="${cx - bw - 3}" y="${y(planned[i]||0)}" width="${bw}" height="${h(planned[i]||0)}"
                rx="4" fill="url(#hatchPlan)" class="bar-p" style="--bh:${h(planned[i]||0)}px;">
            <title>${esc(l)}: ${fmt(planned[i]||0)} kg planned</title></rect>
          <rect x="${cx + 3}" y="${y(actual[i]||0)}" width="${bw}" height="${h(actual[i]||0)}"
                rx="4" fill="var(--leaf-green)" class="bar-a" style="--bh:${h(actual[i]||0)}px;">
            <title>${esc(l)}: ${fmt(actual[i]||0)} kg actual</title></rect>
          <text x="${cx}" y="${H-8}" class="axis" text-anchor="middle">${esc(l)}</text>
        </g>`;
      }).join('')}
    </svg>
    <div class="chart-key">
      <span><i class="k-hatch"></i>Planned <em>hatched</em></span>
      <span><i class="k-solid"></i>Actual <em>solid</em></span>
    </div>
  </div>`;
}

/* A donut for the share of the month's harvest by crop. Each slice is
   labelled with its own name and figure beside the ring, so nobody has to
   match a colour to a legend. */
function donutChart(labels, values){
  const total = values.reduce((a,b)=> a + (Number(b)||0), 0);
  if(!total) return '<p class="helper">Nothing harvested in this month yet.</p>';
  const r = 62, sw = 26, C = 2*Math.PI*r;
  let acc = 0;
  const slices = values.map((v,i)=>{
    const frac = (Number(v)||0) / total;
    const seg = `<circle cx="80" cy="80" r="${r}" class="slice"
      style="stroke:${CHART_SERIES[i % CHART_SERIES.length]};
             stroke-dasharray:${(C*frac).toFixed(2)} ${(C*(1-frac)).toFixed(2)};
             stroke-dashoffset:${(-C*acc).toFixed(2)};
             animation-delay:${(i*0.09).toFixed(2)}s;">
      <title>${esc(labels[i])}: ${fmt(Math.round(v))} kg, ${Math.round(frac*100)}%</title></circle>`;
    acc += frac;
    return seg;
  }).join('');
  return `<div class="donut-wrap">
    <svg viewBox="0 0 160 160" class="donut" role="img"
         aria-label="Share of this month's harvest by crop.">
      <circle cx="80" cy="80" r="${r}" class="donut-track" style="stroke-width:${sw};"/>
      <g style="stroke-width:${sw};">${slices}</g>
    </svg>
    <ul class="donut-key">
      ${labels.map((l,i)=>`<li>
        <i style="background:${CHART_SERIES[i % CHART_SERIES.length]};"></i>
        <span>${esc(l)}</span>
        <strong>${fmt(Math.round(values[i]||0))} kg</strong>
        <em>${Math.round(((values[i]||0)/total)*100)}%</em>
      </li>`).join('')}
    </ul>
  </div>`;
}

/* A ring that fills to the figure. The number is inside it and is the
   thing that matters; the ring is how far round it went. */
function ringGauge(label, value, suffix){
  const v = Math.max(0, Math.min(100, Number(value) || 0));
  const r = 42, C = 2 * Math.PI * r;
  const tone = v >= 95 ? 'var(--leaf)' : (v >= 70 ? 'var(--gold)' : 'var(--red)');
  return `<div class="ring" role="img" aria-label="${esc(label)}: ${v}${esc(suffix||'')}">
    <svg viewBox="0 0 110 110">
      <circle cx="55" cy="55" r="${r}" class="ring-track"/>
      <circle cx="55" cy="55" r="${r}" class="ring-fill"
        style="stroke:${tone};stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${C.toFixed(1)};
               --ring-to:${(C * (1 - v/100)).toFixed(1)};"/>
    </svg>
    <div class="ring-mid"><strong data-count="${v}" data-suffix="${esc(suffix||'')}">0</strong></div>
    <div class="ring-lbl">${esc(label)}</div>
  </div>`;
}

function comparisonBar(label, plan, actual){
  const p = pct(actual, plan);
  const barColor = p>=95 ? 'var(--leaf)' : (p>=70 ? 'var(--gold)' : 'var(--red)');
  return `<div style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;">
      <span>${label}</span><span>${fmt(actual)} / ${fmt(plan)} kg · ${p}% of plan</span>
    </div>
    <div style="height:10px;background:#E4E2D4;border-radius:99px;overflow:hidden;">
      <div class="bar-fill" style="height:100%;width:${Math.min(p,100)}%;background:${barColor};border-radius:99px;
        animation:barGrow .95s var(--ease-out) both;"></div>
    </div>
  </div>`;
}

function selectMonth(m){ state.selMonth = m; state.selMonths = [m]; render(); }
function selectWeek(w){ state.selWeek = w; render(); }
// On the harvest plan several months can be picked together; the totals
// follow the whole selection. One month always stays selected.
function toggleMonth(m){
  const i = state.selMonths.indexOf(m);
  if(i === -1) state.selMonths.push(m);
  else if(state.selMonths.length > 1) state.selMonths.splice(i, 1);
  state.selMonth = state.selMonths[state.selMonths.length-1];
  render();
}
function monthWeekChips(opts){
  opts = opts || {};
  const months = `<div class="chips">${MONTHS.map((mName,i)=>{
    const m = i + 1;
    const on = opts.multi ? state.selMonths.indexOf(m) !== -1 : state.selMonth === m;
    return `<span class="chip ${on?'active':''}" onclick="${opts.multi?`toggleMonth(${m})`:`selectMonth(${m})`}">${mName.slice(0,3)}</span>`;
  }).join('')}</div>`;
  const weeks = opts.weeks === false ? '' :
    `<div class="chips">${[1,2,3,4].map(w=>`<span class="chip ${state.selWeek===w?'active':''}" onclick="selectWeek(${w})">Week ${w}</span>`).join('')}</div>`;
  return months + weeks;
}

// What active farms have listed across their calendars, by product.
function coopInputNeeds(){
  const tally = {};
  activeMembers().forEach(id=> (MEMBERS[id].crops||[]).forEach(cr=>{ ensureProgramme(cr);
    CROP_STAGES.forEach(st=> stageItems(cr, st).forEach(x=>{
      const key = x.cat + '|' + (x.entry.product||'').trim().toLowerCase();
      if(!key.endsWith('|')) {
        if(!tally[key]) tally[key] = {product:x.entry.product, cat:x.cat, farms:{}, listed:0, applied:0, doses:{}};
        const t = tally[key];
        t.farms[id] = true; t.listed++;
        if(x.entry.done) t.applied++;
        const u = x.entry.unit || '';
        const d = Number(x.entry.dose)||0;
        if(d) t.doses[u] = (t.doses[u]||0) + d;
      }
    }));
  }));
  return Object.values(tally)
    .map(t=> Object.assign(t, {farmCount:Object.keys(t.farms).length,
      doseText:Object.keys(t.doses).map(u=>`${fmt(Math.round(t.doses[u]*100)/100)} ${u}`).join(' + ') || '—'}))
    .sort((a,b)=> b.farmCount-a.farmCount || b.listed-a.listed || a.product.localeCompare(b.product));
}

/* ============================================================
   Backup and restore
   This platform keeps everything in the browser it is used in, so a
   farm registered on one phone is not visible on another. Until it
   runs against a server, a backup file is how records move between
   devices: export here, open the file on the other device, restore.
   ============================================================ */
const BACKUP_VERSION = 1;

function buildBackup(){
  return {
    tipfa: 'association-platform-backup',
    version: BACKUP_VERSION,
    takenAt: new Date().toISOString(),
    takenBy: state.adminName || 'operator',
    counts: { farms:Object.keys(MEMBERS).length, operators:ADMINS.length },
    settings: SETTINGS,
    members: MEMBERS,
    harvest: harvest,
    inputs: inputsData,
    complaints: complaints,
    nextComplaintId: nextComplaintId,
    admins: ADMINS
  };
}

function exportBackup(){
  const data = buildBackup();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `TIPFA_backup_${todayStr()}.json`;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  logAction(`Operator ${state.adminName||''} exported a full backup (${data.counts.farms} farms, ${data.counts.operators} operators).`);
}

function restoreBackup(input){
  const file = input.files && input.files[0];
  const out = document.getElementById('restore-result');
  const show = (msg, bad)=>{ if(out){ out.className = 'import-result' + (bad?' bad':''); out.innerHTML = msg; } };
  if(!file) return;
  const mode = document.getElementById('restore-mode').value;
  const reader = new FileReader();
  reader.onerror = ()=> show('That file could not be read.', true);
  reader.onload = ()=>{
    let d;
    try { d = JSON.parse(String(reader.result)); }
    catch(e){ show('That file is not a TIPFA backup — it could not be read as JSON.', true); return; }
    if(!d || d.tipfa !== 'association-platform-backup' || !d.members){
      show('That file is not a TIPFA backup. Export one from the other device using the button above.', true);
      return;
    }

    let addedFarms = 0, keptFarms = 0, addedOps = 0;
    if(mode === 'replace'){
      MEMBERS = d.members || {};
      harvest = d.harvest || {};
      inputsData = d.inputs || {};
      complaints = Array.isArray(d.complaints) ? d.complaints : [];
      nextComplaintId = d.nextComplaintId || (complaints.length + 1);
      if(Array.isArray(d.admins) && d.admins.length) ADMINS = d.admins;
      if(d.settings) { SETTINGS = Object.assign({}, DEFAULT_SETTINGS, d.settings); saveSettings(); }
      addedFarms = Object.keys(MEMBERS).length;
    } else {
      // Merge: a farm already here wins, so nothing recorded on this device
      // is overwritten by an older file.
      Object.keys(d.members || {}).forEach(id=>{
        const incoming = d.members[id];
        const clash = findMemberByLogin(incoming.phone) || (incoming.email && findMemberByLogin(incoming.email));
        if(MEMBERS[id] || clash){ keptFarms++; return; }
        MEMBERS[id] = incoming;
        if(d.harvest && d.harvest[id]) harvest[id] = d.harvest[id];
        if(d.inputs && d.inputs[id]) inputsData[id] = d.inputs[id];
        if(!harvest[id] || !inputsData[id]) createBlankRecords(id);
        addedFarms++;
      });
      (d.complaints || []).forEach(x=>{
        if(!complaints.some(y=> y.member===x.member && y.text===x.text && y.type===x.type)){
          complaints.push(Object.assign({}, x, {id: nextComplaintId++}));
        }
      });
      (d.admins || []).forEach(a=>{
        if(!ADMINS.some(x=> norm(x.username) === norm(a.username))){ ADMINS.push(a); addedOps++; }
      });
    }

    // Bring everything restored up to the current record shape.
    Object.keys(MEMBERS).forEach(id=>{
      const m = MEMBERS[id];
      if(!Array.isArray(m.crops)) m.crops = [];
      m.crops.forEach(ensureProgramme);
      if(!harvest[id] || !inputsData[id]) createBlankRecords(id);
    });
    saveAdmins(); saveMembers();
    input.value = '';
    logAction(`Operator ${state.adminName||''} restored a backup taken ${d.takenAt ? d.takenAt.slice(0,10) : 'earlier'} (${mode === 'replace' ? 'replacing this device' : 'merging'}).`);
    state.restoreMsg = mode === 'replace'
      ? `${CHECK_ICON} Restored ${Object.keys(MEMBERS).length} farm${Object.keys(MEMBERS).length===1?'':'s'} and ${ADMINS.length} operator account${ADMINS.length===1?'':'s'} from the backup. This device now matches the file.`
      : `${CHECK_ICON} Merged: ${addedFarms} farm${addedFarms===1?'':'s'} added, ${keptFarms} already here and left untouched, ${addedOps} operator account${addedOps===1?'':'s'} added.`;
    render();
  };
  reader.readAsText(file);
}

          <button class="btn small gold" onclick="setSignupCode('admin')">Update operator code</button>
        </div>
      </div>
      <p class="helper" id="code-msg" style="margin-top:8px;"></p>
      <p class="helper">Keep the two different. A farm holding the operator code could create itself an administrator account.</p>
    </div>`;
}

function backupPanel(){
  const msg = state.restoreMsg; state.restoreMsg = '';
  return `
    <div class="section-label">Moving records between devices</div>
    <div class="card import-card">
      <p class="helper" style="margin:0 0 4px;"><strong>This platform stores its records in the browser it is used in.</strong>
        A farm that registers on one phone is not visible on another device, and an operator account created here does not exist
        elsewhere. Until the platform runs against a shared server, this is how records travel.</p>
      <p class="helper" style="margin:8px 0;"><strong>Shared database:</strong> ${esc(cloudStatusText())}${CLOUD.detail ? ` — ${esc(CLOUD.detail)}` : ''}</p>
      <div class="import-opts">
        <button class="btn small gold" onclick="exportBackup()">Download a backup of everything</button>
      </div>
      <p class="helper" style="margin:2px 0 8px;">Then, on the other device, sign in as an operator and restore that file here:</p>
      <div class="import-opts">
        <select id="restore-mode" style="max-width:100%;margin:0;">
          <option value="merge">Merge — add what is missing, keep what is here</option>
          <option value="replace">Replace — make this device match the file exactly</option>
        </select>
        <input type="file" accept=".json,application/json" id="restore-file" style="width:auto;margin:0;" onchange="restoreBackup(this)">
      </div>
      ${msg ? `<div class="import-result">${msg}</div>` : '<div id="restore-result"></div>'}
      <p class="helper">The backup carries every farm, crop calendar, harvest figure, price, archive and operator account.
        Merging never overwrites a farm already on this device. Replacing discards what is here, so take a backup of this
        device first if it holds anything you need.</p>
    </div>`;
}

function renderGovernance(c){
  // The roll is the association's, not this browser's, so it is read when the
  // page is opened rather than only at sign-in — an operator who signed up
  // since would otherwise be missing until the next sign-in.
  if(cloudOn() && !state.rollRead){
    state.rollRead = true;
    cloudPullOperators().then(()=> cloudPullUsers()).then(()=> render());
  }
  c.innerHTML = `
    <h1 class="page-title">Governance</h1>
    <p class="page-sub">Oversight, compliance, and transparency</p>
    <div class="card">
      <p style="font-size:13.5px;line-height:1.6;margin:0 0 10px;">Every member has an individual, secure login; data is editable only by its owner or an authorised operator. Association-wide figures are visible only in aggregate, and every operator-entered record is logged with a name and timestamp below for auditability and compliance with the TIPFA constitution.</p>
    </div>
    <div class="section-label">Administrator accounts (${ADMINS.length}/${MAX_ADMINS})</div>
    <div class="card">
      ${state.govError ? `<p class="helper cat-local">${esc(state.govError)}</p>${(state.govError='')||''}` : ''}
      <table class="grid-table"><thead><tr><th>Name</th><th>Operator ID / email</th><th>Role</th><th>Account</th><th></th></tr></thead>
      <tbody>${ADMINS.map((a,i)=>`<tr>
        <td>${esc(a.name)}</td><td>${esc(a.username)}</td>
        <td>${roleCell(a)}</td>
        <td>${a.localOnly
              ? '<span class="helper" style="color:var(--red);">this device only</span>'
              : `<span class="helper">shared${a.since?` · since ${esc(a.since)}`:''}</span>`}</td>
        <td>${norm(a.username) === norm(CLOUD_STATE.email || '')
              ? '<span class="helper">signed in now</span>'
              : `<button class="btn small ghost" style="color:var(--red);border-color:var(--red);" onclick="removeAdmin(${i})">Remove</button>`}</td>
      </tr>`).join('')}</tbody></table>
      ${roleNote()}
      ${handOverPanel()}
      ${cloudOn() ? `
        <p class="helper" style="margin-top:12px;">This is the association's roll, read from the shared database, so an operator who signed up on any device appears here.
        A new operator creates their own account from the Administrator tab of the sign-in screen, quoting the operator sign-up code below — an account cannot be made for someone else from here, because only they can set their own password.</p>
        <button class="btn small ghost" onclick="refreshOperators()">Refresh the roll</button>
      ` : `
        <div class="section-label" style="margin-top:16px;">Add administrator</div>
        <p class="helper" style="margin:0 0 8px;">Not connected to the shared database, so this account will exist on this device only until the database is reachable.</p>
        <div class="grid2">
          <div><label class="f">Full name</label><input id="newadmin-name"></div>
          <div><label class="f">Operator ID / email</label><input id="newadmin-user"></div>
        </div>
        <label class="f">Password</label>${pwdField('newadmin-pass','Set a password')}
        <button class="btn small" style="margin-top:6px;" onclick="addAdmin()">Add administrator</button>
        <p class="helper" id="newadmin-error" style="color:var(--red);margin-top:8px;"></p>
      `}
    </div>
    ${codesPanel()}
    ${backupPanel()}
    <div class="section-label">Audit log</div>
    <div class="card">${auditLog.slice(0,12).map((l,i)=>
      `<div class="log-item" style="animation-delay:${Math.min(i,10)*40}ms"><span class="t">${l.time}</span><span>${esc(l.text)}</span></div>`
    ).join('')}</div>`;
}
/* What an operator may do, and — for the system owner alone — a way to
   change it. Everyone else sees the role as a plain word: the control is
   hidden because it would only be refused, not because hiding it is what
   stops them. The database is what stops them. */
/* System owner is not in this list on purpose. It is not a role you pick
   from a menu, because picking it from a menu is how an association ends up
   with two of them. It is handed over — see handOverOwnership below. */
const STAFF_ROLES = ['secretariat','qualityOfficer','agronomist','logistics','auditor'];

function roleCell(a){
  const rec = a.uid ? USERS[a.uid] : null;
  const role = rec ? rec.role : '';
  const suspended = rec && rec.status && rec.status !== 'active';
  if(!a.uid) return '<span class="helper">\u2014</span>';
  if(!rec) return '<span class="helper">not recorded yet</span>';
  if(!can('roles.write') || roleIs() !== 'superAdmin'){
    return `<span class="helper">${esc(roleLabel(role))}${suspended ? ' \u00b7 suspended' : ''}</span>`;
  }
  const mine = a.uid === CLOUD_STATE.uid;
  // The owner's own row shows what they are and offers no menu: an owner
  // demoting themselves is how an association is left with none.
  if(role === 'superAdmin'){
    return `<span class="status-pill status-active">System owner</span>
      ${mine ? '<div class="helper" style="margin-top:4px;">This is you.</div>' : ''}`;
  }
  return `<select class="small" onchange="setAdminRole('${esc(a.uid)}', this.value)"${mine?' disabled':''}>
      ${STAFF_ROLES.map(r=>`<option value="${r}"${r===role?' selected':''}>${esc(roleLabel(r))}</option>`).join('')}
      ${STAFF_ROLES.indexOf(role) === -1 && role ? `<option value="${esc(role)}" selected>${esc(roleLabel(role))}</option>` : ''}
    </select>
    ${mine ? '' : `
      <button class="btn small ghost" style="margin-left:6px;" onclick="setAdminStatus('${esc(a.uid)}', '${suspended ? 'active' : 'suspended'}')">${suspended ? 'Restore' : 'Suspend'}</button>
      <button class="btn small ghost" style="margin-left:6px;" onclick="askHandOver('${esc(a.uid)}')">Make system owner</button>`}`;
}

/* ---- Handing the association over ------------------------------------
   There is one system owner, always. Making somebody else the owner is
   therefore not a promotion but a transfer: the claim moves first, then
   they become the owner, then you become Secretariat. Doing it in that
   order means there is never a moment with two owners or none, and the
   rules only accept the role for whoever the claim names.

   It cannot be undone from this side afterwards. Once the claim has moved
   you are Secretariat, and only the new owner can give it back. */
function askHandOver(uid){ state.handOver = uid; render(); }
function cancelHandOver(){ state.handOver = null; render(); }

function handOverPanel(){
  if(!state.handOver) return '';
  const rec = USERS[state.handOver] || {};
  const who = rec.displayName || rec.email || state.handOver;
  return `<div class="card" style="border-color:var(--harvest-orange);">
    <strong>Hand the association over to ${esc(who)}?</strong>
    <p class="helper" style="margin-top:6px;">They become the system owner and you become Secretariat. There is only ever one system owner, so this is a handover, not a second one.</p>
    <p class="helper">You will no longer be able to change anyone's role, including your own. Only ${esc(who)} can give it back.</p>
    <div style="margin-top:10px;">
      <button class="btn small" onclick="handOverOwnership('${esc(state.handOver)}')">Yes, hand it over</button>
      <button class="btn small ghost" onclick="cancelHandOver()">Cancel</button>
    </div>
  </div>`;
}

async function handOverOwnership(uid){
  const me = CLOUD_STATE.uid;
  if(!uid || !me || uid === me) return;
  const rec = USERS[uid] || {};
  const who = rec.displayName || rec.email || uid;
  state.handOver = null;
  try{
    // The claim moves first, and only the owner may move it. Until it has
    // moved, the rules will not accept the role for anybody.
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'settings', 'ownership'),
                 { owner: uid, claimedAt: new Date().toISOString(), handedOverBy: me }, {merge:true});
    await cloudSetUserField(uid, 'role', 'superAdmin');
    await cloudSetUserField(me,  'role', 'secretariat');
    await cloudPullUsers();
    state.orderMsg = `${who} is now the system owner. You are Secretariat.`;
    logAction(`Operator ${state.adminName||''} handed system ownership to ${who}.`);
  }catch(e){
    state.orderError = 'The handover did not complete: ' + ((e && e.message) || e) +
      ' — check the Governance roll to see who holds ownership before trying again.';
  }
  render();
}

function roleNote(){
  if(!cloudOn()) return '';
  if(roleIs() === 'superAdmin')
    return '<p class="helper" style="margin-top:10px;">You are the system owner, so you are the only account that may change a role or suspend an operator. Your own row is fixed \u2014 an owner cannot demote themselves and leave the association with none.</p>';
  return `<p class="helper" style="margin-top:10px;">Roles are set by the system owner. Yours is <strong>${esc(roleLabel(roleIs()))}</strong>.</p>`;
}

function setAdminRole(uid, role){
  cloudSetUserField(uid, 'role', role).then(()=>{
    const who = (USERS[uid] && USERS[uid].displayName) || uid;
    logAction(`Operator ${state.adminName||''} set ${who}'s role to ${roleLabel(role)}.`);
    render();
  }).catch(e=>{
    state.govError = 'That role could not be changed: ' + ((e && e.message) || e);
    render();
  });
}

function setAdminStatus(uid, status){
  cloudSetUserField(uid, 'status', status).then(()=>{
    const who = (USERS[uid] && USERS[uid].displayName) || uid;
    logAction(`Operator ${state.adminName||''} set ${who}'s account to ${status}.`);
    render();
  }).catch(e=>{
    state.govError = 'That account could not be changed: ' + ((e && e.message) || e);
    render();
  });
}

// Read the roll again without signing out and back in.
function refreshOperators(){
  state.rollRead = true;
  cloudPullOperators().then(async n=>{
    await cloudPullUsers();
    state.govError = '';
    logAction(`Operator ${state.adminName||''} refreshed the administrator roll (${n} account${n===1?'':'s'}).`);
    render();
  });
}

function addAdmin(){
  if(ADMINS.length >= MAX_ADMINS) return;
  const name = document.getElementById('newadmin-name').value.trim();
  const user = document.getElementById('newadmin-user').value.trim();
  const pass = document.getElementById('newadmin-pass').value;
  if(!name || !user || !pass){
    document.getElementById('newadmin-error').textContent = 'Enter a name, operator ID, and password.';
    return;
  }
  if(ADMINS.some(a=>norm(a.username)===norm(user))){
    document.getElementById('newadmin-error').textContent = 'That operator ID is already in use.';
    return;
  }
  ADMINS.push({name, username:user, password:pass});
  saveAdmins();
  logAction(`Operator ${state.adminName||''} added a new administrator account: ${name}.`);
  render();
}
function removeAdmin(i){
  const removed = ADMINS[i];
  if(ADMINS.length <= 1){
    logAction(`Operator ${state.adminName||''} attempted to remove the last administrator account — blocked.`);
    render();
    return;
  }
  if(removed && removed.uid) cloudDeleteOperator(removed.uid);
  ADMINS.splice(i,1);
  saveAdmins();
  logAction(`Operator ${state.adminName||''} removed administrator account: ${removed.name}.`);
  render();
}

guardAdminWrites();
loadSettings();
loadMembers();
loadCatalogue();
loadInputCatalogue();
render();
// Safe to touch `state` from here on.
cloudPushHook = function(){
  if(state.role === 'member' && state.member) cloudPushSoon(state.member);
};
// Reloading the page is not signing out. Whoever this browser is already
// signed in as is picked back up once the database is reachable — and if it
// never becomes reachable, a local session is restored instead.
initCloud().then(()=> restoreSession()).catch(()=> restoreSession());
</script>
</body>
</html>
