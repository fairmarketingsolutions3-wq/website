const INPUTS_KEY = 'tipfa.inputs.v1';
let INPUT_CATALOGUE = [];
let INPUT_REQUESTS = [];
let INPUT_SUGGESTIONS = [];

function inputId(){
  return `inp-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
}

/* One row of the price list, in the shape the rest of the platform uses.
   `available` is what lets the Secretariat take something off the shelf
   without deleting it and losing the requests that point at it. */
function inputRow(x){
  return {
    id: x.id || inputId(),
    cat: x.cat || 'Other',
    name: x.name || '',
    variant: x.variant || '',
    specs: Array.isArray(x.specs) ? x.specs : [],
    price: x.price == null ? null : Number(x.price),
    unit: x.unit || 'each',
    note: x.note || '',
    available: x.available !== false
  };
}

function seedInputCatalogue(){
  return SEED_INPUTS.map(inputRow);
}

function inputLabel(x){
  return x.variant ? `${x.name} — ${x.variant}` : x.name;
}
function inputById(id){ return INPUT_CATALOGUE.find(x=> x.id === id) || null; }
function inputCategories(){
  const out = [];
  INPUT_CATALOGUE.forEach(x=>{ if(!out.includes(x.cat)) out.push(x.cat); });
  return out;
}
/* A price of null is something the sheet marked as coming soon. It stays on
   the list, because a member should know it exists, but it cannot be put in
   a basket — there is no figure to total. */
function inputPriced(x){ return x && x.price != null && x.price > 0; }
function priceText(x){
  if(!inputPriced(x)) return x && x.note ? x.note : 'Price on request';
  return fmt(x.price) + ' TZS';
}

function saveInputCatalogue(){
  try{ localStorage.setItem(INPUTS_KEY, JSON.stringify(INPUT_CATALOGUE)); }catch(e){ /* storage full */ }
  cloudPushInputCatalogue();
}

function loadInputCatalogue(){
  try{
    const raw = localStorage.getItem(INPUTS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d) && d.length){ INPUT_CATALOGUE = d.map(inputRow); return; }
    }
  }catch(e){ /* fall through to the price list */ }
  INPUT_CATALOGUE = seedInputCatalogue();
  try{ localStorage.setItem(INPUTS_KEY, JSON.stringify(INPUT_CATALOGUE)); }catch(e){}
}

/* The store is the Secretariat's to keep, and every signed-in member reads
   it — the same shape as the crop catalogue, and the same rule behind it. */
async function cloudPushInputCatalogue(){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator') return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'settings', 'inputCatalogue'),
                 { items: INPUT_CATALOGUE, updatedAt: new Date().toISOString() });
  }catch(e){ noteCloudRefusal(e, 'The input list', 'settings'); }
}

async function cloudPullInputCatalogue(){
  if(!cloudOn()) return 0;
  try{
    const { doc, getDoc } = CLOUD.fs;
    const d = await getDoc(doc(CLOUD.db, 'settings', 'inputCatalogue'));
    if(d.exists()){
      const items = (d.data() || {}).items;
      if(Array.isArray(items) && items.length){
        INPUT_CATALOGUE = items.map(inputRow);
        try{ localStorage.setItem(INPUTS_KEY, JSON.stringify(INPUT_CATALOGUE)); }catch(e){}
        return INPUT_CATALOGUE.length;
      }
    }
    // Nothing shared yet. The first operator to open the tab publishes the
    // price list, so every member is reading the same one from then on.
    if(CLOUD_STATE.role === 'operator' && INPUT_CATALOGUE.length) await cloudPushInputCatalogue();
  }catch(e){ /* the built-in list still works on this device */ }
  return 0;
}

/* ---- A basket, and what becomes of it --------------------------------
   A member ticks off what they need, sees what it comes to, and sends it.
   The basket lives in this browser until it is sent — an unsent basket is
   not the association's business — and becomes an inputRequests document
   the moment the member presses the button.

   A suggestion is the other half: the thing that is not on the list. Other
   members back it, and a suggestion several farms want is an easier case
   for the Secretariat to act on than one farm asking twice. */
const REQUEST_STATUS = ['Sent','Acknowledged','Quoted','Supplied','Declined'];
const CART_KEY = 'tipfa.cart.v1';
let CART = {};                                   // inputId -> quantity

function saveCart(){
  try{ localStorage.setItem(CART_KEY, JSON.stringify({member:state.member, cart:CART})); }catch(e){}
}
function loadCart(){
  try{
    const d = JSON.parse(localStorage.getItem(CART_KEY) || 'null');
    CART = (d && d.member === state.member && d.cart) ? d.cart : {};
  }catch(e){ CART = {}; }
}
function cartLines(){
  return Object.keys(CART).map(id=>{
    const x = inputById(id);
    if(!x || !CART[id]) return null;
    const qty = Number(CART[id]) || 0;
    return { id, item:x, qty, line: inputPriced(x) ? x.price * qty : 0 };
  }).filter(Boolean);
}
function cartCount(){ return cartLines().reduce((t,l)=> t + l.qty, 0); }
function cartTotal(){ return cartLines().reduce((t,l)=> t + l.line, 0); }

function setCartQty(id, qty){
  const n = Math.max(0, Math.floor(Number(qty) || 0));
  if(n <= 0) delete CART[id]; else CART[id] = n;
  saveCart();
}
function addToCart(id){ setCartQty(id, (Number(CART[id]) || 0) + 1); render(); }
function cartBump(id, by){ setCartQty(id, (Number(CART[id]) || 0) + by); render(); }
function cartSet(id, v){ setCartQty(id, v); render(); }
function emptyCart(){ CART = {}; saveCart(); render(); }

async function cloudPushRequest(r){
  if(!cloudOn() || !r || !r.id) return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'inputRequests', r.id), {
      farmUid:r.farmUid, farmName:r.farmName || '', items:r.items || [],
      total:Number(r.total)||0, status:r.status || 'Sent', note:r.note || '',
      raisedOn:r.raisedOn, reply:r.reply || '', created:r.created
    }, {merge:true});
  }catch(e){ noteCloudRefusal(e, 'Your input request', 'inputRequests'); }
}

async function cloudPushSuggestion(x){
  if(!cloudOn() || !x || !x.id) return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'inputSuggestions', x.id), {
      farmUid:x.farmUid, farmName:x.farmName || '', name:x.name,
      why:x.why || '', backers:x.backers || [], status:x.status || 'Open',
      raisedOn:x.raisedOn, created:x.created
    }, {merge:true});
  }catch(e){ noteCloudRefusal(e, 'Your suggestion', 'inputSuggestions'); }
}

async function cloudPullInputs(){
  if(!cloudOn()) return 0;
  const fs = CLOUD.fs;
  const staff = CLOUD_STATE.role === 'operator';
  const uid = CLOUD_STATE.uid;
  let n = 0;
  await cloudPullInputCatalogue();
  // Requests are a farm's own business; suggestions are everybody's, because
  // backing one is the point of it.
  try{
    let snap;
    if(staff) snap = await fs.getDocs(fs.collection(CLOUD.db, 'inputRequests'));
    else if(uid && fs.query && fs.where)
      snap = await fs.getDocs(fs.query(fs.collection(CLOUD.db, 'inputRequests'),
                                       fs.where('farmUid','==',uid)));
    if(snap){
      const seen = {};
      snap.forEach(d=>{
        const v = d.data() || {}; seen[d.id] = true;
        const at = INPUT_REQUESTS.findIndex(x=> x.id === d.id);
        const rec = Object.assign({}, v, { id:d.id });
        if(at === -1) INPUT_REQUESTS.push(rec); else INPUT_REQUESTS[at] = rec;
        n++;
      });
      for(let i = INPUT_REQUESTS.length - 1; i >= 0; i--){
        const mine = staff || INPUT_REQUESTS[i].farmUid === uid;
        if(mine && !seen[INPUT_REQUESTS[i].id]) INPUT_REQUESTS.splice(i, 1);
      }
    }
  }catch(e){ /* what is held stays held */ }
  try{
    const snap = await fs.getDocs(fs.collection(CLOUD.db, 'inputSuggestions'));
    const seen = {};
    snap.forEach(d=>{
      const v = d.data() || {}; seen[d.id] = true;
      const at = INPUT_SUGGESTIONS.findIndex(x=> x.id === d.id);
      const rec = Object.assign({}, v, { id:d.id });
      if(at === -1) INPUT_SUGGESTIONS.push(rec); else INPUT_SUGGESTIONS[at] = rec;
      n++;
    });
    for(let i = INPUT_SUGGESTIONS.length - 1; i >= 0; i--)
      if(!seen[INPUT_SUGGESTIONS[i].id]) INPUT_SUGGESTIONS.splice(i, 1);
  }catch(e){ /* the list stays as it was */ }
  return n;
}

const CATALOGUE_KEY = 'tipfa.catalogue.v1';

function saveCatalogue(){
  try{ localStorage.setItem(CATALOGUE_KEY, JSON.stringify(CATALOGUE)); }catch(e){ /* storage full */ }
  cloudPushCatalogue();
}

function loadCatalogue(){
  // Seeding renames crops that are here under an earlier name, which reaches
  // into the member register — so it happens here, after that is loaded, and
  // not where CATALOGUE is first declared.
  try{
    const raw = localStorage.getItem(CATALOGUE_KEY);
    if(!raw){ CATALOGUE = seedCatalogueYields(CATALOGUE); return; }
    const d = normaliseCatalogue(JSON.parse(raw));
    if(d && d.length){
      CATALOGUE = d;
      // Write the carried-forward shape straight back, so the conversion is
      // done once rather than on every load.
      try{ localStorage.setItem(CATALOGUE_KEY, JSON.stringify(CATALOGUE)); }catch(_){ }
    }
  }catch(e){ /* keep the built-in list */ }
  CATALOGUE = seedCatalogueYields(CATALOGUE);
}

async function cloudPushCatalogue(){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator') return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'settings', 'catalogue'),
      { crops: JSON.parse(JSON.stringify(CATALOGUE)), updatedAt: new Date().toISOString() });
  }catch(e){
    // Reporting the whole platform offline over one refused document would be
    // wrong: everything else may be reaching the database perfectly well.
    CATALOGUE_SHARED = false;
    state.catError = /permission|insufficient/i.test(String(e && (e.code || e.message)))
      ? 'Saved on this device only. The shared database refused it, because the rule for settings/catalogue has not been published yet — copy firestore.rules into Firestore → Rules → Publish, then save again to send it to every farm.'
      : 'Saved on this device only. The shared database could not be reached: ' + (e.message||e);
  }
}

/* Whether the catalogue on this device came from the shared database or is
   just the copy this browser happens to hold. A farm choosing crops from a
   local list, while the Secretariat edits another, has no way to tell without
   being told. */
let CATALOGUE_SHARED = false;
let CATALOGUE_WHY = '';

async function cloudPullCatalogue(){
  if(!cloudOn()){ CATALOGUE_SHARED = false; CATALOGUE_WHY = 'this device is not connected to the shared database'; return false; }
  try{
    const { doc, getDoc } = CLOUD.fs;
    const d = await getDoc(doc(CLOUD.db, 'settings', 'catalogue'));
    if(d.exists() && Array.isArray(d.data().crops) && d.data().crops.length){
      CATALOGUE = normaliseCatalogue(d.data().crops);
      CATALOGUE_SHARED = true; CATALOGUE_WHY = '';
      try{ localStorage.setItem(CATALOGUE_KEY, JSON.stringify(CATALOGUE)); }catch(_){ }
      return true;
    }
    CATALOGUE_SHARED = false;
    CATALOGUE_WHY = 'the Secretariat has not saved a catalogue to the shared database yet';
  }catch(e){
    CATALOGUE_SHARED = false;
    CATALOGUE_WHY = /permission|insufficient/i.test(String(e && (e.code || e.message)))
      ? 'the rule for settings/catalogue has not been published in the Firebase console yet'
      : 'the shared database could not be read: ' + (e.message||e);
  }
  return false;
}

// Shown wherever the crop list is used, so a stale list is never silent.
function catalogueSourceNote(){
  if(CATALOGUE_SHARED) return '';
  return `<p class="helper cat-local">This crop list is the copy stored on this device, not the shared one — ${esc(CATALOGUE_WHY || 'the shared catalogue could not be read')}. Crops the Secretariat has added elsewhere may be missing from it.</p>`;
}

function operatorSync(id){
  if(cloudOn() && CLOUD_STATE.role === 'operator') cloudPushFarm(id);
}

async function cloudDeleteFarm(id){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator' || !isCloudFarm(id)) return;
  const { doc, deleteDoc } = CLOUD.fs;
  try{
    await deleteDoc(doc(CLOUD.db, 'farms', id));
    await deleteDoc(doc(CLOUD.db, 'harvest', id));
    CLOUD_STATE.cloudIds.delete(id);
  }catch(e){ setCloudStatus('offline', 'Could not remove the farm from the shared database: ' + (e.message||e)); }
}

// Writes are batched: a farm typing into a table should not send a write per keystroke.
function cloudPushSoon(id){
  if(!cloudOn()) return;
  clearTimeout(CLOUD_STATE.pushTimer);
  CLOUD_STATE.pendingId = id || CLOUD_STATE.uid;
  CLOUD_STATE.pushTimer = setTimeout(()=>{
    const pending = CLOUD_STATE.pendingId;
    CLOUD_STATE.pendingId = null;
    cloudPushFarm(pending);
  }, 1200);
}

/* ---- Requests and complaints ---------------------------------------
   A farm raising a complaint on its own phone and the Secretariat reading
   it on another machine is the whole point of the thing, so these live in
   the database like everything else. Each carries an id made from the
   farm's own uid and the moment it was raised, so two farms writing at
   once cannot land on the same document. */
function submissionId(uid){
  return `${uid}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
}

async function cloudPushSubmission(c){
  if(!cloudOn() || !c || !c.docId) return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'submissions', c.docId), {
      farmUid: c.member, type: c.type, text: c.text,
      status: c.status, assignee: c.assignee || 'Unassigned',
      created: c.created || new Date().toISOString()
    }, {merge:true});
  }catch(e){
    state.commsError = /permission|insufficient/i.test(String(e && (e.code||e.message)))
      ? 'Saved on this device only — the shared database refused it. Check that the rules in firestore.rules are published.'
      : 'Saved on this device only — the shared database could not be reached.';
  }
}

async function cloudPullSubmissions(){
  if(!cloudOn()) return 0;
  const fs = CLOUD.fs;
  try{
    let snap;
    if(CLOUD_STATE.role === 'operator'){
      snap = await fs.getDocs(fs.collection(CLOUD.db, 'submissions'));
    } else if(CLOUD_STATE.uid && fs.query && fs.where){
      // A farm may read only its own, so the query has to say as much or the
      // rules refuse the whole listing.
      snap = await fs.getDocs(fs.query(fs.collection(CLOUD.db, 'submissions'),
                                       fs.where('farmUid', '==', CLOUD_STATE.uid)));
    } else return 0;
    let n = 0;
    snap.forEach(d=>{
      const v = d.data();
      const existing = complaints.find(x=> x.docId === d.id);
      if(existing){
        existing.status = v.status; existing.assignee = v.assignee;
        existing.type = v.type; existing.text = v.text;
      } else {
        complaints.unshift({ id: nextComplaintId++, docId: d.id, member: v.farmUid,
                             type: v.type, text: v.text, status: v.status,
                             assignee: v.assignee || 'Unassigned', created: v.created });
      }
      n++;
    });
    return n;
  }catch(e){ return 0; }
}

/* ============================================================
   Orders and allocation

   A customer orders produce from the association, not from one farm.
   The Secretariat splits that order across the farms that can actually
   fill it, and each farm answers for its own share.

   Two documents, deliberately apart:

     orders/{id}            the whole order — customer, price, what every
                            farm was offered. Staff only.
     orderAllocations/{id}  one farm's share of it. The farm reads this and
                            nothing else, so it can answer without seeing
                            what its neighbours were offered or paid.

   Everything a farm needs to decide is copied onto its allocation, because
   the alternative is letting it read the order.
   ============================================================ */
let ORDERS = [];
let ALLOCS = [];

const ORDER_STATUS  = ['Open','Allocated','Delivered','Closed','Cancelled'];
const ALLOC_STATUS  = ['Offered','Accepted','Declined','Delivered'];

function orderId(){
  return `ord-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
}
function allocId(ordId, uid){
  return `${ordId}--${uid}`;              // one allocation per farm per order
}

function blankOrder(){
  return { id:'', customer:'', customerContact:'', crop:'', variety:'',
           kg:0, pricePerKg:0, needBy:'', notes:'', status:'Open',
           created:new Date().toISOString(), createdBy: CLOUD_STATE.uid || '' };
}

function orderById(id){ return ORDERS.find(o=> o.id === id) || null; }
function allocsFor(orderIdVal){ return ALLOCS.filter(a=> a.orderId === orderIdVal); }
function allocsForFarm(uid){ return ALLOCS.filter(a=> a.farmUid === uid); }

/* How much of an order is spoken for. Declined shares are free again, so
   they do not count against what is still to place. */
function orderPlaced(o){
  return allocsFor(o.id).filter(a=> a.status !== 'Declined')
                        .reduce((t,a)=> t + (Number(a.kg)||0), 0);
}
function orderAccepted(o){
  return allocsFor(o.id).filter(a=> a.status === 'Accepted' || a.status === 'Delivered')
                        .reduce((t,a)=> t + (Number(a.kg)||0), 0);
}
function orderRemaining(o){ return Math.max(0, (Number(o.kg)||0) - orderPlaced(o)); }

/* ---- Which farms can fill an order ----------------------------------
   Allocation by hand is favouritism nobody can defend at an AGM, so the
   ranking is worked out from records the farms themselves entered and the
   reasoning is shown beside every score. Four things matter:

     what they can grow   the expected harvest of that crop, from the
                          catalogue figure and the seedlings they planted
     when it is ready     a harvest that lands after the customer needs it
                          is worth nothing to this order
     whether they deliver how much of what they have accepted before was
                          actually delivered
     whose turn it is     a farm that has had little lately comes first, so
                          the same three farms do not take everything

   Nothing here is secret: the breakdown is on screen for every farm. */
function farmCropProfiles(m, crop){
  return (m.crops || []).filter(cr=> cr.crop === crop);
}

/* The kilograms a farm should have off this crop, from its own profiles. */
function farmExpectedKg(m, crop){
  return farmCropProfiles(m, crop).reduce((t,cr)=>{
    const e = expectedHarvest(cr);
    return t + (e.ok ? e.total : 0);
  }, 0);
}

/* What this farm can put up in one week of that crop — the season total
   spread across the weeks it is picked in. This is the figure orders are
   judged and offered on: an order is a delivery on a date, and a farm can
   only fill it out of a week's picking, not out of a whole season's. */
function farmWeeklyKg(m, crop){
  return farmCropProfiles(m, crop).reduce((t,cr)=>{
    const w = weeklyExpected(cr);
    return t + (w.ok ? w.perWeek : 0);
  }, 0);
}

/* How long a share will take this farm to pick, in its own weeks. A share
   of 150 kg means nothing on its own; "about five weeks of their picking"
   is what tells an operator whether it lands before the customer's date. */
function weeksToCover(m, crop, kg){
  const perWeek = farmWeeklyKg(m, crop);
  if(!(perWeek > 0) || !(kg > 0)) return 0;
  return kg / perWeek;
}
function weeksToCoverText(weeks){
  if(!weeks) return '';
  if(weeks < 1) return 'under a week';
  const n = weeks < 10 ? Math.round(weeks * 10) / 10 : Math.round(weeks);
  return `${n} week${n === 1 ? '' : 's'}`;
}

/* What this farm has actually picked of that crop since it took the share on.

   An accepted share and a delivered share are the two things the order book
   knew about, and between them is the part that matters most while an order
   is live: whether the farm has started picking at all. That sits in the
   farm's own harvest records, which the order screen was never reading. */
function pickedSince(farmUid, crop, sinceIso){
  const since = sinceIso ? String(sinceIso).slice(0,10) : '';
  return harvestEntries(farmUid)
    .filter(e=> (e.crop || '') === crop && (!since || (e.date || '') >= since))
    .reduce((t,e)=> t + toKg(e.amount, e.unit || 'kg'), 0);
}
/* The day picking started against a share, so the order book can say when. */
function firstPickSince(farmUid, crop, sinceIso){
  const since = sinceIso ? String(sinceIso).slice(0,10) : '';
  const dates = harvestEntries(farmUid)
    .filter(e=> (e.crop || '') === crop && (!since || (e.date || '') >= since))
    .map(e=> e.date || '').filter(Boolean).sort();
  return dates[0] || '';
}

/* How many weeks of picking are behind that weekly figure, so the order
   screen can say where it came from rather than showing a bare number. */
function farmHarvestWeeks(m, crop){
  return farmCropProfiles(m, crop).reduce((t,cr)=>{
    const w = weeklyExpected(cr);
    return Math.max(t, w.ok ? w.harvestWeeks : 0);
  }, 0);
}

/* What the farm can actually put together by the day the customer needs it:
   its weekly rate times the weeks of picking that fall before that date.

   The weekly rate alone is too strict — a farm picking 31 kg a week from
   May can hand over far more than 31 kg by September, and offering it one
   week's worth would strand most of an order. The season total is too
   generous, because the weeks after the deadline are no use to this order.
   The weeks in between are the honest answer, and never more than the
   season holds. */
function farmSupplyBy(m, crop, needBy){
  const end = needBy ? new Date(needBy) : null;
  return farmCropProfiles(m, crop).reduce((t, cr)=>{
    const w = weeklyExpected(cr);
    if(!w.ok) { const e = expectedHarvest(cr); return t + (e.ok ? e.total : 0); }
    if(!end || isNaN(end)) return t + w.total;      // no deadline: all of it

    // Picking cannot start before the crop does, nor before today.
    const first = w.firstHarvest ? new Date(w.firstHarvest) : null;
    const now = new Date();
    const from = (first && !isNaN(first) && first > now) ? first : now;
    if(end <= from) return t;                       // wanted before it bears

    const weeks = Math.max(0, Math.round((end - from) / MS_WEEK));
    return t + Math.min(w.total, w.perWeek * weeks);
  }, 0);
}

/* The earliest date this farm expects to be picking that crop. */
function farmHarvestFrom(m, crop){
  let best = null;
  farmCropProfiles(m, crop).forEach(cr=>{
    const d = cr.firstHarvest || cr.expected || '';
    if(d && (!best || d < best)) best = d;
  });
  return best;
}

/* What this farm has been given lately, so the turn can be taken into
   account. Declined shares do not count — a farm is not penalised for an
   order it could not take. */
function farmAllocatedKg(uid){
  return ALLOCS.filter(a=> a.farmUid === uid && a.status !== 'Declined')
               .reduce((t,a)=> t + (Number(a.kg)||0), 0);
}

/* Of everything this farm accepted, how much it actually delivered. A farm
   with no history is given the benefit of the doubt rather than a zero,
   which would keep a new member from ever being offered anything. */
function farmDeliveryRate(uid){
  const done = ALLOCS.filter(a=> a.farmUid === uid &&
                            (a.status === 'Accepted' || a.status === 'Delivered'));
  if(!done.length) return { rate:1, known:false, n:0 };
  const delivered = done.filter(a=> a.status === 'Delivered').length;
  return { rate: delivered / done.length, known:true, n:done.length };
}

function scoreFarmForOrder(id, m, o){
  const why = [];
  if(m.status !== 'Active'){
    return { id, name:m.name, score:0, expectedKg:0, weeklyKg:0, harvestWeeks:0, byDate:0,
             from:null, why:['not an active member'], eligible:false, askable:false };
  }
  const expectedKg = farmExpectedKg(m, o.crop);
  const weeklyKg = farmWeeklyKg(m, o.crop);
  const hWeeks = farmHarvestWeeks(m, o.crop);
  const byDate = farmSupplyBy(m, o.crop, o.needBy);
  // A farm that has not recorded this crop cannot be scored — there is
  // nothing to score it on. That is not the same as being unable to grow
  // it: a farm joins before it fills in its crops, and the association
  // takes orders for things its members grow but have not typed in yet.
  // So it ranks last and is asked rather than ruled out. The farm itself
  // knows whether it has capsicum; the platform only knows what it was told.
  if(expectedKg <= 0){
    return { id, name:m.name, score:0, expectedKg:0, weeklyKg:0, harvestWeeks:0, byDate:0,
             from:null, why:[`no ${o.crop} in their crop records`], eligible:false,
             askable:true };
  }

  // Capacity — measured against what is still to place, so a farm that can
  // fill the rest on its own scores full marks rather than being compared
  // with an order size nobody could meet alone.
  //
  // Built up from the weekly rate rather than read off the season total.
  // Scoring on the season said a farm expecting 1,680 kg could fill a
  // 1,500 kg order on its own, whenever the customer wanted it. What it can
  // really offer is its weekly picking times the weeks left before the date.
  const need = orderRemaining(o) || Number(o.kg) || 1;
  const supply = weeklyKg > 0 ? byDate : expectedKg;
  const capacity = Math.min(1, supply / need);
  if(weeklyKg > 0){
    why.push(`${fmt(Math.round(weeklyKg))} kg a week (${fmt(Math.round(expectedKg))} kg over ${hWeeks} harvest week${hWeeks===1?'':'s'})`);
    if(o.needBy) why.push(`${fmt(Math.round(byDate))} kg of that by ${o.needBy}`);
  } else {
    why.push(`${fmt(Math.round(expectedKg))} kg expected, no harvest window recorded`);
  }

  // Timing — ready before the customer needs it, or not.
  const from = farmHarvestFrom(m, o.crop);
  let timing = 0.5;                         // no date recorded: neither good nor bad
  if(from && o.needBy){
    timing = from <= o.needBy ? 1 : 0;
    why.push(timing ? `ready ${from}, needed by ${o.needBy}` : `not ready until ${from}`);
  } else if(from){
    timing = 0.75; why.push(`ready ${from}`);
  } else {
    why.push('no harvest date recorded');
  }

  // Delivering what they accepted.
  const rec = farmDeliveryRate(id);
  if(rec.known) why.push(`delivered ${Math.round(rec.rate*100)}% of ${rec.n} past share${rec.n===1?'':'s'}`);
  else why.push('no order history yet');

  // Whose turn. The busiest farm sets the scale, so this is share of the
  // most any one farm has had, inverted.
  const mine = farmAllocatedKg(id);
  const busiest = Math.max(1, ...Object.keys(MEMBERS).map(x=> farmAllocatedKg(x)));
  const turn = 1 - (mine / busiest);
  if(mine) why.push(`${fmt(Math.round(mine))} kg allocated before now`);
  else why.push('nothing allocated yet');

  const score = Math.round(100 * (0.40*capacity + 0.25*timing + 0.20*rec.rate + 0.15*turn));
  return { id, name:m.name, score, expectedKg, weeklyKg, harvestWeeks:hWeeks, byDate,
           from, why, eligible:true, askable:true,
           parts:{capacity, timing, delivery:rec.rate, turn} };
}

/* Ask everybody. When no farm has the crop in its records there is nothing
   to rank, and an order that can reach nobody is worse than an order placed
   imperfectly — so the whole amount is offered to every active farm and the
   first to accept takes it. Farms know what is in their tunnels; the
   platform only knows what it has been told. */
function askableFarms(o){
  return rankFarmsForOrder(o).filter(r=> r.askable);
}

function rankFarmsForOrder(o){
  return Object.keys(MEMBERS)
    .map(id=> scoreFarmForOrder(id, MEMBERS[id], o))
    .sort((a,b)=> b.score - a.score || a.name.localeCompare(b.name));
}

/* Split what is left of an order across the farms that scored best, giving
   each no more than it expects to pick in a week. A suggestion, not a
   decision — every figure stays editable before anything is sent. */
function suggestAllocation(o){
  const ranked = rankFarmsForOrder(o).filter(r=> r.eligible && r.score > 0);
  let left = orderRemaining(o);
  const out = [];
  ranked.forEach(r=>{
    if(left <= 0) return;
    if(allocsFor(o.id).some(a=> a.farmUid === r.id && a.status !== 'Declined')) return;
    // A farm with a weekly rate has already answered: byDate 0 means it
    // cannot pick any of this before the date, not that nothing is known.
    const give = Math.min(left, Math.round(r.weeklyKg > 0 ? r.byDate : r.expectedKg));
    if(give <= 0) return;
    out.push({ farmUid:r.id, name:r.name, kg:give, score:r.score });
    left -= give;
  });
  return out;
}

/* ============================================================
   Harvest batches, lot codes and traceability

   A customer opens a box and something is wrong with it. The only
   question that matters then is which farm picked it, on what day,
   and what had been sprayed on it — and the answer has to come back
   in seconds, not after a week of phone calls.

   That works only if every box can be named. A batch is one farm's
   pick of one crop on one day; its lot code is printed on whatever
   leaves the farm. Everything else hangs off that code:

     harvestBatches/{id}     who picked what, when, how much
     inputApplications/{id}  what was applied, and the days that must
                             pass before picking is safe
     consignments/{id}       which batches went to which customer
     lotComplaints/{id}      what came back, against which lot
     publicTrace/{lotCode}   the little a stranger may see

   The last one is a separate document on purpose. Opening the batch
   records to the public would expose farm contacts and prices along
   with them, so the public route reads a mirror holding only what is
   safe to show.
   ============================================================ */
let BATCHES  = [];
let INPUTAPP = [];
let CONSIGN  = [];
let LOTISSUES = [];

const BATCH_STATUS = ['Recorded','Consigned','Delivered','Withdrawn'];
const ISSUE_SEVERITY = ['Minor','Serious','Critical'];
const ISSUE_STATUS = ['Open','Investigating','Resolved'];

/* A lot code is read aloud down a phone line and typed off a printed
   label, so it avoids the characters people confuse: no O against 0, no
   I against 1. It carries the farm and the date in plain sight, which
   means a code alone already narrows the search before anything is
   looked up. */
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codeChunk(n){
  let out = '';
  for(let i = 0; i < n; i++)
    out += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
  return out;
}
function farmTag(m){
  const words = String((m && m.name) || 'FARM').toUpperCase().replace(/[^A-Z ]/g,'').split(/\s+/).filter(Boolean);
  const tag = (words.length >= 2 ? words[0][0] + words[1][0] + (words[2] ? words[2][0] : words[1][1] || 'X')
                                 : (words[0] || 'FRM').slice(0,3)).padEnd(3,'X');
  return tag.slice(0,3);
}
function lotCodeFor(m, dateStr){
  const d = (dateStr || todayStr()).replace(/-/g,'').slice(2);   // YYMMDD
  return `TIPFA-${farmTag(m)}-${d}-${codeChunk(4)}`;
}
function batchId(){
  return `bat-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
}

function batchByLot(code){
  const c = String(code || '').trim().toUpperCase();
  return BATCHES.find(b=> String(b.lotCode||'').toUpperCase() === c) || null;
}
function batchById(id){ return BATCHES.find(b=> b.id === id) || null; }
function batchesForFarm(uid){ return BATCHES.filter(b=> b.farmUid === uid); }

/* ---- What was applied, and when it is safe to pick -------------------
   A pre-harvest interval is the number of days that must pass between
   applying something and picking. Harvesting inside it is the single
   most common reason a consignment is rejected, so the platform works
   it out rather than leaving a farm to count days on a calendar. */
function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '';
  d.setDate(d.getDate() + Number(n || 0));
  return d.toISOString().slice(0,10);
}
function safeFrom(app){
  return app && app.appliedOn ? addDays(app.appliedOn, app.phiDays || 0) : '';
}

/* Everything applied to the crop this batch came from, before it was
   picked. Matched on the farm and the crop, and on the profile where the
   farm recorded one, so two profiles of the same crop do not borrow each
   other's spray records. */
function applicationsForBatch(b){
  if(!b) return [];
  return INPUTAPP.filter(a=>
    a.farmUid === b.farmUid &&
    a.crop === b.crop &&
    (!a.profileId || !b.profileId || a.profileId === b.profileId) &&
    (!b.harvestedOn || !a.appliedOn || a.appliedOn <= b.harvestedOn)
  ).sort((x,y)=> (y.appliedOn||'').localeCompare(x.appliedOn||''));
}

/* Was this batch picked before it was safe to pick? Returns the
   applications that were still inside their interval on harvest day. */
function phiBreaches(b){
  if(!b || !b.harvestedOn) return [];
  return applicationsForBatch(b).filter(a=>{
    const safe = safeFrom(a);
    return safe && b.harvestedOn < safe;
  });
}
function batchSafety(b){
  const bad = phiBreaches(b);
  if(!b.harvestedOn) return { ok:true, unknown:true, text:'No harvest date recorded.' };
  if(!applicationsForBatch(b).length)
    return { ok:true, unknown:true, text:'Nothing recorded as applied to this crop.' };
  if(!bad.length) return { ok:true, unknown:false, text:'Every interval was observed before picking.' };
  return { ok:false, unknown:false, breaches:bad,
           text:`Picked before ${bad.length} interval${bad.length===1?'':'s'} had passed.` };
}

/* ---- Where a batch went ---------------------------------------------- */
function consignmentsForBatch(id){
  return CONSIGN.filter(c=> (c.batchIds||[]).includes(id));
}
function issuesForBatch(id){
  return LOTISSUES.filter(i=> i.batchId === id);
}

/* The recall question, and the reason batches are worth keeping at all:
   one lot came back bad, so where else did that day's pick go? Everything
   from the same farm, the same crop and the same harvest day is suspect,
   not only the box that was opened. */
function siblingBatches(b){
  if(!b) return [];
  return BATCHES.filter(x=> x.id !== b.id && x.farmUid === b.farmUid &&
                            x.crop === b.crop && x.harvestedOn === b.harvestedOn);
}
function recallFor(b){
  if(!b) return { batches:[], consignments:[], kg:0, customers:[] };
  const batches = [b].concat(siblingBatches(b));
  const cons = [];
  batches.forEach(x=> consignmentsForBatch(x.id).forEach(c=>{
    if(!cons.some(y=> y.id === c.id)) cons.push(c);
  }));
  const customers = [];
  cons.forEach(c=>{ if(c.customer && !customers.includes(c.customer)) customers.push(c.customer); });
  return { batches, consignments:cons, customers,
           kg: batches.reduce((t,x)=> t + (Number(x.kg)||0), 0) };
}

/* ---- Batches in the shared database ---------------------------------- */
async function cloudPushBatch(b){
  if(!cloudOn() || !b || !b.id) return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'harvestBatches', b.id), {
      farmUid:b.farmUid, farmName:b.farmName || '', crop:b.crop, variety:b.variety || '',
      profileId:b.profileId || '', harvestedOn:b.harvestedOn || '', kg:Number(b.kg)||0,
      lotCode:b.lotCode, grade:b.grade || '', notes:b.notes || '',
      status:b.status || 'Recorded', region:b.region || '', created:b.created
    }, {merge:true});
    await cloudPushPublicTrace(b);

/* Pull whatever this session may see. A farm reads its own batches, its
   own spray records, its own consignments and the complaints raised
   against its own produce — each query says so by name, because a
   listing the rules cannot narrow is a listing they refuse. */
async function cloudPullTrace(){
  if(!cloudOn()) return 0;
  const fs = CLOUD.fs;
  const staff = CLOUD_STATE.role === 'operator';
  const uid = CLOUD_STATE.uid;
  let n = 0;

  const pull = async (col, into, key)=>{
    try{
      let snap;
      if(staff) snap = await fs.getDocs(fs.collection(CLOUD.db, col));
      else if(uid && fs.query && fs.where)
        snap = await fs.getDocs(fs.query(fs.collection(CLOUD.db, col), fs.where('farmUid','==',uid)));
      else return;
      const seen = {};
      snap.forEach(d=>{
        const v = d.data() || {};
        seen[d.id] = true;
        const at = into.findIndex(x=> x.id === d.id);
        const rec = Object.assign({}, v, { id:d.id });
        if(at === -1) into.push(rec); else into[at] = rec;
        n++;
      });
      for(let i = into.length - 1; i >= 0; i--){
        const mine = staff || into[i].farmUid === uid;
        if(mine && !seen[into[i].id]) into.splice(i, 1);
      }
    }catch(e){ /* what is held stays held */ }
  };

  await pull('harvestBatches', BATCHES);
  await pull('inputApplications', INPUTAPP);
  await pull('consignments', CONSIGN);
  await pull('lotComplaints', LOTISSUES);
  return n;
}

/* ============================================================
   Advisory — how a member who is not farming can still be useful

   Not every member has a greenhouse. Some have thirty years of
   knowing why the leaves are yellowing, and that is worth more to a
   new member than another crop record.

   A farm asks a question and attaches what it is seeing. Whoever
   holds the agronomist role answers. The answer does not vanish into
   one conversation: it joins a library the next farm can search, so
   the same question is answered once rather than forty times.

     advisoryCases/{id}   a question from one farm, and its answers
     knowledge/{id}       an answer worth keeping, searchable by all

   An agronomist reads farms and batches to answer properly, and
   writes nothing but advice — the rules say so.
   ============================================================ */
let CASES = [];
let KNOWLEDGE = [];

const CASE_STATUS = ['Open','Answered','Closed'];
const CASE_TOPICS = ['Pests','Disease','Soil and feeding','Watering','Seedlings',
                     'Greenhouse and structures','Harvest and handling','Market','Other'];

function caseId(){
  return `case-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
}
function casesForFarm(uid){ return CASES.filter(x=> x.farmUid === uid); }
function openCases(){ return CASES.filter(x=> x.status === 'Open'); }

/* Who can answer. An agronomist by role, and any member the Secretariat
   has marked as one — which is how a member who no longer farms goes on
   being useful to the association. */
function isAdviser(){
  return roleIs() === 'agronomist' || roleIs() === 'superAdmin'
      || roleIs() === 'secretariat' || can('advisory.write');
}

/* Answers already given to something like this. Matching on topic and
   crop first, then on words in the question, so a farm often finds its
   answer before anyone has to write one. */
function knowledgeMatches(topic, crop, text){
  const words = String(text||'').toLowerCase().split(/[^a-z]+/).filter(w=> w.length > 3);
  return KNOWLEDGE.map(k=>{
    let score = 0;
    if(topic && k.topic === topic) score += 3;
    if(crop && k.crop === crop) score += 3;
    const hay = `${k.title} ${k.body}`.toLowerCase();
    words.forEach(w=>{ if(hay.includes(w)) score += 1; });
    return { k, score };
  }).filter(x=> x.score >= 3)
    .sort((a,b)=> b.score - a.score)
    .slice(0, 5)
    .map(x=> x.k);
}

/* Several farms reporting the same thing in the same region is not
   several problems, it is one — and worth telling everyone about before
   it reaches them too. */
function advisoryAlerts(){
  const recent = CASES.filter(x=>{
    if(!x.raisedOn) return false;
    const days = (Date.now() - new Date(x.raisedOn + 'T00:00:00')) / 86400000;
    return days <= 21;
  });
  const groups = {};
  recent.forEach(x=>{
    const region = (MEMBERS[x.farmUid] || {}).location || 'Unrecorded';
    const key = `${x.topic}||${x.crop||'any crop'}||${region}`;
    (groups[key] = groups[key] || []).push(x);
  });
  return Object.keys(groups)
    .filter(k=> groups[k].length >= 3)
    .map(k=>{
      const [topic, crop, region] = k.split('||');
      return { topic, crop, region, cases:groups[k], n:groups[k].length };
    })
    .sort((a,b)=> b.n - a.n);
}

/* ---- Orders in the shared database ---------------------------------- */
/* A write the database refuses used to leave a message in `state` that
   nothing ever drew — the operator pressed a button, saw no complaint, and
   reasonably assumed the farm had been sent something. Say it, and draw it. */
/* Who this browser is to the database, which is not the same question as
   who it is to this page. An account created here before the database was
   reachable signs in against this browser's own list, and the page fills in
   properly — but the database has never heard of them, so it refuses
   everything they write no matter what the rules say. */
function cloudIdentity(){
  if(!cloudOn()) return { ok:false, why:'offline' };
  if(!CLOUD_STATE.uid) return { ok:false, why:'local' };
  if(state.role === 'admin' && CLOUD_STATE.role !== 'operator')
    return { ok:false, why:'not-operator' };
  return { ok:true, why:'' };
}

/* Naming the wrong cause is worse than naming none: publishing rules that
   are already published, over and over, while the real fault sits
   elsewhere. So work out which it is before saying anything.

   The last branch used to assume unpublished rules for every refusal it
   could not otherwise explain, which is how somebody who had just published
   them was told to publish them. It no longer guesses: it asks the database
   whether it can read the collection. A read that succeeds proves the rules
   are published, which leaves the account's own role — an auditor may read
   everything and change nothing — or something about the record itself. */
function noteCloudRefusal(e, what, col){
  const denied = /permission|insufficient/i.test(String(e && (e.code || e.message)));
  const who = cloudIdentity();
  if(!denied){
    state.orderError = `${what} was saved on this device only — the shared database could not be reached.`;
  } else if(who.why === 'local'){
    state.orderError = `${what} was saved on this device only. You are signed in to this browser, but not to the shared database — so it cannot tell who is writing, and refuses it. This happens when the operator account was created on this device before the database was reachable, or when you signed in with an operator ID rather than the email address on the account. Log out and sign in again with the email address and password, and this will go up on its own.`;
  } else if(who.why === 'not-operator'){
    state.orderError = `${what} was saved on this device only. The database does not recognise this account as an operator, so it refuses what the console writes. Sign in again with the email address the operator account was created with.`;
  } else {
    // Say only what is known so far, then go and find out the rest.
    state.orderError = `${what} was saved on this device only — the shared database refused the write. Finding out why…`;
    explainRefusal(what, col);
  }
  state.cloudRefused = true;
  try{ render(); }catch(_){ /* mid-render; the message is drawn by the next one */ }
}

/* Which of the three it actually is. Reading the collection is the test that
   separates them: rules that are not published refuse the read too. */
async function explainRefusal(what, col){
  let published = null;
  if(col && cloudOn()){
    try{
      const { collection, getDocs } = CLOUD.fs;
      await getDocs(collection(CLOUD.db, col));
      published = true;
    }catch(err){
      published = /permission|insufficient/i.test(String(err && (err.code || err.message)))
        ? false : null;
    }
  }

  if(published === false){
    state.orderError = `${what} was saved on this device only. The shared database has not been told these records exist — firestore.rules is not published, or the copy that is published is older than this one. Open the admin Orders tab: the red banner there links straight to the file and to your own Rules page.`;
  } else if(published === true && USER && USER.status && USER.status !== 'active'){
    state.orderError = `${what} was saved on this device only. The rules are published and the database can read them, but this account's status is “${USER.status}”, and only an active account may write. The system owner can set it on the Governance screen.`;
  } else if(published === true && USER && USER.role === 'auditor'){
    state.orderError = `${what} was saved on this device only. The rules are published — this account holds the Auditor role, which may read everything and change nothing. Ask the system owner for a role that can write, or have somebody in the Secretariat make the change.`;
  } else if(published === true && USER && USER.role){
    state.orderError = `${what} was saved on this device only. The rules are published and this account is signed in as ${roleLabel(USER.role)}, so the refusal is about this particular record rather than about access in general. Nothing is lost — it is still on this device, and Refresh will send it once the cause is cleared.`;
  } else if(published === true){
    // No role record on this device. The database recognises an operator
    // either by an operators document (an account made before roles) or by
    // a users document carrying a role — an account with neither, or with a
    // users document holding no role, falls between the two and is refused
    // every write while still being able to read.
    let hasOp = null, rec = null;
    try{
      const { doc, getDoc } = CLOUD.fs;
      hasOp = (await getDoc(doc(CLOUD.db, 'operators', CLOUD_STATE.uid))).exists();
      const u = await getDoc(doc(CLOUD.db, 'users', CLOUD_STATE.uid));
      rec = u.exists() ? (u.data() || {}) : null;
    }catch(_){ /* answered below as "could not establish" */ }

    if(rec && !rec.role){
      state.orderError = `${what} was saved on this device only. The rules are published, but this account has a role record with no role set on it — so the database no longer treats it as an operator, and refuses every write while still letting it read. The system owner can set a role on the Governance screen. Nothing is lost; it is still on this device.`;
    } else if(hasOp === false && !rec){
      state.orderError = `${what} was saved on this device only. The rules are published, but the database holds no operator record for this account, so it refuses what the console writes. Ask the system owner to add this account on the Governance screen.`;
    } else {
      state.orderError = `${what} was saved on this device only. The rules are published and the database can be read, so this is not about publishing them. Nothing is lost — it is still on this device.`;
    }
  } else {
    state.orderError = `${what} was saved on this device only — the shared database refused the write and the reason could not be established from here. Nothing is lost; it is still on this device.`;
  }
  try{ render(); }catch(_){ }
}

/* ---- Has the database been told about these records? -----------------
   Every collection added after the first release is refused outright until
   firestore.rules is published again. That refusal is silent from the
   Secretariat's side — the order is written down, the button worked, and
   the farm is never sent anything. So ask the database directly which of
   them it will not accept, and name them. */
const LATER_COLLECTIONS = [
  ['orders','Orders'], ['orderAllocations','Shares placed with farms'],
  ['harvestBatches','Harvest batches'], ['inputApplications','What was applied'],
  ['consignments','Consignments'], ['lotComplaints','Complaints against a lot'],
  ['advisoryCases','Questions for an agronomist'], ['knowledge','The knowledge library'],
  ['inputRequests','Input requests'], ['inputSuggestions','Input suggestions']
];

async function checkLaterCollections(){
  state.rulesGap = [];
  // Not signed in to the database at all: there is nothing to ask it, and
  // reporting "no problem" here is how a broken session looked healthy.
  const who = cloudIdentity();
  if(!who.ok){ state.identityGap = who.why; return []; }
  state.identityGap = '';
  const { collection, getDocs } = CLOUD.fs;
  const refused = [];
  for(const [name, label] of LATER_COLLECTIONS){
    try{ await getDocs(collection(CLOUD.db, name)); }
    catch(e){
      if(/permission|insufficient/i.test(String(e && (e.code || e.message)))) refused.push(label);
    }
  }
  state.rulesGap = refused;
  return refused;
}

/* Drawn wherever one of these records is made, because being told after the

function recheckRules(){
  checkLaterCollections().then(async gap=>{
    state.orderError = '';
    if(gap.length){ render(); return; }
    // Everything recorded while the database was refusing is sitting on this
    // device. Publishing the rules does not carry it up by itself, and asking
    // the Secretariat to type it all again would be an insult — so send it.
    const n = await resendStranded();
    state.orderMsg = n
      ? `The database now accepts all of these, and the ${n} record${n===1?'':'s'} waiting on this device ${n===1?'has':'have'} been sent. The farms can see their shares now.`
      : 'The database now accepts all of these. Anything you place from here will reach the farms.';
    render();
  });
}

/* Push everything this device is holding, for when the database has only
   just been told these records exist. Safe to run twice: every write is a
   merge onto the same document id. */
async function resendStranded(){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator') return 0;
  let n = 0;
  for(const o of ORDERS){ await cloudPushOrder(o); n++; }
  for(const a of ALLOCS){ await cloudPushAlloc(a); n++; }
  for(const b of BATCHES){ await cloudPushBatch(b); n++; }
  for(const x of INPUTAPP){ await cloudPushApplication(x); n++; }
  for(const cn of CONSIGN){ await cloudPushConsignment(cn); n++; }
  for(const i of LOTISSUES){ await cloudPushIssue(i); n++; }
  for(const cs of CASES){ await cloudPushCase(cs); n++; }
  for(const k of KNOWLEDGE){ await cloudPushKnowledge(k); n++; }
  for(const r of INPUT_REQUESTS){ await cloudPushRequest(r); n++; }
  for(const x of INPUT_SUGGESTIONS){ await cloudPushSuggestion(x); n++; }
  await cloudPushInputCatalogue();
  return n;
}

/* Placing a share is only half of it — the half this device can see. Read
   the shares back out of the database and say plainly whether the farms can
   actually see them, rather than reporting success because a button ran. */
async function confirmPlaced(orderIdVal, n){
  if(!cloudOn()){
    state.orderMsg = `${n} share${n===1?'':'s'} placed on this device. Not connected to the shared database, so no farm can see them yet.`;
    render(); return;
  }
  try{
    const { collection, getDocs, query, where } = CLOUD.fs;
    const snap = await getDocs(query(collection(CLOUD.db, 'orderAllocations'),
                                     where('orderId','==', orderIdVal)));
    let landed = 0; snap.forEach(()=> landed++);
    state.orderMsg = landed >= n
      ? `${n} farm${n===1?' was':'s were'} sent a share. It is in the shared database, so it is on their Orders tab now.`
      : `${n} share${n===1?'':'s'} placed here, but only ${landed} reached the shared database. The rest are on this device alone — publish firestore.rules and place them again.`;
    if(landed < n) await checkLaterCollections();
  }catch(e){
    noteCloudRefusal(e, `The ${n} share${n===1?'':'s'} you placed`, 'orderAllocations');
    await checkLaterCollections();
  }
  render();
}

async function cloudPullOrders(){
  if(!cloudOn()) return 0;
  const fs = CLOUD.fs;
  let n = 0;
  // The order book is the Secretariat's. A farm never reads it.
  if(CLOUD_STATE.role === 'operator'){
    try{
      const snap = await fs.getDocs(fs.collection(CLOUD.db, 'orders'));
      const seen = {};
      snap.forEach(d=>{
        const v = d.data() || {};
        seen[d.id] = true;
        const at = ORDERS.findIndex(o=> o.id === d.id);
        const rec = Object.assign(blankOrder(), v, { id:d.id });
        if(at === -1) ORDERS.push(rec); else ORDERS[at] = rec;
        n++;
      });
      for(let i = ORDERS.length - 1; i >= 0; i--)
        if(!seen[ORDERS[i].id]) ORDERS.splice(i, 1);
    }catch(e){ /* the book stays as it was */ }
  }
  // Allocations: staff read them all, a farm asks for its own by name, which
  // is the only listing the rules will permit it.
  try{
    let snap;
    if(CLOUD_STATE.role === 'operator'){
      snap = await fs.getDocs(fs.collection(CLOUD.db, 'orderAllocations'));
    } else if(CLOUD_STATE.uid && fs.query && fs.where){
      snap = await fs.getDocs(fs.query(fs.collection(CLOUD.db, 'orderAllocations'),
                                       fs.where('farmUid', '==', CLOUD_STATE.uid)));
    } else return n;
    const seen = {};
    snap.forEach(d=>{
      const v = d.data() || {};
      seen[d.id] = true;
      const at = ALLOCS.findIndex(a=> a.id === d.id);
      const rec = Object.assign({}, v, { id:d.id });
      if(at === -1) ALLOCS.push(rec); else ALLOCS[at] = rec;
      n++;
    });
    // Only prune what this session could see in the first place.
    for(let i = ALLOCS.length - 1; i >= 0; i--){
      const a = ALLOCS[i];
      const mine = CLOUD_STATE.role === 'operator' || a.farmUid === CLOUD_STATE.uid;
      if(mine && !seen[a.id]) ALLOCS.splice(i, 1);
    }
  }catch(e){ /* what is held stays held */ }
  return n;
}

async function cloudDeleteOrder(id){
  if(!cloudOn() || !id || CLOUD_STATE.role !== 'operator') return;
  try{
    const { doc, deleteDoc } = CLOUD.fs;
    await deleteDoc(doc(CLOUD.db, 'orders', id));
    for(const a of allocsFor(id)) await deleteDoc(doc(CLOUD.db, 'orderAllocations', a.id));
  }catch(e){ /* it stays until an operator can remove it */ }
}

async function cloudDeleteSubmission(docId){

  try{ await CLOUD.fs.deleteDoc(CLOUD.fs.doc(CLOUD.db, 'submissions', docId)); }
