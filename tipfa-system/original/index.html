}

/* The basket follows you down the page. A total that only exists at the top
   of a 183-item list is a total nobody sees while choosing. */
function cartBar(){
  const lines = cartLines();
  if(!lines.length) return '';
  const n = cartCount();
  return `<div class="cart-bar" role="status">
    <div class="cb-sum">
      <strong>${n}</strong><span>item${n===1?'':'s'}</span>
      <b>${fmt(Math.round(cartTotal()))} TZS</b>
    </div>
    <button class="btn small" onclick="setStoreTab('basket')">Review and send</button>
  </div>`;
}

function qtyControl(id){
  const q = Number(CART[id]) || 0;
  if(!q) return `<button class="btn small ghost" onclick="addToCart('${esc(id)}')">Add</button>`;
  return `<div style="display:flex;align-items:center;gap:6px;">
    <button class="btn small ghost" onclick="cartBump('${esc(id)}',-1)">&minus;</button>
    <input type="number" min="0" value="${q}" style="max-width:74px;text-align:center;"
           onchange="cartSet('${esc(id)}', this.value)">
    <button class="btn small ghost" onclick="cartBump('${esc(id)}',1)">+</button>
  </div>`;
}

/* Four steps, in the order they happen: choose, check, ask for what is
   missing, see what came back. The basket only appears once there is one. */
function storeTabs(){
  const t = state.storeTab || 'store';
  const mine = INPUT_REQUESTS.filter(r=> r.farmUid === state.member).length;
  const n = cartCount();
  const tab = (key, label, badge)=>
    `<span class="chip ${t===key?'active':''}" onclick="setStoreTab('${key}')">${label}${
      badge ? `<b class="chip-badge">${badge}</b>` : ''}</span>`;
  return `<div class="chips store-steps">
    ${tab('store','Browse the list')}
    ${n ? tab('basket','Your basket', n) : ''}
    ${tab('suggest','Suggest an input')}
    ${tab('mine','Your requests', mine || '')}
  </div>`;
}

function renderBasket(c, m){
  c.innerHTML = `
    ${farmHeader(m)}
    <h1 class="page-title">Your basket</h1>
    <p class="page-sub">Check it over, then send it to the Secretariat</p>
    ${storeTabs()}
    ${state.storeMsg ? `<div class="card"><p class="helper" style="margin:0;">${esc(state.storeMsg)}</p>
      <button class="btn small ghost" style="margin-top:8px;" onclick="clearStoreMsg()">Dismiss</button></div>` : ''}
    ${cartPanel()}
    <div class="card"><button class="btn small ghost" onclick="setStoreTab('store')">&larr; Keep adding from the list</button></div>`;
}
function setStoreTab(t){ state.storeTab = t; render(); }
function storeCat(c){ state.storeCat = c; render(); }
function storeSearch(v){
  state.storeSearch = v;
  // Redraw only the list, so the cursor is not thrown out of the box.
  renderKeepingPlace('store-search');
}
function clearStoreMsg(){ state.storeMsg = ''; render(); }

/* The basket, and what it comes to. Anything the Secretariat has not priced
   cannot get in here, so the total is always a real figure rather than a
   figure with holes in it. */
function cartPanel(){
  const lines = cartLines();
  if(!lines.length) return `<div class="card">
    <p class="helper" style="margin:0;">Your basket is empty. Add what you need from the list below and the total works itself out.</p>
  </div>`;
  return `<div class="card" style="border-color:var(--leaf-green);">
    <strong>Your basket</strong>
    <table class="grid-table" style="margin-top:10px;"><thead><tr>
      <th>Item</th><th>Price</th><th>Quantity</th><th>Line total</th><th></th></tr></thead><tbody>
    ${lines.map(l=>`<tr>
      <td>${esc(inputLabel(l.item))}</td>
      <td>${fmt(l.item.price)} <span class="helper">TZS</span></td>
      <td>${qtyControl(l.id)}</td>
      <td><strong>${fmt(Math.round(l.line))}</strong></td>
      <td><button class="btn small ghost" style="color:var(--red);border-color:var(--red);" onclick="cartSet('${esc(l.id)}',0)">Remove</button></td>
    </tr>`).join('')}
    </tbody><tfoot><tr>
      <td colspan="3" style="text-align:right;"><strong>Total</strong></td>
      <td><strong style="font-size:17px;color:var(--deep-green);">${fmt(Math.round(cartTotal()))} TZS</strong></td>
      <td></td>
    </tr></tfoot></table>
    <label class="f" style="margin-top:12px;">Anything the Secretariat should know <span class="helper">optional</span></label>
    <input id="cart-note" placeholder="When you need it, where to deliver, and so on">
    <div style="margin-top:10px;">
      <button class="btn" onclick="sendRequest()">Request these inputs</button>
      <button class="btn small ghost" onclick="emptyCart()">Empty the basket</button>
    </div>
    <p class="helper" style="margin-top:8px;">The total is what the list says today. The Secretariat confirms it when they answer — a request is not an invoice.</p>
  </div>`;
}

function sendRequest(){
  const lines = cartLines();
  if(!lines.length) return;
  const m = MEMBERS[state.member];
  const noteEl = document.getElementById('cart-note');
  const rec = {
    id: inputId(), farmUid: state.member, farmName: m.name,
    // The price is copied onto the request. The list may change next week,
    // and what the member was quoted when they asked is what they were
    // quoted — a request that silently repriced itself would be worthless.
    items: lines.map(l=>({ inputId:l.id, label:inputLabel(l.item), cat:l.item.cat,
                           price:l.item.price, qty:l.qty, line:l.line })),
    total: cartTotal(), status:'Sent', note: noteEl ? noteEl.value.trim() : '',
    raisedOn: todayStr(), reply:'', created: new Date().toISOString()
  };
  INPUT_REQUESTS.unshift(rec);
  CART = {}; saveCart(); saveMembers();
  cloudPushRequest(rec);
  state.storeTab = 'mine';
  state.storeMsg = `Your request for ${rec.items.length} item${rec.items.length===1?'':'s'}, ${fmt(Math.round(rec.total))} TZS, has gone to the Secretariat. They answer on this tab.`;
  logAction(`${m.name} requested ${rec.items.length} input${rec.items.length===1?'':'s'} totalling ${fmt(Math.round(rec.total))} TZS.`);
  render();
}

function renderMyRequests(c, m){
  const mine = INPUT_REQUESTS.filter(r=> r.farmUid === state.member)
                             .sort((a,b)=> (b.created||'').localeCompare(a.created||''));
  c.innerHTML = `
    ${farmHeader(m)}
    <h1 class="page-title">Your input requests</h1>
    <p class="page-sub">What you have asked for, and what the Secretariat said</p>

    ${state.storeMsg ? `<div class="card"><p class="helper" style="margin:0;">${esc(state.storeMsg)}</p>
      <button class="btn small ghost" style="margin-top:8px;" onclick="clearStoreMsg()">Dismiss</button></div>` : ''}
    ${mine.length ? mine.map(r=>`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
        <div><strong>${fmt(Math.round(r.total))} TZS</strong>
          <div class="helper">${esc(r.raisedOn||'')} · ${(r.items||[]).length} item${(r.items||[]).length===1?'':'s'}</div></div>
        ${reqPill(r.status||'Sent')}
      </div>
      <table class="grid-table" style="margin-top:10px;"><thead><tr>
        <th>Item</th><th>Price</th><th>Qty</th><th>Line</th></tr></thead><tbody>
        ${(r.items||[]).map(i=>`<tr><td>${esc(i.label)}</td><td>${fmt(i.price)}</td>
          <td>${i.qty}</td><td>${fmt(Math.round(i.line))}</td></tr>`).join('')}
      </tbody></table>
      ${r.note ? `<p class="helper" style="margin-top:8px;">Your note: ${esc(r.note)}</p>` : ''}
      ${r.reply ? `<div class="log-item" style="display:block;margin-top:10px;">
        <div class="helper">The Secretariat</div>
        <div style="font-size:13.5px;line-height:1.6;">${esc(r.reply)}</div></div>` : ''}
    </div>`).join('')
    : emptyState('You have not requested anything yet',

/* ---- What is not on the list ------------------------------------------ */
function renderSuggestions(c, m){
  const open = INPUT_SUGGESTIONS.slice()
    .sort((a,b)=> (b.backers||[]).length - (a.backers||[]).length ||
                  (b.raisedOn||'').localeCompare(a.raisedOn||''));
  c.innerHTML = `
    ${farmHeader(m)}
    <h1 class="page-title">Suggest an input</h1>
    <p class="page-sub">Something the association does not stock, that you think it should</p>
    ${storeTabs()}
    ${state.storeMsg ? `<div class="card"><p class="helper" style="margin:0;">${esc(state.storeMsg)}</p>
      <button class="btn small ghost" style="margin-top:8px;" onclick="clearStoreMsg()">Dismiss</button></div>` : ''}

    <div class="card">
      <label class="f">What do you need?</label>
      <input id="sug-name" placeholder="Name it as precisely as you can — make, size, rating">
      <label class="f">Why</label>
      <textarea id="sug-why" rows="3" placeholder="What you would use it for, and how much of it you would buy"></textarea>
      <button class="btn small" style="margin-top:8px;" onclick="addSuggestion()">Suggest it</button>
      <p class="helper" id="sug-error" style="color:var(--red);margin-top:8px;"></p>
      <p class="helper" style="margin-top:8px;">Other members can back a suggestion. Several farms wanting the same thing is a far easier case for the Secretariat to act on than one farm asking twice.</p>
    </div>

    ${open.length ? `<div class="section-label">What members have asked for</div>
      ${open.map(x=>{
        const backers = x.backers || [];
        const backed = backers.includes(state.member);
        const mineOwn = x.farmUid === state.member;
        return `<div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
            <div>
              <strong>${esc(x.name)}</strong>
              <div class="helper" style="margin-top:2px;">${esc(x.farmName||'A member')} · ${esc(x.raisedOn||'')}</div>
            </div>
            <div style="text-align:right;">
              <span class="status-pill status-${x.status==='Stocked'?'active':(x.status==='Declined'?'inactive':'pending')}">${esc(x.status||'Open')}</span>
              <div class="helper" style="margin-top:4px;">${backers.length} farm${backers.length===1?'':'s'} want${backers.length===1?'s':''} this</div>
            </div>
          </div>
          ${x.why ? `<p style="margin:10px 0 0;font-size:13.5px;line-height:1.6;">${esc(x.why)}</p>` : ''}
          ${mineOwn ? '<p class="helper" style="margin-top:8px;">This is yours.</p>'
            : `<button class="btn small ${backed?'ghost':''}" style="margin-top:10px;" onclick="backSuggestion('${esc(x.id)}')">${backed ? 'You want this too — take it back' : 'I want this too'}</button>`}
        </div>`;
      }).join('')}` : ''}
  `;
}

function addSuggestion(){
  const err = document.getElementById('sug-error');
  const name = document.getElementById('sug-name').value.trim();
  const why = document.getElementById('sug-why').value.trim();
  if(name.length < 3){ err.textContent = 'Name what you need.'; return; }
  const m = MEMBERS[state.member];
  const rec = {
    id: inputId(), farmUid: state.member, farmName: m.name,
    name, why, backers:[state.member], status:'Open',
    raisedOn: todayStr(), created: new Date().toISOString()
  };
  INPUT_SUGGESTIONS.unshift(rec);
  saveMembers(); cloudPushSuggestion(rec);
  state.storeMsg = 'Suggested. Other members can back it, and the Secretariat sees it on their Inputs tab.';
  logAction(`${m.name} suggested stocking ${name}.`);
  render();
}

function backSuggestion(id){
  const x = INPUT_SUGGESTIONS.find(y=> y.id === id);
  if(!x) return;
  const backers = (x.backers || []).slice();
  const at = backers.indexOf(state.member);
  if(at === -1) backers.push(state.member); else backers.splice(at, 1);
  x.backers = backers;
  saveMembers(); cloudPushSuggestion(x);
  render();
}

/* ============================================================
   Advisory — the member's side
   ============================================================ */
function casePill(st){
  const cls = { Open:'pending', Answered:'active', Closed:'inactive' }[st] || 'pending';
  return `<span class="status-pill status-${cls}">${esc(st)}</span>`;
}

function renderAdvisoryMember(c){
  const uid = state.member;
  const m = MEMBERS[uid];
  if(!m) return;
  if(cloudOn() && !state.advRead){
    state.advRead = true;
    cloudPullAdvisory().then(()=> render());
  }
  const mine = casesForFarm(uid).sort((a,b)=> (b.raisedOn||'').localeCompare(a.raisedOn||''));
  const crops = Array.from(new Set((m.crops||[]).map(x=> x.crop)));

  c.innerHTML = `
    ${farmHeader(m)}
    <h1 class="page-title">Ask an agronomist</h1>
    <p class="page-sub">Describe what you are seeing and someone who knows this crop will answer</p>
    ${state.advError ? `<div class="card"><p class="helper cat-local">${esc(state.advError)}</p></div>${(state.advError='')||''}` : ''}

    <div class="card">
      <div class="grid2">
        <div><label class="f">What is it about</label>
          <select id="case-topic" onchange="showSimilar()">
            ${CASE_TOPICS.map(t=>`<option>${esc(t)}</option>`).join('')}
          </select></div>
        <div><label class="f">Which crop <span class="helper">optional</span></label>
          <select id="case-crop" onchange="showSimilar()">
            <option value="">Not about one crop</option>
            ${crops.map(x=>`<option>${esc(x)}</option>`).join('')}
          </select></div>
      </div>
      <label class="f">What are you seeing?</label>
      <textarea id="case-q" rows="4" placeholder="The lower leaves are going yellow from the edges, about three weeks after transplanting. Watering every second day."></textarea>
      <div id="case-similar"></div>
      <button class="btn small" style="margin-top:8px;" onclick="askCase()">Send the question</button>
      <p class="helper" id="case-error" style="color:var(--red);margin-top:8px;"></p>
    </div>

    ${KNOWLEDGE.length ? `
    <div class="section-label">Answers already given</div>
    <div class="card">
      <input id="kb-search" placeholder="Search what other farms have asked" oninput="renderKbList()">
      <div id="kb-list" style="margin-top:10px;">${kbList('')}</div>
    </div>` : ''}

    ${mine.length ? `
    <div class="section-label">Your questions</div>
    ${mine.map(x=> caseCard(x, false)).join('')}` : ''}
  `;
}

function kbList(q){
  const term = String(q||'').toLowerCase().trim();
  const rows = KNOWLEDGE.filter(k=> !term ||
    `${k.title} ${k.body} ${k.crop} ${k.topic}`.toLowerCase().includes(term));
  if(!rows.length) return '<p class="helper">Nothing matches that yet.</p>';
  return rows.slice(0,12).map(k=>`<div class="log-item" style="display:block;">
    <strong>${esc(k.title)}</strong>
    <div class="helper" style="margin:2px 0 4px;">${esc(k.topic||'')}${k.crop?` · ${esc(k.crop)}`:''}${k.author?` · ${esc(k.author)}`:''}</div>
    <div style="font-size:13.5px;line-height:1.6;">${esc(k.body)}</div>
  </div>`).join('');
}
function renderKbList(){
  const el = document.getElementById('kb-list');
  const q = document.getElementById('kb-search');
  if(el) el.innerHTML = kbList(q ? q.value : '');
}

/* Before a farm waits for an answer, show the answers already given. Most
   questions have been asked before, and a library nobody is pointed at is
   a library nobody reads. */
function showSimilar(){
  const el = document.getElementById('case-similar');
  if(!el) return;
  const topic = (document.getElementById('case-topic')||{}).value;
  const crop  = (document.getElementById('case-crop')||{}).value;
  const text  = (document.getElementById('case-q')||{}).value;
  const hits = knowledgeMatches(topic, crop, text);
  el.innerHTML = hits.length ? `<div class="card" style="margin-top:10px;background:var(--field-cream);">
    <strong style="font-size:13px;">This may already be answered</strong>
    ${hits.map(k=>`<p style="margin:8px 0 0;font-size:13px;line-height:1.6;"><strong>${esc(k.title)}</strong><br>${esc(k.body)}</p>`).join('')}
  </div>` : '';
}

function askCase(){
  const err = document.getElementById('case-error');
  const q = document.getElementById('case-q').value.trim();
  if(q.length < 10){ err.textContent = 'Describe what you are seeing — a sentence or two is enough.'; return; }
  const m = MEMBERS[state.member];
  const rec = {
    id: caseId(), farmUid: state.member, farmName: m.name,
    topic: document.getElementById('case-topic').value,
    crop: document.getElementById('case-crop').value,
    question: q, status: 'Open', raisedOn: todayStr(),
    replies: [], created: new Date().toISOString()
  };
  CASES.unshift(rec);
  saveMembers(); cloudPushCase(rec);
  logAction(`${m.name} asked an agronomist about ${rec.topic.toLowerCase()}.`);
  render();
}

function caseCard(x, canAnswer){
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div>
        <strong>${esc(x.topic)}</strong>${x.crop?` <span class="helper">${esc(x.crop)}</span>`:''}
        ${canAnswer?` <span class="helper">· ${esc(x.farmName||'')}</span>`:''}
        <div class="helper" style="margin-top:2px;">${esc(x.raisedOn||'')}</div>
      </div>
      ${casePill(x.status||'Open')}
    </div>
    <p style="margin:10px 0 0;font-size:13.5px;line-height:1.6;">${esc(x.question)}</p>
    ${(x.replies||[]).map(r=>`
      <div class="log-item" style="display:block;margin-top:10px;">

        <div style="font-size:13.5px;line-height:1.6;">${esc(r.text)}</div>
      </div>`).join('')}
    ${canAnswer ? `
      <div style="margin-top:12px;">
        <label class="f">Your answer</label>
        <textarea id="ans-${esc(x.id)}" rows="3" placeholder="What they should do, and why"></textarea>
        <button class="btn small" style="margin-top:8px;" onclick="answerCase('${esc(x.id)}')">Send the answer</button>
        <button class="btn small ghost" style="margin-top:8px;" onclick="answerCase('${esc(x.id)}', true)">Answer and add to the library</button>

function setRequestStatus(id, st){
  const r = INPUT_REQUESTS.find(x=> x.id === id);

  if(el && el.value.trim()) r.reply = el.value.trim();

function inputSuggestionsPanel(){
  const rows = INPUT_SUGGESTIONS.slice()
    .sort((a,b)=> (b.backers||[]).length - (a.backers||[]).length);
  if(!rows.length) return `<div class="card"><p class="helper">Nothing suggested yet. When a member asks for something the association does not stock, it arrives here — with a count of how many other farms want it too.</p></div>`;
  return `<div class="card"><p class="helper" style="margin:0;">Sorted by how many farms want each one. Adding a suggestion to the list puts it in front of every member at once — set its price first, or it goes on the list as "price on request" and cannot be put in a basket.</p></div>` +
  rows.map(x=>`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div><strong>${esc(x.name)}</strong>
        <div class="helper">${esc(x.farmName||'A member')} · ${esc(x.raisedOn||'')}</div></div>
      <div style="text-align:right;">
        <strong style="font-size:17px;">${(x.backers||[]).length}</strong>
        <div class="helper">farm${(x.backers||[]).length===1?'':'s'} want${(x.backers||[]).length===1?'s':''} it</div>
      </div>
    </div>
    ${x.why ? `<p style="margin:10px 0 0;font-size:13.5px;line-height:1.6;">${esc(x.why)}</p>` : ''}
    ${(x.status||'Open') === 'Open' ? `
      <div class="grid2" style="margin-top:10px;">
        <div><label class="f">Price if you stock it (TZS)</label><input id="sp-${esc(x.id)}" type="number" min="0" step="1"></div>
        <div><label class="f">Category</label>
          <select id="sc-${esc(x.id)}">${inputCategories().map(cat=>`<option>${esc(cat)}</option>`).join('')}</select></div>
      </div>
      <div style="margin-top:8px;">
        <button class="btn small" onclick="stockSuggestion('${esc(x.id)}')">Add it to the list</button>
        <button class="btn small ghost" onclick="declineSuggestion('${esc(x.id)}')">Cannot stock it</button>
      </div>`
    : `<p class="helper" style="margin-top:8px;">${esc(x.status)}</p>`}
  </div>`).join('');
}

function stockSuggestion(id){
  const x = INPUT_SUGGESTIONS.find(y=> y.id === id);
  if(!x) return;
  const priceEl = document.getElementById('sp-' + id);
  const catEl = document.getElementById('sc-' + id);
  const price = priceEl && priceEl.value ? Number(priceEl.value) : null;
  INPUT_CATALOGUE.unshift(inputRow({
    cat: catEl ? catEl.value : 'Other', name: x.name, variant:'',
    specs: x.why ? [x.why] : [], price, note: price ? '' : 'Price on request'
  }));
  x.status = 'Stocked';
  saveInputCatalogue(); saveMembers(); cloudPushSuggestion(x);
  state.orderMsg = `${x.name} is on the list now, so every member can see it.`;
  logAction(`Operator ${state.adminName||''} added ${x.name} to the input list.`);
  render();
}

function declineSuggestion(id){
  const x = INPUT_SUGGESTIONS.find(y=> y.id === id);
  if(!x) return;
  x.status = 'Declined';
  saveMembers(); cloudPushSuggestion(x);
  render();
}

/* ---- The list itself --------------------------------------------------- */
function inputListPanel(){
  const term = (state.inputSearch || '').toLowerCase().trim();
  const rows = INPUT_CATALOGUE.filter(x=> !term ||
    `${x.name} ${x.variant} ${x.cat}`.toLowerCase().includes(term));
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <input id="input-search" placeholder="Search the list" style="flex:1;min-width:200px;"
               value="${esc(state.inputSearch||'')}" oninput="inputSearch(this.value)">
        <button class="btn small" onclick="newInput()">+ Add an input</button>
      </div>
      <p class="helper" style="margin-top:10px;">Every member sees this list and buys from it. A price changed here is the price they are quoted from then on — requests already sent keep the price they were quoted when they asked.</p>
      ${INPUT_CATALOGUE.length === 0 ? `<button class="btn small ghost" style="margin-top:8px;" onclick="restoreInputList()">Load the TIPFA price list</button>` : ''}
    </div>
    ${state.inputEdit !== null && state.inputEdit !== undefined ? inputForm() : ''}
    <div class="card">
      <table class="grid-table"><thead><tr>
        <th>Item</th><th>Category</th><th>Price</th><th>On the list</th><th></th></tr></thead><tbody>
      ${rows.map(x=>{
        const i = INPUT_CATALOGUE.indexOf(x);
        return `<tr${x.available===false?' style="opacity:.55;"':''}>
          <td><strong>${esc(x.name)}</strong>${x.variant?`<div class="helper">${esc(x.variant)}</div>`:''}
              ${x.specs.length?`<div class="helper">${x.specs.map(esc).join(' · ')}</div>`:''}</td>
          <td>${esc(x.cat)}</td>
          <td>${inputPriced(x) ? fmt(x.price)+' TZS' : `<span class="helper">${esc(priceText(x))}</span>`}</td>
          <td>${x.available===false ? '<span class="helper">withdrawn</span>' : 'yes'}</td>
          <td>
            <button class="btn small ghost" onclick="editInput(${i})">Edit</button>
            <button class="btn small ghost" onclick="toggleInput(${i})">${x.available===false?'Restore':'Withdraw'}</button>
          </td>
        </tr>`;
      }).join('')}

      ${rows.length ? '' : '<p class="helper">Nothing matches that.</p>'}
    </div>`;
}

function inputSearch(v){ state.inputSearch = v; renderKeepingPlace('input-search'); }
function newInput(){ state.inputEdit = -1; render(); }
function editInput(i){ state.inputEdit = i; render(); }
function cancelInput(){ state.inputEdit = null; render(); }

function inputForm(){
  const isNew = state.inputEdit === -1;
  const x = isNew ? inputRow({}) : INPUT_CATALOGUE[state.inputEdit];
  if(!x) return '';
  const cats = inputCategories();
  return `<div class="card" style="border-color:var(--leaf-green);">
    <strong>${isNew ? 'Add an input' : 'Edit ' + esc(inputLabel(x))}</strong>
    <div class="grid2" style="margin-top:10px;">
      <div><label class="f">Name</label><input id="in-name" value="${esc(x.name)}"></div>
      <div><label class="f">Size or rating <span class="helper">optional</span></label><input id="in-variant" value="${esc(x.variant)}"></div>
    </div>
    <div class="grid2">
      <div><label class="f">Category</label>
        <input id="in-cat" list="in-cats" value="${esc(x.cat)}">
        <datalist id="in-cats">${cats.map(cat=>`<option value="${esc(cat)}">`).join('')}</datalist></div>
      <div><label class="f">Price (TZS) <span class="helper">leave blank for price on request</span></label>
        <input id="in-price" type="number" min="0" step="1" value="${x.price==null?'':x.price}"></div>
    </div>
    <label class="f">Details <span class="helper">one per line</span></label>
    <textarea id="in-specs" rows="3">${esc((x.specs||[]).join('\n'))}</textarea>
    <div style="margin-top:8px;">
      <button class="btn small" onclick="saveInput()">Save</button>
      <button class="btn small ghost" onclick="cancelInput()">Cancel</button>
      ${isNew ? '' : `<button class="btn small ghost" style="color:var(--red);border-color:var(--red);" onclick="deleteInput(${state.inputEdit})">Delete</button>`}
    </div>
    <p class="helper" id="in-error" style="color:var(--red);margin-top:8px;"></p>
  </div>`;
}

function saveInput(){
  const err = document.getElementById('in-error');
  const name = document.getElementById('in-name').value.trim();
  if(!name){ err.textContent = 'Name it.'; return; }
  const priceRaw = document.getElementById('in-price').value;
  const rec = {
    cat: document.getElementById('in-cat').value.trim() || 'Other',
    name, variant: document.getElementById('in-variant').value.trim(),
    specs: document.getElementById('in-specs').value.split('\n').map(t=>t.trim()).filter(Boolean),
    price: priceRaw === '' ? null : Number(priceRaw),
    note: priceRaw === '' ? 'Price on request' : ''
  };
  const adding = state.inputEdit === -1;
  if(adding) INPUT_CATALOGUE.unshift(inputRow(rec));
  else INPUT_CATALOGUE[state.inputEdit] = inputRow(Object.assign({}, INPUT_CATALOGUE[state.inputEdit], rec));
  state.inputEdit = null;
  saveInputCatalogue();
  logAction(`Operator ${state.adminName||''} ${adding ? 'added' : 'updated'} ${name} on the input list.`);
  render();
}

/* Withdrawing rather than deleting: a request already sent points at this
   row, and a deleted row would leave that request describing nothing. */
function toggleInput(i){
  const x = INPUT_CATALOGUE[i];
  if(!x) return;
  x.available = x.available === false;
  saveInputCatalogue();
  logAction(`Operator ${state.adminName||''} ${x.available ? 'restored' : 'withdrew'} ${inputLabel(x)}.`);
  render();
}

function deleteInput(i){
  const x = INPUT_CATALOGUE[i];
  if(!x) return;
  INPUT_CATALOGUE.splice(i, 1);
  state.inputEdit = null;
  saveInputCatalogue();
  logAction(`Operator ${state.adminName||''} removed ${inputLabel(x)} from the input list.`);
  render();
}

function restoreInputList(){
  INPUT_CATALOGUE = seedInputCatalogue();
  saveInputCatalogue();
  state.orderMsg = `The price list is back — ${INPUT_CATALOGUE.length} items, and every member sees them.`;
  render();
}

function answerCase(id, alsoLibrary){
  const x = CASES.find(y=> y.id === id);
  if(!x) return;
  const el = document.getElementById('ans-' + id);
  const text = el ? el.value.trim() : '';
  if(text.length < 5) return;
  x.replies = (x.replies || []).concat([{
    text, author: state.adminName || roleLabel(roleIs()), at: new Date().toISOString()
  }]);
  x.status = 'Answered';
  saveMembers(); cloudPushCase(x);
  if(alsoLibrary){
    const k = {
      id: `kb-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`,
      title: x.question.slice(0, 70), body: text, topic: x.topic, crop: x.crop || '',
      author: state.adminName || roleLabel(roleIs()), created: new Date().toISOString()
    };
    KNOWLEDGE.unshift(k);
    cloudPushKnowledge(k);
  }
  logAction(`${state.adminName||'An adviser'} answered a question from ${x.farmName||'a member'}.`);
  render();
}

function addKnowledge(){
  const err = document.getElementById('kb-error');
  const title = document.getElementById('kb-title').value.trim();

  if(!title || body.length < 10){ err.textContent = 'A title and an answer are both needed.'; return; }
  const k = {
    id: `kb-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`,
    title, body, topic: document.getElementById('kb-topic').value,
    crop: document.getElementById('kb-crop').value.trim(),
    author: state.adminName || roleLabel(roleIs()), created: new Date().toISOString()
  };
  KNOWLEDGE.unshift(k);
  saveMembers(); cloudPushKnowledge(k);
  logAction(`${state.adminName||'An adviser'} added "${title}" to the knowledge library.`);
  render();
}

function batchPill(st){
  const cls = { Recorded:'pending', Consigned:'active', Delivered:'active', Withdrawn:'inactive' }[st] || 'pending';
  return `<span class="status-pill status-${cls}">${esc(st)}</span>`;
}
function safetyBadge(b){
  const s = batchSafety(b);
  if(s.unknown) return `<span class="helper">${esc(s.text)}</span>`;
  return s.ok
    ? `<span class="status-pill status-active">Intervals observed</span>`
    : `<span class="status-pill status-inactive" style="background:var(--red);color:#fff;">${esc(s.text)}</span>`;
}

function addBatch(){
  const err = document.getElementById('bat-error');
  const m = MEMBERS[state.member];
  const i = Number(document.getElementById('bat-profile').value);
  const cr = (m.crops || [])[i];
  const kg = Number(document.getElementById('bat-kg').value) || 0;
  const on = document.getElementById('bat-date').value;
  if(!cr || kg <= 0 || !on){ err.textContent = 'Choose a crop, a date and a weight.'; return; }
  const b = {
    id: batchId(), farmUid: state.member, farmName: m.name,
    crop: cr.crop, variety: cr.variety || '', profileId: cr.id || '',
    harvestedOn: on, kg, lotCode: lotCodeFor(m, on),
    grade: document.getElementById('bat-grade').value.trim(),
    notes: document.getElementById('bat-notes').value.trim(),
    status: 'Recorded', region: m.location || '',
    created: new Date().toISOString()
  };
  BATCHES.unshift(b);
  saveMembers();
  cloudPushBatch(b);
  const safety = batchSafety(b);
  state.traceMsg = safety.ok
    ? `Recorded as ${b.lotCode}. Write that code on whatever leaves the farm.`
    : `Recorded as ${b.lotCode}, but ${safety.text.toLowerCase()} Check before this batch is sold.`;
  logAction(`${m.name} recorded ${fmt(kg)} kg of ${b.crop} as lot ${b.lotCode}.`);
  render();
}

function addApplication(){
  const err = document.getElementById('app-error');
  const m = MEMBERS[state.member];
  const i = Number(document.getElementById('app-profile').value);
  const cr = (m.crops || [])[i];
  const product = document.getElementById('app-product').value.trim();
  const on = document.getElementById('app-date').value;
  if(!cr || !product || !on){ err.textContent = 'Choose a crop, name the product and give a date.'; return; }
  const a = {
    id: `app-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`,
    farmUid: state.member, crop: cr.crop, profileId: cr.id || '',
    product, rate: document.getElementById('app-rate').value.trim(),
    appliedOn: on, phiDays: Number(document.getElementById('app-phi').value) || 0,
    notes: '', created: new Date().toISOString()
  };
  INPUTAPP.unshift(a);
  saveMembers();
  cloudPushApplication(a);
  logAction(`${m.name} recorded applying ${product} to ${a.crop}.`);
  render();
}

function removeApplication(id){
  const at = INPUTAPP.findIndex(a=> a.id === id);
  if(at === -1) return;
  INPUTAPP.splice(at, 1);
  saveMembers();
  if(cloudOn()){
    try{ CLOUD.fs.deleteDoc(CLOUD.fs.doc(CLOUD.db, 'inputApplications', id)); }catch(e){}
  }
  render();
}

/* ============================================================
   Traceability — the Secretariat's side

   One field, one lot code, and the whole history of a box.
   ============================================================ */
function renderTraceAdmin(c){
  if(cloudOn() && !state.traceRead){
    state.traceRead = true;
    cloudPullTrace().then(()=> render());

  const found = state.traceLot ? batchByLot(state.traceLot) : null;

function traceResult(b){
  const m = MEMBERS[b.farmUid] || {};
  const apps = applicationsForBatch(b);
  const safety = batchSafety(b);
  const cons = consignmentsForBatch(b.id);
  const issues = issuesForBatch(b.id);
  const rec = recallFor(b);

  return `
    <div class="section-label">Lot ${esc(b.lotCode)}</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
        <div>
          <h3 style="margin:0;">${esc(b.farmName || m.name || 'Unknown farm')}</h3>
          <p class="helper" style="margin:4px 0 0;">
            ${esc(b.crop)}${b.variety?` · ${esc(b.variety)}`:''} · picked ${esc(b.harvestedOn||'—')} · ${fmt(b.kg)} kg${b.grade?` · ${esc(b.grade)}`:''}
          </p>
          ${m.location ? `<p class="helper">${esc(m.location)}</p>` : ''}
          ${m.contact || m.phone ? `<p class="helper">Contact: ${esc(m.contact||'')}${m.phone?` · ${esc(m.phone)}`:''}</p>` : ''}
        </div>
        <div style="text-align:right;">${batchPill(b.status||'Recorded')}<div style="margin-top:6px;">${safetyBadge(b)}</div></div>
      </div>
      ${b.notes ? `<p class="helper" style="margin-top:10px;">${esc(b.notes)}</p>` : ''}
    </div>

    <div class="card">
      <strong>What was applied to this crop before it was picked</strong>
      ${apps.length ? `<table class="grid-table" style="margin-top:10px;"><thead><tr>
        <th>Product</th><th>Applied</th><th>Interval</th><th>Safe from</th><th></th></tr></thead><tbody>
        ${apps.map(a=>{
          const bad = safeFrom(a) && b.harvestedOn < safeFrom(a);
          return `<tr${bad?' style="color:var(--red);"':''}>
            <td>${esc(a.product)}</td><td>${esc(a.appliedOn)}</td>
            <td>${a.phiDays ? a.phiDays+' days' : '—'}</td>
            <td>${a.phiDays ? esc(safeFrom(a)) : '—'}</td>
            <td>${bad ? '<strong>picked too soon</strong>' : ''}</td>
          </tr>`;
        }).join('')}
      </tbody></table>` : '<p class="helper" style="margin-top:8px;">Nothing recorded as applied to this crop.</p>'}
      ${!safety.ok ? `<p class="helper" style="color:var(--red);margin-top:10px;">${esc(safety.text)} This is the association's problem as much as the farm's — the buyer will hold the association to it.</p>` : ''}
    </div>

    <div class="card">
      <strong>Where it went</strong>
      ${cons.length ? `<table class="grid-table" style="margin-top:10px;"><thead><tr>
        <th>Customer</th><th>Weight</th><th>Dispatched</th></tr></thead><tbody>
        ${cons.map(x=>`<tr><td>${esc(x.customer||'—')}</td><td>${fmt(x.kg)} kg</td><td>${esc(x.dispatchedOn||'—')}</td></tr>`).join('')}
      </tbody></table>` : '<p class="helper" style="margin-top:8px;">Not dispatched to a customer yet.</p>'}
    </div>

    ${rec.batches.length > 1 || rec.consignments.length ? `<div class="card" style="border-color:var(--harvest-orange);">
      <strong>If this lot is bad, what else is suspect</strong>
      <p class="helper" style="margin-top:6px;">Everything ${esc(b.farmName || m.name || 'that farm')} picked of ${esc(b.crop)} on ${esc(b.harvestedOn||'that day')} came off the same crop on the same day, so a fault in one is a fault in all of it until proven otherwise.</p>
      <p style="margin-top:8px;"><strong>${rec.batches.length}</strong> batch${rec.batches.length===1?'':'es'} · <strong>${fmt(Math.round(rec.kg))} kg</strong>${rec.customers.length?` · went to <strong>${rec.customers.map(esc).join(', ')}</strong>`:''}</p>
      <div style="margin-top:8px;">${rec.batches.map(x=>`<code style="margin-right:8px;">${esc(x.lotCode)}</code>`).join('')}</div>
    </div>` : ''}

    ${issues.length ? `<div class="card">
      <strong>Complaints against this lot</strong>
      ${issues.map(i=>`<p class="helper" style="margin-top:8px;">${esc(i.raisedOn||'')} · ${esc(i.severity)} · ${esc(i.issue)}${i.customer?` — ${esc(i.customer)}`:''} <em>${esc(i.status)}</em></p>`).join('')}
    </div>` : ''}
  `;
}

function doTrace(){
  const el = document.getElementById('trace-lot');
  state.traceLot = el ? el.value.trim().toUpperCase() : '';
  render();
}
function traceTo(code){ state.traceLot = String(code||'').toUpperCase(); render(); }
function clearTrace(){ state.traceLot = ''; render(); }

function addIssue(){
  const err = document.getElementById('iss-error');
  const lot = document.getElementById('iss-lot').value.trim().toUpperCase();
  const issue = document.getElementById('iss-issue').value.trim();
  if(!lot || !issue){ err.textContent = 'A lot code and what is wrong are both needed.'; return; }
  const b = batchByLot(lot);
  if(!b){ err.textContent = 'No batch carries that lot code, so there is nothing to attach this to.'; return; }
  const rec = {
    id: `iss-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`,
    lotCode: lot, batchId: b.id, farmUid: b.farmUid,
    customer: document.getElementById('iss-customer').value.trim(),
    contact: '', issue,
    severity: document.getElementById('iss-sev').value,
    status: 'Open', raisedOn: todayStr(), resolution: '',
    created: new Date().toISOString()
  };
  LOTISSUES.unshift(rec);
  saveMembers();
  cloudPushIssue(rec);
  const r = recallFor(b);
  state.traceLot = lot;
  state.traceMsg = r.batches.length > 1
    ? `Recorded against ${lot}. ${r.batches.length} batches came off that same pick — check the recall list below before more of it goes out.`
    : `Recorded against ${lot}, and traced to ${b.farmName || 'the farm'}.`;
  logAction(`Operator ${state.adminName||''} recorded a ${rec.severity.toLowerCase()} complaint against lot ${lot}.`);
  render();
}

function resolveIssue(id){
  const i = LOTISSUES.find(x=> x.id === id);
  if(!i) return;
  i.status = 'Resolved';
  saveMembers(); cloudPushIssue(i);
  logAction(`Operator ${state.adminName||''} resolved the complaint against lot ${i.lotCode}.`);
  render();
}

/* These used to clear themselves as they were drawn, which meant a message

   wiped by the very render that reported it. They now stay until the next
   thing the operator does, or until dismissed. */

      <p class="helper cat-local" style="margin:0;">${esc(state.orderError)}</p>
      <button class="btn small ghost" style="margin-top:8px;" onclick="clearOrderNotices()">Dismiss</button>
    </div>` : ''}
    ${state.orderMsg ? `<div class="card">

      <button class="btn small ghost" style="margin-top:8px;" onclick="clearOrderNotices()">Dismiss</button>

function orderMetric(label, val){
  return `<div class="metric"><div class="lbl">${esc(label)}</div><div class="val">${val}</div></div>`;
}
function orderPill(st){
  const cls = { Open:'pending', Allocated:'active', Delivered:'active',
                Closed:'inactive', Cancelled:'inactive' }[st] || 'pending';
  return `<span class="status-pill status-${cls}">${esc(st)}</span>`;
}
function allocPill(st){
  const cls = { Offered:'pending', Accepted:'active', Delivered:'active',
                Declined:'inactive' }[st] || 'pending';
  return `<span class="status-pill status-${cls}">${esc(st)}</span>`;
}

function addOrder(){
  state.orderError = ''; state.orderMsg = '';
  const err = document.getElementById('ord-error');
  const o = Object.assign(blankOrder(), {
    id: orderId(),
    customer: document.getElementById('ord-customer').value.trim(),
    customerContact: document.getElementById('ord-contact').value.trim(),
    crop: document.getElementById('ord-crop').value,
    variety: document.getElementById('ord-variety').value,
    kg: Number(document.getElementById('ord-kg').value) || 0,
    pricePerKg: Number(document.getElementById('ord-price').value) || 0,
    needBy: document.getElementById('ord-needby').value || '',
    notes: document.getElementById('ord-notes').value.trim()
  });
  if(!o.customer || !o.crop || o.kg <= 0){
    err.textContent = 'A customer, a crop and a quantity are needed.';

  }
  ORDERS.unshift(o);
  saveMembers();
  cloudPushOrder(o);
  logAction(`Operator ${state.adminName||''} recorded an order from ${o.customer}: ${fmt(o.kg)} kg of ${o.crop}.`);

  state.openOrder = o.id;

function renderOrderDetail(c, id){

  const ranked = rankFarmsForOrder(o);

  c.innerHTML = `
    <button class="btn small ghost" onclick="closeOrder()">&larr; All orders</button>
    <h1 class="page-title" style="margin-top:10px;">${esc(o.customer)}</h1>
    <p class="page-sub">${fmt(o.kg)} kg of ${esc(o.crop)}${o.variety?` · ${esc(o.variety)}`:''}${o.needBy?` · needed by ${esc(o.needBy)}`:''}</p>

      ${orderMetric('Placed with farms', fmt(Math.round(orderPlaced(o)))+' kg')}
      ${orderMetric('Accepted', fmt(Math.round(orderAccepted(o)))+' kg')}

      </div>

      ${o.customerContact ? `<p class="helper">Contact: ${esc(o.customerContact)}</p>` : ''}
    </div>

    <div class="section-label">Farms filling this order</div>

      ${mine.length ? `<table class="grid-table"><thead><tr>
        <th>Farm</th><th>Share</th><th>Expected a week</th><th>Weeks to pick</th>
        <th>Picked so far</th><th>Price</th><th>Status</th><th>Answered</th><th></th>
        </tr></thead><tbody>
        ${mine.map(a=>{
          const fm = MEMBERS[a.farmUid] || {};
          const perWeek = farmWeeklyKg(fm, a.crop);
          const hw = farmHarvestWeeks(fm, a.crop);
          const weeks = weeksToCover(fm, a.crop, Number(a.kg) || 0);
          // Picking counts from when the farm took the share on, or from
          // when it was offered if it has not answered yet.
          const since = a.respondedAt || a.created || '';
          const got = pickedSince(a.farmUid, a.crop, since);
          const started = firstPickSince(a.farmUid, a.crop, since);
          const share = Number(a.kg) || 0;
          const pct = share ? Math.min(100, Math.round((got / share) * 100)) : 0;
          return `<tr>

          <td>${fmt(a.kg)} kg</td>
          <td>${perWeek

                  + `<div class="helper">${fmt(Math.round(farmExpectedKg(fm, a.crop)))} kg over ${hw} harvest week${hw===1?'':'s'}</div>`
                : '<span class="helper">not in their harvest plan</span>'}</td>
          <td>${weeks ? esc(weeksToCoverText(weeks))
                : '<span class="helper">no weekly figure</span>'}</td>
          <td>${got > 0

      <p class="helper" style="margin:10px 0 0;">Expected a week is this farm's own harvest plan for this crop — its expected total divided by the weeks the crop bears for. Picked so far is read from the farm's own harvest records, counted from the day it took the share on, so a farm that has started picking shows here before anything is marked delivered.</p>`
        : '<p class="helper">Nothing placed yet.</p>'}
    </div>

    ${mine.length === 0 ? `<div class="card" style="border-color:var(--harvest-orange);">

    ${left > 0 ? `

        ? `<button class="btn small" onclick="suggestSplit('${esc(o.id)}')">Suggest a split for the remaining ${fmt(Math.round(left))} kg</button>`
        : ''}
      ${askableFarms(o).length ? `<button class="btn small ${ranked.some(r=>r.eligible)?'ghost':''}" onclick="askEveryone('${esc(o.id)}')">Ask all ${askableFarms(o).length} active farm${askableFarms(o).length===1?'':'s'}</button>` : ''}
      ${state.allocDraft && state.allocDraft.orderId === o.id ? allocDraftTable(o) : ''}
      <table class="grid-table" style="margin-top:14px;"><thead><tr>
        <th>Farm</th><th>Score</th><th>Expected a week</th>
        <th>Weeks for ${fmt(Math.round(left))} kg</th><th>Why</th><th></th></tr></thead><tbody>
        ${ranked.map(r=>{
          const cover = r.weeklyKg ? left / r.weeklyKg : 0;
          return `<tr${r.eligible?'':' style="opacity:.55;"'}>
          <td>${esc(r.name)}</td>
          <td>${r.eligible ? `<strong>${r.score}</strong>` : '—'}</td>
          <td>${r.weeklyKg ? `${fmt(Math.round(r.weeklyKg))} kg`
                : (r.expectedKg ? `<span class="helper">${fmt(Math.round(r.expectedKg))} kg / season</span>` : '—')}</td>
          <td>${cover ? esc(weeksToCoverText(cover)) : '—'}</td>
          <td><span class="helper">${r.why.map(esc).join(' · ')}</span></td>
          <td>${r.askable && !mine.some(a=> a.farmUid === r.id && a.status !== 'Declined')
                ? `<button class="btn small ghost" onclick="offerTo('${esc(o.id)}','${esc(r.id)}')">${r.eligible ? 'Offer' : 'Ask anyway'}</button>` : ''}</td>
        </tr>`;}).join('')}
      </tbody></table>
      ${ranked.length ? '' : '<p class="helper">No farms are registered yet, so there is nobody to place this with.</p>'}
    </div>` : `<div class="card"><p class="helper">The whole order is placed.</p></div>`}
  `;
}

function allocDraftTable(o){
  const d = state.allocDraft;
  if(!d.rows.length) return '<p class="helper" style="margin-top:10px;">No farm has that crop recorded with a harvest to spare.</p>';
  return `<div style="margin-top:12px;">
    <table class="grid-table"><thead><tr><th>Farm</th><th>Score</th><th>Share (kg)</th></tr></thead><tbody>
    ${d.rows.map((r,i)=>`<tr>
      <td>${esc(r.name)}</td><td>${r.score}</td>
      <td><input type="number" min="0" step="1" value="${r.kg}" style="max-width:120px;"
           onchange="editDraftKg(${i}, this.value)"></td>
    </tr>`).join('')}
    </tbody></table>
    <button class="btn small" style="margin-top:10px;" onclick="sendDraft('${esc(o.id)}')">Send these offers</button>
    <button class="btn small ghost" style="margin-top:10px;" onclick="cancelDraft()">Discard</button>
  </div>`;
}

function suggestSplit(id){
  const o = orderById(id);
  if(!o) return;
  state.allocDraft = { orderId:id, rows: suggestAllocation(o) };
  render();
}
function editDraftKg(i, v){
  if(state.allocDraft && state.allocDraft.rows[i]) state.allocDraft.rows[i].kg = Number(v) || 0;
}
function cancelDraft(){ state.allocDraft = null; render(); }

function newAlloc(o, farmUid, kg){
  return { id: allocId(o.id, farmUid), orderId:o.id, farmUid,
           crop:o.crop, variety:o.variety || '', kg:Number(kg)||0,
           pricePerKg:Number(o.pricePerKg)||0, needBy:o.needBy || '',
           customer:o.customer, status:'Offered', note:'',
           created:new Date().toISOString(), respondedAt:'' };
}

function placeAlloc(o, farmUid, kg){
  const rec = newAlloc(o, farmUid, kg);
  const at = ALLOCS.findIndex(a=> a.id === rec.id);
  if(at === -1) ALLOCS.push(rec); else ALLOCS[at] = rec;
  cloudPushAlloc(rec);
  return rec;
}

function sendDraft(id){
  state.orderError = ''; state.orderMsg = '';
  const o = orderById(id);
  if(!o || !state.allocDraft) return;
  let n = 0;
  state.allocDraft.rows.forEach(r=>{
    if(r.kg > 0){ placeAlloc(o, r.farmUid, r.kg); n++; }
  });
  if(o.status === 'Open' && orderPlaced(o) > 0){ o.status = 'Allocated'; cloudPushOrder(o); }
  state.allocDraft = null;
  saveMembers();
  logAction(`Operator ${state.adminName||''} offered ${o.customer}'s order to ${n} farm${n===1?'':'s'}.`);
  state.orderMsg = `${n} farm${n===1?' was':'s were'} offered a share — checking that it reached the shared database…`;
  render();
  confirmPlaced(o.id, n);
}

/* Offer the whole outstanding amount to every active farm at once. They see
   the same share and the first to accept takes it, which is how a small
   association actually works when nobody's records say who can help. */
function askEveryone(id){
  state.orderError = ''; state.orderMsg = '';
  const o = orderById(id);
  if(!o) return;
  const kg = orderRemaining(o);
  const already = allocsFor(o.id).filter(a=> a.status !== 'Declined');
  const asked = askableFarms(o).filter(r=> !already.some(a=> a.farmUid === r.id));
  // Nobody new to ask, but shares already placed may never have travelled —
  // pressing this again should send them rather than do nothing at all.
  if(!asked.length){
    if(already.length){
      already.forEach(a=> cloudPushAlloc(a));
      state.orderMsg = `Every farm has already been asked. Sending their shares again…`;
      render();
      confirmPlaced(o.id, already.length);
    }
    return;
  }
  if(kg <= 0) return;
  asked.forEach(r=> placeAlloc(o, r.id, kg));
  if(o.status === 'Open'){ o.status = 'Allocated'; cloudPushOrder(o); }
  saveMembers();
  logAction(`Operator ${state.adminName||''} asked ${asked.length} farm${asked.length===1?'':'s'} to fill ${o.customer}'s order.`);
  state.orderMsg = `${asked.length} farm${asked.length===1?' was':'s were'} asked for the full ${fmt(Math.round(kg))} kg — checking that it reached the shared database…`;
  render();
  confirmPlaced(o.id, asked.length);
}

function offerTo(id, farmUid){
  state.orderError = ''; state.orderMsg = '';
  const o = orderById(id);
  if(!o) return;
  const m = MEMBERS[farmUid] || {};
  // Offer a week's picking, not a season's — an offer a farm cannot meet
  // costs the association the order and the farm its delivery record.
  const supply = farmWeeklyKg(m, o.crop) > 0
    ? Math.round(farmSupplyBy(m, o.crop, o.needBy))
    : Math.round(farmExpectedKg(m, o.crop));
  const kg = Math.min(orderRemaining(o), supply || orderRemaining(o));
  placeAlloc(o, farmUid, kg);
  if(o.status === 'Open'){ o.status = 'Allocated'; cloudPushOrder(o); }
  saveMembers();
  logAction(`Operator ${state.adminName||''} offered ${fmt(kg)} kg of ${o.crop} to ${(MEMBERS[farmUid]||{}).name||farmUid}.`);
  render();
  confirmPlaced(o.id, allocsFor(o.id).filter(a=> a.status !== 'Declined').length);
}

function withdrawAlloc(allocIdVal){
  const at = ALLOCS.findIndex(a=> a.id === allocIdVal);
  if(at === -1) return;
  const a = ALLOCS[at];
  ALLOCS.splice(at, 1);
  saveMembers();
  if(cloudOn()){
    try{ CLOUD.fs.deleteDoc(CLOUD.fs.doc(CLOUD.db, 'orderAllocations', allocIdVal)); }catch(e){}
  }
  logAction(`Operator ${state.adminName||''} withdrew ${(MEMBERS[a.farmUid]||{}).name||a.farmUid}'s share of an order.`);
  render();
}

function markDelivered(allocIdVal){
  const a = ALLOCS.find(x=> x.id === allocIdVal);
  if(!a) return;
  a.status = 'Delivered';
  saveMembers(); cloudPushAlloc(a);
  const o = orderById(a.orderId);
  if(o && orderAccepted(o) >= Number(o.kg)){ o.status = 'Delivered'; cloudPushOrder(o); }
  logAction(`Operator ${state.adminName||''} recorded delivery from ${(MEMBERS[a.farmUid]||{}).name||a.farmUid}.`);
  render();
}

function setOrderStatus(id, st){
  const o = orderById(id);
  if(!o) return;
  o.status = st;
  saveMembers(); cloudPushOrder(o);
  logAction(`Operator ${state.adminName||''} set ${o.customer}'s order to ${st}.`);
  render();
}

/* ============================================================
   Orders — one farm's inbox

   A farm sees its own share and nothing else: not the order, not what any
   other farm was offered, not what anyone else was paid. That is enforced
   by the rules, not by this screen.
   ============================================================ */
function renderOrdersMember(c){
  const uid = state.member;
  const m = MEMBERS[uid];
  if(!m) return;
  if(cloudOn() && !state.ordersRead){
    state.ordersRead = true;
    cloudPullOrders().then(()=> render());
  }
  const mine = allocsForFarm(uid).sort((a,b)=> (b.created||'').localeCompare(a.created||''));
  const waiting = mine.filter(a=> a.status === 'Offered');
  const agreed  = mine.filter(a=> a.status === 'Accepted');
  const done    = mine.filter(a=> a.status === 'Delivered');

  c.innerHTML = `
    ${farmHeader(m)}
    <h1 class="page-title">Orders</h1>
    <p class="page-sub">What the association has asked you to supply</p>
    ${state.orderError ? `<div class="card"><p class="helper cat-local">${esc(state.orderError)}</p></div>${(state.orderError='')||''}` : ''}

    <div class="grid3">
      ${orderMetric('Waiting for your answer', String(waiting.length))}
      ${orderMetric('Accepted', fmt(Math.round(agreed.reduce((t,a)=>t+(Number(a.kg)||0),0)))+' kg')}
      ${orderMetric('Delivered', fmt(Math.round(done.reduce((t,a)=>t+(Number(a.kg)||0),0)))+' kg')}
    </div>

    ${mine.length ? mine.map(a=> allocCard(a)).join('') :
      emptyState('Nothing has been sent to you yet',
        cloudOn()
          ? 'When the Secretariat places a share of an order with your farm, it appears here for you to accept or decline. An order the Secretariat has only written down does not reach you until they place it — so if you were told to expect one, ask them whether it has been sent.'
          : 'This device cannot reach the shared database, so nothing the Secretariat has sent can arrive. Check the connection and use Refresh.')}
  `;
}

/* What this share is in the farm's own terms. A number of kilograms means
   little on its own; a number of weeks of your own picking is the thing you
   accept or decline on. */
function allocAgainstWeek(a){
  const m = MEMBERS[a.farmUid];
  if(!m || !a.kg) return '';
  const perWeek = farmWeeklyKg(m, a.crop);
  if(!(perWeek > 0)) return '';
  const weeks = Number(a.kg) / perWeek;
  const said = weeks < 1
    ? `about ${Math.round(weeks * 100)}% of one week's picking`
    : `about ${weeks < 10 ? Math.round(weeks * 10) / 10 : Math.round(weeks)} weeks of your picking`;
  return `<div class="helper">${fmt(Math.round(perWeek))} kg is what you expect each week — this share is ${said}.</div>`;
}

function allocCard(a){
  const canAnswer = a.status === 'Offered';
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
      <div>
        <strong>${fmt(a.kg)} kg of ${esc(a.crop)}</strong>${a.variety?` <span class="helper">${esc(a.variety)}</span>`:''}
        <div class="helper" style="margin-top:4px;">
          ${a.customer ? `for ${esc(a.customer)}` : 'for the association'}${a.needBy ? ` · needed by ${esc(a.needBy)}` : ''}${a.pricePerKg ? ` · ${fmt(a.pricePerKg)} TZS/kg` : ''}
        </div>
        ${a.pricePerKg && a.kg ? `<div class="helper">Worth ${fmt(Math.round(a.pricePerKg * a.kg))} TZS to your farm.</div>` : ''}
        ${allocAgainstWeek(a)}
        ${a.note ? `<div class="helper">Your note: ${esc(a.note)}</div>` : ''}
      </div>
      <div style="text-align:right;">${allocPill(a.status)}</div>
    </div>
    ${canAnswer ? `
      <div style="margin-top:12px;">
        <button class="btn small" onclick="answerAlloc('${esc(a.id)}','Accepted')">Accept this share</button>
        <button class="btn small ghost" onclick="declineAlloc('${esc(a.id)}')">Cannot take it</button>
      </div>
      ${state.decline === a.id ? `
        <div style="margin-top:10px;">
          <label class="f">Why not? <span class="helper">so the Secretariat can place it elsewhere</span></label>
          <input id="decline-note" placeholder="Harvest is late, already committed, and so on">
          <button class="btn small" style="margin-top:8px;" onclick="answerAlloc('${esc(a.id)}','Declined')">Send</button>
        </div>` : ''}
    ` : ''}
  </div>`;
}

function declineAlloc(id){ state.decline = id; render(); }

function answerAlloc(id, status){
  const a = ALLOCS.find(x=> x.id === id);
  if(!a) return;
  const noteEl = document.getElementById('decline-note');
  a.status = status;
  a.respondedAt = new Date().toISOString();
  if(status === 'Declined' && noteEl) a.note = noteEl.value.trim();
  state.decline = null;
  saveMembers(); cloudPushAlloc(a);
  logAction(`${(MEMBERS[a.farmUid]||{}).name||'A farm'} ${status.toLowerCase()} a ${fmt(a.kg)} kg share of ${a.crop}.`);
  render();
}

function renderComms(c, isAdmin){
  const list = isAdmin ? complaints : complaints.filter(x=>x.member===state.member);
  c.innerHTML = `
    <h1 class="page-title">${isAdmin?'Manage submissions':'Requests & complaints'}</h1>

    <div class="card">

      <tbody>${list.length ? list.map(x=>`<tr><td>${MEMBERS[x.member] ? farmCell(MEMBERS[x.member]) : 'Removed farm'}</td><td>${esc(x.type)}: ${esc(x.text)}</td>
        ${isAdmin?`<td>${x.assignee}</td>`:''}
        <td>${isAdmin ? `<select onchange="updateStatus(${x.id},this.value)">
            <option value="open" ${x.status==='open'?'selected':''}>Open</option>
            <option value="progress" ${x.status==='progress'?'selected':''}>In progress</option>
            <option value="resolved" ${x.status==='resolved'?'selected':''}>Resolved</option>
          </select>` : `<span class="status-pill status-${x.status}">${x.status==='progress'?'In progress':x.status.charAt(0).toUpperCase()+x.status.slice(1)}</span>`}</td>
      </tr>`).join('') : '<tr><td colspan="4" style="color:var(--muted);">No submissions yet.</td></tr>'}</tbody></table>

function addComplaint(){
  const type = document.getElementById('msg-type').value;
  const text = document.getElementById('msg-text').value.trim();
  if(!text) return;
  const c = { id:nextComplaintId++, docId: submissionId(state.member), member:state.member,
              type, text, status:'open', assignee:'Unassigned',
              created: new Date().toISOString() };
  complaints.unshift(c);
  cloudPushSubmission(c);
  logAction(`${MEMBERS[state.member].name} submitted a new ${type.toLowerCase()}.`);
  render();
}
function updateStatus(id, status){
  const item = complaints.find(x=>x.id===id); item.status = status;
  cloudPushSubmission(item);
  logAction(`Submission #${id} (${MEMBERS[item.member] ? MEMBERS[item.member].name : 'removed farm'}) status set to ${status}.`);
  render();
}

function toggleAdminRegister(v){ state.showAdminRegister = v; delete pendingLogos.areg; render(); }

function submitAdminRegistration(){
  const vals = readProfileFields('areg');
  const pass = document.getElementById('areg-password').value;
  if(!vals.name || !vals.contact || !vals.phone){
    flagError(document.getElementById('areg-error'), 'Farm name, contact person, and phone number are required.');
    return;
  }
  if(!vals.email || !looksLikeEmail(vals.email)){
    flagError(document.getElementById('areg-error'), 'A valid email address is required — the farm signs in with it.');
    return;
  }
  if(!pass || pass.length < 4){
    document.getElementById('areg-error').textContent = 'Set a password of at least 4 characters for this member.';
    return;
  }
  if(findMemberByLogin(vals.phone) || (vals.email && findMemberByLogin(vals.email))){
    flagError(document.getElementById('areg-error'), 'A farm is already registered with that phone number or email.');
    return;
  }
  const id = slugify(vals.name);
  MEMBERS[id] = Object.assign({}, vals, { password: pass, category: vals.category || 'Functional', registered: todayStr(), status:'Active', crops:[] });
  createBlankRecords(id);
  delete pendingLogos.areg;
  logAction(`Operator registered a new member directly: ${vals.name} (activated immediately).`);
  state.showAdminRegister = false;
  render();
}

function editCropYield(ci){ state.yieldEdit = ci; render(); }

function saveCropYield(ci){
  const crop = CATALOGUE[ci];
  const msg = document.getElementById('cy-msg');
  if(!crop) return;
  const avg = Number(document.getElementById('cy-avg').value);
  if(!(avg > 0)){
    if(msg) msg.textContent = 'The total harvest must be more than zero — a farm cannot plan a harvest from nothing.';
    return;
  }
  const season = Number(document.getElementById('cy-season').value) || SEASON_WEEKS;
  crop.avgYieldPerPlant = avg;
  crop.yieldUnit = document.getElementById('cy-yunit').value || 'kg';
  crop.countUnit = document.getElementById('cy-cunit').value;
  crop.seasonWeeks = season;
  state.yieldEdit = null;
  state.catMsg = `${crop.name}: ${avg} ${crop.yieldUnit} per ${countWord(crop.countUnit,1)}. ${farmsGrowing(crop.name)}.`;
  logAction(`Operator set ${crop.name} to ${avg} ${crop.yieldUnit} per ${countWord(crop.countUnit,1)} over ${season} weeks.`);
  saveCatalogue();
  render();
}

function catalogueFigures(v, crop){
  const own = v.avgYieldPerPlant != null && v.avgYieldPerPlant !== '';
  const bits = [];
  bits.push(own
    ? `<strong>${v.avgYieldPerPlant} ${esc(v.yieldUnit || 'kg')}</strong> per ${esc(countWord((crop&&crop.countUnit)||'plant',1))} <span class="helper">(its own)</span>`
    : `<span class="helper">uses ${esc((crop&&crop.name)||'the crop')}'s figure</span>`);
  if(v.notes) bits.push(esc(v.notes));
  return bits.join('<br>');
}

// Who this change reaches, said plainly before it is made.
function farmsGrowing(cropName){
  const n = Object.keys(MEMBERS).filter(id=>
    (MEMBERS[id].crops||[]).some(cr=> (cr.crop||'').toLowerCase() === cropName.toLowerCase())).length;
  return n ? `${n} member farm${n===1?'':'s'} ${n===1?'grows':'grow'} this` : 'No member farm grows this yet';
}

function readVarietyForm(){
  const val = id=>{ const el = document.getElementById(id); return el ? el.value : ''; };

           perSqm: Number(val('cv-persqm')) || 0, notes: val('cv-notes').trim(),
           // Blank means inherit. Only a figure actually entered overrides the crop.
           avgYieldPerPlant: avg === '' ? null : Number(avg),
           yieldUnit: avg === '' ? null : (val('cv-yunit') || 'kg'),
           months: [] };
}

function editCatalogueVariety(ci, vi){ state.catEdit = {ci, vi}; render(); }
function addCatalogueVariety(ci){ state.catEdit = {ci, vi:-1}; render(); }
function cancelCatalogueEdit(){ state.catEdit = null; render(); }

function saveCatalogueVariety(ci, vi){
  const msg = document.getElementById('cv-msg');
  const crop = CATALOGUE[ci];
  if(!crop) return;
  const v = readVarietyForm();
  if(!v.name){ if(msg) msg.textContent = 'Give the variety a name.'; return; }
  const clash = (crop.varieties||[]).some((x, xi)=> xi !== vi && x.name.toLowerCase() === v.name.toLowerCase());
  if(clash){ if(msg) msg.textContent = 'That variety is already listed under this crop.'; return; }
  // The months a variety used to carry are kept if it already had them; they
  // no longer drive anything a member sees, and the crop's own figure does.
  const prev = vi === -1 ? null : (crop.varieties||[])[vi];
  if(prev && Array.isArray(prev.months)) v.months = prev.months;

  crop.varieties = crop.varieties || [];
  const was = vi === -1 ? null : crop.varieties[vi];
  if(vi === -1) crop.varieties.push(v); else crop.varieties[vi] = v;
  // A renamed variety would orphan every farm that chose it by name.
  if(was && was.name !== v.name) renameFarmVariety(crop.name, was.name, v.name);
  state.catEdit = null;
  state.catMsg = `${v.name} saved under ${crop.name}. ${farmsGrowing(crop.name)}.`;
  logAction(`Operator ${vi===-1?'added':'updated'} catalogue variety ${crop.name} — ${v.name}.`);
  saveCatalogue();
  render();
}

function removeCatalogueVariety(ci, vi){
  const crop = CATALOGUE[ci]; if(!crop) return;
  const v = crop.varieties[vi]; if(!v) return;
  const ok = (typeof confirm === 'function')
    ? confirm(`Remove ${v.name} from ${crop.name}? Farms that already chose it keep the name on their crop, but can no longer plan a harvest from it.`) : true;
  if(!ok) return;
  crop.varieties.splice(vi, 1);
  state.catEdit = null;
  state.catMsg = `${v.name} removed from ${crop.name}.`;
  logAction(`Operator removed catalogue variety ${crop.name} — ${v.name}.`);
  saveCatalogue();
  render();
}

function addCatalogueCrop(){
  const el = document.getElementById('cat-newcrop');
  const err = document.getElementById('cat-error');
  const name = el ? el.value.trim() : '';
  if(!name){ if(err) err.textContent = 'Enter the crop name.'; return; }
  if(catalogueCrop(name)){ if(err) err.textContent = 'That crop is already in the catalogue.'; return; }
  CATALOGUE.push({ name, varieties: [] });
  state.catMsg = `${name} added. Give it at least one variety before farms can plan from it.`;
  logAction(`Operator added ${name} to the crop catalogue.`);
  saveCatalogue();
  render();
}

function renameCatalogueCrop(ci){
  const crop = CATALOGUE[ci]; if(!crop) return;
  const next = (typeof prompt === 'function') ? prompt('Rename this crop to:', crop.name) : null;
  if(!next || !next.trim() || next.trim() === crop.name) return;
  const name = next.trim();
  if(catalogueCrop(name)){ state.catMsg = `${name} is already in the catalogue.`; render(); return; }
  const was = crop.name;
  crop.name = name;
  logAction(`Operator renamed catalogue crop ${was} to ${name}.`);
  state.catMsg = `${was} is now ${name}. Farms keep their own crop names — this changes the list they choose from.`;
  saveCatalogue();
  render();
}

function removeCatalogueCrop(ci){
  const crop = CATALOGUE[ci]; if(!crop) return;
  const ok = (typeof confirm === 'function')
    ? confirm(`Remove ${crop.name} and its ${(crop.varieties||[]).length} variety/varieties from the catalogue? ${farmsGrowing(crop.name)}.`) : true;
  if(!ok) return;
  CATALOGUE.splice(ci, 1);
  state.catEdit = null;
  state.catMsg = `${crop.name} removed from the catalogue.`;
  logAction(`Operator removed ${crop.name} from the crop catalogue.`);
  saveCatalogue();
  render();
}

function restoreCatalogue(){
  const ok = (typeof confirm === 'function')
    ? confirm('Replace the catalogue with the built-in list? Crops and varieties you added are removed.') : true;
  if(!ok) return;
  CATALOGUE = defaultCatalogue();
  state.catEdit = null;
  state.catMsg = 'The catalogue has been restored to the built-in list.';
  logAction('Operator restored the built-in crop catalogue.');
  saveCatalogue();
  render();
}

// Keep farms pointing at a variety that has been renamed under them.
function renameFarmVariety(cropName, was, now){
  Object.keys(MEMBERS).forEach(id=>{
    (MEMBERS[id].crops||[]).forEach(cr=>{
      if((cr.crop||'').toLowerCase() === cropName.toLowerCase()
        && (cr.variety||'').toLowerCase() === was.toLowerCase()){
        cr.variety = now;
        operatorSync(id);
      }
    });
  });
}

/* ============================================================
   Operator oversight of crop calendars
   Every programme a farm builds on its own side is visible here,
   read only: stages, products in all categories, what has been
   applied, and the same generated programme the farm sees.
   ============================================================ */
function allFarmCrops(){
  const out = [];
  Object.keys(MEMBERS).forEach(id=> (MEMBERS[id].crops||[]).forEach((cr, i)=>{
    ensureProgramme(cr);
    out.push({id, member:MEMBERS[id], cr, i});
  }));
  return out;
}
function cropProgrammeTotals(cr){
  let listed = 0, applied = 0, stagesDone = 0;
  CROP_STAGES.forEach(st=>{
    const pr = stageProgress(cr, st);
    listed += pr.total; applied += pr.done;
    if(pr.complete) stagesDone++;
  });
  return {listed, applied, stagesDone};
}
function selectAdminCrop(id, i){ state.admCrop = {id, i}; render(); }

function openFarmCalendar(id, i){ state.admCrop = {id, i}; state.tab = 'calendarsA'; render(); }
function clearAdminCrop(){ state.admCrop = null; render(); }

// Which products the membership uses most, across every farm's programme.
function productUsage(){
  const tally = {};
  allFarmCrops().forEach(({member, cr})=>{
    CROP_STAGES.forEach(st=> CATEGORY_KEYS.forEach(k=>
      (cr.programme[st][k]||[]).forEach(r=>{
        const name = (r.product||'').trim();
        if(!name) return;
        const key = k + '|' + name.toLowerCase();
        if(!tally[key]) tally[key] = {product:name, cat:k, uses:0, farms:{}};
        tally[key].uses++;
        tally[key].farms[member.name] = true;
      })));
  });
  return Object.values(tally)
    .map(x=> Object.assign(x, {farmCount:Object.keys(x.farms).length}))
    .sort((a,b)=> b.farmCount-a.farmCount || b.uses-a.uses || a.product.localeCompare(b.product));
}

function renderBulkTable(ids){

  const rows = ids.map(id=>{

      // A farm is only given a cell for a crop it actually grows.

        return `<td style="background:#F4F3EA;" title="${esc(MEMBERS[id].name)} does not grow ${esc(col)}">—</td>`;

function saveBulk(){
  const set = state.bulkSet || 'harvestActual';
  const month = state.selMonth, week = state.selWeek;
  document.querySelectorAll('.bulk-input').forEach(inp=>{
    const id = inp.dataset.member, col = inp.dataset.col, val = Number(inp.value)||0;
    if(!harvest[id] || !inputsData[id]) return;
    if(set==='harvestActual'){ const w = harvestWeek(id,'actual',state.selYear,month,week); if(w) w[col]=val; }
    else { const w = harvestWeek(id,'plan',state.selYear,month,week); if(w) w[col]=val; }
  });
  const when = `${MONTHS[month-1]} ${state.selYear}, week ${week}`;
  logAction(`Operator saved bulk ${set==='harvestActual'?'actual harvest':'harvest plan'} entries (${when}) for ${activeMembers().length} farms.`);
