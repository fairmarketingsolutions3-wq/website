      ${yearTable(id, kind, year)}
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn small" onclick="exportYearTable('${kind}')">Download this table (CSV)</button>
        <button class="btn small ghost" onclick="archiveSection('${kind==='plan'?'Harvest plan':'Actual harvest'}')">Archive this year</button>
      </div>
      <p class="helper" style="margin-top:8px;">Every month of ${year}, by crop. The highlighted row is the month you are entering above.</p>
    </div>
    ${kind==='plan' ? harvestPlanSource(m) : ''}
    ${kind==='actual' ? renderPlanVsActual(m) : ''}`
    : emptyState('Add your crops first',
        'This table lists the crops from your crop profile. Add the crops you grow on the Profile tab and they appear here to record against.')}`;
}

function renderPlanVsActual(m){
  const id = state.member, month = state.selMonth, week = state.selWeek;
  let weekPlanTotal=0, weekActualTotal=0;
  const year = state.selYear;
  weekPlanTotal = weekTotal(id,'plan',year,month,week); weekActualTotal = weekTotal(id,'actual',year,month,week);
  const monthPlanTotal = memberMonthTotal(id,'plan',year,month), monthActualTotal = memberMonthTotal(id,'actual',year,month);
  const yearPlanTotal = memberYearTotal(id,'plan',year), yearActualTotal = memberYearTotal(id,'actual',year);
  const rows = memberCrops(id).map(cr=>{
    const p = memberMonthCropTotal(id,'plan',year,month,cr), a = memberMonthCropTotal(id,'actual',year,month,cr);
    if(p===0 && a===0) return '';
    return `<tr><td>${esc(cr)}</td><td>${fmt(p)}</td><td>${fmt(a)}</td><td>${pct(a,p)}%</td></tr>`;
  }).join('');
  return `<div class="section-label">Plan vs. actual — performance</div>
    <div class="card">
      ${comparisonBar('Week '+week+' of '+MONTHS[month-1], weekPlanTotal, weekActualTotal)}
      ${comparisonBar(MONTHS[month-1]+' (month to date)', monthPlanTotal, monthActualTotal)}
      ${comparisonBar('Year to date (2026)', yearPlanTotal, yearActualTotal)}
      <table class="grid-table"><thead><tr><th>Crop</th><th>${MONTHS[month-1]} plan</th><th>${MONTHS[month-1]} actual</th><th>% of plan</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" style="color:var(--muted);">No data for this month yet.</td></tr>'}</tbody></table>
    </div>`;
}

function setHarvest(kind, month, week, crop, value){
  const id = state.member;
  if(!harvest[id] || !crop) return;
  const wk = harvestWeek(id, kind, state.selYear, month, week);
  if(wk) wk[crop] = Number(value)||0;
}
function saveHarvest(kind){
  const m = MEMBERS[state.member];
  logAction(`${m.name} saved ${kind==='plan'?'harvest plan':'actual harvest'} for ${MONTHS[state.selMonth-1]} ${state.selYear}, week ${state.selWeek}.`);
  state.harvestSaved = true;
  renderKeepingPlace();          // the year table below reads these figures
}

    rows.push({crop:cr.crop, stage:st, cat:x.cat, e:x.entry}))));

  if(!rows.length){
    c.innerHTML = `
      <h1 class="page-title">Input requirements</h1>
      <p class="page-sub">${esc(m.name)} · every input you have recorded on your crop calendar, by crop stage</p>

      <div class="card" style="overflow-x:auto;">

            <th style="width:110px;">Dosage</th><th style="width:150px;">Method</th><th style="width:110px;">Applied</th></tr></thead>
          <tbody>${inStage.map(r=>`<tr class="${r.e.done?'row-done':''}">

            <td>${esc(r.e.target || r.e.composition || '—')}</td>

      </div>
      <p class="helper" style="margin-top:10px;">The report lists every input by crop and stage, with its dosage, method and whether it has been applied.</p>
    </div>`;
}

// Every input this farm has recorded, flattened for a report.
function inputReportRows(m){
  const rows = [];
  (m.crops||[]).forEach(cr=>{ ensureProgramme(cr);
    CROP_STAGES.forEach(st=>{
      const timing = stageWindows(cr);
      stageItems(cr, st).forEach(x=> rows.push([
        m.name, cr.crop, cr.variety||'', st, timing[st].dates||'', x.cat, x.entry.product,
        x.entry.target || x.entry.composition || '', x.entry.dose||'', x.entry.unit||'',
        x.entry.method||'', x.entry.done?'Yes':'No', x.entry.doneOn||''
      ]));
    });
  });
  return rows;
}

  'Composition / target','Dosage','Unit','Method','Applied','Applied on'];

function exportInputReport(){
  const m = MEMBERS[state.member];

}

function exportHarvestPlanReport(id){
  const m = MEMBERS[id];
  const year = state.selYear, month = state.selMonth, week = state.selWeek;
  const rows = [['Crop','Week '+week+' plan (kg)','Week '+week+' actual (kg)','Monthly plan (kg)','Monthly actual (kg)','Annual plan (kg)','Annual actual (kg)']];
  memberCrops(id).forEach(cr=>{
    const wpW = harvestWeek(id,'plan',year,month,week), waW = harvestWeek(id,'actual',year,month,week);
    const wp = (wpW && wpW[cr])||0, wa = (waW && waW[cr])||0;
    const mp = memberMonthCropTotal(id,'plan',year,month,cr), ma = memberMonthCropTotal(id,'actual',year,month,cr);
    let yp=0, ya=0; for(let mo=1;mo<=12;mo++){ yp+=memberMonthCropTotal(id,'plan',year,mo,cr); ya+=memberMonthCropTotal(id,'actual',year,mo,cr); }
    rows.push([cr, wp, wa, mp, ma, yp, ya]);
  });
  downloadCSV(`${m.name.replace(/\s+/g,'_')}_harvest_plan_${MONTHS[month-1]}_wk${week}.csv`, rows);
  logAction(`${m.name} exported harvest plan report (${MONTHS[month-1]}, week ${week}).`);
}

  if(!vals.name || !vals.contact || !vals.phone){

// Switching pattern redraws the row so its own figures are asked for.
function repatternCatalogueRow(ci, vi){
  const pattern = document.getElementById('cv-pattern').value;
  const draft = { name:document.getElementById('cv-name').value,
                  perSqm:Number(document.getElementById('cv-persqm').value)||0,
                  notes:document.getElementById('cv-notes').value, pattern };
  state.catDraft = draft;
  const crop = CATALOGUE[ci];
  const holder = document.querySelector('tr.crop-edit');
  if(holder && crop) holder.outerHTML = catalogueEditRow(crop, draft, ci, vi);
}

function saveCatalogueVariety(ci, vi){
  const msg = document.getElementById('cv-msg');
  const crop = CATALOGUE[ci];
  if(!crop) return;
  const name = document.getElementById('cv-name').value.trim();
  if(!name){ if(msg) msg.textContent = 'Give the variety a name.'; return; }
  const pattern = document.getElementById('cv-pattern').value;
  const clash = (crop.varieties||[]).some((x, xi)=> xi !== vi && x.name.toLowerCase() === name.toLowerCase());
  if(clash){ if(msg) msg.textContent = 'That variety is already listed under this crop.'; return; }
  const v = { name, pattern,
    perSqm: Number(document.getElementById('cv-persqm').value)||0,
    notes: document.getElementById('cv-notes').value.trim() };
  YIELD_PATTERNS[pattern].fields.forEach(([k])=>{
    v[k] = Number(document.getElementById('cv-'+k).value)||0;
  });
  crop.varieties = crop.varieties || [];
  const was = vi === -1 ? null : crop.varieties[vi];
  if(vi === -1) crop.varieties.push(v); else crop.varieties[vi] = v;
  // A renamed variety would orphan every farm that chose it by name.
  if(was && was.name !== name) renameFarmVariety(crop.name, was.name, name);
  state.catEdit = null;
  state.catMsg = `${name} saved. ${farmsGrowing(crop.name)}.`;
  logAction(`Operator ${vi===-1?'added':'updated'} catalogue variety ${crop.name} — ${name}.`);
  saveCatalogue();
  render();
}

function removeCatalogueVariety(ci, vi){
  const crop = CATALOGUE[ci]; if(!crop) return;
  const v = crop.varieties[vi]; if(!v) return;
  const ok = (typeof confirm === 'function')
    ? confirm(`Remove ${v.name} from ${crop.name}? Farms that already chose it keep the name on their crop, but can no longer plan a harvest from it.`) : true;
  if(!ok) return;
  crop.varieties.splice(vi, 1);
  state.catEdit = null;
  state.catMsg = `${v.name} removed from ${crop.name}.`;
  logAction(`Operator removed catalogue variety ${crop.name} — ${v.name}.`);
  saveCatalogue();
  render();
}

function addCatalogueCrop(){
  const el = document.getElementById('cat-newcrop');
  const err = document.getElementById('cat-error');
  const name = el ? el.value.trim() : '';
  if(!name){ if(err) err.textContent = 'Enter the crop name.'; return; }
  if(catalogueCrop(name)){ if(err) err.textContent = 'That crop is already in the catalogue.'; return; }
  CATALOGUE.push({ name, varieties: [] });
  state.catMsg = `${name} added. Give it at least one variety before farms can plan from it.`;
  logAction(`Operator added ${name} to the crop catalogue.`);
  saveCatalogue();
  render();
}

function renameCatalogueCrop(ci){
  const crop = CATALOGUE[ci]; if(!crop) return;
  const next = (typeof prompt === 'function') ? prompt('Rename this crop to:', crop.name) : null;
  if(!next || !next.trim() || next.trim() === crop.name) return;
  const name = next.trim();
  if(catalogueCrop(name)){ state.catMsg = `${name} is already in the catalogue.`; render(); return; }
  const was = crop.name;
  crop.name = name;
  logAction(`Operator renamed catalogue crop ${was} to ${name}.`);
  state.catMsg = `${was} is now ${name}. Farms keep their own crop names — this changes the list they choose from.`;
  saveCatalogue();
  render();
}

function removeCatalogueCrop(ci){
  const crop = CATALOGUE[ci]; if(!crop) return;
  const ok = (typeof confirm === 'function')
    ? confirm(`Remove ${crop.name} and its ${(crop.varieties||[]).length} variety/varieties from the catalogue? ${farmsGrowing(crop.name)}.`) : true;
  if(!ok) return;
  CATALOGUE.splice(ci, 1);
  state.catEdit = null;
  state.catMsg = `${crop.name} removed from the catalogue.`;
  logAction(`Operator removed ${crop.name} from the crop catalogue.`);
  saveCatalogue();
  render();
}

function restoreCatalogue(){
  const ok = (typeof confirm === 'function')
    ? confirm('Replace the catalogue with the built-in list? Crops and varieties you added are removed.') : true;
  if(!ok) return;
  CATALOGUE = defaultCatalogue();
  state.catEdit = null;
  state.catMsg = 'The catalogue has been restored to the built-in list.';
  logAction('Operator restored the built-in crop catalogue.');
  saveCatalogue();
  render();
}

// Keep farms pointing at a variety that has been renamed under them.
function renameFarmVariety(cropName, was, now){
  Object.keys(MEMBERS).forEach(id=>{
    (MEMBERS[id].crops||[]).forEach(cr=>{
      if((cr.crop||'').toLowerCase() === cropName.toLowerCase()
        && (cr.variety||'').toLowerCase() === was.toLowerCase()){
        cr.variety = now;
        operatorSync(id);
      }
    });
  });
}

/* ============================================================
   Operator oversight of crop calendars
   Every programme a farm builds on its own side is visible here,
   read only: stages, products in all categories, what has been
   applied, and the same generated programme the farm sees.
   ============================================================ */
function allFarmCrops(){
  const out = [];
  Object.keys(MEMBERS).forEach(id=> (MEMBERS[id].crops||[]).forEach((cr, i)=>{
    ensureProgramme(cr);
    out.push({id, member:MEMBERS[id], cr, i});
  }));
  return out;
}
function cropProgrammeTotals(cr){
  let listed = 0, applied = 0, stagesDone = 0;
  CROP_STAGES.forEach(st=>{
    const pr = stageProgress(cr, st);
    listed += pr.total; applied += pr.done;
    if(pr.complete) stagesDone++;
  });
  return {listed, applied, stagesDone};
}

// Open a farm's calendar from Member management.

// Which products the membership uses most, across every farm's programme.
function productUsage(){
  const tally = {};
  allFarmCrops().forEach(({member, cr})=>{
    CROP_STAGES.forEach(st=> CATEGORY_KEYS.forEach(k=>
      (cr.programme[st][k]||[]).forEach(r=>{
        const name = (r.product||'').trim();
        if(!name) return;
        const key = k + '|' + name.toLowerCase();
        if(!tally[key]) tally[key] = {product:name, cat:k, uses:0, farms:{}};
        tally[key].uses++;
        tally[key].farms[member.name] = true;
      })));
  });
  return Object.values(tally)
    .map(x=> Object.assign(x, {farmCount:Object.keys(x.farms).length}))
    .sort((a,b)=> b.farmCount-a.farmCount || b.uses-a.uses || a.product.localeCompare(b.product));
}

function renderBulkTable(ids){

function saveBulk(){

  const month = state.selMonth, week = state.selWeek;

function memberMonthCropTotal(id, kind, year, month, crop){
  if(!harvest[id]) return 0;
  let t=0; for(let w=1; w<=4; w++){
    const wk = harvestWeek(id, kind, year, month, w);
    t += (wk && wk[crop]) || 0;
  }
  return t;
}
function weekTotal(id, kind, year, month, week){
  const wk = harvestWeek(id, kind, year, month, week);
  if(!wk) return 0;
  return Object.keys(wk).reduce((t,cr)=> t + (Number(wk[cr])||0), 0);
}
function memberMonthTotal(id, kind, year, month){
  let t=0; for(let w=1; w<=4; w++){ t += weekTotal(id, kind, year, month, w); } return t;
}
function memberYearTotal(id, kind, year){
  let t=0; for(let m=1; m<=12; m++){ t += memberMonthTotal(id, kind, year, m); } return t;
}
function coopWeekTotal(kind, year, month, week){
  let t=0; activeMembers().forEach(id=> t += weekTotal(id, kind, year, month, week)); return t;
}
function coopMonthTotal(kind, year, month){
  let t=0; activeMembers().forEach(id=> t += memberMonthTotal(id, kind, year, month)); return t;
}
function coopYearTotal(kind, year){
  let t=0; activeMembers().forEach(id=> t += memberYearTotal(id, kind, year)); return t;
}
function coopCapacityByCrop(kind, year, month){
  return activeCrops().map(cr=>{ let t=0; activeMembers().forEach(id=> t += memberMonthCropTotal(id, kind, year, month, cr)); return t; });
}
function coopWeekByCrop(kind, year, month, week){
  return activeCrops().map(cr=>{ let t=0; activeMembers().forEach(id=>{
    const wk = harvestWeek(id, kind, year, month, week);
    t += (wk && wk[cr]) || 0;
  }); return t; });
}
function pct(actual, plan){ return plan>0 ? Math.round(actual/plan*100) : (actual>0 ? 100 : 0); }

function comparisonBar(label, plan, actual){
  const p = pct(actual, plan);
  const barColor = p>=95 ? 'var(--leaf)' : (p>=70 ? 'var(--gold)' : 'var(--red)');
  return `<div style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;">
      <span>${label}</span><span>${fmt(actual)} / ${fmt(plan)} kg · ${p}% of plan</span>
    </div>
    <div style="height:10px;background:#E4E2D4;border-radius:99px;overflow:hidden;">
      <div class="bar-fill" style="height:100%;width:${Math.min(p,100)}%;background:${barColor};border-radius:99px;
        animation:barGrow .95s var(--ease-out) both;"></div>
    </div>
  </div>`;
}

// What active farms have listed across their calendars, by product.
function coopInputNeeds(){
  const tally = {};
  activeMembers().forEach(id=> (MEMBERS[id].crops||[]).forEach(cr=>{ ensureProgramme(cr);
    CROP_STAGES.forEach(st=> stageItems(cr, st).forEach(x=>{
      const key = x.cat + '|' + (x.entry.product||'').trim().toLowerCase();
      if(!key.endsWith('|')) {
        if(!tally[key]) tally[key] = {product:x.entry.product, cat:x.cat, farms:{}, listed:0, applied:0, doses:{}};
        const t = tally[key];
        t.farms[id] = true; t.listed++;
        if(x.entry.done) t.applied++;
        const u = x.entry.unit || '';
        const d = Number(x.entry.dose)||0;
        if(d) t.doses[u] = (t.doses[u]||0) + d;
      }
    }));
  }));
  return Object.values(tally)
    .map(t=> Object.assign(t, {farmCount:Object.keys(t.farms).length,
      doseText:Object.keys(t.doses).map(u=>`${fmt(Math.round(t.doses[u]*100)/100)} ${u}`).join(' + ') || '—'}))
    .sort((a,b)=> b.farmCount-a.farmCount || b.listed-a.listed || a.product.localeCompare(b.product));
}

/* ============================================================
   Backup and restore
   This platform keeps everything in the browser it is used in, so a
   farm registered on one phone is not visible on another. Until it
   runs against a server, a backup file is how records move between
   devices: export here, open the file on the other device, restore.
   ============================================================ */
const BACKUP_VERSION = 1;

function buildBackup(){
  return {
    tipfa: 'association-platform-backup',
    version: BACKUP_VERSION,
    takenAt: new Date().toISOString(),
    takenBy: state.adminName || 'operator',
    counts: { farms:Object.keys(MEMBERS).length, operators:ADMINS.length },
    settings: SETTINGS,
    members: MEMBERS,
    harvest: harvest,
    inputs: inputsData,
    complaints: complaints,
    nextComplaintId: nextComplaintId,
    admins: ADMINS
  };
}

function exportBackup(){
  const data = buildBackup();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `TIPFA_backup_${todayStr()}.json`;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  logAction(`Operator ${state.adminName||''} exported a full backup (${data.counts.farms} farms, ${data.counts.operators} operators).`);
}

function restoreBackup(input){
  const file = input.files && input.files[0];
  const out = document.getElementById('restore-result');
  const show = (msg, bad)=>{ if(out){ out.className = 'import-result' + (bad?' bad':''); out.innerHTML = msg; } };
  if(!file) return;
  const mode = document.getElementById('restore-mode').value;
  const reader = new FileReader();
  reader.onerror = ()=> show('That file could not be read.', true);
  reader.onload = ()=>{
    let d;
    try { d = JSON.parse(String(reader.result)); }
    catch(e){ show('That file is not a TIPFA backup — it could not be read as JSON.', true); return; }
    if(!d || d.tipfa !== 'association-platform-backup' || !d.members){
      show('That file is not a TIPFA backup. Export one from the other device using the button above.', true);
      return;
    }

    let addedFarms = 0, keptFarms = 0, addedOps = 0;
    if(mode === 'replace'){
      MEMBERS = d.members || {};
      harvest = d.harvest || {};
      inputsData = d.inputs || {};
      complaints = Array.isArray(d.complaints) ? d.complaints : [];
      nextComplaintId = d.nextComplaintId || (complaints.length + 1);
      if(Array.isArray(d.admins) && d.admins.length) ADMINS = d.admins;
      if(d.settings) { SETTINGS = Object.assign({}, DEFAULT_SETTINGS, d.settings); saveSettings(); }
      addedFarms = Object.keys(MEMBERS).length;
    } else {
      // Merge: a farm already here wins, so nothing recorded on this device
      // is overwritten by an older file.
      Object.keys(d.members || {}).forEach(id=>{
        const incoming = d.members[id];
        const clash = findMemberByLogin(incoming.phone) || (incoming.email && findMemberByLogin(incoming.email));
        if(MEMBERS[id] || clash){ keptFarms++; return; }
        MEMBERS[id] = incoming;
        if(d.harvest && d.harvest[id]) harvest[id] = d.harvest[id];
        if(d.inputs && d.inputs[id]) inputsData[id] = d.inputs[id];
        if(!harvest[id] || !inputsData[id]) createBlankRecords(id);
        addedFarms++;
      });
      (d.complaints || []).forEach(x=>{
        if(!complaints.some(y=> y.member===x.member && y.text===x.text && y.type===x.type)){
          complaints.push(Object.assign({}, x, {id: nextComplaintId++}));
        }
      });
      (d.admins || []).forEach(a=>{
        if(!ADMINS.some(x=> norm(x.username) === norm(a.username))){ ADMINS.push(a); addedOps++; }
      });
    }

    // Bring everything restored up to the current record shape.
    Object.keys(MEMBERS).forEach(id=>{
      const m = MEMBERS[id];
      if(!Array.isArray(m.crops)) m.crops = [];
      m.crops.forEach(ensureProgramme);
      if(!harvest[id] || !inputsData[id]) createBlankRecords(id);
    });
    saveAdmins(); saveMembers();
    input.value = '';
    logAction(`Operator ${state.adminName||''} restored a backup taken ${d.takenAt ? d.takenAt.slice(0,10) : 'earlier'} (${mode === 'replace' ? 'replacing this device' : 'merging'}).`);
    state.restoreMsg = mode === 'replace'
      ? `${CHECK_ICON} Restored ${Object.keys(MEMBERS).length} farm${Object.keys(MEMBERS).length===1?'':'s'} and ${ADMINS.length} operator account${ADMINS.length===1?'':'s'} from the backup. This device now matches the file.`
      : `${CHECK_ICON} Merged: ${addedFarms} farm${addedFarms===1?'':'s'} added, ${keptFarms} already here and left untouched, ${addedOps} operator account${addedOps===1?'':'s'} added.`;
    render();
  };
  reader.readAsText(file);
}

  render();
}

      <p style="font-size:13.5px;line-height:1.6;margin:0 0 10px;">Every member has an individual, secure login; data is editable only by its owner or an authorised operator. Association-wide figures are visible only in aggregate, and every operator-entered record is logged with a name and timestamp below for auditability and compliance with the TIPFA constitution.</p>
    </div>
    <div class="section-label">Administrator accounts (${ADMINS.length}/${MAX_ADMINS})</div>
    <div class="card">
      <table class="grid-table"><thead><tr><th>Name</th><th>Operator ID / email</th><th></th></tr></thead>
      <tbody>${ADMINS.map((a,i)=>`<tr><td>${a.name}</td><td>${a.username}</td><td><button class="btn small ghost" style="color:var(--red);border-color:var(--red);" onclick="removeAdmin(${i})">Remove</button></td></tr>`).join('')}</tbody></table>
      ${ADMINS.length < MAX_ADMINS ? `
        <div class="section-label" style="margin-top:16px;">Add administrator</div>
        <div class="grid2">
          <div><label class="f">Full name</label><input id="newadmin-name"></div>
          <div><label class="f">Operator ID / email</label><input id="newadmin-user"></div>
        </div>
        <label class="f">Password</label>${pwdField('newadmin-pass','Set a password')}
        <button class="btn small" style="margin-top:6px;" onclick="addAdmin()">Add administrator</button>
        <p class="helper" id="newadmin-error" style="color:var(--red);margin-top:8px;"></p>
      ` : `<p class="helper" style="color:var(--soil);margin-top:10px;">Maximum of ${MAX_ADMINS} administrator accounts reached. Remove one above to free a seat.</p>`}
      <p class="helper" style="margin-top:12px;">Operators create their own account from the Administrator tab of the sign-in screen by quoting the operator sign-up code below. Self sign-ups appear in this list and are recorded in the audit log.</p>
    </div>
    ${codesPanel()}
    ${backupPanel()}
    <div class="section-label">Audit log</div>
    <div class="card">${auditLog.slice(0,12).map((l,i)=>
      `<div class="log-item" style="animation-delay:${Math.min(i,10)*40}ms"><span class="t">${l.time}</span><span>${esc(l.text)}</span></div>`
    ).join('')}</div>`;
}
function addAdmin(){
  if(ADMINS.length >= MAX_ADMINS) return;
  const name = document.getElementById('newadmin-name').value.trim();
  const user = document.getElementById('newadmin-user').value.trim();
  const pass = document.getElementById('newadmin-pass').value;
  if(!name || !user || !pass){
    document.getElementById('newadmin-error').textContent = 'Enter a name, operator ID, and password.';
    return;
  }
  if(ADMINS.some(a=>norm(a.username)===norm(user))){
    document.getElementById('newadmin-error').textContent = 'That operator ID is already in use.';
    return;
  }
  ADMINS.push({name, username:user, password:pass});
  saveAdmins();
  logAction(`Operator ${state.adminName||''} added a new administrator account: ${name}.`);
  render();
}
function removeAdmin(i){
  const removed = ADMINS[i];
  if(ADMINS.length <= 1){
    logAction(`Operator ${state.adminName||''} attempted to remove the last administrator account — blocked.`);
    render();
    return;
  }
  ADMINS.splice(i,1);
  saveAdmins();
  logAction(`Operator ${state.adminName||''} removed administrator account: ${removed.name}.`);
  render();
}

loadSettings();
loadMembers();
loadCatalogue();
render();
// Safe to touch `state` from here on.
cloudPushHook = function(){
  if(state.role === 'member' && state.member) cloudPushSoon(state.member);
};
initCloud();
</script>
</body>
</html>
