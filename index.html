<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TIPFA Association Platform</title>
<meta name="theme-color" content="#405E35">
<meta name="description" content="TIPFA Association Platform — member farm records, harvest planning and secretariat oversight for the Tanzania Indoor &amp; Professional Farmers Association.">
<link rel="icon" type="image/png" href="assets/brand/tipfa-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="firebase-config.js"></script>
<style>
/* ============================================================
   TIPFA Association Platform
   Visual identity per TIPFA Brand Guidelines v1.0 (2026)
   Palette p13 · Typography p15 · Arc system p17
   ============================================================ */
:root{
  /* Core palette — exact values, brand guidelines page 13 */
  --tipfa-green:#405E35;
  --harvest-orange:#E8A734;
  --field-cream:#EFEDE2;
  --leaf-green:#7E9B3F;
  --deep-green:#2C4423;
  --soil-ink:#23281F;

  /* Applied roles — page 14 */
  --ink:var(--soil-ink);
  --paper:var(--field-cream);
  --card:#FFFFFF;
  --line:#DFDCCB;
  --line-soft:#EAE7DA;
  --muted:#6E7466;
  --leaf:var(--tipfa-green);
  --leaf-dark:var(--deep-green);
  --gold:var(--harvest-orange);
  --red:#A8402F;
  --teal:#2F7A82;
  --soil:#A85C3F;

  --radius:14px;
  --radius-sm:10px;
  --radius-lg:22px;

  --shadow-sm:0 1px 2px rgba(35,40,31,.05), 0 2px 8px rgba(35,40,31,.04);
  --shadow-md:0 2px 6px rgba(35,40,31,.06), 0 12px 28px rgba(35,40,31,.08);
  --shadow-lg:0 8px 20px rgba(35,40,31,.10), 0 28px 60px rgba(35,40,31,.14);

  /* Role accents keep the palette — never invent a colour */
  --role-accent:var(--tipfa-green);
  --role-accent-dark:var(--deep-green);

  /* Motion system */
  --ease-out:cubic-bezier(.16,.84,.44,1);
  --ease-spring:cubic-bezier(.22,1.2,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-1:.18s; --dur-2:.32s; --dur-3:.52s; --dur-4:.8s;
}
body[data-role="member"]{ --role-accent:#7E9B3F; --role-accent-dark:#405E35; }
body[data-role="admin"]{ --role-accent:#405E35; --role-accent-dark:#2C4423; }

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-weight:400;
  color:var(--ink);
  background:var(--field-cream);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,.display,.brand,.btn,.metric .val,.tabbtn,.logintabs button,.eyebrow{
  font-family:'Poppins','Montserrat',system-ui,sans-serif;
}
a{color:var(--tipfa-green);}

/* ---------- Arc system (guidelines p17) -----------------------
   Arcs are anchored to an edge, always cropped by it, solid on
   cream, lighter green at 25–35% on green. Never a whole circle,
   never more than three, always behind content.              */
.arcfield{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.arc{position:absolute;border-radius:50%;will-change:transform;}
.arc--cream-1{width:min(58vw,540px);aspect-ratio:1;left:-16%;bottom:-38%;background:#E5E3D5;animation:arcDrift 22s var(--ease-in-out) infinite;}
.arc--cream-2{width:min(42vw,400px);aspect-ratio:1;left:8%;bottom:-30%;background:#DCDCCB;animation:arcDrift 27s var(--ease-in-out) infinite reverse;}
.arc--green-1{width:min(70vw,620px);aspect-ratio:1;right:-22%;bottom:-40%;background:rgba(126,155,63,.30);animation:arcDrift 24s var(--ease-in-out) infinite;}
.arc--green-2{width:min(48vw,430px);aspect-ratio:1;right:2%;bottom:-34%;background:rgba(126,155,63,.22);animation:arcDrift 30s var(--ease-in-out) infinite reverse;}
.arc--green-3{width:min(34vw,300px);aspect-ratio:1;left:-14%;top:-18%;background:rgba(239,237,226,.10);animation:arcDrift 34s var(--ease-in-out) infinite;}
@keyframes arcDrift{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  50%{transform:translate3d(2.5%,-3.5%,0) scale(1.055);}
}

.app{max-width:1240px;margin:0 auto;background:var(--field-cream);position:relative;}

/* ---------- Top bar ---------- */
.topbar{
  background:var(--tipfa-green); color:var(--field-cream);
  padding:14px 26px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:14px; position:relative; overflow:hidden;
}
.topbar > *{position:relative;z-index:1;}
.brandblock{display:flex;align-items:center;gap:14px;animation:riseIn var(--dur-3) var(--ease-out) both;}
.brandlogo{
  width:34px;height:auto;display:block;   /* symbol minimum on screen is 32px wide */
  transition:transform var(--dur-2) var(--ease-spring);
}
.brandtext{line-height:1.3;}
.bt-name{
  font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;letter-spacing:.01em;
}
.bt-name span{font-weight:400;opacity:.82;}
.brandblock:hover .brandlogo{transform:scale(1.03);}
.brandrule{width:1px;height:38px;background:rgba(239,237,226,.30);}
.brandblock .tagline{
  font-size:11.5px;letter-spacing:.02em;line-height:1.4;opacity:.8;margin-top:2px;font-style:italic;
}
.session{display:flex;align-items:center;gap:12px;color:var(--field-cream);font-size:12.5px;animation:riseIn var(--dur-3) var(--ease-out) .08s both;}
.session .who{font-weight:600;font-family:'Poppins',sans-serif;}
.session .role-tag{opacity:.82;}
.session button{
  border:1.5px solid rgba(239,237,226,.55);background:none;color:var(--field-cream);
  font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  transition:background var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.session button:hover{background:rgba(239,237,226,.14);border-color:var(--field-cream);transform:translateY(-1px);}
.session button:active{transform:translateY(0) scale(.97);}

/* ---------- Sign-in ---------- */
.loginwrap{
  display:grid;grid-template-columns:1.05fr .95fr;min-height:640px;position:relative;
}
.loginbrand{
  background:var(--deep-green);color:var(--field-cream);
  padding:52px 46px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  animation:panelIn var(--dur-4) var(--ease-out) both;
}
.loginbrand > *{position:relative;z-index:1;}
.loginbrand .lb-logo{
  width:min(300px,72%);height:auto;display:block;margin-bottom:34px;
  animation:logoIn 1s var(--ease-spring) .12s both;
}
.eyebrow{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;
  color:var(--harvest-orange);margin-bottom:14px;
}
.loginbrand h2{
  font-size:clamp(24px,2.6vw,33px);font-weight:700;line-height:1.16;letter-spacing:-.02em;margin:0 0 10px;
}
.loginbrand .strap{font-size:14px;line-height:1.6;opacity:.9;max-width:34ch;margin:0 0 30px;font-weight:300;}
.loginbrand .strap em{font-style:normal;font-weight:500;display:block;opacity:.72;font-size:13px;margin-top:3px;}
.values{display:grid;gap:14px;max-width:400px;}
.value{display:flex;gap:13px;align-items:flex-start;}
.value svg{flex:none;margin-top:1px;stroke:var(--harvest-orange);}
.value .vt{font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;}
.value .vd{font-size:12px;opacity:.78;line-height:1.5;font-weight:300;}
.lb-foot{margin-top:34px;font-size:11.5px;opacity:.62;line-height:1.6;font-weight:300;}

.loginpane{
  display:flex;align-items:center;justify-content:center;padding:48px 42px;position:relative;background:var(--field-cream);
}
.loginbox{width:100%;max-width:410px;position:relative;z-index:1;animation:riseIn var(--dur-4) var(--ease-out) .16s both;}
.lock-icon{
  display:flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;
  color:var(--deep-green);margin-bottom:16px;
}
.lock-icon svg{stroke:var(--tipfa-green);}
.logintabs{display:flex;background:#E3E1D3;border-radius:999px;padding:4px;margin-bottom:20px;position:relative;}
.logintabs button{
  flex:1;border:none;background:none;font-size:13px;font-weight:600;
  color:var(--muted);padding:10px 0;border-radius:999px;cursor:pointer;position:relative;z-index:1;
  transition:color var(--dur-2) var(--ease-out);
}
.logintabs button.active{color:#fff;}
.logintabs .tabglide{
  position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;background:var(--tipfa-green);
  transition:transform var(--dur-3) var(--ease-spring);z-index:0;box-shadow:var(--shadow-sm);
}
.login-note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6;}
.login-note a{font-weight:600;text-decoration:none;border-bottom:1px solid rgba(64,94,53,.35);transition:border-color var(--dur-1);}
.login-note a:hover{border-color:var(--tipfa-green);}
.demo-note{background:#E7E5D8;border-radius:var(--radius-sm);padding:11px 13px;font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:14px;}
.demo-note strong{color:var(--deep-green);}

/* ---------- Sub bar ---------- */
.subbar{
  display:flex;align-items:center;gap:12px;padding:12px 26px;background:#E7E5D8;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
  animation:fadeIn var(--dur-3) var(--ease-out) both;
}
.subbar label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-weight:600;font-family:'Poppins',sans-serif;}
.subbar select{padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:13px;background:#fff;}
.subbar .who-name{font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:var(--deep-green);}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:236px 1fr;gap:0;min-height:560px;position:relative;}
.sidebar{
  border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:3px;
  position:relative;background:linear-gradient(180deg,#EBE9DC 0%, var(--field-cream) 100%);
}
.tabbtn{
  text-align:left;border:none;background:none;padding:11px 14px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;position:relative;
  transition:color var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
  animation:slideInLeft var(--dur-3) var(--ease-out) both;
}
.tabbtn:hover{color:var(--deep-green);background:rgba(255,255,255,.6);transform:translateX(2px);}
.tabbtn.active{
  background:var(--card);color:var(--role-accent-dark);font-weight:600;box-shadow:var(--shadow-sm);
}
.tabbtn.active::before{
  content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
  background:var(--role-accent);animation:growBar var(--dur-3) var(--ease-spring) both;
}
.content{padding:26px 30px 52px;position:relative;overflow:hidden;}

/* ---------- Type scale (guidelines p16) ---------- */
h1.page-title{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 5px;color:var(--deep-green);}
p.page-sub{font-size:13px;color:var(--muted);margin:0 0 22px;font-weight:300;line-height:1.6;}
.section-label{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;margin:24px 0 10px;
  color:var(--tipfa-green);font-family:'Poppins',sans-serif;
}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-sm);
  transition:box-shadow var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out);
}
.card:hover{box-shadow:var(--shadow-md);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* ---------- Forms ---------- */
label.f{
  display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.14em;font-family:'Poppins',sans-serif;
}
input, select, textarea{
  width:100%;font-family:'Inter',sans-serif;font-size:13.5px;padding:10px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:#FCFCF8;color:var(--ink);margin-bottom:12px;
  transition:border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out);
}
input:hover, select:hover, textarea:hover{border-color:#C9C6B4;}
input:focus, select:focus, textarea:focus{
  outline:none;border-color:var(--tipfa-green);background:#fff;
  box-shadow:0 0 0 3px rgba(64,94,53,.13);
}
input[type="file"]{padding:8px;background:#F6F5EE;}

.unit-field{display:flex;gap:8px;align-items:stretch;}
.unit-field input{flex:1;min-width:0;}
.unit-field select{flex:none;width:96px;}

tr.crop-edit td{background:#F4F6EA !important;padding:16px 18px;}
tr.crop-edit .ce-head{
  font-family:'Poppins',sans-serif;font-size:12.5px;color:var(--deep-green);margin-bottom:12px;
}
tr.crop-edit .grid2{margin-bottom:4px;}

/* ---------- Buttons ---------- */
.btn{
  padding:11px 20px;border:none;border-radius:999px;background:var(--role-accent);color:#fff;
  font-weight:600;font-size:13.5px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(35,40,31,.10);
  transition:transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(64,94,53,.28);}
.btn:active{transform:translateY(0) scale(.98);}
.btn.ghost{background:transparent;border:1.5px solid var(--role-accent);color:var(--role-accent);box-shadow:none;}
.btn.ghost:hover{background:rgba(64,94,53,.07);box-shadow:0 4px 12px rgba(64,94,53,.14);}
.btn.small{padding:8px 14px;font-size:12.5px;}
/* Harvest Orange is the single call to action — rationed, p14 */
.btn.gold{background:var(--harvest-orange);color:var(--deep-green);}
.btn.gold:hover{box-shadow:0 6px 16px rgba(232,167,52,.40);}
.btn .ripple{
  position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.5);
  animation:ripple .62s var(--ease-out);pointer-events:none;
}
.btn.is-busy{pointer-events:none;}
.btn.is-busy::after{
  content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shimmer 1s linear infinite;
}
@keyframes ripple{to{transform:scale(3.2);opacity:0;}}
@keyframes shimmer{from{transform:translateX(-100%);}to{transform:translateX(100%);}}

/* ---------- Metrics ---------- */
.metric{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform var(--dur-3) var(--ease-spring), box-shadow var(--dur-3) var(--ease-out);
}
.metric::after{
  content:'';position:absolute;right:-30px;bottom:-46px;width:100px;height:100px;border-radius:50%;
  background:rgba(126,155,63,.10);transition:transform var(--dur-4) var(--ease-spring);
}
.metric:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.metric:hover::after{transform:scale(1.5);}
.metric .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-family:'Poppins',sans-serif;}
.metric .val{font-size:24px;font-weight:700;margin-top:4px;color:var(--deep-green);letter-spacing:-.02em;position:relative;}

/* ---------- Tables ---------- */
table.grid-table{width:100%;border-collapse:collapse;font-size:13px;}
table.grid-table th{
  background:var(--tipfa-green);color:var(--field-cream);text-align:left;padding:10px 12px;font-size:10px;
  text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-family:'Poppins',sans-serif;
}
table.grid-table th:first-child{border-radius:var(--radius-sm) 0 0 0;}
table.grid-table th:last-child{border-radius:0 var(--radius-sm) 0 0;}
table.grid-table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);}
table.grid-table tbody tr{transition:background var(--dur-1) var(--ease-out);}
table.grid-table tr:nth-child(even) td{background:#F8F7F0;}
table.grid-table tbody tr:hover td{background:#EFEFE2;}
table.grid-table input{margin:0;padding:7px 9px;font-size:12.5px;}

/* ---------- Status pills ---------- */
.status-pill{
  font-size:10px;font-weight:600;padding:4px 11px;border-radius:99px;display:inline-block;
  font-family:'Poppins',sans-serif;letter-spacing:.02em;
}
.status-open{background:#F6E3D3;color:var(--soil);}
.status-progress{background:#FBEECC;color:#8A6412;}
.status-resolved{background:#DFE7D2;color:var(--deep-green);}
.status-active{background:#DFE7D2;color:var(--deep-green);}
.status-pending{background:#FBEECC;color:#8A6412;animation:softPulse 2.6s var(--ease-in-out) infinite;}
.status-rejected{background:#F3DCD8;color:var(--red);}
@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,167,52,.42);}50%{box-shadow:0 0 0 6px rgba(232,167,52,0);}}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.chip{
  padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;
  cursor:pointer;color:var(--muted);font-weight:500;
  transition:transform var(--dur-1) var(--ease-spring), background var(--dur-2) var(--ease-out), color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2);
}
.chip:hover{transform:translateY(-2px);border-color:var(--leaf-green);color:var(--deep-green);box-shadow:var(--shadow-sm);}
.chip.active{background:var(--role-accent);border-color:var(--role-accent);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(64,94,53,.24);}

/* ---------- Banners & helpers ---------- */
.msg-banner{
  background:#DFE7D2;color:var(--deep-green);padding:12px 16px;border-radius:var(--radius-sm);font-size:12.5px;
  margin-bottom:14px;font-weight:500;display:flex;align-items:center;gap:10px;
  animation:bannerIn var(--dur-3) var(--ease-spring) both;border-left:3px solid var(--leaf-green);
}
.msg-banner svg{flex:none;stroke:var(--tipfa-green);}
.helper{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6;}
.err-shake{animation:shake .42s var(--ease-in-out);}
.log-item{
  font-size:12px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line-soft);
  display:flex;gap:12px;animation:riseIn var(--dur-3) var(--ease-out) both;
}
.log-item .t{font-variant-numeric:tabular-nums;color:var(--leaf-green);font-weight:500;flex:none;}

/* ---------- Farm logos ------------------------------------
   Member marks are placed from assets/farms/<farm-name>.png.
   If a file is missing the monogram shows instead, so the
   layout never breaks.                                     */
.farm-logo{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--line-soft);
  overflow:hidden;position:relative;
  transition:transform var(--dur-2) var(--ease-spring), box-shadow var(--dur-2) var(--ease-out);
}
.farm-logo img{width:100%;height:100%;object-fit:contain;padding:3px;display:block;}
.farm-logo .farm-initials{
  display:none;font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;color:var(--tipfa-green);
  letter-spacing:.02em;
}
.farm-logo.is-missing{background:#EDEBDE;}
.farm-logo.is-missing .farm-initials{display:block;}
.farm-logo.lg{width:64px;height:64px;border-radius:16px;}
.farm-logo.lg .farm-initials{font-size:20px;}
.farm-logo.xl{width:88px;height:88px;border-radius:20px;}
.farm-logo.xl .farm-initials{font-size:27px;}
.farm-logo.sm{width:28px;height:28px;border-radius:8px;}
.farm-logo.sm .farm-initials{font-size:10px;}
.farm-logo:hover{transform:scale(1.06) rotate(-1.5deg);box-shadow:var(--shadow-md);}
.farm-cell{display:flex;align-items:center;gap:10px;}
.farm-cell .fname{font-weight:500;}

.logo-picker{
  display:flex;gap:16px;align-items:flex-start;padding:14px;margin-bottom:16px;
  background:#F7F6EF;border:1px dashed var(--line);border-radius:var(--radius);
}
.logo-picker .lp-body{flex:1;min-width:0;}

           "TIPFA" beside it is running text in Poppins — never the wordmark. -->

<script>
/* Crops are not a fixed list. Each farm names the crops it actually grows in
   its own crop profile, and every harvest, price and report view follows from
   that. These helpers are the single source of truth for "which crops". */
function memberCrops(id){
  const m = MEMBERS[id];
  if(!m || !Array.isArray(m.crops)) return [];
  const seen = [];
  m.crops.forEach(cr=>{ const n=(cr.crop||'').trim(); if(n && seen.indexOf(n)===-1) seen.push(n); });
  return seen;
}
// Every crop grown anywhere on the register, for association-wide views.
function allCrops(){
  const seen = [];
  Object.keys(MEMBERS).forEach(id=> memberCrops(id).forEach(n=>{ if(seen.indexOf(n)===-1) seen.push(n); }));
  return seen.sort((a,b)=> a.localeCompare(b));
}
function activeCrops(){
  const seen = [];
  activeMembers().forEach(id=> memberCrops(id).forEach(n=>{ if(seen.indexOf(n)===-1) seen.push(n); }));
  return seen.sort((a,b)=> a.localeCompare(b));
}
let INPUTS = ['Seeds','Fertiliser','Greenhouse Supplies','Water'];
const PERIODS = ['weekly','monthly','annual'];
// The price trend is anchored to what the farm has actually been paid for a
// crop, rather than to a table of assumed prices.
const INVEST_CATEGORIES = ['Seeds','Labour','Infrastructure','Other'];
/* Crop stages run from transplanting through to harvest, matching the
   association's Fertilizer & Crop Protection Program template. */
const CROP_STAGES = ['Transplanting','Vegetative','Flowering','Harvesting'];

/* ============================================================
   Crop catalogue
   The Secretariat keeps one list of crops and their varieties for
   the whole association. A variety carries two things a farm cannot
   be expected to know: how many plants belong in a square metre, and
   what one plant yields week by week once it starts bearing. A farm
   picks its crop and variety and says how many seedlings it put in;
   everything in its harvest plan follows from that.

   The per-plant patterns come from the TIPFA harvest ledger:
     continuous  bears every 7 days from its first harvest onwards
     pulses      fruits in bursts a set number of weeks apart
     single      one head, once, and nothing after it
     mainside    one main head, then smaller weekly side shoots
   ============================================================ */
const YIELD_PATTERNS = {
  continuous: { label:'Every 7 days once bearing',
    fields:[['startWeek','Weeks from transplanting to first harvest',11],
            ['weeklyG','Each harvest, per plant (g)',300]] },
  pulses: { label:'In fruiting pulses',
    fields:[['startWeek','Weeks from transplanting to first harvest',13],
            ['pulseKg','Each pulse, per plant (kg)',1.5],
            ['intervalWeeks','Weeks between pulses',3]] },
  single: { label:'One head, once only',
    fields:[['startWeek','Weeks from transplanting to harvest',11],
            ['headKg','Head, per plant (kg)',1.15]] },
  mainside: { label:'Main head, then side shoots',
    fields:[['startWeek','Weeks from transplanting to the main head',11],
            ['mainKg','Main head, per plant (kg)',0.75],
            ['sideWeeks','Weeks of side shoots after it',4],
            ['sideG','Side shoots, per plant per week (g)',250]] }
};

// Kilograms per plant for each week of a season this many weeks long.
function weeklyYield(v, weeks){
  const out = new Array(Math.max(0, weeks)).fill(0);
  if(!v || !out.length) return out;
  const p = v.pattern || 'continuous';
  const at = (w, kg)=>{ if(w >= 1 && w <= out.length) out[w-1] += kg; };
  const start = Math.max(1, Number(v.startWeek) || 1);
  if(p === 'continuous'){
    const kg = (Number(v.weeklyG)||0) / 1000;
    for(let w = start; w <= out.length; w++) at(w, kg);
  } else if(p === 'pulses'){
    const step = Math.max(1, Number(v.intervalWeeks) || 1);
    for(let w = start; w <= out.length; w += step) at(w, Number(v.pulseKg)||0);
  } else if(p === 'single'){
    at(start, Number(v.headKg)||0);
  } else if(p === 'mainside'){
    at(start, Number(v.mainKg)||0);
    const n = Number(v.sideWeeks)||0, side = (Number(v.sideG)||0)/1000;
    for(let i = 1; i <= n; i++) at(start + i, side);
  }
  return out;
}

/* The catalogue the platform starts with. An operator edits it from the

let CATALOGUE = defaultCatalogue();

const MS_WEEK = 7 * 24 * 60 * 60 * 1000;

/* What a farm should expect off a crop, from what it has entered.
   Everything here is the catalogue's figures scaled by the farm's own
   seedling count; nothing is guessed. Where the farm has given both its
   dates the season is as long as those dates make it, and the harvest
   weeks carry real calendar dates. Without dates the catalogue's own
   24-week season is used, so a yield still shows the moment a crop and
   a seedling count are entered. */
function yieldFor(cr){
  const v = catalogueVariety(cr.crop, cr.variety);
  const n = Number(cr.seedlings) || 0;
  const empty = { ok:false, weeks:0, perPlant:0, total:0, rows:[], patternLabel:'',
                  firstDate:'', lastDate:'', peak:0, dated:false, seedlings:n };
  if(!v) return empty;
  let weeks = 24, start = null, dated = false;
  if(cr.planted && cr.expected){
    const a = new Date(cr.planted), b = new Date(cr.expected);
    if(!isNaN(a) && !isNaN(b) && b > a){
      weeks = Math.max(1, Math.round((b - a) / MS_WEEK));
      start = a; dated = true;
    }
  }
  const per = weeklyYield(v, weeks);
  const perPlant = per.reduce((x,y)=> x+y, 0);
  const rows = [];
  per.forEach((kg, i)=>{
    if(kg <= 0) return;
    rows.push({ week:i+1, kg: kg * n,
                date: start ? new Date(start.getTime() + i * MS_WEEK) : null });
  });
  const fmtDate = d=> d ? d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
  return {
    ok: !!(n && perPlant), weeks, perPlant, total: perPlant * n, rows, dated, seedlings:n,
    patternLabel: (YIELD_PATTERNS[v.pattern] || {}).label || '',
    firstDate: rows.length ? fmtDate(rows[0].date) : '',
    lastDate: rows.length ? fmtDate(rows[rows.length-1].date) : '',
    peak: rows.reduce((mx,r)=> Math.max(mx, r.kg), 0)
  };
}

/* The yield panel on the crop profile: what each crop is expected to give,
   worked out in front of the farm rather than presented as a number to
   trust. A crop that cannot be projected says what it is waiting for. */
function yieldPanel(m){
  const crops = m.crops || [];
  if(!crops.length) return '';
  const each = crops.map(cr=> ({ cr, y: yieldFor(cr) }));

  return `
    <div class="section-label">Expected yield</div>
    <div class="card" style="overflow-x:auto;">
      <p class="helper" style="margin:0 0 10px;">Worked out from the Secretariat's catalogue figures for the variety you chose, multiplied by the seedlings you planted. Change the seedling count and this changes with it.</p>
      <table class="grid-table"><thead><tr>
        <th>Crop</th><th>Variety</th><th>Seedlings</th><th>Per plant</th>
        <th>Harvest pattern</th><th>Bearing weeks</th><th>Best week</th><th>Expected total</th>
      </tr></thead>
      <tbody>${each.map(({cr, y})=> y.ok ? `<tr>
          <td><strong>${esc(cr.crop)}</strong></td>
          <td>${esc(cr.variety||'—')}</td>
          <td>${fmt(y.seedlings)}</td>
          <td>${y.perPlant.toFixed(2)} kg</td>
          <td class="helper">${esc(y.patternLabel)}</td>
          <td>${y.rows.length}${y.dated ? ` <span class="helper">${esc(y.firstDate)} → ${esc(y.lastDate)}</span>` : ' <span class="helper">of a 24-week season</span>'}</td>
          <td>${fmt(Math.round(y.peak))} kg</td>
          <td style="background:var(--field-cream);"><strong>${fmt(Math.round(y.total))} kg</strong></td>
        </tr>` : `<tr>
          <td><strong>${esc(cr.crop)}</strong></td>
          <td>${esc(cr.variety||'—')}</td>
          <td colspan="6" class="helper">${esc(yieldBlockedReason(cr))}</td>
        </tr>`).join('')}
        ${grand ? `<tr><td colspan="7" style="text-align:right;"><strong>All crops</strong></td>
          <td style="background:var(--gold);color:var(--deep-green);"><strong>${fmt(Math.round(grand))} kg</strong></td></tr>` : ''}
      </tbody></table>
      ${each.filter(x=>x.y.ok && x.y.rows.length).map(({cr, y})=> `
        <div class="section-label" style="margin-top:14px;">${esc(cr.crop)} — week by week</div>
        <table class="grid-table"><thead><tr><th>Harvest</th>${y.rows.map(r=>`<th>${y.dated ? esc(r.date.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})) : 'W'+r.week}</th>`).join('')}</tr></thead>
        <tbody><tr><td>kg</td>${y.rows.map(r=>`<td${r.kg===y.peak?' style="background:var(--field-cream);font-weight:600;"':''}>${fmt(Math.round(r.kg))}</td>`).join('')}</tr></tbody></table>`).join('')}
      <p class="helper" style="margin-top:10px;">These are the same figures your harvest plan is generated from. ${each.some(x=>x.y.ok && !x.y.dated) ? 'A crop with no dates yet is shown over the catalogue’s own 24-week season; add your transplanting and harvest dates to place it on the calendar.' : ''}</p>
    </div>`;
}

function yieldBlockedReason(cr){
  if(!catalogueCrop(cr.crop)) return 'This crop is no longer in the Secretariat catalogue, so there are no yield figures for it. Ask the Secretariat to add it back.';
  if(!catalogueVariety(cr.crop, cr.variety)) return 'This variety is not in the Secretariat catalogue. Edit the crop and choose one that is, or ask the Secretariat to add it.';
  if(!(Number(cr.seedlings)||0)) return 'Enter the number of seedlings you planted and the yield appears here.';
  return 'Nothing to project from yet.';
}

function catalogueCrop(name){
  const n = (name||'').trim().toLowerCase();
  return CATALOGUE.find(c=> (c.name||'').trim().toLowerCase() === n) || null;
}
function catalogueVariety(cropName, varietyName){
  const crop = catalogueCrop(cropName);
  if(!crop) return null;
  const v = (varietyName||'').trim().toLowerCase();
  return (crop.varieties||[]).find(x=> (x.name||'').trim().toLowerCase() === v) || null;
}


/* The four input categories a farm records against each crop stage.
   Fertilizers carry a composition and an application method; the three
   crop-protection categories carry the pest or disease they target. */
const INPUT_CATEGORIES = [
  {key:'Fertilizers',  label:'Fertilizers',  targets:false, unit:'kg', units:['kg','L','g','ml'],
   methods:['Basal','Broadcasting','Fertigation','Foliar','Top-dressing','Drench'],
   hint:'e.g. Triple Super Phosphate (TSP), Yara Winner, Potassium Nitrate'},
  {key:'Pesticides',   label:'Pesticides',   targets:true,  unit:'ml', units:['ml','g','L','kg'],
   methods:['Spray','Foliar spray','Drench','Soil application','Broadcasting'],
   hint:'e.g. Dudu Acemactin for Tuta absoluta, Mission for leaf miner'},
  {key:'Fungicides',   label:'Fungicides',   targets:true,  unit:'ml', units:['ml','g','L','kg'],
   methods:['Spray','Foliar spray','Drench','Seed treatment','Broadcasting'],
   hint:'e.g. Ridomil Gold for damping off, Tuncopper for bacterial spot'},
];
const CATEGORY_KEYS = INPUT_CATEGORIES.map(c=>c.key);
function categoryDef(key){ return INPUT_CATEGORIES.find(c=>c.key===key) || INPUT_CATEGORIES[0]; }

// Stage guidance carried over from the association's own programme template.
const STAGE_NOTES = {
  'Transplanting':'Basal fertilizers incorporated at or just after transplanting; protectant fungicide drench for damping-off.',
  'Vegetative':'Build canopy and root mass; rotate insecticide and fungicide actives to manage resistance.',
  'Flowering':'Support flowering and fruit set; increase K relative to N; maintain weekly pest scouting.',
  'Harvesting':'Sustain fruit fill and quality; observe the pre-harvest interval (PHI) on all sprays before picking.',
};

// An empty programme: every stage, every category.
function blankProgramme(){
  const p = {};
  CROP_STAGES.forEach(st=>{ p[st] = {}; CATEGORY_KEYS.forEach(k=> p[st][k] = []); });
  return p;
}
// Bring any crop record up to the current shape, whatever it was saved as.
function ensureProgramme(cr){
  if(!cr.programme) cr.programme = blankProgramme();
  // Insecticides are no longer a separate category — anything recorded under
  // it moves into Pesticides rather than disappearing.
  CROP_STAGES.forEach(st=>{
    const bucket = cr.programme[st];
    if(bucket && Array.isArray(bucket['Insecticides'])){
      if(!Array.isArray(bucket['Pesticides'])) bucket['Pesticides'] = [];
      bucket['Insecticides'].forEach(e=> bucket['Pesticides'].push(e));
      delete bucket['Insecticides'];
    }
  });
  // Comments are per stage. Older records kept a single note for the whole
  // crop, so carry that onto the stage it was written against.
  if(!cr.stageNotes){
    cr.stageNotes = {};
    if(cr.stageInputs) cr.stageNotes[cr.stage || CROP_STAGES[0]] = cr.stageInputs;
  }
  CROP_STAGES.forEach(st=>{
    if(!cr.programme[st]) cr.programme[st] = {};
    CATEGORY_KEYS.forEach(k=>{ if(!Array.isArray(cr.programme[st][k])) cr.programme[st][k] = []; });
  });
  if(!cr.stage || CROP_STAGES.indexOf(cr.stage) === -1) cr.stage = CROP_STAGES[0];
  return cr.programme;
}
const MARKET_STANDARD_OPTIONS = ['GlobalG.A.P.','Organic','Fair Trade','Other'];

// The membership register starts empty. Farms join by signing up on the
// sign-in screen, or are registered directly by a Secretariat operator,
// and every farm owns and edits its own profile from there.
let MEMBERS = {};

/* A device that has never been used starts with no operators at all. The first
   person to arrive creates their own account with the Secretariat sign-up code.
   Seeding named accounts here meant every fresh device silently held operators
   with passwords nobody had chosen, which is why a real password could be
   rejected on a second device while the reset flow still recognised the ID. */
const DEFAULT_ADMINS = [];
const MAX_ADMINS = 5;
// Shared code an operator must quote to create their own administrator account
// from the sign-in screen. Set to '' to allow administrator sign-up without a code.
/* Sign-up codes
   Both farms and operators need a code from the Secretariat to create an
   account. The codes are settings an operator can change from Governance,
   not constants compiled into the page, and they are never printed on the
   public sign-in screen — printing them would defeat the gate. */
const SETTINGS_STORE_KEY = 'tipfa.settings.v1';
const DEFAULT_SETTINGS = { adminCode:'TIPFA2026', farmCode:'TIPFAFARM2026' };
let SETTINGS = Object.assign({}, DEFAULT_SETTINGS);
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_STORE_KEY);
    if(raw){ SETTINGS = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw)); }
  }catch(e){ /* unreadable — keep the defaults */ }
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_STORE_KEY, JSON.stringify(SETTINGS)); }catch(e){ /* not persisted */ }
}
function adminCode(){ return SETTINGS.adminCode || ''; }
function farmCode(){ return SETTINGS.farmCode || ''; }
const ADMIN_STORE_KEY = 'tipfa.admins.v1';
const MEMBER_STORE_KEY = 'tipfa.members.v1';

/* ============================================================
   Cloud connection
   The platform works entirely offline against browser storage. When a
   Firebase project is configured and reachable, it additionally keeps a
   shared copy so records reach every device. Nothing here is allowed to
   break the offline path: if the SDK cannot load, the project is not
   configured, or the network is down, the app carries on exactly as it
   did before and reports itself as offline.
   ============================================================ */
const CLOUD = {
  status: 'connecting',     // connecting | ready | offline | unconfigured | error
  detail: '',
  app: null, db: null, auth: null,
  ready: false
};
const CLOUD_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

function cloudStatusText(){
  switch(CLOUD.status){
    case 'ready': return 'Connected — records are shared with every device';
    case 'connecting': return 'Connecting…';
    case 'unconfigured': return 'Not configured — records stay on this device';
    case 'offline': return 'Offline — records stay on this device until the connection returns';
    default: return 'Unavailable — records stay on this device';
  }
}
function setCloudStatus(status, detail){
  CLOUD.status = status;
  CLOUD.detail = detail || '';
  CLOUD.ready = status === 'ready';
  const el = document.getElementById('cloud-status');
  if(el) el.outerHTML = cloudBadge();
}
function cloudBadge(){
  const cls = CLOUD.status === 'ready' ? 'ok' : (CLOUD.status === 'connecting' ? 'wait' : 'off');
  return `<span id="cloud-status" class="cloud-badge ${cls}" title="${esc(CLOUD.detail || cloudStatusText())}">
    <span class="cloud-dot"></span>${CLOUD.status === 'ready' ? 'Cloud sync on' : (CLOUD.status === 'connecting' ? 'Connecting' : 'On this device only')}</span>`;
}

async function initCloud(){
  const cfg = window.TIPFA_FIREBASE_CONFIG;
  if(!cfg || !cfg.projectId){
    setCloudStatus('unconfigured', 'No Firebase project is configured for this site.');
    return;
  }
  try{
    const [{ initializeApp }, firestore, auth] = await Promise.all([
      import(CLOUD_SDK + 'firebase-app.js'),
      import(CLOUD_SDK + 'firebase-firestore.js'),
      import(CLOUD_SDK + 'firebase-auth.js')
    ]);
    CLOUD.app = initializeApp(cfg);
    CLOUD.db = firestore.getFirestore(CLOUD.app);
    CLOUD.auth = auth.getAuth(CLOUD.app);
    CLOUD.fs = firestore;
    CLOUD.authApi = auth;
    // Keep working through a dropped connection, and pick up again after it.
    try{ await firestore.enableIndexedDbPersistence(CLOUD.db); }catch(e){ /* several tabs open, or unsupported */ }
    setCloudStatus('ready', `Connected to ${cfg.projectId}.`);
    logAction(`Connected to the shared TIPFA database (${cfg.projectId}).`);
  }catch(e){
    // A blocked CDN, no network, or a project that is not reachable yet.
    setCloudStatus('offline', 'Could not reach the shared database: ' + (e && e.message ? e.message : 'unknown error'));
  }
}

/* ============================================================
   Cloud accounts and sync
   When the project is reachable, accounts are Firebase Authentication
   users and records live in Firestore, so a farm that registers on one
   phone is visible to the Secretariat everywhere. When it is not, every
   one of these falls back to the browser-only behaviour the platform
   has always had. No cloud failure is allowed to block a farm from
   working.
   ============================================================ */
// cloudIds holds the farms that actually exist in the shared database. A farm
// registered before the database was reachable lives only in this browser, and
// writing it would be refused by the rules — the create rule needs the farm's
// own sign-up code, which an operator does not have. Pushing only what is
// known to be there keeps one local record from reporting the whole app
// offline.
const CLOUD_STATE = { uid:null, role:null, email:null, pushTimer:null, pendingId:null, cloudIds:new Set() };

/* A button that appears to do nothing is the worst failure to diagnose,
   especially on a phone with no console. Anything thrown or rejected and not
   handled is shown on screen instead of vanishing. */
function showFatal(msg){
  let bar = document.getElementById('fatal-bar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'fatal-bar';
    bar.className = 'fatal-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `<strong>Something went wrong.</strong> ${esc(String(msg).slice(0,300))}
    <button onclick="this.parentNode.remove()">Dismiss</button>`;
}
window.addEventListener('error', e=> showFatal((e.error && e.error.message) || e.message || 'unknown error'));
window.addEventListener('unhandledrejection', e=>{
  const r = e.reason;
  showFatal((r && (r.code ? r.code + ' — ' : '') + (r.message || r)) || 'unknown error');
});

// Never let a network call hang with no feedback.
function withTimeout(promise, ms, what){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error(`${what} timed out after ${ms/1000} seconds — the connection may have dropped.`)), ms))
  ]);
}


function cloudOn(){ return CLOUD.ready && CLOUD.db && CLOUD.auth; }

// The parts of a farm record that belong in its own document. Harvest is kept
// out of it — a season of weekly entries grows, and a document is capped.
function farmDoc(m){
  return JSON.parse(JSON.stringify({
    name:m.name||'', contact:m.contact||'', phone:m.phone||'', email:m.email||'',
    location:m.location||'', category:m.category||'', status:m.status||'Pending',
    registered:m.registered||todayStr(),
    totalArea:m.totalArea||0, totalAreaUnit:m.totalAreaUnit||'ha',
    indoorSqm:m.indoorSqm||0, indoorSqmUnit:m.indoorSqmUnit||'m²',
    indoorUnits:m.indoorUnits||0, outdoorArea:m.outdoorArea||0, outdoorAreaUnit:m.outdoorAreaUnit||'ha',
    irrigation:m.irrigation||'', water:m.water||'', avatar:m.avatar||'',
    crops:m.crops||[], marketStandards:m.marketStandards||[], marketPrices:m.marketPrices||[],
    investments:m.investments||blankInvestments(), futurePlan:m.futurePlan||{year1:'',year2:'',year3:''},
    archives:m.archives||[],
    updatedAt: new Date().toISOString()
  }));
}

function isCloudFarm(id){ return CLOUD_STATE.cloudIds.has(id); }

async function cloudPushFarm(id){
  if(!cloudOn() || !MEMBERS[id] || !isCloudFarm(id)) return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'farms', id), farmDoc(MEMBERS[id]), {merge:true});
    if(harvest[id]) await setDoc(doc(CLOUD.db, 'harvest', id),
      JSON.parse(JSON.stringify({ plan:harvest[id].plan, actual:harvest[id].actual, updatedAt:new Date().toISOString() })), {merge:true});
  }catch(e){ setCloudStatus('offline', 'Could not save to the shared database: ' + (e.message||e)); }
}

/* An operator's decision has to reach the database, not only this browser.
   Without this an approval is local for as long as the session lasts: the next
   sign-in pulls the farm back from the database and it reads Pending again,
   so the same registrations keep asking to be approved. */
/* ---- The catalogue -------------------------------------------------
   One document the whole association shares. Operators write it, every
   signed-in farm reads it. Until the rules allowing that are published
   the read is refused, and the built-in list is used instead — so a
   farm always has a catalogue, just not necessarily the edited one. */
const CATALOGUE_KEY = 'tipfa.catalogue.v1';

function saveCatalogue(){
  try{ localStorage.setItem(CATALOGUE_KEY, JSON.stringify(CATALOGUE)); }catch(e){ /* storage full */ }
  cloudPushCatalogue();
}

function loadCatalogue(){
  try{
    const raw = localStorage.getItem(CATALOGUE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(Array.isArray(d) && d.length) CATALOGUE = d;
  }catch(e){ /* keep the built-in list */ }
}

async function cloudPushCatalogue(){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator') return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, 'settings', 'catalogue'),
      { crops: JSON.parse(JSON.stringify(CATALOGUE)), updatedAt: new Date().toISOString() });
  }catch(e){
    state.catMsg = '';
    setCloudStatus('offline', 'Could not save the catalogue to the shared database: ' + (e.message||e));
  }
}

async function cloudPullCatalogue(){
  if(!cloudOn()) return false;
  try{
    const { doc, getDoc } = CLOUD.fs;
    const d = await getDoc(doc(CLOUD.db, 'settings', 'catalogue'));
    if(d.exists() && Array.isArray(d.data().crops) && d.data().crops.length){
      CATALOGUE = d.data().crops;
      try{ localStorage.setItem(CATALOGUE_KEY, JSON.stringify(CATALOGUE)); }catch(_){ }
      return true;
    }
  }catch(e){ /* the rules for it are not published yet; the built-in list stands */ }
  return false;
}

function operatorSync(id){
  if(cloudOn() && CLOUD_STATE.role === 'operator') cloudPushFarm(id);
}

async function cloudDeleteFarm(id){
  if(!cloudOn() || CLOUD_STATE.role !== 'operator' || !isCloudFarm(id)) return;
  const { doc, deleteDoc } = CLOUD.fs;
  try{
    await deleteDoc(doc(CLOUD.db, 'farms', id));
    await deleteDoc(doc(CLOUD.db, 'harvest', id));
    CLOUD_STATE.cloudIds.delete(id);
  }catch(e){ setCloudStatus('offline', 'Could not remove the farm from the shared database: ' + (e.message||e)); }
}

// Writes are batched: a farm typing into a table should not send a write per keystroke.
function cloudPushSoon(id){
  if(!cloudOn()) return;
  clearTimeout(CLOUD_STATE.pushTimer);
  CLOUD_STATE.pendingId = id || CLOUD_STATE.uid;
  CLOUD_STATE.pushTimer = setTimeout(()=>{
    const pending = CLOUD_STATE.pendingId;
    CLOUD_STATE.pendingId = null;
    cloudPushFarm(pending);
  }, 1200);
}

async function cloudPullAll(){
  if(!cloudOn()) return 0;
  const { collection, getDocs, doc, getDoc } = CLOUD.fs;
  let count = 0;
  try{
    if(CLOUD_STATE.role === 'operator'){
      const farms = await getDocs(collection(CLOUD.db, 'farms'));
      farms.forEach(d=>{ MEMBERS[d.id] = Object.assign(MEMBERS[d.id]||{}, d.data()); CLOUD_STATE.cloudIds.add(d.id); count++; });
      const hv = await getDocs(collection(CLOUD.db, 'harvest'));
      hv.forEach(d=>{ harvest[d.id] = { plan:d.data().plan||blankHarvestStore(), actual:d.data().actual||blankHarvestStore() }; });
    } else if(CLOUD_STATE.uid){
      const f = await getDoc(doc(CLOUD.db, 'farms', CLOUD_STATE.uid));
      if(f.exists()){ MEMBERS[CLOUD_STATE.uid] = Object.assign(MEMBERS[CLOUD_STATE.uid]||{}, f.data()); CLOUD_STATE.cloudIds.add(CLOUD_STATE.uid); count++; }
      const h = await getDoc(doc(CLOUD.db, 'harvest', CLOUD_STATE.uid));
      if(h.exists()) harvest[CLOUD_STATE.uid] = { plan:h.data().plan||blankHarvestStore(), actual:h.data().actual||blankHarvestStore() };
    }
    // Bring anything pulled up to the current record shape.
    Object.keys(MEMBERS).forEach(id=>{
      const m = MEMBERS[id];
      if(!Array.isArray(m.crops)) m.crops = [];
      m.crops.forEach(ensureProgramme);
      if(!harvest[id] || !inputsData[id]) createBlankRecords(id);
    });
    saveMembers();
  }catch(e){ setCloudStatus('offline', 'Could not read the shared database: ' + (e.message||e)); }
  return count;
}

/* ---- Account creation and sign-in ---------------------------------- */

/* Creating an account is two steps: the Authentication user, then the record
   the rules check. If the second is refused, the first is undone — otherwise
   the address is taken by a user with no record behind it, and every retry
   reports that the email is already in use. */
async function withRollback(cred, work){
  try{ return await work(); }
  catch(e){
    try{ await cred.user.delete(); }catch(_){ /* leave it; sign-in will explain */ }
    throw e;
  }
}

async function cloudRegisterFarm(vals, password, code){
  const { createUserWithEmailAndPassword } = CLOUD.authApi;
  const { doc, setDoc, updateDoc, deleteField } = CLOUD.fs;
  const cred = await createUserWithEmailAndPassword(CLOUD.auth, vals.email, password);
  const uid = cred.user.uid;
  return await withRollback(cred, async ()=>{
    const record = Object.assign(farmDoc(vals), {
      status:'Pending', category:'Pending review', registered:todayStr(),
      crops:[], signupCode:code                   // checked by the rules on create
    });
    await setDoc(doc(CLOUD.db, 'farms', uid), record);
    await updateDoc(doc(CLOUD.db, 'farms', uid), { signupCode: deleteField() });  // not kept
    await setDoc(doc(CLOUD.db, 'harvest', uid), { plan:blankHarvestStore(), actual:blankHarvestStore() });
    CLOUD_STATE.cloudIds.add(uid);
    return uid;
  });
}

async function cloudRegisterOperator(name, email, password, code){
  const { createUserWithEmailAndPassword } = CLOUD.authApi;
  const { doc, setDoc, updateDoc, deleteField } = CLOUD.fs;
  const cred = await createUserWithEmailAndPassword(CLOUD.auth, email, password);
  const uid = cred.user.uid;
  return await withRollback(cred, async ()=>{
    await setDoc(doc(CLOUD.db, 'operators', uid), { name, email, signupCode:code, since:todayStr() });
    await updateDoc(doc(CLOUD.db, 'operators', uid), { signupCode: deleteField() });
    return uid;
  });
}

async function cloudSignIn(email, password){
  const { signInWithEmailAndPassword } = CLOUD.authApi;
  const { doc, getDoc } = CLOUD.fs;
  const cred = await signInWithEmailAndPassword(CLOUD.auth, email, password);
  const uid = cred.user.uid;
  // The farm record first, and only then the operator one. Anyone signed in may
  // read their own farm document, but the operator collection is readable by
  // operators alone — so asking that question first refuses every farm at its
  // own sign-in, before the farm record is ever looked at.
  const farm = await getDoc(doc(CLOUD.db, 'farms', uid));
  let role = farm.exists() ? 'farm' : null;
  let op = null;
  if(!role){
    op = await getDoc(doc(CLOUD.db, 'operators', uid));
    role = op.exists() ? 'operator' : 'orphan';   // signed in, but nothing behind it
  }
  CLOUD_STATE.uid = uid;
  CLOUD_STATE.email = email;
  CLOUD_STATE.role = role;
  return { uid, role, name: (op && op.exists()) ? (op.data().name||email) : null };
}

async function cloudSignOut(){
  if(!cloudOn()) return;
  // A batched write still waiting when the session ends would be sent with
  // nobody signed in. The rules refuse that, so the last edits of the session
  // are lost and the app reports itself offline on the way out. Send it first.
  clearTimeout(CLOUD_STATE.pushTimer);
  const pending = CLOUD_STATE.pendingId;
  CLOUD_STATE.pendingId = null;
  if(pending) await cloudPushFarm(pending);
  try{ await CLOUD.authApi.signOut(CLOUD.auth); }catch(e){ /* already out */ }
  CLOUD_STATE.uid = null; CLOUD_STATE.role = null; CLOUD_STATE.email = null;
}

async function cloudResetEmail(email){
  if(!cloudOn()) throw new Error('offline');
  await CLOUD.authApi.sendPasswordResetEmail(CLOUD.auth, email);
}

/* A refused write has three possible causes that Firestore reports
   identically. Two documents in the rules exist only to be read here, so the
   platform can name the real one instead of listing all three at the farmer.
      diagnostics/rules-published  readable always -> the rules are published
      diagnostics/codes-present    readable only when settings/signup exists
   Neither document is ever created, and a read of a document that is not
   there returns nothing, so this cannot expose a code. */
async function cloudDiagnoseDenied(){
  if(!cloudOn()) return null;
  const { doc, getDoc } = CLOUD.fs;
  const readable = async id => {
    try{ await getDoc(doc(CLOUD.db, 'diagnostics', id)); return true; }
    catch(_){ return false; }
  };
  if(!await readable('rules-published'))
    return 'The database is still running Firebase\u2019s own default rules. Open Firestore Database \u2192 Rules in the console, replace everything with the contents of firestore.rules from the site\u2019s code, and press Publish.';
  if(!await readable('codes-present'))
    return 'The rules are published, but the document holding the sign-up codes is missing. In Firestore Database, add a collection named settings with a document named signup, and give it two text fields: operatorCode and farmCode.';
  return 'The sign-up code does not match the one in the database. Check settings \u2192 signup in Firestore: the fields must be named exactly operatorCode and farmCode, and the value must match what you typed, including capital letters.';
}

/* Show the plain wording at once, then replace it with the diagnosed cause
   as soon as the probes come back, so the form is never silent while it asks. */
function reportCloudFailure(el, e){
  if(!el) return;
  const code = (e && e.code) || '';
  flagError(el, cloudErrorText(e) + (code ? ` [${code}]` : ''));
  if(!code.includes('permission-denied')) return;
  cloudDiagnoseDenied()
    .then(text=>{ if(text) flagError(el, text); })
    .catch(()=>{ /* keep the plain wording */ });
}

// Firebase's own wording is not written for farmers; say what went wrong.
function cloudErrorText(e){
  const code = (e && e.code) || '';
  if(code.includes('email-already-in-use')) return 'An account already uses that email address. Try signing in, or use Forgotten your password.';
  if(code.includes('invalid-email')) return 'That email address does not look right.';
  if(code.includes('weak-password')) return 'Choose a longer password — at least six characters.';
  if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'That email and password do not match an account.';
  if(code.includes('user-not-found')) return 'No account uses that email address.';
  if(code.includes('too-many-requests')) return 'Too many attempts. Wait a few minutes and try again.';
  if(code.includes('network')) return 'No connection to the database. Check the network and try again.';
  if(code.includes('permission-denied') || /insufficient permissions/i.test(String(e && e.message))){
    // The sign-up forms replace this with the identified cause; everywhere else
    // the honest answer is to run the check, which names what is wrong.
    return 'The database refused that request. Run the connection check on the sign-in screen — it names exactly what is wrong.';
  }
  return (e && e.message) ? e.message : 'Something went wrong. Try again.';
}

/* ============================================================
   Storage
   Farms, their records and their submissions are kept in this
   browser so an account survives a reload. This is per-browser,
   not a server: a farm registered on one device is not visible
   on another.
   ============================================================ */
// Nothing is written until the stored register has been read back, so the
// startup log entry cannot overwrite a saved one with an empty register.
let storeReady = false;
function saveMembers(){
  if(!storeReady) return;
  try{
    localStorage.setItem(MEMBER_STORE_KEY, JSON.stringify({
      members: MEMBERS, harvest: harvest, inputs: inputsData,
      complaints: complaints, nextComplaintId: nextComplaintId
    }));
  }catch(e){ /* storage full or unavailable — the session still works */ }
}
function loadMembers(){
  try{
    const raw = localStorage.getItem(MEMBER_STORE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.members || typeof d.members !== 'object') return;
    /* falls through to restore the stored register */
    MEMBERS = d.members;
    harvest = d.harvest || {};
    inputsData = d.inputs || {};
    complaints = Array.isArray(d.complaints) ? d.complaints : [];
    nextComplaintId = d.nextComplaintId || (complaints.length + 1);
    // Backfill anything a stored record predates, so an older save still opens.
    Object.keys(MEMBERS).forEach(id=>{
      const m = MEMBERS[id];
      if(!Array.isArray(m.crops)) m.crops = [];
      m.crops.forEach(cr=>{
        if(cr.stage === 'Sowing') cr.stage = 'Transplanting';   // stage list no longer starts at sowing
        ensureProgramme(cr);
      });
      if(!Array.isArray(m.marketStandards)) m.marketStandards = [];
      if(!Array.isArray(m.marketPrices)) m.marketPrices = [];
      // Prices used to carry only a date; derive the year, month and week.
      m.marketPrices.forEach(p=>{
        if(p.year && p.month) return;
        const d = p.date ? new Date(p.date + 'T00:00:00') : null;
        if(d && !isNaN(d.getTime())){
          p.year = d.getFullYear(); p.month = d.getMonth()+1; p.week = weekOfMonth(d);
        } else {
          p.year = CURRENT_YEAR; p.month = CURRENT_MONTH; p.week = 1;
        }
      });
      if(!m.investments) m.investments = blankInvestments();
      if(!m.futurePlan) m.futurePlan = { year1:'', year2:'', year3:'' };
      if(!harvest[id]) harvest[id] = { plan: blankHarvestStore(), actual: blankHarvestStore() };
      // Figures saved before harvests were held per year sit directly under
      // month numbers; move them under the year they were recorded in.
      ['plan','actual'].forEach(kind=>{
        const store = harvest[id][kind];
        const keys = Object.keys(store||{});
        if(keys.length && keys.every(k=> Number(k) >= 1 && Number(k) <= 12)){
          harvest[id][kind] = { [CURRENT_YEAR]: store };
        }
      });
      if(!inputsData[id]) inputsData[id] = { weekly:blankPeriod(INPUTS,0), monthly:blankPeriod(INPUTS,0), annual:blankPeriod(INPUTS,0) };
    });
  }catch(e){ /* unreadable store — start empty rather than fail to load */ }
  finally{ storeReady = true; }
}

/* ============================================================
   Farm logo placement
   Each member farm's mark is loaded from assets/farms/, named
   after the farm itself — "She Farms" -> assets/farms/she-farms.png.
   Drop a farm's file in with that name and it appears everywhere
   the farm is shown. Until then the monogram stands in, so a
   missing file never breaks a layout.
   ============================================================ */
const FARM_LOGO_DIR = 'assets/farms/';
const FARM_LOGO_EXT = '.png';
function farmLogoSlug(name){
  return (name||'').toLowerCase().trim()
    .replace(/&/g,'and')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
}
function farmLogoSrc(m){
  if(!m) return '';
  if(m.avatar) return m.avatar;                   // the farm's own uploaded image
  if(m.logo) return m.logo;                       // explicit file override
  return FARM_LOGO_DIR + farmLogoSlug(m.name) + FARM_LOGO_EXT;
}

/* A farm's profile image is its logo: it is shown wherever the farm appears.
   The picture is squared off and scaled down before it is stored, so a photo
   straight off a phone does not fill up the browser's storage. */
const AVATAR_PX = 320;
function readImageAsLogo(file, done, fail){
  if(!file){ fail && fail('Choose an image file.'); return; }
  if(!/^image\//.test(file.type)){ fail && fail('That file is not an image.'); return; }
  const reader = new FileReader();
  reader.onerror = ()=> fail && fail('That image could not be read.');
  reader.onload = ()=>{
    const img = new Image();
    img.onerror = ()=> fail && fail('That image could not be opened.');
    img.onload = ()=>{
      const side = Math.min(img.width, img.height);
      const cv = document.createElement('canvas');
      cv.width = cv.height = AVATAR_PX;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
      // PNG keeps a transparent logo transparent; a photo is fine either way.
      done(cv.toDataURL('image/png'));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function farmInitials(name){
  const words = (name||'').split(/\s+/).filter(Boolean);
  if(!words.length) return '—';
  if(words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[words.length-1][0]).toUpperCase();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// size: '' | 'sm' | 'lg' | 'xl'

  return `<span class="${cls}" title="${esc(m.name)}">
    <img src="${esc(farmLogoSrc(m))}" alt="${esc(m.name)} logo" loading="lazy"
         onerror="this.closest('.farm-logo').classList.add('is-missing'); this.remove();">
    <span class="farm-initials">${esc(farmInitials(m.name))}</span>

}

/* ============================================================
   Motion
   Entrance, transition and feedback motion for the whole app.
   The logo lockup is only ever moved or scaled as one object —
   its parts are never animated out of position (guidelines p11).
   Everything here yields to prefers-reduced-motion via the CSS.
   ============================================================ */
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Stagger direct children of a freshly rendered container.
function staggerIn(container, selector){
  if(!container) return;
  const nodes = container.querySelectorAll(selector || ':scope > .card, :scope > .grid2, :scope > .grid3, :scope > .grid4, :scope > .section-label, :scope > .chips, :scope > .msg-banner');
  nodes.forEach((n,i)=>{
    n.classList.add('reveal');
    if(i < 8) n.classList.add('reveal-'+(i+1));
  });
}

// Reveal cards as they scroll into view.
let scrollObserver = null;
function observeScrollReveals(container){
  if(REDUCED_MOTION || !('IntersectionObserver' in window)) return;
  if(!scrollObserver){
    scrollObserver = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('seen'); scrollObserver.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -40px 0px', threshold:.05});
  }
  const cards = container.querySelectorAll('.card');
  cards.forEach((c,i)=>{
    if(i < 4) return;                    // the first screenful uses the entrance stagger
    c.classList.add('onscroll');
    scrollObserver.observe(c);
  });
}

// Count metric values up from zero.
function animateCounters(container){
  container.querySelectorAll('[data-count]').forEach(el=>{
    const target = Number(el.getAttribute('data-count'))||0;
    const suffix = el.getAttribute('data-suffix')||'';
    if(REDUCED_MOTION || !target){ el.textContent = fmt(target)+suffix; return; }
    const dur = 900, start = performance.now();
    function tick(now){
      const p = Math.min(1,(now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = fmt(Math.round(target*eased))+suffix;
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

// Ripple feedback on every button press.
document.addEventListener('click', function(e){
  const btn = e.target.closest('.btn');
  if(!btn || REDUCED_MOTION) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = d+'px';
  span.style.left = (e.clientX - r.left - d/2)+'px';
  span.style.top = (e.clientY - r.top - d/2)+'px';
  btn.appendChild(span);
  setTimeout(()=>span.remove(), 640);
});

// Shake a field-level error into view.
function flagError(el, message){
  if(!el) return;
  el.textContent = message;
  const box = el.closest('.card') || el;
  box.classList.remove('err-shake');
  void box.offsetWidth;                  // restart the animation
  box.classList.add('err-shake');
  setTimeout(()=>box.classList.remove('err-shake'), 500);
}

// Arc curtain used when crossing between signed-out and signed-in.
function curtainTransition(midpoint){
  if(REDUCED_MOTION){ midpoint(); return; }
  const c = document.createElement('div');
  c.className = 'curtain in';
  document.body.appendChild(c);
  setTimeout(()=>{
    midpoint();
    c.className = 'curtain out';
    setTimeout(()=>c.remove(), 460);
  }, 420);
}

/* Harvest figures are held per year, then month, week and crop. These two

function harvestYear(id, kind, year){

  btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function slugify(s){
  const base = s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'member';
  let id = base, i = 1;
  while(MEMBERS[id]){ id = base+'_'+i; i++; }
  return id;
}
function createBlankRecords(id){
  harvest[id] = { plan: blankHarvestStore(), actual: blankHarvestStore() };
  inputsData[id] = { weekly:blankPeriod(INPUTS,0), monthly:blankPeriod(INPUTS,0), annual:blankPeriod(INPUTS,0) };

}

/* Areas are a number plus a unit, so a farm can record 1.2 acres rather than
   being forced into hectares. The unit travels with the value everywhere. */
const LAND_UNITS = ['ha','acres','m²'];
const SQM_PER = { 'ha':10000, 'acres':4046.86, 'm²':1, 'sq ft':0.092903 };
function toSqm(value, unit){ return (Number(value)||0) * (SQM_PER[unit] || SQM_PER['ha']); }
const INDOOR_UNITS = ['m\u00b2','sq ft'];
function areaText(value, unit, fallbackUnit){
  const n = Number(value);
  if(!n) return '\u2014';
  return `${n} ${unit || fallbackUnit || 'ha'}`;
}
// A number input with its unit select attached.
function unitField(id, value, unit, units, step, onchange){
  const hook = onchange ? ` oninput="${onchange}" onchange="${onchange}"` : '';
  return `<div class="unit-field">
    <input id="${id}" type="number" step="${step||'0.01'}" value="${value||''}" placeholder="0"${hook}>
    <select id="${id}-unit" aria-label="Unit"${hook}>
      ${units.map(u=>`<option ${unit===u?'selected':''}>${u}</option>`).join('')}
    </select>
  </div>`;
}
function readUnit(id, units){
  const el = document.getElementById(id+'-unit');
  return el ? el.value : units[0];
}

function readProfileFields(prefix){

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function showLoginTab(tab){ state.loginTab = tab; state.diagnostics = false; state.forgot = null; state.forgotMsg = ''; renderLogin(); }

async function doMemberLogin(btn){
  const raw = document.getElementById('login-id').value.trim();
  const identifier = norm(raw);
  const password = document.getElementById('login-password').value.trim();
  if(!identifier || !password){ flagError(document.getElementById('login-error'), 'Enter your phone number/email and password.'); return; }

  // With the database reachable, the account lives there and works on any device.
  if(cloudOn() && looksLikeEmail(raw)){
    if(btn) btn.classList.add('is-busy');
    try{
      const who = await cloudSignIn(raw, password);
      await cloudPullAll();
      await cloudPullCatalogue();
      if(btn) btn.classList.remove('is-busy');
      if(who.role === 'operator'){
        flagError(document.getElementById('login-error'), 'That is an operator account — sign in on the Administrator tab.');
        await cloudSignOut();
        return;
      }
      if(who.role === 'orphan'){
        await cloudSignOut();
        flagError(document.getElementById('login-error'),
          'That email and password are correct, but no farm record is attached to them — the registration did not finish. Register again, or ask the Secretariat to check.');
        return;
      }
      curtainTransition(()=>{
        state.loggedIn = true; state.role = 'member'; state.member = who.uid; state.tab = 'profile'; state.forgotMsg = '';
        document.body.setAttribute('data-role','member');
        logAction(`${(MEMBERS[who.uid]||{}).name || raw} signed in.`);
        render();
      });
      return;
    }catch(e){
      if(btn) btn.classList.remove('is-busy');
      // An account made before the database existed still signs in locally.
      const localHit = Object.entries(MEMBERS).find(([id,m]) =>
        m.status!=='Rejected' && m.password===password && (norm(m.phone)===identifier || norm(m.email)===identifier));
      if(!localHit){ flagError(document.getElementById('login-error'), cloudErrorText(e)); return; }
    }
  }
  const match = Object.entries(MEMBERS).find(([id,m]) =>
    m.status!=='Rejected' && m.password===password && (norm(m.phone)===identifier || norm(m.email)===identifier));
  if(!match){
    const known = Object.entries(MEMBERS).find(([id,m]) => norm(m.phone)===identifier || norm(m.email)===identifier);
    flagError(document.getElementById('login-error'),
      known ? (known[1].status==='Rejected'
                ? 'That registration was not approved. Contact the Secretariat on 0744 443 247.'
                : 'That password does not match this account.')
            : 'No account matches that phone number or email. Register your farm below.');
    return;
  }
  const [id] = match;
  signInTransition(btn, ()=>{
    state.loggedIn = true; state.role = 'member'; state.member = id; state.tab = 'profile'; state.forgotMsg = '';
    document.body.setAttribute('data-role','member');
    logAction(`${MEMBERS[id].name} signed in.`);
    render();
  });
}

// Brief working state on the button, then an arc curtain across the change of context.
function signInTransition(btn, done){
  if(btn) btn.classList.add('is-busy');
  setTimeout(()=>{
    if(btn) btn.classList.remove('is-busy');
    curtainTransition(done);
  }, REDUCED_MOTION ? 0 : 260);
}
async function doAdminLogin(btn){
  const identifier = norm(document.getElementById('login-user').value);

  if(!identifier || !password){ flagError(document.getElementById('login-error-admin'), 'Enter your operator ID and password.'); return; }

    if(btn) btn.classList.add('is-busy');

      if(who.role !== 'operator'){
        await cloudSignOut();
        if(btn) btn.classList.remove('is-busy');
        flagError(document.getElementById('login-error-admin'), who.role === 'orphan'
          ? 'That email and password are correct, but this account has no operator record — the sign-up did not finish. Create the account again with the operator code.'
          : 'That is a farm account — sign in on the Farm member tab.');
        return;
      }
      await cloudPullAll();
      await cloudPullCatalogue();
      if(btn) btn.classList.remove('is-busy');
      curtainTransition(()=>{
        state.loggedIn = true; state.role = 'admin'; state.tab = 'members'; state.adminName = who.name || raw;
        state.adminSignupMsg = ''; state.adminSignupUser = ''; state.forgotMsg = '';
        document.body.setAttribute('data-role','admin');
        logAction(`Operator ${state.adminName} signed in to the administrator console.`);

      });

    }catch(e){
      if(btn) btn.classList.remove('is-busy');

      if(!localOk){ flagError(document.getElementById('login-error-admin'), cloudErrorText(e)); return; }
    }
  }
  const match = ADMINS.find(a => {
    const u = norm(a.username), local = u.split('@')[0];
    return (identifier===u || identifier===local) && a.password===password;
  });
  if(!match){
    flagError(document.getElementById('login-error-admin'),
      ADMINS.length ? 'Invalid operator ID or password.'
                    : 'No administrator account exists in this browser yet. Create one below, or restore a backup from the device that has your records.');

    state.adminSignupMsg = ''; state.adminSignupUser = ''; state.forgotMsg = '';

function submitAdminSignup(){
  const err = document.getElementById('asignup-error');
  const name = document.getElementById('asignup-name').value.trim();
  const user = document.getElementById('asignup-user').value.trim();
  const pass = document.getElementById('asignup-pass').value;
  const pass2 = document.getElementById('asignup-pass2').value;
  const codeEl = document.getElementById('asignup-code');
  if(!name || !user || !pass){
    flagError(err, 'Enter your full name, the operator ID you want, and a password.'); return;
  }
  // Offline, the code is checked against this device's stored setting. Online,
  // the security rules check it against the database — checking here as well
  // would reject a valid code whenever the two are not identical.
  if(!cloudOn() && adminCode() && (!codeEl || codeEl.value.trim() !== adminCode())){
    flagError(err, 'That Secretariat sign-up code is not correct.'); return;
  }
  if(pass.length < 6){
    flagError(err, 'Choose a password of at least 6 characters.'); return;
  }
  if(pass !== pass2){
    flagError(err, 'Passwords do not match.'); return;
  }
  const u = norm(user), local = u.split('@')[0];
  if(ADMINS.some(a=>{ const au = norm(a.username); return au===u || au.split('@')[0]===local; })){
    flagError(err, 'That operator ID is already in use.'); return;
  }
  if(ADMINS.length >= MAX_ADMINS){
    flagError(err, `All ${MAX_ADMINS} administrator seats are taken — an existing operator must remove one first.`); return;
  }
  if(cloudOn() && looksLikeEmail(user)){
    const btn = document.querySelector('button.gold[onclick*="submitAdminSignup"]');
    if(btn) btn.classList.add('is-busy');
    err.style.color = 'var(--muted)';
    err.textContent = 'Creating the account…';
    withTimeout(cloudRegisterOperator(name, user, pass, codeEl ? codeEl.value.trim() : ''), 20000, 'Creating the account')
      .then(()=>{
        logAction(`${name} created an administrator account as operator ${user}.`);
        state.adminSignup = false;
        state.adminSignupUser = user;
        state.adminSignupMsg = 'Administrator account created — sign in below with your new operator ID and password.';
        renderLogin();
      })
      .catch(e=>{
        if(btn) btn.classList.remove('is-busy');
        // The code as well as the wording, so a fault can be reported exactly.
        reportCloudFailure(err, e);
      });
    return;
  }
  ADMINS.push({name, username:user, password:pass});
  saveAdmins();
  logAction(`${name} created their own administrator account (self sign-up) as operator ${user}.`);
  state.adminSignup = false;
  state.adminSignupUser = user;
  state.adminSignupMsg = 'Administrator account created — sign in below with your new operator ID and password.';
  renderLogin();
}

/* Email is the account identity: it is what Firebase Authentication signs a
   farm in with, and what a password-reset message is sent to. It is therefore
   required and checked for shape, not merely stored if offered. */
function looksLikeEmail(v){
  const t = String(v||'').trim();
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t);
}

function submitSelfRegistration(){
  const vals = readProfileFields('reg');
  const pass = document.getElementById('reg-password').value;
  const pass2 = document.getElementById('reg-password2').value;
  const codeEl = document.getElementById('reg-code');
  // Same here: online the rules are the authority on the code.
  if(!cloudOn() && farmCode() && (!codeEl || codeEl.value.trim() !== farmCode())){
    flagError(document.getElementById('reg-error'),
      'That membership code is not correct. The Secretariat issues it — call 0744 443 247 if you do not have one.');
    return;
  }
  if(!vals.name || !vals.contact || !vals.phone){
    flagError(document.getElementById('reg-error'), 'Farm name, contact person, and phone number are required.');
    return;
  }
  if(!vals.email){
    flagError(document.getElementById('reg-error'), 'An email address is required — it is what you sign in with and where a password reset is sent.');
    return;
  }
  if(!looksLikeEmail(vals.email)){
    flagError(document.getElementById('reg-error'), 'That email address does not look right. Check it and try again.');
    return;
  }
  if(!pass || pass.length < 4){
    flagError(document.getElementById('reg-error'), 'Choose a password of at least 4 characters.');
    return;
  }
  if(pass !== pass2){
    flagError(document.getElementById('reg-error'), 'Passwords do not match.');
    return;
  }
  if(findMemberByLogin(vals.phone) || (vals.email && findMemberByLogin(vals.email))){
    flagError(document.getElementById('reg-error'), 'A farm is already registered with that phone number or email.');
    return;
  }
  if(cloudOn()){
    const btnErr = document.getElementById('reg-error');
    btnErr.style.color = 'var(--muted)';
    btnErr.textContent = 'Registering your farm…';
    withTimeout(cloudRegisterFarm(vals, pass, codeEl ? codeEl.value.trim() : ''), 20000, 'Registering your farm')
      .then(uid=>{
        MEMBERS[uid] = Object.assign({}, vals, {
          password: pass, category:'Pending review', registered: todayStr(), status:'Pending',
          crops:[], avatar: state.regAvatar || ''
        });
        createBlankRecords(uid);
        logAction(`${vals.name} registered on the platform — membership pending Secretariat review.`);
        state.regAvatar = ''; state.showRegister = false; state.regSuccess = true;
        renderLogin();
      })
      .catch(e=> reportCloudFailure(btnErr, e));
    return;
  }
  const id = slugify(vals.name);
  // The account is usable straight away, so a new farm can build out its own
  // profile at once. The Secretariat still reviews it — the membership stays
  // Pending in Member management until an operator approves it.
  MEMBERS[id] = Object.assign({}, vals, {
    password: pass, category:'Pending review', registered: todayStr(), status:'Pending',
    crops:[], avatar: state.regAvatar || ''
  });
  createBlankRecords(id);
  logAction(`${vals.name} registered on the platform (self sign-up) — membership pending Secretariat review.`);
  state.regAvatar = '';
  state.showRegister = false; state.regSuccess = true;
  renderLogin();
}

// Match a member by phone or email, the two things a farm signs in with.
function findMemberByLogin(identifier){
  const t = norm(identifier);
  if(!t) return null;
  const hit = Object.entries(MEMBERS).find(([id,m]) => norm(m.phone)===t || norm(m.email)===t);
  return hit ? hit[0] : null;
}

/* ============================================================
   Password reset
   There is no mail server behind this prototype, so a reset is done
   in the browser against details only the account holder should
   know: a farm proves itself with both the phone number and the
   email on its record, an operator with their ID and the Secretariat
   sign-up code. Every reset is written to the audit log.
   ============================================================ */
function showForgot(which){ state.forgot = which; state.forgotMsg = ''; state.regSuccess = false; state.adminSignupMsg = ''; renderLogin(); }

/* With the database in use, a password belongs to Firebase Authentication and
   nothing in this page can change it. Asking for a new one here and then
   emailing a link as well gave two ways to reset that disagreed: the password
   typed in never took effect. So there is one way — the emailed link. */
function submitResetLink(btn){
  const err = document.getElementById('fp-error');
  const typed = document.getElementById('fp-link-email').value.trim();
  if(!typed || !looksLikeEmail(typed)){ flagError(err, 'Enter the email address on your account.'); return; }
  if(btn) btn.classList.add('is-busy');
  err.style.color = 'var(--muted)';
  err.textContent = 'Sending the link…';
  withTimeout(cloudResetEmail(typed), 20000, 'Sending the reset link')
    .then(()=>{
      state.forgot = null; state.regSuccess = false; state.adminSignupMsg = '';
      state.forgotMsg = `A reset link has been sent to ${typed}. Open it, set your new password there, then come back and sign in with it.`;
      logAction(`A password reset link was sent to ${typed}.`);
      renderLogin();
    })
    .catch(e=>{
      if(btn) btn.classList.remove('is-busy');
      flagError(err, cloudErrorText(e));
    });
}

function submitAdminReset(){
  const err = document.getElementById('fp-error');
  const user  = norm(document.getElementById('fp-user').value);
  const code  = document.getElementById('fp-code') ? document.getElementById('fp-code').value.trim() : '';
  const pass  = document.getElementById('fp-pass').value;
