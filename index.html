<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TIPFA Association Platform</title>
<meta name="theme-color" content="#405E35">
<meta name="description" content="TIPFA Association Platform — member farm records, harvest planning and secretariat oversight for the Tanzania Indoor &amp; Professional Farmers Association.">
<link rel="icon" type="image/png" href="assets/brand/tipfa-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ============================================================
   TIPFA Association Platform
   Visual identity per TIPFA Brand Guidelines v1.0 (2026)
   Palette p13 · Typography p15 · Arc system p17
   ============================================================ */
:root{
  /* Core palette — exact values, brand guidelines page 13 */
  --tipfa-green:#405E35;
  --harvest-orange:#E8A734;
  --field-cream:#EFEDE2;
  --leaf-green:#7E9B3F;
  --deep-green:#2C4423;
  --soil-ink:#23281F;

  /* Applied roles — page 14 */
  --ink:var(--soil-ink);
  --paper:var(--field-cream);
  --card:#FFFFFF;
  --line:#DFDCCB;
  --line-soft:#EAE7DA;
  --muted:#6E7466;
  --leaf:var(--tipfa-green);
  --leaf-dark:var(--deep-green);
  --gold:var(--harvest-orange);
  --red:#A8402F;
  --teal:#2F7A82;
  --soil:#A85C3F;

  --radius:14px;
  --radius-sm:10px;
  --radius-lg:22px;

  --shadow-sm:0 1px 2px rgba(35,40,31,.05), 0 2px 8px rgba(35,40,31,.04);
  --shadow-md:0 2px 6px rgba(35,40,31,.06), 0 12px 28px rgba(35,40,31,.08);
  --shadow-lg:0 8px 20px rgba(35,40,31,.10), 0 28px 60px rgba(35,40,31,.14);

  /* Role accents keep the palette — never invent a colour */
  --role-accent:var(--tipfa-green);
  --role-accent-dark:var(--deep-green);

  /* Motion system */
  --ease-out:cubic-bezier(.16,.84,.44,1);
  --ease-spring:cubic-bezier(.22,1.2,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-1:.18s; --dur-2:.32s; --dur-3:.52s; --dur-4:.8s;
}
body[data-role="member"]{ --role-accent:#7E9B3F; --role-accent-dark:#405E35; }
body[data-role="admin"]{ --role-accent:#405E35; --role-accent-dark:#2C4423; }

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-weight:400;
  color:var(--ink);
  background:var(--field-cream);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,.display,.brand,.btn,.metric .val,.tabbtn,.logintabs button,.eyebrow{
  font-family:'Poppins','Montserrat',system-ui,sans-serif;
}
a{color:var(--tipfa-green);}

/* ---------- Arc system (guidelines p17) -----------------------
   Arcs are anchored to an edge, always cropped by it, solid on
   cream, lighter green at 25–35% on green. Never a whole circle,
   never more than three, always behind content.              */
.arcfield{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.arc{position:absolute;border-radius:50%;will-change:transform;}
.arc--cream-1{width:min(58vw,540px);aspect-ratio:1;left:-16%;bottom:-38%;background:#E5E3D5;animation:arcDrift 22s var(--ease-in-out) infinite;}
.arc--cream-2{width:min(42vw,400px);aspect-ratio:1;left:8%;bottom:-30%;background:#DCDCCB;animation:arcDrift 27s var(--ease-in-out) infinite reverse;}
.arc--green-1{width:min(70vw,620px);aspect-ratio:1;right:-22%;bottom:-40%;background:rgba(126,155,63,.30);animation:arcDrift 24s var(--ease-in-out) infinite;}
.arc--green-2{width:min(48vw,430px);aspect-ratio:1;right:2%;bottom:-34%;background:rgba(126,155,63,.22);animation:arcDrift 30s var(--ease-in-out) infinite reverse;}
.arc--green-3{width:min(34vw,300px);aspect-ratio:1;left:-14%;top:-18%;background:rgba(239,237,226,.10);animation:arcDrift 34s var(--ease-in-out) infinite;}
@keyframes arcDrift{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  50%{transform:translate3d(2.5%,-3.5%,0) scale(1.055);}
}

.app{max-width:1240px;margin:0 auto;background:var(--field-cream);position:relative;}

/* ---------- Top bar ---------- */
.topbar{
  background:var(--tipfa-green); color:var(--field-cream);
  padding:14px 26px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:14px; position:relative; overflow:hidden;
}
.topbar > *{position:relative;z-index:1;}
.brandblock{display:flex;align-items:center;gap:14px;animation:riseIn var(--dur-3) var(--ease-out) both;}
.brandlogo{
  width:34px;height:auto;display:block;   /* symbol minimum on screen is 32px wide */
  transition:transform var(--dur-2) var(--ease-spring);
}
.brandtext{line-height:1.3;}
.bt-name{
  font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;letter-spacing:.01em;
}
.bt-name span{font-weight:400;opacity:.82;}
.brandblock:hover .brandlogo{transform:scale(1.03);}
.brandrule{width:1px;height:38px;background:rgba(239,237,226,.30);}
.brandblock .tagline{
  font-size:11.5px;letter-spacing:.02em;line-height:1.4;opacity:.8;margin-top:2px;font-style:italic;
}
.session{display:flex;align-items:center;gap:12px;color:var(--field-cream);font-size:12.5px;animation:riseIn var(--dur-3) var(--ease-out) .08s both;}
.session .who{font-weight:600;font-family:'Poppins',sans-serif;}
.session .role-tag{opacity:.82;}
.session button{
  border:1.5px solid rgba(239,237,226,.55);background:none;color:var(--field-cream);
  font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  transition:background var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.session button:hover{background:rgba(239,237,226,.14);border-color:var(--field-cream);transform:translateY(-1px);}
.session button:active{transform:translateY(0) scale(.97);}

/* ---------- Sign-in ---------- */
.loginwrap{
  display:grid;grid-template-columns:1.05fr .95fr;min-height:640px;position:relative;
}
.loginbrand{
  background:var(--deep-green);color:var(--field-cream);
  padding:52px 46px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  animation:panelIn var(--dur-4) var(--ease-out) both;
}
.loginbrand > *{position:relative;z-index:1;}
.loginbrand .lb-logo{
  width:min(300px,72%);height:auto;display:block;margin-bottom:34px;
  animation:logoIn 1s var(--ease-spring) .12s both;
}
.eyebrow{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;
  color:var(--harvest-orange);margin-bottom:14px;
}
.loginbrand h2{
  font-size:clamp(24px,2.6vw,33px);font-weight:700;line-height:1.16;letter-spacing:-.02em;margin:0 0 10px;
}
.loginbrand .strap{font-size:14px;line-height:1.6;opacity:.9;max-width:34ch;margin:0 0 30px;font-weight:300;}
.loginbrand .strap em{font-style:normal;font-weight:500;display:block;opacity:.72;font-size:13px;margin-top:3px;}
.values{display:grid;gap:14px;max-width:400px;}
.value{display:flex;gap:13px;align-items:flex-start;}
.value svg{flex:none;margin-top:1px;stroke:var(--harvest-orange);}
.value .vt{font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;}
.value .vd{font-size:12px;opacity:.78;line-height:1.5;font-weight:300;}
.lb-foot{margin-top:34px;font-size:11.5px;opacity:.62;line-height:1.6;font-weight:300;}

.loginpane{
  display:flex;align-items:center;justify-content:center;padding:48px 42px;position:relative;background:var(--field-cream);
}
.loginbox{width:100%;max-width:410px;position:relative;z-index:1;animation:riseIn var(--dur-4) var(--ease-out) .16s both;}
.lock-icon{
  display:flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;
  color:var(--deep-green);margin-bottom:16px;
}
.lock-icon svg{stroke:var(--tipfa-green);}
.logintabs{display:flex;background:#E3E1D3;border-radius:999px;padding:4px;margin-bottom:20px;position:relative;}
.logintabs button{
  flex:1;border:none;background:none;font-size:13px;font-weight:600;
  color:var(--muted);padding:10px 0;border-radius:999px;cursor:pointer;position:relative;z-index:1;
  transition:color var(--dur-2) var(--ease-out);
}
.logintabs button.active{color:#fff;}
.logintabs .tabglide{
  position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;background:var(--tipfa-green);
  transition:transform var(--dur-3) var(--ease-spring);z-index:0;box-shadow:var(--shadow-sm);
}
.login-note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6;}
.login-note a{font-weight:600;text-decoration:none;border-bottom:1px solid rgba(64,94,53,.35);transition:border-color var(--dur-1);}
.login-note a:hover{border-color:var(--tipfa-green);}
.demo-note{background:#E7E5D8;border-radius:var(--radius-sm);padding:11px 13px;font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:14px;}
.demo-note strong{color:var(--deep-green);}

/* ---------- Sub bar ---------- */
.subbar{
  display:flex;align-items:center;gap:12px;padding:12px 26px;background:#E7E5D8;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
  animation:fadeIn var(--dur-3) var(--ease-out) both;
}
.subbar label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-weight:600;font-family:'Poppins',sans-serif;}
.subbar select{padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:13px;background:#fff;}
.subbar .who-name{font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:var(--deep-green);}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:236px 1fr;gap:0;min-height:560px;position:relative;}
.sidebar{
  border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:3px;
  position:relative;background:linear-gradient(180deg,#EBE9DC 0%, var(--field-cream) 100%);
}
.tabbtn{
  text-align:left;border:none;background:none;padding:11px 14px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;position:relative;
  transition:color var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
  animation:slideInLeft var(--dur-3) var(--ease-out) both;
}
.tabbtn:hover{color:var(--deep-green);background:rgba(255,255,255,.6);transform:translateX(2px);}
.tabbtn.active{
  background:var(--card);color:var(--role-accent-dark);font-weight:600;box-shadow:var(--shadow-sm);
}
.tabbtn.active::before{
  content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
  background:var(--role-accent);animation:growBar var(--dur-3) var(--ease-spring) both;
}
.content{padding:26px 30px 52px;position:relative;overflow:hidden;}

/* ---------- Type scale (guidelines p16) ---------- */
h1.page-title{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 5px;color:var(--deep-green);}
p.page-sub{font-size:13px;color:var(--muted);margin:0 0 22px;font-weight:300;line-height:1.6;}
.section-label{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;margin:24px 0 10px;
  color:var(--tipfa-green);font-family:'Poppins',sans-serif;
}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-sm);
  transition:box-shadow var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out);
}
.card:hover{box-shadow:var(--shadow-md);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* ---------- Forms ---------- */
label.f{
  display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.14em;font-family:'Poppins',sans-serif;
}
input, select, textarea{
  width:100%;font-family:'Inter',sans-serif;font-size:13.5px;padding:10px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:#FCFCF8;color:var(--ink);margin-bottom:12px;
  transition:border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out);
}
input:hover, select:hover, textarea:hover{border-color:#C9C6B4;}
input:focus, select:focus, textarea:focus{
  outline:none;border-color:var(--tipfa-green);background:#fff;
  box-shadow:0 0 0 3px rgba(64,94,53,.13);
}
input[type="file"]{padding:8px;background:#F6F5EE;}

/* ---------- Buttons ---------- */
.btn{
  padding:11px 20px;border:none;border-radius:999px;background:var(--role-accent);color:#fff;
  font-weight:600;font-size:13.5px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(35,40,31,.10);
  transition:transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(64,94,53,.28);}
.btn:active{transform:translateY(0) scale(.98);}
.btn.ghost{background:transparent;border:1.5px solid var(--role-accent);color:var(--role-accent);box-shadow:none;}
.btn.ghost:hover{background:rgba(64,94,53,.07);box-shadow:0 4px 12px rgba(64,94,53,.14);}
.btn.small{padding:8px 14px;font-size:12.5px;}
/* Harvest Orange is the single call to action — rationed, p14 */
.btn.gold{background:var(--harvest-orange);color:var(--deep-green);}
.btn.gold:hover{box-shadow:0 6px 16px rgba(232,167,52,.40);}
.btn .ripple{
  position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.5);
  animation:ripple .62s var(--ease-out);pointer-events:none;
}
.btn.is-busy{pointer-events:none;}
.btn.is-busy::after{
  content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shimmer 1s linear infinite;
}
@keyframes ripple{to{transform:scale(3.2);opacity:0;}}
@keyframes shimmer{from{transform:translateX(-100%);}to{transform:translateX(100%);}}

/* ---------- Metrics ---------- */
.metric{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform var(--dur-3) var(--ease-spring), box-shadow var(--dur-3) var(--ease-out);
}
.metric::after{
  content:'';position:absolute;right:-30px;bottom:-46px;width:100px;height:100px;border-radius:50%;
  background:rgba(126,155,63,.10);transition:transform var(--dur-4) var(--ease-spring);
}
.metric:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.metric:hover::after{transform:scale(1.5);}
.metric .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-family:'Poppins',sans-serif;}
.metric .val{font-size:24px;font-weight:700;margin-top:4px;color:var(--deep-green);letter-spacing:-.02em;position:relative;}

/* ---------- Tables ---------- */
table.grid-table{width:100%;border-collapse:collapse;font-size:13px;}
table.grid-table th{
  background:var(--tipfa-green);color:var(--field-cream);text-align:left;padding:10px 12px;font-size:10px;
  text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-family:'Poppins',sans-serif;
}
table.grid-table th:first-child{border-radius:var(--radius-sm) 0 0 0;}
table.grid-table th:last-child{border-radius:0 var(--radius-sm) 0 0;}
table.grid-table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);}
table.grid-table tbody tr{transition:background var(--dur-1) var(--ease-out);}
table.grid-table tr:nth-child(even) td{background:#F8F7F0;}
table.grid-table tbody tr:hover td{background:#EFEFE2;}
table.grid-table input{margin:0;padding:7px 9px;font-size:12.5px;}

/* ---------- Status pills ---------- */
.status-pill{
  font-size:10px;font-weight:600;padding:4px 11px;border-radius:99px;display:inline-block;
  font-family:'Poppins',sans-serif;letter-spacing:.02em;
}
.status-open{background:#F6E3D3;color:var(--soil);}
.status-progress{background:#FBEECC;color:#8A6412;}
.status-resolved{background:#DFE7D2;color:var(--deep-green);}
.status-active{background:#DFE7D2;color:var(--deep-green);}
.status-pending{background:#FBEECC;color:#8A6412;animation:softPulse 2.6s var(--ease-in-out) infinite;}
.status-rejected{background:#F3DCD8;color:var(--red);}
@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,167,52,.42);}50%{box-shadow:0 0 0 6px rgba(232,167,52,0);}}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.chip{
  padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;
  cursor:pointer;color:var(--muted);font-weight:500;
  transition:transform var(--dur-1) var(--ease-spring), background var(--dur-2) var(--ease-out), color var(--dur-2), border-color var(--dur-2), box-shadow var(--dur-2);
}
.chip:hover{transform:translateY(-2px);border-color:var(--leaf-green);color:var(--deep-green);box-shadow:var(--shadow-sm);}
.chip.active{background:var(--role-accent);border-color:var(--role-accent);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(64,94,53,.24);}

/* ---------- Banners & helpers ---------- */
.msg-banner{
  background:#DFE7D2;color:var(--deep-green);padding:12px 16px;border-radius:var(--radius-sm);font-size:12.5px;
  margin-bottom:14px;font-weight:500;display:flex;align-items:center;gap:10px;
  animation:bannerIn var(--dur-3) var(--ease-spring) both;border-left:3px solid var(--leaf-green);
}
.msg-banner svg{flex:none;stroke:var(--tipfa-green);}
.helper{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6;}
.err-shake{animation:shake .42s var(--ease-in-out);}
.log-item{
  font-size:12px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line-soft);
  display:flex;gap:12px;animation:riseIn var(--dur-3) var(--ease-out) both;
}
.log-item .t{font-variant-numeric:tabular-nums;color:var(--leaf-green);font-weight:500;flex:none;}

/* ---------- Farm logos ------------------------------------
   Member marks are placed from assets/farms/<farm-name>.png.
   If a file is missing the monogram shows instead, so the
   layout never breaks.                                     */
.farm-logo{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--line-soft);
  overflow:hidden;position:relative;
  transition:transform var(--dur-2) var(--ease-spring), box-shadow var(--dur-2) var(--ease-out);
}
.farm-logo img{width:100%;height:100%;object-fit:contain;padding:3px;display:block;}
.farm-logo .farm-initials{
  display:none;font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;color:var(--tipfa-green);
  letter-spacing:.02em;
}
.farm-logo.is-missing{background:#EDEBDE;}
.farm-logo.is-missing .farm-initials{display:block;}
.farm-logo.lg{width:64px;height:64px;border-radius:16px;}
.farm-logo.lg .farm-initials{font-size:20px;}
.farm-logo.xl{width:88px;height:88px;border-radius:20px;}
.farm-logo.xl .farm-initials{font-size:27px;}
.farm-logo.sm{width:28px;height:28px;border-radius:8px;}
.farm-logo.sm .farm-initials{font-size:10px;}
.farm-logo:hover{transform:scale(1.06) rotate(-1.5deg);box-shadow:var(--shadow-md);}
.farm-cell{display:flex;align-items:center;gap:10px;}
.farm-cell .fname{font-weight:500;}

.logo-picker{
  display:flex;gap:16px;align-items:flex-start;padding:14px;margin-bottom:16px;
  background:#F7F6EF;border:1px dashed var(--line);border-radius:var(--radius);
}
.logo-picker .lp-body{flex:1;min-width:0;}
.logo-picker input[type="file"]{margin-bottom:6px;}
.logo-picker .farm-logo{background:#fff;}

.empty-state{text-align:center;padding:38px 26px;}
.empty-state .es-mark{
  width:52px;height:52px;border-radius:50%;background:#EEF0E4;color:var(--tipfa-green);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  animation:softPulse 3s var(--ease-in-out) infinite;
}
.empty-state .es-mark svg{width:24px;height:24px;}

@keyframes panelIn{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:translateX(0);}}

@keyframes growBar{from{transform:scaleY(0);}to{transform:scaleY(1);}}

@keyframes wipeOut{from{transform:scaleY(1);}to{transform:scaleY(0);}}

.bar-fill{transform-origin:left center;}

/* Staggered reveal, applied per render */
.reveal{animation:riseIn var(--dur-3) var(--ease-out) both;}
.reveal-1{animation-delay:.04s;} .reveal-2{animation-delay:.08s;}
.reveal-3{animation-delay:.12s;} .reveal-4{animation-delay:.16s;}

.onscroll.seen{opacity:1;transform:none;}

/* Route transition curtain — a cropped arc, in keeping with p17 */
.curtain{
  position:fixed;inset:0;z-index:90;pointer-events:none;background:var(--deep-green);

let storeReady = false;
function saveMembers(){
  if(!storeReady) return;
  try{
    localStorage.setItem(MEMBER_STORE_KEY, JSON.stringify({
      members: MEMBERS, harvest: harvest, inputs: inputsData,
      complaints: complaints, nextComplaintId: nextComplaintId
    }));
  }catch(e){ /* storage full or unavailable — the session still works */ }
}
function loadMembers(){
  try{
    const raw = localStorage.getItem(MEMBER_STORE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.members || typeof d.members !== 'object') return;
    /* falls through to restore the stored register */
    MEMBERS = d.members;
    harvest = d.harvest || {};
    inputsData = d.inputs || {};
    complaints = Array.isArray(d.complaints) ? d.complaints : [];
    nextComplaintId = d.nextComplaintId || (complaints.length + 1);
    // Backfill anything a stored record predates, so an older save still opens.
    Object.keys(MEMBERS).forEach(id=>{
      const m = MEMBERS[id];
      if(!Array.isArray(m.crops)) m.crops = [];
      if(!Array.isArray(m.marketStandards)) m.marketStandards = [];

      if(!inputsData[id]) inputsData[id] = { weekly:blankPeriod(INPUTS,0), monthly:blankPeriod(INPUTS,0), annual:blankPeriod(INPUTS,0) };
    });
  }catch(e){ /* unreadable store — start empty rather than fail to load */ }
  finally{ storeReady = true; }
}

// still works after a page reload. Falls back to memory only if storage is blocked.

function loadAdmins(){
  try{
    const raw = localStorage.getItem(ADMIN_STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){ /* storage unavailable — fall through to defaults */ }
  return DEFAULT_ADMINS.map(a=>Object.assign({}, a));
}
function saveAdmins(){

}

   Farm logo placement
   Each member farm's mark is loaded from assets/farms/, named
   after the farm itself — "She Farms" -> assets/farms/she-farms.png.
   Drop a farm's file in with that name and it appears everywhere
   the farm is shown. Until then the monogram stands in, so a
   missing file never breaks a layout.
   ============================================================ */
const FARM_LOGO_DIR = 'assets/farms/';
const FARM_LOGO_EXT = '.png';
function farmLogoSlug(name){
  return (name||'').toLowerCase().trim()
    .replace(/&/g,'and')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
}
function farmLogoSrc(m){
  if(!m) return '';
  if(m.avatar) return m.avatar;                   // the farm's own uploaded image
  if(m.logo) return m.logo;                       // explicit file override
  return FARM_LOGO_DIR + farmLogoSlug(m.name) + FARM_LOGO_EXT;
}

/* A farm's profile image is its logo: it is shown wherever the farm appears.
   The picture is squared off and scaled down before it is stored, so a photo
   straight off a phone does not fill up the browser's storage. */
const AVATAR_PX = 320;
function readImageAsLogo(file, done, fail){
  if(!file){ fail && fail('Choose an image file.'); return; }
  if(!/^image\//.test(file.type)){ fail && fail('That file is not an image.'); return; }
  const reader = new FileReader();
  reader.onerror = ()=> fail && fail('That image could not be read.');
  reader.onload = ()=>{
    const img = new Image();
    img.onerror = ()=> fail && fail('That image could not be opened.');
    img.onload = ()=>{
      const side = Math.min(img.width, img.height);
      const cv = document.createElement('canvas');
      cv.width = cv.height = AVATAR_PX;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
      // PNG keeps a transparent logo transparent; a photo is fine either way.
      done(cv.toDataURL('image/png'));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function farmInitials(name){
  const words = (name||'').split(/\s+/).filter(Boolean);

  return (words[0][0] + words[words.length-1][0]).toUpperCase();
}

/* ============================================================
   Motion
   Entrance, transition and feedback motion for the whole app.
   The logo lockup is only ever moved or scaled as one object —
   its parts are never animated out of position (guidelines p11).
   Everything here yields to prefers-reduced-motion via the CSS.
   ============================================================ */
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Stagger direct children of a freshly rendered container.
function staggerIn(container, selector){
  if(!container) return;
  const nodes = container.querySelectorAll(selector || ':scope > .card, :scope > .grid2, :scope > .grid3, :scope > .grid4, :scope > .section-label, :scope > .chips, :scope > .msg-banner');
  nodes.forEach((n,i)=>{
    n.classList.add('reveal');
    if(i < 8) n.classList.add('reveal-'+(i+1));
  });
}

// Reveal cards as they scroll into view.
let scrollObserver = null;
function observeScrollReveals(container){
  if(REDUCED_MOTION || !('IntersectionObserver' in window)) return;
  if(!scrollObserver){
    scrollObserver = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('seen'); scrollObserver.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -40px 0px', threshold:.05});
  }
  const cards = container.querySelectorAll('.card');
  cards.forEach((c,i)=>{
    if(i < 4) return;                    // the first screenful uses the entrance stagger
    c.classList.add('onscroll');
    scrollObserver.observe(c);
  });
}

// Count metric values up from zero.
function animateCounters(container){
  container.querySelectorAll('[data-count]').forEach(el=>{
    const target = Number(el.getAttribute('data-count'))||0;
    const suffix = el.getAttribute('data-suffix')||'';
    if(REDUCED_MOTION || !target){ el.textContent = fmt(target)+suffix; return; }
    const dur = 900, start = performance.now();
    function tick(now){
      const p = Math.min(1,(now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = fmt(Math.round(target*eased))+suffix;
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

// Ripple feedback on every button press.
document.addEventListener('click', function(e){
  const btn = e.target.closest('.btn');
  if(!btn || REDUCED_MOTION) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = d+'px';
  span.style.left = (e.clientX - r.left - d/2)+'px';
  span.style.top = (e.clientY - r.top - d/2)+'px';
  btn.appendChild(span);
  setTimeout(()=>span.remove(), 640);
});

// Shake a field-level error into view.
function flagError(el, message){
  if(!el) return;
  el.textContent = message;
  const box = el.closest('.card') || el;
  box.classList.remove('err-shake');
  void box.offsetWidth;                  // restart the animation
  box.classList.add('err-shake');
  setTimeout(()=>box.classList.remove('err-shake'), 500);
}

// Arc curtain used when crossing between signed-out and signed-in.
function curtainTransition(midpoint){
  if(REDUCED_MOTION){ midpoint(); return; }
  const c = document.createElement('div');
  c.className = 'curtain in';
  document.body.appendChild(c);
  setTimeout(()=>{
    midpoint();
    c.className = 'curtain out';
    setTimeout(()=>c.remove(), 460);
  }, 420);
}

// Holds the picked image until the surrounding form is saved.
const pendingLogos = {};
function pickLogo(prefix, input){
  const msg = document.getElementById(prefix+'-logo-msg');
  readImageAsLogo(input.files && input.files[0], function(dataUrl){
    pendingLogos[prefix] = dataUrl;
    if(prefix === 'reg') state.regAvatar = dataUrl;
    const box = document.getElementById(prefix+'-logo-preview');
    if(box){ box.classList.remove('is-missing'); box.innerHTML = `<img src="${dataUrl}" alt="Farm logo">`; }
    if(msg){ msg.textContent = 'Image ready — save the profile to apply it.'; msg.style.color = 'var(--tipfa-green)'; }
  }, function(err){
    if(msg){ msg.textContent = err; msg.style.color = 'var(--red)'; }
  });
}
function clearLogo(prefix){
  pendingLogos[prefix] = '';
  if(prefix === 'reg') state.regAvatar = '';
  if(prefix === 'prof' && state.member){
    MEMBERS[state.member].avatar = '';
    logAction(`${MEMBERS[state.member].name} removed their farm logo.`);
    render();
    return;
  }
  const box = document.getElementById(prefix+'-logo-preview');
  if(box) box.innerHTML = `<span class="farm-initials" style="display:block;">—</span>`;
}

function readProfileFields(prefix){
  const catEl = document.getElementById(`${prefix}-category`);
  const vals = {
    name: document.getElementById(`${prefix}-name`).value.trim(),
    contact: document.getElementById(`${prefix}-contact`).value.trim(),
    phone: document.getElementById(`${prefix}-phone`).value.trim(),
    email: document.getElementById(`${prefix}-email`).value.trim(),
    location: document.getElementById(`${prefix}-location`).value.trim(),
    category: catEl ? catEl.value : undefined,
    totalArea: Number(document.getElementById(`${prefix}-totalArea`).value)||0,
    indoorSqm: Number(document.getElementById(`${prefix}-indoorSqm`).value)||0,
    indoorUnits: Number(document.getElementById(`${prefix}-indoorUnits`).value)||0,
    outdoorArea: Number(document.getElementById(`${prefix}-outdoorArea`).value)||0,
    irrigation: document.getElementById(`${prefix}-irrigation`).value.trim(),
    water: document.getElementById(`${prefix}-water`).value.trim(),
  };
  // Only carry the image through when one was actually picked or cleared,
  // so saving the form otherwise leaves the existing logo alone.
  if(pendingLogos[prefix] !== undefined) vals.avatar = pendingLogos[prefix];
  return vals;
}

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function doMemberLogin(btn){
  const identifier = norm(document.getElementById('login-id').value);
  const password = document.getElementById('login-password').value.trim();
  if(!identifier || !password){ flagError(document.getElementById('login-error'), 'Enter your phone number/email and password.'); return; }
  const match = Object.entries(MEMBERS).find(([id,m]) =>
    m.status!=='Rejected' && m.password===password && (norm(m.phone)===identifier || norm(m.email)===identifier));
  if(!match){
    const known = Object.entries(MEMBERS).find(([id,m]) => norm(m.phone)===identifier || norm(m.email)===identifier);
    flagError(document.getElementById('login-error'),
      known ? (known[1].status==='Rejected'
                ? 'That registration was not approved. Contact the Secretariat on 0744 443 247.'
                : 'That password does not match this account.')
            : 'No account matches that phone number or email. Register your farm below.');
    return;
  }
  const [id] = match;
  signInTransition(btn, ()=>{
    state.loggedIn = true; state.role = 'member'; state.member = id; state.tab = 'profile';
    document.body.setAttribute('data-role','member');
    logAction(`${MEMBERS[id].name} signed in.`);
    render();
  });
}

// Brief working state on the button, then an arc curtain across the change of context.
function signInTransition(btn, done){
  if(btn) btn.classList.add('is-busy');
  setTimeout(()=>{
    if(btn) btn.classList.remove('is-busy');
    curtainTransition(done);
  }, REDUCED_MOTION ? 0 : 260);
}
function doAdminLogin(btn){
  const identifier = norm(document.getElementById('login-user').value);
  const password = document.getElementById('login-pass').value.trim();
  if(!identifier || !password){ flagError(document.getElementById('login-error-admin'), 'Enter your operator ID and password.'); return; }
  const match = ADMINS.find(a => {
    const u = norm(a.username), local = u.split('@')[0];
    return (identifier===u || identifier===local) && a.password===password;
  });
  if(!match){ flagError(document.getElementById('login-error-admin'), 'Invalid operator ID or password.'); return; }
  signInTransition(btn, ()=>{
    state.loggedIn = true; state.role = 'admin'; state.tab = 'members'; state.adminName = match.name;
    state.adminSignupMsg = ''; state.adminSignupUser = '';
    document.body.setAttribute('data-role','admin');
    logAction(`Operator ${match.name} signed in to the administrator console.`);
    render();
  });
}
function logout(){
  logAction(`${state.role==='member' ? MEMBERS[state.member].name : (state.adminName||'Operator')} signed out.`);
  curtainTransition(()=>{
    state.loggedIn = false; state.role = null;

function submitAdminSignup(){
  const err = document.getElementById('asignup-error');
  const name = document.getElementById('asignup-name').value.trim();
  const user = document.getElementById('asignup-user').value.trim();
  const pass = document.getElementById('asignup-pass').value;
  const pass2 = document.getElementById('asignup-pass2').value;
  const codeEl = document.getElementById('asignup-code');
  if(!name || !user || !pass){
    flagError(err, 'Enter your full name, the operator ID you want, and a password.'); return;
  }
  if(ADMIN_SIGNUP_CODE && (codeEl.value.trim() !== ADMIN_SIGNUP_CODE)){
    flagError(err, 'That Secretariat sign-up code is not correct.'); return;
  }
  if(pass.length < 6){
    flagError(err, 'Choose a password of at least 6 characters.'); return;
  }
  if(pass !== pass2){
    flagError(err, 'Passwords do not match.'); return;
  }
  const u = norm(user), local = u.split('@')[0];
  if(ADMINS.some(a=>{ const au = norm(a.username); return au===u || au.split('@')[0]===local; })){
    flagError(err, 'That operator ID is already in use.'); return;
  }
  if(ADMINS.length >= MAX_ADMINS){
    flagError(err, `All ${MAX_ADMINS} administrator seats are taken — an existing operator must remove one first.`); return;
  }
  ADMINS.push({name, username:user, password:pass});
  saveAdmins();
  logAction(`${name} created their own administrator account (self sign-up) as operator ${user}.`);
  state.adminSignup = false;
  state.adminSignupUser = user;
  state.adminSignupMsg = 'Administrator account created — sign in below with your new operator ID and password.';
  renderLogin();
}

function submitSelfRegistration(){
  const vals = readProfileFields('reg');
  const pass = document.getElementById('reg-password').value;
  const pass2 = document.getElementById('reg-password2').value;
  if(!vals.name || !vals.contact || !vals.phone){
    flagError(document.getElementById('reg-error'), 'Farm name, contact person, and phone number are required.');
    return;
  }
  if(!pass || pass.length < 4){
    flagError(document.getElementById('reg-error'), 'Choose a password of at least 4 characters.');
    return;
  }
  if(pass !== pass2){
    flagError(document.getElementById('reg-error'), 'Passwords do not match.');
    return;
  }
  if(findMemberByLogin(vals.phone) || (vals.email && findMemberByLogin(vals.email))){
    flagError(document.getElementById('reg-error'), 'A farm is already registered with that phone number or email.');
    return;
  }
  const id = slugify(vals.name);
  // The account is usable straight away, so a new farm can build out its own
  // profile at once. The Secretariat still reviews it — the membership stays
  // Pending in Member management until an operator approves it.
  MEMBERS[id] = Object.assign({}, vals, {
    password: pass, category:'Pending review', registered: todayStr(), status:'Pending',
    crops:[], avatar: state.regAvatar || ''
  });
  createBlankRecords(id);
  logAction(`${vals.name} registered on the platform (self sign-up) — membership pending Secretariat review.`);
  state.regAvatar = '';
  state.showRegister = false; state.regSuccess = true;
  renderLogin();
}

// Match a member by phone or email, the two things a farm signs in with.
function findMemberByLogin(identifier){
  const t = norm(identifier);
  if(!t) return null;
  const hit = Object.entries(MEMBERS).find(([id,m]) => norm(m.phone)===t || norm(m.email)===t);
  return hit ? hit[0] : null;
}

// Entrance motion for whatever the active tab just rendered.
function afterRender(c){
  c.classList.remove('is-swapping');
  void c.offsetWidth;
  c.classList.add('is-swapping');
  staggerIn(c);
  animateCounters(c);
  observeScrollReveals(c);
}

function renderTabContent(c){
  if(state.role==='member'){
    if(state.tab==='profile') return renderProfile(c);
    if(state.tab==='calendar') return renderCropCalendar(c);
    if(state.tab==='standards') return renderMarketStandards(c);
    if(state.tab==='plan') return renderHarvestForm(c,'plan');
    if(state.tab==='actual') return renderHarvestForm(c,'actual');
    if(state.tab==='market') return renderMarketPrices(c);
    if(state.tab==='inputs') return renderInputs(c);
    if(state.tab==='future') return renderFuturePlanning(c);
    if(state.tab==='reports') return renderReportsMember(c);
    if(state.tab==='comms') return renderComms(c,false);
  } else {
    if(state.tab==='members') return renderMembers(c);
    if(state.tab==='bulk') return renderBulk(c);
    if(state.tab==='dashboard') return renderDashboard(c);
    if(state.tab==='growth') return renderGrowth(c);
    if(state.tab==='reportsA') return renderReportsAdmin(c);
    if(state.tab==='commsA') return renderComms(c,true);
    if(state.tab==='gov') return renderGovernance(c);
  }
}

    document.getElementById('profile-msg').style.color = 'var(--red)';
    return;
  }
  const preservedCategory = MEMBERS[state.member].category;

let priceChartRef = null;
function priceTrendData(crop, period){
  const base = PRICE_BASE[crop] || 1000;
  if(period==='weekly') return {labels:['Wk1','Wk2','Wk3','Wk4','Wk5','Wk6'], data:[0.95,1.0,1.02,0.98,1.04,1.06].map(mu=>Math.round(base*mu))};
  if(period==='monthly') return {labels:['Mar','Apr','May','Jun','Jul','Aug'], data:[0.9,0.95,1.0,1.03,1.05,1.08].map(mu=>Math.round(base*mu))};
  return {labels:['2024','2025','2026'], data:[0.88,0.97,1.05].map(mu=>Math.round(base*mu))};
}
function selectPriceCrop(crop){ state.priceCrop = crop; render(); }
function renderMarketPrices(c){
  const m = MEMBERS[state.member];
  if(!state.priceCrop) state.priceCrop = (m.crops[0] && m.crops[0].crop) || CROPS[0];

function addMarketPrice(){
  const buyer = document.getElementById('price-buyer').value.trim();
  const price = Number(document.getElementById('price-value').value)||0;

function drawPriceChart(){
  if(!window.Chart) return;
  const ctx = document.getElementById('priceChart'); if(!ctx) return;
  if(priceChartRef) priceChartRef.destroy();
  const {labels,data} = priceTrendData(state.priceCrop, state.period);
  priceChartRef = new Chart(ctx, { type:'line', data:{ labels, datasets:[{ label:state.priceCrop+' price (TZS/kg)', data, borderColor:'#405E35', backgroundColor:'rgba(64,94,53,0.14)', pointBackgroundColor:'#E8A734', pointBorderColor:'#405E35', fill:true, tension:0.3, pointRadius:3 }] },

      scales:{ y:{ grid:{ color:CHART_GRID }, ticks:{ font:{ size:10 } } }, x:{ grid:{ display:false }, ticks:{ font:{ size:10 } } } } } });
}

function renderPlanVsActual(m){
  const id = state.member, month = state.selMonth, week = state.selWeek;
  let weekPlanTotal=0, weekActualTotal=0;
  CROPS.forEach(cr=>{ weekPlanTotal += (harvest[id].plan[month][week][cr]||0); weekActualTotal += (harvest[id].actual[month][week][cr]||0); });
  const monthPlanTotal = memberMonthTotal(id,'plan',month), monthActualTotal = memberMonthTotal(id,'actual',month);
  const yearPlanTotal = memberYearTotal(id,'plan'), yearActualTotal = memberYearTotal(id,'actual');
  const rows = CROPS.map(cr=>{
    const p = memberMonthCropTotal(id,'plan',month,cr), a = memberMonthCropTotal(id,'actual',month,cr);
    if(p===0 && a===0) return '';
    return `<tr><td>${cr}</td><td>${fmt(p)}</td><td>${fmt(a)}</td><td>${pct(a,p)}%</td></tr>`;
  }).join('');
  return `<div class="section-label">Plan vs. actual — performance</div>
    <div class="card">
      ${comparisonBar('Week '+week+' of '+MONTHS[month-1], weekPlanTotal, weekActualTotal)}
      ${comparisonBar(MONTHS[month-1]+' (month to date)', monthPlanTotal, monthActualTotal)}
      ${comparisonBar('Year to date (2026)', yearPlanTotal, yearActualTotal)}

function submitAdminRegistration(){
  const vals = readProfileFields('areg');
  const pass = document.getElementById('areg-password').value;
  if(!vals.name || !vals.contact || !vals.phone){
    document.getElementById('areg-error').textContent = 'Farm name, contact person, and phone number are required.';
    return;
  }
  if(!pass || pass.length < 4){
    document.getElementById('areg-error').textContent = 'Set a password of at least 4 characters for this member.';
    return;
  }
  if(findMemberByLogin(vals.phone) || (vals.email && findMemberByLogin(vals.email))){
    flagError(document.getElementById('areg-error'), 'A farm is already registered with that phone number or email.');
    return;
  }
  const id = slugify(vals.name);
  MEMBERS[id] = Object.assign({}, vals, { password: pass, category: vals.category || 'Functional', registered: todayStr(), status:'Active', crops:[] });
  createBlankRecords(id);
  delete pendingLogos.areg;
  logAction(`Operator registered a new member directly: ${vals.name} (activated immediately).`);
  state.showAdminRegister = false;
  render();
}

function removeMember(id){
  const m = MEMBERS[id];
  const ok = (typeof confirm === 'function') ? confirm(`Remove ${m.name} from TIPFA? This deletes their profile, crop, harvest, and input records.`) : true;
  if(!ok) return;
  delete MEMBERS[id]; delete harvest[id]; delete inputsData[id];
  for(let i=complaints.length-1;i>=0;i--){ if(complaints[i].member===id) complaints.splice(i,1); }
  logAction(`Operator ${state.adminName||''} removed member: ${m.name}.`);
  if(state.memberPanel && state.memberPanel.id===id) state.memberPanel = null;
  render();
}

function renderBulkTable(ids){
  const set = state.bulkSet || 'harvestActual';
  const cols = set==='inputs' ? INPUTS : CROPS;
  const month = state.selMonth, week = state.selWeek;
  const header = `<tr><th>Farm</th>${cols.map(x=>`<th>${x}</th>`).join('')}</tr>`;
  const rows = ids.map(id=>{
    const cells = cols.map(col=>{
      let val;
      if(set==='harvestActual') val = harvest[id].actual[month][week][col];
      else if(set==='harvestPlan') val = harvest[id].plan[month][week][col];
      else val = inputsData[id][state.period][col];
      return `<td><input type="number" value="${val}" data-member="${id}" data-col="${col}" class="bulk-input"></td>`;
    }).join('');
    return `<tr><td>${MEMBERS[id].name}</td>${cells}</tr>`;
  }).join('');
  return `<table class="grid-table"><thead>${header}</thead><tbody>${rows}</tbody></table>`;

function saveBulk(){
  const set = state.bulkSet || 'harvestActual';
  const month = state.selMonth, week = state.selWeek;
  document.querySelectorAll('.bulk-input').forEach(inp=>{
    const id = inp.dataset.member, col = inp.dataset.col, val = Number(inp.value)||0;
    if(set==='harvestActual') harvest[id].actual[month][week][col]=val;
    else if(set==='harvestPlan') harvest[id].plan[month][week][col]=val;
    else inputsData[id][state.period][col]=val;
  });
  const when = set==='inputs' ? state.period : `${MONTHS[month-1]}, week ${week}`;
  logAction(`Operator saved bulk ${set==='harvestActual'?'actual harvest':set==='harvestPlan'?'harvest plan':'input requirement'} entries (${when}) for ${activeMembers().length} farms.`);
  document.getElementById('bulk-msg').textContent = 'Saved — central dashboard updated.';
  setTimeout(()=>{ const el=document.getElementById('bulk-msg'); if(el) el.textContent=''; },3000);
}

function memberMonthCropTotal(id, kind, month, crop){
  let t=0; for(let w=1; w<=4; w++){ t += (harvest[id][kind][month][w][crop]||0); } return t;
}
function memberMonthTotal(id, kind, month){
  let t=0; CROPS.forEach(cr=> t += memberMonthCropTotal(id, kind, month, cr)); return t;
}
function memberYearTotal(id, kind){
  let t=0; for(let m=1; m<=12; m++){ t += memberMonthTotal(id, kind, m); } return t;
}
function coopWeekTotal(kind, month, week){
  let t=0; activeMembers().forEach(id=> CROPS.forEach(cr=> t += (harvest[id][kind][month][week][cr]||0))); return t;
}
function coopMonthTotal(kind, month){
  let t=0; activeMembers().forEach(id=> t += memberMonthTotal(id, kind, month)); return t;
}
function coopYearTotal(kind){
  let t=0; activeMembers().forEach(id=> t += memberYearTotal(id, kind)); return t;
}
function coopCapacityByCrop(kind, month){
  return CROPS.map(cr=>{ let t=0; activeMembers().forEach(id=> t += memberMonthCropTotal(id, kind, month, cr)); return t; });
}
function coopWeekByCrop(kind, month, week){
  return CROPS.map(cr=>{ let t=0; activeMembers().forEach(id=> t += (harvest[id][kind][month][week][cr]||0)); return t; });
}
function pct(actual, plan){ return plan>0 ? Math.round(actual/plan*100) : (actual>0 ? 100 : 0); }

function comparisonBar(label, plan, actual){
  const p = pct(actual, plan);
  const barColor = p>=95 ? 'var(--leaf)' : (p>=70 ? 'var(--gold)' : 'var(--red)');
  return `<div style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;">
      <span>${label}</span><span>${fmt(actual)} / ${fmt(plan)} kg · ${p}% of plan</span>
    </div>
    <div style="height:10px;background:#E4E2D4;border-radius:99px;overflow:hidden;">
      <div class="bar-fill" style="height:100%;width:${Math.min(p,100)}%;background:${barColor};border-radius:99px;
        animation:barGrow .95s var(--ease-out) both;"></div>
    </div>
  </div>`;
}

function selectMonth(m){ state.selMonth = m; render(); }
function selectWeek(w){ state.selWeek = w; render(); }

      <div class="card"><strong>Input requirement report</strong><p class="helper">Totals and per-farm breakdown.</p><button class="btn small" onclick="exportCoopInputs()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Member activity report</strong><p class="helper">Functional vs. non-functional members.</p><button class="btn small" onclick="exportMemberActivity()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Issue resolution report</strong><p class="helper">All complaints/requests and status.</p><button class="btn small" onclick="exportIssues()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Market standards compliance</strong><p class="helper">HACCP baseline + additional certifications, by farm and crop.</p><button class="btn small" onclick="exportMarketStandards()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Market price research summary</strong><p class="helper">All logged buyer prices, by farm and crop.</p><button class="btn small" onclick="exportMarketPrices()">Export CSV (Excel)</button></div>
    </div>
    <div class="card"><strong>Print or save this page as PDF</strong><p class="helper">For stakeholder meetings — opens your browser's print dialog; choose "Save as PDF".</p>
      <button class="btn small gold" onclick="window.print()">Print / Save as PDF</button></div>`;
}
function exportMarketStandards(){
  const rows=[['Farm','Crop','Baseline standard','Additional standard','Notes']];
  activeMembers().forEach(id=>{
    const m = MEMBERS[id];
    m.crops.forEach(cr=>{
      const extras = m.marketStandards.filter(s=>s.crop===cr.crop);
      if(extras.length){ extras.forEach(s=> rows.push([m.name, cr.crop, 'HACCP', s.standard, s.notes||''])); }
      else { rows.push([m.name, cr.crop, 'HACCP', '—', '']); }
    });
  });
  downloadCSV('TIPFA_market_standards_compliance.csv', rows); logAction('Operator exported market standards compliance report.');
}
function exportMarketPrices(){
  const rows=[['Farm','Crop','Buyer','Price (TZS/kg)','Date']];
  activeMembers().forEach(id=> MEMBERS[id].marketPrices.forEach(p=> rows.push([MEMBERS[id].name, p.crop, p.buyer, p.price, p.date])));
  downloadCSV('TIPFA_market_price_research.csv', rows); logAction('Operator exported market price research summary.');
}
function exportCoopHarvest(){
  const month = state.selMonth, week = state.selWeek;
  const rows=[['Farm','Crop','Week '+week+' plan','Week '+week+' actual','Monthly plan','Monthly actual','Annual plan','Annual actual']];
  activeMembers().forEach(id=> CROPS.forEach(cr=>{
    const wp = harvest[id].plan[month][week][cr]||0, wa = harvest[id].actual[month][week][cr]||0;
    const mp = memberMonthCropTotal(id,'plan',month,cr), ma = memberMonthCropTotal(id,'actual',month,cr);
    let yp=0, ya=0; for(let mo=1;mo<=12;mo++){ yp+=memberMonthCropTotal(id,'plan',mo,cr); ya+=memberMonthCropTotal(id,'actual',mo,cr); }
    rows.push([MEMBERS[id].name, cr, wp, wa, mp, ma, yp, ya]);
  }));
  downloadCSV(`TIPFA_association_harvest_plan_${MONTHS[month-1]}_wk${week}.csv`, rows); logAction('Operator exported the association harvest plan report.');
}
function exportActualHarvest(){
  const month = state.selMonth;
  const rows=[['Farm','Crop','Monthly actual (kg)','Annual actual (kg)']];
  activeMembers().forEach(id=> CROPS.forEach(cr=>{
    let ya=0; for(let mo=1;mo<=12;mo++){ ya+=memberMonthCropTotal(id,'actual',mo,cr); }
    rows.push([MEMBERS[id].name, cr, memberMonthCropTotal(id,'actual',month,cr), ya]);
  }));
  downloadCSV(`TIPFA_actual_harvest_${MONTHS[month-1]}.csv`, rows); logAction('Operator exported actual harvest report.');
}
function exportCoopInputs(){
  const rows=[['Farm','Input','Quantity']];
  activeMembers().forEach(id=> INPUTS.forEach(i=> rows.push([MEMBERS[id].name, i, inputsData[id][state.period][i]])));
  downloadCSV(`TIPFA_input_requirements_${state.period}.csv`, rows); logAction('Operator exported input requirement report.');
}
function exportMemberActivity(){
  const rows=[['Farm','Category','Status']];
  Object.values(MEMBERS).forEach(m=> rows.push([m.name, m.category, m.status]));
  downloadCSV(`TIPFA_member_activity.csv`, rows); logAction('Operator exported member activity report.');
}
function exportIssues(){
  const rows=[['Farm','Type','Message','Status','Assignee']];
  complaints.forEach(x=> rows.push([MEMBERS[x.member] ? MEMBERS[x.member].name : 'Removed farm', x.type, x.text, x.status, x.assignee]));
  downloadCSV(`TIPFA_issue_resolution.csv`, rows); logAction('Operator exported issue resolution report.');
}

function renderGovernance(c){
  c.innerHTML = `
    <h1 class="page-title">Governance</h1>
    <p class="page-sub">Oversight, compliance, and transparency</p>
    <div class="card">
      <p style="font-size:13.5px;line-height:1.6;margin:0 0 10px;">Every member has an individual, secure login; data is editable only by its owner or an authorised operator. Association-wide figures are visible only in aggregate, and every operator-entered record is logged with a name and timestamp below for auditability and compliance with the TIPFA constitution.</p>
    </div>
    <div class="section-label">Administrator accounts (${ADMINS.length}/${MAX_ADMINS})</div>
    <div class="card">
      <table class="grid-table"><thead><tr><th>Name</th><th>Operator ID / email</th><th></th></tr></thead>
      <tbody>${ADMINS.map((a,i)=>`<tr><td>${a.name}</td><td>${a.username}</td><td><button class="btn small ghost" style="color:var(--red);border-color:var(--red);" onclick="removeAdmin(${i})">Remove</button></td></tr>`).join('')}</tbody></table>
      ${ADMINS.length < MAX_ADMINS ? `
        <div class="section-label" style="margin-top:16px;">Add administrator</div>
        <div class="grid2">
          <div><label class="f">Full name</label><input id="newadmin-name"></div>
          <div><label class="f">Operator ID / email</label><input id="newadmin-user"></div>
        </div>
        <label class="f">Password</label>${pwdField('newadmin-pass','Set a password')}
        <button class="btn small" style="margin-top:6px;" onclick="addAdmin()">Add administrator</button>
        <p class="helper" id="newadmin-error" style="color:var(--red);margin-top:8px;"></p>
      ` : `<p class="helper" style="color:var(--soil);margin-top:10px;">Maximum of ${MAX_ADMINS} administrator accounts reached. Remove one above to free a seat.</p>`}
      <p class="helper" style="margin-top:12px;">Operators can also create their own account from the Administrator tab of the sign-in screen${ADMIN_SIGNUP_CODE ? ` by quoting the Secretariat sign-up code (<strong>${ADMIN_SIGNUP_CODE}</strong>)` : ''}. Self sign-ups appear in this list and are recorded in the audit log below.</p>
    </div>
    <div class="section-label">Audit log</div>
    <div class="card">${auditLog.slice(0,12).map((l,i)=>
      `<div class="log-item" style="animation-delay:${Math.min(i,10)*40}ms"><span class="t">${l.time}</span><span>${esc(l.text)}</span></div>`
    ).join('')}</div>`;
}
function addAdmin(){
  if(ADMINS.length >= MAX_ADMINS) return;
  const name = document.getElementById('newadmin-name').value.trim();
  const user = document.getElementById('newadmin-user').value.trim();
  const pass = document.getElementById('newadmin-pass').value;
  if(!name || !user || !pass){
    document.getElementById('newadmin-error').textContent = 'Enter a name, operator ID, and password.';
    return;
  }
  if(ADMINS.some(a=>norm(a.username)===norm(user))){
    document.getElementById('newadmin-error').textContent = 'That operator ID is already in use.';
    return;
  }
  ADMINS.push({name, username:user, password:pass});
  saveAdmins();
  logAction(`Operator ${state.adminName||''} added a new administrator account: ${name}.`);
  render();
}
function removeAdmin(i){
  const removed = ADMINS[i];
  if(ADMINS.length <= 1){
    logAction(`Operator ${state.adminName||''} attempted to remove the last administrator account — blocked.`);
    render();
    return;
  }
  ADMINS.splice(i,1);
  saveAdmins();
  logAction(`Operator ${state.adminName||''} removed administrator account: ${removed.name}.`);
  render();
}

loadMembers();
render();
</script>
</body>
</html>
