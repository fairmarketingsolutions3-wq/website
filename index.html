<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TIPFA Association Platform — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --ink:#23301E; --paper:#EEF1E2; --leaf:#35633A; --leaf-dark:#1C331F;
  --gold:#D69A2D; --soil:#A85C3F; --teal:#2F7A82; --red:#B23A2E;
  --card:#FFFFFF; --line:#D8D9C8; --muted:#6B7263; --radius:12px;
  --role-accent:#35633A; --role-accent-dark:#1C331F;
}
body[data-role="member"]{ --role-accent:#C1622E; --role-accent-dark:#8F4620; }
body[data-role="admin"]{ --role-accent:#2B5D8C; --role-accent-dark:#1F3F60; }
*{box-sizing:border-box;}
body{margin:0;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--paper);}
.app{max-width:1180px;margin:0 auto;}
.topbar{
  background:var(--leaf); color:#F2F6EA;
  padding:16px 22px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:12px;
}
.brandblock .brand{font-family:'Fraunces',serif;font-weight:600;font-size:21px;}
.brandblock .tagline{font-size:11.5px;opacity:.85;font-style:italic;margin-top:1px;}
.roleswitch{display:flex;background:rgba(255,255,255,0.14);border-radius:999px;padding:3px;}
.roleswitch button{
  border:none;background:none;color:#F2F6EA;font-family:'IBM Plex Sans';
  font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer;
}
.roleswitch button.active{background:#F2F6EA;color:var(--leaf-dark);font-weight:600;}
.session{display:flex;align-items:center;gap:10px;color:#F2F6EA;font-size:12.5px;}
.session .who{font-weight:600;}
.session button{
  border:1.5px solid rgba(242,246,234,0.6);background:none;color:#F2F6EA;
  font-family:'IBM Plex Sans';font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;cursor:pointer;
}
.loginwrap{display:flex;justify-content:center;padding:48px 20px;min-height:520px;}
.loginbox{width:100%;max-width:380px;}
.logintabs{display:flex;background:#E4E8D5;border-radius:999px;padding:3px;margin-bottom:20px;}
.logintabs button{
  flex:1;border:none;background:none;font-family:'IBM Plex Sans';font-size:13px;font-weight:500;
  color:var(--muted);padding:9px 0;border-radius:999px;cursor:pointer;
}
.logintabs button.active{background:var(--leaf);color:#fff;font-weight:600;}
.login-note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;text-align:center;}
.lock-icon{text-align:center;font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--leaf-dark);margin-bottom:6px;}
.subbar{
  display:flex;align-items:center;gap:10px;padding:10px 22px;background:#E4E8D5;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.subbar label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
.subbar select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-family:'IBM Plex Sans';background:#fff;}
.layout{display:grid;grid-template-columns:200px 1fr;gap:0;min-height:520px;}
.sidebar{
  border-right:1px solid var(--line); padding:16px 10px; display:flex; flex-direction:column; gap:2px;
}
.tabbtn{
  text-align:left; border:none;background:none;padding:10px 12px;border-radius:9px;
  font-family:'IBM Plex Sans';font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;
}
.tabbtn.active{background:var(--card);color:var(--role-accent-dark);font-weight:600;box-shadow:inset 3px 0 0 var(--role-accent);}
.content{padding:20px 24px 40px;}
h1.page-title{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0 0 4px;}
p.page-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
label.f{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
input, select, textarea{
  width:100%;font-family:'IBM Plex Sans';font-size:13.5px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:#FBFCF8;color:var(--ink);margin-bottom:10px;
}
input:focus, select:focus, textarea:focus{outline:2px solid var(--leaf);outline-offset:1px;}
.btn{
  padding:10px 16px;border:none;border-radius:9px;background:var(--role-accent);color:#fff;
  font-family:'IBM Plex Sans';font-weight:600;font-size:13.5px;cursor:pointer;
}
.btn:active{background:var(--role-accent-dark);}
.btn.ghost{background:transparent;border:1.5px solid var(--role-accent);color:var(--role-accent);}
.btn.small{padding:7px 12px;font-size:12.5px;}
.btn.gold{background:var(--gold);}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
.metric .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.metric .val{font-family:'IBM Plex Mono';font-size:21px;font-weight:500;margin-top:3px;}
.section-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px;color:var(--ink);}
table.grid-table{width:100%;border-collapse:collapse;font-size:13px;}
table.grid-table th{
  background:var(--leaf);color:#fff;text-align:left;padding:8px 10px;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.3px;font-weight:600;
}
table.grid-table td{padding:7px 10px;border-bottom:1px solid var(--line);}
table.grid-table tr:nth-child(even) td{background:#F7F8F0;}
table.grid-table input{margin:0;padding:6px 7px;font-size:12.5px;font-family:'IBM Plex Mono';}
.status-pill{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:99px;display:inline-block;}
.status-open{background:#FBE7D7;color:var(--soil);}
.status-progress{background:#FDF1D2;color:#9A6C0B;}
.status-resolved{background:#DCEBDD;color:var(--leaf-dark);}
.status-active{background:#DCEBDD;color:var(--leaf-dark);}
.status-pending{background:#FDF1D2;color:#9A6C0B;}
.status-rejected{background:#FBE0DD;color:var(--red);}
.chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;color:var(--muted);}
.chip.active{background:var(--role-accent);border-color:var(--role-accent);color:#fff;font-weight:600;}
.msg-banner{background:#DCEBDD;color:var(--leaf-dark);padding:9px 14px;border-radius:8px;font-size:12.5px;margin-bottom:12px;font-weight:500;}
.helper{font-size:11.5px;color:var(--muted);margin-top:-4px;}
.log-item{font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono';}
@media print{
  .topbar, .subbar, .sidebar, .btn, .chips, input[type="file"]{ display:none !important; }
  .app{ max-width:100%; }
  .content{ padding:0; }
  .card{ break-inside:avoid; border:1px solid #999; }
  body{ background:#fff; }
}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;}
  .sidebar{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:10px;}
  .tabbtn{white-space:nowrap;}
  .tabbtn.active{box-shadow:inset 0 -3px 0 var(--leaf);}
  .grid2, .grid3, .grid4{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brandblock">
      <div class="brand">TIPFA</div>
      <div class="tagline">Growing Together. Harvesting Excellence.</div>
    </div>
    <div id="topbarRight"></div>
  </div>

  <div id="loginScreen"></div>

  <div id="appScreen" style="display:none;">
    <div class="subbar" id="subbar"></div>
    <div class="layout">
      <div class="sidebar" id="sidebar"></div>
      <div class="content" id="content"></div>
    </div>
  </div>

</div>

<script>
const CROPS = ['Tomatoes','Cucumbers','Melons','Capsicum Red','Capsicum Yellow','Cherry Tomatoes'];
let INPUTS = ['Seeds','Fertiliser','Greenhouse Supplies','Water'];
const PERIODS = ['weekly','monthly','annual'];
const PRICE_BASE = {Tomatoes:1200, Cucumbers:900, Melons:1500, 'Capsicum Red':2200, 'Capsicum Yellow':2100, 'Cherry Tomatoes':3000};
const INVEST_CATEGORIES = ['Seeds','Labour','Infrastructure','Other'];
const CROP_STAGES = ['Sowing','Transplanting','Flowering','Harvesting'];
const MARKET_STANDARD_OPTIONS = ['GlobalG.A.P.','Organic','Fair Trade','Other'];

const MEMBERS = {
  she: {name:'She Farms', contact:'Brenda Sandstrom', phone:'+255 754 000 111', email:'she.farms@tipfa.co.tz', password:'1234', location:'Iringa', category:'Functional', totalArea:2.5, indoorSqm:800, indoorUnits:3, outdoorArea:1.2, irrigation:'Drip', water:'Borehole', registered:'2026-07-08', status:'Active',
    crops:[{crop:'Tomatoes',variety:'Anna F1',area:0.3,planted:'2026-05-01',expected:'2026-08-01'},{crop:'Melons',variety:'Sweet Gold',area:0.15,planted:'2026-06-05',expected:'2026-08-25'}]},
  fair: {name:'Fair Farms', contact:'Suleiman Farej', phone:'+255 754 000 222', email:'fair.farms@tipfa.co.tz', password:'1234', location:'Iringa', category:'Functional', totalArea:3.2, indoorSqm:1100, indoorUnits:4, outdoorArea:1.8, irrigation:'Drip', water:'Piped', registered:'2026-07-08', status:'Active',
    crops:[{crop:'Capsicum Red',variety:'Fair Miche',area:0.2,planted:'2026-05-20',expected:'2026-08-10'},{crop:'Capsicum Yellow',variety:'Fair Miche',area:0.2,planted:'2026-05-20',expected:'2026-08-10'}]},
  iringa: {name:'Iringa Agro Fresh', contact:'Borja Viton', phone:'+255 754 000 333', email:'iringa.fresh@tipfa.co.tz', password:'1234', location:'Iringa', category:'Functional', totalArea:4.0, indoorSqm:1400, indoorUnits:5, outdoorArea:2.0, irrigation:'Drip', water:'Borehole', registered:'2026-07-08', status:'Active',
    crops:[{crop:'Cherry Tomatoes',variety:'Sakura',area:0.1,planted:'2026-06-01',expected:'2026-08-20'},{crop:'Cucumbers',variety:'Marketmore',area:0.25,planted:'2026-05-15',expected:'2026-07-30'}]},
  nahdi: {name:'Nahdi Youth Farm', contact:'Agnes M. Mrilenjele', phone:'+255 754 000 444', email:'nahdi.youth@tipfa.co.tz', password:'1234', location:'Iringa', category:'Non-functional', totalArea:1.0, indoorSqm:300, indoorUnits:1, outdoorArea:0.5, irrigation:'Manual', water:'Rain-fed', registered:'2026-08-01', status:'Pending',
    crops:[]},
  pinerjo: {name:'Pinerjo Smart Farm', contact:'Leonard Mkongwa', phone:'+255 754 000 555', email:'pinerjo.smart@tipfa.co.tz', password:'1234', location:'Dodoma', category:'Honorable', totalArea:1.5, indoorSqm:500, indoorUnits:2, outdoorArea:0.7, irrigation:'Drip', water:'Borehole', registered:'2026-08-02', status:'Pending',
    crops:[]},
};

const DEFAULT_ADMINS = [
  {name:'Samson Abel Mwaikenda', username:'samsonabel627@gmail.com', password:'sam2026'},
  {name:'Amina Hassan', username:'amina.hassan@tipfa.co.tz', password:'Secretariat#1'},
  {name:'Joseph Mwakalinga', username:'joseph.mwakalinga@tipfa.co.tz', password:'Secretariat#2'},
];
const MAX_ADMINS = 5;
// Shared code an operator must quote to create their own administrator account
// from the sign-in screen. Set to '' to allow administrator sign-up without a code.
const ADMIN_SIGNUP_CODE = 'TIPFA2026';
const ADMIN_STORE_KEY = 'tipfa.admins.v1';

// Administrator accounts are kept in the browser so an account created here
// still works after a page reload. Falls back to memory only if storage is blocked.
let ADMINS = loadAdmins();
function loadAdmins(){
  try{
    const raw = localStorage.getItem(ADMIN_STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){ /* storage unavailable — fall through to defaults */ }
  return DEFAULT_ADMINS.map(a=>Object.assign({}, a));
}
function saveAdmins(){
  try{ localStorage.setItem(ADMIN_STORE_KEY, JSON.stringify(ADMINS)); }catch(e){ /* not persisted */ }
}
function norm(s){ return (s||'').toString().trim().toLowerCase().replace(/\s+/g,''); }

function blankPeriod(list, val){ const o={}; list.forEach(k=>o[k]=val); return o; }
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const CURRENT_MONTH = 8; // August 2026, matching today's date in-universe
const CURRENT_WEEK = 1;
const WEEK_FACTORS = [0.90, 0.97, 1.03, 0.92]; // deterministic actual-vs-plan ratios used to seed demo weeks

function blankMonthWeeks(){
  const months = {};
  for(let m=1;m<=12;m++){ months[m] = {1:blankPeriod(CROPS,0), 2:blankPeriod(CROPS,0), 3:blankPeriod(CROPS,0), 4:blankPeriod(CROPS,0)}; }
  return months;
}
const harvest = {}, inputsData = {};
Object.keys(MEMBERS).forEach(id=>{
  harvest[id] = { plan: blankMonthWeeks(), actual: blankMonthWeeks() };
  inputsData[id] = { weekly:blankPeriod(INPUTS,0), monthly:blankPeriod(INPUTS,0), annual:blankPeriod(INPUTS,0) };
});

function seedMonth(id, crop, month, planBase, weeksActual){
  weeksActual = weeksActual===undefined ? 4 : weeksActual;
  for(let w=1; w<=4; w++){
    harvest[id].plan[month][w][crop] = Math.round(planBase);
    harvest[id].actual[month][w][crop] = w<=weeksActual ? Math.round(planBase * WEEK_FACTORS[w-1]) : 0;
  }
}
// June and July: complete past months (plan + actual for all 4 weeks).
// August: current month — plan set for the whole month, actual only filled through week 1.
seedMonth('she','Tomatoes',6,180); seedMonth('she','Tomatoes',7,190); seedMonth('she','Tomatoes',8,200,CURRENT_WEEK);
seedMonth('she','Melons',6,55); seedMonth('she','Melons',7,60); seedMonth('she','Melons',8,70,CURRENT_WEEK);
seedMonth('fair','Capsicum Red',6,95); seedMonth('fair','Capsicum Red',7,100); seedMonth('fair','Capsicum Red',8,110,CURRENT_WEEK);
seedMonth('fair','Capsicum Yellow',6,80); seedMonth('fair','Capsicum Yellow',7,85); seedMonth('fair','Capsicum Yellow',8,90,CURRENT_WEEK);
seedMonth('iringa','Cherry Tomatoes',6,38); seedMonth('iringa','Cherry Tomatoes',7,42); seedMonth('iringa','Cherry Tomatoes',8,45,CURRENT_WEEK);
seedMonth('iringa','Cucumbers',6,90); seedMonth('iringa','Cucumbers',7,95); seedMonth('iringa','Cucumbers',8,100,CURRENT_WEEK);

inputsData.she.weekly={Seeds:4,Fertiliser:8,'Greenhouse Supplies':0,Water:180};
inputsData.fair.weekly={Seeds:6,Fertiliser:12,'Greenhouse Supplies':2,Water:220};
inputsData.iringa.weekly={Seeds:5,Fertiliser:9,'Greenhouse Supplies':1,Water:260};

// New modules: market standards, market prices, investment tracking, future planning, crop stages
function blankInvestments(){ return { weekly:blankPeriod(INVEST_CATEGORIES,0), monthly:blankPeriod(INVEST_CATEGORIES,0), annual:blankPeriod(INVEST_CATEGORIES,0) }; }
Object.keys(MEMBERS).forEach(id=>{
  MEMBERS[id].marketStandards = [];
  MEMBERS[id].marketPrices = [];
  MEMBERS[id].investments = blankInvestments();
  MEMBERS[id].futurePlan = { year1:'', year2:'', year3:'' };
});
Object.values(MEMBERS).forEach(m=> m.crops.forEach(cr=>{
  if(!cr.stage){ cr.stage = 'Harvesting'; cr.stageInputs = 'Routine harvesting labour, crates, transport'; }
}));
MEMBERS.she.marketStandards = [{crop:'Tomatoes', standard:'GlobalG.A.P.', notes:'Certification in progress, targeting Q4 2026'}];
MEMBERS.fair.marketStandards = [{crop:'Capsicum Red', standard:'Organic', notes:'Third season under organic management'}];
MEMBERS.she.marketPrices = [
  {crop:'Tomatoes', buyer:'Iringa Town Market', price:1180, date:'2026-07-28'},
  {crop:'Tomatoes', buyer:'Dodoma Wholesalers Ltd', price:1250, date:'2026-08-02'},
];
MEMBERS.fair.marketPrices = [
  {crop:'Capsicum Red', buyer:'Fair Miche Export', price:2300, date:'2026-08-01'},
];
MEMBERS.she.investments.monthly = {Seeds:180000, Labour:420000, Infrastructure:0, Other:35000};
MEMBERS.she.futurePlan = { year1:'Expand tomato greenhouse by one unit', year2:'Add drip irrigation to outdoor plot', year3:'Pursue GlobalG.A.P. certification for melons' };

const complaints = [
  {id:1, member:'iringa', type:'Request', text:'Greenhouse entrance porch budget approval', status:'progress', assignee:'Secretariat'},
  {id:2, member:'fair', type:'Request', text:'Rijk Zwaan pollination scheduling', status:'resolved', assignee:'Suleiman F.'},
  {id:3, member:'she', type:'Complaint', text:'Support choosing next crop variety', status:'open', assignee:'Unassigned'},
];
let nextComplaintId = 4;

const auditLog = [];
function logAction(text){ auditLog.unshift({time:new Date().toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'}), text}); }
logAction('System initialised — TIPFA Association Platform prototype loaded.');

const state = { role:null, tab:'profile', member:'she', period:'weekly', selMonth: CURRENT_MONTH, selWeek: CURRENT_WEEK, priceCrop:null, loggedIn:false, loginTab:'member', showRegister:false, showAdminRegister:false, regSuccess:false, memberPanel:null, adminName:null,
  adminSignup:false, adminSignupMsg:'', adminSignupUser:'' };

function fmt(n){ return Number(n).toLocaleString(); }

const EYE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/></svg>';

function pwdField(id, placeholder){
  return `<div style="position:relative;">
    <input id="${id}" type="password" placeholder="${placeholder||''}" style="padding-right:38px;">
    <button type="button" onclick="togglePwd('${id}', this)" aria-label="Show password"
      style="position:absolute;right:5px;top:6px;background:none;border:none;cursor:pointer;padding:5px;color:var(--muted);display:flex;">${EYE_ICON}</button>
  </div>`;
}
function togglePwd(id, btn){
  const el = document.getElementById(id);
  const showing = el.type === 'text';
  el.type = showing ? 'password' : 'text';
  btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function slugify(s){
  const base = s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'member';
  let id = base, i = 1;
  while(MEMBERS[id]){ id = base+'_'+i; i++; }
  return id;
}
function createBlankRecords(id){
  harvest[id] = { plan: blankMonthWeeks(), actual: blankMonthWeeks() };
  inputsData[id] = { weekly:blankPeriod(INPUTS,0), monthly:blankPeriod(INPUTS,0), annual:blankPeriod(INPUTS,0) };
  MEMBERS[id].marketStandards = [];
  MEMBERS[id].marketPrices = [];
  MEMBERS[id].investments = blankInvestments();
  MEMBERS[id].futurePlan = { year1:'', year2:'', year3:'' };
}

function profileFormFields(prefix, v, opts){
  v = v || {}; opts = opts || {};
  const catField = opts.showCategory ? `<div><label class="f">Member category</label><select id="${prefix}-category">
     <option value="Functional" ${v.category==='Functional'?'selected':''}>Functional</option>
     <option value="Non-functional" ${v.category==='Non-functional'?'selected':''}>Non-functional</option>
     <option value="Honorable" ${v.category==='Honorable'?'selected':''}>Honorable</option>
   </select></div>` : '';
  return `<div class="grid2">
    <div><label class="f">Farm name</label><input id="${prefix}-name" value="${v.name||''}"></div>
    <div><label class="f">Owner / principal contact person</label><input id="${prefix}-contact" value="${v.contact||''}"></div>
    <div><label class="f">Mobile / WhatsApp</label><input id="${prefix}-phone" value="${v.phone||''}"></div>
    <div><label class="f">Email address</label><input id="${prefix}-email" value="${v.email||''}"></div>
    <div><label class="f">Farm location</label><input id="${prefix}-location" value="${v.location||''}"></div>
    ${catField}
    <div><label class="f">Total farm area (ha)</label><input id="${prefix}-totalArea" type="number" step="0.1" value="${v.totalArea||''}"></div>
    <div><label class="f">Indoor production (m²)</label><input id="${prefix}-indoorSqm" type="number" value="${v.indoorSqm||''}"></div>
    <div><label class="f">Number of indoor units</label><input id="${prefix}-indoorUnits" type="number" value="${v.indoorUnits||''}"></div>
    <div><label class="f">Outdoor cultivated area (ha)</label><input id="${prefix}-outdoorArea" type="number" step="0.1" value="${v.outdoorArea||''}"></div>
    <div><label class="f">Irrigation system</label><input id="${prefix}-irrigation" value="${v.irrigation||''}"></div>
    <div><label class="f">Water source</label><input id="${prefix}-water" value="${v.water||''}"></div>
  </div>`;
}
function readProfileFields(prefix){
  const catEl = document.getElementById(`${prefix}-category`);
  return {
    name: document.getElementById(`${prefix}-name`).value.trim(),
    contact: document.getElementById(`${prefix}-contact`).value.trim(),
    phone: document.getElementById(`${prefix}-phone`).value.trim(),
    email: document.getElementById(`${prefix}-email`).value.trim(),
    location: document.getElementById(`${prefix}-location`).value.trim(),

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function doMemberLogin(){
  const identifier = norm(document.getElementById('login-id').value);
  const password = document.getElementById('login-password').value.trim();
  if(!identifier || !password){ document.getElementById('login-error').textContent = 'Enter your phone number/email and password.'; return; }
  const match = Object.entries(MEMBERS).find(([id,m]) =>
    m.status==='Active' && m.password===password && (norm(m.phone)===identifier || norm(m.email)===identifier));
  if(!match){ document.getElementById('login-error').textContent = 'No active account matches that phone/email and password.'; return; }
  const [id] = match;
  state.loggedIn = true; state.role = 'member'; state.member = id; state.tab = 'profile';
  document.body.setAttribute('data-role','member');
  logAction(`${MEMBERS[id].name} logged in.`);

}
function doAdminLogin(){
  const identifier = norm(document.getElementById('login-user').value);
  const password = document.getElementById('login-pass').value.trim();
  if(!identifier || !password){ document.getElementById('login-error-admin').textContent = 'Enter your operator ID and password.'; return; }
  const match = ADMINS.find(a => {
    const u = norm(a.username), local = u.split('@')[0];
    return (identifier===u || identifier===local) && a.password===password;
  });
  if(!match){ document.getElementById('login-error-admin').textContent = 'Invalid operator ID or password.'; return; }
  state.loggedIn = true; state.role = 'admin'; state.tab = 'members'; state.adminName = match.name;
  state.adminSignupMsg = ''; state.adminSignupUser = '';
  document.body.setAttribute('data-role','admin');
  logAction(`Operator ${match.name} logged in to the administrator console.`);
  render();
}

function submitAdminSignup(){
  const err = document.getElementById('asignup-error');
  const name = document.getElementById('asignup-name').value.trim();
  const user = document.getElementById('asignup-user').value.trim();
  const pass = document.getElementById('asignup-pass').value;
  const pass2 = document.getElementById('asignup-pass2').value;
  const codeEl = document.getElementById('asignup-code');
  if(!name || !user || !pass){
    err.textContent = 'Enter your full name, the operator ID you want, and a password.'; return;
  }
  if(ADMIN_SIGNUP_CODE && (codeEl.value.trim() !== ADMIN_SIGNUP_CODE)){
    err.textContent = 'That Secretariat sign-up code is not correct.'; return;
  }
  if(pass.length < 6){
    err.textContent = 'Choose a password of at least 6 characters.'; return;
  }
  if(pass !== pass2){
    err.textContent = 'Passwords do not match.'; return;
  }
  const u = norm(user), local = u.split('@')[0];
  if(ADMINS.some(a=>{ const au = norm(a.username); return au===u || au.split('@')[0]===local; })){
    err.textContent = 'That operator ID is already in use.'; return;
  }
  if(ADMINS.length >= MAX_ADMINS){
    err.textContent = `All ${MAX_ADMINS} administrator seats are taken — an existing operator must remove one first.`; return;
  }
  ADMINS.push({name, username:user, password:pass});
  saveAdmins();
  logAction(`${name} created their own administrator account (self sign-up) as operator ${user}.`);
  state.adminSignup = false;
  state.adminSignupUser = user;
  state.adminSignupMsg = 'Administrator account created — sign in below with your new operator ID and password.';
  renderLogin();
}

}

  const vals = readProfileFields('prof');

    document.getElementById('profile-msg').style.color = 'var(--red)';

  const preservedCategory = MEMBERS[state.member].category;
  Object.assign(MEMBERS[state.member], vals);

function addCrop(){
  const crop = document.getElementById('newcrop-crop').value;
  const variety = document.getElementById('newcrop-variety').value.trim();
  const area = Number(document.getElementById('newcrop-area').value)||0;
  const planted = document.getElementById('newcrop-planted').value;
  const expected = document.getElementById('newcrop-expected').value;
  if(!variety || !planted || !expected){
    document.getElementById('crop-msg').textContent = 'Enter variety, planting date, and expected harvest date.';
    document.getElementById('crop-msg').style.color = 'var(--red)';
    return;
  }
  MEMBERS[state.member].crops.push({crop,variety,area,planted,expected});
  logAction(`${MEMBERS[state.member].name} added a crop profile entry: ${crop} (${variety}).`);
  render();
}
function removeCrop(i){
  const m = MEMBERS[state.member];
  const removed = m.crops.splice(i,1)[0];

let priceChartRef = null;
function priceTrendData(crop, period){
  const base = PRICE_BASE[crop] || 1000;
  if(period==='weekly') return {labels:['Wk1','Wk2','Wk3','Wk4','Wk5','Wk6'], data:[0.95,1.0,1.02,0.98,1.04,1.06].map(mu=>Math.round(base*mu))};
  if(period==='monthly') return {labels:['Mar','Apr','May','Jun','Jul','Aug'], data:[0.9,0.95,1.0,1.03,1.05,1.08].map(mu=>Math.round(base*mu))};
  return {labels:['2024','2025','2026'], data:[0.88,0.97,1.05].map(mu=>Math.round(base*mu))};
}

function renderPlanVsActual(m){
  const id = state.member, month = state.selMonth, week = state.selWeek;

  CROPS.forEach(cr=>{ weekPlanTotal += (harvest[id].plan[month][week][cr]||0); weekActualTotal += (harvest[id].actual[month][week][cr]||0); });
  const monthPlanTotal = memberMonthTotal(id,'plan',month), monthActualTotal = memberMonthTotal(id,'actual',month);
  const yearPlanTotal = memberYearTotal(id,'plan'), yearActualTotal = memberYearTotal(id,'actual');
  const rows = CROPS.map(cr=>{
    const p = memberMonthCropTotal(id,'plan',month,cr), a = memberMonthCropTotal(id,'actual',month,cr);
    if(p===0 && a===0) return '';
    return `<tr><td>${cr}</td><td>${fmt(p)}</td><td>${fmt(a)}</td><td>${pct(a,p)}%</td></tr>`;
  }).join('');
  return `<div class="section-label">Plan vs. actual — performance</div>
    <div class="card">
      ${comparisonBar('Week '+week+' of '+MONTHS[month-1], weekPlanTotal, weekActualTotal)}

function removeMember(id){
  const m = MEMBERS[id];
  const ok = (typeof confirm === 'function') ? confirm(`Remove ${m.name} from TIPFA? This deletes their profile, crop, harvest, and input records.`) : true;
  if(!ok) return;
  delete MEMBERS[id]; delete harvest[id]; delete inputsData[id];
  for(let i=complaints.length-1;i>=0;i--){ if(complaints[i].member===id) complaints.splice(i,1); }
  logAction(`Operator ${state.adminName||''} removed member: ${m.name}.`);
  if(state.memberPanel && state.memberPanel.id===id) state.memberPanel = null;
  render();
}

function renderBulkTable(ids){

  const header = `<tr><th>Farm</th>${cols.map(x=>`<th>${x}</th>`).join('')}</tr>`;

  }).join('');
  return `<table class="grid-table"><thead>${header}</thead><tbody>${rows}</tbody></table>`;
}
function saveBulk(){
  const set = state.bulkSet || 'harvestActual';
  const month = state.selMonth, week = state.selWeek;
  document.querySelectorAll('.bulk-input').forEach(inp=>{
    const id = inp.dataset.member, col = inp.dataset.col, val = Number(inp.value)||0;
    if(set==='harvestActual') harvest[id].actual[month][week][col]=val;
    else if(set==='harvestPlan') harvest[id].plan[month][week][col]=val;
    else inputsData[id][state.period][col]=val;
  });
  const when = set==='inputs' ? state.period : `${MONTHS[month-1]}, week ${week}`;
  logAction(`Operator saved bulk ${set==='harvestActual'?'actual harvest':set==='harvestPlan'?'harvest plan':'input requirement'} entries (${when}) for ${activeMembers().length} farms.`);
  document.getElementById('bulk-msg').textContent = 'Saved — cooperative dashboard updated.';
  setTimeout(()=>{ const el=document.getElementById('bulk-msg'); if(el) el.textContent=''; },3000);
}

function memberMonthCropTotal(id, kind, month, crop){
  let t=0; for(let w=1; w<=4; w++){ t += (harvest[id][kind][month][w][crop]||0); } return t;
}
function memberMonthTotal(id, kind, month){
  let t=0; CROPS.forEach(cr=> t += memberMonthCropTotal(id, kind, month, cr)); return t;
}
function memberYearTotal(id, kind){
  let t=0; for(let m=1; m<=12; m++){ t += memberMonthTotal(id, kind, m); } return t;
}
function coopWeekTotal(kind, month, week){
  let t=0; activeMembers().forEach(id=> CROPS.forEach(cr=> t += (harvest[id][kind][month][week][cr]||0))); return t;
}
function coopMonthTotal(kind, month){
  let t=0; activeMembers().forEach(id=> t += memberMonthTotal(id, kind, month)); return t;
}
function coopYearTotal(kind){
  let t=0; activeMembers().forEach(id=> t += memberYearTotal(id, kind)); return t;
}
function coopCapacityByCrop(kind, month){
  return CROPS.map(cr=>{ let t=0; activeMembers().forEach(id=> t += memberMonthCropTotal(id, kind, month, cr)); return t; });
}
function coopWeekByCrop(kind, month, week){
  return CROPS.map(cr=>{ let t=0; activeMembers().forEach(id=> t += (harvest[id][kind][month][week][cr]||0)); return t; });
}
function pct(actual, plan){ return plan>0 ? Math.round(actual/plan*100) : (actual>0 ? 100 : 0); }

function comparisonBar(label, plan, actual){
  const p = pct(actual, plan);
  const barColor = p>=95 ? 'var(--leaf)' : (p>=70 ? 'var(--gold)' : 'var(--red)');
  return `<div style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;">
      <span>${label}</span><span>${fmt(actual)} / ${fmt(plan)} kg · ${p}% of plan</span>
    </div>
    <div style="height:10px;background:#E4E7D6;border-radius:99px;overflow:hidden;">
      <div style="height:100%;width:${Math.min(p,100)}%;background:${barColor};"></div>
    </div>
  </div>`;
}

function selectMonth(m){ state.selMonth = m; render(); }
function selectWeek(w){ state.selWeek = w; render(); }
function monthWeekChips(){
  return `<div class="chips">${MONTHS.map((mName,i)=>`<span class="chip ${state.selMonth===i+1?'active':''}" onclick="selectMonth(${i+1})">${mName.slice(0,3)}</span>`).join('')}</div>
    <div class="chips">${[1,2,3,4].map(w=>`<span class="chip ${state.selWeek===w?'active':''}" onclick="selectWeek(${w})">Week ${w}</span>`).join('')}</div>`;
}

let capacityChartRef=null, trendChartRef=null, memberChartRef=null;

function renderDashboard(c){
  const month = state.selMonth, week = state.selWeek;
  const weekPlan = coopWeekTotal('plan', month, week), weekActual = coopWeekTotal('actual', month, week);
  const monthPlan = coopMonthTotal('plan', month), monthActual = coopMonthTotal('actual', month);
  const yearPlan = coopYearTotal('plan'), yearActual = coopYearTotal('actual');
  c.innerHTML = `
    <h1 class="page-title">Central dashboard</h1>
    <p class="page-sub">Live totals across all active member farms · ${activeMembers().length} / ${Object.keys(MEMBERS).length} reporting</p>
    ${monthWeekChips()}
    <div class="section-label">Weekly — Week ${week} of ${MONTHS[month-1]}</div>
    <div class="card">
      <div class="grid3">
        <div class="metric"><div class="lbl">Weekly plan</div><div class="val">${fmt(weekPlan)} kg</div></div>
        <div class="metric"><div class="lbl">Weekly actual</div><div class="val" style="color:var(--gold);">${fmt(weekActual)} kg</div></div>
        <div class="metric"><div class="lbl">Performance</div><div class="val" style="color:var(--teal);">${pct(weekActual,weekPlan)}%</div></div>
      </div>
      ${comparisonBar('Week '+week+' performance', weekPlan, weekActual)}
    </div>
    <div class="section-label">Monthly — ${MONTHS[month-1]}</div>
    <div class="card">
      <div class="grid3">
        <div class="metric"><div class="lbl">Monthly plan</div><div class="val">${fmt(monthPlan)} kg</div></div>
        <div class="metric"><div class="lbl">Monthly actual</div><div class="val" style="color:var(--gold);">${fmt(monthActual)} kg</div></div>
        <div class="metric"><div class="lbl">Performance</div><div class="val" style="color:var(--teal);">${pct(monthActual,monthPlan)}%</div></div>
      </div>
      ${comparisonBar(MONTHS[month-1]+' performance', monthPlan, monthActual)}
    </div>
    <div class="section-label">Annual — 2026</div>
    <div class="card">
      <div class="grid3">
        <div class="metric"><div class="lbl">Annual plan</div><div class="val">${fmt(yearPlan)} kg</div></div>
        <div class="metric"><div class="lbl">Annual actual</div><div class="val" style="color:var(--gold);">${fmt(yearActual)} kg</div></div>
        <div class="metric"><div class="lbl">Performance</div><div class="val" style="color:var(--teal);">${pct(yearActual,yearPlan)}%</div></div>
      </div>
      ${comparisonBar('Year-to-date performance', yearPlan, yearActual)}
    </div>
    <div class="section-label">Capacity by crop (${MONTHS[month-1]}, actual)</div>
    <div class="card"><div style="position:relative;height:200px;"><canvas id="capacityChart"></canvas></div></div>
    <div class="section-label">Weeks in ${MONTHS[month-1]}: plan vs. actual</div>
    <div class="card"><div style="position:relative;height:170px;"><canvas id="trendChart"></canvas></div></div>
    <p class="helper">Figures update automatically whenever a member saves an entry or an operator saves a bulk update.</p>`;
  drawCapacityChart(); drawTrendChart();
}

function drawCapacityChart(){
  const ctx = document.getElementById('capacityChart'); if(!ctx) return;
  if(capacityChartRef) capacityChartRef.destroy();
  capacityChartRef = new Chart(ctx, { type:'doughnut', data:{ labels:CROPS, datasets:[{ data:coopCapacityByCrop('actual', state.selMonth), backgroundColor:['#A85C3F','#35633A','#D69A2D','#2F7A82','#7A8C3A','#8C4E7A'], borderColor:'#FFFFFF', borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ family:'IBM Plex Sans', size:10.5 }, color:'#23301E' } } } } });
}
function drawTrendChart(){
  const ctx = document.getElementById('trendChart'); if(!ctx) return;
  if(trendChartRef) trendChartRef.destroy();
  const month = state.selMonth;
  const planWeeks = [1,2,3,4].map(w=>coopWeekTotal('plan',month,w));
  const actualWeeks = [1,2,3,4].map(w=>coopWeekTotal('actual',month,w));
  trendChartRef = new Chart(ctx, { type:'bar', data:{ labels:['Week 1','Week 2','Week 3','Week 4'],
    datasets:[
      { label:'Plan', data:planWeeks, backgroundColor:'#D8D9C8', borderRadius:4, maxBarThickness:26 },
      { label:'Actual', data:actualWeeks, backgroundColor:'#35633A', borderRadius:4, maxBarThickness:26 }
    ] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:10.5 } } } },
      scales:{ y:{ grid:{ color:'#E4E7D6' }, ticks:{ font:{ size:10 }, color:'#6B7263' } }, x:{ grid:{ display:false }, ticks:{ font:{ size:10 }, color:'#6B7263' } } } } });
}
function drawMemberTrendChart(){
  const ctx = document.getElementById('memberTrend'); if(!ctx) return;
  if(memberChartRef) memberChartRef.destroy();
  const m = state.member, month = state.selMonth;
  const planWeeks = [1,2,3,4].map(w=>{ let t=0; CROPS.forEach(cr=> t+=harvest[m].plan[month][w][cr]||0); return t; });
  const actualWeeks = [1,2,3,4].map(w=>{ let t=0; CROPS.forEach(cr=> t+=harvest[m].actual[month][w][cr]||0); return t; });
  memberChartRef = new Chart(ctx, { type:'bar', data:{ labels:['Week 1','Week 2','Week 3','Week 4'],
    datasets:[
      { label:'Plan', data:planWeeks, backgroundColor:'#D8D9C8', borderRadius:4, maxBarThickness:26 },
      { label:'Actual', data:actualWeeks, backgroundColor:'#2F7A82', borderRadius:4, maxBarThickness:26 }
    ] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:10.5 } } } },
      scales:{ y:{ grid:{ color:'#E4E7D6' }, ticks:{ font:{ size:10 } } }, x:{ grid:{ display:false }, ticks:{ font:{ size:9.5 } } } } } });
}

function renderGrowth(c){
  const totals = INPUTS.map(i=>{ let t=0; activeMembers().forEach(id=> t += (inputsData[id][state.period][i]||0)); return t; });
  const rows = INPUTS.map((i,idx)=>`<tr><td>${i}</td><td>${fmt(totals[idx])}</td></tr>`).join('');
  const ytd = coopYearTotal('actual') || 31900;
  c.innerHTML = `
    <h1 class="page-title">Growth planning</h1>
    <p class="page-sub">Cooperative-wide input needs and expansion outlook</p>
    ${periodChips()}
    <div class="section-label">Input needs (${state.period}, all active farms)</div>
    <div class="card"><table class="grid-table"><thead><tr><th>Input</th><th>Total requested</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="section-label">Expansion outlook</div>
    <div class="card"><p style="font-size:13.5px;line-height:1.6;margin:0;">At current pace, association-wide capacity is projected to reach approximately <strong>${fmt(Math.round(ytd*1.44))} kg/year</strong> by 2027 — a 44% increase — if input needs above are met on schedule and pending members are onboarded.</p></div>`;
}

function renderReportsAdmin(c){
  c.innerHTML = `
    <h1 class="page-title">Reports</h1>
    <p class="page-sub">Cooperative-wide exports for buyers, financiers, and government partners</p>
    ${monthWeekChips()}
    <div class="grid2">
      <div class="card"><strong>Cooperative harvest plan report</strong><p class="helper">All farms, weekly/monthly/annual plan vs. actual.</p><button class="btn small" onclick="exportCoopHarvest()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Actual harvest report</strong><p class="helper">Farm-level and cooperative-level totals.</p><button class="btn small" onclick="exportActualHarvest()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Input requirement report</strong><p class="helper">Totals and per-farm breakdown.</p><button class="btn small" onclick="exportCoopInputs()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Member activity report</strong><p class="helper">Functional vs. non-functional members.</p><button class="btn small" onclick="exportMemberActivity()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Issue resolution report</strong><p class="helper">All complaints/requests and status.</p><button class="btn small" onclick="exportIssues()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Market standards compliance</strong><p class="helper">HACCP baseline + additional certifications, by farm and crop.</p><button class="btn small" onclick="exportMarketStandards()">Export CSV (Excel)</button></div>
      <div class="card"><strong>Market price research summary</strong><p class="helper">All logged buyer prices, by farm and crop.</p><button class="btn small" onclick="exportMarketPrices()">Export CSV (Excel)</button></div>
    </div>
    <div class="card"><strong>Print or save this page as PDF</strong><p class="helper">For stakeholder meetings — opens your browser's print dialog; choose "Save as PDF".</p>
      <button class="btn small gold" onclick="window.print()">Print / Save as PDF</button></div>`;
}
function exportMarketStandards(){
  const rows=[['Farm','Crop','Baseline standard','Additional standard','Notes']];
  activeMembers().forEach(id=>{
    const m = MEMBERS[id];
    m.crops.forEach(cr=>{
      const extras = m.marketStandards.filter(s=>s.crop===cr.crop);
      if(extras.length){ extras.forEach(s=> rows.push([m.name, cr.crop, 'HACCP', s.standard, s.notes||''])); }
      else { rows.push([m.name, cr.crop, 'HACCP', '—', '']); }
    });
  });
  downloadCSV('TIPFA_market_standards_compliance.csv', rows); logAction('Operator exported market standards compliance report.');
}
function exportMarketPrices(){
  const rows=[['Farm','Crop','Buyer','Price (TZS/kg)','Date']];
  activeMembers().forEach(id=> MEMBERS[id].marketPrices.forEach(p=> rows.push([MEMBERS[id].name, p.crop, p.buyer, p.price, p.date])));
  downloadCSV('TIPFA_market_price_research.csv', rows); logAction('Operator exported market price research summary.');
}
function exportCoopHarvest(){
  const month = state.selMonth, week = state.selWeek;
  const rows=[['Farm','Crop','Week '+week+' plan','Week '+week+' actual','Monthly plan','Monthly actual','Annual plan','Annual actual']];
  activeMembers().forEach(id=> CROPS.forEach(cr=>{
    const wp = harvest[id].plan[month][week][cr]||0, wa = harvest[id].actual[month][week][cr]||0;
    const mp = memberMonthCropTotal(id,'plan',month,cr), ma = memberMonthCropTotal(id,'actual',month,cr);
    let yp=0, ya=0; for(let mo=1;mo<=12;mo++){ yp+=memberMonthCropTotal(id,'plan',mo,cr); ya+=memberMonthCropTotal(id,'actual',mo,cr); }
    rows.push([MEMBERS[id].name, cr, wp, wa, mp, ma, yp, ya]);
  }));
  downloadCSV(`TIPFA_cooperative_harvest_plan_${MONTHS[month-1]}_wk${week}.csv`, rows); logAction('Operator exported cooperative harvest plan report.');
}
function exportActualHarvest(){
  const month = state.selMonth;
  const rows=[['Farm','Crop','Monthly actual (kg)','Annual actual (kg)']];
  activeMembers().forEach(id=> CROPS.forEach(cr=>{
    let ya=0; for(let mo=1;mo<=12;mo++){ ya+=memberMonthCropTotal(id,'actual',mo,cr); }
    rows.push([MEMBERS[id].name, cr, memberMonthCropTotal(id,'actual',month,cr), ya]);
  }));
  downloadCSV(`TIPFA_actual_harvest_${MONTHS[month-1]}.csv`, rows); logAction('Operator exported actual harvest report.');
}
function exportCoopInputs(){
  const rows=[['Farm','Input','Quantity']];
  activeMembers().forEach(id=> INPUTS.forEach(i=> rows.push([MEMBERS[id].name, i, inputsData[id][state.period][i]])));
  downloadCSV(`TIPFA_input_requirements_${state.period}.csv`, rows); logAction('Operator exported input requirement report.');
}
function exportMemberActivity(){
  const rows=[['Farm','Category','Status']];
  Object.values(MEMBERS).forEach(m=> rows.push([m.name, m.category, m.status]));
  downloadCSV(`TIPFA_member_activity.csv`, rows); logAction('Operator exported member activity report.');
}
function exportIssues(){
  const rows=[['Farm','Type','Message','Status','Assignee']];
  complaints.forEach(x=> rows.push([MEMBERS[x.member].name, x.type, x.text, x.status, x.assignee]));
  downloadCSV(`TIPFA_issue_resolution.csv`, rows); logAction('Operator exported issue resolution report.');
}

function renderGovernance(c){
  c.innerHTML = `
    <h1 class="page-title">Governance</h1>
    <p class="page-sub">Oversight, compliance, and transparency</p>
    <div class="card">
      <p style="font-size:13.5px;line-height:1.6;margin:0 0 10px;">Every member has an individual, secure login; data is editable only by its owner or an authorised operator. Association-wide figures are visible only in aggregate, and every operator-entered record is logged with a name and timestamp below for auditability and compliance with the TIPFA constitution.</p>
    </div>
    <div class="section-label">Administrator accounts (${ADMINS.length}/${MAX_ADMINS})</div>
    <div class="card">
      <table class="grid-table"><thead><tr><th>Name</th><th>Operator ID / email</th><th></th></tr></thead>
      <tbody>${ADMINS.map((a,i)=>`<tr><td>${a.name}</td><td>${a.username}</td><td><button class="btn small ghost" style="color:var(--red);border-color:var(--red);" onclick="removeAdmin(${i})">Remove</button></td></tr>`).join('')}</tbody></table>
      ${ADMINS.length < MAX_ADMINS ? `
        <div class="section-label" style="margin-top:16px;">Add administrator</div>
        <div class="grid2">
          <div><label class="f">Full name</label><input id="newadmin-name"></div>
          <div><label class="f">Operator ID / email</label><input id="newadmin-user"></div>
        </div>
        <label class="f">Password</label>${pwdField('newadmin-pass','Set a password')}
        <button class="btn small" style="margin-top:6px;" onclick="addAdmin()">Add administrator</button>
        <p class="helper" id="newadmin-error" style="color:var(--red);margin-top:8px;"></p>
      ` : `<p class="helper" style="color:var(--soil);margin-top:10px;">Maximum of ${MAX_ADMINS} administrator accounts reached. Remove one above to free a seat.</p>`}
      <p class="helper" style="margin-top:12px;">Operators can also create their own account from the Administrator tab of the sign-in screen${ADMIN_SIGNUP_CODE ? ` by quoting the Secretariat sign-up code (<strong>${ADMIN_SIGNUP_CODE}</strong>)` : ''}. Self sign-ups appear in this list and are recorded in the audit log below.</p>
    </div>
    <div class="section-label">Audit log</div>
    <div class="card">${auditLog.slice(0,12).map(l=>`<div class="log-item">${l.time} — ${l.text}</div>`).join('')}</div>`;
}
function addAdmin(){
  if(ADMINS.length >= MAX_ADMINS) return;
  const name = document.getElementById('newadmin-name').value.trim();
  const user = document.getElementById('newadmin-user').value.trim();
  const pass = document.getElementById('newadmin-pass').value;
  if(!name || !user || !pass){
    document.getElementById('newadmin-error').textContent = 'Enter a name, operator ID, and password.';
    return;
  }
  if(ADMINS.some(a=>norm(a.username)===norm(user))){
    document.getElementById('newadmin-error').textContent = 'That operator ID is already in use.';
    return;
  }
  ADMINS.push({name, username:user, password:pass});
  saveAdmins();
  logAction(`Operator ${state.adminName||''} added a new administrator account: ${name}.`);
  render();
}
function removeAdmin(i){
  const removed = ADMINS[i];
  if(ADMINS.length <= 1){
    logAction(`Operator ${state.adminName||''} attempted to remove the last administrator account — blocked.`);
    render();
    return;
  }
  ADMINS.splice(i,1);
  saveAdmins();
  logAction(`Operator ${state.adminName||''} removed administrator account: ${removed.name}.`);
  render();
}

render();
</script>
</body>
</html>
