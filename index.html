  if(!user){ flagError(err, 'Enter your operator ID.'); return; }
  if(adminCode() && code !== adminCode()){ flagError(err, 'That Secretariat code is not correct.'); return; }
  if(!pass || pass.length < 6){ flagError(err, 'Choose a new password of at least 6 characters.'); return; }
  if(pass !== pass2){ flagError(err, 'The two passwords do not match.'); return; }
  const match = ADMINS.find(a=>{ const u = norm(a.username); return u===user || u.split('@')[0]===user; });
  if(!match){ flagError(err, 'No administrator account uses that operator ID.'); return; }
  match.password = pass;
  saveAdmins();
  logAction(`Administrator password reset from the sign-in screen for operator ${match.name}.`);
  state.forgot = null; state.adminSignupMsg = '';
  state.adminSignupUser = match.username;
  state.forgotMsg = 'Password updated. Sign in with your new password.';
  renderLogin();
}

/* ============================================================
   Connection check
   Reachable from the sign-in screen, because the most likely time to
   need it is when nobody can sign in. Each step reports what actually
   happened, including the raw error, so a problem can be described
   rather than guessed at.
   ============================================================ */
function showDiagnostics(v){ state.diagnostics = v; state.diagLines = state.diagLines || []; renderLogin(); }

async function runConnectionCheck(){
  const out = [];
  const push = (label, ok, detail)=>{
    out.push({label, ok, detail: detail||''});
    state.diagLines = out;
    renderLogin();
  };

  const cfg = window.TIPFA_FIREBASE_CONFIG;
  push('Project settings loaded', !!(cfg && cfg.projectId), cfg && cfg.projectId ? `project ${cfg.projectId}` : 'firebase-config.js did not load — the page may be a cached older copy. Hard-refresh with Ctrl+Shift+R.');
  if(!cfg || !cfg.projectId) return;

  let sdk = null;
  try{
    sdk = await import(CLOUD_SDK + 'firebase-app.js');
    push('Firebase software downloaded', true, 'loaded from Google');
  }catch(e){
    push('Firebase software downloaded', false, 'Could not download it: ' + (e.message||e) + '. Usually no internet, or a network that blocks Google.');
    return;
  }

  let db = null, auth = null;
  try{
    const fs = await import(CLOUD_SDK + 'firebase-firestore.js');
    const au = await import(CLOUD_SDK + 'firebase-auth.js');
    const app = sdk.initializeApp(cfg, 'diagnostic-' + Date.now());
    db = fs.getFirestore(app);
    auth = au.getAuth(app);
    push('Connected to the project', true, cfg.projectId);
    try{
      // Rules refuse this read when nobody is signed in. Being refused is the
      // good answer: it proves the database exists and the rules are live.
      // The id must not match Firestore's reserved __...__ pattern, or the SDK
      // rejects it locally with invalid-argument and never reaches the server.
      await fs.getDoc(fs.doc(db, 'farms', 'connection-check'));
      push('Database answering', true, 'reachable, and it allowed the check');
    }catch(e){
      const msg = String(e && (e.code || e.message) || e);
      if(/permission|insufficient/i.test(msg)){
        push('Database answering', true, 'reachable — it refused an unauthenticated read, which is correct and means the rules are published');
      } else if(/not-found|does not exist|Firestore.*database/i.test(msg)){
        push('Database answering', false, 'The project has no Firestore database yet. Create it: Build → Firestore Database → Create database.');
      } else if(/invalid-argument/i.test(msg)){
        push('Database answering', false, 'The check itself sent something the database would not accept (' + msg + '). This is a fault in the check, not in your project — report it.');
      } else {
        push('Database answering', false, msg);
      }
    }
    // Both of these documents are deliberately never created. What is being
    // checked is whether the rules let them be read, which answers two
    // questions that a refused sign-up otherwise cannot tell apart.
    const readable = async id => {
      try{ await fs.getDoc(fs.doc(db, 'diagnostics', id)); return true; }
      catch(_){ return false; }
    };
    const published = await readable('rules-published');
    push('Sign-up rules published', published, published
      ? 'the platform rules are live on this project'
      : 'The project is still running Firebase\u2019s own default rules. Open Firestore Database \u2192 Rules, replace everything with firestore.rules from the site\u2019s code, and press Publish.');
    if(published){
      const haveCodes = await readable('codes-present');
      push('Sign-up codes document found', haveCodes, haveCodes
        ? 'settings/signup exists — its codes stay in the database and are never sent to this browser'
        : 'No settings/signup document. In Firestore Database \u2192 Data, add a collection named settings holding a document whose ID is exactly signup, then add two string fields, operatorCode and farmCode, and press Save. A document with no fields does not count as existing \u2014 the console shows that kind in italics.');
    }
    try{
      const methods = await au.fetchSignInMethodsForEmail(auth, 'connection-check@example.com');
      push('Email sign-in switched on', true, 'Authentication answered' + (methods ? '' : ''));
    }catch(e){
      const msg = String(e && (e.code || e.message) || e);
      if(/operation-not-allowed|configuration-not-found/i.test(msg)){
        push('Email sign-in switched on', false, 'Email/Password is not enabled. Build → Authentication → Sign-in method → Email/Password → Enable.');
      } else if(/invalid-email/i.test(msg)){
        push('Email sign-in switched on', true, 'Authentication answered');
      } else {
        push('Email sign-in switched on', false, msg);
      }
    }
  }catch(e){
    push('Connected to the project', false, (e.message||String(e)));
  }
}

// Entrance motion for whatever the active tab just rendered.
/* A re-render rebuilds the whole tab, which otherwise throws the reader to a
   different scroll position. Adding one item to a long form should leave the
   page exactly where it was, with the cursor ready for the next entry. */
function renderKeepingPlace(focusId){
  const y = window.scrollY;
  render();
  if(focusId){
    const el = document.getElementById(focusId);
    if(el) el.focus({preventScroll:true});
  }
  // Restore after focusing, and once more on the next frame, so neither the
  // focus call nor the entrance animations can shift the page.
  window.scrollTo(0, y);
  requestAnimationFrame(()=> window.scrollTo(0, y));
}

function afterRender(c){
  c.classList.remove('is-swapping');
  void c.offsetWidth;
  c.classList.add('is-swapping');
  staggerIn(c);
  animateCounters(c);
  observeScrollReveals(c);
}

    if(state.tab==='catalogue') return renderCatalogue(c);
    if(state.tab==='calendarsA') return renderCalendarsAdmin(c);

}

/* Crop and variety come from the Secretariat's catalogue and nowhere else.
   A variety carries the plant spacing and the per-plant yield curve, and a
   farm's whole harvest projection is built from them — a name typed in by
   hand would carry neither, so there would be nothing to project from. A crop
   the association grows but the list does not hold is something for the
   Secretariat to add, and the form says so.

   A crop saved before it left the catalogue keeps its own name in the list,
   marked, so editing that entry does not quietly rename it. */
function cropPicker(prefix, current){
  const known = CATALOGUE.map(c=>c.name);
  const stale = current && !catalogueCrop(current);
  if(!known.length && !stale){
    return `<select id="${prefix}-crop" disabled><option>No crops in the catalogue yet</option></select>`;
  }
  return `<select id="${prefix}-crop" onchange="onCropPicked('${prefix}')">
      <option value="">Choose a crop…</option>
      ${known.map(n=>`<option value="${esc(n)}" ${current===n?'selected':''}>${esc(n)}</option>`).join('')}
      ${stale?`<option value="${esc(current)}" selected>${esc(current)} — no longer in the catalogue</option>`:''}
    </select>`;
}
function varietyPicker(prefix, cropName, current){
  const crop = catalogueCrop(cropName);
  const list = crop ? (crop.varieties||[]) : [];
  const stale = current && !catalogueVariety(cropName, current);
  if(!list.length && !stale){
    return `<select id="${prefix}-variety" disabled><option>${cropName ? 'This crop has no varieties yet' : 'Choose a crop first'}</option></select>`;
  }
  return `<select id="${prefix}-variety" onchange="onVarietyPicked('${prefix}')">
      <option value="">Choose a variety…</option>
      ${list.map(v=>`<option value="${esc(v.name)}" ${current===v.name?'selected':''}>${esc(v.name)}</option>`).join('')}
      ${stale?`<option value="${esc(current)}" selected>${esc(current)} — no longer in the catalogue</option>`:''}
    </select>`;
}
function pickerValue(prefix, which){
  const sel = document.getElementById(`${prefix}-${which}`);
  if(!sel || sel.disabled) return '';
  return sel.value.trim();
}
function onCropPicked(prefix){
  const sel = document.getElementById(`${prefix}-crop`);
  const holder = document.getElementById(`${prefix}-variety-holder`);
  if(holder) holder.innerHTML = varietyPicker(prefix, sel.value, '');
  showVarietyFacts(prefix);
}
function onVarietyPicked(prefix){ showVarietyFacts(prefix); }

/* What the catalogue knows about the chosen variety, and what the seedling
   count means against the area entered. Filled in as soon as both are known,
   so nobody has to look any of it up. */
function varietyFacts(cropName, varietyName, seedlings, area, unit, planted, expected){
  const v = catalogueVariety(cropName, varietyName);
  if(!v) return '';
  const n = Number(seedlings)||0;
  const y = yieldFor({crop:cropName, variety:varietyName, seedlings:n, planted, expected});
  const sqm = toSqm(area, unit);
  const bits = [];
  if(v.perSqm) bits.push(`Catalogue spacing <strong>${v.perSqm} plants per m²</strong>`);
  if(v.perSqm && sqm) bits.push(`that area holds about <strong>${fmt(Math.round(v.perSqm * sqm))}</strong> plants`);
  if(n && sqm) bits.push(`you entered <strong>${fmt(n)}</strong>, or ${(n/sqm).toFixed(2)} per m²`);
  const head = bits.join(' · ');
  if(!n) return head + (head?'<br>':'') + '<em>Enter the number of seedlings to see the yield.</em>' + (v.notes?`<br>${esc(v.notes)}`:'');
  return `${head}${head?'<br>':''}
    <strong>${y.perPlant.toFixed(2)} kg</strong> per plant over ${y.weeks} weeks
    × <strong>${fmt(n)}</strong> seedlings =
    <strong style="font-size:15px;">${fmt(Math.round(y.total))} kg expected</strong>
    · ${esc(y.patternLabel)}${y.firstDate?` · first harvest ${esc(y.firstDate)}`:''}
    ${v.notes?`<br>${esc(v.notes)}`:''}`;
}
function showVarietyFacts(prefix){
  const el = document.getElementById(`${prefix}-facts`);
  if(!el) return;
  const crop = pickerValue(prefix, 'crop'), variety = pickerValue(prefix, 'variety');
  const seedEl = document.getElementById(`${prefix}-seedlings`);
  const areaEl = document.getElementById(`${prefix}-area`);
  const dateEl = document.getElementById(`${prefix}-planted`);
  const endEl = document.getElementById(`${prefix}-expected`);
  const html = varietyFacts(crop, variety, seedEl?seedEl.value:0, areaEl?areaEl.value:0,
                            readUnit(`${prefix}-area`, LAND_UNITS),
                            dateEl?dateEl.value:'', endEl?endEl.value:'');
  el.innerHTML = html;
  el.style.display = html ? '' : 'none';
}

/* Seed companies other farms have already named are offered as suggestions.
   Crops are not: they come from the Secretariat's catalogue. */
function seedCompanyList(){
  const names = seedCompanyTally().map(r=>r.name);
  return names.length ? `<datalist id="seed-companies">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>` : '';
}

// How many farms use each seed company, and for which crops.
function seedCompanyTally(){
  const tally = {};
  Object.keys(MEMBERS).forEach(id=>{
    const seenHere = {};
    (MEMBERS[id].crops||[]).forEach(cr=>{
      const co = (cr.seedCompany||'').trim();
      if(!co) return;
      const key = co.toLowerCase();
      if(!tally[key]) tally[key] = { name:co, farms:0, entries:0, crops:[] };
      tally[key].entries++;
      if(!seenHere[key]){ tally[key].farms++; seenHere[key] = true; }
      const cropName = (cr.crop||'').trim();
      if(cropName && tally[key].crops.indexOf(cropName)===-1) tally[key].crops.push(cropName);
    });
  });
  return Object.values(tally).sort((a,b)=> b.farms-a.farms || b.entries-a.entries || a.name.localeCompare(b.name));
}

// What the membership is actually planting, so a farm can see which seed
// companies other TIPFA farms rely on before choosing its own.
function seedCompanyPanel(m){
  const rows = seedCompanyTally();

  (m ? (m.crops||[]) : []).forEach(cr=>{ const c=(cr.seedCompany||'').trim(); if(c) mine[c.toLowerCase()] = true; });
  const top = rows[0];
  return `

    <div class="card">
      ${rows.length ? `
      <p class="helper" style="margin-bottom:12px;">Drawn from every crop entry on the register${farmCount ? ` — ${farmCount} farm${farmCount===1?'':'s'}` : ''}.${top && top.farms>1 ? ` <strong>${esc(top.name)}</strong> is the most widely used.` : ''}</p>
      <table class="grid-table"><thead><tr><th>Seed company</th><th style="width:120px;">Farms using</th><th>Crops grown from it</th></tr></thead>
      <tbody>${rows.map(r=>`<tr${mine[r.name.toLowerCase()] ? ' style="font-weight:500;"' : ''}>
        <td>${esc(r.name)}${mine[r.name.toLowerCase()] ? ' <span class="status-pill status-active" style="margin-left:6px;">You</span>' : ''}</td>
        <td>${r.farms} of ${farmCount}</td>

function saveCropEdit(i){
  const m = MEMBERS[state.member], cr = m.crops[i];
  const msg = document.getElementById('ec-msg');
  const crop = pickerValue('ec','crop');
  const variety = pickerValue('ec','variety');
  const seedCompany = document.getElementById('ec-seed').value.trim();
  const area = Number(document.getElementById('ec-area').value)||0;
  const areaUnit = readUnit('ec-area', LAND_UNITS);
  const seedlings = Number(document.getElementById('ec-seedlings').value)||0;
  const planted = document.getElementById('ec-planted').value;
  const expected = document.getElementById('ec-expected').value;
  const fail = t=>{ if(msg){ msg.textContent = t; } };
  if(!crop){ fail('Enter the crop name.'); return; }
  if(m.crops.some((x,xi)=> xi!==i && (x.crop||'').toLowerCase()===crop.toLowerCase()
                                  && (x.variety||'').toLowerCase()===variety.toLowerCase())){
    fail('Another entry already uses that crop and variety.'); return;
  }
  if(planted && expected && new Date(expected) <= new Date(planted)){
    fail('The expected harvest date must come after the transplanting date.'); return;
  }
  const oldName = cr.crop;
  Object.assign(cr, {crop, variety, seedCompany, area, areaUnit, seedlings, planted, expected});
  if(oldName !== crop) renameCropRecords(state.member, oldName, crop);
  state.editCrop = null;
  logAction(`${m.name} updated the crop profile entry for ${crop}${oldName!==crop ? ` (renamed from ${oldName})` : ''}.`);
  render();
}

// Move harvest figures, buyer prices and market standards onto the new name.
function renameCropRecords(id, from, to){
  if(!from || from === to) return;
  const stillUsed = (MEMBERS[id].crops||[]).some(c=> c.crop === from);
  const h = harvest[id];
  if(h){
    ['plan','actual'].forEach(kind=>{
      Object.keys(h[kind]||{}).forEach(yr=>{
      for(let mo=1; mo<=12; mo++){
        for(let w=1; w<=4; w++){
          const wk = h[kind][yr][mo][w];
          if(wk && wk[from] !== undefined){
            wk[to] = (Number(wk[to])||0) + (Number(wk[from])||0);
            if(!stillUsed) delete wk[from];
          }
        }
      }
      });
    });
  }
  (MEMBERS[id].marketPrices||[]).forEach(p=>{ if(p.crop === from) p.crop = to; });
  (MEMBERS[id].marketStandards||[]).forEach(x=>{ if(x.crop === from) x.crop = to; });
  if(state.priceCrop === from) state.priceCrop = to;
}

// ---- Crop calendar: stages, per-stage inputs, supporting documents ----
/* ============================================================
   Programme timing
   The template expresses each stage as a month and week window
   ("June (Week 3)", "July (Weeks 1-4)"). Those windows are derived
   from the crop's own planting and expected harvest dates, so the
   generated programme follows what the farm actually entered.
   ============================================================ */
function weekOfMonth(d){ return Math.min(4, Math.floor((d.getDate()-1)/7) + 1); }
function parseDate(v){
  if(!v) return null;
  const d = new Date(v + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}
function pointLabel(d){ return `${MONTHS[d.getMonth()]} (Week ${weekOfMonth(d)})`; }
function shortDate(d){ return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; }
function dateRangeText(a, b){
  if(!a || !b) return '';
  const sameDay = a.getTime() === b.getTime();
  const yr = a.getFullYear() === b.getFullYear() ? ` ${b.getFullYear()}` : '';
  return sameDay ? `${shortDate(a)}${yr}` : `${shortDate(a)} \u2013 ${shortDate(b)}${yr}`;
}
function windowLabel(a, b){
  if(!a || !b) return '\u2014';
  if(a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth()){
    const wa = weekOfMonth(a), wb = weekOfMonth(b);
    return wa===wb ? `${MONTHS[a.getMonth()]} (Week ${wa})`
                   : `${MONTHS[a.getMonth()]} (Weeks ${wa}\u2013${wb})`;
  }
  return `${pointLabel(a)} \u2013 ${pointLabel(b)}`;
}
const DAY = 86400000;

/* The calendar runs from the date the farm transplanted to the date it
   expects to harvest — nothing is assumed from today's date. Transplanting
   takes the first week, harvesting the last, and the two growing stages
   divide the season in between. */
function stageWindows(cr){
  const start = parseDate(cr.planted), end = parseDate(cr.expected);
  const out = {};
  if(!start || !end || end <= start){
    CROP_STAGES.forEach(st=> out[st] = {label:'\u2014', dates:'', from:null, to:null, unset:true});
    return out;
  }
  const tEnd   = new Date(Math.min(+start + 6*DAY, +end));
  const hStart = new Date(Math.max(+end - 6*DAY, +tEnd + DAY));
  const mid    = new Date(+tEnd + (hStart - tEnd)/2);
  const spans = {
    'Transplanting':[start, tEnd],
    'Vegetative'   :[new Date(+tEnd + DAY), mid],
    'Flowering'    :[new Date(+mid + DAY), new Date(+hStart - DAY)],
    'Harvesting'   :[hStart, end],
  };
  CROP_STAGES.forEach(st=>{
    let [a,b] = spans[st];
    if(b < a) b = a;                       // very short seasons collapse cleanly
    out[st] = {label:windowLabel(a,b), dates:dateRangeText(a,b), from:a, to:b};
  });
  return out;
}

      ${timing[state.calStage].unset ? `<div class="msg-banner" style="background:#FBEECC;border-left-color:var(--harvest-orange);color:#8A6412;">
        This crop has no transplanting or expected harvest date yet, so its calendar has no dates to run between. Set them on the Profile tab.</div>` : ''}
      <p class="helper" style="margin:0 0 14px;"><strong>${esc(state.calStage)}</strong>${timing[state.calStage].dates ? ` &middot; ${esc(timing[state.calStage].dates)} (${esc(timing[state.calStage].label)})` : ''} &mdash; ${esc(STAGE_NOTES[state.calStage]||'')}</p>
      ${INPUT_CATEGORIES.map(cat=> categoryBlock(cr, state.calStage, cat)).join('')}
    </div>

    ${generatedProgramme(m, cr, timing)}
    ${completionPanel(cr)}
    ${importPanel(cr)}`;
}

/* ---- Stage completion -------------------------------------------
   Every product recorded against a stage can be ticked off once it has
   actually been applied. A stage counts as accomplished when every
   product listed for it has been ticked. */
// The comment carried on the programme for a stage: the farm's own words if
// it has written any, otherwise the association's standard guidance.
function stageComment(cr, stage){
  const own = cr.stageNotes && cr.stageNotes[stage];
  return (own && own.trim()) ? own.trim() : (STAGE_NOTES[stage] || '');
}
function setStageNote(stage, value){
  const m = MEMBERS[state.member], cr = m.crops[state.calCrop];
  if(!cr.stageNotes) cr.stageNotes = {};
  cr.stageNotes[stage] = value;
  logAction(`${m.name} updated the ${stage} programme note for ${cr.crop}.`);
  renderKeepingPlace();          // the generated programme below reads this
}

function stageItems(cr, stage){
  const p = ensureProgramme(cr), out = [];
  CATEGORY_KEYS.forEach(k => (p[stage][k]||[]).forEach((r, i) => out.push({cat:k, i, entry:r})));
  return out;
}
function stageProgress(cr, stage){
  const items = stageItems(cr, stage);
  const done = items.filter(x => x.entry.done).length;
  return {done, total: items.length, complete: items.length > 0 && done === items.length};
}
function toggleApplied(stage, catKey, i, checked){
  const m = MEMBERS[state.member], cr = m.crops[state.calCrop];
  const entry = ensureProgramme(cr)[stage][catKey][i];
  if(!entry) return;
  entry.done = !!checked;
  entry.doneOn = checked ? todayStr() : '';
  const p = stageProgress(cr, stage);
  logAction(`${m.name} marked "${entry.product}" as ${checked?'applied':'not applied'} for ${cr.crop} at ${stage}${p.complete?' — stage complete':''}.`);
  renderKeepingPlace();
}
function setStageApplied(stage, value){
  const m = MEMBERS[state.member], cr = m.crops[state.calCrop];
  const items = stageItems(cr, stage);
  if(!items.length) return;
  items.forEach(x=>{ x.entry.done = value; x.entry.doneOn = value ? todayStr() : ''; });
  logAction(`${m.name} marked the whole ${stage} stage as ${value?'applied':'not applied'} for ${cr.crop}.`);
  renderKeepingPlace();
}

// The tally panel that sits under the generated programme.
/* ============================================================
   Bringing in your own crop calendar
   A farm that already keeps a programme elsewhere can load it in as a
   CSV rather than retyping it. The template below is deliberately
   simple: one row per product, with the stage and category named.
   ============================================================ */
const IMPORT_HEADER = ['Crop stage','Category','Product','Composition or target','Dosage','Unit','Method'];

function downloadProgrammeTemplate(){
  const rows = [IMPORT_HEADER,
    ['Transplanting','Fertilizers','Triple Super Phosphate (TSP)','0-46-0 (46% P2O5)','32','kg','Basal'],
    ['Transplanting','Fungicides','Ridomil Gold','Damping off','100','ml','Drench'],
    ['Vegetative','Fertilizers','Yara Winner','Water-soluble NPK blend','22.5','kg','Fertigation'],
    ['Vegetative','Insecticides','Mission','Leaf miner','200','ml','Foliar spray'],
    ['Flowering','Fertilizers','Potassium Nitrate (KNO3)','13-0-46','12.5','kg','Fertigation'],
    ['Harvesting','Fertilizers','Nitrabor','Calcium nitrate + boron','10','kg','Basal'],
  ];
  downloadCSV('TIPFA_crop_calendar_template.csv', rows);
}

// A small CSV reader that copes with quoted fields and embedded commas.
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = text.replace(/\r\n?/g, '\n');
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if(c === '"'){ inQuotes = true; }
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

function matchStage(v){
  const t = String(v||'').trim().toLowerCase();
  return CROP_STAGES.find(st => st.toLowerCase() === t)
      || CROP_STAGES.find(st => t && st.toLowerCase().startsWith(t.slice(0,5)))
      || null;
}
// Spreadsheets in the wild still carry an Insecticides column, so it maps onto
// Pesticides rather than falling through to the fertilizer default.
const CATEGORY_ALIASES = {
  'insecticides':'Pesticides', 'insecticide':'Pesticides',
  'pesticide':'Pesticides', 'fungicide':'Fungicides', 'fertilizer':'Fertilizers',
  'fertiliser':'Fertilizers', 'fertilisers':'Fertilizers',
  'crop protection':'Pesticides', 'pest control':'Pesticides',
};
function matchCategory(v){
  const t = String(v||'').trim().toLowerCase();
  return CATEGORY_KEYS.find(k => k.toLowerCase() === t)
      || CATEGORY_ALIASES[t]
      || CATEGORY_KEYS.find(k => t && k.toLowerCase().startsWith(t.replace(/s$/,'').slice(0,6)))
      || null;
}

function importProgrammeFile(input){
  const file = input.files && input.files[0];
  const out = document.getElementById('import-result');
  const show = (msg, bad)=>{ if(out){ out.className = 'import-result' + (bad?' bad':''); out.innerHTML = msg; } };
  if(!file) return;
  const mode = document.getElementById('import-mode').value;
  const reader = new FileReader();
  reader.onerror = ()=> show('That file could not be read.', true);
  reader.onload = ()=>{
    let rows;
    try { rows = parseCSV(String(reader.result)); }
    catch(e){ show('That file could not be read as CSV.', true); return; }
    if(rows.length < 2){ show('That file has no rows under its heading.', true); return; }

    // Locate the columns by name, so extra columns and reordering are fine.
    const head = rows[0].map(h => String(h).trim().toLowerCase());
    const col = names => { for(const n of names){ const i = head.indexOf(n); if(i !== -1) return i; } return -1; };
    const iStage  = col(['crop stage','stage']);
    const iCat    = col(['category','type','input category']);
    const iProd   = col(['product','product name','required fertilizer','input']);
    const iDetail = col(['composition or target','composition / type','composition','target','target pest / disease','pest / disease control']);
    const iDose   = col(['dosage','dose','rate']);
    const iUnit   = col(['unit','uom']);
    const iMethod = col(['method','application method']);
    if(iStage === -1 || iProd === -1){
      show('The file needs at least a "Crop stage" and a "Product" column. Download the template below to see the expected headings.', true);
      return;
    }

    const m = MEMBERS[state.member], cr = m.crops[state.calCrop];
    const p = ensureProgramme(cr);
    if(mode === 'replace') cr.programme = blankProgramme();

    let added = 0; const skipped = [];
    rows.slice(1).forEach((r, n)=>{
      const stage = matchStage(r[iStage]);
      const product = String(r[iProd] || '').trim();
      if(!stage){ skipped.push(`row ${n+2}: unknown stage "${String(r[iStage]||'').trim()}"`); return; }
      if(!product){ skipped.push(`row ${n+2}: no product name`); return; }
      const cat = (iCat !== -1 && matchCategory(r[iCat])) || 'Fertilizers';
      const def = categoryDef(cat);
      const entry = {
        product,
        dose: iDose !== -1 ? String(r[iDose]||'').trim() : '',
        unit: iUnit !== -1 && String(r[iUnit]||'').trim() ? String(r[iUnit]).trim() : def.unit,
        method: iMethod !== -1 && String(r[iMethod]||'').trim() ? String(r[iMethod]).trim() : def.methods[0],
      };
      const detail = iDetail !== -1 ? String(r[iDetail]||'').trim() : '';
      if(def.targets) entry.target = detail; else entry.composition = detail;
      ensureProgramme(cr)[stage][cat].push(entry);
      added++;
    });

    input.value = '';
    if(!added){
      show('Nothing was imported. ' + (skipped.length ? skipped.slice(0,3).join('; ') : 'No usable rows found.'), true);
      render();
      return;
    }
    logAction(`${m.name} imported ${added} programme row${added===1?'':'s'} for ${cr.crop} from a file${mode==='replace'?' (replacing the existing programme)':''}.`);
    state.importMsg = `${CHECK_ICON} Imported ${added} row${added===1?'':'s'} into ${esc(cr.crop)}.` +
      (skipped.length ? ` ${skipped.length} row${skipped.length===1?'':'s'} skipped — ${esc(skipped.slice(0,3).join('; '))}${skipped.length>3?'…':''}` : '');
    render();
  };
  reader.readAsText(file);
}

function importPanel(cr){
  const msg = state.importMsg;
  state.importMsg = '';
  return `
    <div class="section-label">Add your own crop calendar</div>
    <div class="card import-card">
      <p class="helper" style="margin:0;">Already keep a programme in a spreadsheet? Save it as CSV and load it straight into
        <strong>${esc(cr.crop)}</strong> instead of retyping it. One row per product, with the stage and category named.
        Download the template to see the headings the file needs.</p>
      <div class="import-opts">
        <select id="import-mode" style="width:auto;margin:0;">
          <option value="append">Add to what is already recorded</option>
          <option value="replace">Replace this crop's programme</option>
        </select>
        <input type="file" accept=".csv,text/csv" id="import-file" style="width:auto;margin:0;" onchange="importProgrammeFile(this)">
        <button class="btn small ghost" onclick="downloadProgrammeTemplate()">Download template</button>
      </div>
      ${msg ? `<div class="import-result">${msg}</div>` : '<div id="import-result"></div>'}
      <p class="helper">Stages must be ${CROP_STAGES.join(', ')}. Categories must be ${CATEGORY_KEYS.join(', ')} — a column marked Insecticides is read as Pesticides, and anything else unrecognised is
        treated as a fertilizer, and rows with no stage or product are skipped and reported.</p>

}

function completionPanel(cr, readOnly){
  const rows = CROP_STAGES.map(stage=>{
    const prog = stageProgress(cr, stage);
    const items = stageItems(cr, stage);
    const pctDone = prog.total ? Math.round(prog.done / prog.total * 100) : 0;
    const status = !prog.total ? '<span class="status-pill status-open">Nothing listed</span>'
                 : prog.complete ? '<span class="status-pill status-resolved">Accomplished</span>'
                 : prog.done ? '<span class="status-pill status-progress">In progress</span>'
                 : '<span class="status-pill status-pending">Not started</span>';
    return `<div class="tally-stage ${prog.complete?'is-complete':''}">
      <div class="ts-head">
        <div>
          <span class="ts-name">${esc(stage)}</span>
          <span class="ts-count">${prog.done} of ${prog.total} applied</span>
        </div>
        ${status}
      </div>
      <div class="ts-bar"><div class="ts-fill" style="width:${pctDone}%"></div></div>
      ${items.length ? `<div class="ts-items">${items.map(x=>`
        <label class="ts-item ${x.entry.done?'done':''}">
          <input type="checkbox" ${x.entry.done?'checked':''} ${readOnly?'disabled':''}
                 ${readOnly?'':`onchange="toggleApplied('${esc(stage)}','${x.cat}',${x.i},this.checked)"`}>
          <span class="ti-body">
            <span class="ti-name">${esc(x.entry.product)}</span>
            <span class="ti-meta">${esc(x.cat)}${x.entry.dose?` &middot; ${esc(x.entry.dose)} ${esc(x.entry.unit||'')}`:''}${x.entry.doneOn?` &middot; applied ${esc(x.entry.doneOn)}`:''}</span>
          </span>
        </label>`).join('')}</div>
        ${readOnly ? '' : `<div class="ts-actions">
          <button class="btn small ghost" onclick="setStageApplied('${esc(stage)}', true)">Mark all applied</button>
          ${prog.done ? `<button class="btn small ghost" onclick="setStageApplied('${esc(stage)}', false)">Clear</button>` : ''}
        </div>`}`
      : `<p class="helper" style="margin:6px 0 0;">No products listed for this stage yet — add them above and they appear here to tick off.</p>`}
    </div>`;
  }).join('');

  const all = CROP_STAGES.map(st=> stageProgress(cr, st));
  const listed = all.reduce((t,x)=>t+x.total,0);
  const applied = all.reduce((t,x)=>t+x.done,0);
  const stagesDone = all.filter(x=>x.complete).length;
  return `
    <div class="section-label">Stage completion — ${esc(cr.crop)}</div>
    <div class="card">
      <div class="tally-summary">
        <div><span class="tsum-num">${stagesDone}/${CROP_STAGES.length}</span><span class="tsum-lbl">Stages accomplished</span></div>
        <div><span class="tsum-num">${applied}/${listed}</span><span class="tsum-lbl">Products applied</span></div>
      </div>
      <p class="helper" style="margin:0 0 14px;">${readOnly ? 'What the farm has recorded as applied. A stage counts as accomplished once every product listed for it has been used.' : 'Tick each product as you apply it. A stage counts as accomplished once every product listed for it has been used.'}</p>
      <div class="tally-grid">${rows}</div>
    </div>`;
}

function stageEntryCount(cr, stage){
  const p = ensureProgramme(cr);
  return CATEGORY_KEYS.reduce((t,k)=> t + (p[stage][k]||[]).length, 0);
}
function selectCalCrop(i){ state.calCrop = i; state.justAdded = null; state.editEntry = null; render(); }
function selectCalStage(st){ state.calStage = st; state.justAdded = null; state.editEntry = null; render(); }

// One category of inputs for the selected crop and stage.
function categoryBlock(cr, stage, cat){
  const rows = ensureProgramme(cr)[stage][cat.key] || [];
  const p = 'inp-' + cat.key;
  return `
    <div class="cat-block">
      <div class="cat-head">
        <span class="cat-name">${cat.label}</span>
        <span class="cat-count">${rows.length}</span>
      </div>

            <td><input type="checkbox" class="tick" ${r.done?'checked':''}

          </tr>`).join('')

      <div class="grid2" style="margin-top:12px;">
        <div><label class="f">Product name</label><input id="${p}-product" list="dl-${cat.key}" placeholder="${esc(cat.hint)}"></div>
        <div><label class="f">${cat.targets ? 'Target pest or disease' : 'Composition / type'}</label>
          <input id="${p}-detail" placeholder="${cat.targets ? 'e.g. Damping off, Tuta absoluta' : 'e.g. 0-46-0 (46% P2O5)'}"></div>
        <div><label class="f">Dosage</label><input id="${p}-dose" type="number" step="0.01" placeholder="0"></div>
        <div><label class="f">Unit</label><select id="${p}-unit">${cat.units.map(u=>`<option>${u}</option>`).join('')}</select></div>
        <div><label class="f">Method</label><select id="${p}-method">${cat.methods.map(x=>`<option>${x}</option>`).join('')}</select></div>

      ${productSuggestions(cat.key)}
      <button class="btn small" onclick="addInput('${cat.key}')">+ Add ${cat.label.replace(/s$/,'').toLowerCase()}</button>
      <span class="helper" style="margin-left:10px;">${state.justAdded===cat.key ? `<span class="added-flash">${CHECK_ICON} Added — enter the next one</span>` : 'Add as many as you use at this stage.'}</span>
    </div>`;
}

// Products already recorded anywhere on the register, offered as suggestions.
function productSuggestions(catKey){
  const seen = [];
  Object.keys(MEMBERS).forEach(id=> (MEMBERS[id].crops||[]).forEach(cr=>{
    const p = cr.programme; if(!p) return;
    CROP_STAGES.forEach(st=> ((p[st]||{})[catKey]||[]).forEach(r=>{
      const n = (r.product||'').trim();
      if(n && seen.indexOf(n)===-1) seen.push(n);
    }));
  }));
  return seen.length ? `<datalist id="dl-${catKey}">${seen.sort().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>` : '';
}

/* ---- Editing a recorded product ------------------------------- */
// Editing straight from the generated programme: open the stage that row
// belongs to and put that entry into edit mode.
function editFromProgramme(stage, catKey, i){
  state.calStage = stage;
  state.editEntry = {stage, cat:catKey, i};
  render();
  const el = document.querySelector('.entry-edit');
  if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
}

function isEditingEntry(stage, catKey, i){
  const e = state.editEntry;
  return !!e && e.stage===stage && e.cat===catKey && e.i===i;
}
function editEntry(stage, catKey, i){ state.editEntry = {stage, cat:catKey, i}; renderKeepingPlace(); }
function cancelEntryEdit(){ state.editEntry = null; renderKeepingPlace(); }

function entryEditRow(cat, r, stage, i){
  const detail = (cat.targets ? r.target : r.composition) || '';
  return `<tr class="entry-edit"><td colspan="6">
    <div class="ee-head">Editing <strong>${esc(r.product)}</strong> &middot; ${esc(cat.label)} at ${esc(stage)}</div>
    <div class="grid2">
      <div><label class="f">Product name</label><input id="ee-product" value="${esc(r.product)}" list="dl-${cat.key}"></div>
      <div><label class="f">${cat.targets ? 'Target pest or disease' : 'Composition / type'}</label>
        <input id="ee-detail" value="${esc(detail)}"></div>

      <div><label class="f">Unit</label><select id="ee-unit">${cat.units.map(u=>`<option ${r.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
      <div><label class="f">Method</label><select id="ee-method">${cat.methods.map(x=>`<option ${r.method===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label class="f">Move to stage</label><select id="ee-stage">${CROP_STAGES.map(st=>`<option ${st===stage?'selected':''}>${st}</option>`).join('')}</select></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="btn small" onclick="saveEntryEdit()">Save changes</button>
      <button class="btn small ghost" onclick="cancelEntryEdit()">Cancel</button>
      <span class="helper" id="ee-msg" style="color:var(--red);"></span>
    </div>
  </td></tr>`;
}

function saveEntryEdit(){
  const e = state.editEntry; if(!e) return;
  const cat = categoryDef(e.cat);
  const m = MEMBERS[state.member], cr = m.crops[state.calCrop];
  const p = ensureProgramme(cr);
  const entry = p[e.stage][e.cat][e.i];
  if(!entry) { state.editEntry = null; renderKeepingPlace(); return; }
  const product = document.getElementById('ee-product').value.trim();
  if(!product){ document.getElementById('ee-msg').textContent = 'Enter the product name.'; return; }
  const detail = document.getElementById('ee-detail').value.trim();
  entry.product = product;
  entry.dose = document.getElementById('ee-dose').value.trim();
  entry.unit = document.getElementById('ee-unit').value;
  entry.method = document.getElementById('ee-method').value;
  if(cat.targets){ entry.target = detail; delete entry.composition; }
  else { entry.composition = detail; delete entry.target; }
  const newStage = document.getElementById('ee-stage').value;
  if(newStage !== e.stage){
    p[e.stage][e.cat].splice(e.i, 1);
    p[newStage][e.cat].push(entry);
  }
  logAction(`${m.name} edited ${e.cat.replace(/s$/,'').toLowerCase()} "${product}" for ${cr.crop} at ${newStage}.`);
  state.editEntry = null;
  renderKeepingPlace();
}

function addInput(catKey){
  const cat = categoryDef(catKey), p = 'inp-' + catKey;
  const m = MEMBERS[state.member], cr = m.crops[state.calCrop];
  const product = document.getElementById(p+'-product').value.trim();
  const detail  = document.getElementById(p+'-detail').value.trim();
  const dose    = document.getElementById(p+'-dose').value.trim();
  const unit    = document.getElementById(p+'-unit').value;
  const method  = document.getElementById(p+'-method').value;
  if(!product){
    const el = document.getElementById(p+'-product');
    el.focus(); el.style.borderColor = 'var(--red)';
    return;
  }
  const entry = {product, dose, unit, method};
  if(cat.targets) entry.target = detail; else entry.composition = detail;
  const allEl = document.getElementById(p+'-all');
  const everyStage = !!(allEl && allEl.checked);
  const prog = ensureProgramme(cr);
  if(everyStage){
    CROP_STAGES.forEach(st=> prog[st][catKey].push(Object.assign({}, entry)));
  } else {
    prog[state.calStage][catKey].push(entry);
  }
  logAction(`${m.name} recorded ${catKey.replace(/s$/,'').toLowerCase()} "${product}" for ${cr.crop} at ${everyStage ? 'every stage' : state.calStage}.`);
  state.justAdded = catKey;
  renderKeepingPlace(p+'-product');
}
function removeInput(catKey, i){
  const m = MEMBERS[state.member], cr = m.crops[state.calCrop];
  const removed = ensureProgramme(cr)[state.calStage][catKey].splice(i,1)[0];
  logAction(`${m.name} removed ${catKey.replace(/s$/,'').toLowerCase()} "${removed && removed.product}" from ${cr.crop} at ${state.calStage}.`);
  renderKeepingPlace();
}

/* ============================================================
   Generated programme
   Mirrors the association's Fertilizer & Crop Protection Program
   sheet: one row per fertilizer line item, with the stage, timing,
   crop-protection column and comment spanning that stage's rows.
   ============================================================ */
// Lines for one crop-protection category, formatted as the template does:
// "target -> product", with the dose in the matching UoM column.
function categoryLines(cr, stage, key){
  const p = ensureProgramme(cr);
  return (p[stage][key]||[]).map(r=>({
    text: (r.target ? r.target + ' \u2192 ' : '') + r.product,
    uom: r.dose ? `${r.dose} ${r.unit||''}`.trim() : '\u2014',
    done: !!r.done
  }));
}
function protectionLines(cr, stage){ return categoryLines(cr, stage, 'Pesticides'); }
function fungicideLines(cr, stage){ return categoryLines(cr, stage, 'Fungicides'); }
function generatedProgramme(m, cr, timing, readOnly){
  const p = ensureProgramme(cr);
  let fertCount = 0, body = '';
  CROP_STAGES.forEach(stage=>{
    const ferts = p[stage]['Fertilizers'] || [];
    const prot  = protectionLines(cr, stage);
    const fung  = fungicideLines(cr, stage);
    const span  = Math.max(ferts.length, 1);
    fertCount += ferts.length;
    const lineCell = list => list.length
      ? list.map(x=>`${x.done ? '<span class="pg-tick" title="Applied">\u2713</span> ' : ''}${esc(x.text)}`).join('<br>')
      : '<span style="color:var(--muted);">None recorded</span>';
    const uomCell  = list => list.length ? list.map(x=>esc(x.uom)).join('<br>') : '\u2014';
    const protCell = lineCell(prot);
    const fungCell = lineCell(fung);
    const rows = ferts.length ? ferts : [null];
    const cls = 'pg-' + stage.toLowerCase();
    rows.forEach((f, i)=>{
      body += `<tr class="${cls}${f && f.done ? ' pg-applied' : ''}">`;
      if(i===0){
        body += `<td rowspan="${span}" class="pg-stage">${esc(stage)}</td>`;
        body += `<td rowspan="${span}">${esc(timing[stage].dates || '\u2014')}${timing[stage].dates ? `<br><span style="color:var(--muted);font-size:11px;">${esc(timing[stage].label)}</span>` : ''}</td>`;
      }
      body += f
        ? `<td>${f.done ? '<span class="pg-tick" title="Applied">\u2713</span> ' : ''}${esc(f.product)}
             ${readOnly ? '' : `<button class="pg-edit" title="Edit this entry"
               onclick="editFromProgramme('${esc(stage)}','Fertilizers',${i})">Edit</button>`}</td>
           <td>${esc(f.composition||'\u2014')}</td><td>${esc(f.dose||'\u2014')} ${esc(f.unit||'')}</td><td>${esc(f.method||'\u2014')}</td>`
        : `<td colspan="4" style="color:var(--muted);">No fertilizer recorded for this stage</td>`;
      if(i===0){
        body += `<td rowspan="${span}">${protCell}</td>`;
        body += `<td rowspan="${span}">${uomCell(prot)}</td>`;
        body += `<td rowspan="${span}" class="pg-fung">${fungCell}</td>`;
        body += `<td rowspan="${span}">${uomCell(fung)}</td>`;
        body += `<td rowspan="${span}" class="pg-comment">${esc(stageComment(cr, stage))}</td>`;
      }
      body += '</tr>';
    });
  });
  return `
    <div class="section-label">Generated programme — ${esc(cr.crop)}</div>
    <div class="card prog-card">
      <div class="prog-head">
        <img class="prog-logo" src="assets/brand/tipfa-logo-primary.png"
             alt="TIPFA — Tanzania Indoor &amp; Professional Farmers Association">
        <div class="prog-headtext">
          <div class="prog-title">${esc(m.name).toUpperCase()} — FERTILIZER &amp; CROP PROTECTION PROGRAM, BY CROP STAGE</div>
          <div class="prog-sub">${esc(cr.crop)}${cr.variety?` &middot; ${esc(cr.variety)}`:''}${cr.seedCompany?` &middot; seed from ${esc(cr.seedCompany)}`:''}${cr.area?` &middot; ${esc(areaText(cr.area, cr.areaUnit, 'ha'))}`:''}</div>
        </div>
        ${farmLogo(m, 'lg')}
      </div>
      <div class="prog-rule"></div>
      <div style="overflow-x:auto;">
        <table class="grid-table prog-table">
          <thead><tr>
            <th>Crop stage</th><th>Timing</th><th>Required fertilizer</th><th>Composition / type</th>
            <th>Dosage</th><th>Method</th><th>Pest / disease control</th><th>Pest UoM</th>
            <th>Fungicides</th><th>Fungicide UoM</th><th>Comment</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <div class="prog-foot">${esc(cr.crop)} — stage count: ${CROP_STAGES.length} &nbsp;|&nbsp; total fertilizer line items: ${fertCount}</div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        ${readOnly ? `
        <button class="btn small" onclick="exportProgrammeDocumentFor('${esc(readOnly.id)}', ${readOnly.crop})">Download this programme (looks like this page)</button>
        <button class="btn small ghost" onclick="exportProgrammeFor('${esc(readOnly.id)}', ${readOnly.crop})">Export as CSV (spreadsheet)</button>
        <button class="btn small ghost" onclick="window.print()">Print / save as PDF</button>
        ` : `
        <button class="btn small" onclick="exportProgrammeDocument(${state.calCrop})">Download this programme (looks like this page)</button>
        <button class="btn small ghost" onclick="exportProgramme(${state.calCrop})">Export as CSV (spreadsheet)</button>
        <button class="btn small ghost" onclick="exportAllProgrammes()">All crops (CSV)</button>
        <button class="btn small ghost" onclick="window.print()">Print / save as PDF</button>
        ${archiveButton('Crop calendar')}
        `}
      </div>
      ${readOnly ? '' : `<p class="helper" style="margin-top:6px;">The first download saves this programme exactly as it appears here — logo, stage colours and all — as a file you can open in any browser or print to PDF. The CSV is for spreadsheets, so it carries the data as columns without the layout.</p>`}
      ${readOnly ? '' : `<p class="helper" style="margin-top:10px;">Every row here comes from what you recorded above — use Edit on a row, or the stage tables, to change it. The comment on each stage is yours to edit too. The programme runs from the date you transplanted to your expected harvest date. Change either on the Profile tab — using Edit on the crop — and every stage window here moves with it.</p>`}
    </div>`;
}

function programmeRows(m, cr){
  const p = ensureProgramme(cr), timing = stageWindows(cr);
  const rows = [];
  CROP_STAGES.forEach(stage=>{
    const ferts = p[stage]['Fertilizers'] || [];
    const prot  = protectionLines(cr, stage);
    const fung  = fungicideLines(cr, stage);
    const prog  = stageProgress(cr, stage);
    const join  = list => list.map(x=> (x.done?'[applied] ':'') + x.text).join(' | ');
    const joinU = list => list.map(x=>x.uom).join(' | ');
    // Every row is built from the same column list, so a stage with nothing
    // recorded still lines up with the heading.
    const row = (over)=> Object.assign({
      farm:m.name, crop:cr.crop, variety:cr.variety||'', stage,
      dates:timing[stage].dates||'', timing:timing[stage].label||'',
      product:'', composition:'', dose:'', unit:'', method:'', applied:'', appliedOn:'',
      pest:'', pestUom:'', fung:'', fungUom:'', progress:'', comment:''
    }, over);
    const flat = r => [r.farm,r.crop,r.variety,r.stage,r.dates,r.timing,r.product,r.composition,
                       r.dose,r.unit,r.method,r.applied,r.appliedOn,r.pest,r.pestUom,
                       r.fung,r.fungUom,r.progress,r.comment];
    const summary = {
      pest: join(prot), pestUom: joinU(prot), fung: join(fung), fungUom: joinU(fung),
      progress: `${prog.done} of ${prog.total} applied${prog.complete?' \u2014 accomplished':''}`,
      comment: stageComment(cr, stage)
    };
    if(!ferts.length){
      rows.push(flat(row(summary)));
      return;
    }
    ferts.forEach((f,i)=>{
      rows.push(flat(row(Object.assign({
        product:f.product, composition:f.composition||'', dose:f.dose||'', unit:f.unit||'',
        method:f.method||'', applied:f.done?'Yes':'No', appliedOn:f.doneOn||''
      }, i===0 ? summary : {}))));
    });
  });
  return rows;
}
const PROGRAMME_HEADER = ['Farm','Crop','Variety','Crop stage','Dates','Timing','Required fertilizer','Composition / type','Dosage','Unit','Method','Applied','Applied on','Pest / disease control','Pest UoM','Fungicides','Fungicide UoM','Stage progress','Comment'];
/* ============================================================
   Download the programme as it appears on screen
   A CSV is a data file — it cannot carry the layout, the stage
   colours or the logo. This writes a self-contained HTML document
   instead: the same table, the same branding, opens in any browser
   and prints straight to PDF.
   ============================================================ */
function logoDataUrl(src){
  // Inlined so the saved file works with no network and no missing images.
  return new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        const cv = document.createElement('canvas');
        cv.width = img.naturalWidth; cv.height = img.naturalHeight;
        cv.getContext('2d').drawImage(img, 0, 0);
        resolve(cv.toDataURL('image/png'));
      }catch(e){ resolve(''); }         // tainted canvas on file:// — carry on without it
    };
    img.onerror = ()=> resolve('');
    img.src = src;
  });
}

function programmeDocumentBody(m, cr, logo, farmLogoUrl){
  const timing = stageWindows(cr);
  const p = ensureProgramme(cr);
  let fertCount = 0, body = '';
  CROP_STAGES.forEach(stage=>{
    const ferts = p[stage]['Fertilizers'] || [];
    const prot = protectionLines(cr, stage), fung = fungicideLines(cr, stage);
    const span = Math.max(ferts.length, 1);
    fertCount += ferts.length;
    const cell = list => list.length
      ? list.map(x=>`${x.done?'<span class="tick">\u2713</span> ':''}${esc(x.text)}`).join('<br>')
      : '<span class="muted">None recorded</span>';
    const uom = list => list.length ? list.map(x=>esc(x.uom)).join('<br>') : '\u2014';
    (ferts.length ? ferts : [null]).forEach((f,i)=>{
      body += `<tr class="${stage.toLowerCase()}${f && f.done ? ' applied' : ''}">`;
      if(i===0){
        body += `<td rowspan="${span}" class="stage">${esc(stage)}</td>`;
        body += `<td rowspan="${span}">${esc(timing[stage].dates||'\u2014')}<br><span class="week">${esc(timing[stage].label)}</span></td>`;
      }
      body += f
        ? `<td>${f.done?'<span class="tick">\u2713</span> ':''}${esc(f.product)}</td><td>${esc(f.composition||'\u2014')}</td>
           <td>${esc(f.dose||'\u2014')} ${esc(f.unit||'')}</td><td>${esc(f.method||'\u2014')}</td>`
        : `<td colspan="4" class="muted">No fertilizer recorded for this stage</td>`;
      if(i===0){
        body += `<td rowspan="${span}">${cell(prot)}</td><td rowspan="${span}">${uom(prot)}</td>`;
        body += `<td rowspan="${span}">${cell(fung)}</td><td rowspan="${span}">${uom(fung)}</td>`;
        body += `<td rowspan="${span}" class="comment">${esc(stageComment(cr, stage))}</td>`;
      }
      body += '</tr>';
    });
  });

  const tally = CROP_STAGES.map(stage=>{
    const pr = stageProgress(cr, stage);
    const status = !pr.total ? 'Nothing listed' : pr.complete ? 'Accomplished'
                 : pr.done ? 'In progress' : 'Not started';
    return `<div class="tally-row ${pr.complete?'done':''}"><b>${esc(stage)}</b>
      <span>${pr.done} of ${pr.total} applied &middot; ${status}</span></div>`;
  }).join('');

  return `<div class="sheet">
    <div class="head">
      ${logo ? `<img src="${logo}" alt="TIPFA">` : `<div class="title">TIPFA</div>`}
      <div style="flex:1;min-width:220px;">
        <div class="title">${esc(m.name).toUpperCase()} &mdash; FERTILIZER &amp; CROP PROTECTION PROGRAM, BY CROP STAGE</div>

        <div class="sub">Transplanted ${esc(cr.planted||'\u2014')} &middot; expected harvest ${esc(cr.expected||'\u2014')}</div>
      </div>
      ${farmLogoUrl ? `<img src="${farmLogoUrl}" alt="${esc(m.name)}" style="width:64px;height:64px;object-fit:contain;">` : ''}
    </div>
    <div class="rule"></div>
    <div class="scroll"><table>
      <thead><tr>
        <th>Crop stage</th><th>Timing</th><th>Required fertilizer</th><th>Composition / type</th>
        <th>Dosage</th><th>Method</th><th>Pest / disease control</th><th>Pest UoM</th>
        <th>Fungicides</th><th>Fungicide UoM</th><th>Comment</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <div class="foot">${esc(cr.crop)} &mdash; stage count: ${CROP_STAGES.length} &nbsp;|&nbsp; total fertilizer line items: ${fertCount}
      &nbsp;|&nbsp; generated ${todayStr()}</div>

}

async function exportProgrammeDocument(i){
  const m = MEMBERS[state.member], cr = m.crops[i];
  const logo = await logoDataUrl('assets/brand/tipfa-logo-primary.png');
  const farmSrc = farmLogoSrc(m);
  const farmUrl = farmSrc && farmSrc.indexOf('data:') === 0 ? farmSrc : await logoDataUrl(farmSrc);
  const doc = `<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>${esc(m.name)} — ${esc(cr.crop)} programme</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>${programmeDocumentCSS()}</style></head>
<body>${programmeDocumentBody(m, cr, logo, farmUrl)}</body></html>`;
  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${m.name.replace(/\s+/g,'_')}_${String(cr.crop).replace(/\s+/g,'_')}_programme.html`;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  logAction(`${m.name} downloaded the ${cr.crop} programme as a document.`);
}

  const m = MEMBERS[state.member];

      <p class="helper" style="margin-top:6px;">Baseline standard: <strong>HACCP</strong> — required for every crop. Covers the SOPs and prerequisite programs for the production area, including personal hygiene (toilets, foot baths) and other life-barrier controls.</p>

  c.innerHTML = `

    ${m.crops.length ? cards : '<div class="card"><p class="helper">No crops yet — add one from the Profile tab first.</p></div>'}
    ${m.crops.length ? `
    <div class="section-label">Add a market standard</div>
    <div class="card">
      <div class="grid2">
        <div><label class="f">Crop</label><select id="std-crop">${m.crops.map(cr=>`<option>${cr.crop}</option>`).join('')}</select></div>
        <div><label class="f">Standard</label><select id="std-name">${MARKET_STANDARD_OPTIONS.map(s=>`<option>${s}</option>`).join('')}</select></div>
      </div>
      <label class="f">Notes</label><input id="std-notes" placeholder="Certification status, target date, etc.">
      <button class="btn small" onclick="addMarketStandard()">+ Add standard</button>
      ${archiveButton('Market standards')}
    </div>` : ''}`;
}
function addMarketStandard(){
  const crop = document.getElementById('std-crop').value;
  const standard = document.getElementById('std-name').value;
  const notes = document.getElementById('std-notes').value.trim();
  MEMBERS[state.member].marketStandards.push({crop, standard, notes});
  logAction(`${MEMBERS[state.member].name} added ${standard} as a market standard for ${crop}.`);
  render();
}

const CHART_SERIES = ['#405E35','#E8A734','#7E9B3F','#2C4423','#A85C3F','#8C9A6B'];

function selectPriceCrop(crop){ state.priceCrop = crop; render(); }
function priceYears(m){
  const seen = {};
  [CURRENT_YEAR-1, CURRENT_YEAR, CURRENT_YEAR+1].forEach(y=> seen[y]=true);
  (m.marketPrices||[]).forEach(p=>{ if(p.year) seen[p.year]=true; });
  return Object.keys(seen).map(Number).sort((a,b)=>a-b);
}
// Average price per month for one crop in one year, and per week in a month.
function priceByMonth(m, crop, year){
  return MONTHS.map((_, mi)=>{
    const hits = (m.marketPrices||[]).filter(p=>p.crop===crop && Number(p.year)===year && Number(p.month)===mi+1 && p.price>0);
    return hits.length ? Math.round(hits.reduce((t,p)=>t+Number(p.price),0)/hits.length) : null;
  });
}
function priceByWeek(m, crop, year, month){
  return [1,2,3,4].map(w=>{
    const hits = (m.marketPrices||[]).filter(p=>p.crop===crop && Number(p.year)===year
                  && Number(p.month)===month && Number(p.week)===w && p.price>0);
    return hits.length ? Math.round(hits.reduce((t,p)=>t+Number(p.price),0)/hits.length) : null;
  });
}

// The full year for one crop kind: every month, every crop, with totals.
function yearTable(id, kind, year){
  const crops = memberCrops(id);
  if(!crops.length) return '';
  const monthTotals = [], cropTotals = {};
  crops.forEach(cr=> cropTotals[cr] = 0);
  const body = MONTHS.map((name, mi)=>{
    const month = mi + 1;
    let rowTotal = 0;
    const cells = crops.map(cr=>{
      const v = memberMonthCropTotal(id, kind, year, month, cr);
      rowTotal += v; cropTotals[cr] += v;
      return `<td>${v ? fmt(v) : '<span style="color:var(--muted);">—</span>'}</td>`;
    }).join('');
    monthTotals.push(rowTotal);
    return `<tr class="${month===state.selMonth?'row-done':''}"><td>${name}</td>${cells}<td><strong>${rowTotal?fmt(rowTotal):'—'}</strong></td></tr>`;
  }).join('');
  const grand = monthTotals.reduce((t,x)=>t+x,0);
  return `<table class="grid-table">
    <thead><tr><th>Month</th>${crops.map(cr=>`<th>${esc(cr)} (kg)</th>`).join('')}<th>Total (kg)</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td><strong>Year total</strong></td>${crops.map(cr=>`<td><strong>${cropTotals[cr]?fmt(cropTotals[cr]):'—'}</strong></td>`).join('')}
      <td><strong>${grand?fmt(grand):'—'}</strong></td></tr></tfoot>
  </table>`;
}
function exportYearTable(kind){
  const id = state.member, year = state.selYear, m = MEMBERS[id];
  const crops = memberCrops(id);
  const rows = [['Month'].concat(crops).concat(['Total (kg)'])];
  const cropTotals = {}; crops.forEach(cr=> cropTotals[cr]=0);
  let grand = 0;
  MONTHS.forEach((name, mi)=>{
    let rowTotal = 0;
    const cells = crops.map(cr=>{
      const v = memberMonthCropTotal(id, kind, year, mi+1, cr);
      rowTotal += v; cropTotals[cr] += v; return v;
    });
    grand += rowTotal;
    rows.push([name].concat(cells).concat([rowTotal]));
  });
  rows.push(['Year total'].concat(crops.map(cr=>cropTotals[cr])).concat([grand]));
  downloadCSV(`${m.name.replace(/\s+/g,'_')}_${kind==='plan'?'harvest_plan':'actual_harvest'}_${year}.csv`, rows);
  logAction(`${m.name} downloaded the ${year} ${kind==='plan'?'harvest plan':'actual harvest'} table.`);
}

/* ============================================================
   Archives
   Any section can be archived: a timestamped snapshot of what that
   section held at the moment it was taken, kept on the farm's record
   and reviewable from the Archive tab. Archiving never removes live
   data — it files a copy.
   ============================================================ */
function farmArchives(m){ if(!Array.isArray(m.archives)) m.archives = []; return m.archives; }

// Build the table a section archives, as headings plus rows.
function sectionSnapshot(id, section){
  const m = MEMBERS[id], year = state.selYear;
  if(section === 'Harvest plan' || section === 'Actual harvest'){
    const kind = section === 'Harvest plan' ? 'plan' : 'actual';
    const crops = memberCrops(id);
    const head = ['Month'].concat(crops).concat(['Total (kg)']);
    const rows = MONTHS.map((name, mi)=>{
      const cells = crops.map(cr=> memberMonthCropTotal(id, kind, year, mi+1, cr));
      return [name].concat(cells).concat([cells.reduce((t,x)=>t+x,0)]);
    });
    return {head, rows, note:`${section} for ${year}`};
  }
  if(section === 'Market prices'){
    const head = ['Crop','Buyer','Price (TZS/kg)','Year','Month','Week','Date'];
    const rows = (m.marketPrices||[]).map(p=>[p.crop, p.buyer, p.price, p.year||'', p.month?MONTHS[p.month-1]:'', p.week||'', p.date||'']);
    return {head, rows, note:'All buyer prices logged to date'};
  }
  if(section === 'Inputs'){
    const head = ['Crop','Stage','Category','Product','Composition / target','Dosage','Unit','Method','Applied','Applied on'];
    const rows = [];
    (m.crops||[]).forEach(cr=>{ ensureProgramme(cr);
      CROP_STAGES.forEach(st=> stageItems(cr, st).forEach(x=>
        rows.push([cr.crop, st, x.cat, x.entry.product, x.entry.target||x.entry.composition||'',
                   x.entry.dose||'', x.entry.unit||'', x.entry.method||'',
                   x.entry.done?'Yes':'No', x.entry.doneOn||''])));
    });
    return {head, rows, note:'Every input recorded across the crop calendar'};
  }
  if(section === 'Crop calendar'){
    const rows = [];
    (m.crops||[]).forEach(cr=> programmeRows(m, cr).forEach(r=> rows.push(r)));
    return {head:PROGRAMME_HEADER, rows, note:'Full crop programme for every crop'};
  }
  if(section === 'Crop profile'){
    const head = ['Crop','Variety','Seed company','Area','Transplanted','Expected harvest','Stage'];
    const rows = (m.crops||[]).map(cr=>[cr.crop, cr.variety||'', cr.seedCompany||'',
      areaText(cr.area, cr.areaUnit, 'ha'), cr.planted||'', cr.expected||'', cr.stage||'']);
    return {head, rows, note:'Crop profile as recorded'};
  }
  if(section === 'Market standards'){
    const head = ['Crop','Standard','Notes'];
    return {head, rows:(m.marketStandards||[]).map(x=>[x.crop, x.standard, x.notes||'']), note:'Standards beyond the HACCP baseline'};
  }
  if(section === 'Future planning'){
    const head = ['Item','Value'];
    const rows = INVEST_CATEGORIES.map(cat=>[`Investment — ${cat} (monthly)`, (m.investments&&m.investments.monthly[cat])||0]);
    [1,2,3].forEach(y=> rows.push([`Year ${y} plan`, (m.futurePlan&&m.futurePlan['year'+y])||'']));
    return {head, rows, note:'Investment figures and the three-year outlook'};
  }
  return {head:['Item'], rows:[], note:''};
}

function archiveSection(section){
  const id = state.member, m = MEMBERS[id];
  const snap = sectionSnapshot(id, section);
  if(!snap.rows.length){
    alert(`There is nothing recorded in ${section} to archive yet.`);
    return;
  }
  farmArchives(m).unshift({
    ref: 'AR' + Date.now().toString(36).toUpperCase(),
    section,
    note: snap.note,
    takenOn: todayStr(),
    takenAt: new Date().toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short',year:'numeric'}),
    head: snap.head,
    rows: snap.rows
  });
  logAction(`${m.name} archived ${section}${snap.note?` (${snap.note})`:''}.`);
  state.archiveMsg = `${section} archived. Review it any time on the Archive tab.`;
  render();
}
function deleteArchive(ref){
  const m = MEMBERS[state.member];
  const list = farmArchives(m);
  const i = list.findIndex(a=>a.ref===ref);
  if(i === -1) return;
  const removed = list.splice(i,1)[0];
  logAction(`${m.name} deleted the archived ${removed.section} from ${removed.takenAt}.`);
  render();
}
function downloadArchive(ref){
  const m = MEMBERS[state.member];
  const a = farmArchives(m).find(x=>x.ref===ref);
  if(!a) return;
  downloadCSV(`${m.name.replace(/\s+/g,'_')}_${a.section.replace(/\s+/g,'_')}_${a.takenOn}.csv`,
              [a.head].concat(a.rows));
  logAction(`${m.name} downloaded the archived ${a.section} from ${a.takenAt}.`);
}
function toggleArchive(ref){ state.openArchive = state.openArchive===ref ? null : ref; render(); }

// The button every section carries.

        </div>`).join('')}`
    : emptyState('Nothing archived yet',

}
function setArchiveFilter(f){ state.archiveFilter = f; state.openArchive = null; render(); }

/* ============================================================
   Generating a harvest plan
   A farm has already said, per crop: which variety, how many
   seedlings, when it transplanted and when it expects to harvest.
   That is everything needed. The catalogue supplies what one plant
   yields in each week of its season; the season is as long as the
   farm's own two dates make it; the seedling count scales it.
   Nothing is invented here that the farm has not already entered.
   ============================================================ */
// The platform files harvests by year, month and one of four weeks in it.
function slotFor(date){
  const d = new Date(date);
  if(isNaN(d)) return null;
  return { year:d.getFullYear(), month:d.getMonth()+1,
           week: Math.min(4, Math.max(1, Math.ceil(d.getDate()/7))) };
}

/* The plan is the same projection the crop profile shows, placed on the
   calendar. It is read from yieldFor so the two can never disagree — a plan
   that differed from the yield the farm was shown would be worse than none.
   Real dates are what the plan adds: a projection with no dates has nothing
   to file it under. */
function plannedWeeks(cr){
  const y = yieldFor(cr);
  return (y.ok && y.dated) ? y.rows : [];
}

// Every crop that has enough entered to be planned, and what stops the rest.
function plannableCrops(m){
  return (m.crops||[]).map(cr=>{
    const y = yieldFor(cr);
    const rows = (y.ok && y.dated) ? y.rows : [];
    let why = '';
    if(!y.ok) why = yieldBlockedReason(cr);
    else if(!y.dated) why = 'transplanting or expected harvest date missing';
    else if(!rows.length) why = 'the dates leave no bearing weeks';
    return { cr, rows, why, total: rows.reduce((a,b)=>a+b.kg, 0) };
  });
}

/* The projection laid out on the calendar, without writing anything.
   A farm should be able to see what its seedlings come to as soon as it
   enters them, rather than having to commit them to the plan first.
   Keyed the way the plan itself is: year, month, one of four weeks. */
function projectedYear(id, year){
  const m = MEMBERS[id];
  if(!m) return {};
  const out = {};
  (m.crops||[]).forEach(cr=>{
    const y = yieldFor(cr);
    if(!y.ok || !y.dated) return;
    y.rows.forEach(r=>{
      const slot = slotFor(r.date);
      if(!slot || slot.year !== year) return;
      out[slot.month] = out[slot.month] || {};
      out[slot.month][slot.week] = out[slot.month][slot.week] || {};
      const cell = out[slot.month][slot.week];
      cell[cr.crop] = (cell[cr.crop] || 0) + r.kg;
    });
  });
  return out;
}
function projectedWeek(id, year, month, week, crop){
  const y = projectedYear(id, year);
  const cell = y[month] && y[month][week];
  return cell ? (cell[crop] || 0) : 0;
}
function projectedMonthCrop(id, year, month, crop){
  const y = projectedYear(id, year);
  let sum = 0;
  Object.keys(y[month] || {}).forEach(w=>{ sum += (y[month][w][crop] || 0); });
  return sum;
}

/* The projection as its own year table, shown whether or not it has been
   written into the plan, so the figures are visible the moment the crop
   profile has enough in it. */
function projectionTable(id, year){
  const crops = memberCrops(id);
  const proj = projectedYear(id, year);
  const cropTotals = {}; crops.forEach(c=> cropTotals[c] = 0);
  let any = false;
  const body = MONTHS.map((name, mi)=>{
    const month = mi + 1;
    let rowTotal = 0;
    const cells = crops.map(cr=>{
      let v = 0;
      Object.keys(proj[month] || {}).forEach(w=>{ v += (proj[month][w][cr] || 0); });
      v = Math.round(v);
      if(v){ any = true; rowTotal += v; cropTotals[cr] += v; }
      return `<td>${v ? fmt(v) : '<span style="color:var(--muted);">—</span>'}</td>`;
    }).join('');
    return `<tr class="${month===state.selMonth?'row-done':''}"><td>${name}</td>${cells}<td><strong>${rowTotal?fmt(rowTotal):'—'}</strong></td></tr>`;
  }).join('');
  if(!any) return '';
  const grand = crops.reduce((t,c)=> t + cropTotals[c], 0);
  return `<table class="grid-table">
    <thead><tr><th>Month</th>${crops.map(cr=>`<th>${esc(cr)} (kg)</th>`).join('')}<th>Total (kg)</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td><strong>Year total</strong></td>${crops.map(cr=>`<td><strong>${cropTotals[cr]?fmt(cropTotals[cr]):'—'}</strong></td>`).join('')}
      <td><strong>${grand?fmt(grand):'—'}</strong></td></tr></tfoot>
  </table>`;
}

/* Write the generated figures into the plan. Only the weeks the plan
   covers are touched, so an entry made by hand outside them survives. */
function generateHarvestPlan(){
  const id = state.member, m = MEMBERS[id];
  const plans = plannableCrops(m).filter(p=> p.rows.length);
  if(!plans.length){
    state.planGenMsg = 'Nothing to generate yet. A crop needs a catalogue variety, a number of seedlings, and both of its dates.';
    render(); return;
  }
  // Set each week to the projection rather than adding to what is there.
  // Adding would double the plan the second time this is pressed, and would
  // double a week already taken with "Use it".
  let cells = 0;
  const years = {};
  plans.forEach(p=> p.rows.forEach(r=>{
    const slot = slotFor(r.date);
    if(!slot) return;
    const key = `${slot.year}|${slot.month}|${slot.week}`;
    years[key] = years[key] || {};
    years[key][p.cr.crop] = (years[key][p.cr.crop] || 0) + r.kg;
  }));
  Object.keys(years).forEach(key=>{
    const [year, month, week] = key.split('|').map(Number);
    const wk = harvestWeek(id, 'plan', year, month, week);
    if(!wk) return;
    Object.keys(years[key]).forEach(crop=>{
      wk[crop] = Math.round(years[key][crop] * 10) / 10;
      cells++;
    });
  });
  const names = plans.map(p=> p.cr.crop);
  logAction(`${m.name} generated a harvest plan from the crop profile for ${names.join(', ')}.`);
  state.planGenMsg = `Planned ${fmt(cells)} week${cells===1?'':'s'} across ${plans.length} crop${plans.length===1?'':'s'}, from the catalogue and your seedling counts.`;
  render();
}

function clearGeneratedPlan(){
  const id = state.member, m = MEMBERS[id];
  const plans = plannableCrops(m).filter(p=> p.rows.length);
  plans.forEach(p=> p.rows.forEach(r=>{
    const slot = slotFor(r.date);
    if(!slot) return;
    const wk = harvestWeek(id, 'plan', slot.year, slot.month, slot.week);
    if(wk) delete wk[p.cr.crop];
  }));
  logAction(`${m.name} cleared the generated harvest plan.`);
  state.planGenMsg = 'The generated weeks have been cleared. Anything you typed in yourself outside them is untouched.';
  render();
}

/* The workings, shown rather than hidden: what each crop contributes and,
   where one cannot be planned, exactly what is missing from it. */
function harvestPlanSource(m){
  const rows = plannableCrops(m);
  if(!rows.length) return '';
  return `
    <div class="section-label">Where these figures come from</div>
    <div class="card">
      <p class="helper" style="margin:0 0 10px;">The Secretariat's catalogue holds what one plant of each variety yields week by week. Multiplied by your seedlings and laid across your own transplanting and harvest dates, that is your plan.</p>
      <table class="grid-table"><thead><tr><th>Crop</th><th>Variety</th><th>Seedlings</th><th>Bearing weeks</th><th>Per plant</th><th>Expected total</th></tr></thead>
      <tbody>${rows.map(r=>{
        const v = catalogueVariety(r.cr.crop, r.cr.variety);
        const perPlant = r.rows.length && Number(r.cr.seedlings) ? r.total / Number(r.cr.seedlings) : 0;
        return `<tr>
          <td>${esc(r.cr.crop)}</td>
          <td>${esc(r.cr.variety||'—')}${v ? '' : ' <span class="helper">(not in the catalogue)</span>'}</td>
          <td>${r.cr.seedlings ? fmt(r.cr.seedlings) : '—'}</td>
          <td>${r.rows.length ? `${r.rows.length} · ${YIELD_PATTERNS[v.pattern] ? YIELD_PATTERNS[v.pattern].label : ''}` : `<span style="color:var(--red);">${esc(r.why)}</span>`}</td>
          <td>${perPlant ? perPlant.toFixed(2)+' kg' : '—'}</td>
          <td><strong>${r.total ? fmt(Math.round(r.total))+' kg' : '—'}</strong></td>
        </tr>`;
      }).join('')}</tbody></table>
    </div>`;
}

/* What the seedlings come to, month by month, shown without being asked
   for. Writing it into the plan stays a deliberate act — a farm may have
   typed its own figures — but seeing it does not. */
function projectionSection(id, year){
  const table = projectionTable(id, year);
  const m = MEMBERS[id];
  const waiting = (m.crops||[]).filter(cr=>{
    const y = yieldFor(cr);
    return !(y.ok && y.dated);
  });
  if(!table){
    return `
      <div class="section-label">What your seedlings come to</div>
      <div class="card">
        <p class="helper" style="margin:0;">Nothing to work out yet. A crop needs a variety from the Secretariat catalogue, the number of seedlings you planted, and both of its dates${waiting.length?` — ${esc(waiting.map(cr=>cr.crop).join(', '))} ${waiting.length===1?'is':'are'} still missing something.`:'.'}</p>
      </div>`;
  }
  return `
    <div class="section-label">What your seedlings come to — ${year}</div>
    <div class="card" style="overflow-x:auto;">
      <p class="helper" style="margin:0 0 10px;">Worked out from the variety you chose and the seedlings you planted, laid out on your own transplanting dates. This is a projection — nothing here is written into your plan until you say so.</p>
      ${table}
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn" onclick="generateHarvestPlan()">Copy these figures into my plan</button>
        <button class="btn small ghost" onclick="clearGeneratedPlan()">Clear them from the plan again</button>
        <button class="btn small ghost" onclick="exportProjection()">Download this table (CSV)</button>
      </div>
      ${state.planGenMsg ? `<p class="helper" style="margin-top:10px;color:var(--deep-green);">${CHECK_ICON} ${esc(state.planGenMsg)}</p>` : ''}
      ${(state.planGenMsg = '') || ''}
      ${waiting.length ? `<p class="helper" style="margin-top:8px;">Not counted here: ${esc(waiting.map(cr=>cr.crop).join(', '))} — see Expected yield on your Profile tab for what each is waiting for.</p>` : ''}
    </div>`;
}

// One week's projected figure, put into the plan where it is being typed.
function useProjection(month, week, crop){
  const id = state.member, year = state.selYear;
  const kg = Math.round(projectedWeek(id, year, month, week, crop));
  const wk = harvestWeek(id, 'plan', year, month, week);
  if(!wk) return;
  wk[crop] = kg;
  logAction(`${MEMBERS[id].name} planned ${kg} kg of ${crop} for week ${week} of ${MONTHS[month-1]} ${year} from the seedling projection.`);
  render();
}

function exportProjection(){
  const id = state.member, year = state.selYear, m = MEMBERS[id];
  const crops = memberCrops(id);
  const rows = [['Month', ...crops.map(c=>c+' (kg)'), 'Total (kg)']];
  const proj = projectedYear(id, year);
  MONTHS.forEach((name, mi)=>{
    const month = mi + 1;
    let total = 0;
    const cells = crops.map(cr=>{
      let v = 0;
      Object.keys(proj[month]||{}).forEach(w=>{ v += (proj[month][w][cr]||0); });
      v = Math.round(v); total += v;
      return v || '';
    });
    rows.push([name, ...cells, total || '']);
  });
  downloadCSV(`${m.name.replace(/\W+/g,'-').toLowerCase()}-projected-harvest-${year}.csv`, rows);
}

function renderHarvestForm(c, kind){
  const m = MEMBERS[state.member];

  const id = state.member, month = state.selMonth, week = state.selWeek;
  const year = state.selYear;
  const weekData = harvestWeek(id, kind, year, month, week) || {};
  const monthTotal = memberMonthTotal(id, kind, year, month);
  const crops = memberCrops(id);
  c.innerHTML = `
    <h1 class="page-title">${label}</h1>
    <p class="page-sub">${esc(m.name)} · click a month, then a week, and fill in kilograms for each of your crops</p>
    ${crops.length ? `
    ${yearChips()}
    ${monthWeekChips()}
    <div class="card">
      <table class="grid-table"><thead><tr><th>Crop</th><th style="width:160px;">${MONTHS[month-1]} ${year}, Week ${week} (kg)</th>${kind==='plan'?'<th style="width:200px;">From your seedlings</th>':''}</tr></thead>
      <tbody>${crops.map(crop=>{
        const expect = kind==='plan' ? Math.round(projectedWeek(id, year, month, week, crop)) : 0;
        return `<tr><td>${esc(crop)}</td>
        <td><input type="number" value="${weekData[crop]||0}" data-crop="${esc(crop)}" onchange="setHarvest('${kind}', ${month}, ${week}, this.dataset.crop, this.value)"></td>
        ${kind==='plan' ? `<td>${expect
            ? `<strong>${fmt(expect)} kg</strong>${Number(weekData[crop]||0) !== expect ? ` <button class="btn small ghost" onclick="useProjection(${month}, ${week}, '${esc(crop).replace(/'/g,"\\'")}')">Use it</button>` : ''}`
            : '<span style="color:var(--muted);">nothing due this week</span>'}</td>` : ''}</tr>`;
      }).join('')}</tbody></table>
      <div style="margin-top:12px;"><button class="btn" onclick="saveHarvest('${kind}')">Save week ${week}</button>
        <span class="helper" id="save-msg" style="margin-left:10px;">${state.harvestSaved ? `<span class="added-flash">${CHECK_ICON} Saved — the year table below is updated</span>` : ''}</span></div>
      ${(state.harvestSaved = false) || ''}
      <p class="helper" style="margin-top:10px;">${MONTHS[month-1]} ${year} total so far (all 4 weeks): <strong>${fmt(monthTotal)} kg</strong></p>
    </div>
    ${kind==='plan' ? projectionSection(id, year) : ''}
    <div class="section-label">${label} for ${year} — full year</div>
