<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members Portal | TIPFA, Tanzania Indoor &amp; Professional Farmers Association</title>
  <meta name="description" content="The TIPFA Members Portal: member farms plan their plantings on the shared crop calendar, from nursery to harvest, and the secretariat sees every farm's calendar.">
  <meta name="theme-color" content="#405E35">
  <link rel="canonical" href="https://fairmarketingsolutions3-wq.github.io/website/members-portal/">
  <link rel="icon" type="image/png" href="../assets/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    // Light or dark, as chosen on this device, before the first paint.
    try { if (localStorage.getItem('tipfa-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
</head>
<body class="page-portal">
  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- Navigation: the website's own, from index.html -->
  <header class="nav" id="nav">
    <div class="container">
      <a href="../#top" class="nav-logo" aria-label="TIPFA home">
        <img src="../assets/logo/tipfa-logo-mark-wordmark.png" alt="TIPFA, Tanzania Indoor and Professional Farmers Association">
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-links" id="navLinks">
          <li><a href="../#why">Why TIPFA</a></li>
          <li><a href="../#produce">Produce</a></li>
          <li><a href="../#farms">Farms</a></li>
          <li><a href="../#standards">Standards</a></li>
          <li><a href="../#concept">The concept</a></li>
          <li><a href="../#markets">Markets</a></li>
          <li><a href="../#membership">Membership</a></li>
          <li><a href="../#contact">Contact</a></li>
          <li class="nav-portal-item"><a href="./" aria-current="page">Members Portal</a></li>
        </ul>
      </nav>
      <div class="btn-cta-wrap">
        <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Dark mode" title="Dark mode"><svg class="ti-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></button>
        <a href="./" aria-current="page" class="btn btn-portal" data-magnetic><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Members Portal</a>
        <a href="../#contact" class="btn btn-primary" data-magnetic>Start a conversation</a>
      </div>
      <button type="button" class="theme-toggle theme-toggle--menu" aria-pressed="false" aria-label="Dark mode" title="Dark mode"><svg class="ti-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></button>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <h1 class="visually-hidden">TIPFA Members Portal</h1>
    <section class="portal-stage" aria-label="Crop calendar">
      <iframe class="portal-frame" id="portalFrame" src="app/" title="TIPFA Members Portal: the crop calendar"
              allow="fullscreen; clipboard-write" allowfullscreen></iframe>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script>
    // The calendar fills the screen below the website's header.
    (function () {
      var root = document.documentElement;
      var frame = document.getElementById('portalFrame'), away = false;
      function fit() {
        var nav = document.getElementById('nav');
        var h = away ? 0 : (nav ? nav.offsetHeight : 64);
        root.style.setProperty('--navh', h + 'px');
        // Below the header and the orange rule under it.
        frame.style.height = Math.max(420, window.innerHeight - h - (away ? 0 : 3)) + 'px';
      }
      // On a phone the website's header steps aside while the calendar is
      // scrolled down, and comes back as soon as it is scrolled up.
      function navAway(a) {
        if (a === away) return;
        away = a; document.body.classList.toggle('nav-away', a); fit();
      }
      frame.addEventListener('load', function () {
        var w, last = 0;
        try { w = frame.contentWindow; w.addEventListener('scroll', function () {
          var y = w.scrollY;
          if (window.innerWidth > 900) { navAway(false); last = y; return; }
          if (y > last + 6 && y > 80) navAway(true);
          else if (y < last - 6 || y < 40) navAway(false);
          last = y;
        }, { passive: true }); } catch (e) {}
      });
      // Light or dark: the page and the system inside it change together.
      function setTheme(t) {
        if (t === 'dark') root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
        try { localStorage.setItem('tipfa-theme', t); } catch (e) {}
        try { var w = document.getElementById('portalFrame').contentWindow; if (w && w.tipfaTheme) w.tipfaTheme(t); } catch (e) {}
        showTheme();
      }
      function showTheme() {
        var dark = root.getAttribute('data-theme') === 'dark';
        document.querySelectorAll('.theme-toggle').forEach(function (b) {
          b.setAttribute('aria-pressed', dark ? 'true' : 'false');
          b.title = dark ? 'Light mode' : 'Dark mode';
          b.setAttribute('aria-label', b.title);
        });
      }
      document.querySelectorAll('.theme-toggle').forEach(function (b) {
        b.addEventListener('click', function () { setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });
      });
      showTheme();
      window.addEventListener('resize', fit);
      window.addEventListener('load', fit);
      fit();
    })();
  </script>
</body>
</html>
